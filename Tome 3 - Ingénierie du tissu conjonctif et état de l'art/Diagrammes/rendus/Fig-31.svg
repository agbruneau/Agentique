<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:948px;height:888px;background:#FFFFFF;" width="948px" height="888px" viewBox="0 0 948 888" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="199.876" y="25.107" fill="#000" font-size="14" textLength="541.44" font-weight="700" font-family="'Segoe UI'">Positionnement Architectural des Runtimes d'Exécution Durable Agentique (2027)</text><text x="79.752" y="43.729" fill="#000" font-size="14" textLength="781.689" font-weight="700" font-family="'Segoe UI'">Arbitrage entre portabilité multi-cloud, latence de transition par étape, horizon temporel et intégration écosystémique</text></g><!--entity AxisTop--><g class="entity" data-qualified-name="AxisTop" id="ent0001" data-source-line="9"><rect x="245.5" y="65.242" width="448.579" height="38.621" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="5" ry="5"/><text x="255.5" y="90.35" fill="#000" font-size="14" textLength="428.579" font-weight="700" font-family="'Segoe UI'">PORTABILITÉ OUVERTE &amp; NEUTRALITÉ MULTI-CLOUD / SUR SITE</text></g><!--entity Restate--><g class="entity" data-qualified-name="Restate" id="ent0002" data-source-line="11"><rect x="7" y="164.242" width="446.05" height="158.348" fill="#FFF" style="stroke:#15803D;stroke-width:0.5;" rx="5" ry="5"/><text x="17" y="189.35" fill="#000" font-size="14" textLength="306.694" font-weight="700" font-family="'Segoe UI'">Restate (Moteur Rust • Journal Bifrost intégré)</text><line x1="8" y1="192.863" x2="452.05" y2="192.863" style="stroke:#15803D;stroke-width:1;"/><text x="17" y="211.971" fill="#000" font-size="14" textLength="383.113" font-family="'Segoe UI'">• Primitives : Services RPC, Virtual Objects (clé K/V), Workflows</text><text x="17" y="230.592" fill="#000" font-size="14" textLength="374.664" font-family="'Segoe UI'">• Modèle d'exécution : Push HTTP/2 vers conteneurs ou FaaS</text><text x="17" y="249.213" fill="#000" font-size="14" textLength="315.943" font-family="'Segoe UI'">• Latence par étape journalisée (ctx.run) : ~1 à 5 ms</text><text x="17" y="267.834" fill="#000" font-size="14" textLength="380.276" font-family="'Segoe UI'">• Force : Déploiement binaire unique, Awakeables ultra-légers</text><text x="17" y="286.455" fill="#000" font-size="14" textLength="426.05" font-weight="700" font-family="'Segoe UI'">Idéal : Micro-orchestration A2A/MCP, agents sans serveur, T2-T3</text><text x="17" y="305.076" fill="#000" font-size="14" textLength="283.732" font-family="'Segoe UI'">SDK : TypeScript, Python, Go, Java/Kotlin, Rust</text></g><!--entity Temporal--><g class="entity" data-qualified-name="Temporal" id="ent0003" data-source-line="22"><rect x="488" y="164.242" width="446.193" height="158.348" fill="#FFF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="498" y="189.35" fill="#000" font-size="14" textLength="280.622" font-weight="700" font-family="'Segoe UI'">Temporal + Temporal Nexus (Licence MIT)</text><line x1="489" y1="192.863" x2="933.193" y2="192.863" style="stroke:#2563EB;stroke-width:1;"/><text x="498" y="211.971" fill="#000" font-size="14" textLength="369.612" font-family="'Segoe UI'">• Primitives : Workflows, Activities, Signals, Queries, Updates</text><text x="498" y="230.592" fill="#000" font-size="14" textLength="388.91" font-family="'Segoe UI'">• Modèle d'exécution : Workers en Pull sur Task Queues isolées</text><text x="498" y="249.213" fill="#000" font-size="14" textLength="377.788" font-family="'Segoe UI'">• Fédération inter-divisions : Contrats RPC durables via Nexus</text><text x="498" y="267.834" fill="#000" font-size="14" textLength="383.961" font-family="'Segoe UI'">• Force : Résilience multi-régions, Versioning, Codec AES-GCM</text><text x="498" y="286.455" fill="#000" font-size="14" textLength="426.193" font-weight="700" font-family="'Segoe UI'">Idéal : Sagas critiques multi-semaines, banque/assurance (T3-T4)</text><text x="498" y="305.076" fill="#000" font-size="14" textLength="275.939" font-family="'Segoe UI'">SDK : TypeScript, Python, Go, Java, .NET, PHP</text></g><!--entity MidL--><g class="entity" data-qualified-name="MidL" id="ent0004" data-source-line="33"><rect x="87.5" y="382.242" width="314.793" height="38.621" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;" rx="5" ry="5"/><text x="97.5" y="407.35" fill="#000" font-size="14" textLength="294.793" font-weight="700" font-family="'Segoe UI'">HAUTE FRÉQUENCE &amp; LATENCE MS (T2 / T3)</text></g><!--entity MidR--><g class="entity" data-qualified-name="MidR" id="ent0005" data-source-line="34"><rect x="523.5" y="382.242" width="345.145" height="38.621" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;" rx="5" ry="5"/><text x="533.5" y="407.35" fill="#000" font-size="14" textLength="325.145" font-weight="700" font-family="'Segoe UI'">SAGAS LONGUES &amp; SESSIONS LOURDES (T3 / T4)</text></g><!--entity MSFT--><g class="entity" data-qualified-name="MSFT" id="ent0006" data-source-line="36"><rect x="43" y="481.242" width="404.077" height="158.348" fill="#FFF" style="stroke:#1E293B;stroke-width:0.5;" rx="5" ry="5"/><text x="53" y="506.35" fill="#000" font-size="14" textLength="285.305" font-weight="700" font-family="'Segoe UI'">Microsoft Agent Framework (Durable Task)</text><line x1="44" y1="509.863" x2="446.077" y2="509.863" style="stroke:#1E293B;stroke-width:1;"/><text x="53" y="528.971" fill="#000" font-size="14" textLength="372.012" font-family="'Segoe UI'">• Convergence officielle : AutoGen + Semantic Kernel unifiés</text><text x="53" y="547.592" fill="#000" font-size="14" textLength="384.077" font-family="'Segoe UI'">• Moteur sous-jacent : Durable Task Framework / Azure / Dapr</text><text x="53" y="566.213" fill="#000" font-size="14" textLength="382.143" font-family="'Segoe UI'">• État : Déshydratation native des Agent Threads &amp; Workflows</text><text x="53" y="584.834" fill="#000" font-size="14" textLength="356.713" font-family="'Segoe UI'">• Force : Identité Entra ID OBO native, pont Copilot Studio</text><text x="53" y="603.455" fill="#000" font-size="14" textLength="362.831" font-weight="700" font-family="'Segoe UI'">Idéal : Entreprises standardisées Azure / .NET &amp; Python</text><text x="53" y="622.076" fill="#000" font-size="14" textLength="380.823" font-family="'Segoe UI'">Portabilité : Haute sur Azure Functions, moyenne via Dapr K8s</text></g><!--entity AWS--><g class="entity" data-qualified-name="AWS" id="ent0007" data-source-line="47"><rect x="482" y="481.242" width="427.579" height="158.348" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="5" ry="5"/><text x="492" y="506.35" fill="#000" font-size="14" textLength="291.724" font-weight="700" font-family="'Segoe UI'">Amazon Bedrock AgentCore (Runtime AWS)</text><line x1="483" y1="509.863" x2="908.579" y2="509.863" style="stroke:#9A3412;stroke-width:1;"/><text x="492" y="528.971" fill="#000" font-size="14" textLength="390.783" font-family="'Segoe UI'">• Architecture : Sessions microVM isolées à longue durée de vie</text><text x="492" y="547.592" fill="#000" font-size="14" textLength="407.579" font-family="'Segoe UI'">• Composants intégrés : Runtime, Gateway MCP, Memory, Identity</text><text x="492" y="566.213" fill="#000" font-size="14" textLength="387.064" font-family="'Segoe UI'">• Agnostique au cadriciel : Exécute LangGraph, CrewAI, Strands</text><text x="492" y="584.834" fill="#000" font-size="14" textLength="358.948" font-family="'Segoe UI'">• Force : Isolation matérielle + couplage Step Functions T4</text><text x="492" y="603.455" fill="#000" font-size="14" textLength="397.052" font-weight="700" font-family="'Segoe UI'">Idéal : Charges AWS intensives avec bac à sable code intégré</text><text x="492" y="622.076" fill="#000" font-size="14" textLength="385.205" font-family="'Segoe UI'">Portabilité : Faible hors AWS (adhérence plan de contrôle IAM)</text></g><!--entity AxisBot--><g class="entity" data-qualified-name="AxisBot" id="ent0008" data-source-line="58"><rect x="239.5" y="699.242" width="460.932" height="38.621" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="5" ry="5"/><text x="249.5" y="724.35" fill="#000" font-size="14" textLength="440.932" font-weight="700" font-family="'Segoe UI'">INTÉGRATION NATIVE ÉCOSYSTÈME HYPERSCALER (CLÉ EN MAIN)</text></g><!--entity Urbanisation--><g class="entity" data-qualified-name="Urbanisation" id="ent0009" data-source-line="60"><rect x="8" y="798.242" width="924.196" height="75.863" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="18" y="823.35" fill="#000" font-size="14" textLength="504.479" font-weight="700" font-family="'Segoe UI'">Patron d'urbanisation recommandé (Architecture Bi-Vitesse Groupe Boréal) :</text><text x="18" y="841.971" fill="#000" font-size="14" textLength="900.901" font-family="'Segoe UI'">• Couche Macro-Sagas (T3/T4, 1 h à 90 j) : Temporal + Nexus pour la gouvernance inter-divisions, le versionnage long et la piste d'audit BSIF E-23.</text><text x="18" y="860.592" fill="#000" font-size="14" textLength="904.196" font-family="'Segoe UI'">• Couche Micro-Agents (T2, secondes à minutes) : Restate ou Durable Task pour sérialiser l'état par entité (Virtual Object) avec surcharge minimale.</text></g><!--link Restate to Temporal--><!--link MidL to MidR--><!--link MSFT to AWS--><!--link AxisTop to Restate--><!--link AxisTop to Temporal--><!--link Restate to MidL--><!--link Temporal to MidR--><!--link MidL to MSFT--><!--link MidR to AWS--><!--link MSFT to AxisBot--><!--link AWS to AxisBot--><!--link AxisBot to Urbanisation--><?plantuml-src ZLRBSk965Dtp5RScLHdmY64CdcJ6gKgL064JymeIJgMIBDfI6teigKbtonvdaSeoynUfhC8-Vy2Vv4jokWKOxCd36mjrw_RjUyuzznXXKauJgOKHCizvndD3leeNml3O58gbb71Dqo8t8iD3yZnulrx5XTrDNQnVuND_Zg_4ZmMdQlDLy_FQzxclheHHRCu9AuhJKYh3ha