" fill="#000" font-size="14" textLength="368.813" font-family="'Segoe UI'">le plus critique (bloque le déploiement si dossier incomplet)</text></g><!--entity MandatAP2--><g class="entity" data-qualified-name="B2B.MandatAP2" id="ent0019" data-source-line="89"><rect x="373.5" y="572.621" width="338.603" height="75.863" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="383.5" y="597.729" fill="#000" font-size="14" textLength="240.386" font-weight="700" font-family="'Segoe UI'">Mandat Cryptographique AP2 Borné</text><text x="383.5" y="616.35" fill="#000" font-size="14" textLength="318.603" font-family="'Segoe UI'">Plafond CAD, incoterms &amp; SKU signés (confinement</text><text x="383.5" y="634.971" fill="#000" font-size="14" textLength="277.655" font-family="'Segoe UI'">opposable du mandat apparent face au tiers)</text></g><!--entity AntiCollusion--><g class="entity" data-qualified-name="B2B.AntiCollusion" id="ent0020" data-source-line="94"><rect x="747.5" y="572.621" width="326.578" height="75.863" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="757.5" y="597.729" fill="#000" font-size="14" textLength="233.406" font-weight="700" font-family="'Segoe UI'">Garde-Fous Anti-Collusion &amp; Erreur</text><text x="757.5" y="616.35" fill="#000" font-size="14" textLength="306.578" font-family="'Segoe UI'">Cloisonnement mémoire par enchère, interdiction</text><text x="757.5" y="634.971" fill="#000" font-size="14" textLength="277.368" font-family="'Segoe UI'">d'alignement tarifaire &amp; seuil d'anomalie prix</text></g><!--entity PreuveWORM--><g class="entity" data-qualified-name="B2B.PreuveWORM" id="ent0021" data-source-line="99"><rect x="1109.5" y="572.621" width="308.825" height="75.863" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="1119.5" y="597.729" fill="#000" font-size="14" textLength="270.396" font-weight="700" font-family="'Segoe UI'">Preuve Non-Répudiable &amp; Contrat-Cadre</text><text x="1119.5" y="616.35" fill="#000" font-size="14" textLength="288.825" font-family="'Segoe UI'">Journaux WORM scellés (JWS/Merkle), délai de</text><text x="1119.5" y="634.971" fill="#000" font-size="14" textLength="251.344" font-family="'Segoe UI'">rétractation erreur manifeste &amp; arbitrage</text></g><!--entity BSIF--><g class="entity" data-qualified-name="BSIF" id="ent0013" data-source-line="55"><rect x="385" y="372.621" width="332.341" height="139.727" fill="#F8FAFC" style="stroke:#1E293B;stroke-width:0.5;" rx="5" ry="5"/><text x="395" y="397.729" fill="#000" font-size="14" textLength="205.399" font-weight="700" font-family="'Segoe UI'">BSIF / OSFI E-23 (1er mai 2027)</text><line x1="386" y1="401.242" x2="716.341" y2="401.242" style="stroke:#1E293B;stroke-width:1;"/><text x="395" y="420.35" fill="#000" font-size="14" textLength="264.619" font-family="'Segoe UI'">• Périmètre élargi aux systèmes agentiques</text><text x="395" y="438.971" fill="#000" font-size="14" textLength="259.089" font-family="'Segoe UI'">• Cote de matérialité &amp; validation 2e ligne</text><text x="395" y="457.592" fill="#000" font-size="14" textLength="312.341" font-family="'Segoe UI'">• Preuve de constance (pass⁵ ≥ 0,97) &amp; suivi dérive</text><text x="395" y="476.213" fill="#000" font-size="14" textLength="235.621" font-family="'Segoe UI'">• Séparation des tâches (NHI distincts)</text><text x="395" y="494.834" fill="#000" font-size="14" textLength="258.61" font-weight="700" font-family="'Segoe UI'">Cible : Institutions financières fédérales</text></g><!--entity Loi25--><g class="entity" data-qualified-name="Loi25" id="ent0014" data-source-line="65"><rect x="752.5" y="372.621" width="317.104" height="139.727" fill="#F8FAFC" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="762.5" y="397.729" fill="#000" font-size="14" textLength="233.98" font-weight="700" font-family="'Segoe UI'">Loi 25 — Québec (Art. 12.1 &amp; ÉFVP)</text><line x1="753.5" y1="401.242" x2="1068.604" y2="401.242" style="stroke:#166534;stroke-width:1;"/><text x="762.5" y="420.35" fill="#000" font-size="14" textLength="284.717" font-family="'Segoe UI'">• Avis explicite de décision 100 % automatisée</text><text x="762.5" y="438.971" fill="#000" font-size="14" textLength="266.725" font-family="'Segoe UI'">• Accès aux renseignements &amp; facteurs clés</text><text x="762.5" y="457.592" fill="#000" font-size="14" textLength="290.862" font-family="'Segoe UI'">• Droit d'observation &amp; révision humaine HOTL</text><text x="762.5" y="476.213" fill="#000" font-size="14" textLength="286.542" font-family="'Segoe UI'">• ÉFVP obligatoire avant transfert hors Québec</text><text x="762.5" y="494.834" fill="#000" font-size="14" textLength="297.104" font-weight="700" font-family="'Segoe UI'">Cible : Tout traitement de PII de résidents QC</text></g><!--entity EUAI--><g class="entity" data-qualified-name="EUAI" id="ent0015" data-source-line="75"><rect x="1104.5" y="372.621" width="328.704" height="139.727" fill="#F8FAFC" style="stroke:#C2410C;stroke-width:0.5;" rx="5" ry="5"/><text x="1114.5" y="397.729" fill="#000" font-size="14" textLength="228.286" font-weight="700" font-family="'Segoe UI'">EU AI Act (Août 2026 &amp; Déc. 2027)</text><line x1="1105.5" y1="401.242" x2="1432.204" y2="401.242" style="stroke:#C2410C;stroke-width:1;"/><text x="1114.5" y="420.35" fill="#000" font-size="14" textLength="296.762" font-family="'Segoe UI'">• Art. 50 (août 2026) : transparence &amp; marquage</text><text x="1114.5" y="438.971" fill="#000" font-size="14" textLength="274.647" font-family="'Segoe UI'">• Annexe III (déc. 2027) : emploi, crédit, infra.</text><text x="1114.5" y="457.592" fill="#000" font-size="14" textLength="308.704" font-family="'Segoe UI'">• Journaux automatiques Art. 12 &amp; dossier Ann. IV</text><text x="1114.5" y="476.213" fill="#000" font-size="14" textLength="298.915" font-family="'Segoe UI'">• Contrôle humain effectif Art. 14 + bouton arrêt</text><text x="1114.5" y="494.834" fill="#000" font-size="14" textLength="301.718" font-weight="700" font-family="'Segoe UI'">Cible : Mise sur le marché ou impact dans l'UE</text></g><!--link Plan to Do--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="35" data-link-type="dependency"><path d="M231.21,121.621 C242.8,121.621 249.39,121.621 260.97,121.621" style="stroke:#2563EB;stroke-width:1;" fill="none" id="Plan-to-Do" codeLine="35"/><polygon points="265.97,121.621,256.97,117.621,260.97,121.621,256.97,125.621,265.97,121.621" fill="#2563EB" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Do to Check--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-source-line="36" data-link-type="dependency"><path d="M506.03,121.621 C517.8,121.621 524.58,121.621 536.35,121.621" style="stroke:#2563EB;stroke-width:1;" fill="none" id="Do-to-Check" codeLine="36"/><polygon points="541.35,121.621,532.35,117.621,536.35,121.621,532.35,125.621,541.35,121.621" fill="#2563EB" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Check to Act--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk8" data-source-line="37" data-link-type="dependency"><path d="M740.63,121.621 C752.18,121.621 758.73,121.621 770.27,121.621" style="stroke:#2563EB;stroke-width:1;" fill="none" id="Check-to-Act" codeLine="37"/><polygon points="775.27,121.621,766.27,117.621,770.27,121.621,766.27,125.621,775.27,121.621" fill="#2563EB" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Vecteur to HWM--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" id="lnk12" data-source-line="52" data-link-type="dependency"><path d="M681.06,274.621 C692.73,274.621 699.41,274.621 711.09,274.621" style="stroke:#2563EB;stroke-width:1;" fill="none" id="Vecteur-to-HWM" codeLine="52"/><polygon points="716.09,274.621,707.09,270.621,71