 textLength="320.626">Couche sémantique, médiation sectorielle, contexte</text><text x="27" y="403.072" fill="#000" font-size="14" textLength="226.413">compilé ACL, mémoire bi-temporelle</text><rect x="22" y="411.148" width="426.712" height="27.609" fill="#FFF" style="stroke:none;"/><text x="27" y="430.682" fill="#000" font-size="14"> </text><rect x="22" y="438.758" width="426.712" height="62.828" fill="#EFF6FF" style="stroke:none;"/><text x="27" y="458.291" fill="#000" font-size="14" textLength="7.779">  </text><text x="34.779" y="458.291" fill="#000" font-size="14" textLength="126.485" font-weight="700">Couche 4 — Accès</text><text x="161.265" y="458.291" fill="#000" font-size="14" textLength="7.779">  </text><text x="169.044" y="458.291" fill="#2563EB" font-size="14" textLength="36.572">acces</text><text x="27" y="475.9" fill="#000" font-size="14" textLength="308.492">Passerelle à 5 contrôles, schémas d'outils signés,</text><text x="27" y="493.51" fill="#000" font-size="14" textLength="217.889">patrimoine, API bancaires ouvertes</text><rect x="22" y="501.586" width="426.712" height="27.609" fill="#FFF" style="stroke:none;"/><text x="27" y="521.119" fill="#000" font-size="14"> </text><rect x="22" y="529.195" width="426.712" height="62.828" fill="#EFF6FF" style="stroke:none;"/><text x="27" y="548.729" fill="#000" font-size="14" textLength="7.779">  </text><text x="34.779" y="548.729" fill="#000" font-size="14" textLength="141.244" font-weight="700">Couche 5 — Modèles</text><text x="176.023" y="548.729" fill="#000" font-size="14" textLength="7.779">  </text><text x="183.803" y="548.729" fill="#2563EB" font-size="14" textLength="52.917">modeles</text><text x="27" y="566.338" fill="#000" font-size="14" textLength="345.112">Routage d'inférence 3 paliers, bac à sable sans réseau,</text><text x="27" y="583.947" fill="#000" font-size="14" textLength="226.816">continuité bimodèle, résidence d'état</text><line x1="22" y1="167.445" x2="448.712" y2="167.445" style="stroke:#00