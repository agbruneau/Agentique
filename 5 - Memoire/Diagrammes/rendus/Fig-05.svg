<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:717px;height:552px;background:#FFFFFF;" width="717px" height="552px" viewBox="0 0 717 552" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="11"><text x="115.79" y="24.533" fill="#000" font-size="14" textLength="478.42" font-weight="700">Enveloppe durable OO3/OO4 [S], point pivot Saga &amp; canal EXIG-ORC-28</text><text x="131.291" y="39.028" fill="#475569" font-size="11" textLength="447.417" font-weight="700">Confinement déterministe, idempotence JCS et compensation isolée du coupe-circuit</text></g><!--cluster ENV--><g class="cluster" data-qualified-name="ENV" id="ent0001" data-source-line="16"><rect x="69" y="59.445" width="634" height="265" fill="#FFF" style="stroke:#0F172A;stroke-width:1;" rx="5" ry="5"/><text x="133.333" y="75.979" fill="#0F172A" font-size="14" textLength="505.333" font-weight="700">Enveloppe durable OO3 / OO4 [S] — État hors processus (EXIG-ORC-11..13)</text><text x="183.652" y="90.474" fill="#475569" font-size="11" textLength="404.696" font-weight="700">OO1/OO2 [S] exclus (C26 § 29.4.1) · Clé SHA-256(JCS) côté cible (ORC-21..22)</text></g><!--entity R1--><g class="entity" data-qualified-name="ENV.R1" id="ent0002" data-source-line="17"><rect x="137.5" y="109.445" width="143.361" height="72.828" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="147.5" y="133.979" fill="#1D4ED8" font-size="14" textLength="116.724" font-weight="700">1. Réversible (P2)</text><text x="147.5" y="151.588" fill="#000" font-size="14" textLength="110.496">Sceller C1 journal</text><text x="147.5" y="169.197" fill="#000" font-size="14" textLength="123.361">Cellule bornée + K1</text></g><!--entity R2--><g class="entity" data-qualified-name="ENV.R2" id="ent0003" data-source-line="18"><rect x="318.5" y="109.445" width="138.74" height="72.828" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="328.5" y="133.979" fill="#1D4ED8" font-size="14" textLength="116.724" font-weight="700">2. Réversible (P2)</text><text x="328.5" y="151.588" fill="#000" font-size="14" textLength="110.496">Sceller C2 journal</text><text x="328.5" y="169.197" fill="#000" font-size="14" textLength="118.74">≤ 2 sauts / ≤ 3 itér.</text></g><!--entity VE--><g class="entity" data-qualified-name="ENV.VE" id="ent0004" data-source-line="19"><rect x="488.5" y="109.445" width="140.6" height="72.828" fill="#F5F3FF" style="stroke:#6D28D9;stroke-width:0.5;" rx="5" ry="5"/><text x="498.5" y="133.979" fill="#6D28D9" font-size="14" textLength="99.579" font-weight="700">Veille (PC3 [S])</text><text x="498.5" y="151.588" fill="#000" font-size="14" textLength="110.503">Attente hors proc.</text><text x="498.5" y="169.197" fill="#000" font-size="14" textLength="120.6">Revalid. (CAP-008)</text></g><!--entity SAGA--><g class="entity" data-qualified-name="ENV.SAGA" id="ent0005" data-source-line="21"><rect x="85" y="200.445" width="241.71" height="108.047" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="95" y="224.979" fill="#1D4ED8" font-size="14" textLength="221.71" font-weight="700">Journal Saga ajout seul (ORC-16)</text><text x="95" y="242.588" fill="#000" font-size="14" textLength="216.563">• Compensations [C1, C2] scellées</text><text x="95" y="260.197" fill="#000" font-size="14" textLength="192.199">AVANT l’exécution de T1 et T2</text><text x="95" y="277.807" fill="#000" font-size="14" textLength="193.97">• Paramètres résolus et h(JCS)</text><text x="95" y="295.416" fill="#166534" font-size="14" textLength="215.934">→ Alimente le canal EXIG-ORC-28</text></g><!--entity PIVOT--><g class="entity" data-qualified-name="ENV.PIVOT" id="ent0006" data-source-line="23"><rect x="352" y="235.445" width="62.007" height="37.609" fill="#991B1B" style="stroke:#991B1B;stroke-width:0.5;" rx="5" ry="5"/><text x="362" y="259.979" fill="#FFF" font-size="14" textLength="42.007" font-weight="700">PIVOT</text></g><!--entity POST--><g class="entity" data-qualified-name="ENV.POST" id="ent0007" data-source-line="25"><rect x="439.5" y="200.445" width="247.131" height="108.047" fill="#FEF2F2" style="stroke:#991B1B;stroke-width:0.5;" rx="5" ry="5"/><text x="449.5" y="224.979" fill="#991B1B" font-size="14" textLength="227.131" font-weight="700">Engagement post-pivot (P3 / Cl. 4)</text><text x="449.5" y="242.588" fill="#000" font-size="14" textLength="179.977">• Acte irréversible (pacs.008)</text><text x="449.5" y="260.197" fill="#000" font-size="14" textLength="183.88">• Après validations &amp; CIBA lié</text><text x="449.5" y="277.807" fill="#000" font-size="14" textLength="200.245">• Tampon de grâce si applicable</text><text x="449.5" y="295.416" fill="#000" font-size="14" textLength="187.811">• Zéro annulation automatique</text></g><!--entity COMP--><g class="entity" data-qualified-name="COMP" id="ent0014" data-source-line="35"><rect x="7" y="340.445" width="509.774" height="90.438" fill="#ECFDF5" style="stroke:#16A34A;stroke-width:0.5;" rx="5" ry="5"/><text x="17" y="364.979" fill="#166534" font-size="14" textLength="489.774" font-weight="700">Canal de compensation dédié (EXIG-ORC-28) — reste OUVERT sous arrêt</text><text x="17" y="382.588" fill="#000" font-size="14" textLength="414.456">• Identité propre orchestrateur (≠ NHI agent) · budget réservé isolé</text><text x="17" y="400.197" fill="#000" font-size="14" textLength="429.413">• Limité aux seuls outils de compensation C2 → C1 inscrits au journal</text><text x="17" y="417.807" fill="#000" font-size="14" textLength="438.32">• Idempotence vérifiée (EXIG-ORC-17) · tests injection de fautes en CI</text></g><!--entity CC--><g class="entity" data-qualified-name="CC" id="ent0015" data-source-line="38"><rect x="131.5" y="448.445" width="251.444" height="90.438" fill="#FEF2F2" style="stroke:#991B1B;stroke-width:0.5;" rx="5" ry="5"/><text x="141.5" y="472.979" fill="#991B1B" font-size="14" textLength="231.444" font-weight="700">Coupe-circuit (&lt; 10 s [S], POR-003)</text><text x="141.5" y="490.588" fill="#000" font-size="14" textLength="160.563">• Bloque le NHI de l’agent</text><text x="141.5" y="508.197" fill="#000" font-size="14" textLength="194.031">• Stoppe tout appel vers l’avant</text><text x="141.5" y="525.807" fill="#000" font-size="14" textLength="215.968">• Exercice trim. ≤ 15 min (SEC-26)</text></g><!--entity FH--><g class="entity" data-qualified-name="FH" id="ent0016" data-source-line="39"><rect x="407.5" y="448.445" width="239.372" height="90.438" fill="#FFF7ED" style="stroke:#9A3412;stroke-width:0.5;" rx="5" ry="5"/><text x="417.5" y="472.979" fill="#9A3412" font-size="14" textLength="219.372" font-weight="700">File humaine prioritaire (ORC-18)</text><text x="417.5" y="490.588" fill="#000" font-size="14" textLength="166.004">• Escalade après 2 échecs</text><text x="417.5" y="508.197" fill="#000" font-size="14" textLength="143.213">de compensation Saga</text><text x="417.5" y="525.807" fill="#000" font-size="14" textLength="192.438">• Audit JCS &amp; reprise manuelle</text></g><!--link R1 to R2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-source-line="27" data-link-type="dependency"><path d="M280.52,146.445 C292.98,146.445 300.93,146.445 313.35,146.445" style="stroke:#2563EB;stroke-width:1;" fill="none" id="R1-to-R2"/><polygon points="318.35,146.445,309.35,142.445,313.35,146.445,309.35,150.445,318.35,146.445" fill="#2563EB" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link R2 to VE--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk9" data-source-line="28" data-link-type="dependency"><path d="M457.55,146.445 C467.72,146.445 473.21,146.445 483.4,146.445" style="stroke:#2563EB;stroke-width:1;" fill="none