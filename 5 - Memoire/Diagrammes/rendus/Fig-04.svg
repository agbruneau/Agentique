<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:638px;height:786px;background:#FFFFFF;" width="638px" height="786px" viewBox="0 0 638 786" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="11"><text x="81.362" y="29.533" fill="#000" font-size="14" textLength="468.275" font-weight="700">Compilation du contexte, 4 mémoires CoALA et couche anticorruption</text><text x="115.019" y="44.028" fill="#475569" font-size="11" textLength="400.963" font-weight="700">Préfixe KV-cache, filtrage ACL (ARC-16), cloisonnement (ARC-25) et COMP-3</text></g><!--entity COMP--><g class="entity" data-qualified-name="COMP" id="ent0001" data-source-line="16"><rect x="37.5" y="69.445" width="555.778" height="162.047" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="5" ry="5"/><text x="52.5" y="98.979" fill="#000" font-size="14" textLength="417.758" font-weight="700">Compilateur déterministe de contexte (CAP-017, EXIG-ARC-22)</text><rect x="52.5" y="104.055" width="525.778" height="27.609" fill="#ECFDF5" style="stroke:none;"/><text x="57.5" y="123.588" fill="#000" font-size="14" textLength="7.779">  </text><text x="65.279" y="123.588" fill="#166534" font-size="14" textLength="148.613" font-weight="700">1. Tête fixe KV-cache :</text><text x="229.451" y="123.588" fill="#000" font-size="14" textLength="308.109">Invites signées &amp; schémas stables (EXIG-FIN-07)</text><rect x="52.5" y="131.664" width="525.778" height="27.609" fill="#EFF6FF" style="stroke:none;"/><text x="57.5" y="151.197" fill="#000" font-size="14" textLength="7.779">  </text><text x="65.279" y="151.197" fill="#1D4ED8" font-size="14" textLength="153.234" font-weight="700">2. Filtrage ACL amont :</text><text x="234.072" y="151.197" fill="#000" font-size="14" textLength="331.427">Droits mandant stricts, zéro compte service (ARC-16)</text><rect x="52.5" y="159.273" width="525.778" height="27.609" fill="#F5F3FF" style="stroke:none;"/><text x="57.5" y="178.807" fill="#000" font-size="14" textLength="7.779">  </text><text x="65.279" y="178.807" fill="#6D28D9" font-size="14" textLength="157.145" font-weight="700">3. Couche sémantique :</text><text x="237.982" y="178.807" fill="#000" font-size="14" textLength="308.902">Métriques versionnées (DEC-003), zéro SQL libre</text><rect x="52.5" y="186.883" width="525.778" height="27.609" fill="#FFF7ED" style="stroke:none;"/><text x="57.5" y="206.416" fill="#000" font-size="14" textLength="7.779">  </text><text x="65.279" y="206.416" fill="#C2410C" font-size="14" textLength="133.021" font-weight="700">4. État borné &amp; réf. :</text><text x="213.858" y="206.416" fill="#000" font-size="14" textLength="335.371">Compaction au seuil · passage par réf. A2A (ORC-23)</text><line x1="52.5" y1="104.055" x2="578.278" y2="104.055" style="stroke:#000;stroke-width:0.5;"/><line x1="52.5" y1="131.664" x2="578.278" y2="131.664" style="stroke:#000;stroke-width:0.5;"/><line x1="52.5" y1="159.273" x2="578.278" y2="159.273" style="stroke:#000;stroke-width:0.5;"/><line x1="52.5" y1="186.883" x2="578.278" y2="186.883" style="stroke:#000;stroke-width:0.5;"/><line x1="52.5" y1="214.492" x2="578.278" y2="214.492" style="stroke:#000;stroke-width:0.5;"/><line x1="52.5" y1="104.055" x2="52.5" y2="214.492" style="stroke:#000;stroke-width:0.5;"/><line x1="578.278" y1="104.055" x2="578.278" y2="214.492" style="stroke:#000;stroke-width:0.5;"/></g><!--entity COALA--><g class="entity" data-qualified-name="COALA" id="ent0002" data-source-line="24"><rect x="69" y="251.445" width="493.347" height="233.609" fill="#FFF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="84" y="273.979" fill="#1D4ED8" font-size="14" textLength="463.347" font-weight="700">4 mémoires CoALA isolées — zéro partage en écriture (EXIG-ARC-25)</text><image width="446" height