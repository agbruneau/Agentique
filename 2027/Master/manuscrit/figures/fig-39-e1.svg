<text x="510" y="108" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">Les usages réels</text>
<text x="510" y="123.18" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">correspondent-ils</text>
<text x="510" y="138.36" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">aux usages</text>
<text x="510" y="153.54" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">autorisés ?</text>
