<text x="230" y="168.72" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">d&#x27;arrêt, plafond</text>
<text x="230" y="183.9" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">de consommation</text>
<text x="230" y="199.08" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">en place ?</text>
