<rect x="590" y="84" width="120" height="124" rx="6" fill="#f5f6f8" stroke="#9aa5b4" stroke-width="1.2"/>
<text x="650" y="108" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">Ce changement</text>
<text x="650" y="123.18" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">déclenche-t-il</text>
<text x="650" y="138.36" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">une nouvelle</text>
<text x="650" y="153.54" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">revue ?</text>
