<rect x="730" y="84" width="120" height="124" rx="6" fill="#f5f6f8" stroke="#9aa5b4" stroke-width="1.2"/>
<text x="790" y="108" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">Accès supprimés,</text>
<text x="790" y="123.18" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">documents</text>
<text x="790" y="138.36" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">archivés,</text>
<text x="790" y="153.54" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">inscription</text>
<text x="790" y="168.72" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">conservée</text>
