<text x="544" y="71.56" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#5f6b7a">UCP : catalogue, profil /.well-known/ucp</text>
<text x="544" y="87.4" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#5f6b7a">ACP : flux de produits</text>
<rect x="40" y="118" width="800" height="64" rx="6" fill="#ffffff" stroke="#9aa5b4" stroke-width="1.2"/>
