<text x="224" y="301.625" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="12.5" font-style="italic" fill="#14233f">Comment la valeur change-t-elle de mains ?</text>
<rect x="530" y="274" width="302" height="48" rx="4" fill="#f5f6f8" stroke="#9aa5b4" stroke-width="1.2"/>
<text x="544" y="293.56" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#5f6b7a">Rails de cartes existants</text>
<text x="544" y="309.4" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="12" fill="#5f6b7a">x402; MPP</text>
