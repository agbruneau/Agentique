<text x="125" y="154.55" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" font-weight="bold" fill="#14233f">Autorisation</text>
<text x="224" y="153.625" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="12.5" font-style="italic" fill="#14233f">Qu&#x27;a permis l&#x27;utilisateur, et qui est l&#x27;agent ?</text>
