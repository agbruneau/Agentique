<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310">
<rect width="880" height="310" fill="#ffffff"/>
<text x="30" y="30" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="12" font-weight="bold" fill="#14233f">Un document, pipeline séquentiel</text>
<rect x="30" y="42" width="798.569" height="36" rx="3" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="1.2"/>
<rect x="828.569" y="42" width="21.4313" height="36" rx="2" fill="#5f6b7a" stroke="#5f6b7a" stroke-width="1.2"/>
<text x="44" y="65" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Entrée : 142 340 jetons, plus de 97 %</text>
<text x="850" y="95" text-anchor="end" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#5f6b7a">Sortie : 3 820 jetons</text>
<text x="30" y="95" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#5f6b7a">Instructions système, historique, contenu récupéré, dernier résultat d&#x27;outil : renvoyés à chaque tour</text>
<rect x="30" y="118" width="260" height="172" rx="6" fill="#f5f6f8" stroke="#9aa5b4" stroke-width="1.2"/>
<text x="46" y="144" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="12.5" font-weight="bold" fill="#14233f">Boucle</text>
<text x="46" y="175" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">Conversation</text>
<rect x="138" y="162" width="5.33333" height="18" rx="2" fill="#ffffff" stroke="#9aa5b4" stroke-width="1.2"/>
<text x="149.333" y="175" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#5f6b7a">1</text>
<text x="46" y="205" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">Agent</text>
