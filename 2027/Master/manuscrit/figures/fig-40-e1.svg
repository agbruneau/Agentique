<text x="326" y="144" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="12.5" font-weight="bold" fill="#14233f">Topologie</text>
<text x="326" y="175" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">Pipeline</text>
<rect x="418" y="162" width="34.7907" height="18" rx="2" fill="#ffffff" stroke="#9aa5b4" stroke-width="1.2"/>
<text x="458.791" y="175" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#5f6b7a">0,187 $</text>
<text x="326" y="205" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">Réflexive</text>
<rect x="418" y="192" width="80" height="18" rx="2" fill="#eef2fb" stroke="#2f5fd0" stroke-width="1.2"/>
<text x="504" y="205" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#2f5fd0">0,430 $</text>
<text x="326" y="244" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#14233f">Coût par document : ×2,3</text>
<text x="326" y="274" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-style="italic" fill="#5f6b7a">Même modèle</text>
<rect x="590" y="118" width="260" height="172" rx="6" fill="#f5f6f8" stroke="#9aa5b4" stroke-width="1.2"/>
<text x="606" y="144" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="12.5" font-weight="bold" fill="#14233f">Outils</text>
<text x="606" y="175" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">Définitions d&#x27;outils, blocs d&#x27;appel</text>
<text x="606" y="190.18" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">et de résultat : payés en jetons</text>
<text x="606" y="205.36" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">d&#x27;entrée, à chaque requête</text>
<text x="606" y="244" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#5f6b7a">Dizaines de serveurs MCP :</text>
<text x="606" y="259.18" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#5f6b7a">catalogue entier payé à chaque tour</text>
