<text x="165.333" y="205" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#2f5fd0">≈ ×4</text>
<text x="46" y="235" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">Multi-agents</text>
<rect x="138" y="222" width="80" height="18" rx="2" fill="#eef2fb" stroke="#2f5fd0" stroke-width="1.2"/>
<text x="224" y="235" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#2f5fd0">≈ ×15</text>
<text x="46" y="274" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-style="italic" fill="#5f6b7a">Mesure interne d&#x27;Anthropic, en jetons</text>
