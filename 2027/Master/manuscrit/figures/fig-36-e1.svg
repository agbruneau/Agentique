<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310">
<rect width="880" height="310" fill="#ffffff"/>
<rect x="270" y="20" width="340" height="270" rx="6" fill="#f9eaea" stroke="#9c2f2f" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="440" y="48" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="13.5" font-weight="bold" fill="#14233f">Autorité apparente</text>
<text x="440" y="67" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">ce que le tiers perçoit</text>
<text x="440" y="84" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" fill="#5f6b7a">canal, marque, carte d&#x27;agent, absence de limite annoncée</text>
<rect x="320" y="110" width="240" height="100" rx="6" fill="#e9f3ef" stroke="#2c6b58" stroke-width="1.2"/>
<text x="440" y="147.867" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="13.5" font-weight="bold" fill="#14233f">Autorité réelle</text>
<text x="440" y="166.367" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">ce qui est configuré : portées,</text>
<text x="440" y="180.887" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">politiques, mandats signés</text>
<text x="440" y="248" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12.5" font-weight="bold" fill="#9c2f2f">Écart : le risque juridique</text>
<text x="440" y="267" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">un acte non permis peut lier le mandant</text>
<rect x="30" y="120" width="170" height="80" rx="6" fill="#f5f6f8" stroke="#9aa5b4" stroke-width="1.2"/>
<text x="115" y="147.705" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="bold" fill="#14233f">Mandant</text>
<text x="115" y="166.055" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">la personne qui</text>
<text x="115" y="180.575" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">déploie l&#x27;agent</text>
<rect x="680" y="120" width="170" height="80" rx="6" fill="#f5f6f8" stroke="#9aa5b4" stroke-width="1.2"/>
<text x="765" y="147.705" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="bold" fill="#14233f">Tiers</text>
<text x="765" y="166.055" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">croit raisonnablement</text>
<text x="765" y="180.575" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">l&#x27;agent autorisé</text>
<line x1="200" y1="160" x2="320" y2="160" stroke="#5f6b7a" stroke-width="1.4"/>
<polygon points="320,160 311,164 311,156" fill="#5f6b7a"/>
<text x="235" y="152" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">configure</text>
<line x1="680" y1="160" x2="610" y2="160" stroke="#5f6b7a" stroke-width="1.4"/>
<polygon points="610,160 619,156 619,164" fill="#5f6b7a"/>
<text x="645" y="152" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">perçoit</text>
</svg>
