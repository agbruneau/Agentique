<text x="242" y="30" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" letter-spacing="1.2" fill="#2f5fd0">QUESTION</text>
<text x="544" y="30" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" letter-spacing="1.2" fill="#2f5fd0">CE QUE FOURNISSENT LES PROTOCOLES EN 2026</text>
