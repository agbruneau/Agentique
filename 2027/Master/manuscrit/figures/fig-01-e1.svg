<text x="430" y="272.543" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12.5" font-weight="bold" fill="#14233f">Condition d&#x27;arrêt</text>
<text x="430" y="290.743" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">p. ex. nombre maximal</text>
<text x="430" y="305.262" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">d&#x27;itérations</text>
