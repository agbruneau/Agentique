<text x="430" y="184.055" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">évalue son avancement et</text>
<text x="430" y="198.575" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#5f6b7a">choisit la suite</text>
