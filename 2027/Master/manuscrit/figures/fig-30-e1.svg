<line x1="321" y1="266" x2="321" y2="196" stroke="#5f6b7a" stroke-width="1.4"/>
<polygon points="321,196 325,205 317,205" fill="#5f6b7a"/>
<text x="331" y="236" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" fill="#5f6b7a">émet</text>
<line x1="561" y1="266" x2="561" y2="196" stroke="#2f5fd0" stroke-width="1.4"/>
<polygon points="561,196 565,205 557,205" fill="#2f5fd0"/>
<text x="571" y="214" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#2f5fd0">échange de jeton</text>
<text x="571" y="228" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" fill="#2f5fd0">une seule audience</text>
<text x="571" y="242" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" fill="#2f5fd0">moins de droits</text>
<text x="571" y="256" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" fill="#2f5fd0">expire avant le parent</text>
<rect x="716" y="104" width="148" height="92" rx="6" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.2"/>
<text x="790" y="124" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#14233f">Décide sur</text>
<text x="790" y="144" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#14233f">sub et acteur courant</text>
<text x="790" y="168" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-style="italic" fill="#8a5a12">Acteurs antérieurs :</text>
<text x="790" y="182.52" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-style="italic" fill="#8a5a12">informatifs</text>
<line x1="790" y1="74" x2="790" y2="104" stroke="#9aa5b4" stroke-width="1.3"/>
<text x="16" y="344" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" letter-spacing="1.2" fill="#8a5a12">CE QUE LA CHAÎNE PERD</text>
<text x="16" y="366" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">Rien ne garantit que l&#x27;agent avait le droit de déléguer, ni qu&#x27;il a réduit ce qu&#x27;il transmettait.</text>
<text x="16" y="384" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" fill="#14233f">L&#x27;orchestrateur consigne la chaîne complète, que le jeton ne porte pas de façon probante.</text>
