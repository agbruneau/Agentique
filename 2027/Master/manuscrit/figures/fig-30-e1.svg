<text x="681" y="40" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" fill="#5f6b7a">présente</text>
<rect x="236" y="104" width="170" height="92" rx="6" fill="#ffffff" stroke="#2f5fd0" stroke-width="1.2"/>
<text x="248" y="124" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#14233f">Jeton de l&#x27;agent</text>
<text x="248" y="144" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#14233f">sub : utilisateur</text>
<text x="248" y="161" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#14233f">act : agent</text>
<rect x="491" y="104" width="140" height="92" rx="6" fill="#ffffff" stroke="#2f5fd0" stroke-width="1.2"/>
<text x="503" y="124" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#14233f">Jeton du sous-agent</text>
<text x="503" y="144" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#14233f">sub : utilisateur</text>
<text x="503" y="161" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11" fill="#14233f">act : sous-agent</text>
<text x="517" y="178" text-anchor="start" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-style="italic" fill="#8a5a12">act : agent</text>
