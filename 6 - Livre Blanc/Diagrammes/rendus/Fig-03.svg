<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:673px;height:816px;background:#FFFFFF;" width="673px" height="816px" viewBox="0 0 673 816" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="5"><text x="111.219" y="24.533" fill="#000" font-size="14" textLength="444.404" font-weight="700">Spectre d'autonomie (L0-L4) et transitions de supervision humaine</text></g><g class="entity" data-qualified-name="L0" id="ent0001" data-source-line="16"><rect x="231.35" y="125.609" width="273.716" height="72.828" fill="#F1F6F9" style="stroke:#2B4C65;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="231.35" y1="153.219" x2="505.066" y2="153.219" style="stroke:#2B4C65;stroke-width:0.5;"/><text x="257.732" y="145.143" fill="#0F172A" font-size="14" textLength="220.951">L0 — Déterministe (Workflow codé)</text><text x="236.35" y="172.752" fill="#0F172A" font-size="14" textLength="253.716">Logique figée, zéro autonomie LLM; repli</text><text x="236.35" y="190.361" fill="#0F172A" font-size="14" textLength="86.386">sûr par défaut</text></g><g class="entity" data-qualified-name="L1" id="ent0002" data-source-line="17"><rect x="62.85" y="276.609" width="248.819" height="72.828" fill="#F1F6F9" style="stroke:#2B4C65;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="62.85" y1="304.219" x2="311.669" y2="304.219" style="stroke:#2B4C65;stroke-width:0.5;"/><text x="74.839" y="296.143" fill="#0F172A" font-size="14" textLength="224.841">L1 — Opérateur assisté (HITL strict)</text><text x="67.85" y="323.752" fill="#0F172A" font-size="14" textLength="228.819">Suggestion ponctuelle; exécution sur</text><text x="67.85" y="341.361" fill="#0F172A" font-size="14" textLength="123.724">commande explicite</text></g><g class="entity" data-qualified-name="L2" id="ent0003" data-source-line="18"><rect x="41.35" y="427.609" width="274.468" height="72.828" fill="#F1F6F9" style="stroke:#2B4C65;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="41.35" y1="455.219" x2="315.818" y2="455.219" style="stroke:#2B4C65;stroke-width:0.5;"/><text x="51.35" y="447.143" fill="#0F172A" font-size="14" textLength="254.468">L2 — Collaborateur guidé (HITL partagé)</text><text x="46.35" y="474.752" fill="#0F172A" font-size="14" textLength="235.382">Plan proposé par l'agent; co-édition et</text><text x="46.35" y="492.361" fill="#0F172A" font-size="14" textLength="109.737">passage de relais</text></g><g class="entity" data-qualified-name="L3" id="ent0004" data-source-line="19"><rect x="54.35" y="578.609" width="328.499" height="72.828" fill="#F1F6F9" style="stroke:#2B4C65;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="54.35" y1="606.219" x2="382.849" y2="606.219" style="stroke:#2B4C65;stroke-width:0.5;"/><text x="64.35" y="598.143" fill="#0F172A" font-size="14" textLength="308.499">L3 — Exécuteur supervisé (HITL sélectif + HOTL)</text><text x="59.35" y="625.752" fill="#0F172A" font-size="14" textLength="253.675">Boucle bornée; arrêt sur effet irréversible</text><text x="59.35" y="643.361" fill="#0F172A" font-size="14" textLength="48.255">ou seuil</text></g><g class="entity" data-qualified-name="L4" id="ent0005" data-source-line="20"><rect x="225.35" y="729.609" width="290.396" height="72.828" fill="#F1F6F9" style="stroke:#2B4C65;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="225.35" y1="757.219" x2="515.746" y2="757.219" style="stroke:#2B4C65;stroke-width:0.5;"/><text x="235.35" y="749.143" fill="#0F172A" font-size="14" textLength="270.396">L4 — Autonomie bornée (HOTL + certificat)</text><text x="230.35" y="776.752" fill="#0F172A" font-size="14" textLength="249.819">Enveloppe réversible; vigilance continue</text><text x="230.35" y="794.361" fill="#0F172A" font-size="14" textLength="67.689">et arrêt sûr</text></g><g class="start_entity" data-qualified-name=".start." id="ent