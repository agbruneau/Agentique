<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 335" width="445" height="335" role="img" aria-label="Les huit patrons de modelisation des concepts agentiques en ArchiMate.">
  <!-- § 44.1.2 à § 44.1.8 et § 44.1.9, chapitre 44.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="335" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">HUIT PATRONS, ET LEURS ÉLÉMENTS</text>
  <rect x="0" y="14" width="215" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Agent</text>
  <text class="l ann" x="10" y="47">Application Component, Role, Collaboration.</text>
  <text class="l renvoi" x="10" y="61">§ 44.1.2</text>
  <rect x="230" y="14" width="215" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">2</text>
  <text class="l bande" x="251" y="32">Appel d'outil</text>
  <text class="l ann" x="240" y="47">Application Service, Interface, Serving.</text>
  <text class="l renvoi" x="240" y="61">§ 44.1.3</text>
  <rect x="0" y="87" width="215" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="105">3</text>
  <text class="l bande" x="21" y="105">Interaction agent-agent</text>
  <text class="l ann" x="10" y="120">Collaboration, Flow, Triggering.</text>
  <text class="l renvoi" x="10" y="134">§ 44.1.4</text>
  <rect x="230" y="87" width="215" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="105">4</text>
  <text class="l bande" x="251" y="105">Identité non humaine</text>
  <text class="l ann" x="240" y="120">Role, structure active, overlay de sécurité.</text>
  <text class="l renvoi" x="240" y="134">§ 44.1.5</text>
  <rect x="0" y="160" width="215" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="178">5</text>
  <text class="l bande" x="21" y="178">Plan de contrôle d'agents</text>
  <text class="l ann" x="10" y="193">Et la limite de la découverte dynamique.</text>
  <text class="l renvoi" x="10" y="207">§ 44.1.6</text>
  <rect x="230" y="160" width="215" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="178">6</text>
  <text class="l bande" x="251" y="178">Humain-agent</text>
  <text class="l ann" x="240" y="193">Point d'arrêt, double regard, autonomie graduée.</text>
  <text class="l renvoi" x="240" y="207">§ 44.1.7</text>
  <rect x="0" y="233" width="215" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="251">7</text>
  <text class="l bande" x="21" y="251">Mémoire et ancrage</text>
  <text class="l ann" x="10" y="266">Récupération et ancrage gouverné.</text>
  <text class="l renvoi" x="10" y="280">§ 44.1.8</text>
  <rect x="230" y="233" width="215" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="251">8</text>
  <text class="l bande" x="251" y="251">Registre des stéréotypes</text>
  <text class="l ann" x="240" y="266">Ce qui tient les sept précédents ensemble.</text>
  <text class="l renvoi" x="240" y="280">§ 44.1.9 — reproduit en [C]</text>
  <path d="M 0 296 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="309">CHAQUE PATRON EST UNE SPÉCIALISATION, non un élément du langage : le registre des stéréotypes (§ 44.1.9) est reproduit du</text>
  <text class="l ann" x="0" y="319">Vol. I en [C]. Modéliser un agent en ArchiMate est un arbitrage de notation, et le § 44.9 dit ce que le formalisme ne sait pas</text>
  <text class="l ann" x="0" y="329">dire.</text>
</svg>
