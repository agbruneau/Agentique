<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 453" width="445" height="453" role="img" aria-label="Les cinq zones ou l'architecture doit compenser ce qu'aucun protocole ni texte ne porte.">
  <!-- Tableau 42.2, § 42.4, chapitre 42 — construction d'auteur.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="453" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">CINQ ZONES, CINQ COMPENSATIONS</text>
  <rect x="0" y="14" width="445" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">Z1</text>
  <text class="l bande" x="27" y="32">La production de la trace</text>
  <text class="l ann" x="10" y="47">L'art. 12.1 exige les raisons, facteurs et paramètres ; une préimpression enseigne que la journalisation confiée aux</text>
  <text class="l ann" x="10" y="58">agents « n'est généralement pas recommandée ».</text>
  <text class="l renvoi" x="10" y="72">la trace doit être produite par le cadre, non par les agents</text>
  <rect x="0" y="98" width="445" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="116">Z2</text>
  <text class="l bande" x="27" y="116">Le point d'arrêt humain</text>
  <text class="l ann" x="10" y="131">L'art. 12.1 exige l'occasion de présenter ses observations à un membre du personnel en mesure de réviser.</text>
  <text class="l renvoi" x="10" y="156">le socle ne documente d'humain dans aucun des trois protocoles</text>
  <rect x="0" y="182" width="445" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="200">Z3</text>
  <text class="l bande" x="27" y="200">La détectabilité de l'auto-modification</text>
  <text class="l ann" x="10" y="215">L'avis 11-348 capte l'adaptativité après déploiement ; E-23 attend une surveillance continue.</text>
  <text class="l renvoi" x="10" y="240">un manifeste scinde l'auto-modification en adaptation et évolution</text>
  <rect x="0" y="266" width="445" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="284">Z4</text>
  <text class="l bande" x="27" y="284">L'interface d'accès du cadre bancaire</text>
  <text class="l ann" x="10" y="299">Le standard technique n'est pas désigné — fait négatif vérifié.</text>
  <text class="l renvoi" x="10" y="324">traiter le standard comme une variable derrière une frontière d'abstraction</text>
  <rect x="0" y="350" width="445" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="368">Z5</text>
  <text class="l bande" x="27" y="368">Le contenu et l'état</text>
  <text class="l ann" x="10" y="383">Les réponses protocolaires établissent qui parle ; elles ne couvrent ni l'empoisonnement d'outils, ni l'injection</text>
  <text class="l ann" x="10" y="394">d'invites, ni l'empoisonnement de mémoire.</text>
  <text class="l renvoi" x="10" y="408">le confinement local — ch. 11 § 11.4.1</text>
  <path d="M 0 424 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="437">CONSTRUCTION D'AUTEUR : le socle porte les termes de chaque ligne, il ne porte pas le lien qui les joint. Compenser n'est pas</text>
  <text class="l ann" x="0" y="447">se conformer — une zone de compensation est un endroit où l'architecte répond de ce que personne n'a spécifié.</text>
</svg>
