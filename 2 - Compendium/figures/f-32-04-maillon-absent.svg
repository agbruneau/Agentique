<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 141" width="445" height="141" role="img" aria-label="La chaine de la loi au standard technique du cadre bancaire ouvert, et le maillon absent.">
  <!-- § 32.4, chapitre 32.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="141" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">LA LOI IMPOSE UN STANDARD TECHNIQUE UNIQUE</text>
  <rect x="0" y="14" width="95" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="31">La loi</text>
  <text class="l ann" x="9" y="44">impose un standard</text>
  <text class="l ann" x="9" y="55">technique unique</text>
  <path d="M 97.75 53.0 H 110.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 114.75 53.0 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="117" y="14" width="95" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="126" y="31">La désignation</text>
  <text class="l ann" x="126" y="44">par arrêté du ministre</text>
  <text class="l ann" x="126" y="55">des Finances, d'un</text>
  <text class="l ann" x="126" y="66">organisme de</text>
  <text class="l ann" x="126" y="77">normalisation</text>
  <path d="M 214.75 53.0 H 230.75" fill="none" stroke="#737373" stroke-width=".9" stroke-dasharray="2.5 2"/>
  <text class="l annf" x="222.75" y="47.0" text-anchor="middle">✕</text>
  <rect x="234" y="14" width="95" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="243" y="31">Le standard</text>
  <text class="l ann" x="243" y="44">reste à fixer</text>
  <path d="M 331.75 53.0 H 344.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 348.75 53.0 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="350" y="14" width="95" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="359" y="31">L'interface</text>
  <text class="l ann" x="359" y="44">n'existe pas</text>
  <text class="l annf" x="0" y="106">Sans organisme désigné, pas de standard ; sans standard, pas d'interface — la chaîne s'arrête ici.</text>
  <path d="M 0 112 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="125">C'est un FAIT NÉGATIF VÉRIFIÉ, non une absence de documentation — et c'est la formulation la plus stricte du Livre. L'état de</text>
  <text class="l ann" x="0" y="135">la désignation est porté par le ch. 30 § 30.3, et il n'est pas doublé ici.</text>
</svg>
