<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 231" width="445" height="231" role="img" aria-label="Les quatre grandeurs de la grille minimale d'indicateurs de l'AgentOps.">
  <!-- Tableau 40.2, § 40.2.2, chapitre 40 — construction d'auteur en totalité.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="231" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE GRANDEURS, QUATRE MANQUES</text>
  <rect x="0" y="14" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Disponibilité du parc</text>
  <text class="l ann" x="10" y="47">Dénombrement des agents identifiables à l'instant t.</text>
  <text class="l renvoi" x="10" y="72">E-23 attend un inventaire — attente sous condition</text>
  <rect x="230" y="14" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">2</text>
  <text class="l bande" x="251" y="32">Couverture de traçabilité</text>
  <text class="l ann" x="240" y="47">Part des actions tracées et rattachées à une identité</text>
  <text class="l ann" x="240" y="58">émise et à un mandat.</text>
  <text class="l renvoi" x="240" y="72">l'art. 12.1 impose la restitution des facteurs et paramètres</text>
  <text class="l renvoi" x="240" y="82">sur demande</text>
  <rect x="0" y="108" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="126">3</text>
  <text class="l bande" x="21" y="126">Délai de révocation</text>
  <text class="l ann" x="10" y="141">Durée entre la décision de retrait et le refus par le</text>
  <text class="l ann" x="10" y="152">dernier point d'application.</text>
  <text class="l renvoi" x="10" y="166">aucun cadre canadien instruit ne fixe de délai de propagation</text>
  <rect x="230" y="108" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="126">4</text>
  <text class="l bande" x="251" y="126">Fraîcheur des évaluations</text>
  <text class="l ann" x="240" y="141">Âge de la dernière évaluation de chaque agent, rapporté</text>
  <text class="l ann" x="240" y="152">à un seuil.</text>
  <text class="l renvoi" x="240" y="166">deux attentes, aucune exigence</text>
  <path d="M 0 192 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="205">CONSTRUCTION D'AUTEUR EN TOTALITÉ, et aucune valeur n'est prescrite. La colonne qui compte est la dernière : pour chacune des</text>
  <text class="l ann" x="0" y="215">quatre grandeurs, quelque chose manque encore pour que l'indicateur se calcule — et l'une d'elles n'a même pas d'exigence de</text>
  <text class="l ann" x="0" y="225">délai au socle.</text>
</svg>
