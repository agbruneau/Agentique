<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 108" width="445" height="108" role="img" aria-label="La propagation d'un contexte de trace a travers plusieurs agents, et son point de rupture.">
  <!-- § 38.3, chapitre 38.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="108" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">UN IDENTIFIANT DE TRACE, ET LES FRONTIÈRES QU'IL DOIT FRANCHIR</text>
  <rect x="0" y="14" width="134" height="45" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="31">Appelant</text>
  <text class="l ann" x="9" y="44">ouvre la trace, émet le contexte</text>
  <path d="M 136.66666666666666 36.5 H 149.66666666666666" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 153.66666666666666 36.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="156" y="14" width="134" height="45" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="165" y="31">Agent</text>
  <text class="l ann" x="165" y="44">doit le propager à son tour</text>
  <path d="M 292.66666666666663 36.5 H 308.66666666666663" fill="none" stroke="#737373" stroke-width=".9" stroke-dasharray="2.5 2"/>
  <text class="l annf" x="300.66666666666663" y="30.5" text-anchor="middle">✕</text>
  <rect x="311" y="14" width="134" height="45" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="320" y="31">Outil</text>
  <text class="l ann" x="320" y="44">le reçoit — ou ne le reçoit pas</text>
  <text class="l annf" x="0" y="73">Au franchissement d'une frontière d'agents, rien ne garantit que le contexte soit repropagé.</text>
  <path d="M 0 79 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="92">La propagation est un mécanisme du monde applicatif, transposé : ce qui traverse une frontière d'agents n'est pas garanti d'y</text>
  <text class="l ann" x="0" y="102">survivre, et une trace interrompue ne se recolle pas après coup. Le ch. 3 § 3.4.5 en porte le versant classique.</text>
</svg>
