<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 126" width="445" height="126" role="img" aria-label="La chaine de souscription vie acceleree, et les deux regimes qu'elle declenche.">
  <!-- § 34.3.1, chapitre 34.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="126" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">LA CHAÎNE TYPE, ET CE QUI MORD À CHAQUE MAILLON</text>
  <rect x="0" y="14" width="95" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="31">Preuves</text>
  <text class="l ann" x="9" y="44">récupération de pièces</text>
  <text class="l ann" x="9" y="55">hétérogènes — dont la</text>
  <text class="l ann" x="9" y="66">donnée de santé</text>
  <path d="M 97.75 47.5 H 110.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 114.75 47.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="117" y="14" width="95" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="126" y="31">Règles</text>
  <text class="l ann" x="126" y="44">application des règles</text>
  <text class="l ann" x="126" y="55">de mortalité</text>
  <path d="M 214.75 47.5 H 227.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 231.75 47.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="234" y="14" width="95" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="243" y="31">Tarification</text>
  <text class="l ann" x="243" y="44">du risque, sur une</text>
  <text class="l ann" x="243" y="55">personne physique —</text>
  <text class="l ann" x="243" y="66">haut risque</text>
  <path d="M 331.75 47.5 H 344.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 348.75 47.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="350" y="14" width="95" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="359" y="31">Décision</text>
  <text class="l ann" x="359" y="44">sans intervention</text>
  <text class="l ann" x="359" y="55">humaine : art. 12.1</text>
  <path d="M 0 87 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="100">DEUX RÉGIMES SE DÉCLENCHENT ENSEMBLE : c'est une décision de tarification du risque sur une personne physique — donc</text>
  <text class="l ann" x="0" y="110">explicitement de HAUT RISQUE — et, rendue sans intervention humaine, une décision EXCLUSIVEMENT AUTOMATISÉE qui déclenche les</text>
  <text class="l ann" x="0" y="120">obligations de l'article 12.1 (ch. 27 § 27.2).</text>
</svg>
