<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 219" width="445" height="219" role="img" aria-label="Les trois qualifications possibles d'un agent financier : systeme TIC, modele, decision automatisee.">
  <!-- Tableau 30.1, § 30.2.1, chapitre 30.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="219" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS DÉCLENCHEURS, ET ILS SE CUMULENT</text>
  <circle cx="185.1" cy="60" r="52" fill="#FAF5F0" fill-opacity=".55" stroke="#C2C2C2" stroke-width=".6"/>
  <circle cx="259.9" cy="60" r="52" fill="#FAF5F0" fill-opacity=".55" stroke="#C2C2C2" stroke-width=".6"/>
  <circle cx="222.5" cy="108" r="52" fill="#FAF5F0" fill-opacity=".55" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="185" y="24" text-anchor="middle">Système TIC</text>
  <text class="l ann" x="185" y="36" text-anchor="middle">dès qu'il s'exécute chez un tiers</text>
  <text class="l bande" x="260" y="24" text-anchor="middle">Modèle</text>
  <text class="l ann" x="260" y="36" text-anchor="middle">dès qu'il décide</text>
  <text class="l bande" x="222" y="154" text-anchor="middle">Décision automatisée</text>
  <text class="l ann" x="222" y="166" text-anchor="middle">dès qu'elle est opposable au</text>
  <text class="l ann" x="222" y="176" text-anchor="middle">client</text>
  <text class="l rang" x="222" y="86" text-anchor="middle">les trois</text>
  <path d="M 0 180 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="193">Le point méthodologique décisif est LA COEXISTENCE : les trois qualifications ne s'excluent pas. Un agent qui s'exécute chez</text>
  <text class="l ann" x="0" y="203">un tiers, qui décide, et dont la décision est opposable au client relève des trois régimes en même temps — et de leurs trois</text>
  <text class="l ann" x="0" y="213">calendriers.</text>
</svg>
