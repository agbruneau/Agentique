<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 145" width="445" height="145" role="img" aria-label="Le point de decision et le point d'application de politique dans un maillage d'agents.">
  <!-- § 37.5, chapitre 37.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="145" fill="#FDFBF9"/>
  <text class="l titreg" x="0" y="8">POINT DE DÉCISION (PDP)</text>
  <rect x="0" y="14" width="210" height="83" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="30">Où la politique est évaluée</text>
  <text class="l ann" x="9" y="46">Reçoit le contexte de la requête</text>
  <text class="l ann" x="9" y="65">Rend un verdict</text>
  <text class="l ann" x="9" y="84">Ne voit pas nécessairement l'exécution</text>
  <text class="l annf" x="0" y="110">le vocabulaire vient de NIST SP 800-207</text>
  <text class="l titre" x="236" y="8">POINT D'APPLICATION (PEP)</text>
  <rect x="236" y="14" width="210" height="83" fill="#FFFFFF" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l bande" x="245" y="30">Où le verdict mord</text>
  <text class="l ann" x="245" y="46">À l'arête, entre deux agents</text>
  <text class="l ann" x="245" y="65">Refuse ou laisse passer</text>
  <text class="l ann" x="245" y="84">ce qu'il doit lire d'un agent n'est pas documenté</text>
  <text class="l annf" x="236" y="110">siège : ce chapitre</text>
  <path d="M 0 116 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="129">Le vocabulaire existe et il est BORNÉ : le socle ne porte pas ce que le point d'application devrait LIRE quand l'appelant est</text>
  <text class="l ann" x="0" y="139">un agent, et le point d'application, quand il existe, peut ne pas couvrir ce qu'on croit (§ 37.5.3, § 37.5.4).</text>
</svg>
