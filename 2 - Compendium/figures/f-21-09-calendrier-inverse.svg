<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 137" width="445" height="137" role="img" aria-label="Le calendrier de migration post-quantique lu a rebours, de l'echeance vers le present.">
  <!-- § 21.9, chapitre 21.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="137" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">SE LIT À REBOURS, NON DANS LE SENS DE LA LECTURE</text>
  <path d="M 0 40 H 439" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 0 40 l 6 -3 v 6 z" fill="#9A3B12"/>
  <circle cx="5.0" cy="40" r="3.2" fill="#9A3B12"/>
  <text class="l date" x="0" y="30">Échéance</text>
  <text class="l annf" x="0" y="56">La date la plus contraignante</text>
  <text class="l ann" x="0" y="69">celle qui s'applique</text>
  <text class="l ann" x="0" y="80">réellement à l'institution —</text>
  <text class="l ann" x="0" y="91">et le socle établit qu'elles</text>
  <text class="l ann" x="0" y="102">ne sont pas une</text>
  <circle cx="116.2" cy="40" r="3.2" fill="#FDFBF9" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l date" x="111" y="30">−1</text>
  <text class="l annf" x="111" y="56">Migration exécutée</text>
  <text class="l ann" x="111" y="69">les artefacts de longue durée</text>
  <text class="l ann" x="111" y="80">sont réémis</text>
  <circle cx="227.5" cy="40" r="3.2" fill="#FDFBF9" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l date" x="222" y="30">−2</text>
  <text class="l annf" x="222" y="56">Patrons de migration</text>
  <text class="l ann" x="222" y="69">sans rupture de la chaîne de</text>
  <text class="l ann" x="222" y="80">confiance (§ 21.6)</text>
  <circle cx="338.8" cy="40" r="3.2" fill="#9A3B12"/>
  <text class="l date" x="334" y="30">Aujourd'hui</text>
  <text class="l annf" x="334" y="56">Inventaire</text>
  <text class="l ann" x="334" y="69">la méthode est au § 21.8 ;</text>
  <text class="l ann" x="334" y="80">sans inventaire, aucune des</text>
  <text class="l ann" x="334" y="91">dates ne se calcule</text>
  <path d="M 0 108 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="121">La fenêtre est une CONSTRUCTION DE LA SOMME. Le socle porte des échéances datées ; il ne porte AUCUN délai de mise en œuvre</text>
  <text class="l ann" x="0" y="131">applicable à une institution — et encore faut-il savoir laquelle des dates publiées s'applique.</text>
</svg>
