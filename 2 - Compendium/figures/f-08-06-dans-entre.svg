<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 145" width="445" height="145" role="img" aria-label="La repartition declaree entre l'axe agent-outil et l'axe agent-agent.">
  <!-- § 8.6.3, chapitre 8.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="145" fill="#FDFBF9"/>
  <text class="l titreg" x="0" y="8">DANS LES AGENTS</text>
  <rect x="0" y="14" width="210" height="83" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="30">Axe vertical — agent-outil</text>
  <text class="l ann" x="9" y="46">L'intégration des outils et du contexte</text>
  <text class="l ann" x="9" y="65">Au niveau de l'agent individuel</text>
  <text class="l ann" x="9" y="84">ch. 8 § 8.1 à § 8.3</text>
  <text class="l annf" x="0" y="110">un agent étend ses capacités</text>
  <text class="l titre" x="236" y="8">ENTRE LES AGENTS</text>
  <rect x="236" y="14" width="210" height="83" fill="#FFFFFF" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l bande" x="245" y="30">Axe horizontal — agent-agent</text>
  <text class="l ann" x="245" y="46">La communication et la coordination</text>
  <text class="l ann" x="245" y="65">Entre agents autonomes, par-delà les frontières</text>
  <text class="l ann" x="245" y="84">ch. 8 § 8.4 à § 8.6</text>
  <text class="l annf" x="236" y="110">des agents se délèguent des tâches</text>
  <path d="M 0 116 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="129">CETTE DOCTRINE EST CELLE DU PROJET AGENT-AGENT. Elle est déclarée par une partie, et le socle la trace comme telle : une</text>
  <text class="l ann" x="0" y="139">complémentarité affirmée par l'un des deux n'est pas un constat des deux.</text>
</svg>
