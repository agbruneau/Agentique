<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 191" width="445" height="191" role="img" aria-label="Le cadre ArchiMate croisant les domaines et les aspects.">
  <!-- § 44.0.2 et § 44.0.3, chapitre 44.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="191" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">DOMAINES × ASPECTS, ET LE VERROU</text>
  <text class="l annf" x="113" y="28">Actif — structure</text>
  <text class="l annf" x="225" y="28">Comportement</text>
  <text class="l annf" x="338" y="28">Passif — objets</text>
  <path d="M 0 41 H 445" fill="none" stroke="#212121" stroke-width="1.1"/>
  <text class="l annf" x="0" y="59">Business</text>
  <text class="l ann" x="113" y="59">Rôle, acteur,</text>
  <text class="l ann" x="113" y="70">collaboration</text>
  <text class="l ann" x="225" y="59">Processus, fonction,</text>
  <text class="l ann" x="225" y="70">interaction</text>
  <text class="l ann" x="338" y="59">Objet métier</text>
  <text class="l annf" x="0" y="89">Application</text>
  <path d="M 0 73 H 445" fill="none" stroke="#C2C2C2" stroke-width=".5"/>
  <text class="l ann" x="113" y="89">Composant, interface,</text>
  <text class="l ann" x="113" y="100">collaboration</text>
  <text class="l ann" x="225" y="89">Service, fonction, flux</text>
  <text class="l ann" x="338" y="89">Objet de données</text>
  <text class="l annf" x="0" y="119">Technology</text>
  <path d="M 0 103 H 445" fill="none" stroke="#C2C2C2" stroke-width=".5"/>
  <text class="l ann" x="113" y="119">Nœud, dispositif</text>
  <text class="l ann" x="225" y="119">Service technique</text>
  <text class="l ann" x="338" y="119">Artefact</text>
  <path d="M 0 133 H 445" fill="none" stroke="#212121" stroke-width="1.1"/>
  <text class="l renvoi" x="0" y="146">Aucune case ne porte d'élément « agent » : la spécialisation est le seul recours.</text>
  <path d="M 0 152 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="165">AUCUN ÉLÉMENT NATIF NE DÉSIGNE UN AGENT (§ 44.1.1). Les concepts agentiques ne se posent dans ce cadre que par SPÉCIALISATION</text>
  <text class="l ann" x="0" y="175">d'éléments existants — c'est le verrou méthodologique du chapitre, et la figure le montre en laissant les cases telles qu'elles</text>
  <text class="l ann" x="0" y="185">sont.</text>
</svg>
