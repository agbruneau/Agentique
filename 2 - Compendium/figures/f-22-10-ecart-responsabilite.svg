<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 107" width="445" height="107" role="img" aria-label="Les quatre parties entre lesquelles l'imputabilite juridique reste indeterminee.">
  <!-- § 22.10, chapitre 22 — préparé ici, exploité au ch. 29 § 29.3.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="107" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE PARTIES, UNE IMPUTABILITÉ INDÉTERMINÉE</text>
  <rect x="0" y="14" width="100" height="58" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Le développeur</text>
  <text class="l ann" x="10" y="47">Qui a écrit l'agent.</text>
  <rect x="115" y="14" width="100" height="58" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="125" y="32">2</text>
  <text class="l bande" x="136" y="32">L'organisation</text>
  <text class="l ann" x="125" y="47">Qui impose le cadre.</text>
  <rect x="230" y="14" width="100" height="58" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">3</text>
  <text class="l bande" x="251" y="32">Le fournisseur</text>
  <text class="l ann" x="240" y="47">Du modèle.</text>
  <rect x="345" y="14" width="100" height="58" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="355" y="32">4</text>
  <text class="l bande" x="366" y="32">Le système</text>
  <text class="l ann" x="355" y="47">Dont le comportement</text>
  <text class="l ann" x="355" y="58">est émergent.</text>
  <path d="M 0 78 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="91">La section PRÉPARE l'écart, elle ne le traite pas : l'imputabilité du comportement émergent est au ch. 29 § 29.3.</text>
  <text class="l ann" x="0" y="101">L'indétermination est celle du manifeste, et la somme n'y répond pas — elle en fixe le lieu.</text>
</svg>
