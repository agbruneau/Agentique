<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 138" width="445" height="138" role="img" aria-label="L'exigence de qualification temporelle sur l'axe canadien et quebecois du maillage reglementaire.">
  <!-- § 30.2.7, chapitre 30 — reçu du Vol. I, en [C].
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="138" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS ÉTATS, ET UNE ERREUR DE DATE INVERSE LE SENS</text>
  <rect x="0" y="14" width="138" height="89" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">En vigueur</text>
  <text class="l ann" x="10" y="47">L'obligation est opposable</text>
  <text class="l ann" x="10" y="58">aujourd'hui.</text>
  <text class="l renvoi" x="10" y="83">art. 12.1 — depuis le 22 sept. 2023</text>
  <rect x="153" y="14" width="138" height="89" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">Publié, non encore opposable</text>
  <text class="l ann" x="163" y="47">Le texte est arrêté ; la date</text>
  <text class="l ann" x="163" y="58">d'application ne l'est pas</text>
  <text class="l ann" x="163" y="69">atteinte.</text>
  <text class="l renvoi" x="163" y="83">E-23 — opposable le 1ᵉʳ mai 2027</text>
  <rect x="307" y="14" width="138" height="89" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">Sans date opposable</text>
  <text class="l ann" x="317" y="47">Le texte ne crée ni ne modifie</text>
  <text class="l ann" x="317" y="58">aucune exigence.</text>
  <text class="l renvoi" x="317" y="83">avis 11-348 — les lois existantes</text>
  <text class="l renvoi" x="317" y="93">s'appliquent</text>
  <path d="M 0 109 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="122">CETTE SOUS-SECTION EST REÇUE DU VOL. I, EN [C], et elle recoupe la matière que les ch. 25 à 28 portent à leurs propres</text>
  <text class="l ann" x="0" y="132">régimes. EN CAS D'ÉCART, CE SONT EUX QUI FONT FOI : ils résolvent contre le Vol. II et le Vol. III, à des niveaux supérieurs.</text>
</svg>
