<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 117" width="445" height="117" role="img" aria-label="Les trois objets que la pratique confond : memoire, recuperation, protocole d'acces.">
  <!-- Tableau 5.1, § 5.0, chapitre 5.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="117" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS OBJETS, TROIS PROVENANCES</text>
  <rect x="0" y="14" width="138" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Mémoire</text>
  <text class="l ann" x="10" y="47">Ce que l'agent produit et conserve</text>
  <text class="l ann" x="10" y="58">de sa propre activité.</text>
  <text class="l renvoi" x="10" y="72">interne, écrite par l'agent</text>
  <rect x="153" y="14" width="138" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">Récupération</text>
  <text class="l ann" x="163" y="47">Ce qu'il va chercher dans un</text>
  <text class="l ann" x="163" y="58">corpus tiers.</text>
  <text class="l renvoi" x="163" y="72">externe, écrite par d'autres</text>
  <rect x="307" y="14" width="138" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">Protocole d'accès</text>
  <text class="l ann" x="317" y="47">La tuyauterie qui relie l'un et</text>
  <text class="l ann" x="317" y="58">l'autre aux sources.</text>
  <text class="l renvoi" x="317" y="72">ni l'un ni l'autre — un transport</text>
  <path d="M 0 88 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="101">Les trois n'ont NI LE MÊME CYCLE DE VIE NI LA MÊME GOUVERNANCE. Les confondre revient à gouverner l'un par les règles de</text>
  <text class="l ann" x="0" y="111">l'autre — une mémoire interne traitée comme un corpus tiers, ou l'inverse.</text>
</svg>
