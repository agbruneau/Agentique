<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 159" width="445" height="159" role="img" aria-label="Les onze evenements de peremption de la somme, avec leur tri prospectif.">
  <!-- Tableau 50.1, § 50.2, chapitre 50 — état au gel.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="159" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">ONZE ÉVÉNEMENTS, ET TROIS ÉTATS</text>
  <rect x="0" y="14" width="138" height="100" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">survenu</text>
  <text class="l bande" x="57" y="32">Révisions protocolaires</text>
  <text class="l ann" x="10" y="47">La couche protocolaire du Livre I</text>
  <text class="l ann" x="10" y="58">se périme au rythme de ses DEUX</text>
  <text class="l ann" x="10" y="69">spécifications, non de la seule</text>
  <text class="l ann" x="10" y="80">première.</text>
  <text class="l renvoi" x="10" y="94">payé — ch. 8, revalidation du 30</text>
  <text class="l renvoi" x="10" y="104">juillet 2026</text>
  <rect x="153" y="14" width="138" height="100" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">à moitié</text>
  <text class="l bande" x="216" y="32">Transfert de gouvernance</text>
  <text class="l ann" x="163" y="47">L'annonce du don est établie ; la</text>
  <text class="l ann" x="163" y="58">suite ne l'est pas.</text>
  <text class="l renvoi" x="163" y="94">candidat survenu à moitié, et c'est la</text>
  <text class="l renvoi" x="163" y="104">moitié qui compte</text>
  <rect x="307" y="14" width="138" height="100" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">attendu</text>
  <text class="l bande" x="364" y="32">Désignation de l'organisme</text>
  <text class="l ann" x="317" y="47">Fait négatif vérifié : quatre</text>
  <text class="l ann" x="317" y="58">chaînes, trois textes, zéro</text>
  <text class="l ann" x="317" y="69">occurrence.</text>
  <text class="l renvoi" x="317" y="94">ch. 32 — ce qui se refait est tout le</text>
  <text class="l renvoi" x="317" y="104">chapitre</text>
  <path d="M 0 120 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="133">UN ÉVÉNEMENT SURVENU N'EST PAS UN ÉVÉNEMENT PAYÉ. L'un des onze est survenu à moitié — l'annonce est établie, la suite ne</text>
  <text class="l ann" x="0" y="143">l'est pas —, et un autre est le seul du corpus dont le dispositif ait été éprouvé par le réel (ch. 8, revalidation du 30</text>
  <text class="l ann" x="0" y="153">juillet 2026).</text>
</svg>
