<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 191" width="445" height="191" role="img" aria-label="Les quatre strates de la pile protocolaire agentique, dont l'identite qui est transversale.">
  <!-- Tableau 9.2, § 9.2.2 et § 9.2.3, chapitre 9.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="191" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS STRATES EMPILÉES</text>
  <rect x="0" y="14" width="231" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="31">3</text>
  <text class="l bande" x="21" y="31">Sémantique et orchestration</text>
  <text class="l ann" x="10" y="44">L'écart entre accord de protocole et compréhension — § 9.4.</text>
  <rect x="0" y="59" width="231" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="76">2</text>
  <text class="l bande" x="21" y="76">Découverte et capacités</text>
  <text class="l ann" x="10" y="89">Trouver, sélectionner, résoudre — § 9.1.</text>
  <rect x="0" y="104" width="231" height="52" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="121">1</text>
  <text class="l bande" x="21" y="121">Transport et session</text>
  <text class="l ann" x="10" y="134">Trajectoire vers le découplage, liaisons multiples — ch. 8 §</text>
  <text class="l ann" x="10" y="145">8.1.3.</text>
  <text class="l annf" x="247.4" y="26">Identité et confiance</text>
  <text class="l ann" x="247.4" y="38">Transversale : elle ne s'empile pas, elle traverse les</text>
  <text class="l ann" x="247.4" y="49">trois autres. Traitée au ch. 3 et dans tout le Livre II.</text>
  <path d="M 0 162 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="175">L'analogie en couches a une limite, et elle est portée par la quatrième strate : l'identité et la confiance NE S'EMPILENT PAS,</text>
  <text class="l ann" x="0" y="185">elles traversent tout. Une pile qui la dessinerait comme un étage dirait le contraire du chapitre.</text>
</svg>
