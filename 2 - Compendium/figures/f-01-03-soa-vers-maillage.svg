<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 128" width="445" height="128" role="img" aria-label="Quatre etages d'architecture d'integration, de la SOA au maillage de services, et le couplage que chacun deplace.">
  <!-- § 1.3, chapitre 1.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="128" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE ÉTAGES, UN COUPLAGE QUI SE DÉPLACE</text>
  <rect x="0" y="14" width="100" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">SOA</text>
  <text class="l ann" x="10" y="47">Contrat de service</text>
  <text class="l ann" x="10" y="58">explicite, découverte,</text>
  <text class="l ann" x="10" y="69">composition.</text>
  <text class="l renvoi" x="10" y="83">§ 1.3.1</text>
  <path d="M 103.0 53.5 H 110.0" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 114.0 53.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="115" y="14" width="100" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="125" y="32">2</text>
  <text class="l bande" x="136" y="32">ESB</text>
  <text class="l ann" x="125" y="47">Le bus centralise</text>
  <text class="l ann" x="125" y="58">routage et</text>
  <text class="l ann" x="125" y="69">transformation.</text>
  <text class="l renvoi" x="125" y="83">§ 1.3.2</text>
  <path d="M 218.0 53.5 H 225.0" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 229.0 53.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="230" y="14" width="100" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">3</text>
  <text class="l bande" x="251" y="32">Microservices</text>
  <text class="l ann" x="240" y="47">Décentralisation,</text>
  <text class="l ann" x="240" y="58">communication</text>
  <text class="l ann" x="240" y="69">inter-services.</text>
  <text class="l renvoi" x="240" y="83">§ 1.3.3</text>
  <path d="M 333.0 53.5 H 340.0" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 344.0 53.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="345" y="14" width="100" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="355" y="32">4</text>
  <text class="l bande" x="366" y="32">Maillage</text>
  <text class="l ann" x="355" y="47">Les préoccupations</text>
  <text class="l ann" x="355" y="58">transversales quittent</text>
  <text class="l ann" x="355" y="69">chaque service.</text>
  <text class="l renvoi" x="355" y="83">§ 1.3.4</text>
  <path d="M 0 99 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="112">Chaque étage déplace le couplage, aucun ne le supprime. Le maillage n'est ici que le socle transposable — sa déclinaison</text>
  <text class="l ann" x="0" y="122">agentique est le ch. 37, et ce chapitre ne la construit pas.</text>
</svg>
