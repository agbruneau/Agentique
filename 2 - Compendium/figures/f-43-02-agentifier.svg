<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 134" width="445" height="134" role="img" aria-label="L'arbre de decision entre une orchestration deterministe et une orchestration agentique.">
  <!-- § 43.2.3, chapitre 43.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="134" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">LA QUESTION SE POSE AVANT L'ARCHITECTURE</text>
  <text class="l bande" x="0" y="24">L'enchaînement peut-il être décidé d'avance ?</text>
  <path d="M 12 36 H 368" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <path d="M 78 36 V 44" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 78 48 l -3 -4 h 6 z" fill="#9A3B12"/>
  <text class="l rang" x="12" y="58">oui</text>
  <rect x="12" y="62" width="131" height="37" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="21" y="78">S'abstenir</text>
  <text class="l ann" x="21" y="91">un cadre déterministe fait le</text>
  <text class="l ann" x="21" y="102">travail, à coût prévisible et</text>
  <text class="l ann" x="21" y="113">chemin testable — ch. 22 § 22.5</text>
  <path d="M 222 36 V 44" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 222 48 l -3 -4 h 6 z" fill="#9A3B12"/>
  <text class="l rang" x="157" y="58">non</text>
  <rect x="157" y="62" width="131" height="37" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="166" y="78">Agentifier, encadré</text>
  <text class="l ann" x="166" y="91">le non-déterminisme apporte une</text>
  <text class="l ann" x="166" y="102">valeur, et l'encadrement en</text>
  <text class="l ann" x="166" y="113">borne le domaine — OO3 ou OO4</text>
  <path d="M 368 36 V 44" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 368 48 l -3 -4 h 6 z" fill="#9A3B12"/>
  <text class="l rang" x="302" y="58">sous le seuil</text>
  <rect x="302" y="62" width="131" height="37" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="311" y="78">Ne pas descendre</text>
  <text class="l ann" x="311" y="91">autorisation et règlement</text>
  <text class="l ann" x="311" y="102">restent déterministes — ch. 36 §</text>
  <text class="l ann" x="311" y="113">36.2.1</text>
  <path d="M 0 105 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="118">La grille est un CRITÈRE D'AUTEUR : le socle ne porte pas de règle d'abstention. Elle réordonne ce que les chapitres</text>
  <text class="l ann" x="0" y="128">établissent — elle n'ajoute pas d'exigence, et elle ne dispense d'aucune.</text>
</svg>
