<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 105" width="445" height="105" role="img" aria-label="Les trois leviers de la reponse a incident agentique et leur ordre.">
  <!-- § 39.3, chapitre 39.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="105" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS LEVIERS, DANS CET ORDRE</text>
  <rect x="0" y="14" width="134" height="56" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="31">Révoquer</text>
  <text class="l ann" x="9" y="44">retirer ce qui autorise — et la</text>
  <text class="l ann" x="9" y="55">cascade n'est pas documentée</text>
  <path d="M 136.66666666666666 42.0 H 149.66666666666666" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 153.66666666666666 42.0 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="156" y="14" width="134" height="56" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="165" y="31">Confiner</text>
  <text class="l ann" x="165" y="44">borner le rayon plutôt que</text>
  <text class="l ann" x="165" y="55">prévenir — ch. 11 § 11.4.1</text>
  <path d="M 292.66666666666663 42.0 H 305.66666666666663" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 309.66666666666663 42.0 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="311" y="14" width="134" height="56" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="320" y="31">Imputer</text>
  <text class="l ann" x="320" y="44">rattacher l'action à un</text>
  <text class="l ann" x="320" y="55">responsable — Q-E de la grille</text>
  <path d="M 0 76 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="89">Le premier levier suppose ce que le ch. 20 § 20.6 déclare absent : aucun mécanisme de révocation en cascade n'est documenté.</text>
  <text class="l ann" x="0" y="99">Révoquer à la racine ne dit rien de ce qui en a été dérivé, et la séquence ne se déroule pas d'elle-même.</text>
</svg>
