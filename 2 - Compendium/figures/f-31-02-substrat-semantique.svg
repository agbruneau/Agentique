<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 202" width="445" height="202" role="img" aria-label="Les trois couches du substrat semantique financier : messagerie, capacite, ontologie.">
  <!-- Tableau 31.2, § 31.2.1, chapitre 31 — repris du Vol. I en [C].
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="202" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS COUCHES, TROIS APPORTS</text>
  <rect x="0" y="14" width="445" height="52" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="31">3</text>
  <text class="l bande" x="21" y="31">Ontologie / sémantique</text>
  <text class="l ann" x="10" y="44">Le sens partagé et les relations logiques. L'agent en tire un garde-fou déterministe pour désambiguïser un terme avant</text>
  <text class="l ann" x="10" y="55">d'agir.</text>
  <rect x="0" y="70" width="445" height="52" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="87">2</text>
  <text class="l bande" x="21" y="87">Modèle / capacité / cycle de vie</text>
  <text class="l ann" x="10" y="100">Ce que fait une institution et comment ses opérations s'enchaînent. L'agent en tire le découpage en capacités bornées qui</text>
  <text class="l ann" x="10" y="111">délimite son périmètre d'action.</text>
  <rect x="0" y="126" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="143">1</text>
  <text class="l bande" x="21" y="143">Messagerie / syntaxe</text>
  <text class="l ann" x="10" y="156">Le format d'échange sur le fil. L'agent en tire des champs structurés et des messages validables par schéma.</text>
  <path d="M 0 173 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="186">Repris du Vol. I en régime [C] : c'est une lecture d'un volume source, non un balayage conduit par la somme. La troisième</text>
  <text class="l ann" x="0" y="196">couche est celle qui fait le garde-fou DÉTERMINISTE — les deux premières structurent, elles ne désambiguïsent pas.</text>
</svg>
