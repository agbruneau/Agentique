<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 166" width="445" height="166" role="img" aria-label="La longevite d'un artefact d'identite comparee a l'horloge de la menace post-quantique.">
  <!-- § 21.2, chapitre 21.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="166" fill="#FDFBF9"/>
  <text class="l titreg" x="0" y="8">CE QUE LE SOCLE ÉTABLIT</text>
  <rect x="0" y="14" width="210" height="94" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="30">La longévité des artefacts</text>
  <text class="l ann" x="9" y="46">Un artefact d'identité de longue durée survit à</text>
  <text class="l ann" x="9" y="57">l'horloge</text>
  <text class="l ann" x="9" y="76">Les échéances publiées sont datées et sourcées (§ 21.1)</text>
  <text class="l ann" x="9" y="95">L'inventaire par artefact est dressé (§ 21.3)</text>
  <text class="l annf" x="0" y="121">faits établis, avec leurs bornes</text>
  <text class="l titre" x="236" y="8">CE QUE LE RAISONNEMENT AJOUTE</text>
  <rect x="236" y="14" width="210" height="94" fill="#FFFFFF" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l bande" x="245" y="30">La collecte anticipée</text>
  <text class="l ann" x="245" y="46">Ce qui est chiffré aujourd'hui peut être conservé</text>
  <text class="l ann" x="245" y="65">et déchiffré quand l'horloge aura tourné</text>
  <text class="l ann" x="245" y="84">ni mécanique ni faisabilité datée au socle</text>
  <text class="l annf" x="236" y="121">degré 3 — le raisonnement quitte le socle ici</text>
  <path d="M 0 127 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="140">Le socle NE DOCUMENTE PAS la collecte anticipée en vue d'un déchiffrement ultérieur — degré 3. Cette section ne s'écrit pas</text>
  <text class="l ann" x="0" y="150">comme un chapitre de fait mais comme un RAISONNEMENT D'ARCHITECTURE appuyé sur des faits établis, et elle dit où le</text>
  <text class="l ann" x="0" y="160">raisonnement quitte le socle.</text>
</svg>
