<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 405" width="445" height="405" role="img" aria-label="Les huit couches du blueprint instancie, avec le statut date de chacune.">
  <!-- Tableau 45.2, § 45.2, chapitre 45.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="405" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">HUIT COUCHES, HUIT STATUTS AUTO-DÉCLARÉS</text>
  <rect x="0" y="14" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="31">C8</text>
  <text class="l bande" x="27" y="31">Gouvernance</text>
  <text class="l ann" x="10" y="44">Inventaire, cotation, documentation — ch. 25, ch. 42.</text>
  <rect x="0" y="59" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="76">C7</text>
  <text class="l bande" x="27" y="76">Exploitation</text>
  <text class="l ann" x="10" y="89">Observabilité, évaluation, incident — ch. 38 à ch. 40.</text>
  <rect x="0" y="104" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="121">C6</text>
  <text class="l bande" x="27" y="121">Données et ancrage</text>
  <text class="l ann" x="10" y="134">L'accès gouverné — ch. 5, ch. 24 § 24.4.</text>
  <rect x="0" y="149" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="166">C5</text>
  <text class="l bande" x="27" y="166">Orchestration</text>
  <text class="l ann" x="10" y="179">L'enchaînement et sa trace — ch. 22, ch. 23.</text>
  <rect x="0" y="194" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="211">C4</text>
  <text class="l bande" x="27" y="211">Maillage</text>
  <text class="l ann" x="10" y="224">Le point d'application à l'arête — ch. 37.</text>
  <rect x="0" y="239" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="256">C3</text>
  <text class="l bande" x="27" y="256">Identité et registre</text>
  <text class="l ann" x="10" y="269">L'émission et l'inscription — ch. 15, ch. 16.</text>
  <rect x="0" y="284" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="301">C2</text>
  <text class="l bande" x="27" y="301">Protocoles</text>
  <text class="l ann" x="10" y="314">Les deux axes, et le paiement — ch. 8, ch. 10.</text>
  <rect x="0" y="329" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="346">C1</text>
  <text class="l bande" x="27" y="346">Socle d'exécution</text>
  <text class="l ann" x="10" y="359">Ce sur quoi les agents s'exécutent.</text>
  <path d="M 0 376 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="389">TOUS LES STATUTS SONT AUTO-DÉCLARÉS. Une couche « livrée » l'est au dire de son fournisseur, et la somme n'a rien vérifié en</text>
  <text class="l ann" x="0" y="399">production. Instancier un blueprint ne prouve pas qu'il fonctionne — c'est ce que le § 45.0 pose, et le § 45.15 y revient.</text>
</svg>
