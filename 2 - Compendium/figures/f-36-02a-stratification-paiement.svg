<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 212" width="445" height="212" role="img" aria-label="Les trois couches de la chaine de paiement, et l'admission de l'agentique a chacune.">
  <!-- Tableau 36.1, § 36.2.1, chapitre 36 — repris du Vol. I en [C].
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="212" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS COUCHES, UNE SEULE ADMET L'AGENTIQUE</text>
  <rect x="0" y="14" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="31">3</text>
  <text class="l bande" x="21" y="31">Règlement</text>
  <text class="l ann" x="10" y="44">La finalité. NON — doit rester déterministe et fondé sur des règles.</text>
  <rect x="0" y="59" width="445" height="52" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="76">2</text>
  <text class="l bande" x="21" y="76">Autorisation</text>
  <text class="l ann" x="10" y="89">Vérifier qu'une instruction est conforme à un mandat préexistant : montant, bénéficiaire, fenêtre temporelle, politique de</text>
  <text class="l ann" x="10" y="100">consentement. NON — vérification, non délibération.</text>
  <rect x="0" y="115" width="445" height="52" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="132">1</text>
  <text class="l bande" x="21" y="132">Intention, orchestration, négociation</text>
  <text class="l ann" x="10" y="145">Interpréter un besoin exprimé en langage naturel, comparer des offres, composer un panier, préparer une instruction. OUI —</text>
  <text class="l ann" x="10" y="156">c'est là que le non-déterminisme apporte une valeur réelle.</text>
  <path d="M 0 173 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="186">L'ERREUR DE CONCEPTION À PROSCRIRE est de laisser le non-déterminisme descendre sous la première couche. L'autorisation est</text>
  <text class="l ann" x="0" y="196">une VÉRIFICATION, non une délibération ; le règlement doit rester déterministe et fondé sur des règles, identique à ce qu'il</text>
  <text class="l ann" x="0" y="206">est aujourd'hui.</text>
</svg>
