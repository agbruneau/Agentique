<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 211" width="445" height="211" role="img" aria-label="Les quatre sources de derive d'un agent en exploitation, et leur degre de documentation.">
  <!-- § 39.2, chapitre 39.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="211" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE DÉRIVES, QUATRE RÉGIMES DE PREUVE</text>
  <rect x="0" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Dérive d'outil</text>
  <text class="l ann" x="10" y="47">La mieux documentée, parce qu'un chapitre l'a instruite.</text>
  <text class="l renvoi" x="10" y="72">§ 39.2.1</text>
  <rect x="230" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">2</text>
  <text class="l bande" x="251" y="32">Dérive de modèle</text>
  <text class="l ann" x="240" y="47">N'est pas au socle — le mot ne doit pas faire croire</text>
  <text class="l ann" x="240" y="58">l'inverse.</text>
  <text class="l renvoi" x="240" y="72">§ 39.2.2</text>
  <rect x="0" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="116">3</text>
  <text class="l bande" x="21" y="116">Dérive d'autonomie</text>
  <text class="l ann" x="10" y="131">Nommée par les cadres ; le seul relevé d'instrumentation</text>
  <text class="l ann" x="10" y="142">ne l'instrumente pas.</text>
  <text class="l renvoi" x="10" y="156">§ 39.2.3</text>
  <rect x="230" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="116">4</text>
  <text class="l bande" x="251" y="116">La quatrième source</text>
  <text class="l ann" x="240" y="131">Portée par le plan, et elle n'entre pas au socle.</text>
  <text class="l renvoi" x="240" y="156">§ 39.2.4</text>
  <path d="M 0 172 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="185">LES QUATRE NE SONT PAS DOCUMENTÉES AU MÊME DEGRÉ. Une seule est instruite par un chapitre ; une n'est pas au socle et le mot</text>
  <text class="l ann" x="0" y="195">ne doit pas faire croire l'inverse ; une est nommée par les cadres sans être instrumentée ; la quatrième est portée par le plan</text>
  <text class="l ann" x="0" y="205">et n'entre pas au socle.</text>
</svg>
