<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 201" width="445" height="201" role="img" aria-label="Les quatre regimes de compatibilite de schema : ascendante, descendante, complete, transitive.">
  <!-- Tableau 2.1, § 2.1.5, chapitre 2.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="201" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE RÉGIMES, DEUX SENS D'ÉVOLUTION</text>
  <rect x="0" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Ascendante</text>
  <text class="l ann" x="10" y="47">Un consommateur mis à jour lit des données produites</text>
  <text class="l ann" x="10" y="58">selon l'ancien schéma.</text>
  <text class="l renvoi" x="10" y="72">backward</text>
  <rect x="230" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">2</text>
  <text class="l bande" x="251" y="32">Descendante</text>
  <text class="l ann" x="240" y="47">Un consommateur resté sur l'ancien schéma lit des</text>
  <text class="l ann" x="240" y="58">données produites selon le nouveau.</text>
  <text class="l renvoi" x="240" y="72">forward</text>
  <rect x="0" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="116">3</text>
  <text class="l bande" x="21" y="116">Complète</text>
  <text class="l ann" x="10" y="131">Les deux à la fois : la mise à jour des deux parties</text>
  <text class="l ann" x="10" y="142">dans un ordre quelconque.</text>
  <text class="l renvoi" x="10" y="156">full</text>
  <rect x="230" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="116">4</text>
  <text class="l bande" x="251" y="116">Transitive</text>
  <text class="l ann" x="240" y="131">La garantie s'étend à toutes les versions antérieures,</text>
  <text class="l ann" x="240" y="142">non à la seule précédente.</text>
  <text class="l renvoi" x="240" y="156">transitive</text>
  <path d="M 0 172 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="185">La compatibilité transitive est la seule qui interdise la dérive cumulative que des sauts successifs, compatibles deux à deux,</text>
  <text class="l ann" x="0" y="195">peuvent produire.</text>
</svg>
