<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 145" width="445" height="145" role="img" aria-label="La double qualification d'un agent financier, a la fois modele et service TIC fourni par un tiers.">
  <!-- § 31.1.4, chapitre 31 — siège du patron-signature pour toute la somme.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="145" fill="#FDFBF9"/>
  <text class="l titreg" x="0" y="8">L'AGENT COMME MODÈLE</text>
  <rect x="0" y="14" width="210" height="83" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="30">Parce qu'il décide</text>
  <text class="l ann" x="9" y="46">Inventaire, cotation, cycle de vie</text>
  <text class="l ann" x="9" y="65">Documentation des usages approuvés</text>
  <text class="l ann" x="9" y="84">Surveillance continue</text>
  <text class="l annf" x="0" y="110">régime du risque de modèle — ch. 25</text>
  <text class="l titre" x="236" y="8">L'AGENT COMME TIERS TIC</text>
  <rect x="236" y="14" width="210" height="83" fill="#FFFFFF" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l bande" x="245" y="30">Parce qu'il s'exécute chez un tiers</text>
  <text class="l ann" x="245" y="46">Résilience opérationnelle</text>
  <text class="l ann" x="245" y="65">Inscription au registre des tiers</text>
  <text class="l ann" x="245" y="84">Continuité et sortie</text>
  <text class="l annf" x="236" y="110">régime de la résilience — § 30.2.2</text>
  <path d="M 0 116 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="129">SIÈGE DU PATRON-SIGNATURE POUR TOUTE LA SOMME, et il n'est re-dérivé nulle part : le ch. 30 § 30.2.1 déclare lui-même ne</text>
  <text class="l ann" x="0" y="139">faire que l'instancier. Les deux qualifications ne se choisissent pas — elles se cumulent, avec leurs deux régimes.</text>
</svg>
