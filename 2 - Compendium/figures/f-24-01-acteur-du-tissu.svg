<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 145" width="445" height="145" role="img" aria-label="L'agent consommateur et l'agent producteur dans le tissu d'integration d'entreprise.">
  <!-- § 24.1.1, chapitre 24.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="145" fill="#FDFBF9"/>
  <text class="l titreg" x="0" y="8">AGENT-CONSOMMATEUR</text>
  <rect x="0" y="14" width="210" height="83" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="30">Il invoque, il lit, il interroge</text>
  <text class="l ann" x="9" y="46">Invoque une API ou un outil</text>
  <text class="l ann" x="9" y="65">Lit un flux d'événements</text>
  <text class="l ann" x="9" y="84">Interroge une source pour fonder son raisonnement</text>
  <text class="l annf" x="0" y="110">l'acteur récepteur du ch. 1</text>
  <text class="l titre" x="236" y="8">AGENT-PRODUCTEUR</text>
  <rect x="236" y="14" width="210" height="83" fill="#FFFFFF" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l bande" x="245" y="30">Il déclenche, il émet, il écrit</text>
  <text class="l ann" x="245" y="46">Déclenche un workflow</text>
  <text class="l ann" x="245" y="65">Émet un événement</text>
  <text class="l ann" x="245" y="84">Écrit dans un système d'information</text>
  <text class="l annf" x="236" y="110">l'acteur émetteur du ch. 1</text>
  <path d="M 0 116 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="129">La dualité RECOUPE celle de l'acteur émetteur et récepteur du ch. 1 : ce n'est pas une nouveauté agentique, c'est le tissu</text>
  <text class="l ann" x="0" y="139">existant qui reçoit un acteur de plus. Ce qui change n'est pas le rôle, c'est que son enchaînement n'est plus décidé d'avance.</text>
</svg>
