<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 145" width="445" height="145" role="img" aria-label="Le perimetre de ce qu'un maillage d'agents voit de la chaine de mandat, et ses trois manques.">
  <!-- § 37.8, chapitre 37.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="145" fill="#FDFBF9"/>
  <text class="l titreg" x="0" y="8">CE QU'IL VOIT</text>
  <rect x="0" y="14" width="210" height="83" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="30">Une arête, à l'instant du passage</text>
  <text class="l ann" x="9" y="46">Qui appelle qui</text>
  <text class="l ann" x="9" y="65">Ce que la politique dit de cette arête</text>
  <text class="l ann" x="9" y="84">Et il peut en produire une trace</text>
  <text class="l annf" x="0" y="110">énumérable — § 37.8.1 et § 37.8.4</text>
  <text class="l titre" x="236" y="8">CE QU'IL NE PEUT PAS SUPPLÉER</text>
  <rect x="236" y="14" width="210" height="83" fill="#FFFFFF" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l bande" x="245" y="30">Ce qui ne se lit pas sur une arête</text>
  <text class="l ann" x="245" y="46">La chaîne au-delà du saut courant</text>
  <text class="l ann" x="245" y="65">La fraîcheur du mandat invoqué</text>
  <text class="l ann" x="245" y="84">L'ancrage de l'identité qui se présente</text>
  <text class="l annf" x="236" y="110">trois entrées, aucune ne dépend du maillage</text>
  <path d="M 0 116 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="129">Ce qu'il voit EST ÉNUMÉRABLE, et l'énumération est le résultat. Les manques se lisent sur trois entrées, et AUCUNE NE DÉPEND</text>
  <text class="l ann" x="0" y="139">DU MAILLAGE : ce ne sont pas des défauts de mise en œuvre, ce sont des propriétés que l'arête ne porte pas.</text>
</svg>
