<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 190" width="445" height="190" role="img" aria-label="Les trois etages de l'evaluation de l'interoperabilite agentique.">
  <!-- Tableau 9.4, § 9.5.1, chapitre 9.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="190" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS ÉTAGES, TROIS NATURES</text>
  <rect x="0" y="14" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="31">3</text>
  <text class="l bande" x="21" y="31">Bancs de tâches inter-agents</text>
  <text class="l ann" x="10" y="44">La collaboration produit-elle le résultat attendu ? — non déterministe.</text>
  <rect x="0" y="59" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="76">2</text>
  <text class="l bande" x="21" y="76">Interopérabilité entre implémentations</text>
  <text class="l ann" x="10" y="89">Deux implémentations distinctes du même protocole se comprennent-elles ? — déterministe, plus coûteux.</text>
  <rect x="0" y="104" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="121">1</text>
  <text class="l bande" x="21" y="121">Conformité protocolaire</text>
  <text class="l ann" x="10" y="134">Un message est-il valide ? Une transition d'état légale ? — déterministe et automatisable.</text>
  <path d="M 0 151 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="164">Aucun étage ne subsume le suivant : une conformité protocolaire parfaite n'établit ni l'interopérabilité entre implémentations,</text>
  <text class="l ann" x="0" y="174">ni le résultat d'une collaboration. Le troisième étage est INTRINSÈQUEMENT NON DÉTERMINISTE, et c'est pourquoi il ne se</text>
  <text class="l ann" x="0" y="184">certifie pas comme les deux autres.</text>
</svg>
