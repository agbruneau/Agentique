<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 398" width="445" height="398" role="img" aria-label="Les cinq composants d'un agent, ce qui fait changer chacun et qui en decide.">
  <!-- Tableau 47.1, § 47.1, chapitre 47 — construction d'auteur, au 27 juillet 2026 ; le § 47.8 y renvoie.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="398" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">CINQ COMPOSANTS, CINQ HORLOGES, UN SEUL EXPLOITANT</text>
  <rect x="0" y="14" width="445" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Poids de modèle</text>
  <text class="l ann" x="10" y="47">Version publiée par son fournisseur ; retrait d'une version antérieure.</text>
  <text class="l renvoi" x="10" y="61">décidé par le fournisseur, pas l'exploitant — ch. 6 § 6.3 ; § 47.8</text>
  <rect x="0" y="87" width="445" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="105">2</text>
  <text class="l bande" x="21" y="105">Serveurs d'outils</text>
  <text class="l ann" x="10" y="120">Révision d'une définition d'outil ; ajout ou retrait d'un serveur.</text>
  <text class="l renvoi" x="10" y="134">décidé par l'éditeur, et le protocole autorise le changement à l'exécution — ch. 20 § 20.1 ; § 47.4</text>
  <rect x="0" y="160" width="445" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="178">3</text>
  <text class="l bande" x="21" y="178">Bibliothèques et hôte</text>
  <text class="l ann" x="10" y="193">Mise à jour de dépendance ; correctif de sécurité.</text>
  <text class="l renvoi" x="10" y="207">décidé par la chaîne de distribution — § 47.2, § 47.3</text>
  <rect x="0" y="233" width="445" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="251">4</text>
  <text class="l bande" x="21" y="251">Invites et instructions</text>
  <text class="l ann" x="10" y="266">Édition d'un fichier, sans compilation ni déploiement.</text>
  <text class="l renvoi" x="10" y="280">décidé par quiconque a accès au dépôt — § 47.7, § 47.8</text>
  <rect x="0" y="306" width="445" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="324">5</text>
  <text class="l bande" x="21" y="324">Politique d'autorisation</text>
  <text class="l ann" x="10" y="339">Révision d'une règle, d'une portée, d'un seuil d'approbation.</text>
  <text class="l renvoi" x="10" y="353">décidé par l'exploitant — et c'est le seul des cinq</text>
  <path d="M 0 369 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="382">UN SEUL DES CINQ EST DÉCIDÉ PAR L'EXPLOITANT. Les quatre autres changent sous la main d'un fournisseur, d'un éditeur, d'une</text>
  <text class="l ann" x="0" y="392">chaîne de distribution ou de quiconque a accès au dépôt — et le protocole autorise le deuxième à changer À L'EXÉCUTION.</text>
</svg>
