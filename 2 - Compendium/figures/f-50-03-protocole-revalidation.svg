<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 130" width="445" height="130" role="img" aria-label="La boucle du protocole de revalidation de la somme, et son declencheur.">
  <!-- § 50.3, chapitre 50.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="130" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">CE QUI SE REFAIT, ET DANS QUEL ORDRE</text>
  <rect x="0" y="14" width="95" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="31">Événement</text>
  <text class="l ann" x="9" y="44">l'un des onze</text>
  <text class="l ann" x="9" y="55">survient, et la veille</text>
  <text class="l ann" x="9" y="66">le constate</text>
  <path d="M 97.75 47.5 H 110.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 114.75 47.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="117" y="14" width="95" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="126" y="31">Extraction</text>
  <text class="l ann" x="126" y="44">le texte neuf est</text>
  <text class="l ann" x="126" y="55">extrait à sa source, à</text>
  <text class="l ann" x="126" y="66">sa date</text>
  <path d="M 214.75 47.5 H 227.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 231.75 47.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="234" y="14" width="95" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="243" y="31">Confrontation</text>
  <text class="l ann" x="243" y="44">chaque énoncé y est</text>
  <text class="l ann" x="243" y="55">confronté — non</text>
  <text class="l ann" x="243" y="66">retouché</text>
  <path d="M 331.75 47.5 H 344.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 348.75 47.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="350" y="14" width="95" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="359" y="31">Registre</text>
  <text class="l ann" x="359" y="44">le gel est repoussé,</text>
  <text class="l ann" x="359" y="55">et la date inscrite</text>
  <path d="M 398 81 V 91 H 47 V 85" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 47 81 l -3 4 h 6 z" fill="#9A3B12"/>
  <path d="M 0 101 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="114">Le protocole ne se déclenche pas seul : il suppose une VEILLE qui constate l'événement. Revalider n'est pas retoucher un</text>
  <text class="l ann" x="0" y="124">texte gelé — c'est confronter chaque énoncé au texte neuf (ch. 8, revalidation du 30 juillet 2026).</text>
</svg>
