<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 219" width="445" height="219" role="img" aria-label="La triade letale : acces a des donnees privees, exposition a du contenu non fiable, canal de sortie.">
  <!-- § 19.2, chapitre 19 — siège de la triade létale pour toute la somme.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="219" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS PROPRIÉTÉS, UNE CONJONCTION</text>
  <circle cx="185.1" cy="60" r="52" fill="#FAF5F0" fill-opacity=".55" stroke="#C2C2C2" stroke-width=".6"/>
  <circle cx="259.9" cy="60" r="52" fill="#FAF5F0" fill-opacity=".55" stroke="#C2C2C2" stroke-width=".6"/>
  <circle cx="222.5" cy="108" r="52" fill="#FAF5F0" fill-opacity=".55" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="185" y="24" text-anchor="middle">Données privées</text>
  <text class="l ann" x="185" y="36" text-anchor="middle">l'agent y a accès</text>
  <text class="l bande" x="260" y="24" text-anchor="middle">Contenu non fiable</text>
  <text class="l ann" x="260" y="36" text-anchor="middle">courriel, page web, document,</text>
  <text class="l ann" x="260" y="46" text-anchor="middle">sortie d'outil</text>
  <text class="l bande" x="222" y="154" text-anchor="middle">Canal de sortie</text>
  <text class="l ann" x="222" y="166" text-anchor="middle">vers l'extérieur</text>
  <text class="l rang" x="222" y="86" text-anchor="middle">exploitable</text>
  <path d="M 0 180 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="193">C'est une CONJONCTION, non une somme de risques : retirer l'une des trois suffit à sortir de la zone, et les trois réunies</text>
  <text class="l ann" x="0" y="203">suffisent à y entrer. Le ch. 11 § 11.1.2 n'en traite que l'amplification par la composabilité, et le ch. 20 s'y adosse — le</text>
  <text class="l ann" x="0" y="213">siège est ici.</text>
</svg>
