<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 115" width="445" height="115" role="img" aria-label="Le calendrier de la ligne directrice E-23, de sa publication a son entree en vigueur.">
  <!-- § 25.1, chapitre 25, et Tableau 26.1.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="115" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">UNE PUBLICATION, UNE ENTRÉE EN VIGUEUR</text>
  <path d="M 0 40 H 439" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 445 40 l -6 -3 v 6 z" fill="#9A3B12"/>
  <circle cx="5.0" cy="40" r="3.2" fill="#9A3B12"/>
  <text class="l date" x="0" y="30">11 sept. 2025</text>
  <text class="l annf" x="0" y="56">Version finale publiée</text>
  <text class="l ann" x="0" y="69">le texte est arrêté ; aucune obligation nouvelle n'en découle</text>
  <text class="l ann" x="0" y="80">encore</text>
  <circle cx="227.5" cy="40" r="3.2" fill="#FDFBF9" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l date" x="222" y="30">1ᵉʳ mai 2027</text>
  <text class="l annf" x="222" y="56">Date opposable</text>
  <text class="l ann" x="222" y="69">institutions financières fédérales ; le texte n'a pas changé,</text>
  <text class="l ann" x="222" y="80">sa portée si</text>
  <path d="M 0 86 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="99">La date opposable est celle de l'ENTRÉE EN VIGUEUR, non celle de la publication : entre les deux, une institution n'a aucune</text>
  <text class="l ann" x="0" y="109">obligation nouvelle — et après, elle en a sans que le texte ait changé d'un mot.</text>
</svg>
