<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 171" width="445" height="171" role="img" aria-label="Les cinq dispositifs de gouvernance de l'IA identifiables parmi les dix institutions examinees.">
  <!-- § 35.9, chapitre 35.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="171" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">CE QUE CINQ DISPOSITIFS PUBLIÉS ONT EN COMMUN</text>
  <rect x="0" y="14" width="138" height="122" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Un titulaire nommé au sommet</text>
  <text class="l ann" x="10" y="47">Trois des cinq : un responsable en</text>
  <text class="l ann" x="10" y="58">chef de l'IA ; une responsable</text>
  <text class="l ann" x="10" y="69">mondiale à l'organe de direction</text>
  <text class="l ann" x="10" y="80">exécutive depuis mai 2026 ; un</text>
  <text class="l ann" x="10" y="91">chef de groupe rattaché au chef de</text>
  <text class="l ann" x="10" y="102">la direction depuis février 2026.</text>
  <text class="l renvoi" x="10" y="116">§ 35.2, § 35.4</text>
  <rect x="153" y="14" width="138" height="122" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">Un dispositif identifiable</text>
  <text class="l ann" x="163" y="47">Publié, et donc opposable à sa</text>
  <text class="l ann" x="163" y="58">propre communication.</text>
  <text class="l renvoi" x="163" y="116">cinq des dix institutions examinées</text>
  <rect x="307" y="14" width="138" height="122" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">Rien sur l'architecture</text>
  <text class="l ann" x="317" y="47">Aucun des cinq ne documente</text>
  <text class="l ann" x="317" y="58">l'option d'orchestration de son</text>
  <text class="l ann" x="317" y="69">déploiement.</text>
  <text class="l renvoi" x="317" y="116">ch. 43 § 43.2 — absence de</text>
  <text class="l renvoi" x="317" y="126">documentation</text>
  <path d="M 0 142 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="155">CINQ SUR DIX. Les cinq autres ne publient pas de dispositif identifiable — ce qui est une absence de publication, non une</text>
  <text class="l ann" x="0" y="165">absence de gouvernance (§ 35.0, troisième classe d'accès). La comparaison porte sur ce qui est publié, et rien d'autre.</text>
</svg>
