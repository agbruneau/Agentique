<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 201" width="445" height="201" role="img" aria-label="Les quatre axes de l'interoperabilite agentique : agent-outil, agent-agent, agent-humain, agent-donnees.">
  <!-- Tableau 7.2, § 7.2.2, chapitre 7.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="201" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE AXES, ET OÙ CHACUN EST TRAITÉ</text>
  <rect x="0" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Agent-outil</text>
  <text class="l ann" x="10" y="47">Un agent invoque des outils et ressources pour étendre</text>
  <text class="l ann" x="10" y="58">ses capacités.</text>
  <text class="l renvoi" x="10" y="72">vertical — ch. 8 § 8.1-8.3</text>
  <rect x="230" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">2</text>
  <text class="l bande" x="251" y="32">Agent-agent</text>
  <text class="l ann" x="240" y="47">Des agents autonomes se délèguent des tâches par-delà</text>
  <text class="l ann" x="240" y="58">les frontières.</text>
  <text class="l renvoi" x="240" y="72">horizontal — ch. 8 § 8.4-8.6</text>
  <rect x="0" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="116">3</text>
  <text class="l bande" x="21" y="116">Agent-humain</text>
  <text class="l ann" x="10" y="131">Points de validation, consentement, modalités de</text>
  <text class="l ann" x="10" y="142">l'interaction.</text>
  <text class="l renvoi" x="10" y="156">Livre II</text>
  <rect x="230" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="116">4</text>
  <text class="l bande" x="251" y="116">Agent-données</text>
  <text class="l ann" x="240" y="131">Accès gouverné aux données, récupération</text>
  <text class="l ann" x="240" y="142">inter-organisationnelle.</text>
  <text class="l renvoi" x="240" y="156">ch. 2, ch. 9 § 9.4</text>
  <path d="M 0 172 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="185">Deux axes seulement sont protocolaires — le vertical et l'horizontal. Les deux autres sont traités ailleurs dans la somme, et</text>
  <text class="l ann" x="0" y="195">le fait qu'un axe ait un lieu ne veut pas dire qu'il ait un protocole.</text>
</svg>
