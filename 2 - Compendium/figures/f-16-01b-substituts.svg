<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 221" width="445" height="221" role="img" aria-label="Les substituts actuels des quatre pieces du passeport, et l'ecart que chacun laisse ouvert.">
  <!-- Tableau 16.2, § 16.1.1, chapitre 16, au 30 juillet 2026.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="221" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE SUBSTITUTS, QUATRE ÉCARTS</text>
  <rect x="0" y="14" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Carte signée</text>
  <text class="l ann" x="10" y="47">La carte d'agent, signée et vérifiée hors bande — le</text>
  <text class="l ann" x="10" y="58">mécanisme existe et il est spécifié.</text>
  <text class="l renvoi" x="10" y="72">ne fournit pas l'ancrage organisationnel de la clé</text>
  <rect x="230" y="14" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">2</text>
  <text class="l bande" x="251" y="32">Inscription</text>
  <text class="l ann" x="240" y="47">Un registre interne, tenu par l'exploitant du maillage,</text>
  <text class="l ann" x="240" y="58">avec ses propres champs.</text>
  <text class="l renvoi" x="240" y="72">ne fournit pas l'opposabilité inter-organisationnelle</text>
  <rect x="0" y="108" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="126">3</text>
  <text class="l bande" x="21" y="126">Chaîne de mandat</text>
  <text class="l ann" x="10" y="141">L'échange de jeton RFC 8693 et son attribut d'acteur — à</text>
  <text class="l ann" x="10" y="152">un saut, dans un domaine unique.</text>
  <text class="l renvoi" x="10" y="166">ne fournit ni la composition au-delà du premier saut, ni</text>
  <text class="l renvoi" x="10" y="176">l'interrogeabilité</text>
  <rect x="230" y="108" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="126">4</text>
  <text class="l bande" x="251" y="126">Attestations</text>
  <text class="l ann" x="240" y="141">Rien de protocolaire : un inventaire documentaire, lu</text>
  <text class="l ann" x="240" y="152">par des humains.</text>
  <text class="l renvoi" x="240" y="166">ne fournit rien de ce qui en ferait une pièce</text>
  <path d="M 0 192 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="205">Aucun substitut n'est une pièce : chacun règle le problème CHEZ SOI et le laisse entier à la frontière. La quatrième n'a même</text>
  <text class="l ann" x="0" y="215">pas de substitut protocolaire — ce qui en tient lieu est documentaire, tenu hors du maillage et lu par des humains.</text>
</svg>
