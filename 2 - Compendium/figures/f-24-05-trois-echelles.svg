<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 169" width="445" height="169" role="img" aria-label="Les trois echelles d'orchestration : intra-equipe, inter-equipes, inter-organisations.">
  <!-- Tableau 24.1, § 24.5.2, chapitre 24.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="169" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS ÉCHELLES, ET UNE RUPTURE À LA TROISIÈME</text>
  <rect x="0" y="14" width="138" height="110" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Intra-équipe</text>
  <text class="l ann" x="10" y="47">Domaine unique, un propriétaire</text>
  <text class="l ann" x="10" y="58">responsable.</text>
  <text class="l renvoi" x="10" y="94">plan de contrôle homogène, contexte</text>
  <text class="l renvoi" x="10" y="104">partagé sans friction</text>
  <rect x="153" y="14" width="138" height="110" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">Inter-équipes</text>
  <text class="l ann" x="163" y="47">Plusieurs propriétaires internes.</text>
  <text class="l renvoi" x="163" y="94">accords de niveau de service croisés,</text>
  <text class="l renvoi" x="163" y="104">contrats d'interface stables,</text>
  <text class="l renvoi" x="163" y="114">attribution des défaillances</text>
  <rect x="307" y="14" width="138" height="110" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">Inter-organisations</text>
  <text class="l ann" x="317" y="47">Une frontière de confiance :</text>
  <text class="l ann" x="317" y="58">contrats juridiques,</text>
  <text class="l ann" x="317" y="69">responsabilité distribuée, aucune</text>
  <text class="l ann" x="317" y="80">autorité centrale.</text>
  <text class="l renvoi" x="317" y="94">la nature du problème change — § 24.7</text>
  <path d="M 0 130 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="143">La troisième échelle ne prolonge pas les deux premières : à la frontière de confiance, LA NATURE DU PROBLÈME CHANGE —</text>
  <text class="l ann" x="0" y="153">contrats juridiques, responsabilité distribuée, aucune autorité centrale commune. C'est ce que le § 24.7 traite, et non une</text>
  <text class="l ann" x="0" y="163">orchestration plus grande.</text>
</svg>
