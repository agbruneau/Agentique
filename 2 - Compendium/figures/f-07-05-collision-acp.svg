<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 201" width="445" height="201" role="img" aria-label="Les quatre objets distincts que le sigle ACP designe dans le corpus, et le statut de chacun.">
  <!-- Tableau 7.3, § 7.5, chapitre 7.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="201" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">UN SIGLE, QUATRE OBJETS</text>
  <rect x="0" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">a</text>
  <text class="l bande" x="21" y="32">ACP protocolaire</text>
  <text class="l ann" x="10" y="47">Agent Communication Protocol d'IBM Research et BeeAI.</text>
  <text class="l renvoi" x="10" y="72">fusionné en août 2025 — jamais un standard vivant</text>
  <rect x="230" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">b</text>
  <text class="l bande" x="251" y="32">Agentic Control Plane</text>
  <text class="l ann" x="240" y="47">Programme d'un consortium d'institutions financières et</text>
  <text class="l ann" x="240" y="58">de télécommunications.</text>
  <text class="l renvoi" x="240" y="72">annoncé en juillet 2026 — Livre III</text>
  <rect x="0" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="116">c</text>
  <text class="l bande" x="21" y="116">« agentic control plane »</text>
  <text class="l ann" x="10" y="131">Expression employée par IBM pour positionner un produit</text>
  <text class="l ann" x="10" y="142">d'orchestration.</text>
  <text class="l renvoi" x="10" y="156">positionnement commercial, à attribuer</text>
  <rect x="230" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="116">d</text>
  <text class="l bande" x="251" y="116">Composante ACP</text>
  <text class="l ann" x="240" y="131">De la couche d'infrastructure agentique.</text>
  <text class="l renvoi" x="240" y="156">ni intitulé ni identité établis — lacune</text>
  <path d="M 0 172 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="185">Quatre objets, un seul sigle, et aucun n'est l'autre. La quatrième branche n'a NI INTITULÉ COMPLET NI IDENTITÉ ÉTABLIS — c'est</text>
  <text class="l ann" x="0" y="195">une lacune du socle, non une abréviation.</text>
</svg>
