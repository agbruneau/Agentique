<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 119" width="445" height="119" role="img" aria-label="Le flux de paiement vers le rail de grande valeur, ou l'agent observe et le rail execute.">
  <!-- § 45.12, chapitre 45.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="119" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">L'AGENT S'ARRÊTE AVANT LE SEUIL</text>
  <rect x="0" y="14" width="95" height="56" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="31">Intention</text>
  <text class="l ann" x="9" y="44">l'agent interprète,</text>
  <text class="l ann" x="9" y="55">compose, prépare</text>
  <path d="M 97.75 42.0 H 110.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 114.75 42.0 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="117" y="14" width="95" height="56" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="126" y="31">Instruction</text>
  <text class="l ann" x="126" y="44">normalisée, validable</text>
  <text class="l ann" x="126" y="55">par schéma</text>
  <path d="M 214.75 42.0 H 227.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 231.75 42.0 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="234" y="14" width="95" height="56" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="243" y="31">Rail</text>
  <text class="l ann" x="243" y="44">exécute, de façon</text>
  <text class="l ann" x="243" y="55">déterministe</text>
  <path d="M 331.75 42.0 H 347.75" fill="none" stroke="#737373" stroke-width=".9" stroke-dasharray="2.5 2"/>
  <text class="l annf" x="339.75" y="36.0" text-anchor="middle">✕</text>
  <rect x="350" y="14" width="95" height="56" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="359" y="31">Observation</text>
  <text class="l ann" x="359" y="44">l'agent lit ce qui</text>
  <text class="l ann" x="359" y="55">s'est passé</text>
  <text class="l annf" x="0" y="84">Le seuil de finalité : l'agent observe, il ne franchit pas.</text>
  <path d="M 0 90 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="103">L'AGENT N'EXÉCUTE PAS. Le rail est déterministe et le reste : c'est l'application directe de la stratification du ch. 36 §</text>
  <text class="l ann" x="0" y="113">36.2.1 et du seuil d'irréversibilité du ch. 31 § 31.1.1.</text>
</svg>
