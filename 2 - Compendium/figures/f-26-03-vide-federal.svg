<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 211" width="445" height="211" role="img" aria-label="Les quatre instruments qui portent la charge reglementaire en l'absence de loi federale.">
  <!-- Tableau 26.1, § 26.3, chapitre 26, au gel du 27 juillet 2026.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="211" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE INSTRUMENTS, QUATRE RÉGIMES</text>
  <rect x="0" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">E-23</text>
  <text class="l ann" x="10" y="47">Risque de modèle, fédéral prudentiel. Version finale</text>
  <text class="l ann" x="10" y="58">publiée le 11 septembre 2025.</text>
  <text class="l renvoi" x="10" y="72">opposable le 1ᵉʳ mai 2027 — ch. 25</text>
  <rect x="230" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">2</text>
  <text class="l bande" x="251" y="32">Ligne directrice IA de l'AMF</text>
  <text class="l ann" x="240" y="47">Québec, sectoriel. Finale — jamais « en attente » ni «</text>
  <text class="l ann" x="240" y="58">en projet ».</text>
  <text class="l renvoi" x="240" y="72">publication non datée au jour près — ch. 27</text>
  <rect x="0" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="116">3</text>
  <text class="l bande" x="21" y="116">Art. 12.1 de la Loi 25</text>
  <text class="l ann" x="10" y="131">Québec, droit général des renseignements personnels. En</text>
  <text class="l ann" x="10" y="142">vigueur.</text>
  <text class="l renvoi" x="10" y="156">opposable depuis le 22 septembre 2023 — ch. 27</text>
  <rect x="230" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="116">4</text>
  <text class="l bande" x="251" y="116">Avis 11-348 des ACVM</text>
  <text class="l ann" x="240" y="131">Valeurs mobilières. Publié le 5 décembre 2024 ; ne crée</text>
  <text class="l ann" x="240" y="142">ni ne modifie aucune exigence.</text>
  <text class="l renvoi" x="240" y="156">aucune date — les lois existantes s'appliquent — ch. 28</text>
  <path d="M 0 172 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="185">Les quatre ne sont pas de même nature : l'un relève du droit général des renseignements personnels et non du secteur</text>
  <text class="l ann" x="0" y="195">financier, et le quatrième NE CRÉE NI NE MODIFIE aucune exigence. Un instrument qui porte la charge n'est pas nécessairement un</text>
  <text class="l ann" x="0" y="205">instrument qui l'impose.</text>
</svg>
