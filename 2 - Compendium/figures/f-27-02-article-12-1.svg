<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 134" width="445" height="134" role="img" aria-label="L'articulation de l'article 12.1 de la Loi 25 : ce qui est du sans demande et ce qui est du sur demande.">
  <!-- Tableau 27.2, § 27.2, chapitre 27, relevé du 21 juillet 2026 sur le texte officiel.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="134" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">UNE DÉCISION EXCLUSIVEMENT AUTOMATISÉE EST RENDUE</text>
  <text class="l bande" x="0" y="24">Une décision fondée exclusivement sur un traitement automatisé est rendue</text>
  <path d="M 12 36 H 368" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <path d="M 78 36 V 44" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 78 48 l -3 -4 h 6 z" fill="#9A3B12"/>
  <text class="l rang" x="12" y="58">sans demande</text>
  <rect x="12" y="62" width="131" height="37" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="21" y="78">Informer</text>
  <text class="l ann" x="21" y="91">que la décision a été rendue, au</text>
  <text class="l ann" x="21" y="102">plus tard au moment de la</text>
  <text class="l ann" x="21" y="113">décision — l'information</text>
  <text class="l ann" x="21" y="124">l'accompagne</text>
  <path d="M 222 36 V 44" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 222 48 l -3 -4 h 6 z" fill="#9A3B12"/>
  <text class="l rang" x="157" y="58">sur demande</text>
  <rect x="157" y="62" width="131" height="37" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="166" y="78">Trois informations</text>
  <text class="l ann" x="166" y="91">1° les renseignements utilisés ;</text>
  <text class="l ann" x="166" y="102">2° les raisons, facteurs et</text>
  <text class="l ann" x="166" y="113">paramètres ; 3° le droit de</text>
  <text class="l ann" x="166" y="124">faire rectifier</text>
  <path d="M 368 36 V 44" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 368 48 l -3 -4 h 6 z" fill="#9A3B12"/>
  <text class="l rang" x="302" y="58">alinéa distinct</text>
  <rect x="302" y="62" width="131" height="37" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="311" y="78">Réviser</text>
  <text class="l ann" x="311" y="91">l'occasion de présenter ses</text>
  <text class="l ann" x="311" y="102">observations à un membre du</text>
  <text class="l ann" x="311" y="113">personnel en mesure de réviser</text>
  <text class="l ann" x="311" y="124">la décision</text>
  <path d="M 0 105 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="118">La troisième information due sur demande — LE DROIT DE FAIRE RECTIFIER — était omise par l'entrée héritée H-06 du Vol. III,</text>
  <text class="l ann" x="0" y="128">et l'alinéa distinct est le seul que le socle individualise : il est hors de l'énumération, non son quatrième terme.</text>
</svg>
