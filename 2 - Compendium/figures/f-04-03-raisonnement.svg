<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 128" width="445" height="128" role="img" aria-label="Trois regimes de raisonnement : chaine lineaire, coherence interne par echantillonnage, recherche structuree avec verificateur.">
  <!-- § 4.3.1 et § 4.3.2, chapitre 4.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="128" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS RÉGIMES, ET CE QUE CHACUN CORRIGE</text>
  <rect x="0" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Chaîne</text>
  <text class="l ann" x="10" y="47">Une trace linéaire d'étapes</text>
  <text class="l ann" x="10" y="58">explicitées. Une erreur précoce se</text>
  <text class="l ann" x="10" y="69">propage jusqu'à la conclusion.</text>
  <text class="l renvoi" x="10" y="83">§ 4.3.1</text>
  <path d="M 141.33333333333334 53.5 H 148.33333333333334" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 152.33333333333334 53.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="153" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">Cohérence interne</text>
  <text class="l ann" x="163" y="47">Plusieurs traces échantillonnées,</text>
  <text class="l ann" x="163" y="58">et la réponse majoritaire retenue.</text>
  <text class="l renvoi" x="163" y="83">§ 4.3.1</text>
  <path d="M 294.33333333333337 53.5 H 301.33333333333337" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 305.33333333333337 53.5 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="307" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">Recherche structurée</text>
  <text class="l ann" x="317" y="47">L'exploration devient un arbre,</text>
  <text class="l ann" x="317" y="58">guidée par un vérificateur à</text>
  <text class="l ann" x="317" y="69">l'inférence.</text>
  <text class="l renvoi" x="317" y="83">§ 4.3.2</text>
  <path d="M 0 99 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="112">Aucun de ces régimes ne rend le raisonnement VÉRIFIABLE : ils réduisent la variance d'une trace, ils n'en établissent pas la</text>
  <text class="l ann" x="0" y="122">validité. Le vérificateur à l'inférence déplace la question, il ne la ferme pas.</text>
</svg>
