<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 117" width="445" height="117" role="img" aria-label="Les jalons externes a surveiller, avec leur regime epistemique.">
  <!-- Tableau 46.2, § 46.3, chapitre 46.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="117" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS RÉGIMES, ET UN SEUL JALON DATÉ</text>
  <rect x="0" y="14" width="138" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Programmé</text>
  <text class="l ann" x="10" y="47">Une date opposable, portée par un</text>
  <text class="l ann" x="10" y="58">instrument en vigueur.</text>
  <text class="l renvoi" x="10" y="72">un seul des jalons</text>
  <rect x="153" y="14" width="138" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">Annoncé</text>
  <text class="l ann" x="163" y="47">Une cible communiquée par celui</text>
  <text class="l ann" x="163" y="58">qui la porte.</text>
  <text class="l renvoi" x="163" y="72">ni opposable ni garantie</text>
  <rect x="307" y="14" width="138" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">Spéculatif</text>
  <text class="l ann" x="317" y="47">Aucun jalon daté au socle.</text>
  <text class="l renvoi" x="317" y="72">ne fonde aucune planification</text>
  <path d="M 0 88 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="101">UN SEUL EST PROGRAMMÉ. Les autres sont attendus, annoncés ou spéculatifs — et bâtir une feuille de route sur un jalon</text>
  <text class="l ann" x="0" y="111">spéculatif, c'est dater un plan sur une supposition. Les trois statuts épistémiques sont posés au ch. 49 § 49.0.1.</text>
</svg>
