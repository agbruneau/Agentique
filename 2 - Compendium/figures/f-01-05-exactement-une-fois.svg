<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 107" width="445" height="107" role="img" aria-label="Les trois garanties de livraison d'un courtier de messages, et la seule composition qui rende un traitement exactement-une-fois.">
  <!-- § 1.5.2, chapitre 1 — siège cité par le ch. 48 § 48.2.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="107" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS GARANTIES DE LIVRAISON</text>
  <rect x="0" y="14" width="138" height="58" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Au plus une fois</text>
  <text class="l ann" x="10" y="47">Perte possible, jamais de doublon.</text>
  <rect x="153" y="14" width="138" height="58" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">Au moins une fois</text>
  <text class="l ann" x="163" y="47">Jamais de perte, doublons</text>
  <text class="l ann" x="163" y="58">possibles.</text>
  <rect x="307" y="14" width="138" height="58" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">Exactement une fois</text>
  <text class="l ann" x="317" y="47">Irréalisable comme garantie de</text>
  <text class="l ann" x="317" y="58">livraison sous pannes.</text>
  <path d="M 0 78 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="91">La voie praticable n'est pas une livraison exactement-une-fois — irréalisable sous pannes, instance du problème des deux</text>
  <text class="l ann" x="0" y="101">généraux — mais un TRAITEMENT exactement-une-fois : au-moins-une-fois composé avec un consommateur idempotent (ch. 48 § 48.2).</text>
</svg>
