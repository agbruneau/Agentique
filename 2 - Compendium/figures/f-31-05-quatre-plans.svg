<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 233" width="445" height="233" role="img" aria-label="Les quatre plans de circulation de la donnee regulee : inference, plongements, traces, journaux.">
  <!-- Tableau 31.4, § 31.5.1, chapitre 31 — repris du Vol. I en [C].
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="233" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE PLANS, ET LA RÉSIDENCE DOIT LES COUVRIR TOUS</text>
  <rect x="0" y="14" width="215" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Inférence</text>
  <text class="l ann" x="10" y="47">L'invite soumise au modèle contient invariablement du</text>
  <text class="l ann" x="10" y="58">contexte client — extraits de dossier, montants,</text>
  <text class="l ann" x="10" y="69">identifiants.</text>
  <text class="l renvoi" x="10" y="83">rarement pensé en termes de résidence</text>
  <rect x="230" y="14" width="215" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">2</text>
  <text class="l bande" x="251" y="32">Plongements</text>
  <text class="l ann" x="240" y="47">La représentation vectorielle du contenu régulé.</text>
  <text class="l renvoi" x="240" y="83">rarement pensé en termes de résidence</text>
  <rect x="0" y="109" width="215" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="127">3</text>
  <text class="l bande" x="21" y="127">Traces</text>
  <text class="l ann" x="10" y="142">Ce que l'observabilité conserve de la boucle.</text>
  <text class="l renvoi" x="10" y="178">rarement pensé en termes de résidence</text>
  <rect x="230" y="109" width="215" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="127">4</text>
  <text class="l bande" x="251" y="127">Journaux d'audit</text>
  <text class="l ann" x="240" y="142">Ce qui vaut pièce, et se conserve pour cela.</text>
  <text class="l renvoi" x="240" y="178">le seul plan habituellement traité</text>
  <path d="M 0 194 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="207">LES TROIS PREMIERS SONT RAREMENT PENSÉS EN TERMES DE RÉSIDENCE. Une architecture qui ne couvre que le stockage laisse</text>
  <text class="l ann" x="0" y="217">circuler la donnée régulée sur trois plans qu'elle ne voit pas — et l'invite contient invariablement du contexte client, même</text>
  <text class="l ann" x="0" y="227">quand la sortie paraît anodine.</text>
</svg>
