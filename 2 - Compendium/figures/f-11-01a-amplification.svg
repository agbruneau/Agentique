<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 138" width="445" height="138" role="img" aria-label="Les trois mecanismes par lesquels la couche agentique fait basculer des proprietes locales.">
  <!-- § 11.1.1 et § 11.1.2, chapitre 11.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="138" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">CE QUE LA COMPOSITION AJOUTE À LA MENACE</text>
  <rect x="0" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">La surface n'est pas composable</text>
  <text class="l ann" x="10" y="47">Deux systèmes sûrs séparément ne</text>
  <text class="l ann" x="10" y="58">font pas un assemblage sûr.</text>
  <text class="l renvoi" x="10" y="83">§ 11.1.1</text>
  <rect x="153" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">La frontière est franchie</text>
  <text class="l ann" x="163" y="47">Ce qui traverse un protocole</text>
  <text class="l ann" x="163" y="58">échappe au périmètre qui le</text>
  <text class="l ann" x="163" y="69">validait.</text>
  <text class="l renvoi" x="163" y="83">§ 11.1.3</text>
  <rect x="307" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">L'effet se cumule</text>
  <text class="l ann" x="317" y="47">Une défaillance locale se propage</text>
  <text class="l ann" x="317" y="58">en cascade dans le graphe.</text>
  <text class="l renvoi" x="317" y="83">§ 11.2.2</text>
  <path d="M 0 99 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="112">LA TRIADE LÉTALE N'EST PAS POSÉE ICI : son siège est le ch. 19 § 19.2, qui en porte le modèle de menace, les conditions et</text>
  <text class="l ann" x="0" y="122">les incidents. Ce chapitre n'en traite que l'amplification, propre à la couche d'interopérabilité — et l'amplification n'est</text>
  <text class="l ann" x="0" y="132">pas la menace.</text>
</svg>
