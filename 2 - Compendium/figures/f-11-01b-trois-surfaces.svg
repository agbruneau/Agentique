<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 116" width="445" height="116" role="img" aria-label="Les trois surfaces d'attaque de la couche agentique : l'outil, l'invite, la memoire.">
  <!-- Tableau 11.3, § 11.1.4, chapitre 11.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="116" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS SURFACES, TROIS CANAUX</text>
  <rect x="0" y="14" width="138" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">L'outil</text>
  <text class="l ann" x="10" y="47">Corrompt la capacité de l'agent.</text>
  <text class="l renvoi" x="10" y="61">canal : la description lue à</text>
  <text class="l renvoi" x="10" y="71">l'inférence</text>
  <rect x="153" y="14" width="138" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">L'invite</text>
  <text class="l ann" x="163" y="47">Corrompt son instruction.</text>
  <text class="l renvoi" x="163" y="61">canal : le contexte</text>
  <rect x="307" y="14" width="138" height="67" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">La mémoire</text>
  <text class="l ann" x="317" y="47">Corrompt son état.</text>
  <text class="l renvoi" x="317" y="61">canal : la persistance entre</text>
  <text class="l renvoi" x="317" y="71">exécutions</text>
  <path d="M 0 87 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="100">La typologie est une CONSTRUCTION D'ÉDITEUR, non un énoncé de source primaire, et elle ne doit pas masquer l'asymétrie : les</text>
  <text class="l ann" x="0" y="110">trois surfaces ne sont ni également documentées ni également défendues (§ 11.1.4).</text>
</svg>
