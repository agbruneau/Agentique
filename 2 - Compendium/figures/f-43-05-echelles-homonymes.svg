<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 128" width="445" height="128" role="img" aria-label="Les trois echelles d'autonomie homonymes du Vol. I, et le rang de copilote dans chacune.">
  <!-- Tableau 43.3, § 43.5.1, chapitre 43.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="128" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">UN MÊME MOT, TROIS RANGS</text>
  <rect x="0" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Quatre paliers non numérotés</text>
  <text class="l ann" x="10" y="47">Assistance, copilote,</text>
  <text class="l ann" x="10" y="58">orchestration sous revue,</text>
  <text class="l ann" x="10" y="69">autonomie bornée.</text>
  <text class="l renvoi" x="10" y="83">ce paragraphe, et ch. 14 § 14.4</text>
  <rect x="153" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">Six niveaux, 0 à 5</text>
  <text class="l ann" x="163" y="47">« Copilote » y est le niveau 2.</text>
  <text class="l renvoi" x="163" y="83">ch. 4 § 4.1.4</text>
  <rect x="307" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">Quatre niveaux L0-L3</text>
  <text class="l ann" x="317" y="47">« Copilote » y est le niveau L0.</text>
  <text class="l renvoi" x="317" y="83">Annexe H</text>
  <path d="M 0 99 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="112">« COPILOTE » DÉSIGNE UN PALIER DE LA PREMIÈRE, LE NIVEAU 2 DE LA DEUXIÈME ET LE NIVEAU L0 DE LA TROISIÈME. Citer un rang sans</text>
  <text class="l ann" x="0" y="122">nommer son échelle est une erreur de lecture que la somme commet ailleurs si elle n'y prend pas garde.</text>
</svg>
