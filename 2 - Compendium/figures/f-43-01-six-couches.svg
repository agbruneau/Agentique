<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 336" width="445" height="336" role="img" aria-label="Les six couches de l'architecture de reference unifiee et la responsabilite de chacune.">
  <!-- Tableau 43.1, § 43.1.1, chapitre 43.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="336" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">SIX COUCHES, ET CE QUE CHACUNE TIENT</text>
  <rect x="0" y="14" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="31">6</text>
  <text class="l bande" x="21" y="31">Gouvernance</text>
  <text class="l ann" x="10" y="44">Inventaire, cotation, cycle de vie, documentation, surveillance.</text>
  <rect x="0" y="59" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="76">5</text>
  <text class="l bande" x="21" y="76">Exploitation — AgentOps</text>
  <text class="l ann" x="10" y="89">Seize métriques au grain de l'opération, aucune de parc ; la dimension d'agent est un nom, pas une identité.</text>
  <rect x="0" y="104" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="121">4</text>
  <text class="l bande" x="21" y="121">Maillage</text>
  <text class="l ann" x="10" y="134">Appliquer la politique à l'arête — siège ch. 37. Ne porte pas l'émission.</text>
  <rect x="0" y="149" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="166">3</text>
  <text class="l bande" x="21" y="166">Orchestration</text>
  <text class="l ann" x="10" y="179">Tenir l'enchaînement, produire la trace. Taxonomie OO1-OO4, cinq propriétés, sept critères.</text>
  <rect x="0" y="194" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="211">2</text>
  <text class="l bande" x="21" y="211">Identité et registre</text>
  <text class="l ann" x="10" y="224">Identités et gabarits d'identité sur des protocoles d'autorisation qui étendent les RFC plutôt qu'ils ne s'y conforment.</text>
  <rect x="0" y="239" width="445" height="52" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="256">1</text>
  <text class="l bande" x="21" y="256">Protocoles</text>
  <text class="l ann" x="10" y="269">Accès aux outils, données typées, cadre d'autorisation ; délégation de pair à pair, cartes signées. Ne porte ni le sens,</text>
  <text class="l ann" x="10" y="280">ni l'ancrage.</text>
  <path d="M 0 297 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="310">LE DÉCOUPAGE EST IMPOSÉ PAR LE PLAN ; sa vertu est d'obliger à dire ce que chaque couche ne porte pas. Quatre réserves</text>
  <text class="l ann" x="0" y="320">commandent la lecture du tableau source (§ 43.1.2), et deux des entrées de la couche d'exploitation sont exclues du socle</text>
  <text class="l ann" x="0" y="330">consolidé pour dette de preuve.</text>
</svg>
