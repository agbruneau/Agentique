<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 155" width="445" height="155" role="img" aria-label="La distinction entre le registre gouverne, opposable a des tiers, et le catalogue interne.">
  <!-- Tableau 41.2, § 41.3, chapitre 41 — construction d'auteur en totalité.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="155" fill="#FDFBF9"/>
  <text class="l titreg" x="0" y="8">REGISTRE GOUVERNÉ (ch. 15)</text>
  <rect x="0" y="14" width="210" height="83" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="30">Qu'un tiers vérifie une identité qu'il n'a pas émise</text>
  <text class="l ann" x="9" y="46">Opposable à des tiers, dans les limites du Livre II</text>
  <text class="l ann" x="9" y="65">Porte l'ancrage — le verrou du Livre II</text>
  <text class="l ann" x="9" y="84">Peuplé par l'émission</text>
  <text class="l annf" x="0" y="110">un instrument de preuve</text>
  <text class="l titreg" x="236" y="8">CATALOGUE INTERNE (ce chapitre)</text>
  <rect x="236" y="14" width="210" height="83" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="245" y="30">Que l'organisation énumère ce qu'elle a produit</text>
  <text class="l ann" x="245" y="46">Opposable à personne</text>
  <text class="l ann" x="245" y="65">Porte le gabarit d'origine et l'état de certification</text>
  <text class="l ann" x="245" y="84">Peuplé par la fabrique</text>
  <text class="l annf" x="236" y="110">un instrument de gestion</text>
  <path d="M 0 116 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="129">CONSTRUCTION D'AUTEUR EN TOTALITÉ. La différence qui compte n'est pas le contenu mais L'OPPOSABILITÉ : le catalogue n'est</text>
  <text class="l ann" x="0" y="139">opposable à personne — c'est un instrument de gestion, non de preuve. Le confondre avec un registre fait croire à une preuve</text>
  <text class="l ann" x="0" y="149">qui n'existe pas.</text>
</svg>
