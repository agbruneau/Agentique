<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 247" width="445" height="247" role="img" aria-label="La pile du Web semantique : RDF, RDFS, OWL, JSON-LD, et la validation par SHACL.">
  <!-- § 2.3.1 et § 2.3.3, chapitre 2.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="247" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">CE QUE CHAQUE ÉTAGE AJOUTE</text>
  <rect x="0" y="14" width="231" height="52" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="31">4</text>
  <text class="l bande" x="21" y="31">JSON-LD</text>
  <text class="l ann" x="10" y="44">Sérialisation ; le pont vers les piles de développement</text>
  <text class="l ann" x="10" y="55">existantes.</text>
  <rect x="0" y="70" width="231" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="87">3</text>
  <text class="l bande" x="21" y="87">OWL</text>
  <text class="l ann" x="10" y="100">Axiomes et inférence sur le graphe.</text>
  <rect x="0" y="115" width="231" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="132">2</text>
  <text class="l bande" x="21" y="132">RDFS</text>
  <text class="l ann" x="10" y="145">Vocabulaire et hiérarchies de classes et de propriétés.</text>
  <rect x="0" y="160" width="231" height="52" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="177">1</text>
  <text class="l bande" x="21" y="177">RDF</text>
  <text class="l ann" x="10" y="190">Triplets sujet-prédicat-objet ; chaque ressource porte un</text>
  <text class="l ann" x="10" y="201">identifiant globalement résolvable.</text>
  <text class="l annf" x="247.4" y="26">SHACL et ShEx</text>
  <text class="l ann" x="247.4" y="38">La validation vient par-dessus : un contrat sémantique se</text>
  <text class="l ann" x="247.4" y="49">pose sur le graphe, il n'en fait pas partie (§ 2.3.3).</text>
  <text class="l annf" x="247.4" y="65">La propriété rare</text>
  <text class="l ann" x="247.4" y="77">Fusionner deux schémas relationnels exige un projet ;</text>
  <text class="l ann" x="247.4" y="88">fusionner deux graphes qui partagent des identifiants</text>
  <text class="l ann" x="247.4" y="99">n'exige rien.</text>
  <path d="M 0 218 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="231">Deux graphes fusionnent par simple union de leurs triplets — POURVU QU'ILS PARTAGENT DES IDENTIFIANTS. La pile ne fournit pas</text>
  <text class="l ann" x="0" y="241">l'accord sémantique : elle le suppose, et c'est le même constat que la pile canonique du ch. 1 § 1.1.2 porte un étage plus bas.</text>
</svg>
