<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 221" width="445" height="221" role="img" aria-label="Les quatre pieces du passeport d'agent, avec leur siege et la borne de chacune.">
  <!-- Tableau 16.1, § 16.1, chapitre 16, au 21 juillet 2026.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="221" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE PIÈCES, QUATRE SIÈGES</text>
  <rect x="0" y="14" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Carte signée</text>
  <text class="l ann" x="10" y="47">Intégrité d'un contenu canonicalisé au regard d'une clé.</text>
  <text class="l renvoi" x="10" y="72">ch. 15 § 15.1 — n'établit pas l'appartenance de la clé</text>
  <rect x="230" y="14" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">2</text>
  <text class="l bande" x="251" y="32">Inscription au registre</text>
  <text class="l ann" x="240" y="47">Champs obligatoires d'accès aux outils et de bornes de</text>
  <text class="l ann" x="240" y="58">permission.</text>
  <text class="l renvoi" x="240" y="72">ch. 15 § 15.3 — n'établit pas leur opposabilité</text>
  <rect x="0" y="108" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="126">3</text>
  <text class="l bande" x="21" y="126">Chaîne de mandat</text>
  <text class="l ann" x="10" y="141">Format versionné, attributs temporels, expression de la</text>
  <text class="l ann" x="10" y="152">délégation.</text>
  <text class="l renvoi" x="10" y="166">ch. 17 — n'établit pas l'interrogeabilité à l'instant t</text>
  <rect x="230" y="108" width="215" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="126">4</text>
  <text class="l bande" x="251" y="126">Attestations de conformité</text>
  <text class="l ann" x="240" y="141">Un nom de champ facultatif, hors socle.</text>
  <text class="l renvoi" x="240" y="166">ch. 15 § 15.3.3 et ch. 25 § 25.5 — ni format, ni contenu, ni</text>
  <text class="l renvoi" x="240" y="176">émetteur</text>
  <path d="M 0 192 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="205">Le passeport est un OBJET DE SYNTHÈSE CONSTRUIT PAR LA SOMME : aucune spécification ne le nomme, aucune organisation ne</text>
  <text class="l ann" x="0" y="215">l'émet. Les quatre pièces existent séparément ; leur assemblage est un énoncé d'auteur, pas un mécanisme.</text>
</svg>
