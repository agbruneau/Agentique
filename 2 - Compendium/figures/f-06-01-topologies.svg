<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 148" width="445" height="148" role="img" aria-label="Quatre topologies de coordination multi-agents : etoile, chaine, arbre, graphe.">
  <!-- Tableau 6.1, § 6.1.2, chapitre 6.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="148" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE TOPOLOGIES, QUATRE ARBITRAGES</text>
  <rect x="0" y="14" width="100" height="99" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">Étoile</text>
  <text class="l ann" x="10" y="47">Un orchestrateur</text>
  <text class="l ann" x="10" y="58">délègue à des</text>
  <text class="l ann" x="10" y="69">travailleurs.</text>
  <text class="l renvoi" x="10" y="83">visibilité maximale,</text>
  <text class="l renvoi" x="10" y="93">orchestrateur point de</text>
  <text class="l renvoi" x="10" y="103">dépendance</text>
  <rect x="115" y="14" width="100" height="99" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="125" y="32">2</text>
  <text class="l bande" x="136" y="32">Chaîne</text>
  <text class="l ann" x="125" y="47">La sortie d'un agent</text>
  <text class="l ann" x="125" y="58">est l'entrée du</text>
  <text class="l ann" x="125" y="69">suivant.</text>
  <text class="l renvoi" x="125" y="83">simple, mais l'erreur se</text>
  <text class="l renvoi" x="125" y="93">propage sans recours</text>
  <rect x="230" y="14" width="100" height="99" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">3</text>
  <text class="l bande" x="251" y="32">Arbre</text>
  <text class="l ann" x="240" y="47">Délégation</text>
  <text class="l ann" x="240" y="58">hiérarchique.</text>
  <text class="l renvoi" x="240" y="83">passage à l'échelle,</text>
  <text class="l renvoi" x="240" y="93">diagnostic plus difficile</text>
  <rect x="345" y="14" width="100" height="99" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="355" y="32">4</text>
  <text class="l bande" x="366" y="32">Graphe</text>
  <text class="l ann" x="355" y="47">Interactions</text>
  <text class="l ann" x="355" y="58">arbitraires.</text>
  <text class="l renvoi" x="355" y="83">expressivité maximale,</text>
  <text class="l renvoi" x="355" y="93">état global inobservable</text>
  <path d="M 0 119 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="132">Chaque topologie échange une propriété contre une autre : la visibilité contre la dépendance, la simplicité contre le recours,</text>
  <text class="l ann" x="0" y="142">l'échelle contre le diagnostic, l'expressivité contre l'observabilité de l'état global.</text>
</svg>
