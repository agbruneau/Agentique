<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 127" width="445" height="127" role="img" aria-label="La chaine du sinistre — declaration, instruction, reglement, subrogation — et les sous-taches que l'agent orchestre.">
  <!-- § 34.2.3, chapitre 34.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="127" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">QUATRE TEMPS, ET QUATRE SOUS-TÂCHES ORCHESTRÉES</text>
  <rect x="0" y="14" width="95" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="31">Déclaration</text>
  <text class="l ann" x="9" y="44">le premier avis, et</text>
  <text class="l ann" x="9" y="55">les pièces qui</text>
  <text class="l ann" x="9" y="66">l'accompagnent</text>
  <path d="M 97.75 53.0 H 110.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 114.75 53.0 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="117" y="14" width="95" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="126" y="31">Instruction</text>
  <text class="l ann" x="126" y="44">extraction de pièces,</text>
  <text class="l ann" x="126" y="55">évaluation des</text>
  <text class="l ann" x="126" y="66">dommages, détection de</text>
  <text class="l ann" x="126" y="77">fraude</text>
  <path d="M 214.75 53.0 H 227.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 231.75 53.0 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="234" y="14" width="95" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="243" y="31">Règlement</text>
  <text class="l ann" x="243" y="44">calcul d'indemnité —</text>
  <text class="l ann" x="243" y="55">et il est irréversible</text>
  <path d="M 331.75 53.0 H 344.75" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 348.75 53.0 l -4 -3 v 6 z" fill="#9A3B12"/>
  <rect x="350" y="14" width="95" height="78" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="359" y="31">Subrogation</text>
  <text class="l ann" x="359" y="44">le recours, après coup</text>
  <path d="M 0 98 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="111">CHAQUE SOUS-TÂCHE COMPORTE UN RISQUE DE CASCADE : une erreur propagée le long de la chaîne aboutit à un RÈGLEMENT</text>
  <text class="l ann" x="0" y="121">IRRÉVERSIBLE. Le patron directeur est celui du coordinateur de spécialistes — l'agent orchestre, il ne décide pas seul.</text>
</svg>
