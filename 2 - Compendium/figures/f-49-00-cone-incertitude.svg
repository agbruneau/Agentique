<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 128" width="445" height="128" role="img" aria-label="Les trois statuts epistemiques d'un enonce prospectif : programme, annonce, speculatif.">
  <!-- § 49.0.1 et § 49.0.2, chapitre 49.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="128" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS STATUTS, ET AUCUN N'EST UNE PRÉDICTION</text>
  <rect x="0" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">PROGRAMMÉ</text>
  <text class="l ann" x="10" y="47">Une date opposable, portée par un</text>
  <text class="l ann" x="10" y="58">instrument en vigueur ou une</text>
  <text class="l ann" x="10" y="69">décision prise.</text>
  <text class="l renvoi" x="10" y="83">le cône est étroit</text>
  <rect x="153" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">ANNONCÉ</text>
  <text class="l ann" x="163" y="47">Une cible communiquée par celui</text>
  <text class="l ann" x="163" y="58">qui la porte, sans force</text>
  <text class="l ann" x="163" y="69">opposable.</text>
  <text class="l renvoi" x="163" y="83">le cône s'élargit</text>
  <rect x="307" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">SPÉCULATIF</text>
  <text class="l ann" x="317" y="47">Aucun jalon daté au socle ; un</text>
  <text class="l ann" x="317" y="58">raisonnement, et ses conditions.</text>
  <text class="l renvoi" x="317" y="83">le cône est ouvert</text>
  <path d="M 0 99 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="112">LE CÔNE S'ÉLARGIT AVEC LE TEMPS, et la discipline qui en découle est la RE-DATATION : un énoncé prospectif se relit à sa</text>
  <text class="l ann" x="0" y="122">date, jamais à celle de sa lecture. Le chapitre ne prédit pas — il classe, et il dit à quel titre.</text>
</svg>
