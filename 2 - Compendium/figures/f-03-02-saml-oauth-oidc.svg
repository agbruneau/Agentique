<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 128" width="445" height="128" role="img" aria-label="Les trois protocoles d'identite federee et d'autorisation deleguee, et ce que chacun etablit.">
  <!-- § 3.2.1, chapitre 3.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="128" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS PROTOCOLES, TROIS OBJETS</text>
  <rect x="0" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">SAML</text>
  <text class="l ann" x="10" y="47">Fédération d'authentification par</text>
  <text class="l ann" x="10" y="58">assertions, au navigateur.</text>
  <text class="l renvoi" x="10" y="83">§ 3.2.1</text>
  <rect x="153" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="163" y="32">2</text>
  <text class="l bande" x="174" y="32">OAuth 2.x</text>
  <text class="l ann" x="163" y="47">Autorisation déléguée : l'accès à</text>
  <text class="l ann" x="163" y="58">une ressource, jamais une</text>
  <text class="l ann" x="163" y="69">identité.</text>
  <text class="l renvoi" x="163" y="83">§ 3.2.1</text>
  <rect x="307" y="14" width="138" height="79" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="317" y="32">3</text>
  <text class="l bande" x="328" y="32">OpenID Connect</text>
  <text class="l ann" x="317" y="47">Une couche d'identité posée sur</text>
  <text class="l ann" x="317" y="58">OAuth, qui lui manquait.</text>
  <text class="l renvoi" x="317" y="83">§ 3.2.1</text>
  <path d="M 0 99 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="112">OAuth AUTORISE, il n'authentifie pas : l'employer comme preuve d'identité est précisément la confusion qu'OpenID Connect existe</text>
  <text class="l ann" x="0" y="122">pour corriger. C'est aussi l'ambiguïté que le ch. 12 § 12.4 retrouve intacte quand le porteur du jeton est un agent.</text>
</svg>
