<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 164" width="445" height="164" role="img" aria-label="Comparaison du RAG naif en trois etapes et du RAG agentique en boucle.">
  <!-- § 5.3.1, chapitre 5.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="164" fill="#FDFBF9"/>
  <text class="l titreg" x="0" y="8">RAG NAÏF</text>
  <rect x="0" y="14" width="210" height="102" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l bande" x="9" y="30">Une passe, une fois pour toutes</text>
  <text class="l ann" x="9" y="46">Encoder la requête</text>
  <text class="l ann" x="9" y="65">Récupérer les passages les plus proches</text>
  <text class="l ann" x="9" y="84">Conditionner la génération</text>
  <text class="l annf" x="0" y="129">la linéarité fait la fragilité</text>
  <text class="l titre" x="236" y="8">RAG AGENTIQUE</text>
  <rect x="236" y="14" width="210" height="102" fill="#FFFFFF" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l bande" x="245" y="30">Une boucle de contrôle</text>
  <text class="l ann" x="245" y="46">Planifier la stratégie de recherche</text>
  <text class="l ann" x="245" y="65">Déclencher une ou plusieurs récupérations</text>
  <text class="l ann" x="245" y="84">Critiquer ce qui remonte</text>
  <text class="l ann" x="245" y="103">Itérer, ou s'arrêter</text>
  <text class="l annf" x="236" y="129">le pipeline figé devient une boucle</text>
  <path d="M 0 135 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="148">Sept points de défaillance récurrents sont recensés sur la chaîne de récupération (Barnett et coll., 2024). La boucle les rend</text>
  <text class="l ann" x="0" y="158">DÉTECTABLES ; elle ne les supprime pas, et une passe unique ne pouvait ni les détecter ni les corriger.</text>
</svg>
