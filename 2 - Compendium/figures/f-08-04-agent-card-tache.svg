<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 190" width="445" height="190" role="img" aria-label="L'Agent Card signee, le cycle de vie d'une tache et la hierarchie message-partie-artefact.">
  <!-- § 8.4.2, chapitre 8.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="190" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">TROIS STRUCTURES DE LA VERSION 1.0</text>
  <rect x="0" y="14" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="31">3</text>
  <text class="l bande" x="21" y="31">Message · partie · artefact</text>
  <text class="l ann" x="10" y="44">La hiérarchie autour de laquelle les échanges s'articulent.</text>
  <rect x="0" y="59" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="76">2</text>
  <text class="l bande" x="21" y="76">Tâche</text>
  <text class="l ann" x="10" y="89">L'unité de travail : un objet à état — soumise, en cours, requérant une entrée, achevée, échouée, annulée, rejetée.</text>
  <rect x="0" y="104" width="445" height="41" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="121">1</text>
  <text class="l bande" x="21" y="121">Agent Card</text>
  <text class="l ann" x="10" y="134">Document publié à un emplacement bien connu : identité, capacités, modalités d'interaction. Signée depuis la v1.0.</text>
  <path d="M 0 151 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="164">La signature lie l'authenticité de la carte à son DOMAINE D'ORIGINE — elle ne dit rien du comportement de l'agent qu'elle</text>
  <text class="l ann" x="0" y="174">décrit. L'écart entre ce qu'une carte déclare et ce qu'un agent fait est l'objet du ch. 9 § 9.4.2, et aucun mécanisme de la</text>
  <text class="l ann" x="0" y="184">v1.0 ne le ferme.</text>
</svg>
