<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 126" width="445" height="126" role="img" aria-label="La grappe des echeances datees de 2027 a 2032, avec la concentration de 2027.">
  <!-- § 49.1, chapitre 49.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="126" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">LE SQUELETTE DATÉ, ET LUI SEUL</text>
  <path d="M 0 40 H 439" fill="none" stroke="#9A3B12" stroke-width=".9"/>
  <path d="M 445 40 l -6 -3 v 6 z" fill="#9A3B12"/>
  <circle cx="5.0" cy="40" r="3.2" fill="#9A3B12"/>
  <text class="l date" x="0" y="30">2027</text>
  <text class="l annf" x="0" y="56">La concentration</text>
  <text class="l ann" x="0" y="69">E-23 opposable le 1ᵉʳ mai ;</text>
  <text class="l ann" x="0" y="80">l'essentiel des jalons de la</text>
  <text class="l ann" x="0" y="91">somme y tombe — § 49.1.1</text>
  <circle cx="116.2" cy="40" r="3.2" fill="#FDFBF9" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l date" x="111" y="30">2028-2029</text>
  <text class="l annf" x="111" y="56">Identité et standards</text>
  <text class="l ann" x="111" y="69">l'horloge de fond des travaux</text>
  <text class="l ann" x="111" y="80">normatifs — § 49.1.2</text>
  <circle cx="227.5" cy="40" r="3.2" fill="#FDFBF9" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l date" x="222" y="30">2030</text>
  <text class="l annf" x="222" y="56">Post-quantique</text>
  <text class="l ann" x="222" y="69">premier jalon des instruments</text>
  <text class="l ann" x="222" y="80">fédéraux — ch. 21</text>
  <circle cx="338.8" cy="40" r="3.2" fill="#FDFBF9" stroke="#9A3B12" stroke-width=".9"/>
  <text class="l date" x="334" y="30">2032</text>
  <text class="l annf" x="334" y="56">Règlement</text>
  <text class="l ann" x="334" y="69">les échéances financières et</text>
  <text class="l ann" x="334" y="80">de règlement — § 49.1.3</text>
  <path d="M 0 97 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="110">SEULES LES ÉCHÉANCES PROGRAMMÉES FIGURENT ICI. Le « programmé » lui-même est mouvant (§ 49.1.4) : une date opposable peut</text>
  <text class="l ann" x="0" y="120">être reportée, et l'a déjà été dans ce corpus. La frise est un squelette daté, non un calendrier.</text>
</svg>
