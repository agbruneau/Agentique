<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 398" width="445" height="398" role="img" aria-label="Les cinq points de controle obligatoires de l'architecture de reference.">
  <!-- Tableau 43.2, § 43.3, chapitre 43.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="398" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">CINQ POINTS, ET LEUR COUCHE</text>
  <rect x="0" y="14" width="445" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">1</text>
  <text class="l bande" x="21" y="32">L'émission</text>
  <text class="l ann" x="10" y="47">Une identité et ses pièces, avant toute invocation.</text>
  <text class="l renvoi" x="10" y="61">couche identité et registre — ch. 15, ch. 16</text>
  <rect x="0" y="87" width="445" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="105">2</text>
  <text class="l bande" x="21" y="105">L'admission</text>
  <text class="l ann" x="10" y="120">Le verdict d'entrée au maillage, et sa durée de validité.</text>
  <text class="l renvoi" x="10" y="134">couche maillage — ch. 18, ch. 20</text>
  <rect x="0" y="160" width="445" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="178">3</text>
  <text class="l bande" x="21" y="178">L'arête</text>
  <text class="l ann" x="10" y="193">La politique appliquée à chaque passage.</text>
  <text class="l renvoi" x="10" y="207">couche maillage — ch. 37</text>
  <rect x="0" y="233" width="445" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="251">4</text>
  <text class="l bande" x="21" y="251">La trace</text>
  <text class="l ann" x="10" y="266">Produite par le cadre, non par les agents.</text>
  <text class="l renvoi" x="10" y="280">couche orchestration — ch. 38, zone Z1</text>
  <rect x="0" y="306" width="445" height="57" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="324">5</text>
  <text class="l bande" x="21" y="324">Le point d'arrêt humain</text>
  <text class="l ann" x="10" y="339">L'occasion de réviser, exigée par l'art. 12.1.</text>
  <text class="l renvoi" x="10" y="353">couche gouvernance — zone Z2</text>
  <path d="M 0 369 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="382">« Obligatoires » qualifie LE PATRON, non un texte : aucun instrument réglementaire n'impose ces cinq points. Le tableau</text>
  <text class="l ann" x="0" y="392">source distingue pour chacun ce que le socle porte et ce qui est de l'auteur — et la figure ne dispense pas de l'y lire.</text>
</svg>
