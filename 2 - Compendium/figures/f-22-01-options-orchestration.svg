<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 201" width="445" height="201" role="img" aria-label="Les quatre options d'orchestration OO1 a OO4, selon qui detient la connaissance du processus et qui commande l'enchainement.">
  <!-- Tableau 22.1, § 22.1, chapitre 22.
       Genere par figures/dessine.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       445 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #212121; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #9A3B12; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #9A3B12; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #737373; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4d4d4d; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #212121; }
  .renvoi { font-size: 6.2px; fill: #737373; }
  .gris   { font-size: 8.5px; font-weight: 700; fill: #737373; }
  .date   { font-size: 6.5px; font-weight: 700; fill: #9A3B12; }
  </style></defs>
  <rect x="0" y="0" width="445" height="201" fill="#FDFBF9"/>
  <text class="l titre" x="0" y="8">DEUX AXES : QUI SAIT, ET QUI COMMANDE</text>
  <rect x="0" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="32">OO1</text>
  <text class="l bande" x="33" y="32">Aucun cadre explicite</text>
  <text class="l ann" x="10" y="47">Personne ne détient la connaissance du processus ; les</text>
  <text class="l ann" x="10" y="58">agents commandent l'enchaînement.</text>
  <text class="l renvoi" x="10" y="72">on ne peut rien lire avant l'exécution</text>
  <rect x="230" y="14" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="32">OO2</text>
  <text class="l bande" x="263" y="32">Le cadre est dans l'invite</text>
  <text class="l ann" x="240" y="47">Les agents détiennent la connaissance, par l'invite ou</text>
  <text class="l ann" x="240" y="58">le contexte ; ils commandent encore.</text>
  <text class="l renvoi" x="240" y="72">une description, sans force exécutoire établie</text>
  <rect x="0" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="10" y="116">OO3</text>
  <text class="l bande" x="33" y="116">Le cadre seul</text>
  <text class="l ann" x="10" y="131">Le cadre détient la connaissance — les agents l'ignorent</text>
  <text class="l ann" x="10" y="142">— et il commande.</text>
  <text class="l renvoi" x="10" y="156">l'enchaînement complet est lisible</text>
  <rect x="230" y="98" width="215" height="68" fill="#FAF5F0" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l rang" x="240" y="116">OO4</text>
  <text class="l bande" x="263" y="116">Le cadre et les agents</text>
  <text class="l ann" x="240" y="131">Les deux détiennent la connaissance ; le cadre commande.</text>
  <text class="l renvoi" x="240" y="156">l'enchaînement complet est lisible</text>
  <path d="M 0 172 H 445" fill="none" stroke="#C2C2C2" stroke-width=".6"/>
  <text class="l ann" x="0" y="185">La seule DISCONTINUITÉ est le passage d'OO2 à OO3 : c'est là que le commandement de l'enchaînement quitte les agents pour le</text>
  <text class="l ann" x="0" y="195">cadre, et que l'enchaînement devient lisible avant l'exécution. Les autres passages sont graduels.</text>
</svg>
