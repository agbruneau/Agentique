<!DOCTYPE html>
<html lang="fr-CA" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compendium — Tableau de bord de progression (plan.md)</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg-app: light-dark(#faf7f4, #070709);
      --bg-surface: light-dark(#ffffff, #0f1014);
      --bg-surface-2: light-dark(#f3eee8, #16181e);
      --bg-surface-3: light-dark(#e7dfd6, #20232b);
      --text-main: light-dark(#1a1614, #f4f1ec);
      --text-muted: light-dark(#5c534b, #a39e96);
      --text-subtle: light-dark(#7c7269, #757068);
      --border: light-dark(#dfd5cb, #262320);
      --border-strong: light-dark(#bfa995, #4d3729);
      --navy: light-dark(#24130a, #1c0f08);
      --accent: light-dark(#c2410c, #e05a17);
      --accent-soft: light-dark(#ffedd5, #2d1408);
      --accent-text: light-dark(#9a3412, #ff8442);
      --accent-glow: light-dark(rgba(194, 65, 12, 0.14), rgba(224, 90, 23, 0.24));
      --ok: light-dark(#047857, #34d399);
      --ok-soft: light-dark(#d1fae5, #082f24);
      --warn: light-dark(#b45309, #f59e0b);
      --warn-soft: light-dark(#fef3c7, #332006);
      --danger: light-dark(#dc2626, #f87171);
      --danger-soft: light-dark(#fee2e2, #361013);
      --shadow-sm: light-dark(0 1px 2px rgba(26, 22, 20, 0.08), 0 1px 4px rgba(0, 0, 0, 0.65));
      --shadow-md: light-dark(0 10px 26px rgba(26, 22, 20, 0.12), 0 14px 34px rgba(0, 0, 0, 0.78));
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    }

    html[data-theme="light"] { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    html[data-theme="auto"] { color-scheme: light dark; }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-app);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.5;
    }

    button, input, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }
    button { cursor: pointer; }
    code {
      font-family: var(--font-mono);
      font-size: 0.86em;
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--accent-text);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-surface);
      border-top: 2px solid var(--accent);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 12px 20px 0 20px;
    }

    .topbar-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, #1b0d06 0%, #b8420c 60%, #ea631c 100%);
      color: #fff7ed;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255, 132, 66, 0.45);
      box-shadow: 0 0 18px var(--accent-glow);
    }
    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--ok-soft);
      color: var(--ok);
      border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
    }
    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .btn, .select, .search-input {
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-size: 12.5px;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn:hover, .select:hover {
      border-color: var(--border-strong);
      background: var(--bg-surface-3);
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
      font-weight: 600;
    }
    .btn-primary:hover {
      opacity: 0.92;
      background: var(--accent);
    }

    .search-input {
      width: 210px;
      background: var(--bg-surface);
    }
    .search-input:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
      border-color: var(--accent);
    }

    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-top: 2px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2.5px solid transparent;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--text-main); }
    .tab-btn.active {
      color: var(--accent-text);
      border-bottom-color: var(--accent);
    }
    .tab-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--bg-surface-2);
      color: var(--text-muted);
    }
    .tab-btn.active .tab-badge {
      background: var(--accent-soft);
      color: var(--accent-text);
    }

    .main-wrap {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px 20px 44px 20px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .kpi-sub {
      font-size: 12px;
      color: var(--text-muted);
    }
    .progress-track {
      height: 7px;
      width: 100%;
      border-radius: 999px;
      background: var(--bg-surface-2);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .progress-fill.ok { background: var(--ok); }
    .progress-fill.warn { background: var(--warn); }
    .progress-fill.danger { background: var(--danger); }

    .rev-banner {
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent-soft) 55%, var(--bg-surface)) 0%, var(--bg-surface) 60%);
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .rev-banner-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .rev-milestones-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
    }
    .rev-milestone-card {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface-2);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .rev-milestone-card.en_cours {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    }
    .rev-milestone-card.termine {
      border-color: color-mix(in srgb, var(--ok) 45%, var(--border));
    }
    .rev-metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 8px;
    }
    .rev-metric-tile {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .rev-metric-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .rev-metric-val {
      font-size: 19px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .rev-metric-sub {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 1024px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }
    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .rings-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 12px;
      text-align: center;
    }
    .ring-box {
      padding: 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
    }
    .ring-caption {
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }
    .ring-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-ok { background: var(--ok-soft); color: var(--ok); }
    .badge-warn { background: var(--warn-soft); color: var(--warn); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .badge-info { background: var(--accent-soft); color: var(--accent-text); }
    .badge-muted { background: var(--bg-surface-2); color: var(--text-muted); border: 1px solid var(--border); }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    th {
      background: var(--bg-surface-2);
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr.clickable:hover {
      background: var(--bg-surface-2);
      cursor: pointer;
    }
    .num { text-align: right; font-variant-numeric: tabular-nums; }

    .task-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    .task-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .task-title {
      font-size: 14.5px;
      font-weight: 700;
      margin: 0;
    }
    .step-list {
      list-style: none;
      margin: 10px 0 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
    }
    .step-item.done {
      border-color: color-mix(in srgb, var(--ok) 45%, transparent);
      background: color-mix(in srgb, var(--ok-soft) 55%, var(--bg-surface-2));
    }
    .step-checkbox {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: var(--ok);
      cursor: pointer;
    }
    .step-checkbox:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }
    .step-cmd {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
      word-break: break-all;
    }

    .waves-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .wave-box {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface-2);
    }
    .wave-id {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-text);
      margin-bottom: 4px;
    }

    .foundations-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 8px;
    }
    .foundation-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      font-size: 12.5px;
    }

    .edit-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
    }
    .edit-toggle.active {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: color-mix(in srgb, var(--warn) 45%, transparent);
    }

    /* Drawer inspecteur latéral */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 60;
      display: none;
    }
    .drawer-backdrop.open { display: block; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: min(560px, 94vw);
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      z-index: 70;
      transform: translateX(100%);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .drawer-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
    }

    .toast {
      position: fixed;
      bottom: 18px;
      right: 20px;
      z-index: 90;
      background: var(--navy);
      color: #f8fafc;
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }

    .empty-state {
      padding: 28px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-head">
      <div class="brand">
        <div class="brand-mark">CP</div>
        <div>
          <h1>Compendium — Suivi de progression (<code>plan.md</code>)</h1>
          <div class="brand-sub" id="hdr-meta">Chargement des données en direct depuis le serveur local…</div>
        </div>
      </div>
      <div class="toolbar">
        <span class="pill-live" id="pill-live"><span class="pill-dot"></span><span>En direct</span></span>
        <input class="search-input" id="global-search" type="search" placeholder="Filtrer (Ctrl+K)…" aria-label="Recherche globale" />
        <select class="select" id="poll-select" aria-label="Fréquence d'actualisation">
          <option value="0">Actualisation : Manuel</option>
          <option value="15000">Actualisation : 15 s</option>
          <option value="60000" selected>Actualisation : 60 s</option>
          <option value="300000">Actualisation : 5 min</option>
        </select>
        <button class="btn" id="btn-refresh" type="button">Actualiser</button>
        <button class="btn" id="btn-csv" type="button">CSV</button>
        <button class="btn" id="btn-json" type="button">JSON</button>
        <select class="select" id="theme-select" aria-label="Thème visuel">
          <option value="dark" selected>Thème : Noir / Orange brûlé</option>
          <option value="auto">Thème : Auto</option>
          <option value="light">Thème : Clair</option>
        </select>
      </div>
    </div>
    <nav class="tabs" id="nav-tabs" role="tablist">
      <button class="tab-btn active" data-tab="overview" role="tab">Synthèse</button>
      <button class="tab-btn" data-tab="tasks" role="tab">Pipeline Tasks 1–9 <span class="tab-badge" id="badge-tasks">0/32</span></button>
      <button class="tab-btn" data-tab="units" role="tab">Unités &amp; Chapitres <span class="tab-badge" id="badge-units">0/42</span></button>
      <button class="tab-btn" data-tab="schemas" role="tab">Schémas SCH-* <span class="tab-badge" id="badge-schemas">0/115</span></button>
      <button class="tab-btn" data-tab="aq" role="tab">AQ G0–G5 &amp; CA <span class="tab-badge" id="badge-aq">0/6</span></button>
      <button class="tab-btn" data-tab="factory" role="tab">Usine &amp; Livrables <span class="tab-badge" id="badge-factory">0/3</span></button>
      <button class="tab-btn" data-tab="revision" role="tab">Révision &amp; Références <span class="tab-badge" id="badge-revision">0/6</span></button>
    </nav>
  </header>

  <main class="main-wrap" id="app-content">
    <div class="empty-state">Connexion au serveur local…</div>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="unit-drawer" aria-label="Inspecteur d'unité">
    <div class="drawer-head">
      <div>
        <div id="drawer-kicker" style="font-size:11.5px;color:var(--text-muted);font-weight:700;"></div>
        <h2 id="drawer-title" style="margin:2px 0 0 0;font-size:16px;"></h2>
      </div>
      <button class="btn" id="drawer-close" type="button">Fermer</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script>
    (function (global) {
      "use strict";

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatIntFr(n) {
        const num = Math.round(Number(n) || 0);
        return String(num).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
      }

      function formatPctFr(val) {
        const num = Number(val) || 0;
        return num.toFixed(1).replace(".", ",") + "\u00a0%";
      }

      function formatBytes(bytes) {
        const b = Number(bytes) || 0;
        if (b < 1024) return b + "\u00a0o";
        if (b < 1024 * 1024) return (b / 1024).toFixed(1).replace(".", ",") + "\u00a0Ko";
        return (b / (1024 * 1024)).toFixed(2).replace(".", ",") + "\u00a0Mo";
      }

      const STATUS_LABELS = {
        non_demarre: ["Non démarré", "badge-muted"],
        sous_calibre: ["Sous-calibré", "badge-warn"],
        conforme: ["Conforme", "badge-ok"],
        sur_calibre: ["Sur-calibré", "badge-danger"],
        validee: ["Validée", "badge-ok"],
        en_cours: ["En cours", "badge-warn"],
        a_venir: ["À venir", "badge-muted"],
        termine: ["Terminé", "badge-ok"],
        terminee: ["Terminée", "badge-ok"],
        a_faire: ["À faire", "badge-muted"],
        rendu: ["Rendu prêt", "badge-ok"],
        source: ["Source prête", "badge-warn"],
        a_produire: ["À produire", "badge-muted"],
        ouvert: ["Ouvert", "badge-danger"],
        corrige: ["Corrigé", "badge-warn"],
        verifie: ["Vérifié", "badge-ok"],
      };

      const SEVERITY_LABELS = {
        BLOQUANT: ["BLOQUANT", "badge-danger"],
        MAJEUR: ["MAJEUR", "badge-warn"],
        MINEUR: ["MINEUR", "badge-info"],
      };

      const AXIS_LABELS = {
        references: "Références",
        couverture_prd: "Couverture PRD",
        coherence: "Cohérence",
        edition: "Édition",
        livrables: "Livrables",
      };

      const REUSE_LABELS = {
        reemploi_direct: "Réemploi direct",
        adaptation_vulgarisee: "Adaptation vulgarisée",
        creation_originale: "Création originale",
      };

      function statusBadge(key) {
        const [label, cls] = STATUS_LABELS[key] || [String(key || "—"), "badge-muted"];
        return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
      }

      function severityBadge(sev) {
        const norm = String(sev || "MINEUR").toUpperCase();
        const [label, cls] = SEVERITY_LABELS[norm] || [norm, "badge-muted"];
        return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
      }

      function renderSvgRing(pct, label, sub, colorVar) {
        const clamped = Math.max(0, Math.min(100, Number(pct) || 0));
        const r = 34;
        const c = 2 * Math.PI * r;
        const offset = c * (1 - clamped / 100);
        const stroke = colorVar || "var(--accent)";
        return `
          <div class="ring-box">
            <svg width="88" height="88" viewBox="0 0 88 88" role="img" aria-label="${escapeHtml(label)} ${formatPctFr(clamped)}">
              <circle cx="44" cy="44" r="${r}" fill="none" stroke="var(--border)" stroke-width="8" />
              <circle cx="44" cy="44" r="${r}" fill="none" stroke="${stroke}" stroke-width="8"
                stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
                transform="rotate(-90 44 44)" />
              <text x="44" y="48" text-anchor="middle" fill="var(--text-main)" font-size="14" font-weight="700">${escapeHtml(formatPctFr(clamped))}</text>
            </svg>
            <div class="ring-caption">${escapeHtml(label)}</div>
            <div class="ring-sub">${escapeHtml(sub)}</div>
          </div>`;
      }

      function renderDomainBarsSvg(domains) {
        if (!domains || !domains.length) return "<div class='empty-state'>Aucun domaine</div>";
        const rowH = 26;
        const padTop = 8;
        const width = 640;
        const height = padTop + domains.length * rowH + 10;
        const barX = 115;
        const barMaxW = 390;
        const rows = domains.map((d, idx) => {
          const y = padTop + idx * rowH;
          const pct = Math.max(0, Math.min(100, Number(d.progress_pct) || 0));
          const w = Math.max(pct > 0 ? 4 : 0, Math.round((pct / 100) * barMaxW));
          const color = pct >= 100 ? "var(--ok)" : (pct > 0 ? "var(--accent)" : "var(--border)");
          return `
            <g transform="translate(0,${y})">
              <text x="4" y="16" fill="var(--text-main)" font-size="12" font-weight="700">${escapeHtml(d.domain_id)} · P.${escapeHtml(d.part_roman)}</text>
              <rect x="${barX}" y="5" width="${barMaxW}" height="14" rx="4" fill="var(--bg-surface-2)" stroke="var(--border)" />
              <rect x="${barX}" y="5" width="${w}" height="14" rx="4" fill="${color}" />
              <text x="${barX + barMaxW + 10}" y="16" fill="var(--text-muted)" font-size="11.5">${escapeHtml(formatPctFr(pct))} (${formatIntFr(d.actual_words)} / ${formatIntFr(d.target_words)})</text>
            </g>`;
        }).join("");
        return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-height:360px;display:block;" role="img" aria-label="Progression par domaine D01 à D12">${rows}</svg>`;
      }

      function filterUnits(units, filters) {
        const q = (filters.query || "").trim().toLowerCase();
        return (units || []).filter((u) => {
          if (filters.domain && filters.domain !== "ALL" && u.domain_id !== filters.domain) return false;
          if (filters.type && filters.type !== "ALL" && u.unit_type !== filters.type) return false;
          if (filters.status && filters.status !== "ALL" && u.manuscript_status !== filters.status) return false;
          if (q) {
            const hay = [
              u.unit_id, u.title, u.domain_id, u.subdomain_id,
              ...(u.families || []), ...(u.themes || []), ...(u.schema_ids || [])
            ].join(" ").toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      function filterSchemas(schemas, filters) {
        const q = (filters.query || "").trim().toLowerCase();
        return (schemas || []).filter((sc) => {
          if (filters.domain && filters.domain !== "ALL" && sc.domain_id !== filters.domain) return false;
          if (filters.reuse && filters.reuse !== "ALL" && sc.reuse_status !== filters.reuse) return false;
          if (filters.notation && filters.notation !== "ALL" && sc.recommended_notation !== filters.notation) return false;
          if (filters.disk && filters.disk !== "ALL" && sc.disk_status !== filters.disk) return false;
          if (q) {
            const hay = [sc.schema_id, sc.scope, sc.domain_id, sc.title, sc.visual_archetype].join(" ").toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      function filterCriteria(criteria, filters) {
        const q = (filters.query || "").trim().toLowerCase();
        return (criteria || []).filter((c) => {
          if (filters.gate && filters.gate !== "ALL" && !(c.gates || []).includes(filters.gate)) return false;
          if (q) {
            const hay = [c.id, c.description, c.verifier, ...(c.gates || [])].join(" ").toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      function filterFindings(findings, filters) {
        const q = (filters.query || "").trim().toLowerCase();
        return (findings || []).filter((f) => {
          if (filters.severity && filters.severity !== "ALL" && String(f.severity || "").toUpperCase() !== filters.severity) return false;
          if (filters.axis && filters.axis !== "ALL" && String(f.axis || "") !== filters.axis) return false;
          if (filters.status && filters.status !== "ALL" && String(f.status || "") !== filters.status) return false;
          if (q) {
            const hay = [f.id, f.severity, f.axis, f.unit, f.title, f.detail, f.status].join(" ").toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      function renderRevisionBannerHtml(data) {
        const rev = data.revision;
        if (!rev || !rev.active) return "";
        const s = rev.summary || {};
        const ref = rev.reference_metrics || {};
        const cov = rev.prd_coverage || {};
        const openBlk = Number(s.open_blocking) || 0;
        const openMaj = Number(s.open_major) || 0;
        const openMin = Number(s.open_minor) || 0;
        return `
          <section class="rev-banner" aria-label="Campagne de révision PRD">
            <div style="flex:1;min-width:260px;">
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px;">
                <span class="badge badge-info">${escapeHtml(rev.campaign_id || "RÉVISION PRD")}</span>
                <strong style="font-size:14px;">${escapeHtml(rev.title || "Campagne d'audit et de révision vs prd.md")}</strong>
              </div>
              <div class="progress-track" style="max-width:460px;margin:6px 0;">
                <div class="progress-fill ${(s.revision_pct || 0) >= 100 ? "ok" : ""}" style="width:${Math.min(100, Number(s.revision_pct) || 0)}%"></div>
              </div>
              <div class="kpi-sub">
                Jalons : <strong>${s.milestones_done || 0}/${s.milestones_total || 0}</strong> (${formatPctFr(s.revision_pct || 0)}) ·
                Références SHA-256 : <strong>${formatIntFr(ref.sha256_verified || 0)}/${formatIntFr(ref.l_plus_total || 135)}</strong> ·
                Couverture PRD : <strong>${cov.units_audited || 0}/${cov.units_total || 42}</strong> unités (${cov.lots_completed || 0}/${cov.lots_total || 4} lots)
              </div>
            </div>
            <div class="rev-banner-stats">
              <span class="badge ${openBlk > 0 ? "badge-danger" : "badge-ok"}">${openBlk} bloquant(s)</span>
              <span class="badge ${openMaj > 0 ? "badge-warn" : "badge-muted"}">${openMaj} majeur(s)</span>
              <span class="badge badge-info">${openMin} mineur(s)</span>
              <button class="btn btn-primary" type="button" data-goto-tab="revision">Révision &amp; Références</button>
            </div>
          </section>`;
      }

      function renderOverviewHtml(data) {
        const k = data.kpis;
        const revBannerHtml = renderRevisionBannerHtml(data);
        const foundationsHtml = (data.foundations || []).map((f) => `
          <div class="foundation-item">

          <div class="wave-box">

          </div>`).join("");

        return `
          ${revBannerHtml}
          <section class="kpi-grid">
            <div class="kpi-card">
              <div class="kpi-label">Étapes du plan</div>
              <div class="kpi-value">${formatPctFr(k.plan_steps_pct)} <span class="kpi-sub">${k.plan_steps_done} / ${k.plan_steps_total}</span></div>
              <div class="progress-track"><div class="progress-fill ${k.plan_steps_pct >= 100 ? "ok" : ""}" style="width:${k.plan_steps_pct}%"></div></div>
              <div class="kpi-sub">${k.tasks_done} / ${k.tasks_total} tâches complètes</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Usine Compendium/ouvrage</div>
              <div class="kpi-value">${formatPctFr(k.ouvrage_pct)}</div>
              <div class="progress-track"><div class="progress-fill ok" style="width:${k.ouvrage_pct}%"></div></div>
              <div class="kpi-sub">${data.ouvrage_exists ? "Répertoire ouvrage/ actif" : "En attente de Task 1 (ouvrage/ non créé)"}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Volume manuscrit</div>
              <div class="kpi-value">${formatIntFr(k.words_written)} <span class="kpi-sub">/ ${formatIntFr(k.words_target)}</span></div>
              <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, k.words_pct)}%"></div></div>
              <div class="kpi-sub">${k.units_conforme} / ${k.units_total} unités conformes (± 8 %)</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Schémas SCH-*</div>
              <div class="kpi-value">${k.schemas_rendered_done} <span class="kpi-sub">/ ${k.schemas_total}</span></div>
              <div class="progress-track"><div class="progress-fill warn" style="width:${(k.schemas_rendered_done / Math.max(1, k.schemas_total) * 100).toFixed(1)}%"></div></div>
              <div class="kpi-sub">${k.schemas_sources_done} sources · ${k.schemas_rendered_done} rendus</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Socle L+ &amp; Wyvern G2</div>
              <div class="kpi-value">${k.sources_done} <span class="kpi-sub">/ ${k.sources_total}</span></div>
              <div class="progress-track"><div class="progress-fill ok" style="width:${(k.ancrages_done / Math.max(1, k.ancrages_total) * 100).toFixed(1)}%"></div></div>
              <div class="kpi-sub">${k.ancrages_done} / ${k.ancrages_total} journaux Wyvern G2</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Barrières AQ &amp; Livrables</div>
              <div class="kpi-value">${k.gates_validated} <span class="kpi-sub">/ ${k.gates_total} G0–G5</span></div>
              <div class="progress-track"><div class="progress-fill ok" style="width:${(k.gates_validated / Math.max(1, k.gates_total) * 100).toFixed(1)}%"></div></div>
              <div class="kpi-sub">${k.deliverables_done} / ${k.deliverables_total} livrables (.md/.html/.pdf)</div>
            </div>
          </section>

          <div class="grid-2">
            <section class="card">
              <div class="card-head">
                <h2 class="card-title">Avancement par domaine (D01–D12)</h2>
                <span class="card-meta">36 chapitres · 71 familles · 260 thèmes</span>
              </div>
              ${renderDomainBarsSvg(data.domains)}
            </section>
            <section class="card">
              <div class="card-head">
                <h2 class="card-title">Indicateurs synthétiques</h2>
                <span class="card-meta">Gel ${escapeHtml(data.meta.freeze_date)} · ${escapeHtml(data.meta.author)}</span>
              </div>
              <div class="rings-row">
                ${renderSvgRing(k.plan_steps_pct, "Plan (Tasks)", `${k.plan_steps_done}/${k.plan_steps_total} étapes`, "var(--accent)")}
                ${renderSvgRing(k.words_pct, "Manuscrit", `${formatIntFr(k.words_written)} mots`, "var(--ok)")}
                ${renderSvgRing((k.schemas_rendered_done / Math.max(1, k.schemas_total)) * 100, "Schémas", `${k.schemas_rendered_done}/${k.schemas_total} rendus`, "var(--warn)")}
                ${renderSvgRing((k.gates_validated / Math.max(1, k.gates_total)) * 100, "Barrières", `${k.gates_validated}/${k.gates_total} G0–G5`, "var(--ok)")}
              </div>
            </section>
          </div>

          <section class="card">
            <div class="card-head">
              <h2 class="card-title">Fondations amont vérifiées sur disque</h2>
              <span class="card-meta">Commit <code>${escapeHtml(data.git.commit)}</code> (${escapeHtml(data.git.branch)})</span>
            </div>
            <div class="foundations-list">${foundationsHtml}</div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2 class="card-title">Ordonnancement en cinq vagues (V0–V5)</h2>
              <span class="card-meta">Extrait de § 6 de plan.md</span>
            </div>
            <div class="waves-grid">${wavesHtml}</div>
          </section>`;
      }

      function renderTasksHtml(data, editMode, query) {
        const q = (query || "").trim().toLowerCase();
        const tasks = (data.tasks || []).filter((t) => {
          if (!q) return true;
          const hay = [t.task_id, t.title, ...(t.files || []), ...(t.steps || []).map((s) => s.label)].join(" ").toLowerCase();
          return hay.includes(q);
        });

        const header = `
          <div class="card" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
            <div>
              <strong>Pipeline séquentiel Task 1 à Task 9</strong>
              <span class="card-meta" style="margin-left:8px;">${data.kpis.plan_steps_done} / ${data.kpis.plan_steps_total} étapes cochées dans <code>Compendium/plan.md</code></span>
            </div>
            <label class="edit-toggle ${editMode ? "active" : ""}">
              <input type="checkbox" id="toggle-edit-mode" ${editMode ? "checked" : ""} />
              <span>Mode édition <code>plan.md</code> ${editMode ? "(Actif)" : "(Verrouillé)"}</span>
            </label>
          </div>`;

        const cards = tasks.map((t) => {
          const stepsHtml = (t.steps || []).map((s) => `
            <li class="step-item ${s.checked ? "done" : ""}">
              <input class="step-checkbox" type="checkbox" data-line="${s.line_no}" ${s.checked ? "checked" : ""} ${editMode ? "" : "disabled"} />
              <div style="flex:1;">
                <div style="font-weight:600;">${escapeHtml(s.label)} <span style="font-size:11px;color:var(--text-subtle);font-weight:400;">(L${s.line_no})</span></div>
                ${s.command ? `<div class="step-cmd"><code>${escapeHtml(s.command)}</code></div>` : ""}
                ${s.expected ? `<div class="step-cmd">Attendu : ${escapeHtml(s.expected)}</div>` : ""}
              </div>
            </li>`).join("");

          return `
            <article class="task-card">
              <div class="task-head">
                <h3 class="task-title">${escapeHtml(t.task_id)} — ${escapeHtml(t.title)}</h3>
                <div style="display:flex;align-items:center;gap:8px;">
                  ${statusBadge(t.status)}
                  <span class="card-meta">${t.steps_done} / ${t.steps_total} (${formatPctFr(t.pct)})</span>
                </div>
              </div>
              <div class="progress-track" style="margin-bottom:8px;"><div class="progress-fill ${t.pct >= 100 ? "ok" : ""}" style="width:${t.pct}%"></div></div>
              ${t.files.length ? `<div class="card-meta" style="margin-bottom:6px;"><strong>Fichiers :</strong> ${t.files.map((f) => `<code>${escapeHtml(f)}</code>`).join(" · ")}</div>` : ""}
              <ul class="step-list">${stepsHtml}</ul>
            </article>`;
        }).join("");

        return header + (cards || "<div class='empty-state'>Aucune tâche ne correspond au filtre.</div>");
      }

      function renderUnitsHtml(data, filters) {
        const list = filterUnits(data.units, filters);
        const domainOpts = ["ALL", "GLOBAL", ...Array.from({ length: 12 }, (_, i) => "D" + String(i + 1).padStart(2, "0")), "ANNEXE"]
          .map((d) => `<option value="${d}" ${filters.domain === d ? "selected" : ""}>${d === "ALL" ? "Tous les domaines" : d}</option>`).join("");

            <td style="min-width:110px;">
              <div class="progress-track"><div class="progress-fill ${u.manuscript_status === "conforme" ? "ok" : (u.manuscript_status === "sur_calibre" ? "warn" : "")}" style="width:${Math.min(100, u.word_pct)}%"></div></div>
              <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${formatPctFr(u.word_pct)}</div>
            </td>
            <td>${statusBadge(u.manuscript_status)}</td>
            <td>${u.has_sources === null ? "<span class='badge badge-muted'>SSOT</span>" : (u.has_sources ? "<span class='badge badge-ok'>L+ OK</span>" : "<span class='badge badge-muted'>Absent</span>")}</td>
            <td class="num">${u.schemas_rendered}/${u.schemas_total}</td>
            <td>${u.has_ancrage === null ? "<span class='badge badge-muted'>SSOT</span>" : (u.has_ancrage ? "<span class='badge badge-ok'>G2 OK</span>" : "<span class='badge badge-muted'>Absent</span>")}</td>
          </tr>`).join("");

        return `
          <section class="card">
            <div class="card-head">
              <h2 class="card-title">Matrice des 42 unités (180 000 mots ± 8 %)</h2>
              <span class="card-meta">${list.length} unité(s) affichée(s) · cliquer une ligne pour ouvrir la fiche détaillée</span>
            </div>
            <div class="filter-bar">
              <select class="select" id="f-unit-domain">${domainOpts}</select>
              <select class="select" id="f-unit-type">
                <option value="ALL" ${filters.type === "ALL" ? "selected" : ""}>Tous les types</option>
                <option value="liminaire" ${filters.type === "liminaire" ? "selected" : ""}>Liminaire</option>

              </select>
              <select class="select" id="f-unit-status">
                <option value="ALL" ${filters.status === "ALL" ? "selected" : ""}>Tous les statuts</option>
                <option value="non_demarre" ${filters.status === "non_demarre" ? "selected" : ""}>Non démarré</option>
                <option value="sous_calibre" ${filters.status === "sous_calibre" ? "selected" : ""}>Sous-calibré</option>
                <option value="conforme" ${filters.status === "conforme" ? "selected" : ""}>Conforme</option>
                <option value="sur_calibre" ${filters.status === "sur_calibre" ? "selected" : ""}>Sur-calibré</option>

            <div class="table-wrap">

                    <th>Dom.</th>
                    <th class="num">Thèmes</th>
                    <th class="num">Cible</th>
                    <th class="num">Plage ± 8 %</th>
                    <th class="num">Mots réels</th>
                    <th>Calibrage</th>
                    <th>Manuscrit</th>
                    <th>Sources L+</th>
                    <th class="num">Schémas</th>
                    <th>Wyvern G2</th>
                  </tr>
                </thead>
                <tbody>${rows || "<tr><td colspan='11' class='empty-state'>Aucune unité ne correspond aux filtres.</td></tr>"}</tbody>
              </table>
            </div>
          </section>`;
      }

      function renderSchemasHtml(data, filters) {
        const all = data.schemas || [];
        const list = filterSchemas(all, filters);
        const byReuse = { reemploi_direct: 0, adaptation_vulgarisee: 0, creation_originale: 0 };
        const byNot = { PlantUML: 0, Mermaid: 0, "Infographie SVG bilingue métier-tech": 0 };
        all.forEach((s) => {
          byReuse[s.reuse_status] = (byReuse[s.reuse_status] || 0) + 1;
          byNot[s.recommended_notation] = (byNot[s.recommended_notation] || 0) + 1;

        const domainOpts = ["ALL", "GLOBAL", ...Array.from({ length: 12 }, (_, i) => "D" + String(i + 1).padStart(2, "0"))]

            <div>
              <div class="kpi-label" style="margin-bottom:6px;">Thèmes exclusifs owned_concepts (${unit.themes.length})</div>
              <div class="chip-wrap">${unit.themes.map((t) => `<span class="chip">${escapeHtml(t)}</span>`).join("")}</div>
            </div>` : ""}
          ${schemas.length ? `
            <div>
              <div class="kpi-label" style="margin-bottom:6px;">Schémas de vulgarisation (${schemas.length})</div>
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${schemas.map((s) => `<div class="foundation-item"><span><code>${escapeHtml(s.schema_id)}</code> — ${escapeHtml(s.title)}</span>${statusBadge(s.disk_status)}</div>`).join("")}
              </div>
            </div>` : ""}
          ${(unit.requirements || []).length ? `
            <div>
              <div class="kpi-label" style="margin-bottom:6px;">Identifiants normatifs clés</div>
              <div class="chip-wrap">${unit.requirements.map((r) => `<span class="chip">${escapeHtml(r)}</span>`).join("")}</div>
            </div>` : ""}
          ${unit.deliverables_summary ? `
            <div>
              <div class="kpi-label" style="margin-bottom:6px;">Livrables &amp; portes G1–G5</div>
              <div style="font-size:12.5px;color:var(--text-muted);">${escapeHtml(unit.deliverables_summary)}</div>
            </div>` : ""}`;
      }

      const Engine = {
        escapeHtml,
        formatIntFr,
        formatPctFr,
        formatBytes,
        filterUnits,
        filterSchemas,
        filterCriteria,
        filterFindings,
        renderSvgRing,
        renderDomainBarsSvg,
        renderRevisionBannerHtml,
        renderOverviewHtml,
        renderTasksHtml,
        renderUnitsHtml,
        renderSchemasHtml,
        renderAqHtml,
        renderFactoryHtml,
        renderRevisionHtml,
        renderInspectorHtml,
      };

      global.CompendiumDashboardEngine = Engine;

      if (typeof document === "undefined" || typeof window === "undefined") {
        return;
      }

      const state = {
        data: null,
        tab: "overview",
        query: "",
        editMode: false,
        pollMs: 60000,
        pollTimer: null,
        unitFilters: { domain: "ALL", type: "ALL", status: "ALL" },
        schemaFilters: { domain: "ALL", reuse: "ALL", notation: "ALL", disk: "ALL" },
        aqFilters: { gate: "ALL" },
        revisionFilters: { severity: "ALL", axis: "ALL", status: "ALL" },
        selectedUnitId: null,
      };

      function showToast(msg) {
        const el = document.getElementById("toast");
        if (!el) return;
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 2600);
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        try { localStorage.setItem("compendium_dash_theme_v2", theme); } catch (_) {}
      }

      function updateBadges(data) {
        const k = data.kpis;
        const setTxt = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
        setTxt("badge-tasks", `${k.plan_steps_done}/${k.plan_steps_total}`);
        setTxt("badge-units", `${k.units_conforme}/${k.units_total}`);
        setTxt("badge-schemas", `${k.schemas_rendered_done}/${k.schemas_total}`);
        setTxt("badge-aq", `${k.gates_validated}/${k.gates_total}`);
        setTxt("badge-factory", `${k.deliverables_done}/${k.deliverables_total}`);
        const rev = data.revision;
        if (rev && rev.active && rev.summary) {
          const rs = rev.summary;
          const badgeTxt = rs.open_count > 0
            ? `${rs.milestones_done}/${rs.milestones_total} · ${rs.open_count}`
            : `${rs.milestones_done}/${rs.milestones_total}`;
          setTxt("badge-revision", badgeTxt);
        } else {
          setTxt("badge-revision", "—");
        }
        const dt = new Date(data.generated_at);
        setTxt("hdr-meta", `v${data.meta.version} · ${formatIntFr(data.meta.word_count)} mots dans plan.md · MàJ ${dt.toLocaleTimeString("fr-CA")}`);
      }

      function openDrawer(unitId) {
        if (!state.data) return;
        const unit = state.data.units.find((u) => u.unit_id === unitId);
        if (!unit) return;
        state.selectedUnitId = unitId;
        document.getElementById("drawer-kicker").textContent = `${unit.domain_id} · ${unit.unit_id}`;
        document.getElementById("drawer-title").textContent = unit.title;
        document.getElementById("drawer-body").innerHTML = renderInspectorHtml(unit, state.data);
        document.getElementById("drawer-backdrop").classList.add("open");
        document.getElementById("unit-drawer").classList.add("open");
      }

      function closeDrawer() {
        state.selectedUnitId = null;
        document.getElementById("drawer-backdrop").classList.remove("open");
        document.getElementById("unit-drawer").classList.remove("open");
      }

      async function toggleStep(lineNo, checked) {
        try {
          const resp = await fetch("/api/steps/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ line_no: Number(lineNo), checked: Boolean(checked) }),
          });
          const res = await resp.json();
          if (!resp.ok || !res.ok) {
            throw new Error(res.error || "Échec de mise à jour");
          }
          state.data = res.dashboard;
          render();
          showToast(`Étape L${lineNo} ${checked ? "cochée" : "décochée"} dans plan.md`);
        } catch (err) {
          showToast(`Erreur : ${err.message}`);
          await loadDashboard();
        }
      }

      function bindTabEvents() {
        const editCb = document.getElementById("toggle-edit-mode");
        if (editCb) {
          editCb.addEventListener("change", (e) => {
            state.editMode = e.target.checked;
            render();
          });
        }
        document.querySelectorAll(".step-checkbox").forEach((cb) => {
          cb.addEventListener("change", (e) => {
            toggleStep(Number(e.target.dataset.line), e.target.checked);
          });
        });

        const bindSelect = (id, obj, key) => {
          const el = document.getElementById(id);
          if (el) el.addEventListener("change", (e) => { obj[key] = e.target.value; render(); });
        };
        bindSelect("f-unit-domain", state.unitFilters, "domain");
        bindSelect("f-unit-type", state.unitFilters, "type");
        bindSelect("f-unit-status", state.unitFilters, "status");
        bindSelect("f-sch-domain", state.schemaFilters, "domain");
        bindSelect("f-sch-reuse", state.schemaFilters, "reuse");
        bindSelect("f-sch-notation", state.schemaFilters, "notation");
        bindSelect("f-sch-disk", state.schemaFilters, "disk");
        bindSelect("f-ca-gate", state.aqFilters, "gate");
        bindSelect("f-rev-severity", state.revisionFilters, "severity");
        bindSelect("f-rev-axis", state.revisionFilters, "axis");
        bindSelect("f-rev-status", state.revisionFilters, "status");

        document.querySelectorAll("[data-goto-tab]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const targetTab = btn.dataset.gotoTab;
            if (!targetTab) return;
            state.tab = targetTab;
            document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === targetTab));
            render();
          });
        });

        document.querySelectorAll("tr[data-unit]").forEach((tr) => {
          tr.addEventListener("click", () => openDrawer(tr.dataset.unit));
        });
      }

      function render() {
        if (!state.data) return;
        updateBadges(state.data);
        const container = document.getElementById("app-content");
        if (state.tab === "overview") {
          container.innerHTML = renderOverviewHtml(state.data);
        } else if (state.tab === "tasks") {
          container.innerHTML = renderTasksHtml(state.data, state.editMode, state.query);
        } else if (state.tab === "units") {
          container.innerHTML = renderUnitsHtml(state.data, { ...state.unitFilters, query: state.query });
        } else if (state.tab === "schemas") {
          container.innerHTML = renderSchemasHtml(state.data, { ...state.schemaFilters, query: state.query });
        } else if (state.tab === "aq") {
          container.innerHTML = renderAqHtml(state.data, { ...state.aqFilters, query: state.query });
        } else if (state.tab === "factory") {
          container.innerHTML = renderFactoryHtml(state.data);
        } else if (state.tab === "revision") {
          container.innerHTML = renderRevisionHtml(state.data, { ...state.revisionFilters, query: state.query });
        }
        bindTabEvents();
        if (state.selectedUnitId) {
          const unit = state.data.units.find((u) => u.unit_id === state.selectedUnitId);
          if (unit) document.getElementById("drawer-body").innerHTML = renderInspectorHtml(unit, state.data);
        }
      }

      async function loadDashboard(quiet) {
        try {
          const resp = await fetch("/api/dashboard", { cache: "no-store" });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          state.data = await resp.json();
          const pill = document.getElementById("pill-live");
          if (pill) {
            pill.className = "pill-live";
            pill.innerHTML = "<span class='pill-dot'></span><span>En direct</span>";
          }
          render();
          if (!quiet) showToast("Données actualisées depuis plan.md");
        } catch (err) {
          const pill = document.getElementById("pill-live");
          if (pill) {
            pill.className = "badge badge-danger";
            pill.textContent = "Hors ligne";
          }
          if (!state.data) {
            document.getElementById("app-content").innerHTML = `<div class="empty-state">Erreur de chargement : ${escapeHtml(err.message)}</div>`;
          }
        }
      }

      function setupPolling() {
        clearInterval(state.pollTimer);
        if (state.pollMs > 0) {
          state.pollTimer = setInterval(() => loadDashboard(true), state.pollMs);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        try {
          const savedTheme = localStorage.getItem("compendium_dash_theme_v2") || "dark";
          document.getElementById("theme-select").value = savedTheme;
          applyTheme(savedTheme);
        } catch (_) {}

        document.getElementById("theme-select").addEventListener("change", (e) => applyTheme(e.target.value));
        document.getElementById("poll-select").addEventListener("change", (e) => {
          state.pollMs = Number(e.target.value) || 0;
          setupPolling();
        });
        document.getElementById("btn-refresh").addEventListener("click", () => loadDashboard(false));
        document.getElementById("btn-csv").addEventListener("click", () => {
          window.location.href = "/api/export/csv";
        });
        document.getElementById("btn-json").addEventListener("click", () => {
          if (!state.data) return;
          const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "compendium-progression.json";
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        const searchEl = document.getElementById("global-search");
        searchEl.addEventListener("input", (e) => {
          state.query = e.target.value;
          if (state.tab === "overview" && state.query.trim()) {
            state.tab = "units";
            document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === "units"));
          }
          render();
        });

        document.addEventListener("keydown", (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            searchEl.focus();
            searchEl.select();
          } else if (e.key === "Escape") {
            closeDrawer();
          }
        });

        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.tab = btn.dataset.tab;
            document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
            render();
          });
        });

        document.getElementById("drawer-close").addEventListener("click", closeDrawer);
        document.getElementById("drawer-backdrop").addEventListener("click", closeDrawer);

        loadDashboard(true);
        setupPolling();
      });
    })(typeof globalThis !== "undefined" ? globalThis : window);
  </script>
</body>
</html>
