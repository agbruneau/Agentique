<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<rect id="bg-canvas" x="0" y="0" width="1200" height="860" fill="#FFFFFF"/>
<rect id="header-bg" x="0" y="0" width="1200" height="104" fill="#0F2942"/>
<rect x="28" y="14" width="110" height="24" rx="5" fill="#1D4ED8"/><text x="83" y="31" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">SCH-13-01</text>
<rect x="148" y="14" width="330" height="24" rx="5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1"/><text x="313" y="31" text-anchor="middle" font-size="12" fill="#E2E8F0">Arbre de décision opérationnel</text>
<text x="1172" y="31" text-anchor="end" font-size="11" fill="#93C5FD">Systèmes d'agentivité · fr-CA</text>
<text x="28" y="62" font-size="18" font-weight="bold" fill="#FFFFFF">L'échelle de sobriété OO1–OO4 et l'encapsulation BPMN/APM : conditionner le</text>
<text x="28" y="86" font-size="18" font-weight="bold" fill="#FFFFFF">multi-agents au gain démontré</text>
<g id="zone-Z1" class="zone">
  <rect x="28" y="122" width="1144" height="136" rx="10" fill="#F8FAFF" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="28" y="122" width="8" height="136" rx="4" fill="#1D4ED8"/>
  <text x="46" y="144" font-size="13.5" font-weight="bold" fill="#1D4ED8">Z1 — Paliers déterministes par défaut (OO1 Code/DMN → OO2 Chaîne structurée)</text>
  <g id="node-1" class="node" data-node="true">
    <rect x="42.0" y="160" width="551.0" height="86" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="53.0" y="182" font-size="13" font-weight="bold" fill="#1E3A8A">OO1 · Code pur &amp; règles DMN</text>
    <line x1="53.0" y1="194" x2="582.0" y2="194" stroke="#1D4ED8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="208" font-size="11.8" fill="#1E293B">Calculs exacts et règles fixes</text>
    <text x="53.0" y="224" font-size="11.8" fill="#1E293B">Coût marginal minimal sans LLM</text>
  </g>
  <g id="node-2" class="node" data-node="true">
    <rect x="607.0" y="160" width="551.0" height="86" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="618.0" y="182" font-size="13" font-weight="bold" fill="#1E3A8A">OO2 · Chaîne structurée fixe</text>
    <line x1="618.0" y1="194" x2="1147.0" y2="194" stroke="#1D4ED8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="208" font-size="11.8" fill="#1E293B">Flux prévisible sans boucle libre</text>
    <text x="618.0" y="224" font-size="11.8" fill="#1E293B">Proscrit si test C26 § 29.4.1 positif</text>
  </g>
</g>
<g id="zone-Z2" class="zone">
  <rect x="28" y="272" width="1144" height="136" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <rect x="28" y="272" width="8" height="136" rx="4" fill="#047857"/>
  <text x="46" y="294" font-size="13.5" font-weight="bold" fill="#047857">Z2 — Capsules hybrides d'encadrement (BPMN fromAi, CMMN, Routine et frames APM)</text>
  <g id="node-3" class="node" data-node="true">
    <rect x="42.0" y="310" width="362.7" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="53.0" y="332" font-size="13" font-weight="bold" fill="#064E3B">Test cumulatif C26 § 29.4.1</text>
    <line x1="53.0" y1="344" x2="393.7" y2="344" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="358" font-size="11.8" fill="#1E293B">Issue opposable + trace exigible</text>
    <text x="53.0" y="374" font-size="11.8" fill="#1E293B">+ dommage non réparable → OO3</text>
  </g>
  <g id="node-4" class="node" data-node="true">
    <rect x="418.7" y="310" width="362.7" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="429.7" y="332" font-size="13" font-weight="bold" fill="#064E3B">Capsule BPMN / CMMN / Routine</text>
    <line x1="429.7" y1="344" x2="770.3" y2="344" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="429.7" y="358" font-size="11.8" fill="#1E293B">Sous-processus plafonné à 10 appels</text>
    <text x="429.7" y="374" font-size="11.8" fill="#1E293B">Tâche typée &amp; règles DMN préalables</text>
  </g>
  <g id="node-5" class="node" data-node="true">
    <rect x="795.3" y="310" width="362.7" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="806.3" y="332" font-size="13" font-weight="bold" fill="#064E3B">Frames locaux APM (§ 22.10)</text>
    <line x1="806.3" y1="344" x2="1147.0" y2="344" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="806.3" y="358" font-size="11.8" fill="#1E293B">Bornent les marges d'initiative</text>
    <text x="806.3" y="374" font-size="11.8" fill="#1E293B">Comblent l'écart juridique</text>
  </g>
</g>
<g id="zone-Z3" class="zone">
  <rect x="28" y="422" width="1144" height="136" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="28" y="422" width="8" height="136" rx="4" fill="#B45309"/>
  <text x="46" y="444" font-size="13.5" font-weight="bold" fill="#B45309">Z3 — Porte probatoire vers OO4 (Multi-agents homologué EXIG-ORC-01/02)</text>
  <g id="node-6" class="node" data-node="true">
    <rect x="42.0" y="460" width="551.0" height="86" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
    <text x="53.0" y="482" font-size="13" font-weight="bold" fill="#451A03">Porte statistique IC 95 % &amp; CPO</text>
    <line x1="53.0" y1="494" x2="582.0" y2="494" stroke="#B45309" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="508" font-size="11.8" fill="#1E293B">Tâches réellement décomposables</text>
    <text x="53.0" y="524" font-size="11.8" fill="#1E293B">Gain pass^k prouvé contre saturation 45 %</text>
  </g>
  <g id="node-7" class="node" data-node="true">
    <rect x="607.0" y="460" width="551.0" height="86" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
    <text x="618.0" y="482" font-size="13" font-weight="bold" fill="#451A03">Collectif OO4 homologué</text>
    <line x1="618.0" y1="494" x2="1147.0" y2="494" stroke="#B45309" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="508" font-size="11.8" fill="#1E293B">Surpasse le surcoût 3×–15×</text>
    <text x="618.0" y="524" font-size="11.8" fill="#1E293B">Sous contrôle de l'effet Ringelmann</text>
  </g>
</g>
<g id="flows-box">
  <rect x="28" y="572" width="1144" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="594" font-size="12.5" font-weight="bold" fill="#0F2942">Flux d'exécution et de contrôle</text>
  <text x="42.0" y="612" font-size="11.5" fill="#334155">① Vérifier si une règle déterministe (OO1) ou un graphe fixe (OO2) suffit sans</text>
  <text x="42.0" y="627" font-size="11.5" fill="#334155">recourir à l'IA générative.</text>
  <text x="609.0" y="612" font-size="11.5" fill="#334155">② Évaluer C26 § 29.4.1 : devant une issue opposable et un dommage non réparable,</text>
  <text x="609.0" y="627" font-size="11.5" fill="#334155">basculer vers OO3 encadré.</text>
  <text x="42.0" y="650" font-size="11.5" fill="#334155">③ Encapsuler l'agent unique dans un sous-processus BPMN/CMMN/Routine et des frames</text>
  <text x="42.0" y="665" font-size="11.5" fill="#334155">locaux APM.</text>
  <text x="609.0" y="650" font-size="11.5" fill="#334155">④ Autoriser le collectif OO4 uniquement sur preuve chiffrée de constance pass^k et</text>
  <text x="609.0" y="665" font-size="11.5" fill="#334155">de CPO surpassant 3×–15×.</text>
</g>
<g id="legend-box">
  <rect x="28" y="704" width="1144" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="42.0" y="715" width="14" height="14" rx="3" fill="#1D4ED8"/>
  <text x="62.0" y="726" font-size="11" fill="#1E293B">Automatisation déterministe sobre et peu coûteuse (OO1</text>
  <text x="62.0" y="741" font-size="11" fill="#1E293B">et OO2)</text>
  <rect x="418.7" y="715" width="14" height="14" rx="3" fill="#047857"/>
  <text x="438.7" y="726" font-size="11" fill="#1E293B">Agent unique encadré par capsule BPMN/APM et bascule</text>
  <text x="438.7" y="741" font-size="11" fill="#1E293B">OO3</text>
  <rect x="795.3" y="715" width="14" height="14" rx="3" fill="#D97706"/>
  <text x="815.3" y="726" font-size="11" fill="#1E293B">Collectif multi-agents OO4 subordonné à preuve</text>
  <text x="815.3" y="741" font-size="11" fill="#1E293B">statistique et CPO</text>
</g>
<g id="takeaway-box">
  <rect x="28" y="774" width="1144" height="68" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="28" y="774" width="6" height="68" rx="3" fill="#1B4F72"/>
  <text x="44" y="794" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
  <text x="44" y="812" font-size="11.5" fill="#1E293B">Une architecture d'entreprise demeure déterministe partout où cela suffit et n'active l'autonomie que dans une capsule strictement</text>
  <text x="44" y="828" font-size="11.5" fill="#1E293B">mesurée.</text>
</g>
</svg>
