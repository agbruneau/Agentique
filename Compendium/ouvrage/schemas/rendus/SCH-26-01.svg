      <text x="46" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#78350F">Reports Digital Omnibus 2026/1744</text>
      <text x="46" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Haut risque Annexe III → 2 déc. 2027</text>
      <text x="46" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Annexe I → 2 août 2028 · US SR 26-2 / UK</text>
    </g>
  </g>
