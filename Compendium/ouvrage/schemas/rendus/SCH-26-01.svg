      <text x="46" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E3A8A">EU AI Act actif (août 2026)</text>
      <text x="46" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Transparence art. 50 en vigueur</text>
      <text x="46" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Supervision humaine &amp; arrêt art. 14</text>
    </g>
    <g id="node-2" class="node" data-node="true">
