    <g id="node-6" class="node" data-node="true">
      <rect x="818" y="329" width="346" height="165" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
      <text x="830" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#4C1D95">Directive produits (UE) 2024/2853</text>
      <text x="830" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Responsabilité logiciels défectueux</text>
      <text x="830" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Sans analogie mécanique en droit CA</text>
    </g>
