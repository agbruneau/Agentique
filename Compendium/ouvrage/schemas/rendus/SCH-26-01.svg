      <rect x="426" y="329" width="346" height="165" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
      <text x="438" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#064E3B">SMQ EN 18286:2026 &amp; eIDAS 2.0</text>
      <text x="438" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Présomption conformité EXIG-CON-30</text>
      <text x="438" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">UE 2024/903 · portefeuille déc. 2026</text>
    </g>
  </g>
