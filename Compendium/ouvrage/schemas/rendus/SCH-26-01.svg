      <text x="438" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Résilience numérique · CTI nov. 2025</text>
      <text x="438" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">SBOM &amp; vulnérabilités CRA</text>
    </g>
