<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect id="bg-canvas" x="0" y="0" width="1200" height="820" fill="#FFFFFF"/>
  <g id="header-bar">
    <rect x="20" y="16" width="1160" height="74" rx="10" fill="#0F2942"/>
    <text x="38" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">SCH-20-03 — La Règle de deux et le marquage CaMeL</text>
    <text x="38" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">Retirer l'outil d'envoi dès que l'agent lit une source externe douteuse · Systèmes d'agentivité (fr-CA)</text>
  </g>
  <g id="zone-Z1">
    <rect x="20" y="104" width="571" height="446" rx="10" fill="#F8FAFC" stroke="#B91C1C" stroke-width="1.8"/>
    <rect x="20" y="104" width="571" height="38" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="34" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7F1D1D">Z1 · Session composée sous Règle de deux (rule_of_two.rego)</text>
    <line x1="593" y1="327" x2="607" y2="327" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g id="node-1" class="node" data-node="true">
      <rect x="34" y="152" width="543" height="117" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="2"/>
      <text x="46" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F2942">Propriété (B) · Données sensibles</text>
      <text x="46" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Accès coffre privé ou dossier client</text>
      <text x="46" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Autorisé tant qu'isolé de (A) et (C)</text>
    </g>
    <g id="node-2" class="node" data-node="true">
      <rect x="34" y="281" width="543" height="117" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="46" y="305" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#78350F">Propriété (A) · Source non fiable</text>
      <text x="46" y="327" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Document externe ou courriel tiers</text>
      <text x="46" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Cumul max : 2 propriétés sur 3</text>
    </g>
    <g id="node-3" class="node" data-node="true">
      <rect x="34" y="410" width="543" height="117" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
      <text x="46" y="434" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7F1D1D">Verrou (C) · Retrait automatique</text>
      <text x="46" y="456" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">EXIG-SEC-04/06 : outils sortants &amp; P3</text>
      <text x="46" y="475" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">retirés dès (A)+(B) (médiane PEP 52,85 µs)</text>
    </g>
  </g>
  <g id="zone-Z2">
    <rect x="609" y="104" width="571" height="446" rx="10" fill="#F8FAFC" stroke="#047857" stroke-width="1.8"/>
    <rect x="609" y="104" width="571" height="38" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
    <text x="623" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#064E3B">Z2 · Séparation CaMeL &amp; étiquettes A2A (camel_taint.rego)</text>
    <g id="node-4" class="node" data-node="true">
      <rect x="623" y="152" width="543" height="117" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
      <text x="635" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#134E4A">Flot de contrôle vs données (EXIG-SEC-07)</text>
      <text x="635" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Graphe d'appels fiable isolé des données</text>
      <text x="635" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">contaminées (contrôle C6 : 64,01 µs moy.)</text>
    </g>
    <g id="node-5" class="node" data-node="true">
      <rect x="623" y="281" width="543" height="117" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="635" y="305" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#78350F">Propagation de teinte A2A</text>
      <text x="635" y="327" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Empêche le blanchiment inter-agents</text>
      <text x="635" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">(Can CaMeLs Talk?)</text>
    </g>
    <g id="node-6" class="node" data-node="true">
      <rect x="623" y="410" width="543" height="117" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
      <text x="635" y="434" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#064E3B">Libération sous contexte vierge ou CIBA</text>
      <text x="635" y="456" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Redémarrage vierge ou jeton humain</text>
      <text x="635" y="475" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">CIBA lié au condensat JCS h</text>
    </g>
  </g>
  <g id="flows-bar">
    <rect x="20" y="562" width="1160" height="108" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① L'agent lit des données privées (B) puis une source non fiable (A) en</text>
    <text x="34" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">session.</text>
    <text x="610" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② La passerelle détecte (A)+(B) (rule_of_two.rego) et retire tous les</text>
    <text x="610" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">outils (C).</text>
    <text x="34" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ Tout relais A2A conserve son étiquette de contamination CaMeL</text>
    <text x="34" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">(camel_taint.rego).</text>
    <text x="610" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ L'action externe reste bloquée jusqu'au contexte vierge ou visa CIBA/JCS</text>
    <text x="610" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">h.</text>
  </g>
  <g id="legend-bar">
    <rect x="20" y="680" width="1160" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="34" y="692" width="18" height="18" rx="4" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="60" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Retrait automatique outils (C) (EXIG-GOV-17)</text>
    <rect x="411" y="692" width="18" height="18" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="437" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Teinte CaMeL propagée entre tâches &amp; A2A</text>
    <rect x="788" y="692" width="18" height="18" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="814" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Contexte vierge ou approbation CIBA/JCS</text>
  </g>
  <g id="takeaway-box">
    <rect x="20" y="734" width="1160" height="68" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
    <text x="36" y="756" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
    <text x="36" y="776" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">La coexistence d'un secret client, d'un document externe et d'un canal sortant est proscrite : Règle de deux + CaMeL sectionnent</text>
    <text x="36" y="792" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">la sortie dès (A)+(B).</text>
  </g>
</svg>
