<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect id="bg-canvas" x="0" y="0" width="1200" height="820" fill="#FFFFFF"/>
  <g id="header-bar">
    <rect x="20" y="16" width="1160" height="74" rx="10" fill="#0F2942"/>
    <text x="38" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">SCH-24-01 — Du prix trompeur du jeton au Cost-per-Outcome (FOCUS v1.4)</text>
    <text x="38" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">Cascade frugale SLM/LLM, disjoncteur 70 % / 80 % / 100 % et empreinte carbone BSIF B-15 · Systèmes d'agentivité (fr-CA)</text>
  </g>
  <g id="zone-Z1">
    <rect x="20" y="104" width="374" height="446" rx="10" fill="#F8FAFC" stroke="#B91C1C" stroke-width="1.8"/>
    <rect x="20" y="104" width="374" height="38" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="34" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7F1D1D">Z1 · Avant : Piège du tarif au jeton (AP-03)</text>
    <line x1="396" y1="327" x2="410" y2="327" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g id="node-1" class="node" data-node="true">
      <rect x="34" y="152" width="346" height="165" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
      <text x="46" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7F1D1D">Relecture &gt; 97 % &amp; facteur 4×–15×</text>
      <text x="46" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Contexte relu à chaque tour</text>
      <text x="46" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Crédits SaaS opaques en multi-agents</text>
    </g>
    <g id="node-2" class="node" data-node="true">
      <rect x="34" y="329" width="346" height="165" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="46" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#78350F">Incident non plafonné : 41 000 $ CA</text>
      <text x="46" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Boucle 11 h (scénario illustratif Boréal)</text>
      <text x="46" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Absence de coupure atomique</text>
    </g>
  </g>
  <g id="zone-Z2">
    <rect x="412" y="104" width="374" height="446" rx="10" fill="#F8FAFC" stroke="#0F766E" stroke-width="1.8"/>
    <rect x="412" y="104" width="374" height="38" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/>
    <text x="426" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#134E4A">Z2 · Après : Plan d'inférence frugal</text>
    <line x1="788" y1="327" x2="802" y2="327" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g id="node-3" class="node" data-node="true">
      <rect x="426" y="152" width="346" height="165" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
      <text x="438" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#134E4A">Alias logiques &amp; cache KV (~90 %)</text>
      <text x="438" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Préfixes fixes sur agentgateway</text>
      <text x="438" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Lots asynchrones (-50 % sur 24 h)</text>
    </g>
    <g id="node-4" class="node" data-node="true">
      <rect x="426" y="329" width="346" height="165" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
      <text x="438" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E3A8A">Cascade 3 niveaux (SLM 40–70 %)</text>
      <text x="438" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Cible Boréal 73–86 % · qualifié en E2</text>
      <text x="438" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Ordonnanceur à affinité KV-cache</text>
    </g>
  </g>
  <g id="zone-Z3">
    <rect x="804" y="104" width="374" height="446" rx="10" fill="#F8FAFC" stroke="#047857" stroke-width="1.8"/>
    <rect x="804" y="104" width="374" height="38" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
    <text x="818" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#064E3B">Z3 · CPO FOCUS v1.4 &amp; disjoncteurs</text>
    <g id="node-5" class="node" data-node="true">
      <rect x="818" y="152" width="346" height="165" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
      <text x="830" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#064E3B">Calculateur Decimal (échecs + HOTL)</text>
      <text x="830" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Champs x_energy_kwh &amp; x_carbon_gco2e</text>
      <text x="830" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Conformité BSIF B-15 (CAP-046)</text>
    </g>
    <g id="node-6" class="node" data-node="true">
      <rect x="818" y="329" width="346" height="165" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="2"/>
      <text x="830" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0F2942">Enveloppes 70 % / 80 % / 100 %</text>
      <text x="830" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">70 % SLM · 80 % alerte · 100 % arrêt (hors Saga)</text>
      <text x="830" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Revue 2 mois · Déclassement 2 trim. déficitaires</text>
    </g>
  </g>
  <g id="flows-bar">
    <rect x="20" y="562" width="1160" height="108" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① L'inférence cible un alias logique orienté vers le plus petit SLM</text>
    <text x="34" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">qualifié (cache KV).</text>
    <text x="610" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② La passerelle applique les seuils atomiques 70 % (SLM), 80 % (alerte) et</text>
    <text x="610" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">100 % (arrêt hors Saga).</text>
    <text x="34" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ Les spans OTel alimentent FOCUS v1.4 étendu (x_energy_kwh,</text>
    <text x="34" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">x_carbon_gco2e, B-15).</text>
    <text x="610" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ Le CPO complet (échecs + HOTL inclus) pilote Showback → Chargeback /</text>
    <text x="610" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">déclassement.</text>
  </g>
  <g id="legend-bar">
    <rect x="20" y="680" width="1160" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="34" y="692" width="18" height="18" rx="4" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="60" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Amplification 4×–15× &amp; relecture &gt; 97 %</text>
    <rect x="411" y="692" width="18" height="18" rx="4" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
    <text x="437" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Cascade SLM/LLM, KV-cache &amp; lots -50 %</text>
    <rect x="788" y="692" width="18" height="18" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="814" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">CPO Decimal / FOCUS v1.4 &amp; seuils 70/80/100 %</text>
  </g>
  <g id="takeaway-box">
    <rect x="20" y="734" width="1160" height="68" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
    <text x="36" y="756" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
    <text x="36" y="776" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">La maîtrise budgétaire repose sur le coût complet par dossier conforme (CPO), le routage vers des SLM avec cache KV et des</text>
    <text x="36" y="792" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">plafonds à coupure nette.</text>
  </g>
</svg>
