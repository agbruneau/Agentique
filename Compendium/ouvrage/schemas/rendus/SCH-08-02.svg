<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<rect id="bg-canvas" x="0" y="0" width="1200" height="860" fill="#FFFFFF"/>
<rect id="header-bg" x="0" y="0" width="1200" height="104" fill="#0F2942"/>
<rect x="28" y="14" width="110" height="24" rx="5" fill="#1D4ED8"/><text x="83" y="31" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">SCH-08-02</text>
<rect x="148" y="14" width="330" height="24" rx="5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1"/><text x="313" y="31" text-anchor="middle" font-size="12" fill="#E2E8F0">Métaphore architecturale en couches</text>
<text x="1172" y="31" text-anchor="end" font-size="11" fill="#93C5FD">Systèmes d'agentivité · fr-CA</text>
<text x="28" y="62" font-size="18" font-weight="bold" fill="#FFFFFF">Commerce agentique (AP2, x402, MPP) face aux rails financiers et à la</text>
<text x="28" y="86" font-size="18" font-weight="bold" fill="#FFFFFF">fédération B2B (AGNTCY / ODRL / vLEI)</text>
<g id="zone-Z1" class="zone">
  <rect x="28" y="122" width="1144" height="136" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="28" y="122" width="8" height="136" rx="4" fill="#B45309"/>
  <text x="46" y="144" font-size="13.5" font-weight="bold" fill="#B45309">Z1 — Strate transactionnelle en veille — AP2 v0.2, ACP commercial, UCP, x402 et MPP</text>
  <g id="node-1" class="node" data-node="true">
    <rect x="42.0" y="160" width="551.0" height="86" rx="8" fill="#FFF5E0" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="53.0" y="182" font-size="13" font-weight="bold" fill="#451A03">Chaîne Intent → Cart → Payment</text>
    <line x1="53.0" y1="194" x2="582.0" y2="194" stroke="#D97706" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="208" font-size="11.8" fill="#1E293B">Enveloppes SD-JWT dissociant consentement</text>
    <text x="53.0" y="224" font-size="11.8" fill="#1E293B">et règlement (FMI 2026/004)</text>
  </g>
  <g id="node-2" class="node" data-node="true">
    <rect x="607.0" y="160" width="551.0" height="86" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
    <text x="618.0" y="182" font-size="13" font-weight="bold" fill="#451A03">Statut Surveiller (hors production)</text>
    <line x1="618.0" y1="194" x2="1147.0" y2="194" stroke="#B45309" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="208" font-size="11.8" fill="#1E293B">Transfert FIDO S-090 non matérialisé</text>
    <text x="618.0" y="224" font-size="11.8" fill="#1E293B">Risque d'achat non intentionnel · visa CIBA</text>
  </g>
</g>
<g id="zone-Z2" class="zone">
  <rect x="28" y="272" width="1144" height="136" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="28" y="272" width="8" height="136" rx="4" fill="#B45309"/>
  <text x="46" y="294" font-size="13.5" font-weight="bold" fill="#B45309">Z2 — Strate transport et découverte fédérée — AGNTCY (OASF, ADS, SLIM/MLS)</text>
  <g id="node-3" class="node" data-node="true">
    <rect x="42.0" y="310" width="551.0" height="86" rx="8" fill="#FFF5E0" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="53.0" y="332" font-size="13" font-weight="bold" fill="#451A03">OASF &amp; annuaire ADS (Évaluer)</text>
    <line x1="53.0" y1="344" x2="582.0" y2="344" stroke="#D97706" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="358" font-size="11.8" fill="#1E293B">Subordonnés au registre interne</text>
    <text x="53.0" y="374" font-size="11.8" fill="#1E293B">Masquage des structures internes</text>
  </g>
  <g id="node-4" class="node" data-node="true">
    <rect x="607.0" y="310" width="551.0" height="86" rx="8" fill="#FFF5E0" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="618.0" y="332" font-size="13" font-weight="bold" fill="#451A03">Transport SLIM / MLS RFC 9420</text>
    <line x1="618.0" y1="344" x2="1147.0" y2="344" stroke="#D97706" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="358" font-size="11.8" fill="#1E293B">Chiffrement de groupe bout en bout</text>
    <text x="618.0" y="374" font-size="11.8" fill="#1E293B">Maintenu au statut Surveiller</text>
  </g>
</g>
<g id="zone-Z3" class="zone">
  <rect x="28" y="422" width="1144" height="136" rx="10" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="28" y="422" width="8" height="136" rx="4" fill="#6D28D9"/>
  <text x="46" y="444" font-size="13.5" font-weight="bold" fill="#6D28D9">Z3 — Strate B2B contractuelle au Palier 3 (ADR-026) — vLEI, Dataspace EDC et ODRL 2.2</text>
  <g id="node-5" class="node" data-node="true">
    <rect x="42.0" y="460" width="551.0" height="86" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
    <text x="53.0" y="482" font-size="13" font-weight="bold" fill="#4C1D95">Preuve légale GLEIF vLEI &amp; ODRL 2.2</text>
    <line x1="53.0" y1="494" x2="582.0" y2="494" stroke="#6D28D9" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="508" font-size="11.8" fill="#1E293B">Connecteur Dataspace EDC vérifiant</text>
    <text x="53.0" y="524" font-size="11.8" fill="#1E293B">l'identité légale OOR et la licence</text>
  </g>
  <g id="node-6" class="node" data-node="true">
    <rect x="607.0" y="460" width="551.0" height="86" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="2"/>
    <text x="618.0" y="482" font-size="13" font-weight="bold" fill="#0F2942">Scission Diplomate / Évaluateur</text>
    <line x1="618.0" y1="494" x2="1147.0" y2="494" stroke="#1B4F72" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="508" font-size="11.8" fill="#1E293B">Diplomate externe sans secret</text>
    <text x="618.0" y="524" font-size="11.8" fill="#1E293B">Évaluateur interne &amp; rail bancaire sûr</text>
  </g>
</g>
<g id="flows-box">
  <rect x="28" y="572" width="1144" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="594" font-size="12.5" font-weight="bold" fill="#0F2942">Flux d'exécution et de contrôle</text>
  <text x="42.0" y="612" font-size="11.5" fill="#334155">① Un mandant signe une enveloppe d'intention bornée ; en palier P3, aucune exécution</text>
  <text x="42.0" y="627" font-size="11.5" fill="#334155">sans approbation FIDO2/CIBA.</text>
  <text x="609.0" y="612" font-size="11.5" fill="#334155">② Au sein d'AGNTCY, l'annuaire ADS reste subordonné au registre interne pendant que</text>
  <text x="609.0" y="627" font-size="11.5" fill="#334155">SLIM chiffre le transport via MLS.</text>
  <text x="42.0" y="650" font-size="11.5" fill="#334155">③ En fédération B2B (2033–2035), le connecteur Dataspace contrôle vLEI et ODRL 2.2</text>
  <text x="42.0" y="665" font-size="11.5" fill="#334155">avant échange avec le Diplomate.</text>
  <text x="609.0" y="650" font-size="11.5" fill="#334155">④ L'Évaluateur interne valide marges et non-collusion avant tout règlement sur le</text>
  <text x="609.0" y="665" font-size="11.5" fill="#334155">rail bancaire déterministe.</text>
</g>
<g id="legend-box">
  <rect x="28" y="704" width="1144" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="42.0" y="715" width="14" height="14" rx="3" fill="#D97706"/>
  <text x="62.0" y="726" font-size="11" fill="#1E293B">Protocoles en veille ou évaluation hors production</text>
  <text x="62.0" y="741" font-size="11" fill="#1E293B">(AP2, ADS, SLIM)</text>
  <rect x="418.7" y="715" width="14" height="14" rx="3" fill="#6D28D9"/>
  <text x="438.7" y="726" font-size="11" fill="#1E293B">Cadre juridique B2B et consentement (vLEI, ODRL 2.2,</text>
  <text x="438.7" y="741" font-size="11" fill="#1E293B">litiges)</text>
  <rect x="795.3" y="715" width="14" height="14" rx="3" fill="#1B4F72"/>
  <text x="815.3" y="726" font-size="11" fill="#1E293B">Contrôle déterministe interne (catalogue, Évaluateur,</text>
  <text x="815.3" y="741" font-size="11" fill="#1E293B">rail bancaire)</text>
</g>
<g id="takeaway-box">
  <rect x="28" y="774" width="1144" height="68" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="28" y="774" width="6" height="68" rx="3" fill="#1B4F72"/>
  <text x="44" y="794" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
  <text x="44" y="812" font-size="11.5" fill="#1E293B">La signature technique d'une commande par un agent ne fonde ni responsabilité juridique claire ni droit au remboursement : AP2 et x402</text>
  <text x="44" y="828" font-size="11.5" fill="#1E293B">demeurent en veille tant que la gouvernance FIDO et le droit des litiges ne sont pas établis.</text>
</g>
</svg>
