<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<rect id="bg-canvas" x="0" y="0" width="1200" height="860" fill="#FFFFFF"/>
<rect id="header-bg" x="0" y="0" width="1200" height="104" fill="#0F2942"/>
<rect x="28" y="14" width="110" height="24" rx="5" fill="#1D4ED8"/><text x="83" y="31" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">SCH-05-01</text>
<rect x="148" y="14" width="330" height="24" rx="5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1"/><text x="313" y="31" text-anchor="middle" font-size="12" fill="#E2E8F0">Échelle graduée de maturité / autonomie</text>
<text x="1172" y="31" text-anchor="end" font-size="11" fill="#93C5FD">Systèmes d'agentivité · fr-CA</text>
<text x="28" y="62" font-size="18" font-weight="bold" fill="#FFFFFF">L'escalier d'autonomie unifié N0–N4 / L0–L4, l'interdit NX et la matrice</text>
<text x="28" y="86" font-size="18" font-weight="bold" fill="#FFFFFF">D1–D8 × Classes 1–6</text>
<g id="zone-Z1" class="zone">
  <rect x="28" y="122" width="1144" height="136" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <rect x="28" y="122" width="8" height="136" rx="4" fill="#047857"/>
  <text x="46" y="144" font-size="13.5" font-weight="bold" fill="#047857">Z1 — Désambiguïsation DISC-01 / DISC-02 et échelle unique N0–N4 (L0–L4)</text>
  <g id="node-1" class="node" data-node="true">
    <rect x="42.0" y="160" width="362.7" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="53.0" y="182" font-size="13" font-weight="bold" fill="#064E3B">N0 / L0 · Flux déterministe pur</text>
    <line x1="53.0" y1="194" x2="393.7" y2="194" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="208" font-size="11.8" fill="#1E293B">Sans IA · hors profil d'agent</text>
    <text x="53.0" y="224" font-size="11.8" fill="#1E293B">Option prioritaire par défaut</text>
  </g>
  <g id="node-2" class="node" data-node="true">
    <rect x="418.7" y="160" width="362.7" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="429.7" y="182" font-size="13" font-weight="bold" fill="#064E3B">N1 · Consultatif · N2 · Sous HITL</text>
    <line x1="429.7" y1="194" x2="770.3" y2="194" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="429.7" y="208" font-size="11.8" fill="#1E293B">N1 : lecture seule P0/P1</text>
    <text x="429.7" y="224" font-size="11.8" fill="#1E293B">N2 : écriture sous approbation humaine</text>
  </g>
  <g id="node-3" class="node" data-node="true">
    <rect x="795.3" y="160" width="362.7" height="86" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
    <text x="806.3" y="182" font-size="13" font-weight="bold" fill="#451A03">N3–N4 · Sous ODD documenté</text>
    <line x1="806.3" y1="194" x2="1147.0" y2="194" stroke="#B45309" stroke-opacity="0.35" stroke-width="1"/>
    <text x="806.3" y="208" font-size="11.8" fill="#1E293B">N3 : réversible P2 sous HOTL</text>
    <text x="806.3" y="224" font-size="11.8" fill="#1E293B">N4 : ambiant certifié (classe faible)</text>
  </g>
</g>
<g id="zone-Z2" class="zone">
  <rect x="28" y="272" width="1144" height="136" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="28" y="272" width="8" height="136" rx="4" fill="#1B4F72"/>
  <text x="46" y="294" font-size="13.5" font-weight="bold" fill="#1B4F72">Z2 — Matrice de portefeuille D1–D8 × Stades 0–4 et six Classes d'actes</text>
  <g id="node-4" class="node" data-node="true">
    <rect x="42.0" y="310" width="551.0" height="86" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="2"/>
    <text x="53.0" y="332" font-size="13" font-weight="bold" fill="#0F2942">8 domaines d'affaires D1–D8</text>
    <line x1="53.0" y1="344" x2="582.0" y2="344" stroke="#1B4F72" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="358" font-size="11.8" fill="#1E293B">Croisés aux 5 stades (0–4)</text>
    <text x="53.0" y="374" font-size="11.8" fill="#1E293B">Stade 4 externe proscrit en D2 et D6</text>
  </g>
  <g id="node-5" class="node" data-node="true">
    <rect x="607.0" y="310" width="551.0" height="86" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="2"/>
    <text x="618.0" y="332" font-size="13" font-weight="bold" fill="#0F2942">Classes 1–5 × Paliers P0–P3</text>
    <line x1="618.0" y1="344" x2="1147.0" y2="344" stroke="#1B4F72" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="358" font-size="11.8" fill="#1E293B">Plafonnement par EXIG-CON-02</text>
    <text x="618.0" y="374" font-size="11.8" fill="#1E293B">Qualification de risque obligatoire</text>
  </g>
</g>
<g id="zone-Z3" class="zone">
  <rect x="28" y="422" width="1144" height="136" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="28" y="422" width="8" height="136" rx="4" fill="#B91C1C"/>
  <text x="46" y="444" font-size="13.5" font-weight="bold" fill="#B91C1C">Z3 — Plafond de classe et interdiction absolue NX (EXIG-AUT-03 / EXIG-GOV-17)</text>
  <g id="node-6" class="node" data-node="true">
    <rect x="42.0" y="460" width="551.0" height="86" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="53.0" y="482" font-size="13" font-weight="bold" fill="#7F1D1D">Interdit absolu NX (Classe 6)</text>
    <line x1="53.0" y1="494" x2="582.0" y2="494" stroke="#B91C1C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="508" font-size="11.8" fill="#1E293B">Auto-octroi d'objectifs proscrit</text>
    <text x="53.0" y="524" font-size="11.8" fill="#1E293B">Auto-élévation de privilèges bannie</text>
  </g>
  <g id="node-7" class="node" data-node="true">
    <rect x="607.0" y="460" width="551.0" height="86" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="618.0" y="482" font-size="13" font-weight="bold" fill="#7F1D1D">Réévaluation sur changement</text>
    <line x1="618.0" y1="494" x2="1147.0" y2="494" stroke="#B91C1C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="508" font-size="11.8" fill="#1E293B">Zéro code libre sans contrainte</text>
    <text x="618.0" y="524" font-size="11.8" fill="#1E293B">Ré-homologation exigée (EXIG-AUT-05)</text>
  </g>
</g>
<g id="flows-box">
  <rect x="28" y="572" width="1144" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="594" font-size="12.5" font-weight="bold" fill="#0F2942">Flux d'exécution et de contrôle</text>
  <text x="42.0" y="612" font-size="11.5" fill="#334155">① Vérifier d'abord si un flux déterministe N0 suffit avant d'enregistrer un agent</text>
  <text x="42.0" y="627" font-size="11.5" fill="#334155">(principe de moindre agence).</text>
  <text x="609.0" y="612" font-size="11.5" fill="#334155">② Qualifier l'agent selon ses permissions effectives et le plafonner via EXIG-CON-02</text>
  <text x="609.0" y="627" font-size="11.5" fill="#334155">d'après D1–D8 et sa classe.</text>
  <text x="42.0" y="650" font-size="11.5" fill="#334155">③ Exiger un ODD documenté et un repli sûr automatique préalablement à toute</text>
  <text x="42.0" y="665" font-size="11.5" fill="#334155">ouverture N3 ou N4.</text>
  <text x="609.0" y="650" font-size="11.5" fill="#334155">④ Bloquer systématiquement tout comportement NX (Classe 6) et déclencher la</text>
  <text x="609.0" y="665" font-size="11.5" fill="#334155">ré-homologation sur changement matériel.</text>
</g>
<g id="legend-box">
  <rect x="28" y="704" width="1144" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="42.0" y="715" width="14" height="14" rx="3" fill="#15803D"/>
  <text x="62.0" y="726" font-size="11" fill="#1E293B">Paliers sans écriture ou encadrés HITL (N0, N1, N2</text>
  <text x="62.0" y="741" font-size="11" fill="#1E293B">approuvé)</text>
  <rect x="418.7" y="715" width="14" height="14" rx="3" fill="#B45309"/>
  <text x="438.7" y="726" font-size="11" fill="#1E293B">Autonomie bornée N3–N4 exigeant ODD certifié et comité</text>
  <rect x="795.3" y="715" width="14" height="14" rx="3" fill="#991B1B"/>
  <text x="815.3" y="726" font-size="11" fill="#1E293B">Zone interdite sans dérogation : NX (Classe 6) et Stade</text>
  <text x="815.3" y="741" font-size="11" fill="#1E293B">4 D2/D6</text>
</g>
<g id="takeaway-box">
  <rect x="28" y="774" width="1144" height="68" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="28" y="774" width="6" height="68" rx="3" fill="#1B4F72"/>
  <text x="44" y="794" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
  <text x="44" y="812" font-size="11.5" fill="#1E293B">L'échelle d'autonomie ne constitue pas une cible ascendante vers N4 : le niveau optimal demeure le plus bas qui satisfasse la tâche, et le</text>
  <text x="44" y="828" font-size="11.5" fill="#1E293B">régime sans bornes (NX) est proscrit par construction.</text>
</g>
</svg>
