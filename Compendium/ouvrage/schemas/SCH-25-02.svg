      <text x="46" y="456" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Capteurs AgentOps → KPI continus</text>
      <text x="46" y="475" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">détection dérive &amp; ré-paramétrisation</text>
