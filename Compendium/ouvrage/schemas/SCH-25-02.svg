    <g id="node-6" class="node" data-node="true">
      <rect x="818" y="152" width="346" height="165" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
      <text x="830" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#134E4A">41 attentes → 12 EXIG-AMF-01..12</text>
      <text x="830" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Dirigeant imputable, répertoire SIA,</text>
      <text x="830" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">équité FR/EN &amp; divulgation non-avis</text>
    </g>
    <g id="node-7" class="node" data-node="true">
      <rect x="818" y="329" width="346" height="165" rx="8" fill="#F3F4F6" stroke="#64748B" stroke-width="2"/>
      <text x="830" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E293B">Hygiène statut F (AO-01 · HTTP 403)</text>
      <text x="830" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">PDF lautorite.qc.ca bloqué (statut F)</text>
      <text x="830" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Raccordement SHA-256 Note AMF/AIBanks</text>
    </g>
  </g>
  <g id="flows-bar">
    <rect x="20" y="562" width="1160" height="108" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① À J-278, consolider l'inventaire unique de tous les agents avant</text>
    <text x="34" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">cotation.</text>
    <text x="610" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② Entre J-180 et J-90, lier EXIG-AMF-01..12 et validation indépendante</text>
    <text x="610" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">E-23.</text>
    <text x="34" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ Avant le 1er mai 2027, raccorder les capteurs de dérive en production</text>
    <text x="34" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">(Tableau 46.1).</text>
    <text x="610" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ Maintenir la veille sur les 6 jalons externes (2033 et feuille de route</text>
    <text x="610" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">PQC).</text>
  </g>
  <g id="legend-bar">
