      <text x="46" y="327" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Matérialité, plafonds L0–L4 &amp;</text>
      <text x="46" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">validation indépendante (J-180..J-90)</text>
