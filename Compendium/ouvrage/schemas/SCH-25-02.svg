    <text x="437" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">12 exigences AMF vérifiées par empreinte</text>
    <rect x="788" y="692" width="18" height="18" rx="4" fill="#F3F4F6" stroke="#64748B" stroke-width="2"/>
    <text x="814" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Balisage statut F (HTTP 403 non moissonné)</text>
  </g>
  <g id="takeaway-box">
    <rect x="20" y="734" width="1160" height="68" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
    <text x="36" y="756" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
    <text x="36" y="776" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Bien que BSIF E-23 n'emploie pas le mot « agent », ses exigences sur la décision et la ré-paramétrisation autonomes s'appliquent</text>
    <text x="36" y="792" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">dès le 1er mai 2027.</text>
  </g>
