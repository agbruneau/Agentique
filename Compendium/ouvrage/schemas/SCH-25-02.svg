    <rect x="34" y="692" width="18" height="18" rx="4" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="60" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Échéance PROGRAMMÉE &amp; contrôles BSIF E-23</text>
