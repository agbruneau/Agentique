    <text x="38" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">SCH-25-02 — Compte à rebours de 278 jours vers le 1er mai 2027</text>
    <text x="38" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">Convergence entre BSIF E-23 et Note AMF IA (EXIG-AMF-01..12 sous statut F) · Systèmes d'agentivité (fr-CA)</text>
  </g>
  <g id="zone-Z1">
