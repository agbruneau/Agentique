<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<rect id="bg-canvas" x="0" y="0" width="1200" height="860" fill="#FFFFFF"/>
<rect id="header-bg" x="0" y="0" width="1200" height="104" fill="#0F2942"/>
<rect x="28" y="14" width="110" height="24" rx="5" fill="#1D4ED8"/><text x="83" y="31" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">SCH-16-01</text>
<rect x="148" y="14" width="330" height="24" rx="5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1"/><text x="313" y="31" text-anchor="middle" font-size="12" fill="#E2E8F0">Comparatif Avant / Après</text>
<text x="1172" y="31" text-anchor="end" font-size="11" fill="#93C5FD">Systèmes d'agentivité · fr-CA</text>
<text x="28" y="62" font-size="18" font-weight="bold" fill="#FFFFFF">Fin des secrets fixes (ratio 82:1) : identité NHI parrainée au SIRH et audit</text>
<text x="28" y="86" font-size="18" font-weight="bold" fill="#FFFFFF">par les cinq questions (Q-A à Q-E)</text>
<g id="zone-Z1" class="zone">
  <rect x="28" y="122" width="1144" height="136" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="28" y="122" width="8" height="136" rx="4" fill="#B91C1C"/>
  <text x="46" y="144" font-size="13.5" font-weight="bold" fill="#B91C1C">Z1 — AVANT — Prêt de compte humain, clés API statiques et standards étirés</text>
  <g id="node-1" class="node" data-node="true">
    <rect x="42.0" y="160" width="551.0" height="86" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="53.0" y="182" font-size="13" font-weight="bold" fill="#7F1D1D">Prêt de compte &amp; clés statiques</text>
    <line x1="53.0" y1="194" x2="582.0" y2="194" stroke="#B91C1C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="208" font-size="11.8" fill="#1E293B">Secrets exposés dans contextes LLM</text>
    <text x="53.0" y="224" font-size="11.8" fill="#1E293B">Standards OAuth/SCIM muets sur l'agent</text>
  </g>
  <g id="node-2" class="node" data-node="true">
    <rect x="607.0" y="160" width="551.0" height="86" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="618.0" y="182" font-size="13" font-weight="bold" fill="#7F1D1D">Score 0/15 aux questions Q-A..Q-E</text>
    <line x1="618.0" y1="194" x2="1147.0" y2="194" stroke="#B91C1C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="208" font-size="11.8" fill="#1E293B">Exposition OWASP NHI1–NHI10</text>
    <text x="618.0" y="224" font-size="11.8" fill="#1E293B">Ratio 82:1 NHI sans parrain actif</text>
  </g>
</g>
<g id="zone-Z2" class="zone">
  <rect x="28" y="272" width="1144" height="136" rx="10" fill="#F8FAFF" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="28" y="272" width="8" height="136" rx="4" fill="#1D4ED8"/>
  <text x="46" y="294" font-size="13.5" font-weight="bold" fill="#1D4ED8">Z2 — APRÈS — Identité NHI propre Blueprint/Instance et parrainage SIRH (&lt; 72 h)</text>
  <g id="node-3" class="node" data-node="true">
    <rect x="42.0" y="310" width="362.7" height="86" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="53.0" y="332" font-size="13" font-weight="bold" fill="#1E3A8A">Couple Blueprint / Instance NHI</text>
    <line x1="53.0" y1="344" x2="393.7" y2="344" stroke="#1D4ED8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="358" font-size="11.8" fill="#1E293B">Identifiant non réattribuable à vie</text>
    <text x="53.0" y="374" font-size="11.8" fill="#1E293B">Séparé par environnement</text>
  </g>
  <g id="node-4" class="node" data-node="true">
    <rect x="418.7" y="310" width="362.7" height="86" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="429.7" y="332" font-size="13" font-weight="bold" fill="#1E3A8A">Parrainage SIRH &amp; transfert &lt; 72 h</text>
    <line x1="429.7" y1="344" x2="770.3" y2="344" stroke="#1D4ED8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="429.7" y="358" font-size="11.8" fill="#1E293B">Double parrain métier et technique</text>
    <text x="429.7" y="374" font-size="11.8" fill="#1E293B">Suspension auto si départ du parrain</text>
  </g>
  <g id="node-5" class="node" data-node="true">
    <rect x="795.3" y="310" width="362.7" height="86" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="2"/>
    <text x="806.3" y="332" font-size="13" font-weight="bold" fill="#0F2942">OAuth 2.0 (BCP 240 / RFC 9700)</text>
    <line x1="806.3" y1="344" x2="1147.0" y2="344" stroke="#1B4F72" stroke-opacity="0.35" stroke-width="1"/>
    <text x="806.3" y="358" font-size="11.8" fill="#1E293B">Gestionnaire de secrets hors LLM</text>
    <text x="806.3" y="374" font-size="11.8" fill="#1E293B">PKCE, mTLS/DPoP et FAPI 2.0</text>
  </g>
</g>
<g id="zone-Z3" class="zone">
  <rect x="28" y="422" width="1144" height="136" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <rect x="28" y="422" width="8" height="136" rx="4" fill="#4338CA"/>
  <text x="46" y="444" font-size="13.5" font-weight="bold" fill="#4338CA">Z3 — Crible d'audit Q-A à Q-E (la dépendance d'imputabilité)</text>
  <g id="node-6" class="node" data-node="true">
    <rect x="42.0" y="460" width="551.0" height="86" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/>
    <text x="53.0" y="482" font-size="13" font-weight="bold" fill="#312E81">Q-A Identité · Q-B Créateur · Q-C Mandant</text>
    <line x1="53.0" y1="494" x2="582.0" y2="494" stroke="#4338CA" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="508" font-size="11.8" fill="#1E293B">Chaîne technique vérifiable</text>
    <text x="53.0" y="524" font-size="11.8" fill="#1E293B">Échec Q-A brise Q-D et Q-E</text>
  </g>
  <g id="node-7" class="node" data-node="true">
    <rect x="607.0" y="460" width="551.0" height="86" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/>
    <text x="618.0" y="482" font-size="13" font-weight="bold" fill="#312E81">Q-D Bornes · Q-E Répondant juridique</text>
    <line x1="618.0" y1="494" x2="1147.0" y2="494" stroke="#4338CA" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="508" font-size="11.8" fill="#1E293B">Limites opposables au PEP</text>
    <text x="618.0" y="524" font-size="11.8" fill="#1E293B">Imputabilité civile et prudentielle</text>
  </g>
</g>
<g id="flows-box">
  <rect x="28" y="572" width="1144" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="594" font-size="12.5" font-weight="bold" fill="#0F2942">Flux d'exécution et de contrôle</text>
  <text x="42.0" y="612" font-size="11.5" fill="#334155">① Proscrire tout compte humain partagé et toute clé statique dans le code ou le</text>
  <text x="42.0" y="627" font-size="11.5" fill="#334155">contexte LLM (EXIG-IAM-03..07).</text>
  <text x="609.0" y="612" font-size="11.5" fill="#334155">② Créer un Agent Identity Blueprint puis instancier une identité NHI distincte par</text>
  <text x="609.0" y="627" font-size="11.5" fill="#334155">environnement.</text>
  <text x="42.0" y="650" font-size="11.5" fill="#334155">③ Rattacher l'instance au double parrainage SIRH avec transfert ou suspension en</text>
  <text x="42.0" y="665" font-size="11.5" fill="#334155">moins de 72 h.</text>
  <text x="609.0" y="650" font-size="11.5" fill="#334155">④ Évaluer l'architecture au crible Q-A..Q-E sur OAuth 2.0 / RFC 9700 (PKCE,</text>
  <text x="609.0" y="665" font-size="11.5" fill="#334155">mTLS/DPoP, FAPI 2.0).</text>
</g>
<g id="legend-box">
  <rect x="28" y="704" width="1144" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="42.0" y="715" width="14" height="14" rx="3" fill="#DC2626"/>
  <text x="62.0" y="726" font-size="11" fill="#1E293B">Secrets fixes, usurpation de compte et angles morts NHI</text>
  <text x="62.0" y="741" font-size="11" fill="#1E293B">Top 10</text>
  <rect x="418.7" y="715" width="14" height="14" rx="3" fill="#1E40AF"/>
  <text x="438.7" y="726" font-size="11" fill="#1E293B">Couple Blueprint/Instance parrainé SIRH sans</text>
  <text x="438.7" y="741" font-size="11" fill="#1E293B">réattribution</text>
  <rect x="795.3" y="715" width="14" height="14" rx="3" fill="#4338CA"/>
  <text x="815.3" y="726" font-size="11" fill="#1E293B">Grille Q-A..Q-E reliant l'identité à la responsabilité</text>
  <text x="815.3" y="741" font-size="11" fill="#1E293B">juridique</text>
</g>
<g id="takeaway-box">
  <rect x="28" y="774" width="1144" height="68" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="28" y="774" width="6" height="68" rx="3" fill="#1B4F72"/>
  <text x="44" y="794" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
  <text x="44" y="812" font-size="11.5" fill="#1E293B">Sans identité propre et sans parrainage humain actif au registre RH, un agent agissant dans les systèmes d'entreprise demeure</text>
  <text x="44" y="828" font-size="11.5" fill="#1E293B">juridiquement orphelin dès le premier incident.</text>
</g>
</svg>
