<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect id="bg-canvas" x="0" y="0" width="1200" height="820" fill="#FFFFFF"/>
  <g id="header-bar">
    <rect x="20" y="16" width="1160" height="74" rx="10" fill="#0F2942"/>
    <text x="38" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">SCH-32-03 — Les sept pièges endogènes de gouvernance et l'angle mort des litiges AP2</text>
    <text x="38" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">Contraste modes d'échec internes vs disjoncteurs mécaniques et réserves au degré 3 · Systèmes d'agentivité (fr-CA)</text>
  </g>
  <g id="zone-Z1">
    <rect x="20" y="104" width="374" height="446" rx="10" fill="#F8FAFC" stroke="#B91C1C" stroke-width="1.8"/>
    <rect x="20" y="104" width="374" height="38" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="34" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7F1D1D">Z1 · Pièges 1–4 : Lourdeur, Shadow AI, E-23, Filiales</text>
    <line x1="396" y1="327" x2="410" y2="327" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g id="node-1" class="node" data-node="true">
      <rect x="34" y="152" width="346" height="165" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
      <text x="46" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7F1D1D">1. Sur-ingénierie &amp; 2. Shadow AI (70 %)</text>
      <text x="46" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Lourdeur lecture seule → contournement</text>
      <text x="46" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Parade : couloir rapide &amp; blocage PEP</text>
    </g>
    <g id="node-2" class="node" data-node="true">
      <rect x="34" y="329" width="346" height="165" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
      <text x="46" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#064E3B">3. Goulot E-23 &amp; 4. Dilution B-10</text>
      <text x="46" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Saturation 2e ligne &amp; fuite filiales</text>
      <text x="46" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Parade : E-23 proportionné, titulaire unique</text>
    </g>
  </g>
  <g id="zone-Z2">
    <rect x="412" y="104" width="374" height="446" rx="10" fill="#F8FAFC" stroke="#D97706" stroke-width="1.8"/>
    <rect x="412" y="104" width="374" height="38" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="426" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#78350F">Z2 · Pièges 5–7 : Veille, FinOps, PKI/PQC</text>
    <line x1="788" y1="327" x2="802" y2="327" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g id="node-3" class="node" data-node="true">
      <rect x="426" y="152" width="346" height="165" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="438" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#78350F">5. Veille rituelle &amp; 6. Choc FinOps</text>
      <text x="438" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Tableaux coupés du budget · réessais</text>
      <text x="438" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Parade : arbitrage ≤ 30 j &amp; CAP-031</text>
    </g>
    <g id="node-4" class="node" data-node="true">
      <rect x="426" y="329" width="346" height="165" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
      <text x="438" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#064E3B">7. Collision PKI 47 j / ML-DSA</text>
      <text x="438" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Rejet HTTP 431 des en-têtes OBO</text>
      <text x="438" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Parade : ACME &amp; référence kid JWKS</text>
    </g>
  </g>
  <g id="zone-Z3">
    <rect x="804" y="104" width="374" height="446" rx="10" fill="#F8FAFC" stroke="#6D28D9" stroke-width="1.8"/>
    <rect x="804" y="104" width="374" height="38" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
    <text x="818" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4C1D95">Z3 · Zone grise (degré 3) : Litiges AP2</text>
    <g id="node-5" class="node" data-node="true">
      <rect x="818" y="152" width="346" height="165" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
      <text x="830" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#4C1D95">3 questions ouvertes sans présence (§10.4)</text>
      <text x="830" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Commerçant de référence, impayé contesté,</text>
      <text x="830" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">non-répudiation machine malgré mandat AP2</text>
    </g>
  </g>
  <g id="flows-bar">
    <rect x="20" y="562" width="1160" height="108" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① Éviter le piège 1 en ouvrant dès le trimestre 1 un couloir rapide en</text>
    <text x="34" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">lecture seule.</text>
    <text x="610" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② Bloquer le shadow AI hors PEP et rattacher chaque agent à une entité</text>
    <text x="610" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">B-10.</text>
    <text x="34" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ Lier chaque seuil SIG à un pouvoir d'arrêt budgétaire sous 30 jours.</text>
    <text x="610" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ Borner contractuellement les paiements B2B tant que les 3 impasses AP2</text>
    <text x="610" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">persistent.</text>
  </g>
  <g id="legend-bar">
    <rect x="20" y="680" width="1160" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="34" y="692" width="18" height="18" rx="4" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="60" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Symptômes des 7 modes d'échec internes (M-26 / T7 ch. 11)</text>
    <rect x="411" y="692" width="18" height="18" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="437" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Parades mécaniques &amp; budgétaires exécutoires</text>
    <rect x="788" y="692" width="18" height="18" rx="4" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
    <text x="814" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Angle mort juridique degré 3 (litiges AP2)</text>
  </g>
  <g id="takeaway-box">
    <rect x="20" y="734" width="1160" height="68" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
    <text x="36" y="756" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
    <text x="36" y="776" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Une gouvernance trop rigide provoque les contournements qu'elle redoute : proportionnalité technique et prudence contractuelle</text>
    <text x="36" y="792" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">protègent mieux l'institution.</text>
  </g>
</svg>
