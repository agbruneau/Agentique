    <text x="38" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">Contraste contrat captif vs contrat réversible avec droit de sortie annuel POR-016 · Systèmes d'agentivité (fr-CA)</text>
