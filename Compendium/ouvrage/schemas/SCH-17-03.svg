<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<rect id="bg-canvas" x="0" y="0" width="1200" height="860" fill="#FFFFFF"/>
<rect id="header-bg" x="0" y="0" width="1200" height="104" fill="#0F2942"/>
<rect x="28" y="14" width="110" height="24" rx="5" fill="#1D4ED8"/><text x="83" y="31" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">SCH-17-03</text>
<rect x="148" y="14" width="330" height="24" rx="5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1"/><text x="313" y="31" text-anchor="middle" font-size="12" fill="#E2E8F0">Matrice visuelle de risques et garde-fous</text>
<text x="1172" y="31" text-anchor="end" font-size="11" fill="#93C5FD">Systèmes d'agentivité · fr-CA</text>
<text x="28" y="62" font-size="18" font-weight="bold" fill="#FFFFFF">Angles morts B2B : 0/9 norme KYA ratifiée et asymétrie émission/révocation</text>
<text x="28" y="86" font-size="18" font-weight="bold" fill="#FFFFFF">compensée par SSF/CAEP</text>
<g id="zone-Z1" class="zone">
  <rect x="28" y="122" width="1144" height="136" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="28" y="122" width="8" height="136" rx="4" fill="#B91C1C"/>
  <text x="46" y="144" font-size="13.5" font-weight="bold" fill="#B91C1C">Z1 — Lacune KYA inter-entreprises (0/9 chantiers ratifiés et mutabilité)</text>
  <g id="node-1" class="node" data-node="true">
    <rect x="42.0" y="160" width="551.0" height="86" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="53.0" y="182" font-size="13" font-weight="bold" fill="#7F1D1D">0/9 norme KYA ratifiée</text>
    <line x1="53.0" y1="194" x2="582.0" y2="194" stroke="#B91C1C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="208" font-size="11.8" fill="#1E293B">W3C CGs, OpenID AIIM, DIF KYA-OS,</text>
    <text x="53.0" y="224" font-size="11.8" fill="#1E293B">IETF, NIST NCCoE/CAISI : zéro RFC</text>
  </g>
  <g id="node-2" class="node" data-node="true">
    <rect x="607.0" y="160" width="551.0" height="86" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="618.0" y="182" font-size="13" font-weight="bold" fill="#7F1D1D">Fraude APP &amp; mutabilité du code</text>
    <line x1="618.0" y1="194" x2="1147.0" y2="194" stroke="#B91C1C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="208" font-size="11.8" fill="#1E293B">Exposition deepfake (UK PSR 85 000 £)</text>
    <text x="618.0" y="224" font-size="11.8" fill="#1E293B">Dérive silencieuse des capacités</text>
  </g>
</g>
<g id="zone-Z2" class="zone">
  <rect x="28" y="272" width="1144" height="136" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="28" y="272" width="8" height="136" rx="4" fill="#B45309"/>
  <text x="46" y="294" font-size="13.5" font-weight="bold" fill="#B45309">Z2 — Asymétrie émission / révocation sur 10 mécanismes</text>
  <g id="node-3" class="node" data-node="true">
    <rect x="42.0" y="310" width="551.0" height="86" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="53.0" y="332" font-size="13" font-weight="bold" fill="#7F1D1D">Révocation en cascade absente</text>
    <line x1="53.0" y1="344" x2="582.0" y2="344" stroke="#B91C1C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="358" font-size="11.8" fill="#1E293B">A2A, OAuth RFC 7009, MCP, CSA, AP2</text>
    <text x="53.0" y="374" font-size="11.8" fill="#1E293B">Octroi immédiat contre retrait lent</text>
  </g>
  <g id="node-4" class="node" data-node="true">
    <rect x="607.0" y="310" width="551.0" height="86" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
    <text x="618.0" y="332" font-size="13" font-weight="bold" fill="#451A03">Limites PKI héritées</text>
    <line x1="618.0" y1="344" x2="1147.0" y2="344" stroke="#B45309" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="358" font-size="11.8" fill="#1E293B">Fin d'OCSP (Let's Encrypt août 2025)</text>
    <text x="618.0" y="374" font-size="11.8" fill="#1E293B">Latence de propagation CRL</text>
  </g>
</g>
<g id="zone-Z3" class="zone">
  <rect x="28" y="422" width="1144" height="136" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <rect x="28" y="422" width="8" height="136" rx="4" fill="#047857"/>
  <text x="46" y="444" font-size="13.5" font-weight="bold" fill="#047857">Z3 — Parades de mitigation immédiate (Contrats, Q-A..Q-E, TTL ≤ 15 min, SSF/CAEP)</text>
  <g id="node-5" class="node" data-node="true">
    <rect x="42.0" y="460" width="551.0" height="86" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
    <text x="53.0" y="482" font-size="13" font-weight="bold" fill="#451A03">Contrats bilatéraux &amp; Q-A..Q-E</text>
    <line x1="53.0" y1="494" x2="582.0" y2="494" stroke="#B45309" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="508" font-size="11.8" fill="#1E293B">Responsabilité explicite type eIDAS 2.0</text>
    <text x="53.0" y="524" font-size="11.8" fill="#1E293B">Rejet fermé si empreinte modifiée</text>
  </g>
  <g id="node-6" class="node" data-node="true">
    <rect x="607.0" y="460" width="551.0" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="618.0" y="482" font-size="13" font-weight="bold" fill="#064E3B">Jetons ≤ 15 min &amp; automate SSF/CAEP</text>
    <line x1="618.0" y1="494" x2="1147.0" y2="494" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="508" font-size="11.8" fill="#1E293B">Zéro prolongation tacite</text>
    <text x="618.0" y="524" font-size="11.8" fill="#1E293B">Expulsion temps réel PEP &amp; moteur durable</text>
  </g>
</g>
<g id="flows-box">
  <rect x="28" y="572" width="1144" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="594" font-size="12.5" font-weight="bold" fill="#0F2942">Flux d'exécution et de contrôle</text>
  <text x="42.0" y="612" font-size="11.5" fill="#334155">① Soumettre tout partenaire B2B à la grille Q-A..Q-E et à un contrat de</text>
  <text x="42.0" y="627" font-size="11.5" fill="#334155">responsabilité explicite.</text>
  <text x="609.0" y="612" font-size="11.5" fill="#334155">② Ne jamais présumer de révocation en cascade : restreindre tous les jetons délégués</text>
  <text x="609.0" y="627" font-size="11.5" fill="#334155">à ≤ 15 min.</text>
  <text x="42.0" y="650" font-size="11.5" fill="#334155">③ Relier l'automate SSF/CAEP au PEP et au moteur durable pour expulser les sessions</text>
  <text x="42.0" y="665" font-size="11.5" fill="#334155">en cours.</text>
  <text x="609.0" y="650" font-size="11.5" fill="#334155">④ Journaliser la fraîcheur CRL/OCSP et bloquer tout agent tiers modifiant son</text>
  <text x="609.0" y="665" font-size="11.5" fill="#334155">empreinte sans ré-admission.</text>
</g>
<g id="legend-box">
  <rect x="28" y="704" width="1144" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="42.0" y="715" width="14" height="14" rx="3" fill="#DC2626"/>
  <text x="62.0" y="726" font-size="11" fill="#1E293B">0/9 norme KYA ratifiée, fraude APP et vide de</text>
  <text x="62.0" y="741" font-size="11" fill="#1E293B">révocation</text>
  <rect x="418.7" y="715" width="14" height="14" rx="3" fill="#D97706"/>
  <text x="438.7" y="726" font-size="11" fill="#1E293B">Substituts contractuels bilatéraux Q-A..Q-E provisoires</text>
  <rect x="795.3" y="715" width="14" height="14" rx="3" fill="#047857"/>
  <text x="815.3" y="726" font-size="11" fill="#1E293B">Jetons courts ≤ 15 min et invalidation temps réel</text>
  <text x="815.3" y="741" font-size="11" fill="#1E293B">SSF/CAEP</text>
</g>
<g id="takeaway-box">
  <rect x="28" y="774" width="1144" height="68" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="28" y="774" width="6" height="68" rx="3" fill="#1B4F72"/>
  <text x="44" y="794" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
  <text x="44" y="812" font-size="11.5" fill="#1E293B">Les protocoles spécifient l'octroi des accès beaucoup mieux que leur retrait : des jetons courts (≤ 15 min), un automate SSF/CAEP et des</text>
  <text x="44" y="828" font-size="11.5" fill="#1E293B">contrats KYA explicites pallient cette asymétrie.</text>
</g>
</svg>
