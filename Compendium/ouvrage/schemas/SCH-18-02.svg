<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<rect id="bg-canvas" x="0" y="0" width="1200" height="860" fill="#FFFFFF"/>
<rect id="header-bg" x="0" y="0" width="1200" height="104" fill="#0F2942"/>
<rect x="28" y="14" width="110" height="24" rx="5" fill="#1D4ED8"/><text x="83" y="31" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">SCH-18-02</text>
<rect x="148" y="14" width="330" height="24" rx="5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1"/><text x="313" y="31" text-anchor="middle" font-size="12" fill="#E2E8F0">Frise chronologique et jalons</text>
<text x="1172" y="31" text-anchor="end" font-size="11" fill="#93C5FD">Systèmes d'agentivité · fr-CA</text>
<text x="28" y="62" font-size="18" font-weight="bold" fill="#FFFFFF">Horloge post-quantique multi-sources (NIST IR 8547 2030/2035), fenêtre de</text>
<text x="28" y="86" font-size="18" font-weight="bold" fill="#FFFFFF">Mosca 2026–2029 et rescellement SCITT</text>
<g id="zone-Z1" class="zone">
  <rect x="28" y="122" width="1144" height="136" rx="10" fill="#F8FAFF" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="28" y="122" width="8" height="136" rx="4" fill="#1D4ED8"/>
  <text x="46" y="144" font-size="13.5" font-weight="bold" fill="#1D4ED8">Z1 — Calendriers distincts sans fusion (2024–2035)</text>
  <g id="node-1" class="node" data-node="true">
    <rect x="42.0" y="160" width="551.0" height="86" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="53.0" y="182" font-size="13" font-weight="bold" fill="#1E3A8A">2024–2026 · Socle NIST</text>
    <line x1="53.0" y1="194" x2="582.0" y2="194" stroke="#1D4ED8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="208" font-size="11.8" fill="#1E293B">FIPS 203/204/205 (août 2024)</text>
    <text x="53.0" y="224" font-size="11.8" fill="#1E293B">NIST IR 8547 Final (octobre 2026)</text>
  </g>
  <g id="node-2" class="node" data-node="true">
    <rect x="607.0" y="160" width="551.0" height="86" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="618.0" y="182" font-size="13" font-weight="bold" fill="#1E3A8A">2030–2035 · Échéances normées</text>
    <line x1="618.0" y1="194" x2="1147.0" y2="194" stroke="#1D4ED8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="208" font-size="11.8" fill="#1E293B">Dépréciation &gt; 2030 · interdit &gt; 2035</text>
    <text x="618.0" y="224" font-size="11.8" fill="#1E293B">ITSM.40.001 CA · G7 &amp; BSIF mars 2026</text>
  </g>
</g>
<g id="zone-Z2" class="zone">
  <rect x="28" y="272" width="1144" height="136" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="28" y="272" width="8" height="136" rx="4" fill="#B45309"/>
  <text x="46" y="294" font-size="13.5" font-weight="bold" fill="#B45309">Z2 — Inégalité de Mosca (x + y &gt; z) et trois conditions de crypto-agilité</text>
  <g id="node-3" class="node" data-node="true">
    <rect x="42.0" y="310" width="551.0" height="86" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
    <text x="53.0" y="332" font-size="13" font-weight="bold" fill="#451A03">Fenêtre inverse 2026–2029</text>
    <line x1="53.0" y1="344" x2="582.0" y2="344" stroke="#B45309" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="358" font-size="11.8" fill="#1E293B">x (valeur 7–40 ans) + y (migration) &gt; z</text>
    <text x="53.0" y="374" font-size="11.8" fill="#1E293B">Inventaire complet CBOM (EXIG-SEC-27)</text>
  </g>
  <g id="node-4" class="node" data-node="true">
    <rect x="607.0" y="310" width="551.0" height="86" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
    <text x="618.0" y="332" font-size="13" font-weight="bold" fill="#451A03">3 conditions de crypto-agilité</text>
    <line x1="618.0" y1="344" x2="1147.0" y2="344" stroke="#B45309" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="358" font-size="11.8" fill="#1E293B">Paramètres nommés · schémas versionnés</text>
    <text x="618.0" y="374" font-size="11.8" fill="#1E293B">Procédure de retrait testée (0/5, Tome 1 Tab. 21.3)</text>
  </g>
</g>
<g id="zone-Z3" class="zone">
  <rect x="28" y="422" width="1144" height="136" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <rect x="28" y="422" width="8" height="136" rx="4" fill="#047857"/>
  <text x="46" y="444" font-size="13.5" font-weight="bold" fill="#047857">Z3 — Défense hybride immédiate et rescellement probatoire ≤ 5 ans (EXIG-SEC-28)</text>
  <g id="node-5" class="node" data-node="true">
    <rect x="42.0" y="460" width="551.0" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="53.0" y="482" font-size="13" font-weight="bold" fill="#064E3B">Tunnels hybrides immédiats</text>
    <line x1="53.0" y1="494" x2="582.0" y2="494" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="508" font-size="11.8" fill="#1E293B">TLS 1.3 / MLS X25519MLKEM768</text>
    <text x="53.0" y="524" font-size="11.8" fill="#1E293B">Protection des flux gRPC SLIM</text>
  </g>
  <g id="node-6" class="node" data-node="true">
    <rect x="607.0" y="460" width="551.0" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="618.0" y="482" font-size="13" font-weight="bold" fill="#064E3B">Rescellement SCITT ≤ 5 ans</text>
    <line x1="618.0" y1="494" x2="1147.0" y2="494" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="508" font-size="11.8" fill="#1E293B">Journaux, cartes et mandats (≥ 7 ans)</text>
    <text x="618.0" y="524" font-size="11.8" fill="#1E293B">Arbre SCITT RFC 9943 + SLH-DSA</text>
  </g>
</g>
<g id="flows-box">
  <rect x="28" y="572" width="1144" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="594" font-size="12.5" font-weight="bold" fill="#0F2942">Flux d'exécution et de contrôle</text>
  <text x="42.0" y="612" font-size="11.5" fill="#334155">① Dresser l'inventaire cryptographique CBOM complet des certificats, jetons, cartes</text>
  <text x="42.0" y="627" font-size="11.5" fill="#334155">A2A et archives (&gt; 5 ans).</text>
  <text x="609.0" y="612" font-size="11.5" fill="#334155">② Calculer l'urgence selon Mosca (x valeur probante + y délai migration &gt; z horizon</text>
  <text x="609.0" y="627" font-size="11.5" fill="#334155">quantique) sur 2026–2029.</text>
  <text x="42.0" y="650" font-size="11.5" fill="#334155">③ Exiger la crypto-agilité (algorithme nommé, schéma ES256/ML-DSA, retrait) dans</text>
  <text x="42.0" y="665" font-size="11.5" fill="#334155">toute acquisition dès 2027.</text>
  <text x="609.0" y="650" font-size="11.5" fill="#334155">④ Déployer TLS/MLS hybride (X25519MLKEM768) et resceller (≤ 5 ans) les preuves en</text>
  <text x="609.0" y="665" font-size="11.5" fill="#334155">SCITT + SLH-DSA (SEC-28).</text>
</g>
<g id="legend-box">
  <rect x="28" y="704" width="1144" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="42.0" y="715" width="14" height="14" rx="3" fill="#1E3A8A"/>
  <text x="62.0" y="726" font-size="11" fill="#1E293B">Dates PROGRAMMÉES NIST FIPS 203/204/205 et NIST IR 8547</text>
  <rect x="418.7" y="715" width="14" height="14" rx="3" fill="#D97706"/>
  <text x="438.7" y="726" font-size="11" fill="#1E293B">Fenêtre d'action 2026–2029 (CBOM, acquisitions</text>
  <text x="438.7" y="741" font-size="11" fill="#1E293B">crypto-agiles)</text>
  <rect x="795.3" y="715" width="14" height="14" rx="3" fill="#047857"/>
  <text x="815.3" y="726" font-size="11" fill="#1E293B">Tunnels hybrides X25519MLKEM768 et rescellement SCITT +</text>
  <text x="815.3" y="741" font-size="11" fill="#1E293B">SLH-DSA</text>
</g>
<g id="takeaway-box">
  <rect x="28" y="774" width="1144" height="68" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="28" y="774" width="6" height="68" rx="3" fill="#1B4F72"/>
  <text x="44" y="794" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
  <text x="44" y="812" font-size="11.5" fill="#1E293B">Lorsque la valeur probante des mandats et des journaux d'audit s'étend sur 7 à 40 ans, la transition post-quantique s'engage dès 2026–2029</text>
  <text x="44" y="828" font-size="11.5" fill="#1E293B">par l'inventaire CBOM et le rescellement SCITT.</text>
</g>
</svg>
