<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:950px;height:632px;background:#FFFFFF;" width="950px" height="632px" viewBox="0 0 950 632" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="127.618" y="25.107" fill="#000" font-size="14" textLength="687.764" font-weight="700" font-family="'Segoe UI'">Agentic DataOps &amp; SRE Autonome : Gardiens de Data Contracts, Quarantaine et Remédiation sous Cedar</text></g><!--cluster Couloir1--><g class="cluster" data-qualified-name="Couloir1" id="ent0001" data-source-line="13"><rect x="7" y="46.621" width="450" height="419" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:1;" rx="5" ry="5"/><text x="57.506" y="63.729" fill="#000" font-size="14" textLength="348.988" font-weight="700" font-family="'Segoe UI'">Couloir 1 — Agentic DataOps &amp; Contrats de Données</text></g><!--cluster Couloir2--><g class="cluster" data-qualified-name="Couloir2" id="ent0007" data-source-line="35"><rect x="481" y="46.621" width="426" height="419" fill="#F5F3FF" style="stroke:#5B21B6;stroke-width:1;" rx="5" ry="5"/><text x="496.968" y="63.729" fill="#000" font-size="14" textLength="394.064" font-weight="700" font-family="'Segoe UI'">Couloir 2 — SRE Autonome Borné (Incident → Remédiation)</text></g><!--cluster BlastRadius--><g class="cluster" data-qualified-name="BlastRadius" id="ent0016" data-source-line="61"><rect x="13" y="489.621" width="923" height="129" fill="#F8FAFC" style="stroke:#334155;stroke-width:1;" rx="5" ry="5"/><text x="196.281" y="506.729" fill="#000" font-size="14" textLength="556.438" font-weight="700" font-family="'Segoe UI'">Gouvernance par Rayon d'Impact (Blast Radius) &amp; Boucle Post-Mortem Automatisée</text></g><!--entity C1_1--><g class="entity" data-qualified-name="Couloir1.C1_1" id="ent0002" data-source-line="14"><rect x="47" y="83.621" width="394.343" height="75.863" fill="#FFF" style="stroke:#475569;stroke-width:0.5;" rx="5" ry="5"/><text x="57" y="108.729" fill="#000" font-size="14" textLength="362.558" font-weight="700" font-family="'Segoe UI'">1. Détection de Rupture Amont (CDC / Kafka / Iceberg)</text><text x="57" y="127.35" fill="#000" font-size="14" textLength="374.343" font-family="'Segoe UI'">Changement de schéma, dérive d'unité (bar/kPa, °F/°C), nulls</text><text x="57" y="145.971" fill="#000" font-size="14" textLength="354.655" font-family="'Segoe UI'">Blocage immédiat avant pollution de la couche Or &amp; RAG</text></g><!--entity C1_2--><g class="entity" data-qualified-name="Couloir1.C1_2" id="ent0003" data-source-line="19"><rect x="49" y="219.621" width="390.166" height="94.484" fill="#FFF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="59" y="244.729" fill="#000" font-size="14" textLength="357.109" font-weight="700" font-family="'Segoe UI'">2. Agent Gardien Sémantique &amp; Lignée (OpenLineage)</text><text x="59" y="263.35" fill="#000" font-size="14" textLength="347.129" font-family="'Segoe UI'">Croise commit Git producteur + ontologie Apache Ossie</text><text x="59" y="281.971" fill="#000" font-size="14" textLength="370.166" font-family="'Segoe UI'">Dérive bénigne (renommage) → génère PR dbt/Spark testée</text><text x="59" y="300.592" fill="#000" font-size="14" textLength="361.457" font-weight="700" font-family="'Segoe UI'">Dérive sémantique grave → isolement en branche WAP</text></g><!--entity C1_3--><g class="entity" data-qualified-name="Couloir1.C1_3" id="ent0004" data-source-line="25"><rect x="23.5" y="373.621" width="417.127" height="75.863" fill="#F0FDF4" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="33.5" y="398.729" fill="#000" font-size="14" textLength="341.934" font-weight="700" font-family="'Segoe UI'">3. Protection de la Flotte Aval (Write-Audit-Publish)</text><text x="33.5" y="417.35" fill="#000" font-size="14" textLength="359.372" font-family="'Segoe UI'">Publication atomique uniquement après validation contrat</text><text x="33.5" y="435.971" fill="#000" font-size="14" textLength="397.127" font-weight="700" font-family="'Segoe UI'">Zéro empoisonnement silencieux des agents métiers (ASI06)</text></g><!--entity C2_1--><g class="entity" data-qualified-name="Couloir2.C2_1" id="ent0008" data-source-line="36"><rect x="502.5" y="83.621" width="373.145" height="75.863" fill="#FFF" style="stroke:#475569;stroke-width:0.5;" rx="5" ry="5"/><text x="512.5" y="108.729" fill="#000" font-size="14" textLength="353.145" font-weight="700" font-family="'Segoe UI'">1. Corrélation Causale OpenTelemetry (Traces + Logs)</text><text x="512.5" y="127.35" fill="#000" font-size="14" textLength="349.515" font-family="'Segoe UI'">Déduplication tempête d'alertes via graphe de topologie</text><text x="512.5" y="145.971" fill="#000" font-size="14" textLength="323.736" font-family="'Segoe UI'">Ouverture d'une enquête en lecture seule stricte (L1)</text></g><!--entity C2_2--><g class="entity" data-qualified-name="Couloir2.C2_2" id="ent0009" data-source-line="41"><rect x="497" y="219.621" width="393.666" height="94.484" fill="#FFF" style="stroke:#7C3AED;stroke-width:0.5;" rx="5" ry="5"/><text x="507" y="244.729" fill="#000" font-size="14" textLength="346.493" font-weight="700" font-family="'Segoe UI'">2. Essaim d'Hypothèses Concurrentes (Lecture Seule)</text><text x="507" y="263.35" fill="#000" font-size="14" textLength="373.666" font-family="'Segoe UI'">Agent Réseau • Agent DB/Locks • Agent Déploiement récent</text><text x="507" y="281.971" fill="#000" font-size="14" textLength="329.561" font-family="'Segoe UI'">Réfutation factuelle par requêtes PromQL / eBPF / Git</text><text x="507" y="300.592" fill="#000" font-size="14" textLength="336.431" font-weight="700" font-family="'Segoe UI'">Sélection d'un Runbook paramétré pré-homologué</text></g><!--entity C2_3--><g class="entity" data-qualified-name="Couloir2.C2_3" id="ent0010" data-source-line="47"><rect x="503" y="373.621" width="381.97" height="75.863" fill="#FFF7ED" style="stroke:#C2410C;stroke-width:0.5;" rx="5" ry="5"/><text x="513" y="398.729" fill="#000" font-size="14" textLength="345.29" font-weight="700" font-family="'Segoe UI'">3. Exécution sous Garde-Fou Cedar (Zéro Shell Libre)</text><text x="513" y="417.35" fill="#000" font-size="14" textLength="354.512" font-family="'Segoe UI'">Actions bornées : rollback Canary, drain pod, purge cache</text><text x="513" y="435.971" fill="#000" font-size="14" textLength="361.97" font-weight="700" font-family="'Segoe UI'">Actions destructives (DROP, IAM) : CIBA humain requis</text></g><!--entity PalierR1--><g class="entity" data-qualified-name="BlastRadius.PalierR1" id="ent0017" data-source-line="62"><rect x="29" y="526.621" width="277.817" height="75.863" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="39" y="551.729" fill="#000" font-size="14" textLength="215.052" font-weight="700" font-family="'Segoe UI'">Palier R1 — Réversible Local (L3)</text><text x="39" y="570.35" fill="#000" font-size="14" textLength="257.817" font-family="'Segoe UI'">Redémarrage pod isolé, quarantaine WAP</text><text x="39" y="588.971" fill="#000" font-size="14" textLength="242.826" font-family="'Segoe UI'">Exécution immédiate + notification SRE</text></g><!--entity PalierR2--><g class="entity" data-qualified-name="BlastRadius.PalierR2" id="ent0018" data-source-line="67"><rect x="342.5" y="526.621" width="270.981" height="75.863" fill="#FFF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="352.5" y="551.729" fill="#000" font-size="14" textLength="239.456" font-weight="700" font-family="'Segoe UI'">Palier R2 — Service Régional (L3/L2)</text><text x="352.5" y="570.35" fill="#000" font-size="14" textLength="214.785" font-family="'Segoe UI'">Rollback release N-1, bascule trafic</text><text x="352.5" y="588.971" fill="#000" font-size="14" textLength="250.981" font-family="'Segoe UI'">Budget max 1 action / 30 min par cluster</text></g><!--entity PalierR3--><g class="entity" data-qualified-name="BlastRadius.PalierR3" id="ent0019" data-source-line="72"><rect x="648.5" y="526.621" width="270.852" height="75.863" fill="#FFF" style="stroke:#DC2626;stroke-width:0.5;" rx="5" ry="5"/><text x="658.5" y="551.729" fill="#000" font-size="14" textLength="239.962" font-weight="700" font-family="'Segoe UI'">Palier R3 — État Persistant (L2 CIBA)</text><text x="658.5" y="570.35" fill="#000" font-size="14" textLength="250.708" font-family="'Segoe UI'">Migration schéma DB, rejeu massif Kafka</text><text x="658.5" y="588.971" fill="#000" font-size="14" textLength="250.852" font-weight="700" font-family="'Segoe UI'">Double signature humaine obligatoire</text></g><!--link C1_1 to C1_2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="31" data-link-type="dependency"><path d="M244,159.821 C244,178.021 244,195.121 244,214.401" style="stroke:#2563EB;stroke-width:1;" fill="none" id="C1_1-to-C1_2" codeLine="31"/><polygon points="244,219.401,248,210.401,244,214.401,240,210.401,244,219.401" fill="#2563EB" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link C1_2 to C1_3--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk6" data-source-line="32" data-link-type="dependency"><path d="M240.14,313.651 C238.52,332.921 237.078,350.049 235.548,368.279" style="stroke:#166534;stroke-width:1;" fill="none" id="C1_2-to-C1_3" codeLine="32"/><polygon points="235.13,373.261,239.869,364.627,235.548,368.279,231.897,363.958,235.13,373.261" fill="#166534" style="stroke:#166534;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link C2_1 to C2_2--><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" id="lnk11" data-source-line="53" data-link-type="dependency"><path d="M690.3,159.821 C690.94,178.021 691.