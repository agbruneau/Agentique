<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1093px;height:574px;background:#FFFFFF;" width="1093px" height="574px" viewBox="0 0 1093 574" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="245.459" y="25.107" fill="#000" font-size="14" textLength="595.082" font-weight="700" font-family="'Segoe UI'">Conception d'Outils MCP : Antipattern CRUD REST 1:1 vs Façade Orientée Intention Métier</text></g><!--cluster Anti--><g class="cluster" data-qualified-name="Anti" id="ent0001" data-source-line="9"><rect x="7" y="46.621" width="528" height="514" fill="#FEF2F2" style="stroke:#991B1B;stroke-width:1;" rx="5" ry="5"/><text x="88.686" y="63.729" fill="#000" font-size="14" textLength="364.629" font-weight="700" font-family="'Segoe UI'">ANTIPATTERN — Mappage Naïf 1:1 CRUD REST → MCP</text><text x="43.329" y="82.35" fill="#000" font-size="14" textLength="455.342" font-weight="700" font-family="'Segoe UI'">Conversion automatique OpenAPI exposant 85 endpoints granulaires</text></g><!--cluster Patron--><g class="cluster" data-qualified-name="Patron" id="ent0007" data-source-line="37"><rect x="559" y="46.621" width="520" height="514" fill="#ECFDF5" style="stroke:#14532D;stroke-width:1;" rx="5" ry="5"/><text x="634.091" y="63.729" fill="#000" font-size="14" textLength="369.817" font-weight="700" font-family="'Segoe UI'">PATRON CIBLE — Serveur MCP Orienté Intention Métier</text><text x="567.113" y="82.35" fill="#000" font-size="14" textLength="503.774" font-weight="700" font-family="'Segoe UI'">Façade de domaine gouvernée : 7 outils cohésifs alignés sur les actes métiers</text></g><!--entity AntiAgent--><g class="entity" data-qualified-name="Anti.AntiAgent" id="ent0002" data-source-line="10"><rect x="23.5" y="102.621" width="494.906" height="57.242" fill="#FFF" style="stroke:#DC2626;stroke-width:0.5;" rx="5" ry="5"/><text x="33.5" y="127.729" fill="#000" font-size="14" textLength="343.868" font-weight="700" font-family="'Segoe UI'">Agent Surchargé (+24 500 jetons de schémas / tour)</text><text x="33.5" y="146.35" fill="#000" font-size="14" textLength="474.906" font-family="'Segoe UI'">Le modèle doit improviser les jointures, l'ordre d'appels et les clés étrangères</text></g><!--entity AntiSteps--><g class="entity" data-qualified-name="Anti.AntiSteps" id="ent0003" data-source-line="15"><rect x="41" y="219.621" width="477.598" height="168.969" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="5" ry="5"/><text x="51" y="244.729" fill="#000" font-size="14" textLength="274.142" font-weight="700" font-family="'Segoe UI'">6 allers-retours probabilistes séquentiels :</text><text x="51" y="263.35" fill="#000" font-size="14" textLength="421.066" font-family="'Segoe UI'">1. GET /equipments?serial=... → Renvoie 92 colonnes internes brutes</text><text x="51" y="281.971" fill="#000" font-size="14" textLength="457.598" font-family="'Segoe UI'">2. GET /boms/{id}/components → 400 lignes non paginées dans le prompt</text><text x="51" y="300.592" fill="#000" font-size="14" textLength="366.7" font-family="'Segoe UI'">3. GET /plants/stocks → Jointure calculée de tête par le LLM</text><text x="51" y="319.213" fill="#000" font-size="14" textLength="433.733" font-family="'Segoe UI'">4. POST /reservations/header → Mutation partielle (sans idempotence)</text><text x="51" y="337.834" fill="#000" font-size="14" textLength="403.573" font-family="'Segoe UI'">5. POST /reservations/line → HTTP 500 : trace SQL opaque illisible</text><text x="51" y="356.455" fill="#000" font-size="14" textLength="426.897" font-family="'Segoe UI'">6. Réessai aveugle de l'agent → Doublon d'en-tête orphelin dans SAP</text><text x="51" y="375.076" fill="#000" font-size="14" textLength="423.76" font-family="'Segoe UI'">Fuite de la topologie relationnelle interne et couplage fort aux tables</text></g><!--entity AntiImpact--><g class="entity" data-qualified-name="Anti.AntiImpact" id="ent0004" data-source-line="26"><rect x="84.5" y="448.621" width="419.267" height="96.494" fill="#FEF2F2" style="stroke:#DC2626;stroke-width:0.5;" rx="5" ry="5"/><text x="94.5" y="473.729" fill="#000" font-size="14" textLength="193.594" font-weight="700" font-family="'Segoe UI'">Impact opérationnel mesuré :</text><text x="94.5" y="492.35" fill="#000" font-size="14" textLength="396.977" font-family="'Segoe UI'">• Latence médiane : 18,4 s (6 cycles d'inférence de bout en bout)</text><text x="94.5" y="510.971" fill="#000" font-size="14" textLength="399.267" font-family="'Segoe UI'">• Coût d'inférence : 0,42 $ CAD / tentative (inflation quadratique)</text><text x="94.5" y="531.602" fill="#000" font-size="14" textLength="90.364" font-family="'Segoe UI'">• Stabilité pass</text><text x="184.864" y="526.354" fill="#000" font-size="11" font-family="'Segoe UI'">5</text><text x="194.629" y="531.602" fill="#000" font-size="14" textLength="293.009" font-family="'Segoe UI'">: 38 % • Corruption d'état en cas d'échec partiel</text></g><!--entity PatronAgent--><g class="entity" data-qualified-name="Patron.PatronAgent" id="ent0008" data-source-line="38"><rect x="575.5" y="102.621" width="486.607" height="57.242" fill="#FFF" style="stroke:#15803D;stroke-width:0.5;" rx="5" ry="5"/><text x="585.5" y="127.729" fill="#000" font-size="14" textLength="347.696" font-weight="700" font-family="'Segoe UI'">Spécialiste Domaine (~1 350 jetons de schémas nets)</text><text x="585.5" y="146.35" fill="#000" font-size="14" textLength="466.607" font-family="'Segoe UI'">1 intention métier = 1 appel atomique typé (sap_reserve_critical_spare_part)</text></g><!--entity PatronSteps--><g class="entity" data-qualified-name="Patron.PatronSteps" id="ent0009" data-source-line="43"><rect x="575" y="219.621" width="486.409" height="168.969" fill="#FFF" style="stroke:#15803D;stroke-width:0.5;" rx="5" ry="5"/><text x="585" y="244.729" fill="#000" font-size="14" textLength="435.538" font-weight="700" font-family="'Segoe UI'">Exécution déterministe interne au Serveur MCP (TypeScript / Go) :</text><text x="585" y="263.35" fill="#000" font-size="14" textLength="424.642" font-family="'Segoe UI'">1. Vérification immédiate du cache d'idempotence (idempotencyKey)</text><text x="585" y="281.971" fill="#000" font-size="14" textLength="453.667" font-family="'Segoe UI'">2. Jointure rapide en code : Série → Nomenclature → Stock dépôt optimal</text><text x="585" y="300.592" fill="#000" font-size="14" textLength="466.409" font-family="'Segoe UI'">3. Transaction BAPI atomique unique avec bail d'expiration (ttlHoldMinutes)</text><text x="585" y="319.213" fill="#000" font-size="14" textLength="452.279" font-family="'Segoe UI'">4. Projection stricte outputSchema → structuredContent (6 champs utiles)</text><text x="585" y="337.834" fill="#000" font-size="14" textLength="436.933" font-family="'Segoe UI'">5. Si rupture : isError=true + recoveryGuidance (dépôts alternatifs triés)</text><text x="585" y="356.455" fill="#000" font-size="14" textLength="410.115" font-family="'Segoe UI'">6. Référence de compensation attachée (_meta.compensationTool)</text><text x="585" y="375.076" fill="#000" font-size="14" textLength="403.881" font-family="'Segoe UI'">Isolation totale du modèle physique SAP : zéro dette de couplage</text></g><!--entity PatronImpact--><g class="entity" data-qualified-name="Patron.PatronImpact" id="ent0010" data-source-line="54"><rect x="578" y="448.621" width="474.009" height="96.494" fill="#ECFDF5" style="stroke:#15803D;stroke-width:0.5;" rx="5" ry="5"/><text x="588" y="473.729" fill="#000" font-size="14" textLength="193.594" font-weight="700" font-family="'Segoe UI'">Impact opérationnel mesuré :</text><text x="588" y="492.35" fill="#000" font-size="14" textLength="402.309" font-family="'Segoe UI'">• Latence médiane : 1,7 s (1 seule inférence + appel RPC compilé)</text><text x="588" y="510.971" fill="#000" font-size="14" textLength="454.009" font-family="'Segoe UI'">• Coût d'inférence : 0,019 $ CAD / action (-95 % de consommation jetons)</text><text x="588" y="531.602" fill="#000" font-size="14" textLength="90.364" font-family="'Segoe UI'">• Stabilité pass</text><text x="678.364" y="526.354" fill="#000" font-size="11" font-family="'Segoe UI'">5</text><text x="688.129" y="531.602" fill="#000" font-size="14" textLength="269.678" font-family="'Segoe UI'">: 96,8 % • Intégrité transactionnelle garantie</text></g><!--link AntiAgent to AntiSteps--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="33" data-link-type="dependency"><path d="M272.47,159.971 C273.33,176.351 274.207,193.008 275.337,214.498" style="stroke:#DC2626;stroke-width:1;" fill="none" id="AntiAgent-to-AntiSteps" codeLine="33"/><polygon points="275.6,219.491,279.122,210.293,275.337,214.498,271.133,210.714,275.6,219.491" fill="#DC2626" style="stroke:#DC2626;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link AntiSteps to AntiImpact--><!--link PatronAgent to PatronSteps--><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" id="lnk11" data-source-line="61" data-link-type="dependency"><path d="M818.84,159.971 C818.74,176.351 818.638,193.001 818.518,214.491" style="stroke:#15803D;stroke-width:1;" fill="none" id="PatronAgent-to-PatronSteps" codeLine="61"/><polygon points="818.49,219.491,822.54,210.514,818.518,214.491,814.54,210.469,818.49,219.491" fill="#15803D" style="stroke:#15803D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link PatronSteps to PatronImpact--><!--link AntiAgent to PatronAgent--><!--link AntiSteps to PatronSteps--><!--link AntiImpact to PatronImpact--><?plantuml-src fLRBKXj75DthAsxXf7YObmJ2G6odX91i4bv1SZQsYshDD5BRCztZVX28ooclyW6fV44sCTbaarsM-XD_IKvtpmXXGoLLeLJeCNTkttlkEUUE5JRZr5OouOKLIb8wU-Iio0mTj8zfcrhIYe9PoxMazicpNJhfzFfKtwxJkQ4k6__EKav7Md1fnrUSzgJ