<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:863px;height:417px;background:#FFFFFF;" width="863px" height="417px" viewBox="0 0 863 417" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="162.439" y="25.107" fill="#000" font-size="14" textLength="531.323" font-weight="700" font-family="'Segoe UI'">Arbre de Décision — Arbitrage entre Code Déterministe, Workflow et Agent LLM</text></g><!--entity Q1--><g class="entity" data-qualified-name="Q1" id="ent0001" data-source-line="15"><rect x="20" y="46.621" width="354.981" height="57.242" fill="#F8FAFC" style="stroke:#334155;stroke-width:0.5;" rx="5" ry="5"/><text x="30" y="71.729" fill="#000" font-size="14" textLength="302.771" font-weight="700" font-family="'Segoe UI'">1. Les entrées sont-elles structurées et la règle</text><text x="30" y="90.35" fill="#000" font-size="14" textLength="334.981" font-weight="700" font-family="'Segoe UI'">de décision entièrement formalisable (SQL/DMN) ?</text></g><!--entity Q2--><g class="entity" data-qualified-name="Q2" id="ent0002" data-source-line="20"><rect x="28" y="146.621" width="354.551" height="57.242" fill="#F8FAFC" style="stroke:#334155;stroke-width:0.5;" rx="5" ry="5"/><text x="38" y="171.729" fill="#000" font-size="14" textLength="334.551" font-weight="700" font-family="'Segoe UI'">2. La séquence des étapes est-elle connue d'avance</text><text x="38" y="190.35" fill="#000" font-size="14" textLength="323.545" font-weight="700" font-family="'Segoe UI'">(seule une extraction ou classification est floue) ?</text></g><!--entity Q3--><g class="entity" data-qualified-name="Q3" id="ent0003" data-source-line="25"><rect x="37.5" y="246.621" width="335.52" height="57.242" fill="#F8FAFC" style="stroke:#334155;stroke-width:0.5;" rx="5" ry="5"/><text x="47.5" y="271.729" fill="#000" font-size="14" textLength="307.986" font-weight="700" font-family="'Segoe UI'">3. L'impact d'une erreur est-il irréversible, létal</text><text x="47.5" y="290.35" fill="#000" font-size="14" textLength="315.52" font-weight="700" font-family="'Segoe UI'">ou supérieur au seuil réglementaire sans appel ?</text></g><!--entity L0--><g class="entity" data-qualified-name="L0" id="ent0004" data-source-line="30"><rect x="435.5" y="46.621" width="413.702" height="57.242" fill="#F0FDF4" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="445.5" y="71.729" fill="#166534" font-size="14" textLength="312.149" font-weight="700" font-family="'Segoe UI'">Niveau L0 — Service Déterministe / Règle DMN</text><text x="445.5" y="90.35" fill="#000" font-size="14" textLength="393.702" font-family="'Segoe UI'">N'utilisez PAS de LLM : coût nul, latence &lt; 10 ms, fiabilité 100 %</text></g><!--entity L1--><g class="entity" data-qualified-name="L1" id="ent0005" data-source-line="35"><rect x="443.5" y="146.621" width="391.636" height="57.242" fill="#F0F9FF" style="stroke:#0284C7;stroke-width:0.5;" rx="5" ry="5"/><text x="453.5" y="171.729" fill="#0369A1" font-size="14" textLength="273.745" font-weight="700" font-family="'Segoe UI'">Workflow Déterministe + Travailleur SLM</text><text x="453.5" y="190.35" fill="#000" font-size="14" textLength="371.636" font-family="'Segoe UI'">Orchestration fixe (Temporal/BPMN) invoquant un SLM typé</text></g><!--entity L2--><g class="entity" data-qualified-name="L2" id="ent0006" data-source-line="40"><rect x="434" y="246.621" width="411.337" height="57.242" fill="#FFF7ED" style="stroke:#C2410C;stroke-width:0.5;" rx="5" ry="5"/><text x="444" y="271.729" fill="#9A3412" font-size="14" textLength="341.797" font-weight="700" font-family="'Segoe UI'">Niveau L2 (HITL) + Simulation / Jumeau Numérique</text><text x="444" y="290.35" fill="#000" font-size="14" textLength="391.337" font-family="'Segoe UI'">L'agent prépare et prouve le dossier ; approbation CIBA requise</text></g><!--entity L34--><g class="entity" data-qualified-name="L34" id="ent0007" data-source-line="45"><rect x="7" y="346.621" width="831.043" height="57.242" fill="#F5F3FF" style="stroke:#7C3AED;stroke-width:0.5;" rx="5" ry="5"/><text x="17" y="371.729" fill="#6D28D9" font-size="14" textLength="502.277" font-weight="700" font-family="'Segoe UI'">Niveau L3 / L4 — Orchestration Multi-Agents Bornée sous Supervision HOTL</text><text x="17" y="390.35" fill="#000" font-size="14" textLength="811.043" font-family="'Segoe UI'">Cellules spécialistes A2A/MCP • Runtime durable + Saga à compensation • Garde-fous Cedar/OPA en ligne • Escalade sur exception</text></g><!--link Q1 to L0--><!--link Q1 to L0--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-source-line="51" data-link-type="dependency"><path d="M375.29,75.121 C395.02,75.121 410.24,75.121 430.3,75.121" style="stroke:#1E293B;stroke-width:1;" fill="none" id="Q1-to-L0-1" codeLine="51"/><polygon points="435.3,75.121,426.3,71.121,430.3,75.121,426.3,79.121,435.3,75.121" fill="#1E293B" style="stroke:#1E293B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="393.75" y="68.149" fill="#166534" font-size="13" textLength="23.378" font-weight="700" font-family="'Segoe UI'">OUI</text></g><!--link Q2 to L1--><!--link Q2 to L1--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk11" data-source-line="54" data-link-type="dependency"><path d="M383.28,175.121 C403.06,175.121 418.29,175.121 438.28,175.121" style="stroke:#1E293B;stroke-width:1;" fill="none" id="Q2-to-L1-1" codeLine="54"/><polygon points="443.28,175.121,434.28,171.121,438.28,175.121,434.28,179.121,443.28,175.121" fill="#1E293B" style="stroke:#1E293B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="401.75" y="168.149" fill="#166534" font-size="13" textLength="23.378" font-weight="700" font-family="'Segoe UI'">OUI</text></g><!--link Q3 to L2--><!--l