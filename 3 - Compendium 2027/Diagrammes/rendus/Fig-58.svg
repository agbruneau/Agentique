dth="312" height="301" fill="#FFF" style="stroke:#166534;stroke-width:1;" rx="5" ry="5"/><text x="695.414" y="197.729" fill="#000" font-size="14" textLength="251.173" font-weight="700" font-family="'Segoe UI'">Zone C — Secours Open-Weights (DR)</text></g><!--cluster GameDay--><g class="cluster" data-qualified-name="GameDay" id="ent0024" data-source-line="86"><rect x="46" y="505.621" width="896" height="129" fill="#F8FAFC" style="stroke:#334155;stroke-width:1;" rx="5" ry="5"/><text x="243.873" y="522.729" fill="#000" font-size="14" textLength="500.254" font-weight="700" font-family="'Segoe UI'">Mécanique d'Exercice Trimestriel de Bascule Cognitive (GameDay BSIF E-23)</text></g><!--entity RouteurGeo--><g class="entity" data-qualified-name="CelluleCtrl.RouteurGeo" id="ent0002" data-source-line="14"><rect x="98.5" y="83.621" width="219.083" height="57.242" fill="#FFF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="108.5" y="108.729" fill="#000" font-size="14" textLength="171.165" font-weight="700" font-family="'Segoe UI'">Routeur Géofencé (Cedar)</text><text x="108.5" y="127.35" fill="#000" font-size="14" textLength="199.083" font-family="'Segoe UI'">Classification : Loi 25 • E-23 • UE</text></g><!--entity Pseudonymisation--><g class="entity" data-qualified-name="CelluleCtrl.Pseudonymisation" id="ent0003" data-source-line="18"><rect x="352.5" y="83.621" width="269.054" height="57.242" fill="#FFF" style="stroke:#7C3AED;stroke-width:0.5;" rx="5" ry="5"/><text x="362.5" y="108.729" fill="#000" font-size="14" textLength="192.664" font-weight="700" font-family="'Segoe UI'">Pseudonymisation Réversible</text><text x="362.5" y="127.35" fill="#000" font-size="14" textLength="249.054" font-family="'Segoe UI'">Jetons HMAC-FPE détenus en HSM local</text></g><!--entity SondeSante--><g class="entity" data-qualified-name="CelluleCtrl.SondeSante" id="ent0004" data-source-line="22"><rect x="656.5" y="83.621" width="247.145" height="57.242" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="666.5" y="108.729" fill="#000" font-size="14" textLength="227.145" font-weight="700" font-family="'Segoe UI'">Sonde de Santé &amp; Parité Cognitive</text><text x="666.5" y="127.35" fill="#000" font-size="14" textLength="216.398" font-family="'Segoe UI'">Disjoncteur SLA, latence, retrait API</text></g><!--entity ZoneAInfo--><g class="entity" data-qualified-name="ZoneA.ZoneAInfo" id="ent0008" data-source-line="32"><rect x="23" y="217.621" width="275.917" height="94.484" fill="#FFF" style="stroke:#FFF;stroke-width:0.5;" rx="5" ry="5"/><text x="33" y="242.729" fill="#000" font-size="14" textLength="197.135" font-weight="700" font-family="'Segoe UI'">Périmètre : Loi 25 &amp; BSIF E-23</text><text x="33" y="261.35" fill="#000" font-size="14" textLength="254.639" font-family="'Segoe UI'">• État Temporal &amp; graphe Graphiti locaux</text><text x="33" y="279.971" fill="#000" font-size="14" textLength="220.021" font-family="'Segoe UI'">• KV-cache isolé chiffré en mémoire</text><text x="33" y="298.592" fill="#000" font-size="14" textLength="255.917" font-family="'Segoe UI'">• Zéro transit sous CLOUD Act non chiffré</text></g><!--entity EnclaveGPU--><g class="entity" data-qualified-name="ZoneA.EnclaveGPU" id="ent0009" data-source-line="38"><rect x="46.5" y="371.621" width="229.46" height="94.484" fill="#EFF6FF" style="stroke:#93C5FD;stroke-width:0.5;" rx="5" ry="5"/><text x="56.5" y="396.729" fill="#000" font-size="14" textLength="204.969" font-weight="700" font-family="'Segoe UI'">Enclave GPU TEE (H100 / B200)</text><text x="56.5" y="415.35" fill="#000" font-size="14" textLength="185.938" font-family="'Segoe UI'">Attestation matérielle distante</text><text x="56.5" y="433.971" fill="#000" font-size="14" textLength="208.353" font-family="'Segoe UI'">Libération clé HSM uniquement si</text><text x="56.5" y="452.592" fill="#000" font-size="14" textLength="209.46" font-weight="700" font-family="'Segoe UI'">mesure PCR firmware conforme</text></g><!--entity ZoneBInfo--><g class="entity" data-qualified-name="ZoneB.ZoneBInfo" id="ent0012" data-source-line="48"><rect x="357.5" y="217.621" width="259.019" height="94.484" fill="#FFF" style="stroke:#FFF;stroke-width:0.5;" rx="5" ry="5"/><text x="367.5" y="242.729" fill="#000" font-size="14" textLength="239.019" font-weight="700" font-family="'Segoe UI'">Raisonnement Complexe (System-2)</text><text x="367.5" y="261.35" fill="#000" font-size="14" textLength="206.869" font-family="'Segoe UI'">• Entrées expurgées de PII directe</text><text x="367.5" y="279.971" fill="#000" font-size="14" textLength="226.413" font-family="'Segoe UI'">• Contrat Zero-Data-Retention (ZDR)</text><text x="367.5" y="298.592" fill="#000" font-size="14" textLength="203.246" font-family="'Segoe UI'">• Normalisation Open Responses</text></g><!--entity Aleas--><g class="entity" data-qualified-name="ZoneB.Aleas" id="ent0013" data-source-line="54"><rect x="355.5" y="371.621" width="269.026" height="94.484" fill="#FFF7ED" style="stroke:#FDBA74;stroke-width:0.5;" rx="5" ry="5"/><text x="365.5" y="396.729" fill="#000" font-size="14" textLength="169.169" font-weight="700" font-family="'Segoe UI'">Aléas Externes Surveillés :</text><text x="365.5" y="415.35" fill="#000" font-size="14" textLength="249.026" font-family="'Segoe UI'">Panne régionale hyperscaler, 429 massif,</text><text x="365.5" y="433.971" fill="#000" font-size="14" textLength="234.534" font-family="'Segoe UI'">dépréciation modèle ou choc tarifaire,</text><text x="365.5" y="452.592" fill="#000" font-size="14" textLength="238.355" font-weight="700" font-family="'Segoe UI'">injonction juridique extraterritoriale</text></g><!--entity ZoneCInfo--><g class="entity" data-qualified-name="ZoneC.ZoneCInfo" id="ent0016" data-source-line="64"><rect x="681.5" y="217.621" width="278.966" height="94.484" fill="#FFF" style="stroke:#FFF;stroke-width:0.5;" rx="5" ry="5"/><text x="691.5" y="242.729" fill="#000" font-size="14" textLength="205.796" font-weight="700" font-family="'Segoe UI'">Continuité Souveraine CA &amp; UE</text><text x="691.5" y="261.35" fill="#000" font-size="14" textLength="233.933" font-family="'Segoe UI'">• Grappe vLLM / SGLang pré-chauffée</text><text x="691.5" y="279.971" fill="#000" font-size="14" textLength="258.966" font-family="'Segoe UI'">• Poids ouverts audités &amp; figés en registre</text><text x="691.5" y="298.592" fill="#000" font-size="14" textLength="245.984" font-family="'Segoe UI'">• Adaptateurs de consignes pré-calibrés</text></g><!--entity GarantieDR--><g class="entity" data-qualified-name="ZoneC.GarantieDR" id="ent0017" data-source-line="70"><rect x="681" y="371.621" width="277.681" height="94.484" fill="#F0FDF4" style="stroke:#86EFAC;stroke-width:0.5;" rx="5" ry="5"/><text x="691" y="396.729" fill="#000" font-size="14" textLength="153.904" font-weight="700" font-family="'Segoe UI'">Garantie Cognitive DR :</text><text x="691" y="415.35" fill="#000" font-size="14" textLength="242.703" font-family="'Segoe UI'">RTO cognitif &lt; 15 min sans perte d'état</text><text x="691" y="433.971" fill="#000" font-size="14" textLength="257.681" font-family="'Segoe UI'">Schémas MCP &amp; pass^5 pré-homologués</text><text x="691" y="452.592" fill="#000" font-size="14" textLength="250.715" font-weight="700" font-family="'Segoe UI'">Autonomie complète hors hyperscaler</text></g><!--entity GD1--><g class="entity" data-qualified-name="GameDay.GD1" id="ent0025" data-source-line="87"><rect x="62.5" y="542.621" width="255.498" height="75.863" fill="#FFF" style="stroke:#475569;stroke-width:0.5;" rx="5" ry="5"/><text x="72.5" y="567.729" fill="#000" font-size="14" textLength="235.498" font-weight="700" font-family="'Segoe UI'">1. Détection &amp; Gel Propre (T + 30 s)</text><text x="72.5" y="586.35" fill="#000" font-size="14" textLength="230.043" font-family="'Segoe UI'">Mise en pause des activités Temporal</text><text x="72.5" y="604.971" fill="#000" font-size="14" textLength="220.227" font-family="'Segoe UI'">Zéro perte de transaction (RPO = 0)</text></g><!--entity GD2--><g class="entity" data-qualified-name="GameDay.GD2" id="ent0026" data-source-line="92"><rect x="353" y="542.621" width="273.552" height="75.863" fill="#FFF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="363" y="567.729" fill="#000" font-size="14" textLength="223.686" font-weight="700" font-family="'Segoe UI'">2. Commutation Profil (T + 3 min)</text><text x="363" y="586.35" fill="#000" font-size="14" textLength="253.552" font-family="'Segoe UI'">Activation gabarit prompt Open-Weights</text><text x="363" y="604.971" fill="#000" font-size="14" textLength="223.747" font-family="'Segoe UI'">Montée en charge auto-scaling GPU</text></g><!--entity GD3--><g class="entity" data-qualified-name="GameDay.GD3" id="ent0027" data-source-line="97"><rect x="662" y="542.621" width="263.906" height="75.863" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="672" y="567.729" fill="#000" font-size="14" textLength="200.238" font-weight="700" font-family="'Segoe UI'">3. Reprise Bornée (T + 12 min)</text><text x="672" y="586.35" fill="#000" font-size="14" textLength="243.906" font-family="'Segoe UI'">Seuils d'escalade HOTL resserrés +15 %</text><text x="672" y="604.971" fill="#000" font-size="14" textLength="215.147" font-family="'Segoe UI'">Continuité métier certifiée en audit</text></g><!--link RouteurGeo to Pseudonymisation--><!--link Pseudonymisation to SondeSante--><!--link ZoneAInfo to EnclaveGPU--><!--link ZoneBInfo to Aleas--><!--link ZoneCInfo to GarantieDR--><!--link RouteurGeo to ZoneAInfo--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" id="lnk19" data-source-line="79" data-link-type="dependency"><path d="M199.38,140.721 C192.67,162.191 184.71,187.678 176.87,212.798" style="stroke:#1E293B;stroke-width:1;" fill="none" id="RouteurGeo-to-ZoneAInfo" codeLine="79"/><polygon points="175.38,217.571,181.88,210.172,176.87,212.798,174.243,207.788,17