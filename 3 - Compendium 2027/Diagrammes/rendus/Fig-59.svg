</text><text x="33.5" y="343.35" fill="#000" font-size="14" textLength="236.544" font-family="'Segoe UI'">• SLM 3B-8B INT4 sur NPU / GPU local</text><text x="33.5" y="361.971" fill="#000" font-size="14" textLength="228.765" font-family="'Segoe UI'">• Runtime Restate / SQLite WAL local</text><text x="33.5" y="380.592" fill="#000" font-size="14" textLength="223.74" font-family="'Segoe UI'">• Agent Skills hors ligne pré-chargés</text><text x="33.5" y="399.213" fill="#000" font-size="14" font-family="'Segoe UI'">•</text><text x="43.022" y="399.213" fill="#000" font-size="14" textLength="194.182" font-weight="700" font-family="'Segoe UI'">Latence déterministe &lt; 80 ms</text><text x="33.5" y="417.834" fill="#000" font-size="14" textLength="215.093" font-family="'Segoe UI'">• Attestation TPM 2.0 + SPIRE local</text></g><!--entity MagasinCRDT--><g class="entity" data-qualified-name="NoeudEdge.MagasinCRDT" id="ent0010" data-source-line="44"><rect x="316" y="299.621" width="279.861" height="131.727" fill="#FFF" style="stroke:#7C3AED;stroke-width:0.5;" rx="5" ry="5"/><text x="326" y="324.729" fill="#000" font-size="14" textLength="204.921" font-weight="700" font-family="'Segoe UI'">Magasin d'État CRDT &amp; Quotas</text><text x="326" y="343.35" fill="#000" font-size="14" textLength="259.533" font-family="'Segoe UI'">• Compteurs PN-Counter (stocks réservés)</text><text x="326" y="361.971" fill="#000" font-size="14" textLength="237.378" font-family="'Segoe UI'">• Ensembles OR-Set (tâches assignées)</text><text x="326" y="380.592" fill="#000" font-size="14" textLength="221.929" font-family="'Segoe UI'">• Journal d'intention signé horodaté</text><text x="326" y="399.213" fill="#000" font-size="14" font-family="'Segoe UI'">•</text><text x="335.522" y="399.213" fill="#000" font-size="14" textLength="250.339" font-weight="700" font-family="'Segoe UI'">Enveloppe d'escrow hors ligne bornée</text><text x="326" y="417.834" fill="#000" font-size="14" textLength="186.013" font-family="'S