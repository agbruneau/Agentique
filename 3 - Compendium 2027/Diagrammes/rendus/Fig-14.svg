.785" font-family="'Segoe UI'">• Topologies : Unicast, Streaming, Pub/Sub</text><text x="323" y="372.834" fill="#000" font-size="14" textLength="255.534" font-family="'Segoe UI'">Aveugle aux charges utiles (Chiffrées E2E)</text><text x="323" y="391.455" fill="#000" font-size="14" textLength="287.588" font-family="'Segoe UI'">Traversée NAT sortante uniquement (port 443)</text></g><!--entity DomB--><g class="entity" data-qualified-name="DP.DomB" id="ent0010" data-source-line="53"><rect x="643" y="259.621" width="266.101" height="139.727" fill="#FFF" style="stroke:#15803D;stroke-width:0.5;" rx="5" ry="5"/><text x="653" y="284.729" fill="#000" font-size="14" textLength="215.359" font-weight="700" font-family="'Segoe UI'">Domaine B — Partenaire Externe</text><text x="653" y="303.35" fill="#000" font-size="14" textLength="246.101" font-family="'Segoe UI'">• Agent Cotation Transporteur Maritime</text><text x="653" y="321.971" fill="#000" font-size="14" textLength="208.359" font-family="'Segoe UI'">• Identité vérifiée did:wba + mTLS</text><text x="653" y="340.592" fill="#000" font-size="14" textLength="205.748" font-family="'Segoe UI'">• Passerelle DMZ SLIM / A2A v1.0</text><line x1="644" y1="344.105" x2="908.101" y2="344.105" style="stroke:#15803D;stroke-width:1;"/><text x="653" y="363.213" fill="#000" font-size="14" textLength="125.761" font-weight="700" font-family="'Segoe UI'">Feuille TreeKEM #3</text><text x="653" y="381.834" fill="#000" font-size="14" textLength="207.642" font-family="'Segoe UI'">Révocation atomique fin de tâche</text></g><!--entity MLS--><g class="entity" data-qualified-name="DP.MLS" id="ent0011" data-source-line="62"><rect x="43.5" y="420.621" width="847.306" height="57.242" fill="#ECFDF5" style="stroke:#15803D;stroke-width:0.5;" rx="5" ry="5"/><text x="53.5" y="445.729" fill="#000" font-size="14" textLength="827.306" font-weight="700" font-family="'Segoe UI'">Tunnel Cryptographique de Bout en Bout IETF MLS (RFC 9420) — Suite Hybride Post-Quantique 