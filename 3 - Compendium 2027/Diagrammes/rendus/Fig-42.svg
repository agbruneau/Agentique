<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1195px;height:673px;background:#FFFFFF;" width="1195px" height="673px" viewBox="0 0 1195 673" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="273.839" y="25.107" fill="#000" font-size="14" textLength="640.322" font-weight="700" font-family="'Segoe UI'">Délégation Cryptographique Multi-Sauts : Attestation SPIFFE, Échange RFC 8693 et Escalade CIBA</text></g><!--cluster PlanAutorite--><g class="cluster" data-qualified-name="PlanAutorite" id="ent0001" data-source-line="13"><rect x="137" y="46.621" width="893" height="110" fill="#F8FAFC" style="stroke:#334155;stroke-width:1;" rx="5" ry="5"/><text x="246.933" y="63.729" fill="#000" font-size="14" textLength="673.135" font-weight="700" font-family="'Segoe UI'">Plan d'Autorité Zero Trust : Attestation de Charge de Travail &amp; Serveur d'Autorisation (OAuth 2.1 STS)</text></g><!--cluster ChaineExecution--><g class="cluster" data-qualified-name="ChaineExecution" id="ent0005" data-source-line="27"><rect x="88" y="189.621" width="1093" height="303" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:1;" rx="5" ry="5"/><text x="411.655" y="206.729" fill="#000" font-size="14" textLength="370.85" font-weight="700" font-family="'Segoe UI'">Chaîne d'Exécution à Portée Monotone Décroissante (P2</text><text x="786.367" y="207.166" fill="#000" font-size="14" font-weight="700" font-family="name=Arial">⊂</text><text x="800.688" y="206.729" fill="#000" font-size="14" textLength="16.652" font-weight="700" font-family="'Segoe UI'">P1</text><text x="821.203" y="207.166" fill="#000" font-size="14" font-weight="700" font-family="name=Arial">⊂</text><text x="835.524" y="206.729" fill="#000" font-size="14" textLength="21.82" font-weight="700" font-family="'Segoe UI'">P0)</text></g><!--cluster EscaladeCIBA--><g class="cluster" data-qualified-name="EscaladeCIBA" id="ent0018" data-source-line="77"><rect x="7" y="533.621" width="967" height="126" fill="#FFF7ED" style="stroke:#C2410C;stroke-width:1;" rx="5" ry="5"/><text x="162.327" y="550.729" fill="#000" font-size="14" textLength="656.346" font-weight="700" font-family="'Segoe UI'">Escalade Hors Bande sur Exception de Politique (Montant > 5 000 $ CAD) — Protocole OpenID CIBA</text></g><!--entity SPIRE--><g class="entity" data-qualified-name="PlanAutorite.SPIRE" id="ent0002" data-source-line="14"><rect x="153.5" y="83.621" width="410.838" height="57.242" fill="#FFF" style="stroke:#475569;stroke-width:0.5;" rx="5" ry="5"/><text x="163.5" y="108.729" fill="#000" font-size="14" textLength="273.294" font-weight="700" font-family="'Segoe UI'">Serveur SPIRE (Attestation Continue NHI)</text><text x="163.5" y="127.35" fill="#000" font-size="14" textLength="390.838" font-family="'Segoe UI'">Émet X.509-SVID &amp; JWT-SVID (TTL 15 min, zéro secret statique)</text></g><!--entity EntraSTS--><g class="entity" data-qualified-name="PlanAutorite.EntraSTS" id="ent0003" data-source-line="19"><rect x="600" y="83.621" width="414.017" height="57.242" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="610" y="108.729" fill="#000" font-size="14" textLength="394.017" font-weight="700" font-family="'Segoe UI'">Microsoft Entra Agent ID / STS OAuth 2.1 (RFC 8693 + RAR)</text><text x="610" y="127.35" fill="#000" font-size="14" textLength="392.704" font-family="'Segoe UI'">Valide FIC SPIFFE • Atténue la portée • Imbrique sub + act + cnf</text></g><!--entity Sujet--><g class="entity" data-qualified-name="ChaineExecution.Sujet" id="ent0006" data-source-line="28"><rect x="104.5" y="226.621" width="195.492" height="113.105" fill="#FFF" style="stroke:#334155;stroke-width:0.5;" rx="5" ry="5"/><text x="114.5" y="251.729" fill="#000" font-size="14" textLength="113.798" font-weight="700" font-family="'Segoe UI'">1. Sujet Initiateur</text><text x="114.5" y="270.35" fill="#000" font-size="14" textLength="159.681" font-family="'Segoe UI'">Employé authentifié OIDC</text><text x="114.5" y="288.971" fill="#000" font-size="14" textLength="103.339" font-family="'Segoe UI'">sub: "emp-8841"</text><text x="114.5" y="307.592" fill="#000" font-size="14" textLength="175.492" font-family="'Segoe UI'">Portée P0 : incident.manage,</text><text x="114.5" y="326.213" fill="#000" font-size="14" textLength="159.674" font-family="'Segoe UI'">warranty.read, sap.reserve</text></g><!--entity Orchestrateur--><g class="entity" data-qualified-name="ChaineExecution.Orchestrateur" id="ent0007" data-source-line="36"><rect x="384" y="226.621" width="221.653" height="113.105" fill="#FFF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="394" y="251.729" fill="#000" font-size="14" textLength="150.261" font-weight="700" font-family="'Segoe UI'">2. Agent Orchestrateur</text><text x="394" y="270.35" fill="#000" font-size="14" textLength="201.653" font-family="'Segoe UI'">spiffe://boreal.ca/ns/bsn/sa/orch</text><text x="394" y="288.971" fill="#000" font-size="14" textLength="190.894" font-family="'Segoe UI'">Échange RFC 8693 Saut 1 → T1</text><text x="394" y="307.592" fill="#000" font-size="14" textLength="167.022" font-family="'Segoe UI'">sub: "emp-8841" | act: orch</text><text x="394" y="326.213" fill="#000" font-size="14" textLength="178.452" font-family="'Segoe UI'">Portée P1 : warranty.evaluate</text></g><!--entity Specialiste--><g class="entity" data-qualified-name="ChaineExecution.Specialiste" id="ent0008" data-source-line="44"><rect x="696" y="226.621" width="222.2" height="113.105" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="706" y="251.729" fill="#000" font-size="14" textLength="179.724" font-weight="700" font-family="'Segoe UI'">3. Spécialiste Domaine BCA</text><text x="706" y="270.35" fill="#000" font-size="14" textLength="200.895" font-family="'Segoe UI'">spiffe://boreal.ca/ns/bca/sa/warr</text><text x="706" y="288.971" fill="#000" font-size="14" textLength="190.894" font-family="'Segoe UI'">Échange RFC 8693 Saut 2 → T2</text><text x="706" y="307.592" fill="#000" font-size="14" textLength="186.539" font-family="'Segoe UI'">act: {sub: warr, act: {sub: orch}}</text><text x="706" y="326.213" fill="#000" font-size="14" textLength="202.2" font-family="'Segoe UI'">Portée P2 (RAR) : contrat #90441</text></g><!--entity ServeurMCP--><g class="entity" data-qualified-name="ChaineExecution.ServeurMCP" id="ent0009" data-source-line="52"><rect x="1011" y="226.621" width="153.759" height="113.105" fill="#FFF" style="stroke:#334155;stroke-width:0.5;" rx="5" ry="5"/><text x="1021" y="251.729" fill="#000" font-size="14" textLength="100.502" font-weight="700" font-family="'Segoe UI'">4. Serveur MCP</text><text x="1021" y="270.35" fill="#000" font-size="14" textLength="107.857" font-family="'Segoe UI'">via agentgateway</text><text x="1021" y="288.971" fill="#000" font-size="14" textLength="131.325" font-family="'Segoe UI'">Vérifie cnf (x5t#S256)</text><text x="1021" y="307.592" fill="#000" font-size="14" textLength="122.589" font-family="'Segoe UI'">Journalise sub + act</text><text x="1021" y="326.213" fill="#000" font-size="14" textLength="133.759" font-family="'Segoe UI'">dans Guidewire / DB2</text></g><!--entity GarantiesT2--><g class="entity" data-qualified-name="ChaineExecution.GarantiesT2" id="ent0016" data-source-line="68"><rect x="104" y="400.621" width="781.53" height="75.863" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;" rx="5" ry="5"/><text x="114" y="425.729" fill="#000" font-size="14" textLength="450.365" font-weight="700" font-family="'Segoe UI'">Garanties Cryptographiques du Jeton T2 (Sender-Constrained JWT) :</text><text x="114" y="444.35" fill="#000" font-size="14" textLength="757.647" font-family="'Segoe UI'">• Identité initiale préservée (sub = emp-8841) • Généalogie complète et non répudiable des agents traversés (act imbriqué)</text><text x="114" y="462.971" fill="#000" font-size="14" textLength="761.53" font-family="'Segoe UI'">• Jeton inutilisable en cas d'exfiltration grâce à cnf (empreinte clé privée DPoP jkt ou certificat mTLS x5t#S256) • TTL ≤ 300 s</text></g><!--entity Ciba1--><g class="entity" data-qualified-name="EscaladeCIBA.Ciba1" id="ent0019" data-source-line="78"><rect x="31.5" y="578.621" width="271.439" height="57.242" fill="#FFF" style="stroke:#C2410C;stroke-width:0.5;" rx="5" ry="5"/><text x="41.5" y="603.729" fill="#000" font-size="14" textLength="223.193" font-weight="700" font-family="'Segoe UI'">1. Suspension Durable (Temporal)</text><text x="41.5" y="622.35" fill="#000" font-size="14" textLength="251.439" font-family="'Segoe UI'">POST /bc-authorize + condensat tx_hash</text></g><!--entity Ciba2--><g class="entity" data-qualified-name="EscaladeCIBA.Ciba2" id="ent0020" data-source-line="82"><rect x="338" y="578.621" width="283.956" height="57.242" fill="#FFF" style="stroke:#C2410C;stroke-width:0.5;" rx="5" ry="5"/><text x="348" y="603.729" fill="#000" font-size="14" textLength="232.798" font-weight="700" font-family="'Segoe UI'">2. Défi Hors Bande FIDO2 / Passkey</text><text x="348" y="622.35" fill="#000" font-size="14" textLength="263.956" font-family="'Segoe UI'">Superviseur distinct (SoD : approver ≠ sub)</text></g><!--entity Ciba3--><g class="entity" data-qualified-name="EscaladeCIBA.Ciba3" id="ent0021" data-source-line="86"><rect x="657" y="578.621" width="274.447" height="57.242" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="667" y="603.729" fill="#000" font-size="14" textLength="238.137" font-weight="700" font-family="'Segoe UI'">3. Jeton CIBA Borné à la Transaction</text><text x="667" y="622.35" fill="#000" font-size="14" textLength="254.447" font-family="'Segoe UI'">Usage unique • Lié à tx_hash • Audit E-23</text></g><!--link SPIRE to EntraSTS--><!--link Sujet to Orchestrateur--><!--link Sujet to Orchestrateur--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk13" data-source-line="64" data-link-type="dependency"><path d="M299.56,283.121 C326.62,283.121 351.18,283.121 378.94,283.121" style="stroke:#2563EB;stroke-width:1;" fill="none" id="Sujet-to-Orchestrateur-1" codeLine="64"/><polygon points="383.94,283.121,374.94,279.121,378.94,283.121,374.94,287.121,383.94,283.121" fill="#2563EB" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="317.75" y="276.149" fill="#000" font-size="13" textLength="48.198" font-family="'Segoe UI'">Jeton T0</text></g><!--link Orchestrateur to Specialiste--><!--link Orchestrateur to Specialiste--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk14" data-source-line="65" data-link-type="dependency"><path d="M606.32,283.121 C635.46,283.121 661.87,283.121 690.99,283.121" style="stroke:#2563EB;stroke-width:1;" fill="none" id="Orchestrateur-to-Specialiste-1" codeLine="65"/><polygon points="695.99,283.121,686.99,279.121,690.99,283.121,686.99,287.121,695.99,283.121" fill="#2563EB" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="624.5" y="259.149" fill="#000" font-size="13" textLength="53.612" font-family="'Segoe UI'">A2A + T1</text><text x="631.736" y="276.44" fill="#000" font-size="13" textLength="39.14" font-family="'Segoe UI'">(DPoP)</text></g><!--link Specialiste to ServeurMCP--><!--link Specialiste to ServeurMCP--><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" id="lnk15" data-source-line="66" data-link-type="dependency"><path d="M918.06,283.121 C949.05,283.121 977.04,283.121 1005.62,283.121" style="stroke:#166534;stroke-width:1;" fill="none" id="Specialiste-to-ServeurMCP-1" codeLine="66"/><polygon points="1010.62,283.121,1001.62,279.121,1005.62,283.121,1001.62,287.121,1010.62,283.121" fill="#166534" style="stroke:#166534;stroke-width:1;stroke-linejoin:miter;stroke-miterli