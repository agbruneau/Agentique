"17" y="71.729" fill="#000" font-size="14" textLength="321.221" font-weight="700" font-family="'Segoe UI'">1. Trafic Production &amp; Arbitrages Humains HOTL</text><line x1="8" y1="75.242" x2="426.675" y2="75.242" style="stroke:#1E293B;stroke-width:1;"/><text x="17" y="94.35" fill="#000" font-size="14" textLength="383.428" font-family="'Segoe UI'">• Modèle enseignant frontière (Teacher LLM) sur les 20 % durs</text><text x="17" y="112.971" fill="#000" font-size="14" textLength="385.273" font-family="'Segoe UI'">• Traces complètes OpenTelemetry GenAI + issue métier réelle</text><text x="17" y="131.592" fill="#000" font-size="14" textLength="382.327" font-family="'Segoe UI'">• Corrections contrastives des superviseurs HOTL (paires DPO)</text><text x="17" y="150.213" fill="#000" font-size="14" font-family="'Segoe UI'">•</text><text x="26.522" y="150.213" fill="#000" font-size="14" textLength="391.152" font-weight="700" font-family="'Segoe UI'">Signal d'ancrage : uniquement les sagas sans compensation</text></g><!--entity F2--><g class="entity" data-qualified-name="F2" id="ent0002" data-source-line="22"><rect x="490.5" y="46.621" width="423.819" height="121.105" fill="#F5F3FF" style="stroke:#5B21B6;stroke-width:0.5;" rx="5" ry="5"/><text x="500.5" y="71.729" fill="#000" font-size="14" textLength="306.94" font-weight="700" font-family="'Segoe UI'">2. Sas d'Assainissement Loi 25 &amp; Curation d'Or</text><line x1="491.5" y1="75.242" x2="913.319" y2="75.242" style="stroke:#5B21B6;stroke-width:1;"/><text x="500.5" y="94.35" fill="#000" font-size="14" textLength="341.462" font-family="'Segoe UI'">• Anonymisation irréversible PII &amp; secrets d'affaires B2B</text><text x="500.5" y="112.971" fill="#000" font-size="14" textLength="379.627" font-family="'Segoe UI'">• Filtrage anti-empoisonnement (rejet traces suspectes ASI06)</text><text x="500.5" y="131.592" fill="#000" font-size="14" textLength="356.193" font-family="'Segoe UI'">• Dédoublonnage sémantique &amp; équilibrage des cas rares</text><text x="500.5" y="150.213" fill="#000" font-size="14" font-family="'Segoe UI'">•</text><text x="510.022" y="150.213" fill="#000" font-size="14" textLength="394.297" font-weight="700" font-family="'Segoe UI'">Partition stricte : Train (70 %) / Dev (15 %) / Holdout (15 %)</text></g><!--entity F4--><g class="entity" data-qualified-name="F4" id="ent0003" data-source-line="31"><rect x="9.5" y="228.621" width="421.687" height="139.727" fill="#F0FDF4" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="19.5" y="253.729" fill="#000" font-size="14" textLength="319.525" font-weight="700" font-family="'Segoe UI'">4. Homologation τ-bench (pass^5) &amp; Promotion</text><line x1="10.5" y1="257.242" x2="430.187" y2="257.242" style="stroke:#166534;stroke-width:1;"/><text x="19.5" y="276.35" fill="#000" font-size="14" textLength="347.266" font-family="'Segoe UI'">• Banc de non-régression τ-bench sur jeu Holdout scellé</text><text x="19.5" y="294.971" fill="#000" font-size="14" textLength="365.606" font-family="'Segoe UI'">• Exigence : pass^5(SLM) >= 99 % du pass^5(Teacher LLM)</text><text x="19.5" y="313.592" fill="#000" font-size="14" textLength="391.952" font-family="'Segoe UI'">• Déploiement Shadow Mode → Canary 10 % sur agentgateway</text><text x="19.5" y="332.213" fill="#000" font-size="14" textLength="364.068" font-family="'Segoe UI'">• Surveillance continue de dérive (PSI / entropie / escalade)</text><text x="19.5" y="350.834" fill="#000" font-size="14" font-family="'Segoe UI'">•</text><text x="29.022" y="350.834" fill="#000" font-size="14" textLength="392.164" font-weight="700" font-family="'Segoe UI'">Retour automatique au Teacher LLM si cas hors distribution</text></g><!--entity F3--><g class="entity" data-qualified-name="F3" id="ent0004" data-source-line="41"><rect x="497" y="228.621" width="409.457" height="139.727" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="507" y="253.729" fill="#000" font-size="14" textLength="298.04" font-weight="700" font-family="'Segoe UI'">3. Compilation de Graphes &amp; Distillation SLM</text><line x1="498" y1="257.242" x2="905.457" y2="257.242" style="stroke:#2563EB;stroke-width:1;"/><text x="507" y="276.35" fill="#000" font-size="14" textLength="357.998" font-family="'Segoe UI'">• Niveau A (Sans poids) : Compilateur déclaratif type DSPy</text><text x="514.67" y="294.971" fill="#000" font-size="14" textLength="346.486" font-family="'Segoe UI'">(optimise consignes et exemples few-shot par métrique)</text><text x="507" y="313.592" fill="#000" font-size="14" textLength="344.634" font-family="'Segoe UI'">• Niveau B (Poids légers) : Affinage SFT + DPO par LoRA</text><text x="507" y="332.213" fill="#000" font-size="14" textLength="389.457" font-family="'Segoe UI'">• Modèle élève (Student SLM 4B-8B) sur schémas MCP internes</text><text x="507" y="350.834" fill="#000" font-size="14" font-family="'Segoe UI'">•</text><text x="516.522" y="350.834" fill="#000" font-size="14" textLength="351.887" font-weight="700" font-family="'Segoe UI'">Coût d'inférence divisé par 8 à 14 et TTFT divisé par 4</text></g><!--link F1 to F2--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="51" data-link-type="dependency"><path d="M428.11,107.121 C448.69,107.121 464.58,107.121 485.18,107.121" style="stroke:#1E293B;stroke-width:1;" fill="none" id="F1-to-F2" codeLine="51"/><polygon points="490.18,107.121,481.18,103.121,485.18,107.121,481.18,111.121,490.18,107.121" fill="#1E293B" style="stroke:#1E293B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="446.25" y="100.149" fill="#000" font-size="13" textLength="26.559" font-family="'Segoe UI'">OTel</text></g><!--link F2 to F3--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk6" data-source-line="52" data-link-type="dependency"><path d="M702.18,167.821 C702.08,187.021 701.995,203.461 701.895,223.291" style="stroke:#5B21B6;stroke-width:1;" fill=