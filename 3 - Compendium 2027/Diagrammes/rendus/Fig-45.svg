<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1089px;height:576px;background:#FFFFFF;" width="1089px" height="576px" viewBox="0 0 1089 576" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="206.395" y="25.107" fill="#000" font-size="14" textLength="669.211" font-weight="700" font-family="'Segoe UI'">Architecture de Défense en Profondeur : Garde-Fous Neuro-Symboliques, OpenSandbox et Kill Switch</text></g><!--cluster PlanCog--><g class="cluster" data-qualified-name="PlanCog" id="ent0001" data-source-line="16"><rect x="78" y="56.121" width="223" height="363.5" fill="#F8FAFC" style="stroke:#64748B;stroke-width:1;" rx="5" ry="5"/><text x="138.822" y="73.229" fill="#000" font-size="14" textLength="101.356" font-weight="700" font-family="'Segoe UI'">1. Plan Cognitif</text><text x="85.587" y="91.85" fill="#000" font-size="14" textLength="207.826" font-weight="700" font-family="'Segoe UI'">(Présumé faillible / compromis)</text></g><!--cluster GardeFous--><g class="cluster" data-qualified-name="GardeFous" id="ent0005" data-source-line="37"><rect x="325" y="56.121" width="338" height="363.5" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:1;" rx="5" ry="5"/><text x="357.233" y="73.229" fill="#000" font-size="14" textLength="273.533" font-weight="700" font-family="'Segoe UI'">2. Garde-Fous Déterministes Hors du LLM</text><text x="348.74" y="91.85" fill="#000" font-size="14" textLength="290.521" font-weight="700" font-family="'Segoe UI'">(Architecture PEP / PDP Neuro-Symbolique)</text></g><!--cluster OpenSandbox--><g class="cluster" data-qualified-name="OpenSandbox" id="ent0011" data-source-line="59"><rect x="687" y="46.621" width="388" height="363.5" fill="#F0FDF4" style="stroke:#166534;stroke-width:1;" rx="5" ry="5"/><text x="738.501" y="63.729" fill="#000" font-size="14" textLength="284.997" font-weight="700" font-family="'Segoe UI'">3. Exécution Confinée (AAIF OpenSandbox)</text><text x="727.291" y="82.35" fill="#000" font-size="14" textLength="307.419" font-weight="700" font-family="'Segoe UI'">(Isolation Matérielle &amp; Zéro Egress par Défaut)</text></g><!--cluster KillSwitch--><g class="cluster" data-qualified-name="KillSwitch" id="ent0019" data-source-line="85"><rect x="7" y="452.621" width="1026" height="110" fill="#FEF2F2" style="stroke:#DC2626;stroke-width:1;" rx="5" ry="5"/><text x="212.212" y="469.729" fill="#000" font-size="14" textLength="615.576" font-weight="700" font-family="'Segoe UI'">4. Coupe-Circuit Centralisé Multi-Nuages (SOC Kill Switch — Cible &lt; 2 s • Plafond S-14 &lt; 10 s)</text></g><!--entity CelluleLLM--><g class="entity" data-qualified-name="PlanCog.CelluleLLM" id="ent0002" data-source-line="17"><rect x="95.5" y="112.121" width="188.615" height="113.105" fill="#FFF" style="stroke:#475569;stroke-width:0.5;" rx="5" ry="5"/><text x="105.5" y="137.229" fill="#000" font-size="14" textLength="148.422" font-weight="700" font-family="'Segoe UI'">Cellule Agentique LLM</text><text x="105.5" y="155.85" fill="#000" font-size="14" textLength="165.143" font-family="'Segoe UI'">Raisonnement probabiliste</text><text x="105.5" y="174.471" fill="#000" font-size="14" textLength="143.876" font-family="'Segoe UI'">Propose une intention :</text><text x="105.5" y="193.092" fill="#000" font-size="14" textLength="121.591" font-family="'Segoe UI'">• Appel d'outil MCP</text><text x="105.5" y="211.713" fill="#000" font-size="14" textLength="168.615" font-family="'Segoe UI'">• Code Python / Script CUA</text></g><!--entity ZeroTrust--><g class="entity" data-qualified-name="PlanCog.ZeroTrust" id="ent0003" data-source-line="25"><rect x="98.5" y="271.621" width="184.575" height="131.727" fill="#FFF7ED" style="stroke:#C2410C;stroke-width:0.5;" rx="5" ry="5"/><text x="108.5" y="296.729" fill="#000" font-size="14" textLength="133.629" font-weight="700" font-family="'Segoe UI'">Postulat Zero Trust :</text><text x="108.5" y="315.35" fill="#000" font-size="14" textLength="142.864" font-family="'Segoe UI'">Aucun invariant métier,</text><text x="108.5" y="333.971" fill="#000" font-size="14" textLength="164.575" font-family="'Segoe UI'">plafond financier ou secret</text><text x="108.5" y="352.592" fill="#000" font-size="14" textLength="142.365" font-family="'Segoe UI'">maître ne réside jamais</text><text x="108.5" y="371.213" fill="#000" font-size="14" textLength="147.882" font-family="'Segoe UI'">dans le prompt système</text><text x="108.5" y="389.834" fill="#000" font-size="14" textLength="142.181" font-family="'Segoe UI'">du modèle de langage.</text></g><!--entity PEP--><g class="entity" data-qualified-name="GardeFous.PEP" id="ent0006" data-source-line="38"><rect x="342.5" y="112.121" width="302.974" height="113.105" fill="#FFF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="352.5" y="137.229" fill="#000" font-size="14" textLength="197.88" font-weight="700" font-family="'Segoe UI'">PEP : Passerelle agentgateway</text><text x="352.5" y="155.85" fill="#000" font-size="14" textLength="282.974" font-family="'Segoe UI'">• Vérifie mTLS / DPoP &amp; chaîne JWT RFC 8693</text><text x="352.5" y="174.471" fill="#000" font-size="14" textLength="262.404" font-family="'Segoe UI'">• Valide le schéma MCP épinglé (SHA-256)</text><text x="352.5" y="193.092" fill="#000" font-size="14" textLength="257.291" font-family="'Segoe UI'">• Extrait (principal, delegator, action, args)</text><text x="352.5" y="211.713" fill="#000" font-size="14" textLength="264.735" font-family="'Segoe UI'">• Bloque tout contournement réseau direct</text></g><!--entity PDP--><g class="entity" data-qualified-name="GardeFous.PDP" id="ent0007" data-source-line="46"><rect x="341" y="271.621" width="306.439" height="131.727" fill="#F0FDF4" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="351" y="296.729" fill="#000" font-size="14" textLength="221.136" font-weight="700" font-family="'Segoe UI'">PDP : Moteur Cedar / OPA (Rego)</text><text x="351" y="315.35" fill="#000" font-size="14" textLength="268.721" font-family="'Segoe UI'">• Règles formelles vérifiées par solveur SMT</text><text x="351" y="333.971" fill="#000" font-size="14" textLength="286.439" font-family="'Segoe UI'">• Sémantique forbid prioritaire (plafonds, SoD)</text><text x="351" y="352.592" fill="#000" font-size="14" textLength="276.685" font-family="'Segoe UI'">• Contrôle de teinte (interdit écriture si Taint)</text><text x="351" y="371.213" fill="#000" font-size="14" textLength="246.477" font-family="'Segoe UI'">• Zéro probabilité d'injection de prompt</text><text x="351" y="389.834" fill="#000" font-size="14" textLength="272.474" font-weight="700" font-family="'Segoe UI'">Décision : ALLOW | DENY | STEP_UP_CIBA</text></g><!--entity MicroVM--><g class="entity" data-qualified-name="OpenSandbox.MicroVM" id="ent0012" data-source-line="60"><rect x="703" y="102.621" width="356.041" height="131.727" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="713" y="127.729" fill="#000" font-size="14" textLength="265.146" font-weight="700" font-family="'Segoe UI'">MicroVM Firecracker / Module WASI 0.2</text><text x="713" y="146.35" fill="#000" font-size="14" textLength="321.679" font-family="'Segoe UI'">• Noyau invité dédié (KVM) ou bac à capacités WASI</text><text x="713" y="164.971" fill="#000" font-size="14" textLength="336.041" font-family="'Segoe UI'">• Restauration snapshot &lt; 15 ms • Rootfs lecture seule</text><text x="713" y="183.592" fill="#000" font-size="14" textLength="295.832" font-family="'Segoe UI'">• Quotas stricts CPU / RAM / descripteurs / PIDs</text><text x="713" y="202.213" fill="#000" font-size="14" textLength="306.626" font-family="'Segoe UI'">• Egress réseau = DENY ALL (aucun accès Internet</text><text x="713" y="220.834" fill="#000" font-size="14" textLength="269.493" font-family="'Segoe UI'">ni API métadonnées cloud 169.254.169.254)</text></g><!--entity VaultProxy--><g class="entity" data-qualified-name="OpenSandbox.VaultProxy" id="ent0013" data-source-line="69"><rect x="703.5" y="281.121" width="340.872" height="113.105" fill="#F8FAFC" style="stroke:#334155;stroke-width:0.5;" rx="5" ry="5"/><text x="713.5" y="306.229" fill="#000" font-size="14" textLength="308.786" font-weight="700" font-family="'Segoe UI'">Mandataire de Secrets (Credential Vault Proxy)</text><text x="713.5" y="324.85" fill="#000" font-size="14" textLength="314.31" font-family="'Segoe UI'">• Le code dans la microVM ne voit aucun jeton réel</text><text x="713.5" y="343.471" fill="#000" font-size="14" textLength="302.025" font-family="'Segoe UI'">• Sortie unique via vsock vers liste blanche stricte</text><text x="713.5" y="362.092" fill="#000" font-size="14" textLength="265.357" font-family="'Segoe UI'">• Injection TLS/OAuth à la frontière externe</text><text x="713.5" y="380.713" fill="#000" font-size="14" textLength="320.872" font-weight="700" font-family="'Segoe UI'">Destruction cryptographique après chaque tâche</text></g><!--entity Detection--><g class="entity" data-qualified-name="KillSwitch.Detection" id="ent0020" data-source-line="86"><rect x="23.5" y="489.621" width="335.294" height="57.242" fill="#FFF" style="stroke:#DC2626;stroke-width:0.5;" rx="5" ry="5"/><text x="33.5" y="514.729" fill="#000" font-size="14" textLength="218.962" font-weight="700" font-family="'Segoe UI'">Détection Télémétrique Continue</text><text x="33.5" y="533.35" fill="#000" font-size="14" textLength="315.294" font-family="'Segoe UI'">Flux OTel gen_ai.* • Dérive coût/sauts • Alerte SIEM</text></g><!--entity Signalisation--><g class="entity" data-qualified-name="KillSwitch.Signalisation" id="ent0021" data-source-line="90"><rect x="381" y="489.621" width="292.016" height="57.242" fill="#FFF" style="stroke:#DC2626;stroke-width:0.5;" rx="5" ry="5"/><text x="391" y="514.729" fill="#000" font-size="14" textLength="213.965" font-weight="700" font-family="'Segoe UI'">Signalisation OpenID SSF / CAEP</text><text x="391" y="533.35" fill="#000" font-size="14" textLength="272.016" font-family="'Segoe UI'">Révocation SVID SPIRE + Blocage cache PEP</text></g><!--entity GelPurge--><g class="entity" data-qualified-name="KillSwitch.GelPurge" id="ent0022" data-source-line="94"><rect x="695" y="489.621" width="321.718" height="57.242" fill="#FFF" style="stroke:#DC2626;stroke-width:0.5;" rx="5" ry="5"/><text x="705" y="514.729" fill="#000" font-size="14" textLength="224.438" font-weight="700" font-family="'Segoe UI'">Gel Forensique &amp; Purge Exécution</text><text x="705" y="533.35" fill="#000" font-size="14" textLength="301.718" font-family="'Segoe UI'">Pause sagas Temporal + Purge microVMs actives</text></g><!--link CelluleLLM to ZeroTrust--><!--link PEP to PDP--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk8" data-source-line="55" data-link-type="dependency"><path d="M494,225.231 C494,240.031 494,251.151 494,266.421" style="stroke:#166534;stroke-width:1;" fill="none" id="PEP-to-PDP" codeLine="55"/><polygon points="494,271.421,498,262.421,494,266.421,490,262.421,494,271.421" fill="#166534" style="stroke:#166534;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="495" y="258.649" fill="#000" font-size="13" textLength="57.408" font-family="'Segoe UI'">(&lt; 1,5 ms)</text></g><!--reverse link PEP to PDP--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk10" data-source-line="56" data-link-type="dependency"><path d="M545.451,229.113 C554.541,239.623 558,243.621 558,243.621 C558,243.621 558,262.621 558,262.621 C558,262.621 555.05,266.041 550.41,271.401" style="stroke:#166534;stroke-width:1;" fill="none" id="PEP-backto-PDP" codeLine="56"/><polygon points="542.18,225.331,545.042,234.755,545.451,229.113,551.093,229.522,542.18,225.331" fill="#166534" style="stroke:#166534;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link MicroVM to VaultProxy--><!--link CelluleLLM to PEP--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk15" data-source-line="80" data-link-type="dependency"><path d="M284.68,168.621 C288.86,168.621 291.33,168.621 291.33,168.621 C291.33,168.621 311.86,168.621 337.3,168.621" style="stroke:#2563EB;stroke-width:1;" fill="none" id="CelluleLLM-to-PEP" codeLine="80"/><polygon points="342.3,168.621,333.3,164.621,337.3,168.621,333.3,172.621,342.3,168.621" fill="#2563EB" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link PEP to MicroVM--><g class="link" data-entity-1="ent0006" data-entity-2="ent0012" id="lnk16" data-source-line="81" data-link-type="dependency"><path d="M645.77,168.621 C661.53,168.621 678.13,168.621 697.74,168.621" style="stroke:#166534;stroke-width:1;" fill="none" id="PEP-to-MicroVM" codeLine="81"/><polygon points="702.74,168.621,693.74,164.621,697.74,168.621,693.74,172.621,702.74,168.621" fill="#166534" style="stroke:#166534;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link ZeroTrust to PDP--><!--link PDP to VaultProxy--><!--link Detection to Signalisation--><g class="link" data-entity-1="ent0020" data-entity-2="ent0021" id="lnk23" data-source-line="99" data-link-type="dependency"><path d="M358.67,518.121 C366.25,518.121 368.83,518.121 375.87,518.121" style="stroke:#DC2626;stroke-width:1;" fill="none" id="Detection-to-Signalisation" codeLine="99"/><polygon points="380.87,518.121,371.87,514.121,375.87,518.121,371.87,522.121,380.87,518.121" fill="#DC2626" style="stroke:#DC2626;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Signalisation to GelPurge--><g class="link" data-entity-1="ent0021" data-entity-2="ent0022" id="lnk24" data-source-line="100" data-link-type="dependency"><path d="M673.18,518.121 C680.16,518.121 682.59,518.121 689.93,518.121" style="stroke:#DC2626;stroke-w