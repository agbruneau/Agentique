<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1106px;height:438px;background:#FFFFFF;" width="1106px" height="438px" viewBox="0 0 1106 438" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster Agent--><g class="cluster" data-qualified-name="Agent" id="ent0001" data-source-line="14"><rect x="142.043" y="33" width="274" height="275" fill="#EDE8F5" style="stroke:#6D28D9;stroke-width:1;" rx="5" ry="5"/><text x="208.185" y="46.87" fill="#000" font-size="11" textLength="141.716" font-weight="700" font-family="'Segoe UI'">Agent en cours d’exécution</text></g><!--cluster Longue--><g class="cluster" data-qualified-name="Longue" id="ent0003" data-source-line="18"><rect x="502.043" y="7" width="455" height="327" fill="#FFF" style="stroke:#FFF;stroke-width:1;" rx="5" ry="5"/><text x="612.967" y="20.87" fill="#000" font-size="11" textLength="233.154" font-weight="700" font-family="'Segoe UI'">Mémoires longues persistées hors du modèle</text></g><!--entity M1--><g class="entity" data-qualified-name="Agent.M1" id="ent0002" data-source-line="15"><rect x="158.043" y="66.5" width="241.939" height="224.832" fill="#FFF" style="stroke:#CBD5E1;stroke-width:0.5;" rx="5" ry="5"/><text x="168.043" y="88.37" fill="#000" font-size="11" textLength="113.652" font-weight="700" font-family="'Segoe UI'">1 · Mémoire de travail</text><text x="168.043" y="103.001" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="168.043" y="117.632" fill="#000" font-size="11" textLength="157.115" font-family="'Segoe UI'">Fenêtre de contexte du modèle :</text><text x="168.043" y="132.263" fill="#000" font-size="11" textLength="141.625" font-family="'Segoe UI'">instructions, contrats d’outils,</text><text x="168.043" y="146.894" fill="#000" font-size="11" textLength="156.025" font-family="'Segoe UI'">sous-objectif, derniers échanges</text><text x="168.043" y="161.524" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="168.043" y="176.155" fill="#000" font-size="11" textLength="154.956" font-family="'Segoe UI'">État de la tâche persisté hors du</text><text x="168.043" y="190.786" fill="#000" font-size="11" textLength="168.856" font-family="'Segoe UI'">modèle à chaque transition (points</text><text x="168.043" y="205.417" fill="#000" font-size="11" textLength="152.926" font-family="'Segoe UI'">de contrôle du moteur durable)</text><text x="168.043" y="220.048" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="168.043" y="234.679" fill="#475569" font-size="11" textLength="176.822" font-family="'Segoe UI'">Durée : la tâche · coût : chaque jeton</text><text x="168.043" y="249.31" fill="#475569" font-size="11" textLength="161.697" font-family="'Segoe UI'">réinjecté est payé à chaque appel</text><text x="168.043" y="263.94" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="168.043" y="278.571" fill="#475569" font-size="11" textLength="221.939" font-family="'Segoe UI'">Ce qui doit durer est persisté hors du modèle.</text></g><!--entity M2--><g class="entity" data-qualified-name="Longue.M2" id="ent0004" data-source-line="19"><rect x="527.543" y="40.5" width="404.13" height="78.523" fill="#E6F0FA" style="stroke:#93C5FD;stroke-width:0.5;" rx="5" ry="5"/><text x="537.543" y="62.37" fill="#000" font-size="11" textLength="121.961" font-weight="700" font-family="'Segoe UI'">2 · Mémoire épisodique</text><text x="537.543" y="77.001" fill="#000" font-size="11" textLength="384.13" font-family="'Segoe UI'">Résumés horodatés des interactions, trajectoires d’outils et résolutions passées;</text><text x="537.543" y="91.632" fill="#000" font-size="11" textLength="207.335" font-family="'Segoe UI'">provenance consignée pour chaque entrée</text><text x="537.543" y="106.263" fill="#475569" font-size="11" textLength="307.565" font-style="italic" font-family="'Segoe UI'">Calendrier de conservation · exposée en ressources ou outils MCP</text></g><!--entity M3--><g class="entity" data-qualified-name="Longue.M3" id="ent0005" data-source-line="21"><rect x="518.043" y="139.5" width="422.961" height="78.523" fill="#E2F4EE" style="stroke:#86EFAC;stroke-width:0.5;" rx="5" ry="5"/><text x="528.043" y="161.37" fill="#000" font-size="11" textLength="125.41" font-weight="700" font-family="'Segoe UI'">3 · Mémoire sémantique</text><text x="528.043" y="176.001" fill="#000" font-size="11" textLength="402.961" font-family="'Segoe UI'">Connaissances du domaine : index vectoriels et lexicaux, graphes de connaissances,</text><text x="528.043" y="190.632" fill="#000" font-size="11" textLength="235.254" font-family="'Segoe UI'">documentation; recherche hybride avec citations</text><text x="528.043" y="205.263" fill="#475569" font-size="11" textLength="300.282" font-style="italic" font-family="'Segoe UI'">Mise à jour par les propriétaires des données · exposée par MCP</text></g><!--entity M4--><g class="entity" data-qualified-name="Longue.M4" id="ent0006" data-source-line="23"><rect x="556.043" y="238.5" width="347.1" height="78.523" fill="#FEF3DC" style="stroke:#FCD34D;stroke-width:0.5;" rx="5" ry="5"/><text x="566.043" y="260.37" fill="#000" font-size="11" textLength="127.139" font-weight="700" font-family="'Segoe UI'">4 · Mémoire procédurale</text><text x="566.043" y="275.001" fill="#000" font-size="11" textLength="327.1" font-family="'Segoe UI'">Savoir-faire : invites système versionnées, contrats de compétences,</text><text x="566.043" y="289.632" fill="#000" font-size="11" textLength="157.996" font-family="'Segoe UI'">flux et séquences d’outils validés</text><text x="566.043" y="304.263" fill="#475569" font-size="11" textLength="326.187" font-style="italic" font-family="'Segoe UI'">Gérée comme du code : revue, version, évaluation avant déploiement</text></g><!--link M2 to M3--><!--link M3 to M4--><!--link 