71 L1097.098,321.771 A4,4 0 0 0 1101.098,317.771 L1101.098,263.771 L1091.098,253.771 L792.098,253.771 A4,4 0 0 0 788.098,257.771" style="stroke:#181818;stroke-width:0.5;" fill="#FCE8EB"/><path d="M1091.098,253.771 L1091.098,261.771 A2,2 0 0 0 1093.098,263.771 L1101.098,263.771 L1091.098,253.771" style="stroke:#181818;stroke-width:0.5;" fill="#FCE8EB"/><text x="814.656" y="270.642" fill="#9C2F39" font-size="11" textLength="152.512" font-weight="700" font-family="'Segoe UI'">N’est jamais une approbation</text><text x="814.656" y="285.272" fill="#000" font-size="11" textLength="232.907" font-family="'Segoe UI'">• un « oui » écrit dans la conversation de l’agent</text><text x="814.656" y="299.903" fill="#000" font-size="11" textLength="147.479" font-family="'Segoe UI'">• un résumé rédigé par l’agent</text><text x="814.656" y="314.534" fill="#000" font-size="11" textLength="251.276" font-family="'Segoe UI'">• une approbation donnée pour d’autres arguments</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg6" data-source-line="27"><polygon points="265.288,343.926,275.288,347.926,265.288,351.926,269.288,347.926" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53.913" y1="347.926" x2="271.288" y2="347.926" style="stroke:#181818;stroke-width:1;"/><text x="69.866" y="343.165" fill="#000" font-size="11" font-weight="700" font-family="'Segoe UI'">6</text><text x="79.206" y="343.165" fill="#000" font-size="11" textLength="182.128" font-family="'Segoe UI'">rejoue : même clé, réf. de la demande</text></g><rect x="213.39" y="360.926" width="699" height="51" fill="#E6F4EA" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="409.144" y="376.796" fill="#000" font-size="11" font-weight="700" font-family="'Segoe UI'">7</text><text x="418.484" y="376.796" fill="#000" font-size="11" textLength="293.477" font-family="'Segoe UI'">apparie le jeton qu’elle conserve, vérifie signature, expiration<