<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:970px;height:600px;background:#FFFFFF;" width="970px" height="600px" viewBox="0 0 970 600" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster Triade--><g class="cluster" data-qualified-name="Triade" id="ent0001" data-source-line="19"><rect x="16.955" y="105.33" width="326" height="481" fill="#FFF" style="stroke:#CBD5E1;stroke-width:1;" rx="5" ry="5"/><text x="132.268" y="124.2" fill="#000" font-size="11" textLength="95.375" font-weight="700" font-family="'Segoe UI'">LA TRIADE LÉTALE</text></g><!--cluster RightCol--><g class="cluster" data-qualified-name="RightCol" id="ent0012" data-source-line="34"><rect x="382.955" y="37.33" width="574" height="442" fill="none" style="stroke:none;" rx="5" ry="5"/></g><!--entity D--><g class="entity" data-qualified-name="Triade.D" id="ent0002" data-source-line="20"><ellipse cx="142.031" cy="180.129" rx="32.076" ry="23.799" fill="#E6F0FA" style="stroke:#1B5E9E;stroke-width:0.5;"/><text x="119.588" y="178.036" fill="#1B5E9E" font-size="11" textLength="44.886" font-weight="700" font-family="'Segoe UI'">Données</text><text x="123.517" y="192.667" fill="#1B5E9E" font-size="11" textLength="37.028" font-weight="700" font-family="'Segoe UI'">privées</text></g><!--entity U--><g class="entity" data-qualified-name="Triade.U" id="ent0003" data-source-line="21"><ellipse cx="226.968" cy="180.474" rx="36.513" ry="24.144" fill="#FEF3DC" style="stroke:#B45309;stroke-width:0.5;"/><text x="205.076" y="175.596" fill="#B45309" font-size="11" textLength="43.785" font-weight="700" font-family="'Segoe UI'">Contenu</text><text x="200.854" y="190.227" fill="#B45309" font-size="11" textLength="52.229" font-weight="700" font-family="'Segoe UI'">non fiable</text></g><!--entity Fuite--><g class="entity" data-qualified-name="Triade.Fuite" id="ent0004" data-source-line="22"><ellipse cx="183.73" cy="338.074" rx="29.275" ry="22.744" fill="#9C2F39" style="stroke:#9C2F39;stroke-width:0.5;"/><text x="171.616" y="331.685" fill="#FFF" font-size="11" textLength="24.229" font-weight="700" font-family="'Segoe UI'">fuite</text><text x="162.606" y="346.316" fill="#FFF" font-size="11" textLength="42.249" font-weight="700" font-family="'Segoe UI'">possible</text></g><!--entity C--><g class="entity" data-qualified-name="Triade.C" id="ent0005" data-source-line="23"><ellipse cx="183.996" cy="433.07" rx="57.041" ry="25.74" fill="#FCE8EB" style="stroke:#9C2F39;stroke-width:0.5;"/><text x="142.915" y="429.426" fill="#9C2F39" font-size="11" textLength="82.162" font-weight="700" font-family="'Segoe UI'">Communication</text><text x="142.343" y="444.057" fill="#9C2F39" font-size="11" textLength="83.306" font-weight="700" font-family="'Segoe UI'">externe ou effet</text></g><!--entity TNote--><g class="entity" data-qualified-name="Triade.TNote" id="ent0010" data-source-line="30"><rect x="49.455" y="503.33" width="269.492" height="59.262" fill="#FFF" style="stroke:#FFF;stroke-width:0.5;" rx="5" ry="5"/><text x="64.455" y="530.2" fill="#000" font-size="11" textLength="234.685" font-family="'Segoe UI'">Un agent qui réunit les trois propriétés peut être</text><text x="64.455" y="544.831" fill="#000" font-size="11" textLength="239.492" font-family="'Segoe UI'">amené à exfiltrer des données par un texte piégé.</text></g><!--entity Regle--><g class="entity" data-qualified-name="RightCol.Regle" id="ent0013" data-source-line="36"><rect x="422.955" y="92.33" width="269.529" height="176.309" fill="#F1F5F9" style="stroke:#CBD5E1;stroke-width:0.5;" rx="5" ry="5"/><text x="437.955" y="119.2" fill="#000" font-size="11" textLength="133.504" font-weight="700" font-family="'Segoe UI'">Règle de deux par session</text><text x="437.955" y="133.831" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="437.955" y="148.462" fill="#000" font-size="11" textLength="154.634" font-family="'Segoe UI'">Au plus deux de ces propriétés :</text><text x="437.955" y="163.093" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="437.955" y="177.724" fill="#000" font-size="11" textLength="164.323" font-family="'Segoe UI'">• [A] traite des entrées non fiables</text><text x="437.955" y="192.354" fill="#000" font-size="11" textLength="239.529" font-family="'Segoe UI'">• [B] accède à des données ou systèmes sensibles</text><text x="437.955" y="206.985" fill="#000" font-size="11" textLength="179.325" font-family="'Segoe UI'">• [C] change un état ou communique</text><text x="437.955" y="221.616" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="437.955" y="236.247" fill="#000" font-size="11" textLength="201.572" font-family="'Segoe UI'">Les trois à la fois : approbation de l’action</text><text x="437.955" y="250.878" fill="#000" font-size="11" textLength="227.047" font-family="'Segoe UI'">exacte ou nouveau contexte vierge obligatoire.</text></g><!--entity Patrons--><g class="entity" data-qualified-name="RightCol.Patrons" id="ent0014" data-source-line="38"><rect x="708.955" y="92.33" width="216.13" height="176.309" fill="#E2F4F0" style="stroke:#86D5C8;stroke-width:0.5;" rx="5" ry="5"/><text x="723.955" y="119.2" fill="#000" font-size="11" textLength="168.024" font-weight="700" font-family="'Segoe UI'">Patrons de conception résistants</text><text x="723.955" y="133.831" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="723.955" y="148.462" fill="#000" font-size="11" textLength="179.164" font-family="'Segoe UI'">• Plan puis exécution (plan figé avant</text><text x="729.981" y="163.093" fill="#000" font-size="11" textLength="116.746" font-family="'Segoe UI'">toute lecture non fiable)</text><text x="723.955" y="177.724" fill="#000" font-size="11" textLength="186.13" font-family="'Segoe UI'">• Double modèle : privilégié sans texte</text><text x="729.981" y="192.354" fill="#000" font-size="11" textLength="165.381" font-family="'Segoe UI'">non fiable, quarantaine sans outils</text><text x="723.955" y="206.985" fill="#000" font-size="11" textLength="165.354" font-family="'Segoe UI'">• Sélecteur d’actions, map-reduce,</text><text x="729.981" y="221.616" fill="#000" font-size="11" textLength="122.982" font-family="'Segoe UI'">minimisation du contexte</text><text x="723.955" y="236.247" fill="#000" font-size="11" textLength="158.351" font-family="'Segoe UI'">• Séparation des flux de contrôle</text><text x="729.981" y="250.878" fill="#000" font-size="11" textLength="112.148" font-family="'Segoe UI'">et de données (CaMeL)</text></g><!--entity Controles--><g class="entity" data-qualified-name="RightCol.Controles" id="ent0015" data-source-line="41"><rect x="452.455" y="286.33" width="442.867" height="103.154" fill="#FFF" style="stroke:#CBD5E1;stroke-width:0.5;" rx="5" ry="5"/><text x="467.455" y="306.2" fill="#000" font-size="11" textLength="324.527" font-weight="700" font-family="'Segoe UI'">CONTRÔLES DU CADRE, DU SIGNALEMENT À L’APPROBATION</text><rect x="467.455" y="310.961" width="108.71" height="68.523" fill="#F8FAFC" style="stroke:none;"/><text x="472.455" y="327.831" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="475.468" y="327.831" fill="#000" font-size="11" textLength="57.508" font-weight="700" font-family="'Segoe UI'">1 · Signaler</text><text x="472.455" y="342.462" fill="#000" font-size="11" textLength="81.281" font-family="'Segoe UI'">enveloppe « non</text><text x="472.455" y="357.093" fill="#000" font-size="11" textLength="86.416" font-family="'Segoe UI'">fiable », détection</text><text x="472.455" y="371.724" fill="#000" font-size="11" textLength="95.697" font-family="'Segoe UI'">réduit la probabilité</text><rect x="576.165" y="310.961" width="107.985" height="68.523" fill="#FEF3DC" style="stroke:none;"/><text x="581.165" y="327.831" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="584.178" y="327.831" fill="#000" font-size="11" textLength="50.623" font-weight="700" font-family="'Segoe UI'">2 · Retirer</text><text x="581.165" y="342.462" fill="#000" font-size="11" textLength="97.985" font-family="'Segoe UI'">outils d’envoi retirés</text><text x="581.165" y="357.093" fill="#000" font-size="11" textLength="96.776" font-family="'Segoe UI'">dès que du contenu</text><text x="581.165" y="371.724" fill="#000" font-size="11" textLength="77.559" font-family="'Segoe UI'">non fiable est lu</text><rect x="684.15" y="310.961" width="94.568" height="68.523" fill="#E2F4F0" style="stroke:none;"/><text x="689.15" y="327.831" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="692.163" y="327.831" fill="#000" font-size="11" textLength="67.042" font-weight="700" font-family="'Segoe UI'">3 · Concevoir</text><text x="689.15" y="342.462" fill="#000" font-size="11" textLength="84.568" font-family="'Segoe UI'">patrons ci-dessus</text><text x="689.15" y="357.093" fill="#000" font-size="11" textLength="68.471" font-family="'Segoe UI'">selon la classe</text><text x="689.15" y="371.724" fill="#000" font-size="11" textLength="44.854" font-family="'Segoe UI'">de risque</text><rect x="778.718" y="310.961" width="101.604" height="68.523" fill="#FCE8EB" style="stroke:none;"/><text x="783.718" y="327.831" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="786.731" y="327.831" fill="#000" font-size="11" textLength="70.802" font-weight="700" font-family="'Segoe UI'">4 · Approuver</text><text x="783.718" y="342.462" fill="#000" font-size="11" textLength="79.589" font-family="'Segoe UI'">jeton signé pour</text><text x="783.718" y="357.093" fill="#000" font-size="11" textLength="86.228" font-family="'Segoe UI'">toute action P3 et</text><text x="783.718" y="371.724" fill="#000" font-size="11" textLength="88.591" font-family="'Segoe UI'">tout envoi externe</text><line x1="467.455" y1="310.961" x2="880.322" y2="310.961" style="stroke:#000;stroke-width:0.5;"/><line x1="467.455" y1="379.484" x2="880.322" y2="379.484" style="stroke:#000;stroke-width:0.5;"/><line x1="467.455" y1="310.961" x2="467.455" y2="379.484" style="stroke:#000;stroke-width:0.5;"/><line x1="576.165" y1="310.961" x2="576.165" y2="379.484" style="stroke:#000;stroke-width:0.5;"/><line x1="684.15" y1="310.961" x2="684.15" y2="379.484" style="stroke:#000;stroke-width:0.5;"/><line x1="778.718" y1="310.961" x2="778.718" y2="379.484" style="stroke:#000;stroke-width:0.5;"/><line x1="880.322" y1="310.961" x2="880.322" y2="379.484" style="stroke:#000;stroke-width:0.5;"/></g><!--entity Pres--><g class="entity" data-qualified-name="RightCol.Pres" id="ent0016" data-source-line="46"><rect x="465.455" y="410.33" width="416.611" height="44.631" fill="#FCE8EB" style="stroke:#F4B4BC;stroke-width:0.5;" rx="5" ry="5"/><text x="480.455" y="437.2" fill="#000" font-size="11" textLength="386.611" font-family="'Segoe UI'">Présomption d’injection : un filtre de détection n’est jamais le contrôle principal.</text></g><!--link D to U--><!--link D to Fuite--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk7" data-source-line="26" data-link-type="association"><path d="M148.065,203.94 C156.165,233.93 170.355,286.46 178.245,315.69" style="stroke:#181818;stroke-width:1;" fill="none" id="D-Fuite"/></g><!--link U to Fuite--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="27" data-link-type="association"><path d="M220.615,204.27 C212.345,234.18 197.985,286.1 189.905,315.3" style="stroke:#181818;stroke-width:1;" fill="none" id="U-Fuite"/></g><!--link Fuite to C--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="28" data-link-type="association"><path d="M183.955,360.4 C183.955,374.35 183.955,392.55 183.955,407.09" style="stroke:#181818;stroke-width:1;" fill="none" id="Fuite-C"/></g><!--link C to TNote--><!--link Regle to Patrons--><!--link Regl