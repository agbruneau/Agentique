tion</text></g><!--entity Obs--><g class="entity" data-qualified-name="Obs" id="ent0003" data-source-line="13"><rect x="565" y="14" width="198.095" height="78.523" fill="#E6F4EA" style="stroke:#A7DFB5;stroke-width:0.5;" rx="6" ry="6"/><text x="629.726" y="35.87" fill="#0F2744" font-size="11" textLength="68.643" font-weight="700" font-family="'Segoe UI'">Observabilité</text><text x="662.541" y="50.501" fill="#0F2744" font-size="11" font-family="'Segoe UI'"> </text><text x="575" y="65.132" fill="#0F2744" font-size="11" textLength="178.095" font-family="'Segoe UI'">OpenTelemetry (conventions GenAI),</text><text x="595.262" y="79.763" fill="#0F2744" font-size="11" textLength="137.57" font-family="'Segoe UI'">contexte W3C Trace Context</text></g><!--entity Bus--><g class="entity" data-qualified-name="Bus" id="ent0004" data-source-line="17"><rect x="70.5" y="161" width="172.614" height="122.416" fill="#F1F5F9" style="stroke:#CBD5E1;stroke-width:0.5;" rx="6" ry="6"/><text x="86.505" y="182.87" fill="#0F2744" font-size="11" textLength="140.604" font-weight="700" font-family="'Segoe UI'">Agent ↔ bus d’événements</text><text x="155.301" y="197.501" fill="#0F2744" font-size="11" font-family="'Segoe UI'"> </text><text x="96.219" y="212.132" fill="#0F2744" font-size="11" textLength="121.177" font-weight="700" font-family="'Segoe UI'">CloudEvents · AsyncAPI</text><text x="155.301" y="226.763" fill="#0F2744" font-size="11" font-family="'Segoe UI'"> </text><text x="80.5" y="241.394" fill="#0F2744" font-size="11" textLength="152.614" font-family="'Segoe UI'">découplage temporel, plusieurs</text><text x="97.526" y="256.024" fill="#0F2744" font-size="11" textLength="118.562" font-family="'Segoe UI'">abonnés, rejeu; Kafka ou</text><text x="97.913" y="270.655" fill="#0F2744" font-size="11" textLength="117.788" font-family="'Segoe UI'">équivalent infonuagique</text></g><!--entity Agent--><g class="entity" data-qualified-name="Agent" id="ent0005" data-source-line="18"><rect x="335" y="182.5" width="146.441" height="78.523" fill="#EDE8F5" style="stroke:#5A469B;stroke-width:0.5;" rx="6" ry="6"/><text x="392.505" y="204.37" fill="#0F2744" font-size="11" textLength="31.432" font-weight="700" font-family="'Segoe UI'">Agent</text><text x="406.714" y="219.001" fill="#0F2744" font-size="11" font-family="'Segoe UI'"> </text><text x="346.703" y="233.632" fill="#0F2744" font-size="11" textLength="123.036" font-family="'Segoe UI'">raisonne, planifie, appelle</text><text x="345" y="248.263" fill="#0F2744" font-size="11" textLength="126.441" font-family="'Segoe UI'">des outils, délègue, publie</text></g><!--entity A2A--><g class="entity" data-qualified-name="A2A" id="ent0006" data-source-line="19"><rect x="572" y="161" width="184.21" height="122.416" fill="#E2F4F0" style="stroke:#86D5C8;stroke-width:0.5;" rx="6" ry="6"/><text x="593.204" y="182.87" fill="#0F2744" font-size="11" textLength="141.802" font-weight="700" font-family="'Segoe UI'">Agent → agent pair opaque</text><text x="662.599" y="197.501" fill="#0F2744" font-size="11" font-family="'Segoe UI'"> </text><text x="653.207" y="212.132" fill="#0F7682" font-size="11" textLength="21.796" font-weight="700" font-family="'Segoe UI'">A2A</text><text x="662.599" y="226.763" fill="#0F2744" font-size="11" font-family="'Segoe UI'"> </text><text x="597.59" y="241.394" fill="#0F2744" font-size="11" textLength="133.031" font-family="'Segoe UI'">carte d’agent, tâche à états,</text><text x="582" y="256.024" fill="#0F2744" font-size="11" textLength="164.21" font-family="'Segoe UI'">diffusion en continu, notifications;</text><text x="583.085" y="270.655" fill="#0F2744" font-size="11" textLength="162.041" font-family="'Segoe UI'">autre cadriciel, autre organisation</text></g><!--entity Disc--><g class="entity" data-qualified-name="Disc" id="ent0007" data-source-line="23"><rect x="85" y="373.5" width="203.799" height="93.154" fill="#EFE9F7" style="stroke:#CBB6EA;stroke-width:0.5;" rx="6" ry="6"/><text x="124.224" y="395.37" f