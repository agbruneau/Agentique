<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:657px;height:359px;background:#FFFFFF;" width="657px" height="359px" viewBox="0 0 657 359" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity E3--><g class="entity" data-qualified-name="E3" id="ent0001" data-source-line="12"><rect x="142.827" y="14.5" width="130.258" height="63.893" fill="#0F2744" style="stroke:#0F2744;stroke-width:0.5;" rx="5" ry="5"/><text x="152.827" y="36.37" fill="#FFF" font-size="11" textLength="44.032" font-weight="700" font-family="'Segoe UI'">Étage E3</text><text x="152.827" y="51.001" fill="#FFF" font-size="11" textLength="110.258" font-family="'Segoe UI'">Production, en continu</text><text x="152.827" y="65.632" fill="#FFF" font-size="11" textLength="90.487" font-family="'Segoe UI'">échantillon 5-10 %</text></g><!--entity M3--><g class="entity" data-qualified-name="M3" id="ent0002" data-source-line="13"><rect x="307.827" y="7" width="259.991" height="78.523" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="5" ry="5"/><text x="317.827" y="28.87" fill="#000" font-size="11" textLength="114.431" font-weight="700" font-family="'Segoe UI'">Mesure en production</text><text x="317.827" y="43.501" fill="#000" font-size="11" textLength="211.487" font-family="'Segoe UI'">100 % des traces en erreur, relance ou refus</text><text x="317.827" y="58.132" fill="#000" font-size="11" textLength="239.991" font-family="'Segoe UI'">d’approbation; juges automatisés hors du chemin</text><text x="317.827" y="72.763" fill="#000" font-size="11" textLength="223.169" font-family="'Segoe UI'">critique et revue humaine; détection de dérive</text></g><!--entity E2--><g class="entity" data-qualified-name="E2" id="ent0004" data-source-line="18"><rect x="105.327" y="117.5" width="192.885" height="63.893" fill="#0F7682" style="stroke:#0F7682;stroke-width:0.5;" rx="5" ry="5"/><text x="115.327" y="139.37" fill="#FFF" font-size="11" textLength="121.5" font-weight="700" font-family="'Segoe UI'">Étage E2 — Trajectoires</text><text x="115.327" y="154.001" fill="#FFF" font-size="11" textLength="153.329" font-family="'Segoe UI'">préproduction, jeu de référence</text><text x="115.327" y="168.632" fill="#FFF" font-size="11" textLength="172.885" font-family="'Segoe UI'">50 scénarios au moins, cas adverses</text></g><!--entity M2--><g class="entity" data-qualified-name="M2" id="ent0005" data-source-line="19"><rect x="333.327" y="110" width="220.788" height="78.523" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="5" ry="5"/><text x="343.327" y="131.87" fill="#000" font-size="11" textLength="110.526" font-weight="700" font-family="'Segoe UI'">Mesure de trajectoire</text><text x="343.327" y="146.501" fill="#000" font-size="11" textLength="193.655" font-family="'Segoe UI'">bons outils, bon ordre, bons arguments;</text><text x="343.327" y="161.132" fill="#000" font-size="11" textLength="200.788" font-family="'Segoe UI'">ancrage factuel dans les résultats d’outils;</text><text x="343.327" y="175.763" fill="#000" font-size="11" textLength="177.853" font-family="'Segoe UI'">respect des garde-fous et du budget</text></g><!--entity E1--><g class="entity" data-qualified-name="E1" id="ent0007" data-source-line="24"><rect x="68.827" y="220.5" width="237.674" height="63.893" fill="#1B5E9E" style="stroke:#1B5E9E;stroke-width:0.5;" rx="5" ry="5"/><text x="78.827" y="242.37" fill="#FFF" font-size="11" textLength="178.342" font-weight="700" font-family="'Segoe UI'">Étage E1 — Contrats déterministes</text><text x="78.827" y="257.001" fill="#FFF" font-size="11" textLength="217.674" font-family="'Segoe UI'">à chaque modification : schémas MCP, cartes</text><text x="78.827" y="271.632" fill="#FFF" font-size="11" textLength="208.296" font-family="'Segoe UI'">d’agent, outils simulés, règles de passerelle</text></g><!--entity M1--><g class="entity" data-qualified-name="M1" id="ent0008" data-source-line="25"><rect x="342.327" y="213" width="239.017" height="78.523" fill="#F8FAFC" style="stroke:#CBD5E1;stroke-width:0.5;" rx="5" ry="5"/><text x="352.327" y="234.87" fill="#000" font-size="11" textLength="106.761" font-weight="700" font-family="'Segoe UI'">Mesure déterministe</text><text x="352.327" y="249.501" fill="#000" font-size="11" textLength="219.017" font-family="'Segoe UI'">tests de contrat et d’instantané du catalogue;</text><text x="352.327" y="264.132" fill="#000" font-size="11" textLength="175.984" font-family="'Segoe UI'">tests d’injection de fautes des sagas;</text><text x="352.327" y="278.763" fill="#000" font-size="11" textLength="170.559" font-family="'Segoe UI'">tests des politiques de la passerelle</text></g><!--link E3 to M3--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="14" data-link-type="association"><path d="M272.967,46.5 C284.557,46.5 296.147,46.5 307.737,46.5" style="stroke:#94A3B8;stroke-width:1;" fill="none" id="E3-M3"/></g><!--link E2 to M2--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk6" data-source-line="20" data-link-type="association"><path d="M298.717,149.5 C310.247,149.5 321.777,149.5 333.297,149.5" style="stroke:#94A3B8;stroke-width:1;" fill="none" id="E2-M2"/></g><!--link E1 to M1--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk9" data-source-line="26" data-link-type="association"><path d="M306.897,252.5 C318.697,252.5 330.497,252.5 342.307,252.5" style="stroke:#94A3B8;stroke-width:1;" fill="none" id="E1-M1"/></g><!--link E3 to E2--><!--link E2 to E1--><!--link M3 to M2--><!--link M2 to M1--><g class="legend" data-source-line="34"><rect x="12" y="311.523" width="626.171" height="28.621" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="5" ry="5"/><text x="17" y="331.631" fill="#5A469B" font-size="14" textLength="616.171" fon