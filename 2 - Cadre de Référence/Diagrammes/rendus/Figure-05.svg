69" y="68" width="509.636" height="74.523" fill="#EFE9F7" style="stroke:none;"/><text x="183.969" y="87.87" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="186.982" y="87.87" fill="#0F2744" font-size="11" textLength="132.596" font-weight="700" font-family="'Segoe UI'">Exigences pour les agents</text><text x="183.969" y="102.501" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="183.969" y="117.132" fill="#000" font-size="11" textLength="459.583" font-family="'Segoe UI'">Finalité et fondement de chaque flux de renseignements personnels; EFVP lorsque la loi l’exige,</text><text x="183.969" y="131.763" fill="#000" font-size="11" textLength="401.124" font-family="'Segoe UI'">notamment hors Québec; entente écrite et clauses contractuelles avec chaque tiers</text><rect x="40" y="142.523" width="135.969" height="74.523" fill="#1B5E9E" style="stroke:none;"/><text x="48" y="162.394" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="51.013" y="162.394" fill="#FFF" font-size="11" textLength="82.505" font-weight="700" font-family="'Segoe UI'">Organisationnel</text><text x="48" y="177.024" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="48" y="191.655" fill="#FFF" font-size="11" textLength="94.15" font-style="italic" font-family="'Segoe UI'">Qui répond de quoi,</text><text x="48" y="206.286" fill="#FFF" font-size="11" textLength="86.614" font-style="italic" font-family="'Segoe UI'">de part et d’autre?</text><text x="134.614" y="206.286" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><rect x="175.969" y="142.523" width="509.636" height="74.523" fill="#E6F0FA" style="stroke:none;"/><text x="183.969" y="162.394" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="186.982" y="162.394" fill="#0F2744" font-size="11" textLength="132.596" font-weight="700" font-family="'Segoe UI'">Exigences pour les agents</text><text x="183.969" y="177.024" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="183.969" y="191.655" fill="#000" font-size="11" textLength="435.633" font-family="'Segoe UI'">Propriétaire métier nommé, équipe de garde, niveaux de service et voie d’escalade inscrits</text><text x="183.969" y="206.286" fill="#000" font-size="11" textLength="382.529" font-family="'Segoe UI'">au contrat d’agent; processus métier alignés de part et d’autre de la délégation</text><rect x="40" y="217.047" width="135.969" height="74.523" fill="#0F7682" style="stroke:none;"/><text x="48" y="236.917" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="51.013" y="236.917" fill="#FFF" font-size="11" textLength="61.59" font-weight="700" font-family="'Segoe UI'">Sémantique</text><text x="48" y="251.548" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="48" y="266.179" fill="#FFF" font-size="11" textLength="119.969" font-style="italic" font-family="'Segoe UI'">Les parties comprennent-</text><text x="48" y="280.81" fill="#FFF" font-size="11" textLength="99.457" font-style="italic" font-family="'Segoe UI'">elles la même chose?</text><text x="147.457" y="280.81" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><rect x="175.969" y="217.047" width="509.636" height="74.523" fill="#E2F4F0" style="stroke:none;"/><text x="183.969" y="236.917" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="186.982" y="236.917" fill="#0F2744" font-size="11" textLength="132.596" font-weight="700" font-family="'Segoe UI'">Exigences pour les agents</text><text x="183.969" y="251.548" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="183.969" y="266.179" fill="#000" font-size="11" textLength="435.161" font-family="'Segoe UI'">Vocabulaire métier commun, modèles de données canoniques, schémas JSON versionnés,</text><text x="183.969" y="280.81" fill="#000" font-size="11" textLength="410.668" font-family="'Segoe UI'">descriptions d’outils et de compétences rédigées pour être comprises par un modèle</text><rect x="40" y="291.57" width="135.969" height="74.523" fill="#0F2744" style="stroke:none;"/><text x="48" y="311.44" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="51.013" y="311.44" fill="#FFF" font-size="11" textLength="53.496" font-weight="700" font-family="'Segoe UI'">Technique</text><text x="48" y="326.071" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="48" y="340.702" fill="#FFF" font-size="11" textLength="115.092" font-style="italic" font-family="'Segoe UI'">Les systèmes peuvent-ils</text><text x="48" y="355.333" fill="#FFF" font-size="11" textLength="116.44" font-style="italic" font-family="'Segoe UI'">se joindre de façon sûre?</text><text x="164.44" y="355.333" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><rect x="175.969" y="291.57" width="509.636" height="74.523" fill="#E6EBF1" style="stroke:none;"/><text x="183.969" y="311.44" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="186.982" y="311.44" fill="#0F2744" font-size="11" textLength="132.596" font-weight="700" font-family="'Segoe UI'">Exigences pour les agents</text><text x="183.969" y="326.071" fill="#000" font-size="11" font-family="'Segoe UI'"> </text><text x="183.969" y="340.702" fill="#000" font-size="11" textLength="493.636" font-family="'Segoe UI'">Protocoles du catalogue (MCP, A2A, CloudEvents, OpenAPI), TLS 1.3 (1.2 en plancher), authentification</text><text x="183.969" y="355.333" fill="#000" font-size="11" textLength="398.841" font-family="'Segoe UI'">normalisée (OAuth 2.0, RFC 9700), contexte de trace W3C propagé à chaque appel</text><line x1="40" y1="68" x2="685.604" y2="68" style="stroke:#000;stroke-width:0.5;"/><line x1="40" y1="142.523" x2="685.604" y2="142.523" style="stroke:#000;stroke-width:0.5;"/><line x1="40" y1="217.047" x2="685.604" y2="217.047" style="stroke:#000;stroke-width:0.5;"/><line x1="40" y1="291.57" x2="685.604" y2="291.57" style="stroke:#000;stroke-width:0.5;"/><line x1="40" y1="3