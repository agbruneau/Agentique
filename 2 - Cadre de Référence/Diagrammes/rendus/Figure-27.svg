<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1062px;height:191px;background:#FFFFFF;" width="1062px" height="191px" viewBox="0 0 1062 191" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity Rule--><g class="entity" data-qualified-name="Rule" id="ent0001" data-source-line="12"><rect x="7" y="7" width="348.48" height="49.262" fill="#FFF" style="stroke:#FFF;stroke-width:0.5;" rx="5" ry="5"/><text x="17" y="28.87" fill="#475569" font-size="11" textLength="195.121" font-family="'Segoe UI'">Niveau global = dimension la plus faible</text><text x="17" y="43.501" fill="#475569" font-size="11" textLength="328.48" font-family="'Segoe UI'">(interopérabilité, orchestration, identité, observabilité, gouvernance)</text></g><!--entity Cible--><g class="entity" data-qualified-name="Cible" id="ent0002" data-source-line="13"><rect x="369" y="14" width="247.761" height="34.631" fill="#FEF3DC" style="stroke:#B45309;stroke-width:0.5;" rx="5" ry="5"/><text x="379" y="35.87" fill="#B45309" font-size="11" textLength="227.761" font-weight="700" font-family="'Segoe UI'">Cible de la feuille de route : 18 mois environ</text></g><!--entity N1--><g class="entity" data-qualified-name="N1" id="ent0003" data-source-line="17"><rect x="72.5" y="98.5" width="153.327" height="63.893" fill="#8291A6" style="stroke:#8291A6;stroke-width:0.5;" rx="5" ry="5"/><text x="82.5" y="120.37" fill="#FFF" font-size="11" textLength="45.096" font-weight="700" font-family="'Segoe UI'">1 · Initial</text><text x="82.5" y="135.001" fill="#FFF" font-size="11" textLength="120.151" font-family="'Segoe UI'">Connecteurs ad hoc, clés</text><text x="82.5" y="149.632" fill="#FFF" font-size="11" textLength="133.327" font-family="'Segoe UI'">partagées, aucun inventaire</text></g><!--entity N2--><g class="entity" data-qualified-name="N2" id="ent0004" data-source-line="18"><rect x="239.5" y="91" width="194.856" height="78.523" fill="#5C6B7F" style="stroke:#5C6B7F;stroke-width:0.5;" rx="5" ry="5"/><text x="249.5" y="112.87" fill="#FFF" font-size="11" textLength="88.483" font-weight="700" font-family="'Segoe UI'">2 · Reproductible</text><text x="249.5" y="127.501" fill="#FFF" font-size="11" textLength="113.362" font-family="'Segoe UI'">Premiers serveurs MCP,</text><text x="249.5" y="142.132" fill="#FFF" font-size="11" textLength="120.731" font-family="'Segoe UI'">identité par agent, traces</text><text x="249.5" y="156.763" fill="#FFF" font-size="11" textLength="174.856" font-family="'Segoe UI'">par projet, registre en partie manuel</text></g><!--entity N3--><g class="entity" data-qualified-name="N3" id="ent0005" data-source-line="19"><rect x="449" y="84" width="151.855" height="93.154" fill="#0F7682" style="stroke:#0F7682;stroke-width:0.5;" rx="5" ry="5"/><text x="459" y="105.87" fill="#FFF" font-size="11" textLength="46.562" font-weight="700" font-family="'Segoe UI'">3 · Défini</text><text x="459" y="120.501" fill="#FFF" font-size="11" textLength="112.347" font-family="'Segoe UI'">Catalogue d’entreprise,</text><text x="459" y="135.132" fill="#FFF" font-size="11" textLength="131.855" font-family="'Segoe UI'">passerelle, jetons délégués,</text><text x="459" y="149.763" fill="#FFF" font-size="11" textLength="120.431" font-family="'Segoe UI'">traçage de bout en bout,</text><text x="459" y="164.394" fill="#FFF" font-size="11" textLength="112.299" font-family="'Segoe UI'">cycle de vie à contrôles</text></g><!--entity N4--><g class="entity" data-qualified-name="N4" id="ent0006" data-source-line="20"><rect x="615" y="84" width="199.599" height="93.154" fill="#1B5E9E" style="stroke:#1B5E9E;stroke-width:0.5;" rx="5" ry="5"/><text x="625" y="105.87" fill="#FFF" font-size="11" textLength="39.478" font-weight="700" font-family="'Segoe UI'">4 · Géré</text><text x="625" y="120.501" fill="#FFF" font-size="11" textLength="126.908" font-family="'Segoe UI'">Multiagent en production,</text><text x="625" y="135.132" fill="#FFF" font-size="11" textLength="113.695" font-family="'Segoe UI'">sagas, autorisation fine,</text><text x="625" y="149.763" fill="#FFF" font-size="11" textLength="122.402" font-family="'Segoe UI'">évaluation continue, coût</text><text x="625" y="164.394" fill="#FFF" font-size="11" textLength="179.599" font-family="'Segoe UI'">par tâche, préparation ISO/IEC 42001</text></g><!--entity N5--><g class="entity" data-qualified-name="N5" id="ent0007" data-source-line="21"><rect x="829" y="84" width="219.692" height="93.154" fill="#0F2744" style="stroke:#0F2744;stroke-width:0.5;" rx="5" ry="5"/><text x="839" y="105.87" fill="#FFF" font-size="11" textLength="61.939" font-weight="700" font-family="'Segoe UI'">5 · Optimisé</text><text x="839" y="120.501" fill="#FFF" font-size="11" textLength="95.353" font-family="'Segoe UI'">Confiance vérifiable</text><text x="839" y="135.132" fill="#FFF" font-size="11" textLength="95.906" font-family="'Segoe UI'">entre organisations,</text><text x="839" y="149.763" fill="#FFF" font-size="11" textLength="124.953" font-family="'Segoe UI'">autonomie ajustée par les</text><text x="839" y="164.394" fill="#FFF" font-size="11" textLength="199.692" font-family="'Segoe UI'">mesures, revue externe ou ISO/IEC 42001</text></g><!--link Rule to Cible--><!--link Rule to N1--><!--link Cible to N3--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk10" data-source-line="26" data-link-type="dependency"><path d="M498.57,49.4 C501.73,58.95 504.262,66.652 508.302,78.882" style="stroke:#B45309;stroke-width:2;stroke-dasharray:7,7;" fill="none" id="Cible-to-N3"/><polygon points="509.87,83.63,510.845,73.83,508.302,78.882,503.249,76.339,509.87,83.63" fill="#B45309" style="stroke:#B45309;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link N1 to N2--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" 