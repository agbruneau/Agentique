<svg xmlns="http://www.w3.org/2000/svg" width="468" height="530.1999999999999" viewBox="0 0 468 530.1999999999999" role="img"><title>La fenêtre 2026-2030</title><rect x="0.00" y="0.00" width="468.00" height="530.20" fill="#f9f7f7"/><line x1="104.00" y1="32.00" x2="104.00" y2="517.20" stroke="#ddd8d2" stroke-width="2.0" stroke-linecap="butt"/><rect x="8.00" y="8.00" width="9.00" height="9.00" rx="2" fill="#d9e6f1" stroke="#1f5c8b" stroke-width="0.9"/><text x="22.00" y="15.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.2" fill="#123f5d" text-anchor="start">ce que le régulateur impose</text><rect x="134.52" y="8.00" width="9.00" height="9.00" rx="2" fill="#f6e6cb" stroke="#a87524" stroke-width="0.9"/><text x="148.52" y="15.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.2" fill="#7a5316" text-anchor="start">ce que l'institution décide</text><rect x="254.70" y="8.00" width="9.00" height="9.00" rx="2" fill="#e6ddf0" stroke="#6b4a86" stroke-width="0.9"/><text x="268.70" y="15.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.2" fill="#4c3361" text-anchor="start">suspendu — signal extérieur</text><line x1="8.00" y1="25.00" x2="460.00" y2="25.00" stroke="#ddd8d2" stroke-width="0.9" stroke-linecap="butt"/><rect x="116.00" y="34.00" width="344.00" height="27.20" rx="3" fill="#f2f0ec" stroke="#8c857a" stroke-width="0.7"/><rect x="116.00" y="34.00" width="2.60" height="27.20" fill="#8c857a"/><text x="96.00" y="45.00" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#4f483f" text-anchor="end" font-weight="bold">20 août 2026</text><text x="125.00" y="45.00" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#4f483f" text-anchor="start" font-weight="bold">Faits arrêtés</text><text x="125.00" y="55.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Point de gel du document. Onze jours avant la première échéance prudentielle.</text><rect x="116.00" y="70.20" width="344.00" height="45.60" rx="3" fill="#edf3f8" stroke="#1f5c8b" stroke-width="0.7"/><rect x="116.00" y="70.20" width="2.60" height="45.60" fill="#1f5c8b"/><text x="96.00" y="81.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#123f5d" text-anchor="end" font-weight="bold">24 août 2026</text><text x="125.00" y="81.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#123f5d" text-anchor="start" font-weight="bold">DORS/2026-133 — rail de paiement en temps réel</text><text x="125.00" y="91.80" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Un message ne peut être ni modifié ni révoqué après émission.</text><text x="125.00" y="101.00" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Le point d'approbation précède donc l'effet ; la compensation après coup n'existe pas.</text><text x="125.00" y="110.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Aucun champ du portefeuille de messages ne déclare qu'un ordre a été formé par un agent.</text><rect x="116.00" y="124.80" width="344.00" height="36.40" rx="3" fill="#edf3f8" stroke="#1f5c8b" stroke-width="0.7"/><rect x="116.00" y="124.80" width="2.60" height="36.40" fill="#1f5c8b"/><text x="96.00" y="135.80" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#123f5d" text-anchor="end" font-weight="bold">1er sept. 2026</text><text x="125.00" y="135.80" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#123f5d" text-anchor="start" font-weight="bold">E-21 — BSIF · gestion du risque opérationnel et résilience</text><text x="125.00" y="146.40" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Opérations critiques cartographiées de bout en bout, dépendances aux tiers comprises,</text><text x="125.00" y="155.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">tolérance de perturbation éprouvée par scénarios sévères mais plausibles.</text><rect x="116.00" y="170.20" width="344.00" height="45.60" rx="3" fill="#fbf2e4" stroke="#a87524" stroke-width="0.7"/><rect x="116.00" y="170.20" width="2.60" height="45.60" fill="#a87524"/><text x="96.00" y="181.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#7a5316" text-anchor="end" font-weight="bold">31 déc. 2026</text><text x="125.00" y="181.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#7a5316" text-anchor="start" font-weight="bold">A1 · A2 · A6 · A7 — les quatre décisions au coût de report asymétrique</text><text x="125.00" y="191.80" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Passerelle d'outils obligatoire · identité non humaine unique par agent ·</text><text x="125.00" y="201.00" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">registre de mandat en ajout seul · interdiction des conceptions cryptographiques figées.</text><text x="125.00" y="210.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">A2 ne se rattrape pas : un journal produit sous identité partagée ne se ré-attribue pas.</text><rect x="116.00" y="224.80" width="344.00" height="36.40" rx="3" fill="#fbf2e4" stroke="#a87524" stroke-width="0.7"/><rect x="116.00" y="224.80" width="2.60" height="36.40" fill="#a87524"/><text x="96.00" y="235.80" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#7a5316" text-anchor="end" font-weight="bold">31 mars 2027</text><text x="125.00" y="235.80" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#7a5316" text-anchor="start" font-weight="bold">A3 — patron d'orchestration</text><text x="125.00" y="246.40" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Hiérarchique superviseur-travailleur, augmenté du cache sémantique, du routage de</text><text x="125.00" y="255.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">modèle et de la reprise adaptative. Décidé une fois le domaine pilote arrêté.</text><rect x="116.00" y="270.20" width="344.00" height="36.40" rx="3" fill="#edf3f8" stroke="#1f5c8b" stroke-width="0.7"/><rect x="116.00" y="270.20" width="2.60" height="36.40" fill="#1f5c8b"/><text x="96.00" y="281.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#123f5d" text-anchor="end" font-weight="bold">1er avril 2027</text><text x="125.00" y="281.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#123f5d" text-anchor="start" font-weight="bold">LD gestion du risque lié aux tiers — AMF</text><text x="125.00" y="291.80" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Cycle de vie des ententes, sous-traitants, responsabilité ultime conservée.</text><text x="125.00" y="301.00" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Les ententes intragroupes sont explicitement visées.</text><rect x="116.00" y="315.60" width="344.00" height="45.60" rx="3" fill="#edf3f8" stroke="#1f5c8b" stroke-width="0.7"/><rect x="116.00" y="315.60" width="2.60" height="45.60" fill="#1f5c8b"/><text x="96.00" y="326.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#123f5d" text-anchor="end" font-weight="bold">1er mai 2027</text><text x="125.00" y="326.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#123f5d" text-anchor="start" font-weight="bold">E-23 (BSIF) et LD utilisation de l'IA (AMF) — le même jour</text><text x="125.00" y="337.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Inventaire d'entreprise permanent des modèles, dont la définition englobe les méthodes d'IA.</text><text x="125.00" y="346.40" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Imputabilité nominative d'un membre de la haute direction pour l'ensemble des systèmes d'IA.</text><text x="125.00" y="355.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Ni « agent » ni « orchestration » ne figurent dans E-23.</text><rect x="116.00" y="370.20" width="344.00" height="27.20" rx="3" fill="#fbf2e4" stroke="#a87524" stroke-width="0.7"/><rect x="116.00" y="370.20" width="2.60" height="27.20" fill="#a87524"/><text x="96.00" y="381.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#7a5316" text-anchor="end" font-weight="bold">30 juin 2027</text><text x="125.00" y="381.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#7a5316" text-anchor="start" font-weight="bold">A4 · premier relevé d'A5</text><text x="125.00" y="391.80" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Portabilité exigée en démonstration, pas en clause. Premier relevé du taux d'infirmation.</text><rect x="116.00" y="406.40" width="344.00" height="27.20" rx="3" fill="#fbf2e4" stroke="#a87524" stroke-width="0.7"/><rect x="116.00" y="406.40" width="2.60" height="27.20" fill="#a87524"/><text x="96.00" y="417.40" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#7a5316" text-anchor="end" font-weight="bold">30 sept. 2027</text><text x="125.00" y="417.40" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#7a5316" text-anchor="start" font-weight="bold">A5 — décider ou recommander</text><text x="125.00" y="428.00" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Tranché sur la mesure du 30 juin, pas sur le réflexe juridique.</text><rect x="116.00" y="442.60" width="344.00" height="36.40" rx="3" fill="#f3eff8" stroke="#6b4a86" stroke-width="0.7"/><rect x="116.00" y="442.60" width="2.60" height="36.40" fill="#6b4a86"/><text x="96.00" y="453.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#4c3361" text-anchor="end" font-weight="bold">2028-2030</text><text x="125.00" y="453.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#4c3361" text-anchor="start" font-weight="bold">S1 · S2 — suspendus sur signal extérieur</text><text x="125.00" y="464.20" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Paiement agentique : règle d'exploitation traitant l'initiation par un mandataire non humain.</text><text x="125.00" y="473.40" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Découverte inter-organisationnelle : une fédération d'accréditation réutilisable.</text><rect x="116.00" y="488.00" width="344.00" height="27.20" rx="3" fill="#f3eff8" stroke="#6b4a86" stroke-width="0.7"/><rect x="116.00" y="488.00" width="2.60" height="27.20" fill="#6b4a86"/><text x="96.00" y="499.00" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.2" fill="#4c3361" text-anchor="end" font-weight="bold">après 2030</text><text x="125.00" y="499.00" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="8.0" fill="#4c3361" text-anchor="start" font-weight="bold">NIST IR 8547 — brouillon, sans version finale au 20 août 2026</text><text x="125.00" y="509.60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="7.1" fill="#1c1a17" text-anchor="start">Dépréciation de RSA-2048 et des courbes P-256 après 2030, interdiction après 2035.</text><circle cx="104.00" cy="42.00" r="4.40" fill="#f9f7f7" stroke="#8c857a" stroke-width="1.6"/><circle cx="104.00" cy="42.00" r="1.60" fill="#8c857a"/><circle cx="104.00" cy="78.20" r="4.40" fill="#1f5c8b" stroke="#f9f7f7" stroke-width="1.6"/><circle cx="104.00" cy="132.80" r="4.40" fill="#1f5c8b" stroke="#f9f7f7" stroke-width="1.6"/><circle cx="104.00" cy="178.20" r="4.40" fill="#a87524" stroke="#f9f7f7" stroke-width="1.6"/><circle cx="104.00" cy="232.80" r="4.40" fill="#a87524" stroke="#f9f7f7" stroke-width="1.6"/><circle cx="104.00" cy="278.20" r="4.40" fill="#1f5c8b" stroke="#f9f7f7" stroke-width="1.6"/><circle cx="104.00" cy="323.60" r="4.40" fill="#1f5c8b" stroke="#f9f7f7" stroke-width="1.6"/><circle cx="104.00" cy="378.20" r="4.40" fill="#a87524" stroke="#f9f7f7" stroke-width="1.6"/><circle cx="104.00" cy="414.40" r="4.40" fill="#a87524" stroke="#f9f7f7" stroke-width="1.6"/><circle cx="104.00" cy="450.60" r="4.40" fill="#6b4a86" stroke="#f9f7f7" stroke-width="1.6"/><circle cx="104.00" cy="496.00" r="4.40" fill="#6b4a86" stroke="#f9f7f7" stroke-width="1.6"/></svg>