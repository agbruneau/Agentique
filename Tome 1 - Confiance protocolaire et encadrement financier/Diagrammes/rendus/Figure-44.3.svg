="A2" id="ent0002" data-source-line="14"><rect x="309.581" y="45.609" width="215.665" height="160.875" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="319.581" y="70.143" fill="#000" font-size="14" textLength="157.944" font-weight="700" font-family="'DejaVu Sans'">4-6  Sur la gouvernance</text><text x="319.581" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="319.581" y="105.361" fill="#000" font-size="14" textLength="195.665" font-family="'DejaVu Sans'">Modéliser l'autonomie sans son</text><text x="319.581" y="122.971" fill="#000" font-size="14" textLength="192.124" font-family="'DejaVu Sans'">point d'arrêt, l'identité sans son</text><text x="319.581" y="140.58" fill="#000" font-size="14" textLength="164.206" font-family="'DejaVu Sans'">ancrage, la trace sans son</text><text x="319.581" y="158.189" fill="#000" font-size="14" textLength="70.82" font-family="'DejaVu Sans'">producteur.</text><text x="319.581" y="175.799" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="319.581" y="193.408" fill="#000" font-size="14" textLength="173.551" font-style="italic" font-family="'DejaVu Sans'">corrections au Tableau 44.2</text></g><!--entity A3--><g class="entity" data-qualified-name="A3" id="ent0003" data-source-line="15"><rect x="561.081" y="45.609" width="228.571" height="160.875" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="571.081" y="70.143" fill="#000" font-size="14" textLength="113.593" font-weight="700" font-family="'DejaVu Sans'">7-9  Sur la portée</text><text x="571.081" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="571.081" y="105.361" fill="#000" font-size="14" textLength="206.22" font-family="'DejaVu Sans'">Étendre le formalisme au-delà de</text><text x="571.081" y="122.971" fill="#000" font-size="14" textLength="159.865" font-family="'DejaVu Sans'">ce qu'il sait dire — dont le</text><text x="571.081" y="140.58" fill="#000" font-size="14" textLength="208.571" font-family="'DejaVu Sans'">dernier, que ce chapitre risque de</text><text x="571.081" y="158.189" fill="#000" font-size="14" textLength="70.014" font-family="'DejaVu Sans'">commettre.</text><text x="571.081" y="175.799" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="571.081" y="193.408" fill="#000" font-size="14" textLength="38.924" font-style="italic" font-family="'DejaVu Sans'">§ 44.9</text></g><!--link A1 to A2--><!--link A2 to A3--><g class="legend" data-source-line="20"><rect x="12" y="226.484" width="808.232" height="45.219" fill="#FBF9F5" style="stroke:#BBB;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="246.018" fill="#000" font-size="14" textLength="798.232" font-family="'DejaVu Sans'">LE DERNIER EST CELUI QUE CE CHAPITRE RISQUE DE COMMETTRE — modéliser pour modéliser, et produire un blueprint</text><text x="17" y="263.627" fill="#000" font-size="14" textLength="709.687" font-family="'DejaVu Sans'">que personne n'instancie. Le tableau source porte les neuf et leur correction ; la figure n'en donne que la structure.</text></g><?plantuml-src bLBBRXf14BplLxJ80Ga12TXERCMo17XHaEor0qik8OTXju69PwStyt1op3NtV41kaVCPuK_o9Ua1maFs9IkarNONtLLTPU-aBeKH1Kn5TZStv7NU8qK6dlKx_TF-IMIt2BiGENsMUWupeIpkTNAS2QzSdxHBH85GkSIFufs7aT2sieTpqYaCgCsAqsuxVj7T0nZCdD1pXLqoEPeDhBjwdeGz8dtIRyNxK8LprFbZNBT_TY1kWtjYRRHY3KayxaCdIGUDsquwl4b6TOXJ62Snz6w6mxYN3cuIwBtfzCP956q9GgLMQpME04RUW1AWoGadITTg4ptHFT8pqhb1y1e44t0WxZ7ZhudEg2Z92ktgeKdUIRLhMZJtCiFGGiX8AJ4bingymyoK_z8CMyxbHKOcKEA-1U4X5LE5_3u-RhRFdykB2WWBdTOXxUF6ootjEVbxD5he3DVChobVFYZ9F41LXNUagP08pDU29GQK95bDNXN6B7-n1bMLEUkJRlcmX-A1XdNNmmvdH7OmmL3kCuVU_9UAzg6ALusphOgI3A_VA5X-SxWwFUDcP0h1QZYwmZToLCiVd6ds0E6Jh_BXhP0iHZBwpzVla7E2-MyJpLdH4asTKMm3_nQYb8vHHjfGMisWea37nNygVlyCZCzsZ8-YgDE2nlk5pFb47uoSBrmZ2Ecq7rSPl8ugJCavAYA0gnWkus4oY8SGZrBenLVZ0RmTSp3Z4CZRGJgCOJWOXT9bYElrTPo6Mj1Ix8miYS-q-wu3EbYP8DS1dIgFfM5RUMTGLw9XepY0kYgrvPDd4fjmXU0snbWUo5S9Pmzdjg3Hpy9KnQR2paru7ToPoRat