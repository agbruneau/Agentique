.471" fill="#1F1F1F" font-size="14"> </text><text x="32.5" y="172.08" fill="#1F1F1F" font-size="14"> </text><text x="32.5" y="189.689" fill="#666" font-size="14" textLength="147.424">aucune réserve d'accès</text></g><!--entity C2--><g class="entity" data-qualified-name="DIX INSTITUTIONS .DOUZE ENTR.ES AU SOCLE.. TROIS CLASSES D.ACC.S.C2" id="ent0003" data-source-line="26"><rect x="384.5" y="42" width="265.164" height="178.484" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="394.5" y="66.533" fill="#9C3D14" font-size="14" font-weight="700">4</text><text x="402.286" y="66.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="413.955" y="66.533" fill="#1F1F1F" font-size="14" textLength="99.606" font-weight="700">Accès dégradé</text><text x="394.5" y="84.143" fill="#1F1F1F" font-size="14"> </text><text x="394.5" y="101.752" fill="#1F1F1F" font-size="14" textLength="190.661">Page rendue par script vérifiée</text><text x="394.5" y="119.361" fill="#1F1F1F" font-size="14" textLength="199.227">par index ; domaines refusant le</text><text x="394.5" y="136.971" fill="#1F1F1F" font-size="14" textLength="195.316">chargement automatisé, lus sur</text><text x="394.5" y="154.58" fill="#1F1F1F" font-size="14" textLength="200.737">miroirs ; rapport trop volumineux</text><text x="394.5" y="172.189" fill="#1F1F1F" font-size="14" textLength="157.192">pour extraction complète.</text><text x="394.5" y="189.799" fill="#1F1F1F" font-size="14"> </text><text x="394.5" y="207.408" fill="#666" font-size="14" textLength="245.164">la réserve accompagne chaque énoncé</text></g><!--entity C3--><g class="entity" data-qualified-name="DIX INSTITUTIONS .DOUZE ENTR.ES AU SOCLE.. TROIS CLASSES D.ACC.S.C3" id="ent0004" data-source-line="27"><rect x="684.5" y="59.5" width="218.803" height="143.266" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="694.5" y="84.033" fill="#9C3D14" font-size="14" font-weight="700">1</text><text x="702.286" y="84.033" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="713.955" y="84.033" fill="#1F1F1F" font-size="14" textLength="160.275" font-weight="700">Aucune source primaire</text><text x="694.5" y="101.643" fill="#1F1F1F" font-size="14"> </text><text x="694.5" y="119.252" fill="#1F1F1F" font-size="14" textLength="139.316">Absence documentée.</text><text x="694.5" y="136.861" fill="#1F1F1F" font-size="14"> </text><text x="694.5" y="154.471" fill="#1F1F1F" font-size="14"> </text><text x="694.5" y="172.08" fill="#1F1F1F" font-size="14"> </text><text x="694.5" y="189.689" fill="#666" font-size="14" textLength="198.803">non absence d'activité — § 35.8</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="34"><path d="M412.5,283 L412.5,319.703 A3,3 0 0 0 415.5,322.703 L1172.147,322.703 A3,3 0 0 0 1175.147,319.703 L1175.147,290 L1165.147,280 L798,280 L794,202.97 L790,280 L415.5,280 A3,3 0 0 0 412.5,283" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M1165.147,280 L1165.147,288.5 A1.5,1.5 0 0 0 1166.647,290 L1175.147,290 L1165.147,280" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="418.5" y="298.495" fill="#333" font-size="13" textLength="741.647">La troisième classe est une ABSENCE DOCUMENTÉE, non une absence d'activité (§ 35.8). Tout le chapitre se lit à travers cette</text><text x="418.5" y="314.847" fill="#333" font-size="13" textLength="636.943">échelle : un cas de la première classe et un cas de la troisième ne s'opposent pas au même régime de preuve.</text></g><!--link C1 to C2--><!--link C2 to C3--><?plantuml-src ZPJDJjj04CVlUOeHFK0b20g4Zr8KAPXKYaIJ2WUfQjF3UdVihB1tpNwaI5Mb7jjx7w2taZv6_IPzaiwQ1481qRNaHBEpC__vpQpjkLGbCwo0XF7pp6YlHAHpRU1PMg-6lV6m4oRqHwaoI5bkSMb7OCfyxbvfvGQiG8YPiZ4QkNow3isrKMXWTybUKbwM8Nng0AsZUof4cgHxrtlQ23HpksZpb5_RGzgvzGNV5grsu_DoNkIEgIn_FCDUsaQydo7PJzgC_vkXbORdJWQbtUF1MRgVjlyt-7QzA7XZGMNbkFyM-eDur1-TZVh3GGnhnyEpTpte3KQdrRTU3DqpY8VHIU_vEenEX_qOefDk7DF