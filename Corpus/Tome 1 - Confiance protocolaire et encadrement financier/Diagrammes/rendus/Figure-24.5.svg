th="116.645" font-family="'Segoe UI'">partagé sans friction</text></g><!--entity E2--><g class="entity" data-qualified-name="CADRE.E2" id="ent0003" data-source-line="23"><rect x="293.5" y="52" width="229.098" height="122.455" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="303.5" y="76.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">2</text><text x="310.978" y="76.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="318.1" y="76.028" fill="#000" font-size="13" textLength="81.961" font-weight="700" font-family="'Segoe UI'">Inter-équipes</text><line x1="294.5" y1="79.291" x2="521.598" y2="79.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="303.5" y="97.319" fill="#000" font-size="13" textLength="179.372" font-family="'Segoe UI'">Plusieurs propriétaires internes.</text><line x1="294.5" y1="104.582" x2="521.598" y2="104.582" style="stroke:#B8B2A6;stroke-width:1;"/><text x="303.5" y="122.61" fill="#57534E" font-size="13" textLength="209.098" font-family="'Segoe UI'">accords de niveau de service croisés,</text><text x="303.5" y="139.901" fill="#57534E" font-size="13" textLength="156.381" font-family="'Segoe UI'">contrats d'interface stables,</text><text x="303.5" y="157.192" fill="#57534E" font-size="13" textLength="154.584" font-family="'Segoe UI'">attribution des défaillances</text></g><!--entity E3--><g class="entity" data-qualified-name="CADRE.E3" id="ent0004" data-source-line="33"><rect x="557.5" y="43" width="246.573" height="139.746" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="567.5" y="67.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">3</text><text x="574.978" y="67.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="582.1" y="67.028" fill="#000" font-size="13" textLength="117.229" font-weight="700" font-family="'Segoe UI'">Inter-organisations</text><