class="entity" data-qualified-name="CADRE.I2" id="ent0003" data-source-line="22"><rect x="445.978" y="43" width="321.431" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="455.978" y="67.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">2</text><text x="463.455" y="67.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="470.577" y="67.028" fill="#000" font-size="13" textLength="169.209" font-weight="700" font-family="'Segoe UI'">Ligne directrice IA de l'AMF</text><line x1="446.978" y1="70.291" x2="766.409" y2="70.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="455.978" y="88.319" fill="#000" font-size="13" textLength="301.431" font-family="'Segoe UI'">Québec, sectoriel. Finale — jamais « en attente » ni «</text><text x="455.978" y="105.61" fill="#000" font-size="13" textLength="64.803" font-family="'Segoe UI'">en projet ».</text><line x1="446.978" y1="112.873" x2="766.409" y2="112.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="455.978" y="130.901" fill="#57534E" font-size="13" textLength="251.462" font-family="'Segoe UI'">publication non datée au jour près — ch. 27</text></g><!--entity I3--><g class="entity" data-qualified-name="CADRE.I3" id="ent0004" data-source-line="31"><rect x="59.978" y="208" width="349.037" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="69.978" y="232.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">3</text><text x="77.455" y="232.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="84.577" y="232.028" fill="#000" font-size="13" textLength="125.798" font-weight="700" font-family="'Segoe UI'">Art. 12.1 de la Loi 25</text><line x1="60.978" y1="235.291" x2="408.015" y2="235.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="69.978" y="253.319" fill="#000" font-size="13" textLength="329.037" font-family="'Segoe UI'">Québec, droit général des renseignements personnels. En</text><text x="69.978" y="270.61" fill="#000" font-size="13" textLength="45.881" font-family="'Segoe UI'">vigueur.</text><line x1="60.978" y1="277.873" x2="408.015" y2="277.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="69.978" y="295.901" fill="#57534E" font-size="13" textLength="283.353" font-family="'Segoe UI'">opposable depuis le 22 septembre 2023 — ch. 27</text></g><!--entity I4--><g class="entity" data-qualified-name="CADRE.I4" id="ent0005" data-source-line="40"><rect x="443.978" y="208" width="336.9" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="453.978" y="232.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">4</text><text x="461.455" y="232.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="468.577" y="232.028" fill="#000" font-size="13" textLength="138.169" font-weight="700" font-family="'Segoe UI'">Avis 11-348 des ACVM</text><line x1="444.978" y1="235.291" x2="779.878" y2="235.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="453.978" y="253.319" fill="#000" font-size="13" textLength="315.301" font-family="'Segoe UI'">Valeurs mobilières. Publié le 5 décembre 2024 ; ne crée</text><text x="453.978" y="270.61" fill="#000" font-size="13" textLength="177.373" font-family="'Segoe UI'">ni ne modifie aucune exigence.</text><line x1="444.978" y1="277.873" x2="779.878" y2="277.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="453.978" y="295.901" fill="#57534E" font-size="13" textLength="316.9" font-family="'Segoe UI'">aucune date — les lois existantes s'appliquent — ch. 28</text></g><!--link I1 to I2--><!--link I3 to I4--><!--link I1 to I3--><!--link I2 to I4--><g class="legend" data-source-line="55"><rect x="12" y="349" width="816.955" height="65.863" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:1;" rx="3" ry="3"/><text x="17" y="369.107" fill="#000" f