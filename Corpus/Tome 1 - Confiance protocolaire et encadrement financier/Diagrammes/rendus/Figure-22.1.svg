<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:842px;height:580px;background:#FFFFFF;" width="842px" height="580px" viewBox="0 0 842 580" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster CADRE--><g class="cluster" data-qualified-name="CADRE" id="ent0001" data-source-line="12"><rect x="50.702" y="7" width="734" height="487" fill="#FFFDF9" style="stroke:#9A3412;stroke-width:1;" rx="3" ry="3"/><text x="98.072" y="23.028" fill="#000" font-size="13" textLength="639.26" font-weight="700" font-family="'Segoe UI'">DEUX AXES : QUI SAIT, ET QUI COMMANDE · EN HAUT, LES AGENTS COMMANDENT ; EN BAS, LE CADRE</text></g><!--cluster HAUT--><g class="cluster" data-qualified-name="CADRE.HAUT" id="ent0002" data-source-line="13"><rect x="74.702" y="51" width="686" height="157" fill="#FFFDF9" style="stroke:#D6D3CD;stroke-width:1;" rx="3" ry="3"/><text x="263.2" y="67.028" fill="#000" font-size="13" textLength="309.004" font-weight="700" font-family="'Segoe UI'">En haut — les agents commandent l'enchaînement</text></g><!--cluster BAS--><g class="cluster" data-qualified-name="CADRE.BAS" id="ent0007" data-source-line="37"><rect x="100.702" y="313" width="633" height="157" fill="#FFFDF9" style="stroke:#D6D3CD;stroke-width:1;" rx="3" ry="3"/><text x="279.122" y="329.028" fill="#000" font-size="13" textLength="276.161" font-weight="700" font-family="'Segoe UI'">En bas — le cadre commande l'enchaînement</text></g><!--entity DISC--><g class="entity" data-qualified-name="CADRE.DISC" id="ent0006" data-source-line="35"><rect x="158.202" y="252" width="518.786" height="37.291" fill="#FEF2F2" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="168.202" y="276.028" fill="#9A3412" font-size="13" textLength="498.786" font-weight="700" font-family="'Segoe UI'">DISCONTINUITÉ : OO2 → OO3 (le commandement quitte les agents pour le cadre)</text></g><!--entity OO1--><g class="entity" data-qualified-name="CADRE.HAUT.OO1" id="ent0003" data-source-line="14"><rect x="91.202" y="87" width="312.881" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="101.202" y="111.028" fill="#9A3412" font-size="13" textLength="27.193" font-weight="700" font-family="'Segoe UI'">OO1</text><text x="128.396" y="111.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="135.518" y="111.028" fill="#000" font-size="13" textLength="131.327" font-weight="700" font-family="'Segoe UI'">Aucun cadre explicite</text><line x1="92.202" y1="114.291" x2="403.083" y2="114.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="101.202" y="132.319" fill="#000" font-size="13" textLength="292.881" font-family="'Segoe UI'">Personne ne détient la connaissance du processus ;</text><text x="101.202" y="149.61" fill="#000" font-size="13" textLength="230.845" font-family="'Segoe UI'">les agents commandent l'enchaînement.</text><line x1="92.202" y1="156.873" x2="403.083" y2="156.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="101.202" y="174.901" fill="#57534E" font-size="13" textLength="204.839" font-style="italic" font-family="'Segoe UI'">on ne peut rien lire avant l'exécution</text></g><!--entity OO2--><g class="entity" data-qualified-name="CADRE.HAUT.OO2" id="ent0004" data-source-line="23"><rect x="439.202" y="87" width="304.711" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="449.202" y="111.028" fill="#9A3412" font-size="13" textLength="27.193" font-weight="700" font-family="'Segoe UI'">OO2</text><text x="476.396" y="111.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="483.518" y="111.028" fill="#000" font-size="13" textLength="149.849" font-weight="700" font-family="'Segoe UI'">Le cadre est dans l'invite</text><line x1="440.202" y1="114.291" x2="742.914" y2="114.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="449.202" y="132.319" fill="#000" font-size="13" textLength="284.711" font-family="'Segoe UI'">Les agents détiennent la connaissance, par l'invite</text><text x="449.202" y="149.61" fill="#000" font-size="13" textLength="228.389" font-family="'Segoe UI'">ou le contexte ; ils commandent encore.</text><line x1="440.202" y1="156.873" x2="742.914" y2="156.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="449.202" y="174.901" fill="#57534E" font-size="13" textLength="249.292" font-style="italic" font-family="'Segoe UI'">une description, sans force exécutoire établie</text></g><!--entity OO3--><g class="entity" data-qualified-name="CADRE.BAS.OO3" id="ent0008" data-source-line="38"><rect x="116.702" y="349" width="282.482" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="126.702" y="373.028" fill="#9A3412" font-size="13" textLength="27.193" font-weight="700" font-family="'Segoe UI'">OO3</text><text x="153.896" y="373.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="161.018" y="373.028" fill="#000" font-size="13" textLength="78.654" font-weight="700" font-family="'Segoe UI'">Le cadre seul</text><line x1="117.702" y1="376.291" x2="398.184" y2="376.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="126.702" y="394.319" fill="#000" font-size="13" textLength="262.482" font-family="'Segoe UI'">Le cadre détient la connaissance — les agents</text><text x="126.702" y="411.61" fill="#000" font-size="13" textLength="167" font-family="'Segoe UI'">l'ignorent — et il commande.</text><line x1="117.702" y1="418.873" x2="398.184" y2="418.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="126.702" y="436.901" fill="#57534E" font-size="13" textLength="188.957" font-style="italic" font-family="'Segoe UI'">l'enchaînement complet est lisible</text></g><!--entity OO4--><g class="entity" data-qualified-name="CADRE.BAS.OO4" id="ent0009" data-source-line="47"><rect x="434.202" y="349" width="283.244" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="444.202" y="373.028" fill="#9A3412" font-size="13" textLength="27.193" font-weight="700" font-family="'Segoe UI'">OO4</text><text x="471.396" y="373.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="478.518" y="373.028" fill="#000" font-size="13" textLength="130.774" font-weight="700" font-family="'Segoe UI'">Le cadre et les agents</text><line x1="435.202" y1="376.291" x2="716.446" y2="376.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="444.202" y="394.319" fill="#000" font-size="13" textLength="263.244" font-family="'Segoe UI'">Les deux détiennent la connaissance ; le cadre</text><text x="444.202" y="411.61" fill="#000" font-size="13" textLength="67.26" font-family="'Segoe UI'">commande.</text><line x1="435.202" y1="418.873" x2="716.446" y2="418.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="444.202" y="436.901" fill="#57534E" font-size="13" textLength="188.957" font-style="italic" font-family="'Segoe UI'">l'enchaînement complet est lisible</text></g><!--link OO1 to OO2--><!--link OO3 to OO4--><!--link OO1 to DISC--><!--link OO2 to DISC--><!--link DISC to OO3--><!--link DISC to OO4--><g class="legend" data-source-line="65"><rect x="12" y="514" width="811.404" height="47.242" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:1;" rx="3" ry="3"/><text x="17" y="534.107" fill="#000" font-size="14" textLength="801.404" font-family="'Segoe UI'">La seule DISCONTINUITÉ est le passage d'OO2 à OO3 : c'est là que le commandement de l'enchaînement quitte les agents pour le</text><text x="17" y="552.729" fill="#000" font-size="14" textLength="592.901" font-family="'Segoe UI'">cadre, et que l'enchaînement devient lisible avant l'exécution. Les autres passages sont graduels.</text></g><?plantuml-src lLNBRjj65DtpAowSXHF1j