<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:770px;height:430px;background:#FFFFFF;" width="770px" height="430px" viewBox="0 0 770 430" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster TROIS DÉCLENCHEURS, ET ILS SE CUMULENT--><g class="cluster" data-qualified-name="TROIS D.CLENCHEURS. ET ILS SE CUMULENT" id="ent0001" data-source-line="29"><path d="M127.5,6 L441.183,6 A9,9 0 0 1 447.183,12 L454.183,29.609 L634.5,29.609 A6,6 0 0 1 640.5,35.609 L640.5,306 A6,6 0 0 1 634.5,312 L127.5,312 A6,6 0 0 1 121.5,306 L121.5,12 A6,6 0 0 1 127.5,6" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="121.5" y1="29.609" x2="454.183" y2="29.609" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="125.5" y="22.533" fill="#9C3D14" font-size="14" textLength="319.683" font-weight="700">TROIS DÉCLENCHEURS, ET ILS SE CUMULENT</text></g><!--entity TIC--><g class="entity" data-qualified-name="TROIS D.CLENCHEURS. ET ILS SE CUMULENT.TIC" id="ent0002" data-source-line="30"><ellipse cx="257.391" cy="68.378" rx="119.891" ry="26.378" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;"/><text x="227.439" y="59.89" fill="#1F1F1F" font-size="14" textLength="59.903" font-weight="700">Tiers TIC</text><text x="158.998" y="77.499" fill="#1F1F1F" font-size="14" textLength="196.786">dès qu'il s'exécute chez un tiers</text></g><!--entity MOD--><g class="entity" data-qualified-name="TROIS D.CLENCHEURS. ET ILS SE CUMULENT.MOD" id="ent0003" data-source-line="31"><ellipse cx="518.479" cy="68.747" rx="105.479" ry="25.247" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;"/><text x="494.366" y="61.234" fill="#1F1F1F" font-size="14" textLength="48.228" font-weight="700">Modèle</text><text x="437.364" y="78.843" fill="#1F1F1F" font-size="14" textLength="162.23">dès qu'il décide ou oriente</text></g><!--entity ALL--><g class="entity" data-qualified-name="TROIS D.CLENCHEURS. ET ILS SE CUMULENT.ALL" id="ent0004" data-source-line="32"><rect x="343.5" y="155" width="73.689" height="23.609" fill="#EFE8DC" style="stroke:#9C3D14;stroke-width:0.5;" rx="6" ry="6"/><text x="353.5" y="172.533" fill="#9C3D14" font-size="14" textLength="53.689" font-weight="700">les trois</text></g><!--entity DEC--><g class="entity" data-qualified-name="TROIS D.CLENCHEURS. ET ILS SE CUMULENT.DEC" id="ent0005" data-source-line="33"><ellipse cx="380.398" cy="267.58" rx="130.898" ry="28.58" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;"/><text x="308.429" y="260.543" fill="#1F1F1F" font-size="14" textLength="143.938" font-weight="700">Décision automatisée</text><text x="273.597" y="278.153" fill="#1F1F1F" font-size="14" textLength="213.603">dès qu'elle est opposable au client</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="42"><path d="M6,362 L6,409.055 A6,6 0 0 0 12,415.055 L749.305,415.055 A6,6 0 0 0 755.305,409.055 L755.305,366 L745.305,356 L384.5,356 L380.5,296.28 L376.5,356 L12,356 A6,6 0 0 0 6,362" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M745.305,356 L745.305,363 A3,3 0 0 0 748.305,366 L755.305,366 L745.305,356" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="12" y="374.495" fill="#333" font-size="13" textLength="728.305">Le point méthodologique décisif est LA COEXISTENCE : les trois qualifications ne s'excluent pas. Un agent qui s'exécute chez</text><text x="12" y="390.847" fill="#333" font-size="13" textLength="705.256">un tiers, qui décide, et dont la décision est opposable au client relève des trois régimes en même temps — et de leurs trois</text><text x="12" y="407.198" fill="#333" font-size="13" textLength="67.196">calendriers.</text></g><!--link TIC to MOD--><!--link TIC to ALL--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk7" data-source-line="36" data-link-type="association"><path d="M288.86,94.1 C313.77,113.65 347.45,140.07 366.26,154.83" style="stroke:#181818;stroke-width:1;" fill="none" id="TIC-ALL"/></g><!--link MOD to ALL--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="37" data-link-type="association"><path d="M485.8,92.37 C457.58,112.1 418.05,139.75 396.33,154.93" style="stroke:#181818;stroke-width:1;" fill="none" id="MOD-ALL"/></g><!--link ALL to DEC--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="38" data-link-type="association"><path d="M380.5,179.3 C380.5,193.75 380.5,219.27 380.5,238.98" style="stroke:#181818;stroke-width:1;" fill="none" id="ALL-DEC"/></g><?plantuml-src ZPJDRjD04CVlVefHEFJI5fL6Qa5LfE8O4IbjfJgHa833UdVMMNMpc-u782eahjnvY8RNy9lm98mtJXGQHR0-sBCp-vl_pDZsTyeic6Dpg1Y_gvsDHkHMMmVFP5gPtqJu6HFsip8rIAOzRda4IXPrU6DDk6PpX98PNw9JswSJcbjdqC79Yot7WXAp6k4X0rglTsG8MScpbSywWQxR5tqk-Mg_pTljlkIdugIVVTlYHu-S-VtyCzb7tELNvrMVyQVy4zbUV_4vSs8V72MU2xuBxsJ-MxonORzo9izb_t-LdwP5y6pTyDxazcPKmh3vaO-Bw_njCRqj3w6Om6XSGbb0FhsQacFIwmIi6zcxg0OJXSx3P9HVFAy67une7ZtSnmEbmH_WbsR98-dcC_mAqK1eWtl0qe4Tr9MbqnftG88eIY3O2DOfD04Jukfcc12fxUrvZHw2iygtX1HoEHxlP1csDA-i0HQ3dREWVBDyaXIrHa0Vm2uMrhEAB1Q1wpPv0W-BF4jagWEEti-K46W-EbNFmj5WeomvZpOgQ7lRf7jhjYYQHPflPGD9oiO82wjCW7cp33ChQ6wrke-uweHNCcaRNq9-KxmRbHEQMG6lO5C_bS2qaefJSTPuC9Y6mNKa_VIP-MEOKlbrQzr7zNHIsNfIXydRjVyGC82WrmWqMmkX9kxf4ZZKpUCdahmHvPfbhUPaeg72Vj7V8U1yuU7tzvy9ZLH0T5rqnfb68rmhupYZf_G1_040?></g></svg>