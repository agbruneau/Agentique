<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1087px;height:446px;background:#FFFFFF;" width="1087px" height="446px" viewBox="0 0 1087 446" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster P1--><g class="cluster" data-qualified-name="P1" id="ent0001" data-source-line="24"><path d="M9.207,90.18 L217.689,90.18 A4.5,4.5 0 0 1 220.689,93.18 L227.689,113.789 L418.207,113.789 A3,3 0 0 1 421.207,116.789 L421.207,333.18 A3,3 0 0 1 418.207,336.18 L9.207,336.18 A3,3 0 0 1 6.207,333.18 L6.207,93.18 A3,3 0 0 1 9.207,90.18" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="6.207" y1="113.789" x2="227.689" y2="113.789" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="10.207" y="106.713" fill="#444" font-size="14" textLength="208.482" font-weight="700">REGISTRE GOUVERNÉ (ch. 15)</text></g><!--cluster P2--><g class="cluster" data-qualified-name="P2" id="ent0003" data-source-line="28"><path d="M464.207,90.18 L705.344,90.18 A4.5,4.5 0 0 1 708.344,93.18 L715.344,113.789 L861.207,113.789 A3,3 0 0 1 864.207,116.789 L864.207,333.18 A3,3 0 0 1 861.207,336.18 L464.207,336.18 A3,3 0 0 1 461.207,333.18 L461.207,93.18 A3,3 0 0 1 464.207,90.18" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="461.207" y1="113.789" x2="715.344" y2="113.789" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="465.207" y="106.713" fill="#444" font-size="14" textLength="241.138" font-weight="700">CATALOGUE INTERNE (ce chapitre)</text></g><!--entity C1--><g class="entity" data-qualified-name="P1.C1" id="ent0002" data-source-line="25"><rect x="49.207" y="134.18" width="348.18" height="178.484" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="59.207" y="158.713" fill="#1F1F1F" font-size="14" textLength="328.18" font-weight="700">Qu'un tiers vérifie une identité qu'il n'a pas émise</text><text x="59.207" y="176.323" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="193.932" fill="#1F1F1F" font-size="14" textLength="305.04">Opposable à des tiers, dans les limites du Livre II</text><text x="59.207" y="211.541" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="229.151" fill="#1F1F1F" font-size="14" textLength="235.341">Porte l'ancrage — le verrou du Livre II</text><text x="59.207" y="246.76" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="264.369" fill="#1F1F1F" font-size="14" textLength="132.631">Peuplé par l'émission</text><text x="59.207" y="281.979" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="299.588" fill="#1F1F1F" font-size="14" textLength="163.358" font-weight="700">un instrument de preuve</text></g><!--entity C2--><g class="entity" data-qualified-name="P2.C2" id="ent0004" data-source-line="29"><rect x="504.707" y="134.18" width="335.499" height="178.484" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="514.707" y="158.713" fill="#1F1F1F" font-size="14" textLength="315.499" font-weight="700">Que l'organisation énumère ce qu'elle a produit</text><text x="514.707" y="176.323" fill="#1F1F1F" font-size="14"> </text><text x="514.707" y="193.932" fill="#1F1F1F" font-size="14" textLength="141.661">Opposable à personne</text><text x="514.707" y="211.541" fill="#1F1F1F" font-size="14"> </text><text x="514.707" y="229.151" fill="#1F1F1F" font-size="14" textLength="294.068">Porte le gabarit d'origine et l'état de certification</text><text x="514.707" y="246.76" fill="#1F1F1F" font-size="14"> </text><text x="514.707" y="264.369" fill="#1F1F1F" font-size="14" textLength="136.985">Peuplé par la fabrique</text><text x="514.707" y="281.979" fill="#1F1F1F" font-size="14"> </text><text x="514.707" y="299.588" fill="#1F1F1F" font-size="14" textLength="167.228" font-weight="700">un instrument de gestion</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="35"><path d="M271.707,375.18 L271.707,428.235 A3,3 0 0 0 274.707,431.235 L1069.821,431.235 A3,3 0 0 0 1072.821,428.235 L1072.821,382.18 L1062.821,372.18 L676.207,372.18 L672.207,312.43 L668.207,372.18 L274.707,372.18 A3,3 0 0 0 271.707,375.18" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M1062.821,372.18 L1062.821,380.68 A1.5,1.5 0 0 0 1064.321,382.18 L1072.821,382.18 L1062.821,372.18" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="277.707" y="390.675" fill="#333" font-size="13" textLength="780.114">CONSTRUCTION D'AUTEUR EN TOTALITÉ. La différence qui compte n'est pas le contenu mais L'OPPOSABILITÉ : le catalogue n'est</text><text x="277.707" y="407.027" fill="#333" font-size="13" textLength="727.327">opposable à personne — c'est un instrument de gestion, non de preuve. Le confondre avec un registre fait croire à une preuve</text><text x="277.707" y="423.378" fill="#333" font-size="13" textLength="92.815">qui n'existe pas.</text></g><!--link P1 to P2--><?plantuml-src ZPFFRjD04CRlVefHEHYaDYWbq0fLbT9WAajH71A72-MmNe-TLUrTT_y498J4jNSUW2Dz3hy9Jy9u4sXA6edD8VBkpdpV_6RMN0lPCCrgo1Y_BhLoCX-fIcbuKlWLcBytp9BbwfEG9HIiChXracF1N6NVAcadh4QOCsdcgCLsj4_DbPQeuTNMVaEwh4Ju4W2jYnqNUP4L9-ipfNFKc_rym0k-tkzaDxi3luAlsxh8BPDbjL_Xf1WWxYfafzc0yNyL-aNtUw0WbTsVd1MdnU1_ax_mYv87VwWSpABBU9xE8hXC5k-ZsQIzXQTysOF-osS7m0nC-nlf-peFphBpTovq4gn0RM3Ltb4h18AJ2297QOLjx-36XQ826J9gWO7shXO6pvvdvrVoIYPDempBA5dxWxfhrfaE8QV6GaNVbQY5fV_SmLYiD48STt5JfOb55JB9TMV_rxVlT1rMg0dApcLqJKL6Y2A5U0D6ADaTKGLaNqXZjQl9C7c0HgDRUOU-y57_0QVHC1sEayj51F4a9KuHOKBWIzO8gt73wdWFgywoqYMJmZ1B5eY6T7NxawnI4WA55TqbK5hbJjX7AJK4I4c9MnWGIfOnBSW-fHUb8FveVQsM-PeuQakjuLvrXmcZXvPfSUDm7vCIJHTv3-MuWq8pSVHXAN9gzKUINTgZSwez2FoWPifQLGUZP49ZjHYbSJA1D-5maKQB6KGJI1C26QVjRG_6379H53G-A3q70LpL3IMH8GdxkQ4YEGqmIWSr4mR6OJAT9lFXHUoJm6j_WrbMgT9j0WFr63W_BDmdtbVd8RqrUJyBvD2h5qhcr2gsGjw5QYm51IFH8_HSAw6zK3V-wy2WAuMiVAPxs9NH2r3c_Y7_1W00?></g></svg>