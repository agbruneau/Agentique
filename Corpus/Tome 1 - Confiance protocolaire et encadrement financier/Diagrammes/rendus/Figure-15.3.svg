e-line="23"><rect x="414.5" y="7" width="272.078" height="191.619" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="424.5" y="31.028" fill="#9A3412" font-size="13" textLength="73.709" font-family="'Segoe UI'">LE MAGASIN</text><line x1="415.5" y1="34.291" x2="685.578" y2="34.291" style="stroke:#9A3412;stroke-width:1;"/><text x="424.5" y="52.319" fill="#000" font-size="13" textLength="252.078" font-weight="700" font-family="'Segoe UI'">Ce que la couche d'infrastructure spécifie</text><text x="424.5" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="424.5" y="86.901" fill="#000" font-size="13" textLength="245.28" font-family="'Segoe UI'">Le magasin où les descriptions sont tenues</text><text x="424.5" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="424.5" y="121.483" fill="#000" font-size="13" textLength="246.302" font-family="'Segoe UI'">Ses champs d'accès aux outils et de bornes</text><text x="424.5" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="424.5" y="156.065" fill="#000" font-size="13" textLength="168.061" font-family="'Segoe UI'">Ce qui décide de la confiance</text><line x1="415.5" y1="163.328" x2="685.578" y2="163.328" style="stroke:#9A3412;stroke-width:1;"/><text x="424.5" y="181.356" fill="#000" font-size="13" textLength="163.389" font-weight="700" font-family="'Segoe UI'">spécifié, et à statut déclaré</text></g><!--entity NOTE--><g class="entity" data-qualified-name="NOTE" id="ent0003" data-source-line="37"><rect x="7" y="259" width="768.604" height="54.582" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="283.028" fill="#000" font-size="13" textLength="748.604" font-family="'Segoe UI'">Ce paragraphe est le versant IDENTITÉ ET CONFORMITÉ d'une matière partagée : le versant protocolaire — les trois moments de la</text><text x="17" y="300.319" fill="#000" font-size="13" textLength="624.476" font-fam