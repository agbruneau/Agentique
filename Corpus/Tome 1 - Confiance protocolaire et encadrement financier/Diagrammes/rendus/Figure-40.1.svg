<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1058px;height:505px;background:#FFFFFF;" width="1058px" height="505px" viewBox="0 0 1058 505" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster QUATRE GRANDEURS, QUATRE MANQUES--><g class="cluster" data-qualified-name="QUATRE GRANDEURS. QUATRE MANQUES" id="ent0001" data-source-line="24"><path d="M9,6 L304.565,6 A4.5,4.5 0 0 1 307.565,9 L314.565,29.609 L838,29.609 A3,3 0 0 1 841,32.609 L841,384 A3,3 0 0 1 838,387 L9,387 A3,3 0 0 1 6,384 L6,9 A3,3 0 0 1 9,6" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="6" y1="29.609" x2="314.565" y2="29.609" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="10" y="22.533" fill="#9C3D14" font-size="14" textLength="295.565" font-weight="700">QUATRE GRANDEURS, QUATRE MANQUES</text></g><!--entity G1--><g class="entity" data-qualified-name="QUATRE GRANDEURS. QUATRE MANQUES.G1" id="ent0002" data-source-line="25"><rect x="55.5" y="59.5" width="340.968" height="108.047" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="65.5" y="84.033" fill="#9C3D14" font-size="14" font-weight="700">1</text><text x="73.286" y="84.033" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="84.955" y="84.033" fill="#1F1F1F" font-size="14" textLength="138.455" font-weight="700">Disponibilité du parc</text><text x="65.5" y="101.643" fill="#1F1F1F" font-size="14"> </text><text x="65.5" y="119.252" fill="#1F1F1F" font-size="14" textLength="320.968">Dénombrement des agents identifiables à l'instant t.</text><text x="65.5" y="136.861" fill="#1F1F1F" font-size="14"> </text><text x="65.5" y="154.471" fill="#666" font-size="14" textLength="314.426">E-23 attend un inventaire — attente sous condition</text></g><!--entity G2--><g class="entity" data-qualified-name="QUATRE GRANDEURS. QUATRE MANQUES.G2" id="ent0003" data-source-line="26"><rect x="443" y="42" width="375.954" height="143.266" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="453" y="66.533" fill="#9C3D14" font-size="14" font-weight="700">2</text><text x="460.786" y="66.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="472.455" y="66.533" fill="#1F1F1F" font-size="14" textLength="164.938" font-weight="700">Couverture de traçabilité</text><text x="453" y="84.143" fill="#1F1F1F" font-size="14"> </text><text x="453" y="101.752" fill="#1F1F1F" font-size="14" textLength="322.971">Part des actions tracées et rattachées à une identité</text><text x="453" y="119.361" fill="#1F1F1F" font-size="14" textLength="138.523">émise et à un mandat.</text><text x="453" y="136.971" fill="#1F1F1F" font-size="14"> </text><text x="453" y="154.58" fill="#666" font-size="14" textLength="355.954">l'art. 12.1 impose la restitution des facteurs et paramètres</text><text x="453" y="172.189" fill="#666" font-size="14" textLength="81.717">sur demande</text></g><!--entity G3--><g class="entity" data-qualified-name="QUATRE GRANDEURS. QUATRE MANQUES.G3" id="ent0004" data-source-line="28"><rect x="22" y="245" width="398.267" height="125.656" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="32" y="269.533" fill="#9C3D14" font-size="14" font-weight="700">3</text><text x="39.786" y="269.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="51.455" y="269.533" fill="#1F1F1F" font-size="14" textLength="128.379" font-weight="700">Délai de révocation</text><text x="32" y="287.143" fill="#1F1F1F" font-size="14"> </text><text x="32" y="304.752" fill="#1F1F1F" font-size="14" textLength="307.385">Durée entre la décision de retrait et le refus par le</text><text x="32" y="322.361" fill="#1F1F1F" font-size="14" textLength="163.003">dernier point d'application.</text><text x="32" y="339.971" fill="#1F1F1F" font-size="14"> </text><text x="32" y="357.58" fill="#666" font-size="14" textLength="378.267">aucun cadre canadien instruit ne fixe de délai de propagation</text></g><!--entity G4--><g class="entity" data-qualified-name="QUATRE GRANDEURS. QUATRE MANQUES.G4" id="ent0005" data-source-line="29"><rect x="455" y="245" width="370.26" height="125.656" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="465" y="269.533" fill="#9C3D14" font-size="14" font-weight="700">4</text><text x="472.786" y="269.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="484.455" y="269.533" fill="#1F1F1F" font-size="14" textLength="172.73" font-weight="700">Fraîcheur des évaluations</text><text x="465" y="287.143" fill="#1F1F1F" font-size="14"> </text><text x="465" y="304.752" fill="#1F1F1F" font-size="14" textLength="350.26">Âge de la dernière évaluation de chaque agent, rapporté</text><text x="465" y="322.361" fill="#1F1F1F" font-size="14" textLength="63.82">à un seuil.</text><text x="465" y="339.971" fill="#1F1F1F" font-size="14"> </text><text x="465" y="357.58" fill="#666" font-size="14" textLength="197.702">deux attentes, aucune exigence</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="38"><path d="M236,434 L236,487.055 A3,3 0 0 0 239,490.055 L1040.735,490.055 A3,3 0 0 0 1043.735,487.055 L1043.735,441 L1033.735,431 L644,431 L640,371.08 L636,431 L239,431 A3,3 0 0 0 236,434" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M1033.735,431 L1033.735,439.5 A1.5,1.5 0 0 0 1035.235,441 L1043.735,441 L1033.735,431" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="242" y="449.495" fill="#333" font-size="13" textLength="786.735">CONSTRUCTION D'AUTEUR EN TOTALITÉ, et aucune valeur n'est prescrite. La colonne qui compte est la dernière : pour chacune des</text><text x="242" y="465.847" fill="#333" font-size="13" textLength="736.544">quatre grandeurs, quelque chose manque encore pour que l'indicateur se calcule — et l'une d'elles n'a même pas d'exigence de</text><text x="242" y="482.198" fill="#333" font-size="13" textLength="83.11">délai au socle.</text></g><!--link G1 to G2--><!--link G3 to G4--><!--link G1 to G3--><!--link G2 to G4--><?plantuml-src ZLLBRXiv4DttAGXdeOsiG1_a1qE0nbQC08ayiQHLF8jgaYqHOPDjVXm3Wm46sMMV0sINA8jSec-IawIAtSh8aG9FUs6pgbYlwjLZsRzLfW879Sk1lrqv6uqujTewzg18N-P_HlWr2FjEcHKhG7kvun6oWAZ3Ssl234h9vc3yN3grUpkbvjOPwTYZ7Nk5kB2IxE-CuVV7NXMYo8l7ZSyw8Lrh5oDUyCPEiAtrAH-A_YZxPnTNyW1cfN-FyBWOIRcFa3_9Hy1_HUWNz7C7mTZm--HGF2b6_pVvC7sOFDkoSlHwELbSJjdvvMHsDbrUphkijRoQp5ulf_EZ5lc_DezEE6Lxrf8nFid7_PE7-VZaORAFCHXDPyfNrgXSQHNg3HCH1-4unLsPAtDMRumjSoTBQGAErpCinWJFbC1Vgb2GQpJMdvZkAECHER3GevjRy4Vf6q-F1qC68KWZM3HCcHky3yf9zltVZuq3oVCsUiQj4IeeQxQ57Z7mxBn_Vtk3_VPERRoHBaG44f851_LdQ7lTzlWdkBOrJgYUedYzGOCCp65fmDVfY5r68zlMCS6LgJUbyfBYae-LO0GSx5zt4AN7-eDUdwcoidXB0tRZCLCas5H1WIN8w19oqbJz9M3CjgMzh3uwl4UeyYvPW-n-jeO7n51lD2XYojMR6ykX6KEhXOX6RDPWILIyg3TS-QPqH4BMLA32DPqA72HsW8ShBCuPXQ-zief4r86gqgh9VOWgY1ofv20GXeC1eIG9nWSN4G07KAZRD4tnizhAsGfMi2-QuVqqZFPfU8uo-SRNCh6BSz_SW8ufkz-IKRzVfHg81sgl_eBLxWIIZw_XEihcnNHHILLbNIER91OlezA7210otcwVXE-on0VoVgim4VzbqADcqETzTlnchGHAyo-dLkjmF2OH9DVmW6kqTmitkY5FmzZvODz3wpHBEowt8TWoExsOpHUNozF5YuiPE-jCbWjSJ6mwOukBnUJbYqNzeKjwQEj7QeXGqq7Duy2avqu5sMClWL531aEkeyA_omeXAEWEjyzGFdWTEKtPS2xPDLADdfKZ_UEhwM82gObolgO7Xk-23aYQnR1qdSwqgGJfZyhnf37DesuM4Scta_9tfARDPZh0oleh_Y-ha6wqjbF00h9MVn1nRt4jUnajDoBe1m00?></g></svg>