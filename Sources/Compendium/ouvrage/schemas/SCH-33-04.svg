<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 866" width="1200" height="866">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B91C1C"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>
  <rect id="bg-canvas" x="0" y="0" width="1200" height="866" fill="#FFFFFF"/>
  <g id="header-bar">
    <rect x="20" y="16" width="1160" height="72" rx="10" fill="#0F2942"/>
    <text x="38" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17.5" font-weight="bold" fill="#FFFFFF">SCH-33-04 — Courbes en ciseaux : gains de productivité 0–12 mois vs érosion du repli à 3–5 ans</text>
    <text x="38" y="68" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#CBD5E1">Paradoxe automatisation–augmentation · Cui, Noy &amp; Zhang, Stanford HAI 2026 &amp; Banque du Canada 2026-22 · Systèmes d'entreprise (fr-CA)</text>
  </g>
  <g id="zone-Z1">
    <rect x="20" y="98" width="760" height="490" rx="10" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="1.8"/>
    <rect x="20" y="98" width="760" height="34" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="34" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E3A8A">Z1–Z2 · Courbes en ciseaux temporels : vélocité immédiate vs érosion différée du repli manuel</text>
    <g id="node-1" class="node" data-node="true">
      <rect x="34" y="142" width="732" height="430" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <line x1="92" y1="168" x2="92" y2="516" stroke="#475569" stroke-width="1.6"/>
      <line x1="92" y1="342" x2="740" y2="342" stroke="#0F2942" stroke-width="1.8" stroke-dasharray="4,3"/>
      <text x="84" y="346" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0F2942">0 %</text>
      <text x="84" y="190" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#0F766E">+35 %</text>
      <text x="84" y="266" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#0F766E">+18 %</text>
      <text x="84" y="422" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#B91C1C">−15 %</text>
      <text x="84" y="498" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#B91C1C">−30 %</text>
      <rect x="92" y="168" width="160" height="348" fill="#F0FDFA" opacity="0.5"/>
      <text x="172" y="534" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0F766E">0–12 mois (T1–T4)</text>
      <rect x="440" y="168" width="300" height="348" fill="#FEF2F2" opacity="0.55"/>
      <text x="590" y="534" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#B91C1C">Années 3–5 : zone de rupture du repli</text>
      <path d="M 96 342 C 160 225, 250 205, 420 218 S 640 232, 725 245" fill="none" stroke="#0F766E" stroke-width="3.2"/>
      <circle cx="215" cy="222" r="5" fill="#0F766E"/>
      <text x="235" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0F766E">Gains initiaux mesurés (L+) :</text>
      <text x="235" y="191" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#134E4A">+26,08 % tâches (Cui, 4 867 dev.)</text>
      <text x="235" y="206" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#134E4A">−40 % temps / +18 % qualité (Noy &amp; Zhang)</text>
      <path d="M 96 342 C 190 362, 310 415, 455 452 S 650 492, 725 500" fill="none" stroke="#B91C1C" stroke-width="3.2"/>
      <circle cx="385" cy="435" r="5" fill="#B91C1C"/>
      <text x="285" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#B91C1C">Contraction de la relève (L+) :</text>
      <text x="285" y="485" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#7F1D1D">−20 % emploi 22–25 ans · −11 % inscriptions (HAI)</text>
      <text x="285" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#7F1D1D">18 % / 21 % (≥ 20 emp.) frein embauche 3 ans (BdC)</text>
      <line x1="620" y1="238" x2="620" y2="482" stroke="#D97706" stroke-width="2.2" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
      <rect x="520" y="346" width="208" height="44" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
      <text x="624" y="365" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#78350F">Ciseau d'atrophie &amp;</text>
      <text x="624" y="381" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#78350F">échec du repli manuel</text>
    </g>
  </g>
  <g id="zone-Z2">
    <rect x="794" y="98" width="386" height="490" rx="10" fill="#F8FAFC" stroke="#047857" stroke-width="1.8"/>
    <rect x="794" y="98" width="386" height="34" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
    <text x="808" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#064E3B">Z3 · Exigences de continuité et parades</text>
    <g id="node-2" class="node" data-node="true">
      <rect x="808" y="144" width="358" height="102" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
      <text x="820" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#1E3A8A">Obligations prudentielles de repli</text>
      <text x="820" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• EU AI Act art. 15(4) &amp; 16(l) : plans de</text>
      <text x="820" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">  sauvegarde et accessibilité maintenus.</text>
      <text x="820" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• BSIF E-23 / B-10 / E-21 : replis manuels</text>
      <text x="820" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">  éprouvés sans fournisseur.</text>
    </g>
    <g id="node-3" class="node" data-node="true">
      <rect x="808" y="258" width="358" height="96" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.8"/>
      <text x="820" y="279" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#064E3B">① Quotas formateurs &gt; 70 %</text>
      <text x="820" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Préserver des dossiers complets instruits</text>
      <text x="820" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">en pratique profonde par la relève junior</text>
      <text x="820" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">(protection de la mémoire transactive).</text>
    </g>
    <g id="node-4" class="node" data-node="true">
      <rect x="808" y="366" width="358" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
      <text x="820" y="387" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#78350F">② Dossiers témoins à l'aveugle</text>
      <text x="820" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Injecter des cas synthétiques piégés</text>
      <text x="820" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">pour neutraliser l'approbation réflexe</text>
      <text x="820" y="438" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">et éviter la requalification Loi 25 art. 12.1.</text>
    </g>
    <g id="node-5" class="node" data-node="true">
      <rect x="808" y="474" width="358" height="96" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.8"/>
      <text x="820" y="495" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#134E4A">③ Exercices chronométrés sans agent</text>
      <text x="820" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Tester périodiquement l'exploitation en</text>
      <text x="820" y="530" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">mode manuel dégradé sur interfaces de</text>
      <text x="820" y="546" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">secours accessibles et conformes.</text>
    </g>
  </g>
  <g id="flows-bar">
    <rect x="20" y="600" width="1160" height="118" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="622" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① À 0–12 mois, l'assistance augmente la production (+26,08 % tâches,</text>
    <text x="34" y="658" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">−40 % de délais) chez les profils juniors.</text>
    <text x="610" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② Parallèlement, la suppression de l'apprentissage tarit l'embauche</text>
    <text x="610" y="658" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">d'entrée (−20 % 22–25 ans É.-U. ; 18–21 % frein BdC).</text>
    <text x="34" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ À 3–5 ans, l'atrophie de la mémoire transactive transforme le plan</text>
    <text x="34" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">de repli manuel en fiction réglementaire.</text>
    <text x="610" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ Quotas formateurs (&gt; 70 %), dossiers témoins à l'aveugle et</text>
    <text x="610" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">exercices sans agent ferment cet effet de ciseau.</text>
  </g>
  <g id="legend-bar">
    <rect x="20" y="728" width="1160" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="34" y="741" width="18" height="18" rx="4" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
    <text x="60" y="754" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Gains initiaux de productivité (0–12 mois)</text>
    <rect x="411" y="741" width="18" height="18" rx="4" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="437" y="754" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Érosion du vivier junior &amp; mémoire transactive</text>
    <rect x="788" y="741" width="18" height="18" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="814" y="754" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Disjoncteurs humains &amp; repli éprouvé (BSIF / AI Act)</text>
  </g>
  <g id="takeaway-box">
    <rect x="20" y="782" width="1160" height="68" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
    <text x="36" y="804" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
    <text x="36" y="824" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Les gains de la première année masquent l'érosion lente des compétences : sans quotas formateurs ni exercices sans agent, le repli</text>
    <text x="36" y="841" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">manuel cède quand survient la crise.</text>
  </g>
</svg>
