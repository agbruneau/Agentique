    <text x="36" y="776" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Un groupe financier diversifié mutualise une seule fois son infrastructure technique, mais cloisonne hermétiquement données</text>
    <text x="36" y="792" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">clients et plafonds par filiale.</text>
