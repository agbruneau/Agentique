    <text x="36" y="820" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
    <text x="36" y="840" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Désambiguïser dès le Liminaire et le Chapitre 05 les sept lettres homonymes élimine les erreurs d'interprétation entre échelles de</text>
    <text x="36" y="857" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">risque, couches et critères G0.</text>
