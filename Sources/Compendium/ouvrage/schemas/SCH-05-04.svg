      <text x="366" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">• D01–D12 : 12 domaines</text>
      <text x="366" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">  MindMap (Parties I à XII)</text>
