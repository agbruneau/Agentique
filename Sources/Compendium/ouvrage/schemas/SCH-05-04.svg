      <text x="109" y="167" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">N &amp; L</text>
      <text x="109" y="184" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#F8FAFC">Autonomie vs Maturité</text>
      <text x="40" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">• N0–N4 / L0–L4 : autonomie</text>
      <text x="40" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">  configurée (CH-05, DISC-01)</text>
