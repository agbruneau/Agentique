      <text x="1018" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">  vs critère C04 en C01–C40</text>
      <text x="1018" y="334" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">• C26/C27 : OBO &amp; PQC</text>
