      <text x="692" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">  financiers durcis (CH-28)</text>
      <text x="692" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">  (Banque, Patrim., Assur.)</text>
      <text x="692" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">• M1–M5 : niveaux modèle</text>
      <text x="692" y="294" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">  de maturité AAGMM (CH-30)</text>
      <text x="692" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">• Ne jamais permuter le</text>
      <text x="692" y="334" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">  trait d'union normatif</text>
