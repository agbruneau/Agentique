      <text x="44" y="563" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#0F2942">Règle d'hygiène DISC-01 à DISC-04 : aucune abréviation nue (C, P, N, M, D, E) sans préfixe ou chapitre propriétaire</text>
      <text x="44" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.4" fill="#1E293B">Tout code Rego, schéma JSON et contrat utilise exclusivement l'identifiant canonique tranché en concordance (Annexe C et CH-36).</text>
    </g>
