  <g id="flows-bar">
    <rect x="20" y="616" width="1160" height="118" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="658" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① N0–N4/L0–L4 gouvernent l'autonomie d'exécution (CH-05), distincts</text>
    <text x="34" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">de N1–N5 et M1–M5 de maturité.</text>
    <text x="610" y="658" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② Les paliers d'outils P0–P3 (CH-05) restent strictement séparés des</text>
    <text x="610" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">paliers DAPP P1–P3 et disjoncteurs 1–4.</text>
    <text x="34" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ La lettre C recouvre sept usages distincts allant de C1–C5 (pivot)</text>
    <text x="34" y="716" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">à C01–C40 (G0) et C.1–C.8 (contrats CI).</text>
    <text x="610" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ La table DISC-01..05 tranche mécaniquement ces homonymies dans la</text>
    <text x="610" y="716" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">trousse exécutable.</text>
  </g>
