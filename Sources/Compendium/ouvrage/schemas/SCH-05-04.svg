      <text x="40" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">• N1–N5 : maturité (CH-06)</text>
      <text x="40" y="294" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">• L0–L3 : graduation T1</text>
      <text x="40" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F2942">• NX (Classe 6) : INTERDIT</text>
    </g>
