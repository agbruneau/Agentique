    <text x="34" y="634" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="654" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① Les paliers 1 à 4 proportionnent l'arrêt de la tâche isolée (1)</text>
    <text x="34" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">jusqu'au domaine complet (4).</text>
    <text x="610" y="654" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② L'automate gère cinq états complets, séparant la sonde HALF_OPEN</text>
    <text x="610" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">du mode DEGRADED (&lt; 60 s) et de FORCED_OPEN (&lt; 10 s).</text>
    <text x="34" y="696" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ La coupure locale PEP (&lt; 10 s cible, 0,050 ms mesuré C1) précède</text>
    <text x="34" y="712" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">la diffusion fédérée SSF/CAEP (≤ 15 min).</text>
    <text x="610" y="696" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ L'arrêt de la voie avant ne coupe jamais le canal de compensation</text>
    <text x="610" y="712" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">Saga EXIG-ORC-28 afin d'éviter les écritures orphelines.</text>
  </g>
