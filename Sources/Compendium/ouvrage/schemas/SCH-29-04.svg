    <text x="610" y="657" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② En vie, la délégation OBO, le filtrage RLS/ACL et les traces OTel</text>
    <text x="610" y="673" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">restent corrélés à travers C1–C8.</text>
