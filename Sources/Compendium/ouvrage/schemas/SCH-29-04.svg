    <text x="610" y="699" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ À la mort, la révocation SSF/CAEP ferme toutes les strates et</text>
    <text x="610" y="715" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">scelle l'historique immuable en WORM.</text>
