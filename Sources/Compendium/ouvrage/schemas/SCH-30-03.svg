    <line x1="788" y1="327" x2="802" y2="327" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g id="node-2" class="node" data-node="true">
      <rect x="426" y="152" width="346" height="165" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
      <text x="438" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E3A8A">M3 Défini (~18 m cible globale)</text>
      <text x="438" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">IAP · NHI · façades MCP sur ERP/CRM/ITSM</text>
      <text x="438" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Banc EvalOps &amp; Strangler Fig (API / BPMN)</text>
    </g>
  </g>
  <g id="zone-Z3">
    <rect x="804" y="104" width="374" height="446" rx="10" fill="#F8FAFC" stroke="#047857" stroke-width="1.8"/>
    <rect x="804" y="104" width="374" height="38" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
