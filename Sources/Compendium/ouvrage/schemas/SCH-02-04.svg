      <text x="44" y="523" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#064E3B">Seuil production : pass^5 ≥ 0,95 (≥ 0,99 SLM)</text>
      <text x="44" y="542" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Impose p unitaire ≥ 99,0 %–99,8 % sur banc hermétique</text>
      <text x="44" y="558" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">pour tenir 5 exécutions consécutives conformes.</text>
    </g>
