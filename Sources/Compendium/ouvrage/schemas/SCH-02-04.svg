    <text x="430" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#134E4A">Z2 · Frontière de Pareto HAL (21 730 runs)</text>
    <g id="node-3" class="node" data-node="true">
