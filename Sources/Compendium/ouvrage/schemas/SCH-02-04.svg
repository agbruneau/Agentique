    <text x="437" y="744" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Cible constance pass^k, Pareto optimal &amp; Wilson n=300</text>
    <rect x="788" y="731" width="18" height="18" rx="4" fill="#B91C1C" stroke="#B91C1C" stroke-width="2"/>
    <text x="814" y="744" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Effondrement pass^k, zone dominée 10× &amp; biais Wald</text>
  </g>
  <g id="takeaway-box">
    <rect x="20" y="772" width="1160" height="68" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
    <text x="36" y="794" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
    <text x="36" y="814" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Un essai réussi sur k ne prouve pas un agent fiable : la porte CI exige constance pass^k, efficience sur la frontière HAL et 300</text>
    <text x="36" y="831" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">scénarios distincts sous borne de Wilson.</text>
  </g>
