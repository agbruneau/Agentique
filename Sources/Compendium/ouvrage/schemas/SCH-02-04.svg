    <text x="818" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#312E81">Z3 · Dimensionnement statistique Wilson 95 %</text>
    <g id="node-5" class="node" data-node="true">
      <rect x="818" y="144" width="348" height="100" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8" stroke-dasharray="6,4"/>
      <text x="830" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#7F1D1D">① Intervalle de Wald à 0 échec : 0,00 %</text>
      <text x="830" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" fill="#1E293B">Défaut mathématique à f = 0 : donne une</text>
      <text x="830" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" fill="#1E293B">marge d'erreur nulle fallacieuse (proscrit).</text>
    </g>
    <g id="node-6" class="node" data-node="true">
      <rect x="818" y="256" width="348" height="114" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.8"/>
      <text x="830" y="277" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#064E3B">② Wilson unilatéral 95 % (z = 1,644854)</text>
      <text x="830" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" fill="#1E293B">n ≥ ⌈3 / p⌉ : pour p = 1 % → n = 300 distincts.</text>
      <text x="830" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" fill="#1E293B">Borne obtenue : 0,8938 % &lt; 1 % (conforme G0).</text>
    </g>
    <g id="node-7" class="node" data-node="true">
      <rect x="818" y="382" width="348" height="106" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
      <text x="830" y="403" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#78350F">③ Wilson bilatéral (z = 1,96)</text>
      <text x="830" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" fill="#1E293B">À n = 300 et 0 échec : 1,2643 % &gt; 1 %.</text>
      <text x="830" y="438" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" fill="#1E293B">Exige ~381 scénarios pour passer sous 1 %.</text>
    </g>
    <g id="node-8" class="node" data-node="true">
      <rect x="818" y="500" width="348" height="66" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
      <text x="830" y="521" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F2942">CI E2 (50–100 × k=5) ≠ 300 cas distincts</text>
      <text x="830" y="540" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.1" fill="#1E293B">k répétitions vérifient pass^k ; l'homologation</text>
      <text x="830" y="556" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.1" fill="#1E293B">p ≤ 1 % exige 300 scénarios indépendants distincts.</text>
    </g>
  </g>
  <g id="flows-bar">
    <rect x="20" y="590" width="1160" height="118" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="612" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="632" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① pass@k mesure un succès ponctuel optimiste, alors que pass^k = p^k</text>
    <text x="34" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">traduit la fiabilité exigée en production.</text>
    <text x="610" y="632" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② La frontière de Pareto HAL exclut les configurations 10× plus</text>
    <text x="610" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">onéreuses qui n'augmentent pas la précision.</text>
    <text x="34" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ L'estimation de Wald s'effondre à zéro échec ; seule la borne de</text>
    <text x="34" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">Wilson unilatérale n ≥ ⌈3/p⌉ reste conservatrice.</text>
    <text x="610" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ Démontrer un taux d'échec &lt; 1 % impose 300 scénarios indépendants</text>
    <text x="610" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">distincts sans répétition artificielle.</text>
  </g>
