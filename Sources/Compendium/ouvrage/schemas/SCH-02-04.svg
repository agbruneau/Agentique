      <text x="580" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">Frontière de Pareto HAL</text>
      <rect x="665" y="242" width="90" height="115" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5,3"/>
      <circle cx="695" cy="275" r="5" fill="#B91C1C"/>
