      <text x="440" y="523" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#78350F">Rejet des classements contaminés</text>
      <text x="440" y="542" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Seuls 2/9 bancs avaient un harnais uniforme ;</text>
      <text x="440" y="558" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">exiger un banc hermétique interne vérifié.</text>
