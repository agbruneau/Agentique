      <text x="635" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">C.3 Carte A2A · C.4 CloudEvents</text>
    </g>
    <g id="node-4" class="node" data-node="true">
      <rect x="623" y="329" width="543" height="165" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
      <text x="635" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#4C1D95">C.5..C.8 · Mandat, budget &amp; audit JCS</text>
      <text x="635" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">C.5 OBO · C.6 CIBA · C.7 Budget ·</text>
      <text x="635" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">C.8 Audit RFC 8785 (ES256 &amp; ML-DSA-65/87)</text>
    </g>
  </g>
  <g id="flows-bar">
    <rect x="20" y="562" width="1160" height="108" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① Exécuter FEDS et EMA (seed=20261119) sous étiquette explicite DC-P12</text>
    <text x="34" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">(C07 = 65,0 %).</text>
    <text x="610" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② Injecter les seuils calibrés (&lt; 10 s, 45 j, pass^5) dans le banc EvalOps</text>
    <text x="610" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">hermétique.</text>
    <text x="34" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ Valider en CI les contrats C.1–C.8 (JSON Schema 2020-12) avec chaînage</text>
    <text x="34" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">C.8.</text>
    <text x="610" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ Préparer le passage sans coupure d'ES256 vers ML-DSA-65/87 sur les mêmes</text>
    <text x="610" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">contrats.</text>
  </g>
  <g id="legend-bar">
    <rect x="20" y="680" width="1160" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="34" y="692" width="18" height="18" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="60" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Simulation bornée DC-P12 (65,0 %, sans essai humain)</text>
    <rect x="411" y="692" width="18" height="18" rx="4" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
    <text x="437" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">8 contrats C.1–C.8 vérifiés en CI (crypto-agilité PQC)</text>
    <rect x="788" y="692" width="18" height="18" rx="4" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="814" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Injection des seuils dans le banc EvalOps</text>
