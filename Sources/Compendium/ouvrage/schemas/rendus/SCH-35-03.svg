    <text x="34" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#78350F">Z1 · Banc quantitatif feds-ema/ (DC-P12 = 65,0 %)</text>
    <line x1="593" y1="327" x2="607" y2="327" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g id="node-1" class="node" data-node="true">
      <rect x="34" y="152" width="543" height="165" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="46" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#78350F">4 000 tirages FEDS &amp; 3 000 LHS EMA</text>
      <text x="46" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">POR-003 &lt; 10 s (99,95 %), ≤ 10–12 outils,</text>
      <text x="46" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">CIBA &lt; 60 s, 45 j, pass^5 99 % vs 95 %</text>
    </g>
    <g id="node-2" class="node" data-node="true">
      <rect x="34" y="329" width="543" height="165" rx="8" fill="#F3F4F6" stroke="#64748B" stroke-width="2"/>
      <text x="46" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E293B">Plafond épistémique C07 = 65,0 %</text>
      <text x="46" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Graine figée (seed=20261119)</text>
      <text x="46" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">0 essai humain ni SoR réel (49,59..95,78)</text>
    </g>
  </g>
  <g id="zone-Z2">
