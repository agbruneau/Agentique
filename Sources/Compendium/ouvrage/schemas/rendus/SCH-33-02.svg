<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect id="bg-canvas" x="0" y="0" width="1200" height="820" fill="#FFFFFF"/>
  <g id="header-bar">
    <rect x="20" y="16" width="1160" height="74" rx="10" fill="#0F2942"/>
    <text x="38" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">SCH-33-02 — Écrans différentiels, CIBA et cas témoins contre la validation réflexe</text>
    <text x="38" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">Conformité ergonomie ↔ Loi 25 art. 12.1 et EU AI Act art. 14 (anti-ASI09) · Systèmes d'entreprise (fr-CA)</text>
  </g>
  <g id="zone-Z1">
    <rect x="20" y="104" width="571" height="446" rx="10" fill="#F8FAFC" stroke="#B91C1C" stroke-width="1.8"/>
    <rect x="20" y="104" width="571" height="38" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="34" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7F1D1D">Z1 · AVANT : Supervision décorative (risque 12.1)</text>
    <line x1="593" y1="327" x2="607" y2="327" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g id="node-1" class="node" data-node="true">
      <rect x="34" y="152" width="543" height="165" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
      <text x="46" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7F1D1D">Synthèse fluide sans pièces brutes</text>
      <text x="46" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">~10 % explications erronées plausibles</text>
      <text x="46" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Validation machinale sous cadence (ASI09)</text>
    </g>
    <g id="node-2" class="node" data-node="true">
      <rect x="34" y="329" width="543" height="165" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="46" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#78350F">Requalification « exclusivement auto. »</text>
      <text x="46" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Loi 25 art. 12.1 : jusqu'à 10 M CAD (2 %)</text>
      <text x="46" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">ou 25 M CAD (4 %) · violation art. 14 UE</text>
    </g>
  </g>
  <g id="zone-Z2">
    <rect x="609" y="104" width="571" height="446" rx="10" fill="#F8FAFC" stroke="#047857" stroke-width="1.8"/>
    <rect x="609" y="104" width="571" height="38" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
    <text x="623" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#064E3B">Z2 · APRÈS : Verrous ergonomiques &amp; CIBA</text>
    <g id="node-3" class="node" data-node="true">
      <rect x="623" y="152" width="543" height="165" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
      <text x="635" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#064E3B">Masquage préalable &amp; vue différentielle</text>
      <text x="635" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Avis de l'agent masqué jusqu'à ouverture</text>
      <text x="635" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">des pièces primaires hors modèle</text>
    </g>
    <g id="node-4" class="node" data-node="true">
      <rect x="623" y="329" width="543" height="165" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="635" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#78350F">Cas témoins &amp; visa CIBA (EXIG-AUT-19)</text>
      <text x="635" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Injection aveugle pièges (PRR G-11/G-12)</text>
      <text x="635" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Signature CIBA liée · gel si taux chute</text>
    </g>
  </g>
  <g id="flows-bar">
    <rect x="20" y="562" width="1160" height="108" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① Masquer la recommandation tant que le valideur n'a pas ouvert les pièces</text>
    <text x="34" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">sources.</text>
    <text x="610" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② Injecter silencieusement des cas témoins comportant une erreur subtile</text>
    <text x="610" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">(G-11/G-12).</text>
    <text x="34" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ Sceller toute décision pivot par visa CIBA lié à l'empreinte d'action</text>
    <text x="34" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">(EXIG-AUT-19).</text>
    <text x="610" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ Suspendre le régime allégé si le taux d'infirmation effectif chute sous</text>
    <text x="610" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">le seuil.</text>
  </g>
  <g id="legend-bar">
    <rect x="20" y="680" width="1160" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="34" y="692" width="18" height="18" rx="4" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="60" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Approbation réflexe (ASI09) &amp; sanctions Loi 25 / UE</text>
    <rect x="411" y="692" width="18" height="18" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="437" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Masquage préalable, pièces brutes &amp; visa CIBA</text>
    <rect x="788" y="692" width="18" height="18" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="814" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Cas témoins aveugles &amp; mesure d'infirmation</text>
  </g>
  <g id="takeaway-box">
    <rect x="20" y="734" width="1160" height="68" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
    <text x="36" y="756" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
    <text x="36" y="776" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Une approbation sans examen critique des pièces sources ne vaut pas contrôle opposable : masquage initial et cas témoins protègent</text>
    <text x="36" y="792" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">la conformité Loi 25.</text>
  </g>
</svg>
