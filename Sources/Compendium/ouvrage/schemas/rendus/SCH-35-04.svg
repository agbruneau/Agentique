    <text x="34" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E3A8A">Z1 · Admission et contexte fédéré — Scénario : agt-achats-indirects@1.2.0 (12 480 $ CAD · plafond L3)</text>
    <g id="node-1" class="node" data-node="true">
