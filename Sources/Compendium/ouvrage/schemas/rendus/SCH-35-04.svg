      <text x="736" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Événement typé AsyncAPI 3.0</text>
      <text x="736" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">avec W3C Trace Context</text>
      <text x="736" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">(Exécuté en CI).</text>
