  <g id="zone-Z2">
    <rect x="20" y="276" width="1160" height="152" rx="10" fill="#F8FAFC" stroke="#D97706" stroke-width="1.8"/>
    <rect x="20" y="276" width="1160" height="34" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="34" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#78350F">Z2 · Porte de matérialité &gt; 5 000 $ et double approbation hors bande C.6 (ciba_approval.py)</text>
    <g id="node-6" class="node" data-node="true">
      <rect x="34" y="322" width="260" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
      <text x="46" y="343" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#78350F">Calcul déterministe passerelle</text>
      <text x="46" y="362" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">12 480 $ &gt; seuil 5 000 $ :</text>
      <text x="46" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">la passerelle calcule h =</text>
      <text x="46" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">action_sha256 (JCS RFC 8785).</text>
    </g>
    <g id="node-7" class="node" data-node="true">
      <rect x="324" y="322" width="412" height="92" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
      <text x="336" y="343" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#7F1D1D">C.6 · Double signature CIBA hors bande</text>
      <text x="336" y="362" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Exige deux approbations distinctes scellées sur le même h :</text>
      <text x="336" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Visa 1 : apb-5e19c2   • Visa 2 : apb-91d4e8</text>
      <text x="336" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Typage jeton distinct de at+jwt (zéro substitution d'accès).</text>
    </g>
    <g id="node-8" class="node" data-node="true">
      <rect x="766" y="322" width="400" height="92" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
      <text x="778" y="343" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#0F2942">Rejet mécanique anti-falsification</text>
      <text x="778" y="362" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Rejette immédiatement tout écart d'argument,</text>
      <text x="778" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">d'ordre I-JSON ou d'empreinte h entre l'affichage</text>
      <text x="778" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">humain et l'appel MCP final.</text>
    </g>
