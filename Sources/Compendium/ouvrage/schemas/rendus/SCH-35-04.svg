      <text x="966" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">sans secret statique</text>
      <text x="966" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">(obo_dpop.py en G0).</text>
