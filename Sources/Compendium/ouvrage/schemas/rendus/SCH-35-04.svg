      <text x="506" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">AgentCard validée JWS ES256</text>
      <text x="506" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">contre trousseau épinglé</text>
      <text x="506" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">(Exécuté en CI).</text>
