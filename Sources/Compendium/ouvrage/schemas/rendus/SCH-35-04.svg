      <text x="276" y="165" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#1E3A8A">C.1 · Outil MCP 2026-07-28</text>
      <text x="276" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Schéma JSON Draft 2020-12</text>
      <text x="276" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">strict + épinglage digest</text>
      <text x="276" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">(Exécuté en CI).</text>
    </g>
