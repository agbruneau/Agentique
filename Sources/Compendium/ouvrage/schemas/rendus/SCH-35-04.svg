    <text x="38" y="68" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#CBD5E1">Concrétisation CI/CD de l'Annexe C du Tome 2 · modules G0 obo_dpop.py &amp; ciba_approval.py · adaptation T2 Fig. 23 · Systèmes d'agentivité (fr-CA)</text>
  </g>
  <g id="zone-Z1">
