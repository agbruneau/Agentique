      <text x="46" y="526" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" fill="#1E293B">Décrémentation exacte en arithmétique Decimal (zéro float) sur les 5 dimensions</text>
      <text x="46" y="542" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" fill="#1E293B">EXIG-ORC-26 : étapes, outils, jetons, coût et durée (12 480 $ imputés).</text>
    </g>
    <g id="node-10" class="node" data-node="true">
      <rect x="614" y="486" width="552" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.8"/>
      <text x="626" y="507" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#064E3B">C.8 · Enregistrement d'audit à cinq éléments (Crypto-agilité PQC)</text>
      <text x="626" y="526" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" fill="#1E293B">Journal chaîné sous schémas JSON Draft 2020-12 acceptant sans rupture</text>
      <text x="626" y="542" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" fill="#1E293B">ES256 (actuel), ML-DSA-65 et ML-DSA-87 (FIPS 204 post-quantique).</text>
    </g>
