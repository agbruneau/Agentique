      <text x="46" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">empreinte SHA-256 vérifiée</text>
      <text x="46" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">en CI (Exécuté en CI).</text>
