    <text x="36" y="822" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Les huit contrats C.1–C.8 prouvent qu'un même achat de 12 480 $ traverse identité, double validation cryptographique, budget exact</text>
    <text x="36" y="839" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">et audit post-quantique sans friction.</text>
