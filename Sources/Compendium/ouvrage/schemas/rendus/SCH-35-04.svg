  </g>
  <g id="flows-bar">
    <rect x="20" y="598" width="1160" height="118" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① Les contrats C.1 à C.5 valident l'outil MCP, l'entrée de</text>
    <text x="34" y="656" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">catalogue, la carte A2A, l'événement CloudEvents et le mandat OBO.</text>
    <text x="610" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② Pour 12 480 $ (&gt; 5 000 $), la passerelle calcule h (JCS) et exige</text>
    <text x="610" y="656" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">deux approbations C.6 distinctes (apb-5e19c2, apb-91d4e8).</text>
    <text x="34" y="682" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ C.7 décrémente l'enveloppe budgétaire exacte en arithmétique</text>
    <text x="34" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">Decimal EXIG-ORC-26 avant toute exécution.</text>
    <text x="610" y="682" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ C.8 grave l'enregistrement immuable sous schéma crypto-agile prêt</text>
    <text x="610" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">pour ML-DSA-65/87 (2030–2035).</text>
  </g>
