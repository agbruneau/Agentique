<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<rect id="bg-canvas" x="0" y="0" width="1200" height="860" fill="#FFFFFF"/>
<rect id="header-bg" x="0" y="0" width="1200" height="104" fill="#0F2942"/>
<rect x="28" y="14" width="110" height="24" rx="5" fill="#1D4ED8"/><text x="83" y="31" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">SCH-01-02</text>
<rect x="148" y="14" width="330" height="24" rx="5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1"/><text x="313" y="31" text-anchor="middle" font-size="12" fill="#E2E8F0">Matrice visuelle de risques et garde-fous</text>
<text x="1172" y="31" text-anchor="end" font-size="11" fill="#93C5FD">Systèmes d'agentivité · fr-CA</text>
<text x="28" y="62" font-size="18" font-weight="bold" fill="#FFFFFF">Mirage de l'« agent washing » face à la réalité terrain MAP 2027 et passage</text>
<text x="28" y="86" font-size="18" font-weight="bold" fill="#FFFFFF">aux engagements observables</text>
<g id="zone-Z1" class="zone">
  <rect x="28" y="122" width="1144" height="136" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="28" y="122" width="8" height="136" rx="4" fill="#B45309"/>
  <text x="46" y="144" font-size="13.5" font-weight="bold" fill="#B45309">Z1 — Discours déclaratif face à la réalité statistique de 2026–2027</text>
  <g id="node-1" class="node" data-node="true">
    <rect x="42.0" y="160" width="362.7" height="86" rx="8" fill="#FFF5E0" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="53.0" y="182" font-size="13" font-weight="bold" fill="#451A03">Sondages d'usage général</text>
    <line x1="53.0" y1="194" x2="393.7" y2="194" stroke="#D97706" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="208" font-size="11.8" fill="#1E293B">StatCan : 19,2 % (40,4 % finance) · BdC : 8 %</text>
    <text x="53.0" y="224" font-size="11.8" fill="#1E293B">Deloitte 12 % ROI · veille : 40 % / 95 %</text>
  </g>
  <g id="node-2" class="node" data-node="true">
    <rect x="418.7" y="160" width="362.7" height="86" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="2"/>
    <text x="429.7" y="182" font-size="13" font-weight="bold" fill="#0F2942">Étude terrain MAP (306 rép.)</text>
    <line x1="429.7" y1="194" x2="770.3" y2="194" stroke="#1B4F72" stroke-opacity="0.35" stroke-width="1"/>
    <text x="429.7" y="208" font-size="11.8" fill="#1E293B">68 % ≤ 10 étapes · 16/20 flux fixes</text>
    <text x="429.7" y="224" font-size="11.8" fill="#1E293B">74 % sous revue humaine · &gt; 40 % d'annulations</text>
  </g>
  <g id="node-3" class="node" data-node="true">
    <rect x="795.3" y="160" width="362.7" height="86" rx="8" fill="#FFF5E0" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="806.3" y="182" font-size="13" font-weight="bold" fill="#451A03">Pressions d'échelle (veille)</text>
    <line x1="806.3" y1="194" x2="1147.0" y2="194" stroke="#D97706" stroke-opacity="0.35" stroke-width="1"/>
    <text x="806.3" y="208" font-size="11.8" fill="#1E293B">Ratio NHI 82:1 · OWASP ASI03/ASI08</text>
    <text x="806.3" y="224" font-size="11.8" fill="#1E293B">Énergie AIE : 415 → 945 TWh (2030)</text>
  </g>
</g>
<g id="zone-Z2" class="zone">
  <rect x="28" y="272" width="1144" height="136" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="28" y="272" width="8" height="136" rx="4" fill="#1B4F72"/>
  <text x="46" y="294" font-size="13.5" font-weight="bold" fill="#1B4F72">Z2 — Règle « soutien n'est pas production » et cas réels vérifiés</text>
  <g id="node-4" class="node" data-node="true">
    <rect x="42.0" y="310" width="551.0" height="86" rx="8" fill="#FFF5E0" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="53.0" y="332" font-size="13" font-weight="bold" fill="#451A03">Productivité interne (soutien)</text>
    <line x1="53.0" y1="344" x2="582.0" y2="344" stroke="#D97706" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="358" font-size="11.8" fill="#1E293B">Assistance rédactionnelle ou recherche</text>
    <text x="53.0" y="374" font-size="11.8" fill="#1E293B">Ne prouve pas la fiabilité transactionnelle</text>
  </g>
  <g id="node-5" class="node" data-node="true">
    <rect x="607.0" y="310" width="551.0" height="86" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="2"/>
    <text x="618.0" y="332" font-size="13" font-weight="bold" fill="#0F2942">Système transactionnel arbitré</text>
    <line x1="618.0" y1="344" x2="1147.0" y2="344" stroke="#1B4F72" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="358" font-size="11.8" fill="#1E293B">Cas Nubank KDD 2026 : 5 agents ReAct</text>
    <text x="618.0" y="374" font-size="11.8" fill="#1E293B">Sur graphes déterministes, sans MCP ni A2A</text>
  </g>
</g>
<g id="zone-Z3" class="zone">
  <rect x="28" y="422" width="1144" height="136" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <rect x="28" y="422" width="8" height="136" rx="4" fill="#047857"/>
  <text x="46" y="444" font-size="13.5" font-weight="bold" fill="#047857">Z3 — Passage des données figées aux engagements sociaux observables</text>
  <g id="node-6" class="node" data-node="true">
    <rect x="42.0" y="460" width="551.0" height="86" rx="8" fill="#FFF5E0" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="53.0" y="482" font-size="13" font-weight="bold" fill="#451A03">Rejet du mentalisme FIPA-ACL</text>
    <line x1="53.0" y1="494" x2="582.0" y2="494" stroke="#D97706" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="508" font-size="11.8" fill="#1E293B">Préconditions internes invérifiables</text>
    <text x="53.0" y="524" font-size="11.8" fill="#1E293B">Abandon des structures purement statiques</text>
  </g>
  <g id="node-7" class="node" data-node="true">
    <rect x="607.0" y="460" width="551.0" height="86" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="618.0" y="482" font-size="13" font-weight="bold" fill="#064E3B">Contrats comportementaux probabilistes</text>
    <line x1="618.0" y1="494" x2="1147.0" y2="494" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="508" font-size="11.8" fill="#1E293B">Probabilité minimale &amp; tolérance d'écart</text>
    <text x="618.0" y="524" font-size="11.8" fill="#1E293B">Engagements sociaux auditables (exécution)</text>
  </g>
</g>
<g id="flows-box">
  <rect x="28" y="572" width="1144" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="594" font-size="12.5" font-weight="bold" fill="#0F2942">Flux d'exécution et de contrôle</text>
  <text x="42.0" y="612" font-size="11.5" fill="#334155">① Filtrer toute allégation d'éditeur au crible de la règle « soutien n'est pas</text>
  <text x="42.0" y="627" font-size="11.5" fill="#334155">production » et des ratios observés (NHI 82:1).</text>
  <text x="609.0" y="612" font-size="11.5" fill="#334155">② Encadrer par contrat comportemental probabiliste tout échange d'intentions</text>
  <text x="609.0" y="627" font-size="11.5" fill="#334155">sous-spécifiées entre deux acteurs.</text>
  <text x="42.0" y="650" font-size="11.5" fill="#334155">③ Substituer des engagements sociaux observables et auditables aux préconditions</text>
  <text x="42.0" y="665" font-size="11.5" fill="#334155">mentales invérifiables de FIPA-ACL.</text>
  <text x="609.0" y="650" font-size="11.5" fill="#334155">④ Exiger des essais répétés à l'exécution préalablement au classement d'un cas en</text>
  <text x="609.0" y="665" font-size="11.5" fill="#334155">production réelle.</text>
</g>
<g id="legend-box">
  <rect x="28" y="704" width="1144" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="42.0" y="715" width="14" height="14" rx="3" fill="#D97706"/>
  <text x="62.0" y="726" font-size="11" fill="#1E293B">Discours promotionnel et écart pilote-valeur (95 % sans</text>
  <text x="62.0" y="741" font-size="11" fill="#1E293B">ROI)</text>
  <rect x="418.7" y="715" width="14" height="14" rx="3" fill="#1B4F72"/>
  <text x="438.7" y="726" font-size="11" fill="#1E293B">Constat empirique MAP v4 et cas arbitrés bornés (≤ 10</text>
  <text x="438.7" y="741" font-size="11" fill="#1E293B">étapes)</text>
  <rect x="795.3" y="715" width="14" height="14" rx="3" fill="#047857"/>
  <text x="815.3" y="726" font-size="11" fill="#1E293B">Contrat comportemental probabiliste et engagement</text>
  <text x="815.3" y="741" font-size="11" fill="#1E293B">observable</text>
</g>
<g id="takeaway-box">
  <rect x="28" y="774" width="1144" height="68" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="28" y="774" width="6" height="68" rx="3" fill="#1B4F72"/>
  <text x="44" y="794" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
  <text x="44" y="812" font-size="11.5" fill="#1E293B">Soutien n'est pas production : sur l'horizon 2026–2027, la viabilité opérationnelle repose sur des parcours courts, prédéfinis et régis</text>
  <text x="44" y="828" font-size="11.5" fill="#1E293B">par des engagements observables, jamais sur une autonomie illimitée.</text>
</g>
</svg>
