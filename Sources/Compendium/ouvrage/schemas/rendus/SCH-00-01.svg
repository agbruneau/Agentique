    <line x1="429.7" y1="344" x2="770.3" y2="344" stroke="#1B4F72" stroke-opacity="0.35" stroke-width="1"/>
    <text x="429.7" y="358" font-size="11.8" fill="#1E293B">Masquage préalable des données sensibles</text>
    <text x="429.7" y="374" font-size="11.8" fill="#1E293B">Assemblage borné autorisé en amont</text>
