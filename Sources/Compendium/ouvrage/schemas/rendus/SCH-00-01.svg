    <text x="806.3" y="332" font-size="13" font-weight="bold" fill="#064E3B">Passerelle PEP &amp; porte AMBIGU_ESCALADE</text>
    <line x1="806.3" y1="344" x2="1147.0" y2="344" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="806.3" y="358" font-size="11.8" fill="#1E293B">Contrôle des paliers (≤ L2 ou visa humain)</text>
    <text x="806.3" y="374" font-size="11.8" fill="#1E293B">Abstention typée sur incertitude</text>
