    <line x1="618.0" y1="194" x2="1147.0" y2="194" stroke="#047857" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="208" font-size="11.8" fill="#1E293B">Autorité humaine explicite (H-31)</text>
