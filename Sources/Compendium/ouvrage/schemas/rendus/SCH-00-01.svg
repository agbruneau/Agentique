<g id="flows-box">
  <rect x="28" y="722" width="1144" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="744" font-size="12.5" font-weight="bold" fill="#0F2942">Flux d'exécution et de contrôle</text>
  <text x="42.0" y="762" font-size="11.5" fill="#334155">① L'usager ou un événement métier déclenche une requête normalisée vers le</text>
  <text x="42.0" y="777" font-size="11.5" fill="#334155">socle déterministe (SoE → continuum L0 &amp; noyau 80 %).</text>
  <text x="609.0" y="762" font-size="11.5" fill="#334155">② Le noyau déterministe caviarde les PII, assemble le contexte autorisé (ACL en</text>
  <text x="609.0" y="777" font-size="11.5" fill="#334155">amont) et sollicite le module cognitif (20 %) si requis.</text>
  <text x="42.0" y="800" font-size="11.5" fill="#334155">③ La proposition subit une vérification mécanique (règles L0, JSON Schema,</text>
  <text x="42.0" y="815" font-size="11.5" fill="#334155">Decimal) avec sortie typée AMBIGU_ESCALADE.</text>
  <text x="609.0" y="800" font-size="11.5" fill="#334155">④ Toute mutation vers les systèmes d'entreprise (ERP, CRM, SIRH, ITSM, OT)</text>
  <text x="609.0" y="815" font-size="11.5" fill="#334155">transite par PEP, MCP/A2A et ACL sous palier ≤ L2 ou visa humain.</text>
</g>
<g id="legend-box">
