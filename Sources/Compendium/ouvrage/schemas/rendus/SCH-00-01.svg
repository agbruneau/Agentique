    <text x="53.0" y="208" font-size="11.8" fill="#1E293B">Interfaces usagers et déclencheurs normalisés</text>
    <text x="53.0" y="224" font-size="11.8" fill="#1E293B">Réception de propositions structurées</text>
  </g>
  <g id="node-2" class="node" data-node="true">
