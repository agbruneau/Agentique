  <text x="46" y="594" font-size="13.5" font-weight="bold" fill="#1B4F72">Z4 — Interopérabilité protocolaire (MCP/A2A/ACL) &amp; systèmes d'entreprise (SoR / OT)</text>
  <g id="node-8" class="node" data-node="true">
    <rect x="42.0" y="610" width="551.0" height="86" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="2"/>
    <text x="53.0" y="632" font-size="13" font-weight="bold" fill="#0F2942">ERP, CRM, SIRH, ITSM, SCM &amp; core métier</text>
    <line x1="53.0" y1="644" x2="582.0" y2="644" stroke="#1B4F72" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="658" font-size="11.8" fill="#1E293B">Accès exclusif par façades d'intention MCP</text>
    <text x="53.0" y="674" font-size="11.8" fill="#1E293B">Exécution idempotente via PEP &amp; A2A</text>
  </g>
  <g id="node-9" class="node" data-node="true">
    <rect x="607.0" y="610" width="551.0" height="86" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="2"/>
    <text x="618.0" y="632" font-size="13" font-weight="bold" fill="#0F2942">Bases CoALA, patrimoine &amp; sas IT/OT</text>
    <line x1="618.0" y1="644" x2="1147.0" y2="644" stroke="#1B4F72" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="658" font-size="11.8" fill="#1E293B">Couches anti-corruption (ACL) &amp; CloudEvents</text>
    <text x="618.0" y="674" font-size="11.8" fill="#1E293B">Zéro requête SQL directe depuis l'agent</text>
  </g>
