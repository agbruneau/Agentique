    <text x="53.0" y="482" font-size="13" font-weight="bold" fill="#451A03">Classification &amp; synthèse</text>
    <line x1="53.0" y1="494" x2="582.0" y2="494" stroke="#D97706" stroke-opacity="0.35" stroke-width="1"/>
    <text x="53.0" y="508" font-size="11.8" fill="#1E293B">Composante probabiliste remplaçable</text>
    <text x="53.0" y="524" font-size="11.8" fill="#1E293B">Contrat de schéma strict en entrée/sortie</text>
  </g>
  <g id="node-7" class="node" data-node="true">
    <rect x="607.0" y="460" width="551.0" height="86" rx="8" fill="#FFF5E0" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="618.0" y="482" font-size="13" font-weight="bold" fill="#451A03">Planification proposée (sans écriture)</text>
    <line x1="618.0" y1="494" x2="1147.0" y2="494" stroke="#D97706" stroke-opacity="0.35" stroke-width="1"/>
    <text x="618.0" y="508" font-size="11.8" fill="#1E293B">Zéro accès direct aux écritures SoR</text>
    <text x="618.0" y="524" font-size="11.8" fill="#1E293B">Zéro secret statique dans le contexte</text>
  </g>
