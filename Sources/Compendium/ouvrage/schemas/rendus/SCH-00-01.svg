  <rect x="42.0" y="865" width="14" height="14" rx="3" fill="#1B4F72"/>
  <text x="62.0" y="876" font-size="11" fill="#1E293B">Noyau déterministe possédé (80 % : L0, harnais, PEP,</text>
  <text x="62.0" y="891" font-size="11" fill="#1E293B">systèmes d'entreprise SoR/OT)</text>
  <rect x="418.7" y="865" width="14" height="14" rx="3" fill="#D97706"/>
  <text x="438.7" y="876" font-size="11" fill="#1E293B">Module cognitif probabiliste substituable (20 % :</text>
  <text x="438.7" y="891" font-size="11" fill="#1E293B">LLM/SLM)</text>
  <rect x="795.3" y="865" width="14" height="14" rx="3" fill="#047857"/>
  <text x="815.3" y="876" font-size="11" fill="#1E293B">Porte humaine et interopérabilité gouvernée (HITL,</text>
  <text x="815.3" y="891" font-size="11" fill="#1E293B">MCP/A2A, AMBIGU_ESCALADE)</text>
</g>
<g id="takeaway-box">
  <rect x="28" y="924" width="1144" height="68" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="28" y="924" width="6" height="68" rx="3" fill="#1B4F72"/>
  <text x="44" y="944" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
  <text x="44" y="962" font-size="11.5" fill="#1E293B">Le triptyque directeur conjugue l'interopérabilité contractuelle (MCP, A2A, CloudEvents), l'automatisation déterministe possédée</text>
  <text x="44" y="978" font-size="11.5" fill="#1E293B">(80 %, palier L0) encadrant l'agentique (20 %), et la protection intégrale des systèmes d'entreprise sans dépendance fournisseur.</text>
