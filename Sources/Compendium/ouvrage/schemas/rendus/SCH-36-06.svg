  <rect id="bg-canvas" x="0" y="0" width="1200" height="924" fill="#FFFFFF"/>
  <g id="header-bar">
    <rect x="20" y="16" width="1160" height="72" rx="10" fill="#0F2942"/>
    <text x="38" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17.5" font-weight="bold" fill="#FFFFFF">SCH-36-06 — Pierre de Rosette des cinq découpages en couches et trois rectifications DIV-02</text>
    <text x="38" y="68" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#CBD5E1">Correspondance bijective Tome 1 / CAD26 / Tome 5 / DISC-03 / CH-29 · Adaptation T1 Fig. 43.1, T3 Fig. 36, T4 Fig. 2 · Systèmes d'entreprise (fr-CA)</text>
  </g>
  <g id="zone-Z1">
    <rect x="20" y="98" width="1160" height="392" rx="10" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="1.8"/>
    <rect x="20" y="98" width="1160" height="34" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="34" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E3A8A">Z1 · Pierre de Rosette alignant les cinq découpages architecturaux du corpus (DIV-02 &amp; DISC-03)</text>
    <rect x="34" y="142" width="212" height="28" rx="6" fill="#1B4F72"/>
    <text x="140" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" font-weight="bold" fill="#FFFFFF">① Pivot T5 (C1–C5 + Plans)</text>
    <rect x="264" y="142" width="212" height="28" rx="6" fill="#1D4ED8"/>
    <text x="370" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" font-weight="bold" fill="#FFFFFF">② CAD26 (6 Couches + Plans)</text>
    <rect x="494" y="142" width="212" height="28" rx="6" fill="#0F766E"/>
    <text x="600" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" font-weight="bold" fill="#FFFFFF">③ Tome 1 (Tableau 43.1)</text>
    <rect x="724" y="142" width="212" height="28" rx="6" fill="#4338CA"/>
    <text x="830" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" font-weight="bold" fill="#FFFFFF">④ DISC-03 (T6 Plans ↔ T8)</text>
    <rect x="954" y="142" width="212" height="28" rx="6" fill="#B45309"/>
    <text x="1060" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" font-weight="bold" fill="#FFFFFF">⑤ CH-29 (Strates C1–C8)</text>
    <g id="node-1" class="node" data-node="true">
      <rect x="34" y="178" width="212" height="294" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
      <text x="46" y="199" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F2942">Strates &amp; Correspondances</text>
      <text x="46" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C1 Interaction (CAP-001..006)</text>
      <text x="46" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C2 Orchestration (007..014)</text>
      <text x="46" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C3 Contexte (015..021)</text>
      <text x="46" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C4 Accès / SoR (022..028)</text>
      <text x="46" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C5 Modèles (029..034)</text>
      <text x="46" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Plan A Sécurité (035..041)</text>
      <text x="46" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Plan B Obs./FinOps (042..046)</text>
      <text x="46" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Plan C Gouv. (047..052)</text>
    </g>
    <line x1="246" y1="325" x2="262" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <g id="node-2" class="node" data-node="true">
      <rect x="264" y="178" width="212" height="294" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
      <text x="276" y="199" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F2942">Strates &amp; Correspondances</text>
      <text x="276" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Couche 1 Canaux (0 logique IA)</text>
      <text x="276" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Couche 2 Orchestration &amp; mém. W</text>
      <text x="276" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Couche 3 Agents, Modèles,</text>
      <text x="276" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">  Sandbox &amp; mém. procédurale</text>
      <text x="276" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Couche 4 Médiation MCP / A2A</text>
      <text x="276" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Couche 5 Outils, RAG &amp; Données</text>
      <text x="276" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Couche 6 SoR (capsules ACL)</text>
      <text x="276" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Plans A, B, C transversaux</text>
    </g>
    <line x1="476" y1="325" x2="492" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <g id="node-3" class="node" data-node="true">
      <rect x="494" y="178" width="212" height="294" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.8"/>
      <text x="506" y="199" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F2942">Strates &amp; Correspondances</text>
      <text x="506" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Fusionne Vol. II (4 couches)</text>
      <text x="506" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">  et Vol. III (3 couches) en</text>
      <text x="506" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">  6 strates unifiées.</text>
      <text x="506" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Aligne C1..C6 avec CAD26.</text>
      <text x="506" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Réconcilie les échelles d'auto-</text>
      <text x="506" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">  nomie au Tableau 43.3.</text>
      <text x="506" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Trace les homonymes §37.0.</text>
    </g>
    <line x1="706" y1="325" x2="722" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <g id="node-4" class="node" data-node="true">
      <rect x="724" y="178" width="212" height="294" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.8"/>
      <text x="736" y="199" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F2942">Strates &amp; Correspondances</text>
      <text x="736" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Plan B ↔ evalops_prr (télémétrie,</text>
      <text x="736" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">  audit SCITT &amp; banc Wilson)</text>
      <text x="736" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Plan A ↔ policy_saga &amp;</text>
      <text x="736" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">  authz_pqc_audit (OPA / OBO)</text>
      <text x="736" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Plan C ↔ agent_registry &amp; état</text>
      <text x="736" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Plan D ↔ harness_proto</text>
      <text x="736" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Résout T6 vs T7 sans rupture.</text>
    </g>
    <line x1="936" y1="325" x2="952" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <g id="node-5" class="node" data-node="true">
      <rect x="954" y="178" width="212" height="294" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.8"/>
      <text x="966" y="199" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F2942">Strates &amp; Correspondances</text>
      <text x="966" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C1 Exposition · C2 Intégration</text>
      <text x="966" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C3 Messagerie · C4 Données</text>
      <text x="966" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C5 Exécution agentique</text>
      <text x="966" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C6 Gouvernance modèles</text>
      <text x="966" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C7 Observabilité agents</text>
      <text x="966" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• C8 Socle souverain (565 ex.)</text>
      <text x="966" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">• Exécute 5 SBB &amp; C01–C40.</text>
    </g>
  </g>
  <g id="zone-Z2">
    <rect x="20" y="500" width="1160" height="146" rx="10" fill="#F8FAFC" stroke="#B91C1C" stroke-width="1.8"/>
    <rect x="20" y="500" width="1160" height="34" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="34" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7F1D1D">Z2 · Trois rectifications factuelles vérifiées sur pièce lors de la fermeture de DIV-02 (vs Tome 4 Ann. E.1)</text>
    <g id="node-6" class="node" data-node="true">
      <rect x="34" y="544" width="272" height="88" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
      <text x="46" y="565" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#7F1D1D">Rectif. 1 · Modèles &amp; Sandbox</text>
      <text x="46" y="584" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Supposition T4 : Couche 6.</text>
      <text x="46" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Réel CAD26 : Couche 3 (C5 Modèles</text>
      <text x="46" y="616" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">et passerelles/bacs à sable).</text>
    </g>
    <g id="node-7" class="node" data-node="true">
      <rect x="320" y="544" width="286" height="88" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
      <text x="332" y="565" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#7F1D1D">Rectif. 2 · Connaissance C3 éclatée</text>
      <text x="332" y="584" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Nulle Couche 3 nommée « Connaissance ».</text>
      <text x="332" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">C3 se répartit en C2 (mém. travail),</text>
      <text x="332" y="616" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">C3 (procédurale) et C5 (données/RAG).</text>
    </g>
    <g id="node-8" class="node" data-node="true">
      <rect x="620" y="544" width="266" height="88" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
      <text x="632" y="565" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#7F1D1D">Rectif. 3 · SoR patrimoniaux</text>
      <text x="632" y="584" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Supposition T4 : Couche 5.</text>
      <text x="632" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">Réel CAD26 : Couche 6 sous</text>
      <text x="632" y="616" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">encapsulation ACL (domaine C4).</text>
    </g>
    <g id="node-9" class="node" data-node="true">
      <rect x="900" y="544" width="266" height="88" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.8"/>
      <text x="912" y="565" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#064E3B">5 CAP sans lien CAD26 direct</text>
      <text x="912" y="584" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">CAP-025 (CUA), 028 (OT 72h),</text>
      <text x="912" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">033 (TEE), 046 (B-15) &amp; 052</text>
      <text x="912" y="616" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.2" fill="#1E293B">(séparation tâches) isolées en DIV-02.</text>
    </g>
  </g>
  <g id="flows-bar">
    <rect x="20" y="658" width="1160" height="118" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="34" y="680" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Flux numérotés :</text>
    <text x="34" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① Les cinq découpages du corpus (C1–C5, CAD26, Tome 1, DISC-03 et</text>
    <text x="34" y="716" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">CH-29) se projettent terme à terme sans perte.</text>
    <text x="610" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② DIV-02 rectifie trois erreurs de localisation : Modèles en Couche</text>
    <text x="610" y="716" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">3, Connaissance sur C2/C3/C5, SoR en Couche 6.</text>
    <text x="34" y="742" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ DISC-03 relie directement les quatre plans SI (Tome 6) aux quatre</text>
    <text x="34" y="758" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">paquets Python/OPA exécutables du Tome 8.</text>
    <text x="610" y="742" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ Cinq capacités hors CAD26 directe (CAP-025, 028, 033, 046, 052)</text>
    <text x="610" y="758" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">restent isolées sans orphelinat normatif.</text>
  </g>
  <g id="legend-bar">
    <rect x="20" y="786" width="1160" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="34" y="799" width="18" height="18" rx="4" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="60" y="812" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Colonnes alignées des cinq découpages en couches</text>
    <rect x="411" y="799" width="18" height="18" rx="4" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
    <text x="437" y="812" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Trois rectifications vérifiées sur source DIV-02</text>
    <rect x="788" y="799" width="18" height="18" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <text x="814" y="812" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Cinq capacités additionnelles isolées</text>
  </g>
  <g id="takeaway-box">
    <rect x="20" y="840" width="1160" height="68" rx="8" fill="#EBF2F7" stroke="#1B4F72" stroke-width="1.8"/>
    <text x="36" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F2942">Synthèse doctrinale</text>
    <text x="36" y="882" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Aligner cinq découpages historiques et corriger l'assise des modèles (C3), de la connaissance (C2/C3/C5) et des SoR (C6) unifie</text>
    <text x="36" y="899" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">l'architecture de l'ouvrage.</text>
  </g>
</svg>
