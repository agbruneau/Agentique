    <text x="36" y="824" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Les modèles autorégressifs imitent la planification par motifs mémorisés : seule la critique externe déterministe (LLM-Modulo)</text>
    <text x="36" y="841" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">garantit la validité exécutable.</text>
