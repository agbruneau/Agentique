      <text x="622" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" fill="#1E293B">• Le modèle traduit la requête puis s'arrête sans contre-épreuve externe.</text>
      <text x="622" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" fill="#1E293B">• Aucune garantie face à une modélisation de domaine erronée ou obfusquée.</text>
    </g>
