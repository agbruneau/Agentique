      <text x="622" y="517" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.2" font-weight="bold" fill="#0F2942">Bénéfice vérifié : convergence sur domaines complexes (ex. TravelPlanner ×6)</text>
      <text x="622" y="536" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.4" fill="#1E293B">La souplesse linguistique du modèle reste bridée par la preuve déterministe du vérificateur :</text>
      <text x="622" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.4" fill="#1E293B">repli immédiat si les critiques externes ne convergent pas sous plafond d'itérations.</text>
