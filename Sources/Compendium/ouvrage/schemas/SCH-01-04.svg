      <text x="46" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.4" fill="#1E293B">La trace Chain-of-Thought NE DOIT JAMAIS servir de garde-fou ni de preuve légale ;</text>
      <text x="46" y="568" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.4" fill="#1E293B">seuls font foi les journaux déterministes d'entrées, d'outils et de vérificateurs.</text>
