    <text x="34" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">① Sous simple renommage lexical (Mystery BW), la réussite zero-shot</text>
    <text x="34" y="658" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">s'effondre de 34,6–59,3 % vers 0–0,16 %.</text>
    <text x="610" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">② En cadre LLM-Modulo, le modèle sert de générateur heuristique</text>
    <text x="610" y="658" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">soumis aux critiques formels (VAL, solveurs).</text>
    <text x="34" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">③ Chaque rejet renvoie un contre-exemple structuré plutôt que</text>
    <text x="34" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">d'exécuter un plan non vérifié (LLM+P).</text>
    <text x="610" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">④ La trace Chain-of-Thought est écartée de l'audit au profit des</text>
    <text x="610" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#334155">journaux déterministes des critiques.</text>
  </g>
