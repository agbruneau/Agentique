    <text x="38" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">SCH-23-02 — Évaluer sans oracle unique : invariance FR/EN, juges IA et 3+1 dérives</text>
    <text x="38" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">Tests métamorphiques sans oracle (≥ 100 cas), calibration kappa ≥ 0,6 et sentinelle · Systèmes d'entreprise (fr-CA)</text>
  </g>
  <g id="zone-Z1">
    <rect x="20" y="104" width="374" height="446" rx="10" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="1.8"/>
    <rect x="20" y="104" width="374" height="38" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="34" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A">Z1 · 4 relations métamorphiques FR/EN</text>
    <line x1="396" y1="327" x2="410" y2="327" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g id="node-1" class="node" data-node="true">
      <rect x="34" y="152" width="346" height="165" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
      <text x="46" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1E3A8A">Permutation &amp; symétrie bilingue</text>
      <text x="46" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Permutation outils équivalents</text>
      <text x="46" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Défense anti-injection FR ↔ EN</text>
    </g>
    <g id="node-2" class="node" data-node="true">
      <rect x="34" y="329" width="346" height="165" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
      <text x="46" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#134E4A">Monotonie &amp; paraphrase (≥ 100 cas)</text>
      <text x="46" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">Monotonie Decimal · mention non-avis</text>
      <text x="46" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1E293B">EXIG-SEC-24 &amp; EXIG-AMF-11</text>
    </g>
  </g>
  <g id="zone-Z2">
    <rect x="412" y="104" width="374" height="446" rx="10" fill="#F8FAFC" stroke="#6D28D9" stroke-width="1.8"/>
    <rect x="412" y="104" width="374" height="38" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
    <text x="426" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4C1D95">Z2 · Encadrement LLM-as-a-Judge</text>
    <line x1="788" y1="327" x2="802" y2="327" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
