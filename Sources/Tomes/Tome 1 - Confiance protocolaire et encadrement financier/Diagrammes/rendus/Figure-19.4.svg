<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:856px;height:745px;background:#FFFFFF;" width="856px" height="745px" viewBox="0 0 856 745" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster CADRE--><g class="cluster" data-qualified-name="CADRE" id="ent0001" data-source-line="12"><rect x="19.774" y="7" width="810" height="652" fill="#FFFDF9" style="stroke:#9A3412;stroke-width:1;" rx="3" ry="3"/><text x="153.653" y="23.028" fill="#000" font-size="13" textLength="542.242" font-weight="700" font-family="'Segoe UI'">CINQ MAILLONS, QUATRE QUESTIONS EN DÉFAUT (Q-A À Q-D, PLUS LA COMPOSITION)</text></g><!--entity M1--><g class="entity" data-qualified-name="CADRE.M1" id="ent0002" data-source-line="13"><rect x="71.774" y="43" width="705.509" height="71.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="81.774" y="67.028" fill="#9A3412" font-size="13" textLength="24.254" font-weight="700" font-family="'Segoe UI'">Q-A</text><text x="106.028" y="67.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="116.711" y="67.028" fill="#000" font-size="13" textLength="74.445" font-weight="700" font-family="'Segoe UI'">L'identifiant</text><text x="81.774" y="84.319" fill="#000" font-size="13" textLength="685.509" font-family="'Segoe UI'">Jeton porteur non lié à l'appelant, à l'appareil ni à la session — compromission de jetons d'application tierce, août 2025.</text><text x="81.774" y="101.61" fill="#57534E" font-size="13" textLength="321.21" font-family="'Segoe UI'">l'identifiant n'est pas résistant à la détention par un tiers</text></g><!--entity M2--><g class="entity" data-qualified-name="CADRE.M2" id="ent0003" data-source-line="19"><rect x="36.274" y="175" width="776.615" height="71.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="46.274" y="199.028" fill="#9A3412" font-size="13" textLength="23.448" font-weight="700" font-family="'Segoe UI'">Q-B</text><text x="69.722" y="199.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="80.405" y="199.028" fill="#000" font-size="13" textLength="88.486" font-weight="700" font-family="'Segoe UI'">La provenance</text><text x="46.274" y="216.319" fill="#000" font-size="13" textLength="756.615" font-family="'Segoe UI'">Empoisonnement à la publication, en amont de toute vérification ; entrée de mémoire ou document récupéré sans origine vérifiable.</text><text x="46.274" y="233.61" fill="#57534E" font-size="13" textLength="188.671" font-family="'Segoe UI'">extension de la grille aux sources</text></g><!--entity M3--><g class="entity" data-qualified-name="CADRE.M3" id="ent0004" data-source-line="25"><rect x="193.774" y="307" width="461.924" height="71.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="203.774" y="331.028" fill="#9A3412" font-size="13" textLength="23.226" font-weight="700" font-family="'Segoe UI'">Q-C</text><text x="227" y="331.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="237.683" y="331.028" fill="#000" font-size="13" textLength="64.137" font-weight="700" font-family="'Segoe UI'">Le mandat</text><text x="203.774" y="348.319" fill="#000" font-size="13" textLength="441.924" font-family="'Segoe UI'">L'instruction inter-agents fait agir le mandataire hors du mandat qu'il détient.</text><text x="203.774" y="365.61" fill="#57534E" font-size="13" textLength="284.502" font-family="'Segoe UI'">chaîne de mandat non interrogeable à l'exécution</text></g><!--entity M4--><g class="entity" data-qualified-name="CADRE.M4" id="ent0005" data-source-line="31"><rect x="101.774" y="439" width="646.469" height="71.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="111.774" y="463.028" fill="#9A3412" font-size="13" textLength="24.699" font-weight="700" font-family="'Segoe UI'">Q-D</text><text x="136.473" y="463.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="147.156" y="463.028" fill="#000" font-size="13" textLength="64.784" font-weight="700" font-family="'Segoe UI'">Les bornes</text><text x="111.774" y="480.319" fill="#000" font-size="13" textLength="626.469" font-family="'Segoe UI'">Absence de réduction de portée entre mandant et mandataire ; invocation d'outils inaccessibles à l'utilisateur.</text><text x="111.774" y="497.61" fill="#57534E" font-size="13" textLength="205.321" font-family="'Segoe UI'">bornes de privilège non opposables</text></g><!--entity M5--><g class="entity" data-qualified-name="CADRE.M5" id="ent0006" data-source-line="37"><rect x="159.274" y="571" width="531.17" height="71.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="169.274" y="595.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">—</text><text x="182.274" y="595.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="192.957" y="595.028" fill="#000" font-size="13" textLength="93.311" font-weight="700" font-family="'Segoe UI'">La composition</text><text x="169.274" y="612.319" fill="#000" font-size="13" textLength="511.17" font-family="'Segoe UI'">Le détournement réussit même lorsque les agents pris isolément ne sont pas vulnérables.</text><text x="169.274" y="629.61" fill="#57534E" font-size="13" textLength="308.636" font-family="'Segoe UI'">aucune question de la grille ne porte sur l'assemblage</text></g><!--link M1 to M2--><!--link M2 to M3--><!--link M3 to M4--><!--link M4 to M5--><g class="legend" data-source-line="49"><rect x="12" y="679" width="825.548" height="47.242" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:1;" rx="3" ry="3"/><text x="17" y="699.107" fill="#000" fon