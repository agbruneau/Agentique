<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:750px;height:424px;background:#FFFFFF;" width="750px" height="424px" viewBox="0 0 750 424" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="17"><rect x="7" y="7" width="339.801" height="312.656" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="31.028" fill="#57534E" font-size="13" textLength="80.545" font-family="'Segoe UI'">LANCEMENTS</text><line x1="8" y1="34.291" x2="345.801" y2="34.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="17" y="52.319" fill="#000" font-size="13" textLength="228.516" font-weight="700" font-family="'Segoe UI'">De novembre 2024 à septembre 2025</text><text x="17" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="86.901" fill="#000" font-size="13" textLength="295.16" font-family="'Segoe UI'">nov. 2024 — protocole agent-outil : un éditeur, une</text><text x="17" y="104.192" fill="#000" font-size="13" textLength="151.227" font-family="'Segoe UI'">spécification, un intendant</text><text x="17" y="121.483" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="138.774" fill="#000" font-size="13" textLength="291.484" font-family="'Segoe UI'">mars 2025 — couche d'infrastructure : annuaires et</text><text x="17" y="156.065" fill="#000" font-size="13" textLength="88.213" font-family="'Segoe UI'">transport dédié</text><text x="17" y="173.356" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="190.647" fill="#000" font-size="13" textLength="273.698" font-family="'Segoe UI'">17 mars 2025 — ACP protocolaire, en pré-alpha</text><text x="17" y="207.938" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="225.229" fill="#000" font-size="13" textLength="319.801" font-family="'Segoe UI'">avril 2025 — protocole agent-agent : délégation de pair</text><text x="17" y="242.521" fill="#000" font-size="13" textLength="32.1" font-family="'Segoe UI'">à pair</text><text x="17" y="259.812" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="277.103" fill="#000" font-size="13" textLength="264.564" font-family="'Segoe UI'">sept. 2025 — protocole de transaction (ch. 10)</text><line x1="8" y1="284.365" x2="345.801" y2="284.365" style="stroke:#B8B2A6;stroke-width:1;"/><text x="17" y="302.394" fill="#000" font-size="13" textLength="229.957" font-weight="700" font-family="'Segoe UI'">l'infrastructure précède l'agent-agent</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="38"><rect x="377.5" y="16" width="359.206" height="295.365" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="387.5" y="40.028" fill="#9A3412" font-size="13" textLength="173.101" font-family="'Segoe UI'">PASSAGES SOUS FONDATION</text><line x1="378.5" y1="43.291" x2="735.706" y2="43.291" style="stroke:#9A3412;stroke-width:1;"/><text x="387.5" y="61.319" fill="#000" font-size="13" textLength="185.015" font-weight="700" font-family="'Segoe UI'">De juin 2025 à décembre 2025</text><text x="387.5" y="78.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="387.5" y="95.901" fill="#000" font-size="13" textLength="286.92" font-family="'Segoe UI'">juin 2025 — le protocole agent-agent passe à une</text><text x="387.5" y="113.192" fill="#000" font-size="13" textLength="96.637" font-family="'Segoe UI'">fondation neutre</text><text x="387.5" y="130.483" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="387.5" y="147.774" fill="#000" font-size="13" textLength="261.308" font-family="'Segoe UI'">29 juill. 2025 — la couche d'infrastructure suit</text><text x="387.5" y="165.065" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="387.5" y="182.356" fill="#000" font-size="13" textLength="281.836" font-family="'Segoe UI'">29 août 2025 — l'ACP protocolaire fusionne dans</text><text x="387.5" y="199.647" fill="#000" font-size="13" textLength="76.997" font-family="'Segoe UI'">l'agent-agent</text><text x="387.5" y="216.938" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="387.5" y="234.229" fill="#000" font-size="13" textLength="327.672" font-family="'Segoe UI'">déc. 2025 — la gouvernance du protocole agent-outil est</text><text x="387.5" y="251.521" fill="#000" font-size="13" textLength="57.396" font-family="'Segoe UI'">transférée</text><line x1="378.5" y1="258.783" x2="735.706" y2="258.783" style="stroke:#9A3412;stroke-width:1;"/><text x="387.5" y="276.812" fill="#000" font-size="13" textLength="339.206" font-weight="700" font-family="'Segoe UI'">quatre protocoles, deux fondations, dont l'une héberge</text><text x="387.5" y="294.103" fill="#000" font-size="13" textLength="39.628" font-weight="700" font-family="'Segoe UI'">l'autre</text></g><!--link C1 to C2--><g class="legend" data-source-line="60"><rect x="30.901" y="339.656" width="681.904" height="65.863" fill="#F7F5F0" style="stroke:#C4BEB5;stroke-width:1;" rx="3" ry="3"/><text x="35.901" y="359.764" fill="#333" font-size="14" textLength="637.8" font-family="'Segoe UI'">LES DEUX SÉQUENCES SONT INVERSES L'UNE DE L'AUTRE, et c'est le fait le plus instructif de la section :</text><text x="35.901" y="378.385" fill="#333" font-size="14" textLength="671.904" font-family="'Segoe UI'">la flèche « agent-outil -> agent-agent -> infrastructure » souvent supposée est fausse dans les deux lectures.</text><text x="35.901" y="397.006" fill="#333" font-size="14" textLength="439.927" font-family="'Segoe UI'">Le cinquième protocole, celui de transaction, n'est pas de ce décompte.</text></g><?plantuml-src TLJDRjiu4BxhAGRDmLl0TlqJ9wqtC20xSX4WTRfLN1GeUg2baSo69bN-f4LFlVQ-3x