 font-size="13" textLength="145.317" font-weight="700" font-family="'Segoe UI'">Découverte et capacités</text><text x="102.5" y="153.819" fill="#222" font-size="13" textLength="226.021" font-family="'Segoe UI'">Trouver, sélectionner, résoudre — § 9.1.</text></g><!--entity S1--><g class="entity" data-qualified-name="STACK.S1" id="ent0004" data-source-line="48"><rect x="23" y="181.5" width="385.035" height="54.582" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="33" y="205.528" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">1</text><text x="40.478" y="205.528" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="47.6" y="205.528" fill="#222" font-size="13" textLength="122.573" font-weight="700" font-family="'Segoe UI'">Transport et session</text><text x="33" y="222.819" fill="#222" font-size="13" textLength="365.035" font-family="'Segoe UI'">Trajectoire vers le découplage, liaisons multiples — ch. 8 § 8.1.3.</text></g><!--entity PILIER--><g class="entity" data-qualified-name="PILIER" id="ent0007" data-source-line="57"><rect x="440" y="104" width="307.289" height="71.873" fill="#FFF" style="stroke:#9E3A14;stroke-width:2;" rx="2" ry="2"/><text x="450" y="128.028" fill="#222" font-size="13" textLength="126.039" font-weight="700" font-family="'Segoe UI'">Identité et confiance</text><text x="450" y="145.319" fill="#222" font-size="13" textLength="286.381" font-family="'Segoe UI'">Transversale : elle ne s'empile pas, elle traverse les</text><text x="450" y="162.61" fill="#222" font-size="13" textLength="287.289" font-family="'Segoe UI'">trois autres. Traitée au ch. 3 et dans tout le Livre II.</text></g><!--link S1 to S2--><!--link S2 to S3--><!--link S3 to PILIER--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk8" data-source-line="63" data-link-type="association"><path d="M395.96,98.5 C408.17,100.62 420.27,102.8 432,105 C434.52,105.47 437.07,105.96 439.63,1