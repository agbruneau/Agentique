<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:724px;height:348px;background:#FFFFFF;" width="724px" height="348px" viewBox="0 0 724 348" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster QUATRE RÉGIMES, DEUX SENS D'ÉVOLUTION--><g class="cluster" data-qualified-name="QUATRE R.GIMES. DEUX SENS D..VOLUTION" id="ent0001" data-source-line="32"><rect x="7" y="7" width="703" height="255" fill="#FFF" style="stroke:#E0DDD7;stroke-width:1.5;" rx="2" ry="2"/><text x="219.677" y="23.028" fill="#9E3A14" font-size="13" textLength="277.646" font-weight="700" font-family="'Segoe UI'">QUATRE RÉGIMES, DEUX SENS D'ÉVOLUTION</text></g><!--entity R1--><g class="entity" data-qualified-name="QUATRE R.GIMES. DEUX SENS D..VOLUTION.R1" id="ent0002" data-source-line="33"><rect x="23.5" y="43" width="334.526" height="89.164" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="33.5" y="67.028" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">1</text><text x="40.978" y="67.028" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="48.1" y="67.028" fill="#222" font-size="13" textLength="70.999" font-weight="700" font-family="'Segoe UI'">Ascendante</text><text x="33.5" y="84.319" fill="#222" font-size="13" textLength="314.526" font-family="'Segoe UI'">Un consommateur mis à jour lit des données produites</text><text x="33.5" y="101.61" fill="#222" font-size="13" textLength="127.283" font-family="'Segoe UI'">selon l'ancien schéma.</text><text x="33.5" y="118.901" fill="#666" font-size="13" textLength="54.907" font-family="'Segoe UI'">backward</text></g><!--entity R2--><g class="entity" data-qualified-name="QUATRE R.GIMES. DEUX SENS D..VOLUTION.R2" id="ent0003" data-source-line="39"><rect x="384" y="43" width="310.424" height="89.164" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="394" y="67.028" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">2</text><text x="401.478" y="67.028" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="408.6" y="67.028" fill="#222" font-size="13" textLength="78.476" font-weight="700" font-family="'Segoe UI'">Descendante</text><text x="394" y="84.319" fill="#222" font-size="13" textLength="290.424" font-family="'Segoe UI'">Un consommateur resté sur l'ancien schéma lit des</text><text x="394" y="101.61" fill="#222" font-size="13" textLength="210.533" font-family="'Segoe UI'">données produites selon le nouveau.</text><text x="394" y="118.901" fill="#666" font-size="13" textLength="44.389" font-family="'Segoe UI'">forward</text></g><!--entity R3--><g class="entity" data-qualified-name="QUATRE R.GIMES. DEUX SENS D..VOLUTION.R3" id="ent0004" data-source-line="45"><rect x="42.5" y="157" width="300.56" height="89.164" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="52.5" y="181.028" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">3</text><text x="59.978" y="181.028" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="67.1" y="181.028" fill="#222" font-size="13" textLength="58.849" font-weight="700" font-family="'Segoe UI'">Complète</text><text x="52.5" y="198.319" fill="#222" font-size="13" textLength="280.56" font-family="'Segoe UI'">Les deux à la fois : la mise à jour des deux parties</text><text x="52.5" y="215.61" fill="#222" font-size="13" textLength="154.216" font-family="'Segoe UI'">dans un ordre quelconque.</text><text x="52.5" y="232.901" fill="#666" font-size="13" textLength="17.723" font-family="'Segoe UI'">full</text></g><!--entity R4--><g class="entity" data-qualified-name="QUATRE R.GIMES. DEUX SENS D..VOLUTION.R4" id="ent0005" data-source-line="51"><rect x="373" y="157" width="317.819" height="89.164" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="383" y="181.028" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">4</text><text x="390.478" y="181.028" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="397.6" y="181.028" fill="#222" font-size="13" textLength="59.896" font-weight="700" font-family="'Segoe UI'">Transitive</text><text x="383" y="198.319" fill="#222" font-size="13" textLength="297.819" font-family="'Segoe UI'">La garantie s'étend à toutes les versions antérieures,</text><text x="383" y="215.61" fill="#222" font-size="13" textLength="150.167" font-family="'Segoe UI'">non à la seule précédente.</text><text x="383" y="232.901" fill="#666" font-size="13" textLength="52.14" font-family="'Segoe UI'">transitive</text></g><!--link R1 to R2--><!--link R3 to R4--><!--link R1 to R3--><!--link R2 to R4--><g class="legend" data-source-line="64"><rect x="134.788" y="282" width="447.425" height="47.242" fill="#F7F5F0" style="stroke:#C4BEB5;stroke-width:1;" rx="2" ry="2"/><text x="139.788" y="302.107" fill="#333" font-size="14" textLength="437.425" font-family="'Segoe UI'">La compatibilité transitive est la seule qui interdise la dérive cumulative</text><text x="139.788" y="320.729" fill="#333" font-size="14" textLength="425.264" font-family="'Segoe UI'">que des sauts successifs, compatibles deux à deux, peuvent produire.</text></g><?plantuml-src XPJFJjj04CRlUOeHFN09XSIXj2YAb92aGgAW4b9LGXmstecpPRrhzW-KLdq0tgB7vZdyOfrr4d1mqgwKsFhyhMT-C-DrEWEdOQATqobmOJ1sGglQJ704wz2WTeyPrkojK1apB8MCnRSimP5xb0Z1pbGYouO96HAZlU8dMce3RuR5AZauJfcNRgYLEsSfmiu84uqmFjtPR1g97mYDgFJGpXZN3q8bC6NIbgCl0nk51bebNMcE5ZDe7fRDJDqknIeX_Am1zBR0q1DjE9gbEZZez_j7f8Pqbzg7GTHjj9RQebmJBNdjLpdMSm6tHEiEZuRDrz5wxtjHjxiUhLcizPTBJ53nwakFXeV3Wwgl7EAarHlq3YkUKi2eMBNQgbexdyVTgyi1NEPF7qy_3KPrw0_6Ns4qE1z1VpT_-d9nDhuwlJZVAKXVk2yRS4q2G3iEBpvUrgtJddGQxVr9fxrVw1qoJ3fT6rCMJ3aCZufjOmMn