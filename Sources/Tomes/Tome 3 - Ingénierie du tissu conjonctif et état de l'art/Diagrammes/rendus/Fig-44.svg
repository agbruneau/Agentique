egoe UI'">4. Persistance Latente</text><text x="671.5" y="127.35" fill="#000" font-size="14" textLength="153.398" font-weight="700" font-family="'Segoe UI'">ASI06 : Memory Poison</text><text x="671.5" y="145.971" fill="#000" font-size="14" textLength="127.593" font-family="'Segoe UI'">Écriture d'une fausse</text><text x="671.5" y="164.592" fill="#000" font-size="14" textLength="151.498" font-family="'Segoe UI'">règle métier dans l'index</text><text x="671.5" y="183.213" fill="#000" font-size="14" textLength="145.776" font-family="'Segoe UI'">vectoriel ou la mémoire</text><text x="671.5" y="201.834" fill="#000" font-size="14" textLength="173.072" font-family="'Segoe UI'">épisodique partagée afin de</text><text x="671.5" y="220.455" fill="#000" font-size="14" textLength="145.893" font-family="'Segoe UI'">biaiser les sagas futures</text><line x1="662.5" y1="223.969" x2="853.572" y2="223.969" style="stroke:#DC2626;stroke-width:1;"/><text x="671.5" y="243.076" fill="#000" font-size="14" textLength="87.821" font-family="'Segoe UI'">ASI06 + ASI07</text></g><!--entity E5--><g class="entity" data-qualified-name="KillChain.E5" id="ent0006" data-source-line="62"><rect x="890" y="83.621" width="177.896" height="176.969" fill="#FFF" style="stroke:#DC2626;stroke-width:0.5;" rx="5" ry="5"/><text x="900" y="108.729" fill="#000" font-size="14" textLength="141.292" font-weight="700" font-family="'Segoe UI'">5. Impact Systémique</text><text x="900" y="127.35" fill="#000" font-size="14" textLength="102.676" font-weight="700" font-family="'Segoe UI'">ASI08 : Cascade</text><text x="900" y="145.971" fill="#000" font-size="14" textLength="157.486" font-family="'Segoe UI'">Propagation latérale A2A,</text><text x="900" y="164.592" fill="#000" font-size="14" textLength="157.896" font-family="'Segoe UI'">biais d'approbation HOTL</text><text x="900" y="183.213" fill="#000" font-size="14" textLength="155.791" font-family="'Segoe UI'">(ASI09), dérive autonome</text><text x="900" y="201.834" fill=