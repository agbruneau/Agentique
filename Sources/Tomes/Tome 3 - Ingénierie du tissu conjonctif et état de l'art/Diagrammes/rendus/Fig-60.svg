'">Tests de mutation (>= 85 % tués)</text><text x="360" y="375.592" fill="#000" font-size="14" textLength="236.031" font-family="'Segoe UI'">Parité centime près sur Golden Master</text><text x="360" y="394.213" fill="#000" font-size="14" textLength="188.624" font-family="'Segoe UI'">Preuve objective reproductible</text></g><!--entity P2C--><g class="entity" data-qualified-name="Phase2.P2C" id="ent0010" data-source-line="47"><rect x="641" y="294.621" width="258.027" height="113.105" fill="#FFF" style="stroke:#7C3AED;stroke-width:0.5;" rx="5" ry="5"/><text x="651" y="319.729" fill="#000" font-size="14" textLength="238.027" font-weight="700" font-family="'Segoe UI'">Critique Contradictoire &amp; Architecte</text><text x="651" y="338.35" fill="#000" font-size="14" textLength="217.082" font-family="'Segoe UI'">Modèle famille distincte (anti-biais)</text><text x="651" y="356.971" fill="#000" font-size="14" textLength="220.336" font-family="'Segoe UI'">Audit concurrence, fuites &amp; sécurité</text><text x="651" y="375.592" fill="#000" font-size="14" textLength="232.709" font-family="'Segoe UI'">Signature finale par ingénieur humain</text><text x="651" y="394.213" fill="#000" font-size="14" textLength="186.423" font-family="'Segoe UI'">Traçabilité BSIF E-23 complète</text></g><!--entity P3A--><g class="entity" data-qualified-name="Phase3.P3A" id="ent0014" data-source-line="59"><rect x="55" y="516.621" width="239.577" height="94.484" fill="#FFF" style="stroke:#475569;stroke-width:0.5;" rx="5" ry="5"/><text x="65" y="541.729" fill="#000" font-size="14" textLength="199.985" font-weight="700" font-family="'Segoe UI'">1. Duplication Trafic (30 jours)</text><text x="65" y="560.35" fill="#000" font-size="14" textLength="218.593" font-family="'Segoe UI'">IBM i reste maître ; nouveau service</text><text x="65" y="578.971" fill="#000" font-size="14" textLength="188.665" font-family="'Segoe UI'">calcule en parallèle sans muter</text><text x="65" y="597.592" fill="#000" font-size="14"