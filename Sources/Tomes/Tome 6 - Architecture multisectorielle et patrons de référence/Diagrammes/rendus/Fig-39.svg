<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1025px;height:540px;background:#FFFFFF;" width="1025px" height="540px" viewBox="0 0 1025 540" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="663.673" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="543.283" y="55" width="240.781" height="50.188" fill="#F0F1F0" style="stroke:#324E67;stroke-width:0.5;" rx="3" ry="3"/><text x="553.283" y="77.457" fill="#172025" font-size="12" textLength="175.078">Outil ou code invoqué par l'agent</text><text x="553.283" y="92.551" fill="#172025" font-size="12" textLength="220.781">après passage Intent Gate (OPA / Cedar)</text><polygon points="567.069,125.188,760.278,125.188,772.278,139.023,760.278,152.859,567.069,152.859,555.069,139.023,567.069,125.188" fill="#EDF3F7" style="stroke:#324E67;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="567.069" y="136.606" fill="#172025" font-size="11" textLength="140.024">Exécution de code arbitraire,</text><text x="567.069" y="150.442" fill="#172025" font-size="11" textLength="193.209">binaire natif ou multi-locataires hostile ?</text><text x="540.39" y="136.606" fill="#172025" font-size="11" textLength="14.679">oui</text><text x="772.278" y="136.606" fill="#172025" font-size="11" textLength="187.972">non — appel d'API métier déterministe</text><polygon points="355.61,162.859,516.416,162.859,528.416,176.695,516.416,190.531,355.61,190.531,343.61,176.695,355.61,162.859" fill="#EDF3F7" style="stroke:#324E67;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="355.61" y="174.278" fill="#172025" font-size="11" textLength="160.805">Charge compatible OCI standard</text><text x="355.61" y="188.114" fill="#172025" font-size="11" textLength="131.436">sans réécriture en Wasm ?</text><text x="328.931" y="174.278" fill="#172025" font-size="11" textLength="14.679">oui</text><text x="528.416" y="174.278" fill="#172025" font-size="11" textLength="171.816">non — greffon / parseur compilable</text><polygon points="164.976,200.531,312.6,200.531,324.6,214.367,312.6,228.203,164.976,228.203,152.976,214.367,164.976,200.531" fill="#EDF3F7" style="stroke:#324E67;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="164.976" y="211.95" fill="#172025" font-size="11" textLength="147.625">Exigence d'isolation matérielle</text><text x="164.976" y="225.786" fill="#172025" font-size="11" textLength="144.3">(KVM et noyau invité dédié) ?</text><text x="138.297" y="211.95" fill="#172025" font-size="11" textLength="14.679">oui</text><text x="324.6" y="211.95" fill="#172025" font-size="11" textLength="174.271">non — pas de KVM ou forte densité</text><rect x="16" y="238.203" width="212.346" height="80.375" fill="#F0F1F0" style="stroke:#324E67;stroke-width:0.5;" rx="3" ry="3"/><text x="26" y="260.66" fill="#172025" font-size="12" textLength="166.74" font-weight="700">Firecracker / Kata Containers</text><text x="26" y="275.754" fill="#172025" font-size="12" textLength="183.721">MicroVM + Jailer (chroot, cgroups)</text><text x="26" y="290.848" fill="#172025" font-size="12" textLength="192.346">Jusqu'à 5 microVM/cœur/s (128 Mio</text><text x="26" y="305.941" fill="#172025" font-size="12" textLength="30.662">RAM)</text><rect x="248.346" y="238.203" width="214.115" height="65.281" fill="#F0F1F0" style="stroke:#324E67;stroke-width:0.5;" rx="3" ry="3"/><text x="258.346" y="260.66" fill="#172025" font-size="12" textLength="81.346" font-weight="700">gVisor (runsc)</text><text x="258.346" y="275.754" fill="#172025" font-size="12" textLength="185.092">Noyau Sentry en Go + proxy Gofer</text><text x="258.346" y="290.848" fill="#172025" font-size="12" textLength="194.115">Surface noyau hôte réduite sans VM</text><polygon points="238.788,324.578,250.788,336.578,238.788,348.578,226.788,336.578,238.788,324.578" fill="#EDF3F7" style="stroke:#324E67;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="518.871" y="200.531" width="228.734" height="80.375" fill="#F0F1F0" style="stroke:#324E67;stroke-width:0.5;" rx="3" ry="3"/><text x="528.871" y="222.988" fill="#172025" font-size="12" textLength="174.674" font-weight="700">Wasmtime / Component Model</text><text x="528.871" y="238.082" fill="#172025" font-size="12" textLength="39.322" font-weight="700">(WASI)</text><text x="528.871" y="253.176" fill="#172025" font-size="12" textLength="200.766">Mémoire linéaire bornée (garde 2 Go)</text><text x="528.871" y="268.27" fill="#172025" font-size="12" textLength="208.734">Zero ambient authority (interfaces WIT)</text><polygon points="436.013,354.578,448.013,366.578,436.013,378.578,424.013,366.578,436.013,354.578" fill="#EDF3F7" style="stroke:#324E67;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="777.605" y="162.859" width="227.457" height="80.375" fill="#F0F1F0" style="stroke:#324E67;stroke-width:0.5;" rx="3" ry="3"/><text x="787.605" y="185.316" fill="#172025" font-size="12" textLength="183.059" font-weight="700">Conteneur durci + Proxy Egress</text><text x="787.605" y="200.41" fill="#172025" font-size="12" textLength="194.748">Non-root, seccomp, FS lecture seule</text><text x="787.605" y="215.504" fill="#172025" font-size="12" textLength="207.457">Blocage réseaux privés / métadonnées</text><text x="787.605" y="230.598" fill="#172025" font-size="12" textLength="63.34">(anti-SSRF)</text><polygon points="663.673,384.578,675.673,396.578,663.673,408.578,651.673,396.578,663.673,384.578" fill="#EDF3F7" style="stroke:#324E67;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="551.298" y="428.578" width="224.75" height="50.188" fill="#F0F1F0" style="stroke:#324E67;stroke-width:0.5;" rx="3" ry="3"/><text x="561.298" y="451.035" fill="#172025" font-size="12" textLength="204.75">Appliquer filtrage PII (Presidio / NeMo)</text><text x="561.298" y="466.129" fill="#172025" font-size="12" textLength="155.379">et remonter traces vers AIDR</text><ellipse cx="663.673" cy="509.766" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="663.673" cy="509.766" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="663.673" y1="35" x2="663.673" y2="55" style="stroke:#324E67;stroke-width:1;"/><polygon points="659.673,45,663.673,55,667.673,45,663.673,49" fill="#324E67" style="stroke:#324E67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="152.976" y1="214.367" x2="122.173" y2="214.367" style="stroke:#324E67;stroke-width:1;"/><line x1="122.173" y1="214.367" x2="122.173" y2="238.203" style="stroke:#324E67;stroke-width:1;"/><polygon points="118.173,228.203,122.173,238.203,126.173,228.203,122.173,232.203" fill="#324E67" style="stroke:#324E67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="324.6" y1="214.367" x2="355.403" y2="214.367" style="stroke:#324E67;stroke-width:1;"/><line x1="355.403" y1="214.367" x2="355.403" y2="238.203" style="stroke:#324E67;stroke-width:1;"/><polygon points="351.403,228.203,355.403,238.203,359.403,228.203,355.403,232.203" fill="#324E67" style="stroke:#324E67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="122.173" y1="318.578" x2="122.173" y2="336.578" style="stroke:#324E67;stroke-width:1;"/><line x1="122.173" y1="336.578" x2="226.788" y2="336.578" style="stroke:#324E67;stroke-width:1;"/><polygon points="216.788,332.578,226.788,336.578,216.788,340.578,220.788,336.578" fill="#324E67" style="stroke:#324E67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="355.403" y1="303.484" x2="355.403" y2="336.578" style="stroke:#324E67;stroke-width:1;"/><line x1="355.403" y1="336.578" x2="250.788" y2="336.578" style="stroke:#324E67;stroke-width:1;"/><polygon points="260.788,332.578,250.788,336.578,260.788,340.578,256.788,336