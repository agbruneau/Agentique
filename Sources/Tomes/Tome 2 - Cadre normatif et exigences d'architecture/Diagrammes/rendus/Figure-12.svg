<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:808px;height:438px;background:#FFFFFF;" width="808px" height="438px" viewBox="0 0 808 438" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity Q1--><g class="entity" data-qualified-name="Q1" id="ent0001" data-source-line="12"><ellipse cx="125.712" cy="38.97" rx="97.012" ry="22.97" fill="#FFF" style="stroke:#0F2744;stroke-width:0.5;"/><text x="56.833" y="36.509" fill="#000" font-size="11" textLength="137.758" font-weight="700" font-family="'Segoe UI'">Une règle, un appel d’outil</text><text x="67.438" y="51.14" fill="#000" font-size="11" textLength="116.547" font-weight="700" font-family="'Segoe UI'">ou au modèle suffit-il?</text></g><!--entity R1--><g class="entity" data-qualified-name="R1" id="ent0002" data-source-line="13"><rect x="246.699" y="14.5" width="149.809" height="49.262" fill="#475569" style="stroke:#475569;stroke-width:0.5;" rx="7" ry="7"/><text x="256.699" y="36.37" fill="#FFF" font-size="11" textLength="60.167" font-weight="700" font-family="'Segoe UI'">Pas d’agent</text><text x="256.699" y="51.001" fill="#FFF" font-size="11" textLength="129.809" font-family="'Segoe UI'">code, règle ou appel direct</text></g><!--entity Comb--><g class="entity" data-qualified-name="Comb" id="ent0003" data-source-line="14"><rect x="421.199" y="7" width="364.969" height="63.893" fill="#FEF3DC" style="stroke:#B45309;stroke-width:1;stroke-dasharray:7,7;" rx="7" ry="7"/><text x="431.199" y="28.87" fill="#B45309" font-size="11" textLength="148.715" font-weight="700" font-family="'Segoe UI'">À combiner avec tout patron</text><text x="431.199" y="43.501" fill="#000" font-size="11" textLength="332.573" font-family="'Segoe UI'">La qualité se vérifie? → boucle évaluateur-optimiseur (≤ 3 itérations).</text><text x="431.199" y="58.132" fill="#000" font-size="11" textLength="344.969" font-family="'Segoe UI'">Sous-tâches indépendantes? → parallélisation (sectionnement ou vote).</text></g><!--entity Q2--><g class="entity" data-qualified-name="Q2" id="ent0004" data-source-line="16"><ellipse cx="125.637" cy="121.737" rx="76.438" ry="23.237" fill="#FFF" style="stroke:#0F2744;stroke-width:0.5;"/><text x="72.544" y="118.887" fill="#000" font-size="11" textLength="106.187" font-weight="700" font-family="'Segoe UI'">Les étapes sont-elles</text><text x="77.488" y="133.517" fill="#000" font-size="11" textLength="96.298" font-weight="700" font-family="'Segoe UI'">connues d’avance?</text></g><!--entity R2--><g class="entity" data-qualified-name="R2" id="ent0005" data-source-line="17"><rect x="226.199" y="97" width="128.566" height="49.262" fill="#1B5E9E" style="stroke:#1B5E9E;stroke-width:0.5;" rx="7" ry="7"/><text x="236.199" y="118.87" fill="#FFF" font-size="11" textLength="90.036" font-weight="700" font-family="'Segoe UI'">Flux déterministe</text><text x="236.199" y="133.501" fill="#FFF" font-size="11" textLength="108.566" font-family="'Segoe UI'">ou chaîne séquentielle</text></g><!--entity Q3--><g class="entity" data-qualified-name="Q3" id="ent0006" data-source-line="19"><ellipse cx="125.775" cy="196.715" rx="111.576" ry="24.715" fill="#FFF" style="stroke:#0F2744;stroke-width:0.5;"/><text x="38.962" y="194.804" fill="#000" font-size="11" textLength="173.626" font-weight="700" font-family="'Segoe UI'">Des domaines faiblement couplés</text><text x="53.585" y="209.435" fill="#000" font-size="11" textLength="144.38" font-weight="700" font-family="'Segoe UI'">réagissent-ils au même fait?</text></g><!--entity R3--><g class="entity" data-qualified-name="R3" id="ent0007" data-source-line="20"><rect x="79.199" y="247" width="93.428" height="49.262" fill="#0F7682" style="stroke:#0F7682;stroke-width:0.5;" rx="7" ry="7"/><text x="89.199" y="268.87" fill="#FFF" font-size="11" textLength="70.168" font-weight="700" font-family="'Segoe UI'">Chorégraphie</text><text x="89.199" y="283.501" fill="#FFF" font-size="11" textLength="73.428" font-family="'Segoe UI'">événementielle</text></g><!--entity Q4--><g class="entity" data-qualified-name="Q4" id="ent0008" data-source-line="22"><ellipse cx="369.495" cy="196.559" rx="108.296" ry="24.059" fill="#FFF" style="stroke:#0F2744;stroke-width:0.5;"/><text x="294.125" y="192.984" fill="#000" font-size="11" textLength="150.74" font-weight="700" font-family="'Segoe UI'">Un agent unique bien outillé,</text><text x="293.4" y="207.615" fill="#000" font-size="11" textLength="152.19" font-weight="700" font-family="'Segoe UI'">contexte non saturé, suffit-il?</text></g><!--entity R4--><g class="entity" data-qualified-name="R4" id="ent0009" data-source-line="23"><rect x="502.199" y="172" width="169.263" height="49.262" fill="#5A469B" style="stroke:#5A469B;stroke-width:0.5;" rx="7" ry="7"/><text x="512.199" y="193.87" fill="#FFF" font-size="11" textLength="70.318" font-weight="700" font-family="'Segoe UI'">Agent unique</text><text x="512.199" y="208.501" fill="#FFF" font-size="11" textLength="149.263" font-family="'Segoe UI'">recherche d’outils si nécessaire</text></g><!--entity Q5--><g class="entity" data-qualified-name="Q5" id="ent0010" data-source-line="25"><ellipse cx="369.509" cy="271.481" rx="96.309" ry="22.481" fill="#FFF" style="stroke:#0F2744;stroke-width:0.5;"/><text x="299.429" y="269.749" fill="#000" font-size="11" textLength="140.159" font-weight="700" font-family="'Segoe UI'">Un spécialiste unique suffit</text><text x="319.147" y="284.38" fill="#000" font-size="11" textLength="100.724" font-weight="700" font-family="'Segoe UI'">après qualification?</text></g><!--entity R5--><g class="entity" data-qualified-name="R5" id="ent0011" data-source-line="26"><rect x="490.699" y="247" width="132.17" height="49.262" fill="#16477A" style="stroke:#16477A;stroke-width:0.5;" rx="7" ry="7"/><text x="500.699" y="268.87" fill="#FFF" font-size="11" textLe