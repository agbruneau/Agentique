<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:776px;height:327px;background:#FFFFFF;" width="776px" height="327px" viewBox="0 0 776 327" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="9"><rect x="75" y="7" width="285.789" height="191.619" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="85" y="31.028" fill="#57534E" font-size="13" textLength="109.345" font-family="'Segoe UI'">AUTOMATISATION</text><line x1="76" y1="34.291" x2="359.789" y2="34.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="85" y="52.319" fill="#000" font-size="13" textLength="184.533" font-weight="700" font-family="'Segoe UI'">Le chemin est décidé d'avance</text><text x="85" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="85" y="86.901" fill="#000" font-size="13" textLength="198.313" font-family="'Segoe UI'">Ce qui peut arriver est énumérable</text><text x="85" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="85" y="121.483" fill="#000" font-size="13" textLength="265.789" font-family="'Segoe UI'">La supervision porte sur l'exécution du chemin</text><text x="85" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="85" y="156.065" fill="#000" font-size="13" textLength="137.021" font-family="'Segoe UI'">L'audit rejoue le chemin</text><line x1="76" y1="163.328" x2="359.789" y2="163.328" style="stroke:#B8B2A6;stroke-width:1;"/><text x="85" y="181.356" fill="#000" font-size="13" textLength="162.157" font-weight="700" font-family="'Segoe UI'">restreindre les droits suffit</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="23"><rect x="396.5" y="7" width="311.281" height="191.619" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="406.5" y="31.028" fill="#9A3412" font-size="13" textLength="141.502" font-family="'Segoe UI'">AUTONOMIE ENCADRÉE</text><line x1="397.5" y1="34.291" x2="706.781" y2="34.291" style="stroke:#9A3412;stroke-width:1;"/><text x="406.5" y="52.319" fill="#000" font-size="13" textLength="208.501" font-weight="700" font-family="'Segoe UI'">Le chemin est décidé à l'exécution</text><text x="406.5" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="406.5" y="86.901" fill="#000" font-size="13" textLength="210.184" font-family="'Segoe UI'">Ce qui peut arriver ne s'énumère pas</text><text x="406.5" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="406.5" y="121.483" fill="#000" font-size="13" textLength="183.365" font-family="'Segoe UI'">La supervision arrive après coup</text><text x="406.5" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="406.5" y="156.065" fill="#000" font-size="13" textLength="277.208" font-family="'Segoe UI'">L'encadrement borne le domaine, non le chemin</text><line x1="397.5" y1="163.328" x2="706.781" y2="163.328" style="stroke:#9A3412;stroke-width:1;"/><text x="406.5" y="181.356" fill="#000" font-size="13" textLength="291.281" font-weight="700" font-family="'Segoe UI'">d'où l'encadrement comme mécanisme premier</text></g><!--entity NOTE--><g class="entity" data-qualified-name="NOTE" id="ent0003" data-source-line="37"><rect x="7" y="259" width="755.89" height="54.582" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="283.028" fill="#000" font-size="13" textLength="735.89" font-family="'Segoe UI'">La réponse examinée vient d'UN TEXTE — un manifeste —, non d'un consensus de la discipline. Que l'encadrement soit présenté</text><text x="17" y="300.319" fill="#000" font-size="13" textLength="634.55" font-family="'Segoe UI'">comme le m