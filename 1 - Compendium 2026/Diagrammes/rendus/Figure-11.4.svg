<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:666px;height:320px;background:#FFFFFF;" width="666px" height="320px" viewBox="0 0 666 320" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="17"><rect x="7" y="7" width="319.362" height="208.91" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="31.028" fill="#57534E" font-size="13" textLength="57.243" font-family="'Segoe UI'">PRÉVENIR</text><line x1="8" y1="34.291" x2="325.362" y2="34.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="17" y="52.319" fill="#000" font-size="13" textLength="171.882" font-weight="700" font-family="'Segoe UI'">Empêcher la compromission</text><text x="17" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="86.901" fill="#000" font-size="13" textLength="219.73" font-family="'Segoe UI'">Suppose que les surfaces se referment</text><text x="17" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="121.483" fill="#000" font-size="13" textLength="214.97" font-family="'Segoe UI'">Une seule brèche annule la démarche</text><text x="17" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="156.065" fill="#000" font-size="13" textLength="299.362" font-family="'Segoe UI'">Non protocolaire : les spécifications ne répondent ni</text><text x="17" y="173.356" fill="#000" font-size="13" textLength="129.473" font-family="'Segoe UI'">du contenu ni de l'état</text><line x1="8" y1="180.619" x2="325.362" y2="180.619" style="stroke:#B8B2A6;stroke-width:1;"/><text x="17" y="198.647" fill="#000" font-size="13" textLength="201.938" font-weight="700" font-family="'Segoe UI'">l'ordre habituel du raisonnement</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="32"><rect x="356.5" y="7" width="295.812" height="208.91" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="366.5" y="31.028" fill="#9A3412" font-size="13" textLength="61.458" font-family="'Segoe UI'">CONFINER</text><line x1="357.5" y1="34.291" x2="651.312" y2="34.291" style="stroke:#9A3412;stroke-width:1;"/><text x="366.5" y="52.319" fill="#000" font-size="13" textLength="224.758" font-weight="700" font-family="'Segoe UI'">Borner le rayon de la compromission</text><text x="366.5" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="366.5" y="86.901" fill="#000" font-size="13" textLength="231.467" font-family="'Segoe UI'">Restreindre le contexte de chaque agent</text><text x="366.5" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="366.5" y="121.483" fill="#000" font-size="13" textLength="142.994" font-family="'Segoe UI'">Restreindre ses capacités</text><text x="366.5" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="366.5" y="156.065" fill="#000" font-size="13" textLength="275.812" font-family="'Segoe UI'">Le cadre local devient frontière de sécurité et de</text><text x="366.5" y="173.356" fill="#000" font-size="13" textLength="81.675" font-family="'Segoe UI'">confidentialité</text><line x1="357.5" y1="180.619" x2="651.312" y2="180.619" style="stroke:#9A3412;stroke-width:1;"/><text x="366.5" y="198.647" fill="#000" font-size="13" textLength="231.563" font-weight="700" font-family="'Segoe UI'">ce que le manifeste propose (§ 11.1.3)</text></g><!--link C1 to C2--><g class="legend" data-source-line="49"><rect x="17.777" y="235.91" width="623.758" height="65.863" fill="#F7F5F0" style="stroke:#C4BEB5;stroke-width:1;" rx="3" ry="3"/><text x="22.777" y="256.018" fill="#333" font-size="14" textLength="613.758" font-family="'Segoe UI'">Le renversement ne suppose PAS que les surfaces du § 11.1 soient refermées — il suppose l'inverse,</text><text x="22.777" y="274.639" fill="#333" font-size="14" textLength="578.17" font-family="'Segoe UI'">et c'est ce qui le rend praticable. Une frontière qui borne un rayon ne dit rien de la probabilité</text><text x="22.777" y="293.26" fill="#333" font-size="14" textLength="216.686" font-family="'Segoe UI'">de la compromission qu'elle borne.</text></g><?plantuml-src TLB1Jjj04BtxAqPmI2kLW0a1Ib6a94eaf2f5HFI2EApNOsV5UjVTNLFQKw-zznzA-Xdrd_HBEhjsAaUXUx9dthoPUVESBi5fIBHpke1K6EHEQ1NP1w5APbW1TiLI_Lce738cBNOoHbSgvTeeD73QYQUOiKgwkLPkmGg4lINc6k7sQkzbq59yHOW7dMJ2-4CUwATQQWFxy_0w2ALJj5Z2uAWx45CFFXYVHvsen1nLEjcXF9iFvqUxE6rID2rcUZAPJOOx63zqYnY45qLUDwPoYJ2DYNiyFvqVlPD2uSNaV78yFeMx2E2I-wAB_U7PS70o6rtVrDy_pXPNDvU78J4Yo04zZqn6iwAiV_4LQIiPS5sKHXV2MZhEvM4oYWYqhCfIMuHF5T9W5cnbCiRz1uB134s1oddWhKAALJHSOkfduWIcbFybvhHU5ynGp0CNMW7rSPhcOUG5k6Y8othDHIOuyzwmG7IcNfTQfTG0bA3AjA8PbKDLqJyT5sIlNZlcjbQIFHANM5Si4Qv2wQiC4rOhXNxMiDZzbfZ7czitOhuT3qxYuoqncz1e-c4nlrhCNjPoqfYK20txGZkc-5zHRz0wWqBvEGaVbdfow4luYdcfMTxAseLQaecpad7XwhNrsVTKm0ABvenMnKVXrSeCCOhwsGHAIy9MnjS0EWfG7NNCX1TMCEaJMulmpRMXO4faD03wWmKRlFhz4-Au7_S7hpT2aXSFxbOY9Rfx8_ALEnYHf57KsBWPqg1wH6F30VnbRUkgw_5orrbqiBOBM1tsQOnMhodvvziF4F8VWUo9XlaDDQBjU8_6XR212AUW4MXuyXHdYSH-i6b77WzB_E6WKktTw3iLr9CwjpUavHDoqqQf5mvBF3sKtlkUgnzHrsRzlm00?></g></svg>