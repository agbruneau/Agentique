<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:967px;height:420px;background:#FFFFFF;" width="967px" height="420px" viewBox="0 0 967 420" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster P1--><g class="cluster" data-qualified-name="P1" id="ent0001" data-source-line="35"><path d="M9.207,80.44 L160.883,80.44 A4.5,4.5 0 0 1 163.883,83.44 L170.883,104.049 L330.207,104.049 A3,3 0 0 1 333.207,107.049 L333.207,323.44 A3,3 0 0 1 330.207,326.44 L9.207,326.44 A3,3 0 0 1 6.207,323.44 L6.207,83.44 A3,3 0 0 1 9.207,80.44" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="6.207" y1="104.049" x2="170.883" y2="104.049" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="10.207" y="96.973" fill="#444" font-size="14" textLength="151.676" font-weight="700">ZERO TRUST RÉSEAU</text></g><!--cluster P2--><g class="cluster" data-qualified-name="P2" id="ent0003" data-source-line="39"><path d="M376.207,80.44 L552.765,80.44 A4.5,4.5 0 0 1 555.765,83.44 L562.765,104.049 L769.207,104.049 A3,3 0 0 1 772.207,107.049 L772.207,323.44 A3,3 0 0 1 769.207,326.44 L376.207,326.44 A3,3 0 0 1 373.207,323.44 L373.207,83.44 A3,3 0 0 1 376.207,80.44" style="stroke:#9C3D14;stroke-width:1.5;" fill="#FDFBF7"/><line x1="373.207" y1="104.049" x2="562.765" y2="104.049" style="stroke:#9C3D14;stroke-width:1.5;"/><text x="377.207" y="96.973" fill="#9C3D14" font-size="14" textLength="176.559" font-weight="700">ZERO TRUST AGENTIQUE</text></g><!--entity C1--><g class="entity" data-qualified-name="P1.C1" id="ent0002" data-source-line="36"><rect x="49.207" y="124.44" width="260.023" height="178.484" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="59.207" y="148.973" fill="#1F1F1F" font-size="14" textLength="185.985" font-weight="700">Jamais confiance au réseau</text><text x="59.207" y="166.583" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="184.192" fill="#1F1F1F" font-size="14" textLength="180.113">La localisation n'accorde rien</text><text x="59.207" y="201.801" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="219.411" fill="#1F1F1F" font-size="14" textLength="165.354">Chaque appel s'authentifie</text><text x="59.207" y="237.02" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="254.629" fill="#1F1F1F" font-size="14" textLength="240.023">Le périmètre cesse d'être une frontière</text><text x="59.207" y="272.239" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="289.848" fill="#1F1F1F" font-size="14" textLength="109.724" font-weight="700">NIST SP 800-207</text></g><!--entity C2--><g class="entity" data-qualified-name="P2.C2" id="ent0004" data-source-line="40"><rect x="416.207" y="124.44" width="332.43" height="178.484" fill="#FFF" style="stroke:#9C3D14;stroke-width:0.5;" rx="3" ry="3"/><text x="426.207" y="148.973" fill="#1F1F1F" font-size="14" textLength="187.517" font-weight="700">Jamais confiance au graphe</text><text x="426.207" y="166.583" fill="#1F1F1F" font-size="14"> </text><text x="426.207" y="184.192" fill="#1F1F1F" font-size="14" textLength="255.623">La position dans le graphe n'accorde rien</text><text x="426.207" y="201.801" fill="#1F1F1F" font-size="14"> </text><text x="426.207" y="219.411" fill="#1F1F1F" font-size="14" textLength="144.751">Chaque arête se vérifie</text><text x="426.207" y="237.02" fill="#1F1F1F" font-size="14"> </text><text x="426.207" y="254.629" fill="#1F1F1F" font-size="14" textLength="312.43">Être invoqué par un pair n'est pas une autorisation</text><text x="426.207" y="272.239" fill="#1F1F1F" font-size="14"> </text><text x="426.207" y="289.848" fill="#1F1F1F" font-size="14" textLength="184.81" font-weight="700">transposition — ce chapitre</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="46"><path d="M212.207,365.44 L212.207,402.143 A3,3 0 0 0 215.207,405.143 L949.123,405.143 A3,3 0 0 0 952.123,402.143 L952.123,372.44 L942.123,362.44 L586.207,362.44 L582.207,302.64 L578.207,362.44 L215.207,362.44 A3,3 0 0 0 212.207,365.44" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M942.123,362.44 L942.123,370.94 A1.5,1.5 0 0 0 943.623,372.44 L952.123,372.44 L942.123,362.44" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="218.207" y="380.935" fill="#333" font-size="13" textLength="718.917">La transposition est une LECTURE, non un mécanisme : nommer le graphe à la place du réseau ne fournit ni l'identité qui s'y</text><text x="218.207" y="397.287" fill="#333" font-size="13" textLength="616.427">vérifie, ni la fraîcheur du verdict (§ 37.8.3). Le principe change de domaine ; les manques ne changent pas.</text></g><!--link P1 to P2--><?plantuml-src bLJDRXCn4BxlKupA8I2reMaY4Y2ALAA0G5Kf-Rb0EKpisQpLNNjhUuigXCGLpZm0DneEF0Jx9Zm9uqtQXgQ5uXnsCpkUxsV6JfGaS9ui6N-QK-IEbCxHOWPJ54SpQmej-oOr5kx4rLh9S0bAyqxf6SIOkjMzac8iKl_KQB-F6S48jHkHLQkxgzB2M4qM7gp4SyR56S7x27WzMMCXusdSNdmpLf9TncLBn68H3x3BQAjQqOVr-jqk2a7Qzth_Y_HGD6MZTHLf6Lr5iYGywbbwivPst29QHvXsfYqKLn4QSVXTZt0BDOlktLBDDLZQ-9k5ODo9MxSLqgmM5u_EUxtnUZ1y2UFXP3I6OVbfDDYTR00wE6Wi4I-jtEXEUoymG-L061qhr8802x3bt14MtVlJtg4-r7i8gH6OAeTU6GswnWO5Qc0LwP3HJ_2uuArvJYcu6XO-OGDLhAZQJv2NSwkoyinR0a7E4SXQ-JtyApH1R5cGAizibSwazfyp-T41TBQtjtQssu58fQ7Vk4dfxhF1_lZvgybWeNK7rhhuRzapYtb2AwfpurIbMFAP0zwvoFYB0PP5yHr0S184B_MNduDGfK_CSL7E-T1OLiqFPRaIES-lhlA1VJDswVBI2MyP-eB7huzVs3uG2UQAQrxwigetMCJDtdgJA2b9lxLgblYj7fiIHTNWJOtt9ejOu9_L0vL0Os_G7q-6WqqUKnsOPkLSe5QEBvz77CiolcKkpIY_GifMfSZ4vCNiG6YhAQnM7hI2jCPt8_VOi_xZGl6Cd4Rd5crM2SXJWEKFaL1XGvqJib893tT_VeDckzwfD-_L8KoILLgel391yn1m4wJXNZBUOsRb84FDhN21m295LmRN8zAoEdY_0G00?></g></svg>