<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:975px;height:422px;background:#FFFFFF;" width="975px" height="422px" viewBox="0 0 975 422" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster P1--><g class="cluster" data-qualified-name="P1" id="ent0001" data-source-line="35"><path d="M9.207,83.1 L188.889,83.1 A4.5,4.5 0 0 1 191.889,86.1 L198.889,106.709 L354.207,106.709 A3,3 0 0 1 357.207,109.709 L357.207,326.1 A3,3 0 0 1 354.207,329.1 L9.207,329.1 A3,3 0 0 1 6.207,326.1 L6.207,86.1 A3,3 0 0 1 9.207,83.1" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="6.207" y1="106.709" x2="198.889" y2="106.709" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="10.207" y="99.633" fill="#444" font-size="14" textLength="179.683" font-weight="700">POINT DE DÉCISION (PDP)</text></g><!--cluster P2--><g class="cluster" data-qualified-name="P2" id="ent0003" data-source-line="39"><path d="M400.207,83.1 L596.432,83.1 A4.5,4.5 0 0 1 599.432,86.1 L606.432,106.709 L775.207,106.709 A3,3 0 0 1 778.207,109.709 L778.207,326.1 A3,3 0 0 1 775.207,329.1 L400.207,329.1 A3,3 0 0 1 397.207,326.1 L397.207,86.1 A3,3 0 0 1 400.207,83.1" style="stroke:#9C3D14;stroke-width:1.5;" fill="#FDFBF7"/><line x1="397.207" y1="106.709" x2="606.432" y2="106.709" style="stroke:#9C3D14;stroke-width:1.5;"/><text x="401.207" y="99.633" fill="#9C3D14" font-size="14" textLength="196.226" font-weight="700">POINT D'APPLICATION (PEP)</text></g><!--entity C1--><g class="entity" data-qualified-name="P1.C1" id="ent0002" data-source-line="36"><rect x="49.207" y="127.1" width="283.785" height="178.484" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="59.207" y="151.633" fill="#1F1F1F" font-size="14" textLength="176.606" font-weight="700">Où la politique est évaluée</text><text x="59.207" y="169.243" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="186.852" fill="#1F1F1F" font-size="14" textLength="196.902">Reçoit le contexte de la requête</text><text x="59.207" y="204.461" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="222.071" fill="#1F1F1F" font-size="14" textLength="98.055">Rend un verdict</text><text x="59.207" y="239.68" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="257.289" fill="#1F1F1F" font-size="14" textLength="242.354">Ne voit pas nécessairement l'exécution</text><text x="59.207" y="274.899" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="292.508" fill="#1F1F1F" font-size="14" textLength="263.785" font-weight="700">le vocabulaire vient de NIST SP 800-207</text></g><!--entity C2--><g class="entity" data-qualified-name="P2.C2" id="ent0004" data-source-line="40"><rect x="440.207" y="127.1" width="313.651" height="178.484" fill="#FFF" style="stroke:#9C3D14;stroke-width:0.5;" rx="3" ry="3"/><text x="450.207" y="151.633" fill="#1F1F1F" font-size="14" textLength="123.696" font-weight="700">Où le verdict mord</text><text x="450.207" y="169.243" fill="#1F1F1F" font-size="14"> </text><text x="450.207" y="186.852" fill="#1F1F1F" font-size="14" textLength="170.782">À l'arête, entre deux agents</text><text x="450.207" y="204.461" fill="#1F1F1F" font-size="14"> </text><text x="450.207" y="222.071" fill="#1F1F1F" font-size="14" textLength="149.413">Refuse ou laisse passer</text><text x="450.207" y="239.68" fill="#1F1F1F" font-size="14"> </text><text x="450.207" y="257.289" fill="#1F1F1F" font-size="14" textLength="293.651">ce qu'il doit lire d'un agent n'est pas documenté</text><text x="450.207" y="274.899" fill="#1F1F1F" font-size="14"> </text><text x="450.207" y="292.508" fill="#1F1F1F" font-size="14" textLength="122.165" font-weight="700">siège : ce chapitre</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="46"><path d="M233.707,368.1 L233.707,404.803 A3,3 0 0 0 236.707,407.803 L957.649,407.803 A3,3 0 0 0 960.649,404.803 L960.649,375.1 L950.649,365.1 L601.207,365.1 L597.207,305.3 L593.207,365.1 L236.707,365.1 A3,3 0 0 0 233.707,368.1" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M950.649,365.1 L950.649,373.6 A1.5,1.5 0 0 0 952.149,375.1 L960.649,375.1 L950.649,365.1" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="239.707" y="383.595" fill="#333" font-size="13" textLength="705.942">Le vocabulaire existe et il est BORNÉ : le socle ne porte pas ce que le point d'application devrait LIRE quand l'appelant est</text><text x="239.707" y="399.947" fill="#333" font-size="13" textLength="595.404">un agent, et le point d'application, quand il existe, peut ne pas couvrir ce qu'on croit (§ 37.5.3, § 37.5.4).</text></g><!--link P1 to P2--><?plantuml-src bLJDQjj04BxhAORqe1ISD8xLEYt6a3Wf689jujoQ7bQx8tk9lAliZ-jI2htcILBt3NgjNgopaatSs85q14BCpiptCukcKY1OXmQr-rfWP6-bAfXXCqWPlvqOxPNewLmRU9LLiL5XfqpeBr9D86EvtUmLc36VkuzQkG6R8OoPicCqShEx6isrKMZWtKQ-85msGVWM0SNP5WkHfLcxFjD6e5dbHS8pNkS3x2gRL15ztvxVwJ3EKRbkzt-HtlEMQ2PFaLRPJII3t34roP_NqiuIn6s4z2HD67-AqCp2inlX1MhgxRrGpGuifTtpGbXsaYKl5TAgWeP7wrtlZORzmJMSNy1vUT_hZ_l30UoFpaUlzu1P63LNk8-6xdNIxh3y3Jc3GkVIoJkFWDP1kPopt9TBxBn9kpVgHbrX-Q2b0shYH04Nf8AkF3KQlFFbBuTrbHBW5SpH2CbTI0qGvg6n80QgN7Aqbac3Ct8PyXWNbF9EQXLgYKqUoZbBVHwgO2v37G4D-kDh68_WvEZeuFYe7MXLedhDNGR4fwFHPRztUbqxSB5su1YsDhp335ppXnbjOUr0-OFuCXEaDe0cc620Nm3XAcThzPct2DgJBTBI5scsQC8HHxZpiSn1L2O6QI8cewfcK77mF3WaDFV1cdAvyiFAyYS9-m0qWKzP8GdtKVocdk03hVZWqrGAWUgpaPEfE-YIw2YgBbsgdTEpwF9VXt4XwRy5w83O1Hfdmwj1UK-8v8FLdDwAb6ZZAZrGAS5mM6WPTXEpeiWbPs69vCZSC59usR-we3f6ro4F1PWpggNnqLfq8q3kdj9OTGP25Ri65EXTnICmq7vkfAcPn0JAJJ1r_yy3jDg7RmzR3LX_9gyFet0bW_w_?></g></svg>