<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:758px;height:361px;background:#FFFFFF;" width="758px" height="361px" viewBox="0 0 758 361" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="9"><rect x="33" y="7" width="335.751" height="208.91" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="43" y="31.028" fill="#57534E" font-size="13" textLength="149.938" font-family="'Segoe UI'">CE QUE LE SOCLE ÉTABLIT</text><line x1="34" y1="34.291" x2="367.751" y2="34.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="43" y="52.319" fill="#000" font-size="13" textLength="155.879" font-weight="700" font-family="'Segoe UI'">La longévité des artefacts</text><text x="43" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="43" y="86.901" fill="#000" font-size="13" textLength="264.31" font-family="'Segoe UI'">Un artefact d'identité de longue durée survit à</text><text x="43" y="104.192" fill="#000" font-size="13" textLength="50.851" font-family="'Segoe UI'">l'horloge</text><text x="43" y="121.483" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="43" y="138.774" fill="#000" font-size="13" textLength="315.751" font-family="'Segoe UI'">Les échéances publiées sont datées et sourcées (§ 21.1)</text><text x="43" y="156.065" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="43" y="173.356" fill="#000" font-size="13" textLength="240.094" font-family="'Segoe UI'">L'inventaire par artefact est dressé (§ 21.3)</text><line x1="34" y1="180.619" x2="367.751" y2="180.619" style="stroke:#B8B2A6;stroke-width:1;"/><text x="43" y="198.647" fill="#000" font-size="13" textLength="183.174" font-weight="700" font-family="'Segoe UI'">faits établis, avec leurs bornes</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="24"><rect x="404.5" y="15.5" width="295.304" height="191.619" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="414.5" y="39.528" fill="#9A3412" font-size="13" textLength="209.155" font-family="'Segoe UI'">CE QUE LE RAISONNEMENT AJOUTE</text><line x1="405.5" y1="42.791" x2="698.804" y2="42.791" style="stroke:#9A3412;stroke-width:1;"/><text x="414.5" y="60.819" fill="#000" font-size="13" textLength="123.43" font-weight="700" font-family="'Segoe UI'">La collecte anticipée</text><text x="414.5" y="78.11" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="414.5" y="95.401" fill="#000" font-size="13" textLength="275.304" font-family="'Segoe UI'">Ce qui est chiffré aujourd'hui peut être conservé</text><text x="414.5" y="112.692" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="414.5" y="129.983" fill="#000" font-size="13" textLength="230.077" font-family="'Segoe UI'">et déchiffré quand l'horloge aura tourné</text><text x="414.5" y="147.274" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="414.5" y="164.565" fill="#000" font-size="13" textLength="234.889" font-family="'Segoe UI'">ni mécanique ni faisabilité datée au socle</text><line x1="405.5" y1="171.828" x2="698.804" y2="171.828" style="stroke:#9A3412;stroke-width:1;"/><text x="414.5" y="189.856" fill="#000" font-size="13" textLength="271.14" font-weight="700" font-family="'Segoe UI'">degré 3 — le raisonnement quitte le socle ici</text></g><!--entity NOTE--><g class="entity" data-qualified-name="NOTE" id="ent0003" data-source-line="38"><rect x="7" y="276" width="737.952" height="71.873" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="300.028" fill="#000" font-size="13" textLength="717.952" font-family="'Segoe UI'">Le socle NE DOCUMENTE PAS la collecte anticipée en vue d'un déchiffrement ultérieur — degré 3. Cette section ne s'écrit pas</text><text x="17" y="317.319" fill="#000" font-size="13" textLength="700.826" font-family="'Segoe UI'">comme un chapitre de fait mais comme un RAISONNEMENT D'ARCHITECTURE appuyé sur des faits établis, et elle dit où le</text><text x="17" y="334.61" fill="#000" font-size="13" textLength="164.988" font-family="'Segoe UI'">raisonnement quitte le socle.</text></g><!--link C1 to C2--><!--link C1 to NOTE--><!--link C2 to NOTE--><?plantuml-src VPJ1SjCm48RlUOeTUWZDq4AIDfJIwOphE4EOa42Jd3ezABPYYpgIAybXuCILEm_0ZGblm1M_2K_2BxiXIQVWGsAjzAzslzsrLHbPHJDbhLfG93GFhL2oPcw4p9Xc2p89YzG78MEQizJmhHsjSXc5IakkgRDbZ_YSvQdjAMc7RC7fqPZ7YjEq_-ZXGsFnYLEplRKvO-5DNBhtLQeqxVNAfrPpuJ4Pfvpy9gnUhzDxzZ8LafzUd5oql0vTrOZEGYSwtJj-Vjm-2ixzWDvD0ne4D1xv-2s-JBoBGNzozhGyTmx50HxyDHe3HgcISR5Q2bki4AGXfYr23QrfD6euCvL_BHJLHSIblJjQAdDEKQwB5IUJQpYXuXj4QJrHEbKnTnu6S5gimgHOCHdYFSjdgO32a04CYfWj5znYdUkmN3p-zPrQpSFcVkcWBkGIzp9KYm1i4n0tq6jk30AwaxJtj_ERCs7TxPRXJlE4s9A7bF9S6xG02kcIlDx1t5h3hp2_yDf7pTOEvigqXVdIwuz7ms7m9XXEo7izcaw2Vx26CSLLd1WeXY93hXLbdzDjBifymaJCvo1AB7yF7b4zmKR6Sw3zOG4WLD9mlInMJWTeaMDx9xdDcOmszE52CxHxhcLrN0fQu3YJuXQ5mmfy39k9j2ffMGc8K8WmvTknHpns_jlq-_DNy2CDdPAIBr0M5xb5JZ2NEa9czx4EHvC0O4zwn-l-xNQwRRzRWXsiXSE0kYD_wZW6zDORK_eWCkAIbgxnwhdSf5_5WX4hLbgWmcMewxWFGTZ5QAfn9udNEfGQ7PinWo12jS3emc6Oi4muqEXmrpwqGAwRxPrYT-lUfV-gFmdyoVGo89Pb-KTSXr4eH-b-zw5Q7DdWisD95J-fPFm_b8UE8YR_u2eH4KRlMeiuiGVdQDCTCpvO4bP7kOOEViZ-1m00?></g></svg>