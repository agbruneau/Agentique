<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:962px;height:418px;background:#FFFFFF;" width="962px" height="418px" viewBox="0 0 962 418" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster P1--><g class="cluster" data-qualified-name="P1" id="ent0001" data-source-line="35"><path d="M9.207,78.67 L105.874,78.67 A4.5,4.5 0 0 1 108.874,81.67 L115.874,102.279 L314.207,102.279 A3,3 0 0 1 317.207,105.279 L317.207,321.67 A3,3 0 0 1 314.207,324.67 L9.207,324.67 A3,3 0 0 1 6.207,321.67 L6.207,81.67 A3,3 0 0 1 9.207,78.67" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="6.207" y1="102.279" x2="115.874" y2="102.279" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="10.207" y="95.203" fill="#444" font-size="14" textLength="96.667" font-weight="700">CE QU'IL VOIT</text></g><!--cluster P2--><g class="cluster" data-qualified-name="P2" id="ent0003" data-source-line="39"><path d="M360.207,78.67 L596.908,78.67 A4.5,4.5 0 0 1 599.908,81.67 L606.908,102.279 L737.207,102.279 A3,3 0 0 1 740.207,105.279 L740.207,321.67 A3,3 0 0 1 737.207,324.67 L360.207,324.67 A3,3 0 0 1 357.207,321.67 L357.207,81.67 A3,3 0 0 1 360.207,78.67" style="stroke:#9C3D14;stroke-width:1.5;" fill="#FDFBF7"/><line x1="357.207" y1="102.279" x2="606.908" y2="102.279" style="stroke:#9C3D14;stroke-width:1.5;"/><text x="361.207" y="95.203" fill="#9C3D14" font-size="14" textLength="236.701" font-weight="700">CE QU'IL NE PEUT PAS SUPPLÉER</text></g><!--entity C1--><g class="entity" data-qualified-name="P1.C1" id="ent0002" data-source-line="36"><rect x="49.207" y="122.67" width="244.15" height="178.484" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="59.207" y="147.203" fill="#1F1F1F" font-size="14" textLength="217.287" font-weight="700">Une arête, à l'instant du passage</text><text x="59.207" y="164.813" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="182.422" fill="#1F1F1F" font-size="14" textLength="93.399">Qui appelle qui</text><text x="59.207" y="200.031" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="217.641" fill="#1F1F1F" font-size="14" textLength="224.15">Ce que la politique dit de cette arête</text><text x="59.207" y="235.25" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="252.859" fill="#1F1F1F" font-size="14" textLength="191.454">Et il peut en produire une trace</text><text x="59.207" y="270.469" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="288.078" fill="#1F1F1F" font-size="14" textLength="222.229" font-weight="700">énumérable — § 37.8.1 et § 37.8.4</text></g><!--entity C2--><g class="entity" data-qualified-name="P2.C2" id="ent0004" data-source-line="40"><rect x="400.207" y="122.67" width="315.634" height="178.484" fill="#FFF" style="stroke:#9C3D14;stroke-width:0.5;" rx="3" ry="3"/><text x="410.207" y="147.203" fill="#1F1F1F" font-size="14" textLength="218.627" font-weight="700">Ce qui ne se lit pas sur une arête</text><text x="410.207" y="164.813" fill="#1F1F1F" font-size="14"> </text><text x="410.207" y="182.422" fill="#1F1F1F" font-size="14" textLength="212.488">La chaîne au-delà du saut courant</text><text x="410.207" y="200.031" fill="#1F1F1F" font-size="14"> </text><text x="410.207" y="217.641" fill="#1F1F1F" font-size="14" textLength="197.688">La fraîcheur du mandat invoqué</text><text x="410.207" y="235.25" fill="#1F1F1F" font-size="14"> </text><text x="410.207" y="252.859" fill="#1F1F1F" font-size="14" textLength="234.951">L'ancrage de l'identité qui se présente</text><text x="410.207" y="270.469" fill="#1F1F1F" font-size="14"> </text><text x="410.207" y="288.078" fill="#1F1F1F" font-size="14" textLength="295.634" font-weight="700">trois entrées, aucune ne dépend du maillage</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="46"><path d="M168.207,363.67 L168.207,400.373 A3,3 0 0 0 171.207,403.373 L944.745,403.373 A3,3 0 0 0 947.745,400.373 L947.745,370.67 L937.745,360.67 L562.207,360.67 L558.207,300.87 L554.207,360.67 L171.207,360.67 A3,3 0 0 0 168.207,363.67" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M937.745,360.67 L937.745,369.17 A1.5,1.5 0 0 0 939.245,370.67 L947.745,370.67 L937.745,360.67" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="174.207" y="379.165" fill="#333" font-size="13" textLength="758.539">Ce qu'il voit EST ÉNUMÉRABLE, et l'énumération est le résultat. Les manques se lisent sur trois entrées, et AUCUNE NE DÉPEND</text><text x="174.207" y="395.517" fill="#333" font-size="13" textLength="640.548">DU MAILLAGE : ce ne sont pas des défauts de mise en œuvre, ce sont des propriétés que l'arête ne porte pas.</text></g><!--link P1 to P2--><?plantuml-src bLJ1RXCn4BtlLupA8PSsA3IY1LMHqdH1bTAGDbqkb8FNdasiRkojxIr228bhpl01t50uy16i-16-XB5tKqBJIiNPmteydZVllSdEf42m3Wrgzxx0o5vALJ33vf0oVZarkbHYe7Dju54Mrbg6dJ6XtqarXOpbTlskm8oLkNkXbHknESA4AJj18zTlXz9S6uK6dgx52y9bKuGF4T0wtEX2P6csLvzf8z0qST7b6Q_Z7hQ9TiEAFcxMFpXWdADolTx_8ZtZkwBJlOtKHDUH37B7r3I_dyjUraNSH4ZtqoxZjn4wcV_TZV00DhLx3sHp1vRIxduYBDlFkWybiXiM5OzMNcyDOZXDMiT3UFtg-7mBc8Lnfm7xg-BMGTfB508prNU7sr1zXRmbbQLZ1w8aPwtrpZvEUnVgGfsM4bXHO4vNhqhfGmF_Xf0pA7GkdVGR8Uao0aVdLgLzQkn0vb1WwG0L54QBKXg4al2TOJpaK3_LKfNpQcbOIYY_Fts1dzzWTw-zt-u0kfjDr_SKQ0qwT_CUnJ2EatCOzoSmISRZORM8pseXdi26k_zg4bX9eCuiSICw90JOqeHcQqOhJOOC-8nLF_n1kICm9mr9ESk89jUb8IMRjCnG6fyXbQ64ELE2aIBgMb-LrJBaj9ZYnhCWzSW7GGrALor3BzH8OQgbfTXAAMUqjAIbepZQRSBdlZzwHBKiK8aQH-Pvus6jrpfxBntDnSwRcHG4zzR8wSpjz4YYA0hZcMhdz3mAWhJ8lcjDQiIJSwWMe-IaMfpr3uVnjdScRzquvwHMW9PY2Bvd-d0nruOXMa-RHiJMkdeoGTRRJAXSFnaaP24zHzLY78-EegC4Jlh7ms7_PGpFQRg2FVGV2EO8gaciwIFf_0RcLDoFsQ_FvRMXoUPDhi-ZqIkCh9OahQsdjrLxwYiMsj0BbMn7Na4lmXy0?></g></svg>