<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:762px;height:752px;background:#FAF8F5;" width="762px" height="752px" viewBox="0 0 762 752" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="762" height="752" fill="#FAF8F5" style="stroke:none;"/><g class="title" data-source-line="18"><text x="164.089" y="24.533" fill="#8B2E0B" font-size="14" textLength="427.8" font-weight="700" font-family="'DejaVu Sans'">CINQ COMPOSANTS, CINQ HORLOGES, UN SEUL EXPLOITANT</text></g><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="20"><rect x="47.989" y="45.609" width="660" height="72.828" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="57.989" y="70.143" fill="#000" font-size="14" textLength="126.813" font-weight="700" font-family="'DejaVu Sans'">1  Poids de modèle</text><text x="57.989" y="87.752" fill="#000" font-size="14" textLength="425.243" font-family="'DejaVu Sans'">Version publiée par son fournisseur ; retrait d'une version antérieure.</text><text x="57.989" y="105.361" fill="#000" font-size="14" textLength="391.016" font-style="italic" font-family="'DejaVu Sans'">décidé par le fournisseur, pas l'exploitant — ch. 6 § 6.3 ; § 47.8</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="21"><rect x="47.989" y="178.609" width="660" height="72.828" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="57.989" y="203.143" fill="#000" font-size="14" textLength="128.598" font-weight="700" font-family="'DejaVu Sans'">2  Serveurs d'outils</text><text x="57.989" y="220.752" fill="#000" font-size="14" textLength="376.906" font-family="'DejaVu Sans'">Révision d'une définition d'outil ; ajout ou retrait d'un serveur.</text><text x="57.989" y="238.361" fill="#000" font-size="14" textLength="597.611" font-style="italic" font-family="'DejaVu Sans'">décidé par l'éditeur, et le protocole autorise le changement à l'exécution — ch. 20 § 20.1 ; § 47.4</text></g><!--entity C3--><g class="entity" data-qualified-name="C3" id="ent0003" data-source-line="22"><rect x="47.989" y="311.609" width="660" height="72.828" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="57.989" y="336.143" fill="#000" font-size="14" textLength="157.903" font-weight="700" font-family="'DejaVu Sans'">3  Bibliothèques et hôte</text><text x="57.989" y="353.752" fill="#000" font-size="14" textLength="306.612" font-family="'DejaVu Sans'">Mise à jour de dépendance ; correctif de sécurité.</text><text x="57.989" y="371.361" fill="#000" font-size="14" textLength="324.55" font-style="italic" font-family="'DejaVu Sans'">décidé par la chaîne de distribution — § 47.2, § 47.3</text></g><!--entity C4--><g class="entity" data-qualified-name="C4" id="ent0004" data-source-line="23"><rect x="47.989" y="444.609" width="660" height="72.828" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="57.989" y="469.143" fill="#000" font-size="14" textLength="160.262" font-weight="700" font-family="'DejaVu Sans'">4  Invites et instructions</text><text x="57.989" y="486.752" fill="#000" font-size="14" textLength="324.857" font-family="'DejaVu Sans'">Édition d'un fichier, sans compilation ni déploiement.</text><text x="57.989" y="504.361" fill="#000" font-size="14" textLength="351.812" font-style="italic" font-family="'DejaVu Sans'">décidé par quiconque a accès au dépôt — § 47.7, § 47.8</text></g><!--entity C5--><g class="entity" data-qualified-name="C5" id="ent0005" data-source-line="24"><rect x="47.989" y="577.609" width="660" height="72.828" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="57.989" y="602.143" fill="#000" font-size="14" textLength="170.563" font-weight="700" font-family="'DejaVu Sans'">5  Politique d'autorisation</text><text x="57.989" y="619.752" fill="#000" font-size="14" textLength="370.282" font-family="'DejaVu Sans'">Révision d'une règle, d'une portée, d'un seuil d'approbation.</text><text x="57.989" y="637.361" fill="#000" font-size="14" textLength="301.068" font-style="italic" font-family="'DejaVu Sans'">décidé par l'exploitant — et c'est le seul des cinq</text></g><!--link C1 to C2--><!--link C2 to C3--><!--link C3 to C4--><!--link C4 to C5--><g class="legend" data-source-line="31"><rect x="12" y="670.438" width="731.978" height="62.828" fill="#FBF9F5" style="stroke:#BBB;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="689.971" fill="#000" font-size="14" textLength="721.978" font-family="'DejaVu Sans'">UN SEUL DES CINQ EST DÉCIDÉ PAR L'EXPLOITANT. Les quatre autres changent sous la main d'un fournisseur,</text><text x="17" y="707.58" fill="#000" font-size="14" textLength="632.673" font-family="'DejaVu Sans'">d'un éditeur, d'une chaîne de distribution ou de quiconque a accès au dépôt — et le protocole autorise</text><text x="17" y="725.189" fill="#000" font-size="14" textLength="254.789" font-family="'DejaVu Sans'">le deuxième à changer À L'EXÉCUTION.</text></g><?plantuml-src XLJDRXf94BxFKvIy1oIB4FDZnwjObimO4YGCNcCdAsroQ6OQgAId6_UFa-ngfLnptmVOsy9bJtc2p9laILBTCpOGY8BGgAUc-gll-wgwpLkKSwPP1cEMl9rgvMGQAw4q_D8zwnvt3oFpa65cB5NlK4vXmeJXQrzIFc5EsAwITi0o3dld_0rxuM34fDbRoxDe1VTPPOdZTgDpq5vBq3onJ4u5RokTSbscjSDlPzeMwSDklREUAlYKotGxhztzTKDScRUZR7HYx0V1JwE7gl1N17214ZENlSJKpk2eTK2XvqhZdwIEYJE1KvbnQGbtOgE_evF79KWKF82uD_WDuk75vN1qDhWULOl0y-5LV_YiGwyt0nXrRlhG-VsoF-nTKqwqLdzlVxyESAamDUGzP2hD5uBlxx-IBxWsg2JCtLXWlkH0wi1GOAASbcWCTngUae5MCxIGLfpaS5TkOjBcIusKmcklv0cUflaoGNe45Agx1bAbc05HuU_dGY7nil3rup-Gp6fm15_-WwDQa-hGelMaTdpo64_tWFBZ-gQA1i28wpl28o4LvImAusLSvSix39mAXiHXGdxR8XBo29szeHKejo47J06uIq4bNwPe0tlkMmDphQnA5AsOizGzmtqqcH517jgN_niq4eeBnUyrDWwyjiP1hVwWihLIsTXKsGHe8_L3sLc-k7NS-Egp_BCDBRlmLQaEYT6-cyHsJgF8PC89Er7QO-74VpAU