<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:768px;height:348px;background:#FFFFFF;" width="768px" height="348px" viewBox="0 0 768 348" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster UN SIGLE, QUATRE OBJETS--><g class="cluster" data-qualified-name="UN SIGLE. QUATRE OBJETS" id="ent0001" data-source-line="32"><rect x="7" y="7" width="747" height="255" fill="#FFF" style="stroke:#E0DDD7;stroke-width:1.5;" rx="2" ry="2"/><text x="297.803" y="23.028" fill="#9E3A14" font-size="13" textLength="165.395" font-weight="700" font-family="'Segoe UI'">UN SIGLE, QUATRE OBJETS</text></g><!--entity B1--><g class="entity" data-qualified-name="UN SIGLE. QUATRE OBJETS.B1" id="ent0002" data-source-line="33"><rect x="23.5" y="51.5" width="346.777" height="71.873" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="33.5" y="75.528" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">a</text><text x="40.495" y="75.528" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="47.617" y="75.528" fill="#222" font-size="13" textLength="103.791" font-weight="700" font-family="'Segoe UI'">ACP protocolaire</text><text x="33.5" y="92.819" fill="#222" font-size="13" textLength="326.777" font-family="'Segoe UI'">Agent Communication Protocol d'IBM Research et BeeAI.</text><text x="33.5" y="110.11" fill="#666" font-size="13" textLength="294.157" font-family="'Segoe UI'">fusionné en août 2025 — jamais un standard vivant</text></g><!--entity B2--><g class="entity" data-qualified-name="UN SIGLE. QUATRE OBJETS.B2" id="ent0003" data-source-line="38"><rect x="396" y="43" width="341.864" height="89.164" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="406" y="67.028" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">b</text><text x="414.062" y="67.028" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="421.184" y="67.028" fill="#222" font-size="13" textLength="133.625" font-weight="700" font-family="'Segoe UI'">Agentic Control Plane</text><text x="406" y="84.319" fill="#222" font-size="13" textLength="321.864" font-family="'Segoe UI'">Programme d'un consortium d'institutions financières et</text><text x="406" y="101.61" fill="#222" font-size="13" textLength="136.525" font-family="'Segoe UI'">de télécommunications.</text><text x="406" y="118.901" fill="#666" font-size="13" textLength="194.003" font-family="'Segoe UI'">annoncé en juillet 2026 — Livre III</text></g><!--entity B3--><g class="entity" data-qualified-name="UN SIGLE. QUATRE OBJETS.B3" id="ent0004" data-source-line="44"><rect x="43.5" y="157" width="352.56" height="89.164" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="53.5" y="181.028" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">c</text><text x="59.74" y="181.028" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="66.862" y="181.028" fill="#222" font-size="13" textLength="151.963" font-weight="700" font-family="'Segoe UI'">« agentic control plane »</text><text x="53.5" y="198.319" fill="#222" font-size="13" textLength="332.56" font-family="'Segoe UI'">Expression employée par IBM pour positionner un produit</text><text x="53.5" y="215.61" fill="#222" font-size="13" textLength="89.343" font-family="'Segoe UI'">d'orchestration.</text><text x="53.5" y="232.901" fill="#666" font-size="13" textLength="226.142" font-family="'Segoe UI'">positionnement commercial, à attribuer</text></g><!--entity B4--><g class="entity" data-qualified-name="UN SIGLE. QUATRE OBJETS.B4" id="ent0005" data-source-line="50"><rect x="431.5" y="165.5" width="248.903" height="71.873" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="441.5" y="189.528" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">d</text><text x="449.549" y="189.528" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="456.671" y="189.528" fill="#222" font-size="13" textLength="105.473" font-weight="700" font-family="'Segoe UI'">Composante ACP</text><text x="441.5" y="206.819" fill="#222" font-size="13" textLength="228.903" font-family="'Segoe UI'">De la couche d'infrastructure agentique.</text><text x="441.5" y="224.11" fill="#666" font-size="13" textLength="213.415" font-family="'Segoe UI'">ni intitulé ni identité établis — lacune</text></g><!--link B1 to B2--><!--link B3 to B4--><!--link B1 to B3--><!--link B2 to B4--><g class="legend" data-source-line="62"><rect x="71.294" y="282" width="618.412" height="47.242" fill="#F7F5F0" style="stroke:#C4BEB5;stroke-width:1;" rx="2" ry="2"/><text x="76.294" y="302.107" fill="#333" font-size="14" textLength="608.412" font-family="'Segoe UI'">Quatre objets, un seul sigle, et aucun n'est l'autre. La quatrième branche n'a NI INTITULÉ COMPLET</text><text x="76.294" y="320.729" fill="#333" font-size="14" textLength="436.987" font-family="'Segoe UI'">NI IDENTITÉ ÉTABLIS — c'est une lacune du socle, non une abréviation.</text></g><?plantuml-src TPJFRjj64CRlUeg1Uz35IMn9Zjl2441ALC52SPn8FWKv3CcHlFPgbza_RjqYGAwvzm5whD17o2ryapv9Pod6faEB1m7wTdPdVj_ChjCbE0sPTavle126SYUqwbs9Wi0wCgJTNKazUoDKYGOtK69-WsjQk3j94C9HhMKx8EE0jT5U5HCjjO4VPlNNYYXeXLwwcLRk73S41mjQQuBBzE3fe8NuW-1us5gqLrZetuHQmmgbRMTl4Xj51aOjNUc2B9KmE6a7exffn2uX_Da3YFV0y8es1Pb6JOwcq-afgw7SHlif6KR7eqRRsPLfMVG-jdFT6xWdMpGxdGs-pnR_60-Zw76sGVqzFbpIcbJHFVHqTZ8xwiQrKqn6SHAVT69Q2OVrr-jzS-lWyXmMwI_pv13UN4RBjmcyZdzDbek3cko1Cpw6Tom0dENXe9yRdyPdsHZFNcJZinUrFkQ0R1nDBg0qscdMa8Sp1DIR8wx6mKHlDbw97CFCmaKJ24K_ZL_1M-utclmAo45C5ANF7wLzMN_ZbRUyLrLR80MegoyE1aU34_ZlqrzmZHiK5hpYcu2gG5F0hRX5vRxLo0U-Vmmts0kNTU42WyYPGZd3PLz8L0-4JBDcu_bw57sk8DVAQkE4vvlH5yewuNoWjh0I2bK