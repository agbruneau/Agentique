<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:733px;height:378px;background:#FFFFFF;" width="733px" height="378px" viewBox="0 0 733 378" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="9"><rect x="73.5" y="24" width="278.426" height="191.619" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="83.5" y="48.028" fill="#57534E" font-size="13" textLength="176.001" font-family="'Segoe UI'">CE QUE LA FRONTIÈRE REÇOIT</text><line x1="74.5" y1="51.291" x2="350.926" y2="51.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="83.5" y="69.319" fill="#000" font-size="13" textLength="48.026" font-weight="700" font-family="'Segoe UI'">Spécifié</text><text x="83.5" y="86.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="83.5" y="103.901" fill="#000" font-size="13" textLength="206.54" font-family="'Segoe UI'">Une carte d'agent, publiée et signée</text><text x="83.5" y="121.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="83.5" y="138.483" fill="#000" font-size="13" textLength="206.946" font-family="'Segoe UI'">Un chemin de découverte normalisé</text><text x="83.5" y="155.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="83.5" y="173.065" fill="#000" font-size="13" textLength="258.426" font-family="'Segoe UI'">Des capacités déclarées par l'agent lui-même</text><line x1="74.5" y1="180.328" x2="350.926" y2="180.328" style="stroke:#B8B2A6;stroke-width:1;"/><text x="83.5" y="198.356" fill="#000" font-size="13" textLength="161.23" font-weight="700" font-family="'Segoe UI'">la découverte est spécifiée</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="23"><rect x="386.5" y="7" width="256.431" height="226.201" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="396.5" y="31.028" fill="#9A3412" font-size="13" textLength="232.972" font-family="'Segoe UI'">CE QU'ELLE DOIT PRODUIRE ELLE-MÊME</text><line x1="387.5" y1="34.291" x2="641.931" y2="34.291" style="stroke:#9A3412;stroke-width:1;"/><text x="396.5" y="52.319" fill="#000" font-size="13" textLength="76.127" font-weight="700" font-family="'Segoe UI'">Non spécifié</text><text x="396.5" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="396.5" y="86.901" fill="#000" font-size="13" textLength="124.649" font-family="'Segoe UI'">Le critère d'admission</text><text x="396.5" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="396.5" y="121.483" fill="#000" font-size="13" textLength="236.431" font-family="'Segoe UI'">L'ancrage de la clé dans une organisation</text><text x="396.5" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="396.5" y="156.065" fill="#000" font-size="13" textLength="226.732" font-family="'Segoe UI'">La vérification de ce que l'agent déclare</text><text x="396.5" y="173.356" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="396.5" y="190.647" fill="#000" font-size="13" textLength="187.922" font-family="'Segoe UI'">Le verdict, et sa durée de validité</text><line x1="387.5" y1="197.91" x2="641.931" y2="197.91" style="stroke:#9A3412;stroke-width:1;"/><text x="396.5" y="215.938" fill="#000" font-size="13" textLength="140.842" font-weight="700" font-family="'Segoe UI'">l'admission ne l'est pas</text></g><!--entity NOTE--><g class="entity" data-qualified-name="NOTE" id="ent0003" data-source-line="39"><rect x="7" y="293" width="712.637" height="71.873" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="317.028" fill="#000" font-size="13" textLength="692.637" font-family="'Segoe UI'">La grille du ch. 14 N'EST PAS APPLIQUÉE ici : ce chapitre instruit Q-C, il ne rend pas de verdict mécanisme par mécanisme</text><text x="17" y="334.319" fill="#000" font-size="13" textLength="683.725" font-family="'Segoe UI'">(ch. 17 § 17.0). La découverte est spécifiée ; l'admission ne l'est pas — et l'écart entre les deux est tout entier à la charge</text><text x="17" y="351.61" fill="#000" font-size="13" textLength="110.633" font-family="'Segoe UI'">de celui qui décide.</text></g><!--link C1 to C2--><!--link C1 to NOTE--><!--link C2 to NOTE--><?plantuml-src VPJDJXin4CVlUOeH7D9692K40WM459AD52aaa90Juc1iindXjRUsDwrwwgqVvpv0Rstw6DqtwPDqlCj7Kj7k8H_Z-VZFRyRhJGhUm8tntYGWq4hkqUYAkqETCiiIS7Ccp5lKCTmovUJAYJMP5jnOBIsqL-n2th9C-RxHViGI2HjJ6Hi9iy76yqvJV2-XsLevl67yBYxITuqo5ZRxnLEf17bCnqf2jqdMJh_TtpvIgENXwS7fJgSDLnM0Onw23ZVtzlTQkz59DuABMGJ33lGduz7b8FyqYM0IvH_7WylZLuNl2KNLwQ6lMcsQvakEjvWlQxKAMMPQ0cVMIn1L5aljjo3DRXITIv0U7CQQVfQUmESoGKtTWQ0i9bl84AYDJPX2bo-3MqywIfWoZZvVki9HCKiv753xeCege3Ai9_dFHAwAKsmjiNGau56l9C7NQv1s7j2La5vtMhlDdJL8fQc4L8s6mmXwn0NE9-FUR42WWgb-bdyvYvvZDJ9wfNx9QqYuBBNsmnR4H8BEXPKAHrMckQNs0Y1gXQjy2O9f1nb1DZPc6Xtp3zuC5ldIKcfUs48Gb_0cau-Cxjd9-xe4HI2d0OMv4AaiK0rX2w8l0kurba_YG8USWMRAtDyKH-FBY3WUzFSUbgtNxhMwlO8ZYOmjAd8J6Ks_0SrT65MZAI7iJA5pVZuSNCpopn4WHpWC-lcSfUW93chdROOUBkhTBK0LH5YfHT1GY2wxWOIQ363eAeNzUFfBvLyK9VVXrtVwR6o_R0H1_zaGE89_jGs_FtmDu5Gr5B0U232fL3A8oTuLcRp92ZlIbS-_5IESCni79SLmQ6TfFbWeG24R0IJTrFhL78MG-jfYFFVr4rhCDJEzO3HP0-WAxUnpzZy0?></g></svg>