<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:844px;height:415px;background:#FFFFFF;" width="844px" height="415px" viewBox="0 0 844 415" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster CADRE--><g class="cluster" data-qualified-name="CADRE" id="ent0001" data-source-line="12"><rect x="7" y="7" width="823" height="322" fill="#FFFDF9" style="stroke:#9A3412;stroke-width:1;" rx="3" ry="3"/><text x="298.171" y="23.028" fill="#000" font-size="13" textLength="240.659" font-weight="700" font-family="'Segoe UI'">QUATRE SUBSTITUTS, QUATRE ÉCARTS</text></g><!--entity S1--><g class="entity" data-qualified-name="CADRE.S1" id="ent0002" data-source-line="13"><rect x="98.5" y="43" width="313.427" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="108.5" y="67.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">1</text><text x="115.978" y="67.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="123.1" y="67.028" fill="#000" font-size="13" textLength="75.353" font-weight="700" font-family="'Segoe UI'">Carte signée</text><line x1="99.5" y1="70.291" x2="410.927" y2="70.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="108.5" y="88.319" fill="#000" font-size="13" textLength="293.427" font-family="'Segoe UI'">La carte d'agent, signée et vérifiée hors bande — le</text><text x="108.5" y="105.61" fill="#000" font-size="13" textLength="195.235" font-family="'Segoe UI'">mécanisme existe et il est spécifié.</text><line x1="99.5" y1="112.873" x2="410.927" y2="112.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="108.5" y="130.901" fill="#57534E" font-size="13" textLength="278.072" font-family="'Segoe UI'">ne fournit pas l'ancrage organisationnel de la clé</text></g><!--entity S2--><g class="entity" data-qualified-name="CADRE.S2" id="ent0003" data-source-line="22"><rect x="477" y="43" width="321.869" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="487" y="67.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">2</text><text x="494.478" y="67.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="501.6" y="67.028" fill="#000" font-size="13" textLength="65.438" font-weight="700" font-family="'Segoe UI'">Inscription</text><line x1="478" y1="70.291" x2="797.869" y2="70.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="487" y="88.319" fill="#000" font-size="13" textLength="301.869" font-family="'Segoe UI'">Un registre interne, tenu par l'exploitant du maillage,</text><text x="487" y="105.61" fill="#000" font-size="13" textLength="145.564" font-family="'Segoe UI'">avec ses propres champs.</text><line x1="478" y1="112.873" x2="797.869" y2="112.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="487" y="130.901" fill="#57534E" font-size="13" textLength="293.973" font-family="'Segoe UI'">ne fournit pas l'opposabilité inter-organisationnelle</text></g><!--entity S3--><g class="entity" data-qualified-name="CADRE.S3" id="ent0004" data-source-line="31"><rect x="23" y="208" width="433.88" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="33" y="232.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">3</text><text x="40.478" y="232.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="47.6" y="232.028" fill="#000" font-size="13" textLength="110.652" font-weight="700" font-family="'Segoe UI'">Chaîne de mandat</text><line x1="24" y1="235.291" x2="455.88" y2="235.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="33" y="253.319" fill="#000" font-size="13" textLength="327.438" font-family="'Segoe UI'">L'échange de jeton RFC 8693 et son attribut d'acteur — à</text><text x="33" y="270.61" fill="#000" font-size="13" textLength="193.965" font-family="'Segoe UI'">un saut, dans un domaine unique.</text><line x1="24" y1="277.873" x2="455.88" y2="277.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="33" y="295.901" fill="#57534E" font-size="13" textLength="413.88" font-family="'Segoe UI'">ne fournit ni la composition au-delà du premier saut, ni l'interrogeabilité</text></g><!--entity S4--><g class="entity" data-qualified-name="CADRE.S4" id="ent0005" data-source-line="40"><rect x="492.5" y="208" width="320.815" height="105.164" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="502.5" y="232.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">4</text><text x="509.978" y="232.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="517.1" y="232.028" fill="#000" font-size="13" textLength="74.35" font-weight="700" font-family="'Segoe UI'">Attestations</text><line x1="493.5" y1="235.291" x2="812.315" y2="235.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="502.5" y="253.319" fill="#000" font-size="13" textLength="300.815" font-family="'Segoe UI'">Rien de protocolaire : un inventaire documentaire, lu</text><text x="502.5" y="270.61" fill="#000" font-size="13" textLength="97.233" font-family="'Segoe UI'">par des humains.</text><line x1="493.5" y1="277.873" x2="812.315" y2="277.873" style="stroke:#B8B2A6;stroke-width:1;"/><text x="502.5" y="295.901" fill="#57534E" font-size="13" textLength="247.533" font-family="'Segoe UI'">ne fournit rien de ce qui en ferait une pièce</text></g><!--link S1 to S2--><!--link S3 to S4--><!--link S1 to S3--><!--link S2 to S4--><g class="legend" data-source-line="55"><rect x="31.067" y="349" width="774.866" height="47.242" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:1;" rx="3" ry="3"/><text x="36.067" y="369.107" fill="#000" font-size="14" textLength="764.866" font-family="'Segoe UI'">Aucun substitut n'est une pièce : chacun règle le problème CHEZ SOI et le laisse entier à la frontière. La quatrième n'a même</text><text x="36.067" y="387.729" fill="#000" font-size="14" textLength="704.99" font-family="'Segoe UI'">pas de substitut protocolaire — ce qui en tient lieu est documentaire, tenu hors du maillage et lu par des humains.</text></g><?plantuml-src bPNDRXf94CVlF4N9EI0XI0A3MTk9B64mMakhhDR09L4EpKmnK-kUxd5_UADTHTfhxdc074qEUObvapn9gXjRvYE9OYxGNHzT_Qj_5qvNu3Gij7EwX8mCfewqQjWhKfKmeWHRY4p_Gog7fP0MDon6UvMbsYWqCDZOpt0fl7GJhTmhKI8SJ37N2FEBW-yxJUbVX6woOLo8z2gFwKTQQWDF9l6puI4nHvMTxVaTJGudp_VzjCdGtFcC1-DaDFw1pwoWz4gXjT1jD08CeNB9L_XhFfnTdiDqVZQTNSpcisaRxhRg3wFXvMnw0CB2Q3ZcdL3jU7ByGfB2a-DXqk_suBy6m4EwQPUTXfF1vFdQwUpeh3SSm1js0dYPXZfFdgmZJrkjRglrybdSF0LejKR2E0HBkQfNs6h5c0v_uey_1AJHdZK5tygrxnq17TpKAqDB2gj26ykOLORmzV-FZ216b_Kg5OeiDmtVaNKnYYIWTM0hDiRefzj7tjTx-DjXqZy_LGXBxOqY1nKZaKsXKiErW3Pvo2s2lXHALW18hbRMg_lRSRgtZMrGlSU0wcs3kb0sDLI5ytOnpHKValCD3G8fXwpXDZXKdcisN3E-gwGcBi91vg4K92LVeHrZnGscOD52PNHb-3ijH5dPHrBHLQMjM90aLw_MDNHs24dy2PZaCM2I7GKLelx25N47IfQ0S7igQdAl2puf-loDJYkud8pWQ72S14bONWld32sy2qfB7NeJXLH_YWcy0YiygoyJoePLfXaY7-aLNNlyPLQAeaPqoR0eO07XEndA-bFe2zClYOVF-gZWsumWZSxn7krF4FOVWx2_ZN3e73-As2cxI--IK0Lkh0-dEKJmL8MJG87K3R_9kCvqwikxHHkaZv51V1ahgl21rgzBojoTc29SUm9UBD48DdXsggY-JVUan2EeywQWB4Frrb1UkCuflxPWIBvZwEz4y3-22lj9sE_jx_SRxnkDzLnbZw5FWo3ymZfoh1ZL30FbeJQ6mseBFgQ-3QsH4Tv2rhSyYKQ_dx-6wPyNGNZ19iXQ7apAXTQp45WWIyD_8vpAuDCm0Q-zO6t6ODKKFDK-bs6-XOV7a1xgs6fGKEy3FqxERryI-ZZyjhiL1qMSe1l38PRdzrl82DOWlW40?></g></svg>