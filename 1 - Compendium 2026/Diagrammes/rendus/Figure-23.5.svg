<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:834px;height:763px;background:#FFFFFF;" width="834px" height="763px" viewBox="0 0 834 763" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster CADRE--><g class="cluster" data-qualified-name="CADRE" id="ent0001" data-source-line="12"><rect x="34.758" y="7" width="758" height="652" fill="#FFFDF9" style="stroke:#9A3412;stroke-width:1;" rx="3" ry="3"/><text x="241.321" y="23.028" fill="#000" font-size="13" textLength="344.875" font-weight="700" font-family="'Segoe UI'">CE QUE LE SOCLE ÉTABLIT, ET CE QUE L'AUTEUR EN TIRE</text></g><!--entity R1--><g class="entity" data-qualified-name="CADRE.R1" id="ent0002" data-source-line="13"><rect x="50.758" y="43" width="725.758" height="71.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="60.758" y="67.028" fill="#9A3412" font-size="13" textLength="60.15" font-weight="700" font-family="'Segoe UI'">OO4/OO3</text><text x="120.908" y="67.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="131.591" y="67.028" fill="#000" font-size="13" textLength="179.251" font-weight="700" font-family="'Segoe UI'">Workflows à base de graphes</text><text x="60.758" y="84.319" fill="#000" font-size="13" textLength="705.758" font-family="'Segoe UI'">Le graphe est un cadre explicite extérieur aux agents — le rang dépend de ce que les agents invoqués savent du processus.</text><text x="60.758" y="101.61" fill="#57534E" font-size="13" textLength="145.71" font-family="'Segoe UI'">Agent Framework, GA 1.0</text></g><!--entity R2--><g class="entity" data-qualified-name="CADRE.R2" id="ent0003" data-source-line="19"><rect x="176.758" y="175" width="473.984" height="71.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="186.758" y="199.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">—</text><text x="199.758" y="199.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="210.441" y="199.028" fill="#000" font-size="13" textLength="111.478" font-weight="700" font-family="'Segoe UI'">Points de contrôle</text><text x="186.758" y="216.319" fill="#000" font-size="13" textLength="453.984" font-family="'Segoe UI'">Instrument de la propriété de traçabilité, non une option d'orchestration en soi.</text><text x="186.758" y="233.61" fill="#57534E" font-size="13" textLength="156.825" font-family="'Segoe UI'">limites en multi-conteneurs</text></g><!--entity R3--><g class="entity" data-qualified-name="CADRE.R3" id="ent0004" data-source-line="25"><rect x="166.258" y="307" width="494.894" height="71.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="176.258" y="331.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">—</text><text x="189.258" y="331.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="199.941" y="331.028" fill="#000" font-size="13" textLength="139.204" font-weight="700" font-family="'Segoe UI'">Humain dans la boucle</text><text x="176.258" y="348.319" fill="#000" font-size="13" textLength="474.894" font-family="'Segoe UI'">Point d'arrêt de supervision ; critère de sélection du § 22.3, non un positionnement.</text><text x="176.258" y="365.61" fill="#57534E" font-size="13" textLength="145.71" font-family="'Segoe UI'">Agent Framework, GA 1.0</text></g><!--entity R4--><g class="entity" data-qualified-name="CADRE.R4" id="ent0005" data-source-line="31"><rect x="201.258" y="439" width="425.469" height="71.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="211.258" y="463.028" fill="#9A3412" font-size="13" textLength="36.829" font-weight="700" font-family="'Segoe UI'">aucun</text><text x="248.087" y="463.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="258.77" y="463.028" fill="#000" font-size="13" textLength="99.042" font-weight="700" font-family="'Segoe UI'">Agents durables</text><text x="211.258" y="480.319" fill="#000" font-size="13" textLength="405.469" font-family="'Segoe UI'">Aucun positionnement proposé : le niveau de preuve ne le permet pas.</text><text x="211.258" y="497.61" fill="#57534E" font-size="13" textLength="228.338" font-family="'Segoe UI'">repérage [C], ne porte aucun fait central</text></g><!--entity R5--><g class="entity" data-qualified-name="CADRE.R5" id="ent0006" data-source-line="37"><rect x="146.758" y="571" width="533.729" height="71.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="156.758" y="595.028" fill="#9A3412" font-size="13" textLength="27.193" font-weight="700" font-family="'Segoe UI'">OO1</text><text x="183.951" y="595.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="194.634" y="595.028" fill="#000" font-size="13" textLength="110.957" font-weight="700" font-family="'Segoe UI'">Bus d'événements</text><text x="156.758" y="612.319" fill="#000" font-size="13" textLength="513.729" font-family="'Segoe UI'">Le protocole agent-agent sans cadre de processus explicite est la définition même d'OO1.</text><text x="156.758" y="629.61" fill="#57534E" font-size="13" textLength="238.043" font-family="'Segoe UI'">préversion publique sur dorsale rejouable</text></g><!--link R1 to R2--><!--link R2 to R3--><!--link R3 to R4--><!--link R4 to R5--><g class="legend" data-source-line="49"><rect x="12" y="679" width="803.516" height="65.863" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:1;" rx="3" ry="3"/><text x="17" y="699.107" fill="#000" font-size="14" textLength="783.843" font-family="'Segoe UI'">Le POSITIONNEMENT EST UNE CONSTRUCTION D'AUTEUR. Le socle établit ce que chaque produit livre ; il ne le situe pas sur la</text><text x="17" y="717.729" fill="#000" font-size="14" textLength="793.516" font-family="'Segoe UI'">taxonomie. Un patron dont le régime de preuve est un simple repérage [C] ne reçoit AUCUN positionnement — et c'est le cas de</text><text x="17" y="736.35" fill="#000" font-size="14" textLength="80.691" font-family="'Segoe UI'">l'un des cinq.</text></g><?plantuml-src hLNDRY974BxFKvIy1oHai-RFsRLNbWOOiaWER61G3fOFpKmPEkxf7dTFOojHf5nppmFavh3dF47cJV8agMvWmuApafLm6A2gkllxlgxwfb0v50fcgYXK1YdNc1HSoS3SSPappJ8m2vQg1oxdSCk4mPsCLbQcYT8IDPpjn5EyPLOKVIMB8SiGZYOuLmZJmT7pHHF-0qAzkPESiUHkxhVlAg4qlEhxpqw5m3dAj7DGzwRVxfyUrYcTejxKzCvwpMxlNshY1K_k91e3zI1mOZ0v5qIX6y6tqmYk8fYCklGiVud3pjKWFeOeXcso4axZQ3g6Q0ZnO1mT0JFG3NlZo1FezTzU22xn_6tORDKRy6C0yCy9upeLXVsp_kcwgFEcqmZFu9gA0Dub3lhvg_NAosfrD6gz7esQrUgxrpvrIKNLwdTAtzqAzM2W_8qqD4WgmropV86cMlKxNMq3WAO0Ao5XgQO_ZxdW2I_Shw9SQOvM0xEFm4YQmi1VF_zACe4ch92MgvpqSdid2FSMAMEsXLmkrRqjLmOCMr84KWkvLWafQatjCpBjhzhDLdGPkeNGful01y9_35-7KA-TRedHaflWSwKQBr6AaE-fz45nXzJ1f-RJvHy2D-8Cf2cqpJniOiKSybppSaMIk4YXMVd4Pbnm2Xo3L98KH52v6nb8Aqedf3HL-VyemIZ-B6V1CzBQk9ACXe2VE2GeINJp1TxD_yRxlSqO9vXC6iTjfcpoYRdNX1WmhSkFdhsnEUebDux91IIQAF-kVKEPSYNMBk4kzyydQ3HgpQqQa2l3NKwYq_5_kl7MIvWpcrYvnprSTsTgDPk9JyCGkieznFxE5N64SzVnaY-HMKSxrsYN573j3gHDXbJBdkzfZJaD4Oq4N7TlZjsQN6aQBW-DV9GND3hKUqnyWNJxPOPGtwFSiSItKgwMvMhDRCS2Y6EXg1RNOtlYdpInr1bhF_1yDrExQmxa6TGwv02tN7hH82i_aiMd5GBmh1Iv9WYeVH_bTYQuCmn3xf8gRPZp5FnUMNSh-rAG8vvSBtYQehoXDv0ykQJHT_76ORpfuit3UCl5MuVnTl1J4AnzF_2AV1XD1l5WD1n6tqJ36A993DDX1DtHS1AFfrsNWjx6tsjkWL4qFK3MGD3zTNedJ1RCVP5sgQMeu4iIymAusFGDTPfBqtl1II0O7LwmHoLLnh46KvA85TeD5lc1DznoDUSPxlJVnhODpt8ltawZkJCqba-AJWwdtUbmlxMTYrFN9XL_ZuIMEHia3A92MwPaI0cNzxM0L5bhypS0?></g></svg>