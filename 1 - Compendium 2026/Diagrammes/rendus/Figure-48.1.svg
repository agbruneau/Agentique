<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:797px;height:290px;background:#FAF8F5;" width="797px" height="290px" viewBox="0 0 797 290" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="797" height="290" fill="#FAF8F5" style="stroke:none;"/><g class="title" data-source-line="11"><text x="219.338" y="24.533" fill="#8B2E0B" font-size="14" textLength="351.818" font-weight="700" font-family="'DejaVu Sans'">TROIS CLASSES, ET CE QU'UNE REPRISE PRODUIT</text></g><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="13"><rect x="7" y="45.609" width="226.233" height="160.875" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="70.143" fill="#000" font-size="14" textLength="66.138" font-weight="700" font-family="'DejaVu Sans'">1  Lecture</text><text x="17" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="17" y="105.361" fill="#000" font-size="14" textLength="176.661" font-family="'DejaVu Sans'">Rien : rejouer une lecture ne</text><text x="17" y="122.971" fill="#000" font-size="14" textLength="180.893" font-family="'DejaVu Sans'">change pas l'état du système</text><text x="17" y="140.58" fill="#000" font-size="14" textLength="107.728" font-family="'DejaVu Sans'">d'enregistrement.</text><text x="17" y="158.189" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="17" y="175.799" fill="#000" font-size="14" textLength="206.233" font-style="italic" font-family="'DejaVu Sans'">bornée par le coût et la fraîcheur,</text><text x="17" y="193.408" fill="#000" font-size="14" textLength="127.627" font-style="italic" font-family="'DejaVu Sans'">non par la correction</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="14"><rect x="268" y="45.609" width="234.368" height="160.875" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="278" y="70.143" fill="#000" font-size="14" textLength="68.476" font-weight="700" font-family="'DejaVu Sans'">2  Écriture</text><text x="278" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="278" y="105.361" fill="#000" font-size="14" textLength="187.906" font-family="'DejaVu Sans'">Un doublon, sauf si l'opération</text><text x="278" y="122.971" fill="#000" font-size="14" textLength="103.51" font-family="'DejaVu Sans'">est idempotente.</text><text x="278" y="140.58" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="278" y="158.189" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="278" y="175.799" fill="#000" font-size="14" textLength="214.368" font-style="italic" font-family="'DejaVu Sans'">l'idempotence est une propriété de</text><text x="278" y="193.408" fill="#000" font-size="14" textLength="31.466" font-style="italic" font-family="'DejaVu Sans'">l'outil</text></g><!--entity C3--><g class="entity" data-qualified-name="C3" id="ent0003" data-source-line="15"><rect x="537" y="45.609" width="246.495" height="160.875" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="547" y="70.143" fill="#000" font-size="14" textLength="99.579" font-weight="700" font-family="'DejaVu Sans'">3  Engagement</text><text x="547" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="547" y="105.361" fill="#000" font-size="14" textLength="226.495" font-family="'DejaVu Sans'">Un second engagement, que rien ne</text><text x="547" y="122.971" fill="#000" font-size="14" textLength="38.138" font-family="'DejaVu Sans'">défait.</text><text x="547" y="140.58" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="547" y="158.189" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="547" y="175.799" fill="#000" font-size="14" textLength="210.909" font-style="italic" font-family="'DejaVu Sans'">seule la compensation agit, et elle</text><text x="547" y="193.408" fill="#000" font-size="14" textLength="94.944" font-style="italic" font-family="'DejaVu Sans'">est sémantique</text></g><!--link C1 to C2--><!--link C2 to C3--><g class="legend" data-source-line="20"><rect x="31.494" y="226.484" width="727.507" height="45.219" fill="#FBF9F5" style="stroke:#BBB;stroke-width:1;" rx="7.5" ry="7.5"/><text x="36.494" y="246.018" fill="#000" font-size="14" textLength="717.507" font-family="'DejaVu Sans'">L'IDEMPOTENCE EST UNE PROPRIÉTÉ DE L'OUTIL, JAMAIS DU PROTOCOLE QUI L'INVOQUE (ch. 4 § 4.4.2).</text><text x="36.494" y="263.627" fill="#000" font-size="14" textLength="702.721" font-family="'DejaVu Sans'">Et sur la troisième classe, rien ne défait : seule la compensation agit, et elle est sémantique, non transactionnelle.</text></g><?plantuml-src ZPF1Rjf048RlVeeHFT0YXnQII6aLHGApI5G44h1pAJqizc0siNVTtRMgFW9FqdBf2_HMlrXd7GgaoQ6-UUVRcNz-_pOFGXPSynoMF7v8jIfb4gXCQNWrx0qlXkUUsHDcpHFrLSWKLZmpU5H9SCNBp0wLj1EU8pG6UC_lIfXpQHf7d1KsGqVjHbpqk-nT_mZG65ikqmpxIYUeTrY_Vbx4dea-7tROCPfXYZ9vplM7xvyij-DU6ElLgY6SJKTp2CQz-PpDVM0X10nkesOqOJ1ZDxFHdC7DR3g8Hg7dxGL2ezNg08pflTJOQYtaGiu4IlX0Izoh4ZMK4cbwNGU92nclwIP2mGrapMfhkOMa1FFDsEf7JlMaYL9ZAepLcAEqRTVpKbmjbPRLrbtKr0zYLVsoW1Oo3YlDgv_n6aljNxuLLpKkbNn4EQ7Q2HPAkce3Q7BGURf35w3Qn5eSjeWa9AfSPahwO7Yv0YD8hogghUQkrKAYiI0Ip0jbIIRMEklHMND_72Cup7bGQ5LeGGjNMmhKNYVrBAt83igwJvMT0Z2PyhJsOY_DOAna0hYl-F2bHD3EUcToKcrNNDY39eCbzQlDo0kKfju1U2he9fc8MNQGv1IRQfjpQGLrFKWxzRoW0oUVrY99K7xM8btR4wSuw3u_9VWnTB1KrghSevWqHmDsVJCDsOJ2nUOXk7HHgYXUrIQiDZ1W14sZS3JsuMFlkaUH74IE2AV1TEm2EN9T9dVJsuZ1wtZTXZFu_HtEscVjxfispM2alQm_kzLA6E521N76ZK7_hp-miuTI-X--m3z--E2oPJNz_BnEbNHKswDL7nV-0m00?></g></svg>