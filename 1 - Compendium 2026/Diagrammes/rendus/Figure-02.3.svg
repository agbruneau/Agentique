extLength="7.122" font-family="'Segoe UI'">  </text><text x="108.1" y="153.528" fill="#222" font-size="13" textLength="29.567" font-weight="700" font-family="'Segoe UI'">OWL</text><text x="93.5" y="170.819" fill="#222" font-size="13" textLength="201.233" font-family="'Segoe UI'">Axiomes et inférence sur le graphe.</text></g><!--entity L2--><g class="entity" data-qualified-name="STACK.L2" id="ent0004" data-source-line="48"><rect x="31" y="198.5" width="326.103" height="54.582" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="41" y="222.528" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">2</text><text x="48.478" y="222.528" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="55.6" y="222.528" fill="#222" font-size="13" textLength="32.119" font-weight="700" font-family="'Segoe UI'">RDFS</text><text x="41" y="239.819" fill="#222" font-size="13" textLength="306.103" font-family="'Segoe UI'">Vocabulaire et hiérarchies de classes et de propriétés.</text></g><!--entity L1--><g class="entity" data-qualified-name="STACK.L1" id="ent0005" data-source-line="52"><rect x="23" y="268" width="342.328" height="71.873" fill="#FAF7F2" style="stroke:#B8B3AA;stroke-width:0.5;" rx="2" ry="2"/><text x="33" y="292.028" fill="#9E3A14" font-size="13" font-weight="700" font-family="'Segoe UI'">1</text><text x="40.478" y="292.028" fill="#222" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="47.6" y="292.028" fill="#222" font-size="13" textLength="24.832" font-weight="700" font-family="'Segoe UI'">RDF</text><text x="33" y="309.319" fill="#222" font-size="13" textLength="322.328" font-family="'Segoe UI'">Triplets sujet-prédicat-objet ; chaque ressource porte un</text><text x="33" y="326.61" fill="#222" font-size="13" textLength="198.459" font-family="'Segoe UI'">identifiant globalement résolvable.</text></g><!--entity SIDE1--><g class="entity" data-qualified-name="SIDE1" id="ent0009" data-source-line="64"><rect x="405" y="69" width="345.044" height="71.873" fill="#FFF" style="stroke:#FFF;stroke-width:0.5;" rx="2" ry="2"/><text x="415" y="93.028" fill="#222" font-size="13" textLength="89.623" font-weight="700" font-family="'Segoe UI'">SHACL et ShEx</text><text x="415" y="110.319" fill="#222" font-size="13" textLength="325.044" font-family="'Segoe UI'">La validation vient par-dessus : un contrat sémantique se</text><text x="415" y="127.61" fill="#222" font-size="13" textLength="279.018" font-family="'Segoe UI'">pose sur le graphe, il n'en fait pas partie (§ 2.3.3).</text></g><!--entity SIDE2--><g class="entity" data-qualified-name="SIDE2" id="ent0010" data-source-line="69"><rect x="414" y="155.5" width="326.75" height="89.164" fill="#FFF" style="stroke:#FFF;stroke-width:0.5;" rx="2" ry="2"/><text x="424" y="179.528" fill="#222" font-size="13" textLength="102.426" font-weight="700" font-family="'Segoe UI'">La propriété rare</text><text x="424" y="196.819" fill="#222" font-size="13" textLength="306.186" font-family="'Segoe UI'">Fusionner deux schémas relationnels exige un projet ;</text><text x="424" y="214.11" fill="#222" font-size="13" textLength="306.75" font-family="'Segoe UI'">fusionner deux graphes qui partagent des identifiants</text><text x="424" y="231.401" fill="#222" font-size="13" textLength="68.917" font-family="'Segoe UI'">n'exige rien.</text></g><!--link L1 to L2--><!--link L2 to L3--><!--link L3 to L4--><!--link SIDE2 to SIDE1--><!--link L4 to SIDE1--><!--link L2 to SIDE2--><g class="legend" data-source-line="81"><rect x="31.339" y="376" width="694.366" height="65.863" fill="#F7F5F0" style="stroke:#C4BEB5;stroke-width:1;" rx="2" ry="2"/><text x="36.339" y="396.107" fill="#333" font-size="14" textLength="684.366" font-family="'Segoe UI'">Deux graphes fusionnent par simple union de leurs triplets — POURVU QU'ILS PARTAGENT DES IDENTIFIANTS.</text><text x="36.339" y="414.729" fill="#333" font-size="14" textLength="652.073" font-f