<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:750px;height:361px;background:#FFFFFF;" width="750px" height="361px" viewBox="0 0 750 361" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="9"><rect x="32.5" y="7" width="304.813" height="226.201" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="42.5" y="31.028" fill="#57534E" font-size="13" textLength="153.861" font-family="'Segoe UI'">CE QUE LE CORPUS PORTE</text><line x1="33.5" y1="34.291" x2="336.313" y2="34.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="42.5" y="52.319" fill="#000" font-size="13" textLength="203.303" font-weight="700" font-family="'Segoe UI'">Des spécifications, et leurs stades</text><text x="42.5" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="42.5" y="86.901" fill="#000" font-size="13" textLength="284.813" font-family="'Segoe UI'">Modèle de données d'accréditation et identifiants</text><text x="42.5" y="104.192" fill="#000" font-size="13" textLength="123.614" font-family="'Segoe UI'">décentralisés du W3C</text><text x="42.5" y="121.483" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="42.5" y="138.774" fill="#000" font-size="13" textLength="278.833" font-family="'Segoe UI'">Des profils d'interopérabilité, avec leur lacune de</text><text x="42.5" y="156.065" fill="#000" font-size="13" textLength="113.502" font-family="'Segoe UI'">couverture déclarée</text><text x="42.5" y="173.356" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="42.5" y="190.647" fill="#000" font-size="13" textLength="238.228" font-family="'Segoe UI'">Des groupes communautaires agentiques</text><line x1="33.5" y1="197.91" x2="336.313" y2="197.91" style="stroke:#B8B2A6;stroke-width:1;"/><text x="42.5" y="215.938" fill="#000" font-size="13" textLength="153.728" font-weight="700" font-family="'Segoe UI'">l'appareil normatif existe</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="25"><rect x="373" y="15.5" width="363.668" height="208.91" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="383" y="39.528" fill="#9A3412" font-size="13" textLength="137.287" font-family="'Segoe UI'">CE QU'IL NE PORTE PAS</text><line x1="374" y1="42.791" x2="735.668" y2="42.791" style="stroke:#9A3412;stroke-width:1;"/><text x="383" y="60.819" fill="#000" font-size="13" textLength="343.668" font-weight="700" font-family="'Segoe UI'">Aucun établissement financier réglementé, nommément</text><text x="383" y="78.11" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="383" y="95.401" fill="#000" font-size="13" textLength="161.275" font-family="'Segoe UI'">exploitant EN PRODUCTION</text><text x="383" y="112.692" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="383" y="129.983" fill="#000" font-size="13" textLength="273.781" font-family="'Segoe UI'">des accréditations vérifiables ou des identifiants</text><text x="383" y="147.274" fill="#000" font-size="13" textLength="74.28" font-family="'Segoe UI'">décentralisés</text><text x="383" y="164.565" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="383" y="181.856" fill="#000" font-size="13" textLength="205.347" font-family="'Segoe UI'">au corpus consulté le 21 juillet 2026</text><line x1="374" y1="189.119" x2="735.668" y2="189.119" style="stroke:#9A3412;stroke-width:1;"/><text x="383" y="207.147" fill="#000" font-size="13" textLength="160.577" font-weight="700" font-family="'Segoe UI'">troisième degré d'absence</text></g><!--entity NOTE--><g class="entity" data-qualified-name="NOTE" id="ent0003" data-source-line="40"><rect x="7" y="293" width="725.828" height="54.582" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="317.028" fill="#000" font-size="13" textLength="605.592" font-family="'Segoe UI'">C'est une ABSENCE DE DOCUMENTATION, non un fait négatif vérifié (troisième degré). Elle ne soutient en</text><text x="17" y="334.319" fill="#000" font-size="13" textLength="705.828" font-family="'Segoe UI'">aucun cas l'énoncé « aucune banque n'emploie ces mécanismes » — et la figure ne doit pas laisser lire ce qu'elle ne dit pas.</text></g><!--link C1 to C2--><!--link C1 to NOTE--><!--link C2 to NOTE--><?plantuml-src VPJDRjD04CVlUOeHFGGg2ZIXeNoeKkeuKgMIbAOH1yHXivwu2-jTiny5SU8XU0Wi7e4RVXEUXFywhPIA2ikIxTcPsPdVVzR1rXGihMm8jg92EPP1MTFp7vMfXHCL-KjHsC_AbBGMslFMYhFH5D8wmuv6M_Q2roBgCBKcp4J5T6_1fMLQdjoxsscXlZBj3xSMLq9-BBlqcTNMqSwqktgzL9umfMRAzc4TJqVJ9o-rClpY-F1uC1xHknxHAvc2NkmSF3iOFisFifpUB7CwpIcRdvyj5tGsFx_8Nptkl8xWluSBZztT2NloTTj8jLPI90x-8N4WpT5X9OY2_Uvk3xwlRT7-G1K5RcjCso2ow0ifNTiKAdInAL8LR0Ao2HCymWhaXi49hNpR82JIss6M4gQjQsVNIgT4oWHs5fKuiL9QXRPvIEAAPLS9QI6ZINiZJjfunIv4nrroBL00toHC26iyfQsgQ4GC0lfw4cKgwbDalzsyxeiQz5bfCjPLQ65D_4Nvm6Zv_ItqWnj1DkYVZuTFzmUtq6zC6_JzarEQvHlgT3PUt4L-7D4IjKqGAw3nNA52MYiZZ5IOBZI5ZPCnaJ1efstIrqOC_b9h2-W8oMTqTZwVBBEBa_aihHMftrkoUBe2rwJ9IcFHnixd_qAbJ2A2ewjZmcayHhTj80SDzkb3L5f3xC6JmMYxgU2iyghzKIMjIfIGHcJbsSX_aCxcOBCpFPmUtCppP3GPPfCEQjPd7oX9FZvUv3D0dU2UPylN-UnYd3fDJ0myS4HL88nZsSbttIWsllzFBGyUKOwg2LczZK4bu6owFfCKKdZI_RP1NedutpytTiRHD9WSCdsk4dKc2NgGGmgZV8Nttx_epxVltR4HaB1Cevcc5GfHdRAA932c6BE8OFeK-tnTIB5nUPJOu7pllRjK1NHvxrHv6VQEC7YtpFWj6LWJknvcyYxxNm00?></g></svg>