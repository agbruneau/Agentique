<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:873px;height:432px;background:#FFFFFF;" width="873px" height="432px" viewBox="0 0 873 432" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster P1--><g class="cluster" data-qualified-name="P1" id="ent0001" data-source-line="35"><path d="M9.207,76.68 L132.883,76.68 A4.5,4.5 0 0 1 135.883,79.68 L142.883,100.289 L296.207,100.289 A3,3 0 0 1 299.207,103.289 L299.207,319.68 A3,3 0 0 1 296.207,322.68 L9.207,322.68 A3,3 0 0 1 6.207,319.68 L6.207,79.68 A3,3 0 0 1 9.207,76.68" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="6.207" y1="100.289" x2="142.883" y2="100.289" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="10.207" y="93.213" fill="#444" font-size="14" textLength="123.676" font-weight="700">COÛT PAR JETON</text></g><!--cluster P2--><g class="cluster" data-qualified-name="P2" id="ent0003" data-source-line="39"><path d="M342.207,76.68 L550.648,76.68 A4.5,4.5 0 0 1 553.648,79.68 L560.648,100.289 L629.207,100.289 A3,3 0 0 1 632.207,103.289 L632.207,319.68 A3,3 0 0 1 629.207,322.68 L342.207,322.68 A3,3 0 0 1 339.207,319.68 L339.207,79.68 A3,3 0 0 1 342.207,76.68" style="stroke:#9C3D14;stroke-width:1.5;" fill="#FDFBF7"/><line x1="339.207" y1="100.289" x2="560.648" y2="100.289" style="stroke:#9C3D14;stroke-width:1.5;"/><text x="343.207" y="93.213" fill="#9C3D14" font-size="14" textLength="208.441" font-weight="700">COÛT PAR RÉSULTAT MÉTIER</text></g><!--entity C1--><g class="entity" data-qualified-name="P1.C1" id="ent0002" data-source-line="36"><rect x="49.207" y="120.68" width="226.24" height="178.484" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="59.207" y="145.213" fill="#1F1F1F" font-size="14" textLength="199.377" font-weight="700">Ce que l'infrastructure facture</text><text x="59.207" y="162.823" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="180.432" fill="#1F1F1F" font-size="14" textLength="165.737">Immédiatement mesurable</text><text x="59.207" y="198.041" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="215.651" fill="#1F1F1F" font-size="14" textLength="205.044">Baisse quand l'agent échoue vite</text><text x="59.207" y="233.26" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="250.869" fill="#1F1F1F" font-size="14" textLength="206.24">Ne dit rien de ce qui a été produit</text><text x="59.207" y="268.479" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="286.088" fill="#1F1F1F" font-size="14" textLength="190.586" font-weight="700">une grandeur de fournisseur</text></g><!--entity C2--><g class="entity" data-qualified-name="P2.C2" id="ent0004" data-source-line="40"><rect x="382.707" y="120.68" width="224.654" height="178.484" fill="#FFF" style="stroke:#9C3D14;stroke-width:0.5;" rx="3" ry="3"/><text x="392.707" y="145.213" fill="#1F1F1F" font-size="14" textLength="192.336" font-weight="700">Ce que l'organisation obtient</text><text x="392.707" y="162.823" fill="#1F1F1F" font-size="14"> </text><text x="392.707" y="180.432" fill="#1F1F1F" font-size="14" textLength="161.089">Exige de définir le résultat</text><text x="392.707" y="198.041" fill="#1F1F1F" font-size="14"> </text><text x="392.707" y="215.651" fill="#1F1F1F" font-size="14" textLength="204.654">Intègre les reprises et les échecs</text><text x="392.707" y="233.26" fill="#1F1F1F" font-size="14"> </text><text x="392.707" y="250.869" fill="#1F1F1F" font-size="14" textLength="202.672">Rend l'effet de plateforme visible</text><text x="392.707" y="268.479" fill="#1F1F1F" font-size="14"> </text><text x="392.707" y="286.088" fill="#1F1F1F" font-size="14" textLength="189.055" font-weight="700">la seule grandeur qui décide</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="46"><path d="M132.207,361.68 L132.207,414.735 A3,3 0 0 0 135.207,417.735 L855.114,417.735 A3,3 0 0 0 858.114,414.735 L858.114,368.68 L848.114,358.68 L499.207,358.68 L495.207,298.93 L491.207,358.68 L135.207,358.68 A3,3 0 0 0 132.207,361.68" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M848.114,358.68 L848.114,367.18 A1.5,1.5 0 0 0 849.614,368.68 L858.114,368.68 L848.114,358.68" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="138.207" y="377.175" fill="#333" font-size="13" textLength="704.907">Le coût par jeton est mesurable et trompeur : il baisse quand l'agent échoue vite. Le coût par résultat est la seule grandeur</text><text x="138.207" y="393.527" fill="#333" font-size="13" textLength="702.927">qui rende l'effet de plateforme visible — et c'est aussi celle qui exige de savoir ce qu'est un résultat, ce qu'aucun compteur</text><text x="138.207" y="409.878" fill="#333" font-size="13" textLength="35.414">ne dit.</text></g><!--link P1 to P2--><?plantuml-src bLJDRjD04BxxAKRbq0ij2ereGL6aDYfIKMch99meX_NkhBFKtZMpwm92I5nxvyOBa6VWw3VXIPZTfDGq3PJD8Sbu_FtDs3EZ47n0GXS-rfZv2sDhGQA2NCYBWbnZrSYLZk21JgVJuMT2kVV65g15wRltAjIYASDpPyE9g10cmle9akdUdQ2b8ui4Jphrcdb5WV0f0pu7AogKplNkufeZXRIigxxKSb6FjCjgFvtiyoh-O22aH1k6m_zbUYftLAz_csbPxJ8HoY1iKQxtiglxYAiC-LxU5_8sGq_7pzqCzt2pcDuztTp1PLrORqJeFTs_hv6TT1WykvxrnkYq_JQ5i_qnl3YSdfviWF1mrblItUIuCSY78uHt3KAvQQmcuGCrCZI4l8FfU_0e7vxRStjKLUrS6H6muboWGj-Go4kCrmw4yJx22AiOY1LmHpkNCyV0boQafXC4PGAGGSlx33Bs6n3S5zevrEHKOq9iP4sDHIY8qR2XsAnTGpPoD1Jr93kZtXh7u_PgykfukZ-5b-tLzEXml73_65Q6kYO8HuLWDX6Ci-3om8h3TGo77mopiIJLphMnXe3lfdRk-V4KIVwH3UttWWCiqJD3JSRp3mpfVmm5fOzzOqnXeTPyZG7hahFLZgeOcJVBQ5bNAO2Dbvr4Od3CB_bTSnD7rrzCXiUzzNfcb4BxXamn2rj33Y7BqjxbBWHNPSSy1zV-2FmG4xp5m7xHTuORPGToLHrPdu4f-ItsZr5lmn-WlwD9m2jMicY5E0dyUnJmyylNA4PkHXZHU6zuWyfoiKHuFHGlBXsF9ErMwcpiZOA7oxfe99SbkmfHWKrxkPt5SSHiVW40?></g></svg>