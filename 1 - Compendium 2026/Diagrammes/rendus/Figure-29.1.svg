<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1088px;height:691px;background:#FFFFFF;" width="1088px" height="691px" viewBox="0 0 1088 691" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster SIX EXIGENCES, ET CE QUE LE CADRE DOIT PORTER--><g class="cluster" data-qualified-name="SIX EXIGENCES. ET CE QUE LE CADRE DOIT PORTER" id="ent0001" data-source-line="24"><path d="M9,6 L375.386,6 A4.5,4.5 0 0 1 378.386,9 L385.386,29.609 L854,29.609 A3,3 0 0 1 857,32.609 L857,587 A3,3 0 0 1 854,590 L9,590 A3,3 0 0 1 6,587 L6,9 A3,3 0 0 1 9,6" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="6" y1="29.609" x2="385.386" y2="29.609" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="10" y="22.533" fill="#9C3D14" font-size="14" textLength="366.386" font-weight="700">SIX EXIGENCES, ET CE QUE LE CADRE DOIT PORTER</text></g><!--entity E1--><g class="entity" data-qualified-name="SIX EXIGENCES. ET CE QUE LE CADRE DOIT PORTER.E1" id="ent0002" data-source-line="25"><rect x="33" y="42" width="379.898" height="125.656" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="43" y="66.533" fill="#9C3D14" font-size="14" textLength="29.572" font-weight="700">E-23</text><text x="72.572" y="66.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="84.241" y="66.533" fill="#1F1F1F" font-size="14" textLength="66.138" font-weight="700">Inventaire</text><text x="43" y="84.143" fill="#1F1F1F" font-size="14"> </text><text x="43" y="101.752" fill="#1F1F1F" font-size="14" textLength="323.306">Un inventaire d'entreprise des modèles à risque non</text><text x="43" y="119.361" fill="#1F1F1F" font-size="14" textLength="202.364">négligeable, exact et tenu à jour.</text><text x="43" y="136.971" fill="#1F1F1F" font-size="14"> </text><text x="43" y="154.58" fill="#666" font-size="14" textLength="359.898">le cadre doit porter l'ensemble de ce qui peut être invoqué</text></g><!--entity E2--><g class="entity" data-qualified-name="SIX EXIGENCES. ET CE QUE LE CADRE DOIT PORTER.E2" id="ent0003" data-source-line="26"><rect x="455" y="42" width="376.002" height="125.656" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="465" y="66.533" fill="#9C3D14" font-size="14" textLength="29.572" font-weight="700">E-23</text><text x="494.572" y="66.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="506.241" y="66.533" fill="#1F1F1F" font-size="14" textLength="56.766" font-weight="700">Cotation</text><text x="465" y="84.143" fill="#1F1F1F" font-size="14"> </text><text x="465" y="101.752" fill="#1F1F1F" font-size="14" textLength="356.002">Une cote de risque par modèle ; le degré d'autonomie est</text><text x="465" y="119.361" fill="#1F1F1F" font-size="14" textLength="122.186">un facteur qualitatif.</text><text x="465" y="136.971" fill="#1F1F1F" font-size="14"> </text><text x="465" y="154.58" fill="#666" font-size="14" textLength="276.644">la cote doit être connue au point d'invocation</text></g><!--entity E3--><g class="entity" data-qualified-name="SIX EXIGENCES. ET CE QUE LE CADRE DOIT PORTER.E3" id="ent0004" data-source-line="28"><rect x="22" y="228" width="395.874" height="143.266" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="32" y="252.533" fill="#9C3D14" font-size="14" textLength="29.572" font-weight="700">E-23</text><text x="61.572" y="252.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="73.241" y="252.533" fill="#1F1F1F" font-size="14" textLength="80.938" font-weight="700">Cycle de vie</text><text x="32" y="270.143" fill="#1F1F1F" font-size="14"> </text><text x="32" y="287.752" fill="#1F1F1F" font-size="14" textLength="375.874">Cinq composantes, « pas nécessairement séquentielles » —</text><text x="32" y="305.361" fill="#1F1F1F" font-size="14" textLength="158.73">dont la mise hors service.</text><text x="32" y="322.971" fill="#1F1F1F" font-size="14"> </text><text x="32" y="340.58" fill="#666" font-size="14" textLength="316.265">la mise hors service s'interpose entre la décision et</text><text x="32" y="358.189" fill="#666" font-size="14" textLength="68.824">l'invocation</text></g><!--entity E4--><g class="entity" data-qualified-name="SIX EXIGENCES. ET CE QUE LE CADRE DOIT PORTER.E4" id="ent0005" data-source-line="29"><rect x="453" y="228" width="388.484" height="143.266" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="463" y="252.533" fill="#9C3D14" font-size="14" textLength="29.572" font-weight="700">E-23</text><text x="492.572" y="252.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="504.241" y="252.533" fill="#1F1F1F" font-size="14" textLength="101.89" font-weight="700">Documentation</text><text x="463" y="270.143" fill="#1F1F1F" font-size="14"> </text><text x="463" y="287.752" fill="#1F1F1F" font-size="14" textLength="332.302">Usages approuvés, limites, dépendances, sources de</text><text x="463" y="305.361" fill="#1F1F1F" font-size="14" textLength="57.606">données.</text><text x="463" y="322.971" fill="#1F1F1F" font-size="14"> </text><text x="463" y="340.58" fill="#666" font-size="14" textLength="368.484">l'usage approuvé doit être opposable, donc porté par ce qui</text><text x="463" y="358.189" fill="#666" font-size="14" textLength="49.807">autorise</text></g><!--entity A1--><g class="entity" data-qualified-name="SIX EXIGENCES. ET CE QUE LE CADRE DOIT PORTER.A1" id="ent0006" data-source-line="31"><rect x="59" y="431" width="337.543" height="143.266" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="69" y="455.533" fill="#9C3D14" font-size="14" textLength="55.248" font-weight="700">Art. 12.1</text><text x="124.248" y="455.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="135.917" y="455.533" fill="#1F1F1F" font-size="14" textLength="56.786" font-weight="700">Informer</text><text x="69" y="473.143" fill="#1F1F1F" font-size="14"> </text><text x="69" y="490.752" fill="#1F1F1F" font-size="14" textLength="305.382">Au plus tard au moment où l'entreprise informe la</text><text x="69" y="508.361" fill="#1F1F1F" font-size="14" textLength="317.543">personne de la décision · sans demande préalable.</text><text x="69" y="525.971" fill="#1F1F1F" font-size="14"> </text><text x="69" y="543.58" fill="#666" font-size="14" textLength="301.943">la décision et sa communication doivent être des</text><text x="69" y="561.189" fill="#666" font-size="14" textLength="245.137">événements émis, identifiables et datés</text></g><!--entity A2--><g class="entity" data-qualified-name="SIX EXIGENCES. ET CE QUE LE CADRE DOIT PORTER.A2" id="ent0007" data-source-line="32"><rect x="447.5" y="431" width="382.988" height="143.266" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="457.5" y="455.533" fill="#9C3D14" font-size="14" textLength="55.248" font-weight="700">Art. 12.1</text><text x="512.748" y="455.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="524.417" y="455.533" fill="#1F1F1F" font-size="14" textLength="182.868" font-weight="700">Présenter ses observations</text><text x="457.5" y="473.143" fill="#1F1F1F" font-size="14"> </text><text x="457.5" y="490.752" fill="#1F1F1F" font-size="14" textLength="362.988">L'occasion de présenter ses observations à un membre du</text><text x="457.5" y="508.361" fill="#1F1F1F" font-size="14" textLength="270.813">personnel en mesure de réviser la décision.</text><text x="457.5" y="525.971" fill="#1F1F1F" font-size="14"> </text><text x="457.5" y="543.58" fill="#666" font-size="14" textLength="328.419">un point de reprise, et des effets aval bornés — donc</text><text x="457.5" y="561.189" fill="#666" font-size="14" textLength="70.827">défaisables</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="44"><path d="M204.5,637 L204.5,673.703 A3,3 0 0 0 207.5,676.703 L1070.928,676.703 A3,3 0 0 0 1073.928,673.703 L1073.928,644 L1063.928,634 L643,634 L639,574.14 L635,634 L207.5,634 A3,3 0 0 0 204.5,637" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M1063.928,634 L1063.928,642.5 A1.5,1.5 0 0 0 1065.428,644 L1073.928,644 L1063.928,634" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="210.5" y="652.495" fill="#333" font-size="13" textLength="848.428">LE STATUT DU LIEN EST LA COLONNE QUI COMPTE. Plusieurs liens sont des INFÉRENCES D'AUTEUR, un est une LACUNE OUVERTE — le</text><text x="210.5" y="668.847" fill="#333" font-size="13" textLength="659.553">contenu de la ligne directrice de l'AMF n'est pas au socle, et rien n'en est dérivable. Traduire n'est pas lire (§ 29.0).</text></g><!--link E1 to E2--><!--link E3 to E4--><!--link A1 to A2--><!--link E1 to E3--><!--link E3 to A1--><!--link E2 to E4--><!--link E4 to A2--><?plantuml-src fLR1RYD54BtxAqhXO90SBtQipIv4bempYonbdH3RQ2N2eJtJupGxq-rqznWGGkBAdG_W1eOFG8XR_2Ty2QzwneczjgLL61yyqptzgkhLgwfnRvMU2ojocehuxSoQGYTzanbB7wJXghc7DzojICotIiye5PcJ6pk9J4MH-LT6-w789Os4TYDfrURf01qRgwMbvvlhClP2pp99FzG8rsSxVfoc7IdBFMCJQQlrwOjfHyHXdGrNgwsKVxKVDopCWIXcX_6JT9gUxk8ddJYDJz_5VncV9AtE5hus_Z2uI5-adVTr_YHS0A-jVJuQ3TvGz6RmUJJiHwC6HMFgH_J59AABYFgzy-k8pYy7Oxgwl1v7rqUL6u-S7ft53Fr9vNVtRDgDZjidPy-ctRDdOQkBzx4wq0kflL1MyjwDlj4JJUfXaP8wxgoSM-Nm81tb9bdzdk5czIjXyQwG80B7z6evozHCYcac6oI_4x4dwSbBNV2htvZ2DXb-xTZpS7NXQomIDcIKfxcn7Zh9ODJ974WmIR6akqBHN1QULd_06VRFt1MhvJgK8nAEejPJEUWRBxmo-f416ENamdWL8ZA-Zfm-fU3NpAwMe4SKtcYJAqdI-HjTQ5H9x6LXuRJ852EdUmCNbGsEkmmhDbh3bYZ0Wz8Uu1neNFcs6MgxzkHOluzBLXVg8UDzfUzWF9yR9xINha7tVo9YHyXfB9rZ8UIG0RdL4cHehsJ62hZ_X_xzwPSRdK39X7XoriYjiOwSj0iLomDnxxn73f4YyN00DBBU62w1TUKGEtIq3c8NxY179q-bwDp41OUxhGc7idGavdEK-MAr14cPobLW2uxEfKw4Zld9GUcu0SU16N0etLuYwWLZFa9kIi7CEHcXb80HXyB06op3iXmE4i9wv6BT9gFp7eBfMT-aLhlPsjSbKcDpQTTiz23Hh73aXKrOhxa9-Z2