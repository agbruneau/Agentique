ngth="70.82">identifiants.</text><text x="32" y="154.58" fill="#1F1F1F" font-size="14"> </text><text x="32" y="172.189" fill="#666" font-size="14" textLength="248.247">rarement pensé en termes de résidence</text></g><!--entity P2--><g class="entity" data-qualified-name="QUATRE PLANS. ET LA R.SIDENCE DOIT LES COUVRIR TOUS.P2" id="ent0003" data-source-line="26"><rect x="413" y="50.5" width="315.75" height="125.656" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="423" y="75.033" fill="#9C3D14" font-size="14" font-weight="700">2</text><text x="430.786" y="75.033" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="442.455" y="75.033" fill="#1F1F1F" font-size="14" textLength="87.903" font-weight="700">Plongements</text><text x="423" y="92.643" fill="#1F1F1F" font-size="14"> </text><text x="423" y="110.252" fill="#1F1F1F" font-size="14" textLength="295.75">La représentation vectorielle du contenu régulé.</text><text x="423" y="127.861" fill="#1F1F1F" font-size="14"> </text><text x="423" y="145.471" fill="#1F1F1F" font-size="14"> </text><text x="423" y="163.08" fill="#666" font-size="14" textLength="248.247">rarement pensé en termes de résidence</text></g><!--entity P3--><g class="entity" data-qualified-name="QUATRE PLANS. ET LA R.SIDENCE DOIT LES COUVRIR TOUS.P3" id="ent0004" data-source-line="28"><rect x="61.5" y="245" width="297.396" height="108.047" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="71.5" y="269.533" fill="#9C3D14" font-size="14" font-weight="700">3</text><text x="79.286" y="269.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="90.955" y="269.533" fill="#1F1F1F" font-size="14" textLength="45.145" font-weight="700">Traces</text><text x="71.5" y="287.143" fill="#1F1F1F" font-size="14"> </text><text x="71.5" y="304.752" fill="#1F1F1F" font-size="14" textLength="277.396">Ce que l'observabilité conserve de la boucle.</text><text x="71.5" y="322.361" fill="#1F1F1F" font-size="14"> </text><text x="71.5" y="339.971" fill="#666" font-size="14" textLength="248.247">rarement pensé en termes de résidence</text></g><!--entity P4--><g class="entity" data-qualified-name="QUATRE PLANS. ET LA R.SIDENCE DOIT LES COUVRIR TOUS.P4" id="ent0005" data-source-line="29"><rect x="414" y="245" width="292.378" height="108.047" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="424" y="269.533" fill="#9C3D14" font-size="14" font-weight="700">4</text><text x="431.786" y="269.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="443.455" y="269.533" fill="#1F1F1F" font-size="14" textLength="112.226" font-weight="700">Journaux d'audit</text><text x="424" y="287.143" fill="#1F1F1F" font-size="14"> </text><text x="424" y="304.752" fill="#1F1F1F" font-size="14" textLength="272.378">Ce qui vaut pièce, et se conserve pour cela.</text><text x="424" y="322.361" fill="#1F1F1F" font-size="14"> </text><text x="424" y="339.971" fill="#666" font-size="14" textLength="200.792">le seul plan habituellement traité</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="38"><path d="M145.5,416 L145.5,469.055 A3,3 0 0 0 148.5,472.055 L971.931,472.055 A3,3 0 0 0 974.931,469.055 L974.931,423 L964.931,413 L564,413 L560,353.09 L556,413 L148.5,413 A3,3 0 0 0 145.5,416" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M964.931,413 L964.931,421.5 A1.5,1.5 0 0 0 966.431,423 L974.931,423 L964.931,413" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="151.5" y="431.495" fill="#333" font-size="13" textLength="808.431">LES TROIS PREMIERS SONT RAREMENT PENSÉS EN TERMES DE RÉSIDENCE. Une architecture qui ne couvre que le stockage laisse</text><text x="151.5" y="447.847" fill="#333" font-size="13" textLength="697.227">circuler la donnée régulée sur trois plans qu'elle ne voit pas — et l'invite contient invariablement du contexte client, même</text><text x="151.5" y=