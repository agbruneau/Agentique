<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1075px;height:355px;background:#FFFFFF;" width="1075px" height="355px" viewBox="0 0 1075 355" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster CE QUE CINQ DISPOSITIFS PUBLIÉS ONT EN COMMUN--><g class="cluster" data-qualified-name="CE QUE CINQ DISPOSITIFS PUBLI.S ONT EN COMMUN" id="ent0001" data-source-line="24"><path d="M9,6 L382.358,6 A4.5,4.5 0 0 1 385.358,9 L392.358,29.609 L835,29.609 A3,3 0 0 1 838,32.609 L838,251 A3,3 0 0 1 835,254 L9,254 A3,3 0 0 1 6,251 L6,9 A3,3 0 0 1 9,6" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="6" y1="29.609" x2="392.358" y2="29.609" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="10" y="22.533" fill="#9C3D14" font-size="14" textLength="373.358" font-weight="700">CE QUE CINQ DISPOSITIFS PUBLIÉS ONT EN COMMUN</text></g><!--entity G1--><g class="entity" data-qualified-name="CE QUE CINQ DISPOSITIFS PUBLI.S ONT EN COMMUN.G1" id="ent0002" data-source-line="25"><rect x="22" y="42" width="244.048" height="196.094" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="32" y="66.533" fill="#9C3D14" font-size="14" font-weight="700">1</text><text x="39.786" y="66.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="51.455" y="66.533" fill="#1F1F1F" font-size="14" textLength="204.593" font-weight="700">Un titulaire nommé au sommet</text><text x="32" y="84.143" fill="#1F1F1F" font-size="14"> </text><text x="32" y="101.752" fill="#1F1F1F" font-size="14" textLength="184.427">Deux titulaires reconstatés au</text><text x="32" y="119.361" fill="#1F1F1F" font-size="14" textLength="207.013">corps (une responsable mondiale</text><text x="32" y="136.971" fill="#1F1F1F" font-size="14" textLength="207.033">depuis mai 2026, § 35.4 ; un chef</text><text x="32" y="154.58" fill="#1F1F1F" font-size="14" textLength="178.24">de groupe depuis févr. 2026,</text><text x="32" y="172.189" fill="#1F1F1F" font-size="14" textLength="200.778">§ 35.3) et un troisième déclaré à</text><text x="32" y="189.799" fill="#1F1F1F" font-size="14" textLength="145.086">l'entrée initiale (§ 35.2).</text><text x="32" y="207.408" fill="#1F1F1F" font-size="14"> </text><text x="32" y="225.018" fill="#666" font-size="14" textLength="132.33">§ 35.2, § 35.3, § 35.4</text></g><!--entity G2--><g class="entity" data-qualified-name="CE QUE CINQ DISPOSITIFS PUBLI.S ONT EN COMMUN.G2" id="ent0003" data-source-line="26"><rect x="301" y="51" width="235.558" height="178.484" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="311" y="75.533" fill="#9C3D14" font-size="14" font-weight="700">2</text><text x="318.786" y="75.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="330.455" y="75.533" fill="#1F1F1F" font-size="14" textLength="162.559" font-weight="700">Un dispositif identifiable</text><text x="311" y="93.143" fill="#1F1F1F" font-size="14"> </text><text x="311" y="110.752" fill="#1F1F1F" font-size="14" textLength="191.475">Publié, et donc opposable à sa</text><text x="311" y="128.361" fill="#1F1F1F" font-size="14" textLength="142.399">propre communication.</text><text x="311" y="145.971" fill="#1F1F1F" font-size="14"> </text><text x="311" y="163.58" fill="#1F1F1F" font-size="14"> </text><text x="311" y="181.189" fill="#1F1F1F" font-size="14"> </text><text x="311" y="198.799" fill="#1F1F1F" font-size="14"> </text><text x="311" y="216.408" fill="#666" font-size="14" textLength="215.558">cinq des dix institutions examinées</text></g><!--entity G3--><g class="entity" data-qualified-name="CE QUE CINQ DISPOSITIFS PUBLI.S ONT EN COMMUN.G3" id="ent0004" data-source-line="27"><rect x="572" y="42" width="249.51" height="196.094" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="582" y="66.533" fill="#9C3D14" font-size="14" font-weight="700">3</text><text x="589.786" y="66.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="601.455" y="66.533" fill="#1F1F1F" font-size="14" textLength="210.055" font-weight="700">Rien sur mandat ni architecture</text><text x="582" y="84.143" fill="#1F1F1F" font-size="14"> </text><text x="582" y="101.752" fill="#1F1F1F" font-size="14" textLength="188.351">Aucun des cinq ne documente</text><text x="582" y="119.361" fill="#1F1F1F" font-size="14" textLength="185.131">l'option d'orchestration de son</text><text x="582" y="136.971" fill="#1F1F1F" font-size="14" textLength="80.165">déploiement.</text><text x="582" y="154.58" fill="#1F1F1F" font-size="14"> </text><text x="582" y="172.189" fill="#1F1F1F" font-size="14"> </text><text x="582" y="189.799" fill="#1F1F1F" font-size="14"> </text><text x="582" y="207.408" fill="#666" font-size="14" textLength="175.123">ch. 43 § 43.2 — absence de</text><text x="582" y="225.018" fill="#666" font-size="14" textLength="91.841">documentation</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="34"><path d="M333.5,301 L333.5,337.703 A3,3 0 0 0 336.5,340.703 L1057.537,340.703 A3,3 0 0 0 1060.537,337.703 L1060.537,308 L1050.537,298 L701,298 L697,238.06 L693,298 L336.5,298 A3,3 0 0 0 333.5,301" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M1050.537,298 L1050.537,306.5 A1.5,1.5 0 0 0 1052.037,308 L1060.537,308 L1050.537,298" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="339.5" y="316.495" fill="#333" font-size="13" textLength="706.037">CINQ SUR DIX. Les cinq autres ne publient pas de dispositif identifiable — ce qui est une absence de publication, non une</text><text x="339.5" y="332.847" fill="#333" font-size="13" textLength="684.239">absence de gouvernance (§ 35.0, troisième classe d'accès). La comparaison porte sur ce qui est publié, et rien d'autre.</text></g><!--link G1 to