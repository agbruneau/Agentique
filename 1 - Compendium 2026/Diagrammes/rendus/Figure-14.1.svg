<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:678px;height:660px;background:#FFFFFF;" width="678px" height="660px" viewBox="0 0 678 660" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster CADRE--><g class="cluster" data-qualified-name="CADRE" id="ent0001" data-source-line="12"><rect x="49.575" y="7" width="572" height="567" fill="#FFFDF9" style="stroke:#9A3412;stroke-width:1;" rx="3" ry="3"/><text x="225.612" y="23.028" fill="#000" font-size="13" textLength="219.927" font-weight="700" font-family="'Segoe UI'">CINQ QUESTIONS, CINQ EXIGENCES</text></g><!--entity QA--><g class="entity" data-qualified-name="CADRE.QA" id="ent0002" data-source-line="13"><rect x="132.075" y="43" width="406.718" height="54.582" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="142.075" y="67.028" fill="#9A3412" font-size="13" textLength="24.254" font-weight="700" font-family="'Segoe UI'">Q-A</text><text x="166.33" y="67.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="177.013" y="67.028" fill="#000" font-size="13" textLength="65.216" font-weight="700" font-family="'Segoe UI'">Qui es-tu ?</text><text x="142.075" y="84.319" fill="#000" font-size="13" textLength="386.718" font-family="'Segoe UI'">Un identifiant stable, vérifiable, résistant à l'usurpation et révocable.</text></g><!--entity QB--><g class="entity" data-qualified-name="CADRE.QB" id="ent0003" data-source-line="18"><rect x="66.075" y="158" width="539.207" height="54.582" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="76.075" y="182.028" fill="#9A3412" font-size="13" textLength="23.448" font-weight="700" font-family="'Segoe UI'">Q-B</text><text x="99.523" y="182.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="110.207" y="182.028" fill="#000" font-size="13" textLength="79.212" font-weight="700" font-family="'Segoe UI'">Qui t'a créé ?</text><text x="76.075" y="199.319" fill="#000" font-size="13" textLength="519.207" font-family="'Segoe UI'">Une chaîne de provenance jusqu'à une autorité d'émission, avec son ancrage de confiance.</text></g><!--entity QC--><g class="entity" data-qualified-name="CADRE.QC" id="ent0004" data-source-line="23"><rect x="94.075" y="273" width="483.449" height="54.582" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="104.075" y="297.028" fill="#9A3412" font-size="13" textLength="23.226" font-weight="700" font-family="'Segoe UI'">Q-C</text><text x="127.301" y="297.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="137.984" y="297.028" fill="#000" font-size="13" textLength="107.669" font-weight="700" font-family="'Segoe UI'">Pour qui agis-tu ?</text><text x="104.075" y="314.319" fill="#000" font-size="13" textLength="463.449" font-family="'Segoe UI'">Une chaîne de mandat interrogeable à l'instant t, et non seulement à l'admission.</text></g><!--entity QD--><g class="entity" data-qualified-name="CADRE.QD" id="ent0005" data-source-line="28"><rect x="122.075" y="388" width="426.955" height="54.582" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="132.075" y="412.028" fill="#9A3412" font-size="13" textLength="24.699" font-weight="700" font-family="'Segoe UI'">Q-D</text><text x="156.774" y="412.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="167.457" y="412.028" fill="#000" font-size="13" textLength="117.406" font-weight="700" font-family="'Segoe UI'">Que peux-tu faire ?</text><text x="132.075" y="429.319" fill="#000" font-size="13" textLength="406.955" font-family="'Segoe UI'">Des bornes de privilège explicites et opposables au point d'application.</text></g><!--entity QE--><g class="entity" data-qualified-name="CADRE.QE" id="ent0006" data-source-line="33"><rect x="121.575" y="503" width="428.3" height="54.582" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="131.575" y="527.028" fill="#9A3412" font-size="13" textLength="22.033" font-weight="700" font-family="'Segoe UI'">Q-E</text><text x="153.608" y="527.028" fill="#000" font-size="13" textLength="10.683" font-family="'Segoe UI'">   </text><text x="164.291" y="527.028" fill="#000" font-size="13" textLength="96.897" font-weight="700" font-family="'Segoe UI'">Qui en répond ?</text><text x="131.575" y="544.319" fill="#000" font-size="13" textLength="408.3" font-family="'Segoe UI'">Une imputabilité traçable jusqu'à une personne ou une entité juridique.</text></g><!--link QA to QB--><!--link QB to QC--><!--link QC to QD--><!--link QD to QE--><g class="legend" data-source-line="44"><rect x="12" y="594" width="647.15" height="47.242" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:1;" rx="3" ry="3"/><text x="17" y="614.107" fill="#000" font-size="14" textLength="622.036" font-family="'Segoe UI'">La grille TRIE, elle ne certifie pas : répondre aux cinq questions n'établit pas qu'un mécanisme est sûr,</text><text x="17" y="632.729" fill="#000" font-size="14" textLength="637.15" font-family="'Segoe UI'">seulement qu'il porte ce qu'il faut pour être interrogé. Son inspiration n'autorise pas davantage (§ 14.1).</text></g><?plantuml-src bLHDJzj04BtxLupWa3PAKW8q0ege4jkf8bLfGq2gX3WiziHPi7VDVgIeLVzBRpGzz0_qLl-npjfG4f8UaakyCszttvjviqRcO2HSIMDa1Z5N61akXQTlkCYPOXdeAOlbPouIcB1Kuq96IIlYI2g12ZeByHWdpAQcBuKPiWnXQuo9H3WVRAq7ZVaNXFRUGlAAHJT9URmlKwbWkr_-5X0f9YZYtWhkeF-wlxEAaof6zO09Ei6U7_m7SpRbqOr0hQ7jUQuOJ2GfIV07mn6CpiFnsU33SDo0SXr-6hmBXtuutWAcmUy6fs59DUWVlacvmAF3xjv-UnU-UW1FPusw1EhsE_sT2jGxwErsEt11883Zo94ysgvsdjJhesQtNZz-LOPF240Hom5rqrXuMw-Ncyu5y1Y5uHFEX05js5MA3PWLS-L2vK8LSyqfG_dYEwGrgwtAcUire77PcOmSiaKdNdhBX7kR4Uwj8Mng32AwfPWli4Q8fgpuHVynGgxa30KJ4SArrRUsHZGjfPWrKd536-DQ