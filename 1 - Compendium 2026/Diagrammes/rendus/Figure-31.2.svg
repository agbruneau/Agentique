<text x="59.207" y="167.473" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="185.082" fill="#1F1F1F" font-size="14" textLength="199.22">Inventaire, cotation, cycle de vie</text><text x="59.207" y="202.691" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="220.301" fill="#1F1F1F" font-size="14" textLength="238.93">Documentation des usages approuvés</text><text x="59.207" y="237.91" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="255.519" fill="#1F1F1F" font-size="14" textLength="133.082">Surveillance continue</text><text x="59.207" y="273.129" fill="#1F1F1F" font-size="14"> </text><text x="59.207" y="290.738" fill="#1F1F1F" font-size="14" textLength="247.844" font-weight="700">régime du risque de modèle — ch. 25</text></g><!--entity C2--><g class="entity" data-qualified-name="P2.C2" id="ent0004" data-source-line="40"><rect x="424.707" y="125.33" width="246.864" height="178.484" fill="#FFF" style="stroke:#9C3D14;stroke-width:0.5;" rx="3" ry="3"/><text x="434.707" y="149.863" fill="#1F1F1F" font-size="14" textLength="226.864" font-weight="700">Parce qu'il s'exécute chez un tiers</text><text x="434.707" y="167.473" fill="#1F1F1F" font-size="14"> </text><text x="434.707" y="185.082" fill="#1F1F1F" font-size="14" textLength="156.434">Résilience opérationnelle</text><text x="434.707" y="202.691" fill="#1F1F1F" font-size="14"> </text><text x="434.707" y="220.301" fill="#1F1F1F" font-size="14" textLength="190.641">Inscription au registre des tiers</text><text x="434.707" y="237.91" fill="#1F1F1F" font-size="14"> </text><text x="434.707" y="255.519" fill="#1F1F1F" font-size="14" textLength="116.73">Continuité et sortie</text><text x="434.707" y="273.129" fill="#1F1F1F" font-size="14"> </text><text x="434.707" y="290.738" fill="#1F1F1F" font-size="14" textLength="223.009" font-weight="700">régime de la résilience — § 30.2.2</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="46"><path d="M156.207,366.33 L156.207,403