<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:930px;height:255px;background:#FAF8F5;" width="930px" height="255px" viewBox="0 0 930 255" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="930" height="255" fill="#FAF8F5" style="stroke:none;"/><g class="title" data-source-line="13"><text x="286.748" y="24.533" fill="#8B2E0B" font-size="14" textLength="350.267" font-weight="700" font-family="'DejaVu Sans'">TROIS VIDES, ET CE QU'ILS NE VEULENT PAS DIRE</text></g><!--entity V1--><g class="entity" data-qualified-name="V1" id="ent0001" data-source-line="15"><rect x="7" y="45.609" width="222.269" height="108.047" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="70.143" fill="#000" font-size="14" textLength="202.269" font-weight="700" font-family="'DejaVu Sans'">1  Le protocole ne le porte pas</text><text x="17" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="17" y="105.361" fill="#000" font-size="14" textLength="169.661" font-family="'DejaVu Sans'">Et ne prétend pas le porter.</text><text x="17" y="122.971" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="17" y="140.58" fill="#000" font-size="14" textLength="140.062" font-style="italic" font-family="'DejaVu Sans'">hors périmètre déclaré</text></g><!--entity V2--><g class="entity" data-qualified-name="V2" id="ent0002" data-source-line="16"><rect x="264.5" y="45.609" width="293.191" height="108.047" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="274.5" y="70.143" fill="#000" font-size="14" textLength="213.965" font-weight="700" font-family="'DejaVu Sans'">2  Le socle ne le documente pas</text><text x="274.5" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="274.5" y="105.361" fill="#000" font-size="14" textLength="273.191" font-family="'DejaVu Sans'">Absence de documentation, non fait négatif.</text><text x="274.5" y="122.971" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="274.5" y="140.58" fill="#000" font-size="14" textLength="47.482" font-style="italic" font-family="'DejaVu Sans'">degré 3</text></g><!--entity V3--><g class="entity" data-qualified-name="V3" id="ent0003" data-source-line="17"><rect x="593" y="45.609" width="323.762" height="108.047" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="603" y="70.143" fill="#000" font-size="14" textLength="149.611" font-weight="700" font-family="'DejaVu Sans'">3  Le texte n'exige rien</text><text x="603" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="603" y="105.361" fill="#000" font-size="14" textLength="303.762" font-family="'DejaVu Sans'">L'exigence supposée n'est pas dans l'instrument.</text><text x="603" y="122.971" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="603" y="140.58" fill="#000" font-size="14" textLength="129.965" font-style="italic" font-family="'DejaVu Sans'">ne pas faire dire plus</text></g><!--link V1 to V2--><!--link V2 to V3--><g class="legend" data-source-line="22"><rect x="162.983" y="173.656" width="597.795" height="62.828" fill="#FBF9F5" style="stroke:#BBB;stroke-width:1;" rx="7.5" ry="7.5"/><text x="167.983" y="193.189" fill="#000" font-size="14" textLength="587.795" font-family="'DejaVu Sans'">Le renversement est LE RÉSULTAT LE PLUS UTILE DU CHAPITRE : la question cesse d'être</text><text x="167.983" y="210.799" fill="#000" font-size="14" textLength="561.825" font-family="'DejaVu Sans'">« quel protocole répond à quelle exigence » pour devenir « qu'est-ce que l'architecture doit</text><text x="167.983" y="228.408" fill="#000" font-size="14" textLength="444.411" font-family="'DejaVu Sans'">porter que rien ne porte »