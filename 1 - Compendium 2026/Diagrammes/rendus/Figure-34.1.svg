<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1125px;height:447px;background:#FFFFFF;" width="1125px" height="447px" viewBox="0 0 1125 447" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster P1--><g class="cluster" data-qualified-name="P1" id="ent0001" data-source-line="35"><path d="M10.527,89.3 L187.885,89.3 A4.5,4.5 0 0 1 190.885,92.3 L197.885,112.909 L411.527,112.909 A3,3 0 0 1 414.527,115.909 L414.527,350.3 A3,3 0 0 1 411.527,353.3 L10.527,353.3 A3,3 0 0 1 7.527,350.3 L7.527,92.3 A3,3 0 0 1 10.527,89.3" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="7.527" y1="112.909" x2="197.885" y2="112.909" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="11.527" y="105.833" fill="#444" font-size="14" textLength="177.358" font-weight="700">PRODUCTIVITÉ ASSISTÉE</text></g><!--cluster P2--><g class="cluster" data-qualified-name="P2" id="ent0003" data-source-line="39"><path d="M457.527,98.3 L694.741,98.3 A4.5,4.5 0 0 1 697.741,101.3 L704.741,121.909 L884.527,121.909 A3,3 0 0 1 887.527,124.909 L887.527,341.3 A3,3 0 0 1 884.527,344.3 L457.527,344.3 A3,3 0 0 1 454.527,341.3 L454.527,101.3 A3,3 0 0 1 457.527,98.3" style="stroke:#9C3D14;stroke-width:1.5;" fill="#FDFBF7"/><line x1="454.527" y1="121.909" x2="704.741" y2="121.909" style="stroke:#9C3D14;stroke-width:1.5;"/><text x="458.527" y="114.833" fill="#9C3D14" font-size="14" textLength="237.214" font-weight="700">AUTONOMIE TRANSACTIONNELLE</text></g><!--entity C1--><g class="entity" data-qualified-name="P1.C1" id="ent0002" data-source-line="36"><rect x="51.027" y="133.3" width="339.402" height="196.094" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="61.027" y="157.833" fill="#1F1F1F" font-size="14" textLength="238.848" font-weight="700">Un copilote rédige, résume, prépare</text><text x="61.027" y="175.443" fill="#1F1F1F" font-size="14"> </text><text x="61.027" y="193.052" fill="#1F1F1F" font-size="14" textLength="319.402">Aucune transaction irréversible n'est exécutée sans</text><text x="61.027" y="210.661" fill="#1F1F1F" font-size="14" textLength="129.972">intervention humaine</text><text x="61.027" y="228.271" fill="#1F1F1F" font-size="14"> </text><text x="61.027" y="245.88" fill="#1F1F1F" font-size="14" textLength="269.63">Le seuil du ch. 31 § 31.1.1 n'est pas franchi</text><text x="61.027" y="263.489" fill="#1F1F1F" font-size="14"> </text><text x="61.027" y="281.099" fill="#1F1F1F" font-size="14" textLength="273.164">La quasi-totalité des déploiements observés</text><text x="61.027" y="298.708" fill="#1F1F1F" font-size="14"> </text><text x="61.027" y="316.318" fill="#1F1F1F" font-size="14" textLength="203.089" font-weight="700">le régime dominant, 2024-2026</text></g><!--entity C2--><g class="entity" data-qualified-name="P2.C2" id="ent0004" data-source-line="40"><rect x="497.527" y="142.3" width="365.639" height="178.484" fill="#FFF" style="stroke:#9C3D14;stroke-width:0.5;" rx="3" ry="3"/><text x="507.527" y="166.833" fill="#1F1F1F" font-size="14" textLength="345.639" font-weight="700">L'agent initie une action à effet financier irrévocable</text><text x="507.527" y="184.443" fill="#1F1F1F" font-size="14"> </text><text x="507.527" y="202.052" fill="#1F1F1F" font-size="14" textLength="249.382">Le seuil de finalité est franchi par l'agent</text><text x="507.527" y="219.661" fill="#1F1F1F" font-size="14"> </text><text x="507.527" y="237.271" fill="#1F1F1F" font-size="14" textLength="252.923">Le régime réglementaire change avec lui</text><text x="507.527" y="254.88" fill="#1F1F1F" font-size="14"> </text><text x="507.527" y="272.489" fill="#1F1F1F" font-size="14" textLength="279.371">Rare, et rarement ce que le discours désigne</text><text x="507.527" y="290.099" fill="#1F1F1F" font-size="14"> </text><text x="507.527" y="307.708" fill="#1F1F1F" font-size="14" textLength="201.523" font-weight="700">le régime que le vertical durcit</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="46"><path d="M250.527,392.3 L250.527,429.003 A3,3 0 0 0 253.527,432.003 L1107.313,432.003 A3,3 0 0 0 1110.313,429.003 L1110.313,399.3 L1100.313,389.3 L684.527,389.3 L680.527,320.53 L676.527,389.3 L253.527,389.3 A3,3 0 0 0 250.527,392.3" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M1100.313,389.3 L1100.313,397.8 A1.5,1.5 0 0 0 1101.813,399.3 L1110.313,399.3 L1100.313,389.3" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="256.527" y="407.795" fill="#333" font-size="13" textLength="838.786">LA QUASI-TOTALITÉ DES DÉPLOIEMENTS OBSERVÉS EN 2024-2026 RELÈVENT DU PREMIER RÉGIME. Présenter un copilote comme une</text><text x="256.527" y="424.147" fill="#333" font-size="13" textLength="657.579">autonomie transactionnelle est la confusion que le discours commercial entretient, et que ce tri existe pour défaire.</text></g><!--link P1 to P2--><?plantuml-src bPN1Rjf048RlVefHUiWbq9AW9fKGafEu5P83r8PScXxMwrcpYhrBr-kqLTLxUOlUghn6_MATDOw0a4ZfMZAhPNR-cMzcO25JXDAYGMs_Bz4hRwLQCiCAI1Y_pOokL7gXSstWbMZMbaMvOAd-AbK6WkNbzjqK1Qjo-ruhEsO5GinK6QEHsxSRrrmRXGRURfqlIPTb23yye7M-5qKg4d6w_awR54rxdlQvuEjp9zkUzflb_TptFnWmpb7PuV1_bTxnaxJNVwpKdcuh6UIMgIn_FfTJqKVSLqZEaZxZZnLwmZrFAxmWctNrNfZD4rfAs-SJOU9Cz5-Qo4cpoBdtKEk3QJIvd5_CHjUZMRq2Fuv7CMs20s0bJ7kjx8RdmI0PpXLmlPIv2ylKzwdCyCXjoggWpP9s53SENYV36tMZ_8fN2i4QwaJ6hTGAf26REpIbJCYbEiJI0dwhxtbbwtiQ2hAyKLBHRDmHMNTZKHLCAdJ-GZB0IkQGLi0NNJZfmTy_zExIq_fQKko2zFX2DZSOVAbOAJjMMvPBqg0nAI6bE7CjiI2D4dHIaXmbuMvGadcJMoPfXb9TICMKFOBZDyVz3htUkkGQH1Uz7Ph-V3OPJwv60SmYVnpx17Oo7WTXs08zXhr-sMKR7f8VPK4gQIM28zT2gty32e4MX0k6InhUDKVD6M5ymBt1WutbEbz7fIL2T0paQvdsmaEYxZDlU31faEXINAH_Xnpoga4PKM6FW88mj766m97W8b3ugIovham3jfJPkbgx95jBAhsLdBaI6Yxj1kOs7iUL6h3pQI7J5DLd8xE5xGo9eUSr4v5eQtNXXJvydFlng3ERpFomwUBB88RBUZKD9wFWAXZFOfYSnq5qNQzY2CQRAa8KXFMlQxA0opbCeu0A5q5KhpwChe8kJ