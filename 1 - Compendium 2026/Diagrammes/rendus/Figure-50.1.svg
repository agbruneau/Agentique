<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1134px;height:290px;background:#FAF8F5;" width="1134px" height="290px" viewBox="0 0 1134 290" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1134" height="290" fill="#FAF8F5" style="stroke:none;"/><g class="title" data-source-line="11"><text x="280.736" y="24.533" fill="#8B2E0B" font-size="14" textLength="566.282" font-weight="700" font-family="'DejaVu Sans'">QUATORZE ÉVÉNEMENTS DU TABLEAU 50.1 ILLUSTRÉS PAR TROIS ÉTATS TYPES</text></g><!--entity E1--><g class="entity" data-qualified-name="E1" id="ent0001" data-source-line="13"><rect x="7" y="45.609" width="393.536" height="143.266" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="70.143" fill="#000" font-size="14" textLength="260.258" font-weight="700" font-family="'DejaVu Sans'">agent-outil  —  Révisions protocolaires</text><text x="17" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="17" y="105.361" fill="#000" font-size="14" textLength="268.481" font-family="'DejaVu Sans'">La couche protocolaire du Livre I se périme</text><text x="17" y="122.971" fill="#000" font-size="14" textLength="241.992" font-family="'DejaVu Sans'">au rythme de ses DEUX spécifications,</text><text x="17" y="140.58" fill="#000" font-size="14" textLength="157.985" font-family="'DejaVu Sans'">non de la seule première.</text><text x="17" y="158.189" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="17" y="175.799" fill="#000" font-size="14" textLength="373.536" font-style="italic" font-family="'DejaVu Sans'">survenu côté MCP (revalidé le 30 juill. 2026) ; A2A inchangé</text></g><!--entity E2--><g class="entity" data-qualified-name="E2" id="ent0002" data-source-line="14"><rect x="436" y="45.609" width="359.623" height="143.266" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="446" y="70.143" fill="#000" font-size="14" textLength="254.837" font-weight="700" font-family="'DejaVu Sans'">à moitié  —  Transfert de gouvernance</text><text x="446" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="446" y="105.361" fill="#000" font-size="14" textLength="186.375" font-family="'DejaVu Sans'">L'annonce du don est établie ;</text><text x="446" y="122.971" fill="#000" font-size="14" textLength="122.521" font-family="'DejaVu Sans'">la suite ne l'est pas.</text><text x="446" y="140.58" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="446" y="158.189" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="446" y="175.799" fill="#000" font-size="14" textLength="339.623" font-style="italic" font-family="'DejaVu Sans'">candidat survenu à moitié, et c'est la moitié qui compte</text></g><!--entity E3--><g class="entity" data-qualified-name="E3" id="ent0003" data-source-line="15"><rect x="831.5" y="45.609" width="289.254" height="143.266" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="841.5" y="70.143" fill="#000" font-size="14" textLength="262.801" font-weight="700" font-family="'DejaVu Sans'">attendu  —  Désignation de l'organisme</text><text x="841.5" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="841.5" y="105.361" fill="#000" font-size="14" textLength="218.675" font-family="'DejaVu Sans'">Fait négatif vérifié : quatre chaînes,</text><text x="841.5" y="122.971" fill="#000" font-size="14" textLength="179.737" font-family="'DejaVu Sans'">trois textes, zéro occurrence.</text><text x="841.5" y="140.58" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="841.5" y="158.189" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="841.5" y="175.799" fill="#000" font-size="14" textLength="269.254" font-style="italic" font-family="'DejaVu Sans'">ch. 32 — ce qui se refait est tout le chapitre</text></g><!--link E1 to E2--><!--link E2 to E3--><g class="legend" data-source-line="20"><rect x="186.147" y="208.875" width="755.459" height="62.828" fill="#FBF9F5" style="stroke:#BBB;stroke-width:1;" rx="7.5" ry="7.5"/><text x="191.147" y="228.408" fill="#000" font-size="14" textLength="681.454" font-family="'DejaVu Sans'">UN ÉVÉNEMENT SURVENU N'EST PAS UN ÉVÉNEMENT PAYÉ. L'un des quatorze est survenu à moitié —</text><text x="191.147" y="246.018" fill="#000" font-size="14" textLength="745.459" font-family="'DejaVu Sans'">l'annonce est établie, la suite ne l'est pas —, et un autre est le seul du corpus dont le dispositif ait été éprouvé par le réel</text><text x="191.147" y="263.627" fill="#000" font-size="14" textLength="232.695" font-family="'DejaVu Sans'">(ch. 8, revalidation du 30 juillet 2026).</text></g><?plantuml-src RLFBKjj04BpxAwR8mSG53ZP5YWIAAXdBLLGPurWI5HBdi4XZUOcyw-p3IJZboZqVa6DqoIb_i7-IByciCCOyT9AqlTFTqpFwCnTpfjWCBbdwELVIYknO5bB1YrxGs-_jrVGAeQSiar-vo6722erh9nbEc2rCJmepO3E4ZIvUiNCB4HDwOmrdk2dGevOK-vrskDDP0oXC3HDvWHsfCbHBMATwdeKz4RtNQuNhq09p5DbJNAVtve6v9UuPsbgb6jubGNms-X22kpbtDuFmD1p44NGJY8DEFmmIsDjfjk2atq-YUEHk8XW68uX7PoSHtOW3miONmp2grLRYOQFHOCHgjgKrl03uz-CdmCYL2wwv51hcIXgPoe9nXRhH68knw3D8fKsd-E0GCWjzlg2N4z1qv4h5PpWMp8BwRgQKI8PqeA4R9kz1qtdA9pnbnjDiZOMGmYCAHY1R-Deuu-wtmgRdFEH7sge52Wkf-sjS2QV7GzXKk605p-YJRkpkm9NbHT64zaxxzKiuWA0T01VfbAowyl0LFze0fY5iFVJlVi5CSiEfogtzMD7CJ50PBoYNTe5AC97YqdwTUR5fvJWZrQWDkDAmou8Z78o5js2vGH1af-vFvqnNBYeVAHCPpvY1EqFt_5k01jBg2XMv4_N5SchuR6xmtaBxKOJ6qEJOfVwkApNFHTNQggTrgN8ck9ujBVGODo1ScHDa0WiVrSGplIKkPYX2Qfdx8z3dOfJa6Wn-C_G9ruIL8DFKAeNKWpLRqoRijYi1r1glcQP0qL8IbJTaQC1yIbHwpedZtijkhHQsOFlZb6SPYa-AvrEpxIs6xQT_2Nox9d0fZP6p6a0oMDy7Y9BHUJX8O50FevWs87eC60ONxgO9_RhrtT6LPwckiPBvD1HlYLYALUphUM_1isdxErMOHC6ixsYLALQpxUScbMfkjH-VwdV6zLngxjFm_QBgnEjAsYzBwL15vL7AbLYGb4tVw_qjM4x_CcUxMW3YhJQWMQC-tNRhFm00?></g></svg>