<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:905px;height:327px;background:#FFFFFF;" width="905px" height="327px" viewBox="0 0 905 327" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="9"><rect x="7" y="7" width="422.968" height="191.619" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="31.028" fill="#57534E" font-size="13" textLength="145.158" font-family="'Segoe UI'">L'AGENT COMME CLIENT</text><line x1="8" y1="34.291" x2="428.968" y2="34.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="17" y="52.319" fill="#000" font-size="13" textLength="402.968" font-weight="700" font-family="'Segoe UI'">« Une application qui demande des ressources protégées pour… »</text><text x="17" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="86.901" fill="#000" font-size="13" textLength="285.003" font-family="'Segoe UI'">Le client est déjà, par construction, un mandataire</text><text x="17" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="121.483" fill="#000" font-size="13" textLength="191.007" font-family="'Segoe UI'">L'agent hérite d'un rôle qui existe</text><text x="17" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="17" y="156.065" fill="#000" font-size="13" textLength="206.851" font-family="'Segoe UI'">Mais le mandant reste hors du jeton</text><line x1="8" y1="163.328" x2="428.968" y2="163.328" style="stroke:#B8B2A6;stroke-width:1;"/><text x="17" y="181.356" fill="#000" font-size="13" textLength="206.515" font-weight="700" font-family="'Segoe UI'">le rôle existe, la chaîne n'y est pas</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="23"><rect x="465.5" y="7" width="425.583" height="191.619" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="475.5" y="31.028" fill="#9A3412" font-size="13" textLength="265.427" font-family="'Segoe UI'">L'AGENT COMME DÉTENTEUR DE RESSOURCE</text><line x1="466.5" y1="34.291" x2="890.083" y2="34.291" style="stroke:#9A3412;stroke-width:1;"/><text x="475.5" y="52.319" fill="#000" font-size="13" textLength="405.583" font-weight="700" font-family="'Segoe UI'">« Une entité capable d'accorder l'accès à une ressource protégée »</text><text x="475.5" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="475.5" y="86.901" fill="#000" font-size="13" textLength="364.787" font-family="'Segoe UI'">Le détenteur est une ENTITÉ, non nécessairement une personne</text><text x="475.5" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="475.5" y="121.483" fill="#000" font-size="13" textLength="257.004" font-family="'Segoe UI'">« Utilisateur final » est réservé au cas humain</text><text x="475.5" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="475.5" y="156.065" fill="#000" font-size="13" textLength="201.297" font-family="'Segoe UI'">Un agent peut donc en tenir le rôle</text><line x1="466.5" y1="163.328" x2="890.083" y2="163.328" style="stroke:#9A3412;stroke-width:1;"/><text x="475.5" y="181.356" fill="#000" font-size="13" textLength="265.738" font-weight="700" font-family="'Segoe UI'">la définition l'admet, l'imputabilité s'y perd</text></g><!--entity NOTE--><g class="entity" data-qualified-name="NOTE" id="ent0003" data-source-line="37"><rect x="127" y="259" width="643.156" height="54.582" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:0.5;" rx="3" ry="3"/><text x="137" y="283.028" fill="#000" font-size="13" textLength="623.156" font-family="'Segoe UI'">Rien dans les deux définitions n'écarte un mandataire logiciel — et rien ne l'y installe. Le RFC ne tranche pas :</text><text x="137" y="300.319" fill="#000" font-size="13" textLength="443.403" font-family="'Segoe UI'">il n'avait pas la question. C'est un standard étiré, non un standard qui répond.</text></g><!--link C1 to C2--><!--link C1 to NOTE--><!--link C2 to NOTE--><?plantuml-src VLJBJjj05DtdAwxA8b84j118AKL8mN4g91vI7Yl4uiOUue7nZ9aPKzeLM_Rz05PLeqfTTTST_XE-f6SSeIO8rHlRT-wSEVUSOtjJa3SqCTwRd59fHUAbqGrt9NN1bdDo6QVcizHJkc3bnCAADQLE4sEriDHPgAVYWalb-qRx4yu5lHcAgH4qFdppUjDGVXMqqLvOd71oDQtX8wECfPL-VJKQWHxhgH8KRQ3QxNVwxpuggSNkmSx1PhT3PmsYlIHisbtPVh_TtehtZvhTJ_79YABJu-EOegD3lEozhNlsqRs62xTMw_4dZRKWBWeb4mugq7KfGJHddGhS7LdXd2bjWiV26b_DfjKiFAFsTFUT7l-qMWrW7GbAb1JQat2UqcfsMJsi4aQZn6ZdRLbhl4gbfe3Ddg5xlR79qx0jgsPMUfpPH8kjVcFUG4NSIkVhncEMZb2jjsC3YA4zCzPHMjAbyB1mOJHqpb7c2Akac9ACgr-OLpU_r3GBTc1_lgJnvhFoSuq_TDjR6vjB6izBBpJkLVSZlCNZ0VLY6iJ3uUbu4CN_4Hr3IyX92HSyKM5mJf2i5CbIuR7wuQXwW63YdmSB5Ymg3xazu4Hfwx725d0v75NtgwJXgQvcyCy5oVEWTMWeX7L6wrhQmCXB9HtN61TIim9-3MQhcHFs1aIv15T7MPcpr67RMDFSkqAKyDpe14CHc4XBp_8lMSA1AT1bdJHCcUR2mvccp8lIymGKWY8Eze1U-jARazDH37Ts-jlFNq2lqsj7lTgT0S9724R8218Xojl5mnmyXmXi4Pcb298oKvb8eUZfxXi9p1jme8y22Odaib9YFOWyw4UXxYth91CXExIBSwK2DD-mhECKKdPTGZUSkKvHSsu70GO7sfHWb8IYSriM5qBMiL0OdQw7gV6jhvrbCas5FhToclcrVMHpgOnVb4OrgD90R5-h_mK0?></g></svg>