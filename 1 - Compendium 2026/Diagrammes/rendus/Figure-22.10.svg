122" font-family="'Segoe UI'">  </text><text x="223.835" y="75.528" fill="#000" font-size="13" textLength="87.458" font-weight="700" font-family="'Segoe UI'">L'organisation</text><line x1="200.236" y1="78.791" x2="335.502" y2="78.791" style="stroke:#B8B2A6;stroke-width:1;"/><text x="209.236" y="96.819" fill="#000" font-size="13" textLength="117.267" font-family="'Segoe UI'">Qui impose le cadre.</text></g><!--entity P3--><g class="entity" data-qualified-name="CADRE.P3" id="ent0004" data-source-line="25"><rect x="371.236" y="51.5" width="120.902" height="62.582" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="381.236" y="75.528" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">3</text><text x="388.713" y="75.528" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="395.835" y="75.528" fill="#000" font-size="13" textLength="86.303" font-weight="700" font-family="'Segoe UI'">Le fournisseur</text><line x1="372.236" y1="78.791" x2="491.138" y2="78.791" style="stroke:#B8B2A6;stroke-width:1;"/><text x="381.236" y="96.819" fill="#000" font-size="13" textLength="66.066" font-family="'Segoe UI'">Du modèle.</text></g><!--entity P4--><g class="entity" data-qualified-name="CADRE.P4" id="ent0005" data-source-line="31"><rect x="527.236" y="43" width="151.124" height="79.873" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="537.236" y="67.028" fill="#9A3412" font-size="13" font-weight="700" font-family="'Segoe UI'">4</text><text x="544.713" y="67.028" fill="#000" font-size="13" textLength="7.122" font-family="'Segoe UI'">  </text><text x="551.835" y="67.028" fill="#000" font-size="13" textLength="66.733" font-weight="700" font-family="'Segoe UI'">Le système</text><line x1="528.236" y1="70.291" x2="677.359" y2="70.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="537.236" y="88.319" fill="#000" font-size="13" textLength="131.124" font-family="'Segoe UI'">Dont le comportement</text><text x="537.236" y="105.61" fill="#000" font-size="13" textLength="78.628" font-family="'Segoe UI'">est émergent.</text></g><!--link P1 to P2--><!--link P2 to P3--><!--link P3 to P4--><g class="legend" data-source-line="43"><rect x="12" y="159" width="689.472" height="47.242" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:1;" rx="3" ry="3"/><text x="17" y="179.107" fill="#000" font-size="14" textLength="679.472" font-family="'Segoe UI'">La section PRÉPARE l'écart, elle ne le traite pas : l'imputabilité du comportement émergent est au ch. 29 § 29.3.</text><text x="17" y="197.729" fill="#000" font-size="14" textLength="555.16" font-family="'Segoe UI'">L'indétermination est celle du manifeste, et la somme n'y répond pas — elle en fixe le lieu.</text></g><?plantuml-src bLJ1Qjj04BthAuRaO1296rkkIT8Ga2CB18vn7FiKSbXhn_8IQLUiLctJKkZLz_v3uz-e_gHVqj6w4BjM3zc34FlUxhmtyoIZSZ0A5ieObG4N6cCZb7IA9o5pfba6nOfnzKd819OiBN07qQgKF5PQeeR-pZx79IjJ4offnYn3EBh7H27CewDcqhtuWj3nTi05YvyIU_sDIfM6uz2k7KQA2Ke-EE2TX-_3iqEUqXprNqxG3xoRu3-SsKh4JnAB0ZgEKpU3oIGb2tTpVpOTmiIVpgBX_GdCnqE8RYVpcJ-8Hj6iMaCq3ghrR3YzZSRLUdW4h80RFw0pjVWWlFYG2ecN5xxNwtJXgmFmUlkaGoG_x8TdMzBWVD3r-_10982hk9PzURmzUUsw7TUzUcSthm5STuJ0gyr7J5MUOwbTrvuwfMLVxae13AfDh8M1jCN8gcaJykZiI-Y-HKBt7majfHCcHS7gx3Gf45ck2gHEGyounYO1tbi4U0SzMAfIauAYeGL12PdYrKlQMBVtbhgzWxh5Ss6gbmmFYbAmhLz5rhN1ZFfk0ImCZID3lJS9Yi3fmqfmZl9HYsHbJgzf9ZNGRG2y6l0QW9xppN6sUIRAY46n_PvXCgtM5DuXHO2omBGv0Kn9dhH3CPe9Wv1JPY-9GTCg3Lk8L9Xg0xpSC_4gtbfXXAxQqBs0Np_fsVPgIwEMa1HAWpeJqeR2ScDRakxBA2nBsa5IGLqYcIgZ7uLiFOEkDhcIt6hv_Vt7LYLAM8hFLcegi6mxv6_hyWy0?></g></svg>