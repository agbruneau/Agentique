<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:749px;height:327px;background:#FFFFFF;" width="749px" height="327px" viewBox="0 0 749 327" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="9"><rect x="59.5" y="7" width="318.149" height="191.619" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="69.5" y="31.028" fill="#57534E" font-size="13" textLength="151.722" font-family="'Segoe UI'">AGENT-CONSOMMATEUR</text><line x1="60.5" y1="34.291" x2="376.649" y2="34.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="69.5" y="52.319" fill="#000" font-size="13" textLength="166.543" font-weight="700" font-family="'Segoe UI'">Il invoque, il lit, il interroge</text><text x="69.5" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="69.5" y="86.901" fill="#000" font-size="13" textLength="160.278" font-family="'Segoe UI'">Invoque une API ou un outil</text><text x="69.5" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="69.5" y="121.483" fill="#000" font-size="13" textLength="139.509" font-family="'Segoe UI'">Lit un flux d'événements</text><text x="69.5" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="69.5" y="156.065" fill="#000" font-size="13" textLength="298.149" font-family="'Segoe UI'">Interroge une source pour fonder son raisonnement</text><line x1="60.5" y1="163.328" x2="376.649" y2="163.328" style="stroke:#B8B2A6;stroke-width:1;"/><text x="69.5" y="181.356" fill="#000" font-size="13" textLength="159.866" font-weight="700" font-family="'Segoe UI'">l'acteur récepteur du ch. 1</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="23"><rect x="413" y="7" width="224.972" height="191.619" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="423" y="31.028" fill="#9A3412" font-size="13" textLength="126.661" font-family="'Segoe UI'">AGENT-PRODUCTEUR</text><line x1="414" y1="34.291" x2="636.972" y2="34.291" style="stroke:#9A3412;stroke-width:1;"/><text x="423" y="52.319" fill="#000" font-size="13" textLength="166.816" font-weight="700" font-family="'Segoe UI'">Il déclenche, il émet, il écrit</text><text x="423" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="423" y="86.901" fill="#000" font-size="13" textLength="133.44" font-family="'Segoe UI'">Déclenche un workflow</text><text x="423" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="423" y="121.483" fill="#000" font-size="13" textLength="114.55" font-family="'Segoe UI'">Émet un événement</text><text x="423" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="423" y="156.065" fill="#000" font-size="13" textLength="204.972" font-family="'Segoe UI'">Écrit dans un système d'information</text><line x1="414" y1="163.328" x2="636.972" y2="163.328" style="stroke:#9A3412;stroke-width:1;"/><text x="423" y="181.356" fill="#000" font-size="13" textLength="157.358" font-weight="700" font-family="'Segoe UI'">l'acteur émetteur du ch. 1</text></g><!--entity NOTE--><g class="entity" data-qualified-name="NOTE" id="ent0003" data-source-line="37"><rect x="7" y="259" width="728.557" height="54.582" fill="#F8F5F0" style="stroke:#D6D3CD;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="283.028" fill="#000" font-size="13" textLength="687.064" font-family="'Segoe UI'">La dualité RECOUPE celle de l'acteur émetteur et récepteur du ch. 1 : ce n'est pas une nouveauté agentique, c'est le tissu</text><text x="17" y="300.319" fill="#000" font-size="13" textLength="708.557" font-family="'Segoe UI'">existant qui reçoit un acteur de plus. Ce qui change n'est pas le rôle