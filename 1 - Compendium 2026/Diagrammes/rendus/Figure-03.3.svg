<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:752px;height:303px;background:#FFFFFF;" width="752px" height="303px" viewBox="0 0 752 303" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="17"><rect x="23.782" y="7" width="308.393" height="191.619" fill="#FAF6F0" style="stroke:#B8B2A6;stroke-width:0.5;" rx="3" ry="3"/><text x="33.782" y="31.028" fill="#57534E" font-size="13" textLength="113.217" font-family="'Segoe UI'">PÉRIMÈTRE RÉSEAU</text><line x1="24.782" y1="34.291" x2="331.175" y2="34.291" style="stroke:#B8B2A6;stroke-width:1;"/><text x="33.782" y="52.319" fill="#000" font-size="13" textLength="223.78" font-weight="700" font-family="'Segoe UI'">La confiance dérive de la localisation</text><text x="33.782" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="33.782" y="86.901" fill="#000" font-size="13" textLength="253.83" font-family="'Segoe UI'">Dedans le périmètre : implicitement autorisé</text><text x="33.782" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="33.782" y="121.483" fill="#000" font-size="13" textLength="220.676" font-family="'Segoe UI'">Dehors : authentifié à l'entrée, une fois</text><text x="33.782" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="33.782" y="156.065" fill="#000" font-size="13" textLength="221.939" font-family="'Segoe UI'">Le déplacement latéral n'est pas vérifié</text><line x1="24.782" y1="163.328" x2="331.175" y2="163.328" style="stroke:#B8B2A6;stroke-width:1;"/><text x="33.782" y="181.356" fill="#000" font-size="13" textLength="288.393" font-weight="700" font-family="'Segoe UI'">un mur, et ce qu'il laisse passer une fois franchi</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="31"><rect x="361.782" y="7" width="360.057" height="191.619" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="3" ry="3"/><text x="371.782" y="31.028" fill="#9A3412" font-size="13" textLength="74.001" font-family="'Segoe UI'">ZERO-TRUST</text><line x1="362.782" y1="34.291" x2="720.839" y2="34.291" style="stroke:#9A3412;stroke-width:1;"/><text x="371.782" y="52.319" fill="#000" font-size="13" textLength="296.251" font-weight="700" font-family="'Segoe UI'">Aucune confiance n'est dérivée de la localisation</text><text x="371.782" y="69.61" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="371.782" y="86.901" fill="#000" font-size="13" textLength="278.338" font-family="'Segoe UI'">Authentification et autorisation à CHAQUE appel</text><text x="371.782" y="104.192" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="371.782" y="121.483" fill="#000" font-size="13" textLength="275.393" font-family="'Segoe UI'">Point de décision et point d'application distincts</text><text x="371.782" y="138.774" fill="#000" font-size="13" font-family="'Segoe UI'"> </text><text x="371.782" y="156.065" fill="#000" font-size="13" textLength="280.643" font-family="'Segoe UI'">TLS mutuel systématique entre charges de travail</text><line x1="362.782" y1="163.328" x2="720.839" y2="163.328" style="stroke:#9A3412;stroke-width:1;"/><text x="371.782" y="181.356" fill="#000" font-size="13" textLength="340.057" font-weight="700" font-family="'Segoe UI'">SPIFFE/SPIRE porte l'identité de charge ; WIMSE l'étend</text></g><!--link C1 to C2--><g class="legend" data-source-line="47"><rect x="12" y="218.619" width="721.621" height="65.863" fill="#F7F5F0" style="stroke:#C4BEB5;stroke-width:1;" rx="3" ry="3"/><text x="17" y="238.727" fill="#333" font-size="14" textLength="711.621" font-family="'Segoe UI'">NIST SP 800-207 nomme les composants — point de décision, point d'application, évaluation continue par requête.</text><text x="17" y="257.348" fill="#333" font-size="14" textLength="638.586" font-family="'Segoe UI'">Il ne dit pas ce qu'un point d'application doit LIRE quand l'appelant est un agent : c'est l'objet du ch. 37,</text><text x="17" y="275.969" fill="#333" font-size="14" textLength="228.696" font-family="'Segoe UI'">et le socle n'y répond pas davantage.</text></g><?plantuml-src VLFDRXen4BxlKuoQ0nT8-0aX9H4Iq5qLYQIK1LLgb8FnciMDrzxONghqr6DpxmFqMFeQ-oPzaevteGK5rPVLZh_vPkQRprQbO1KibBKgWOXhHYrNqZCFNAP4amJCYaJgCvSnB8amREz6gqn6L6d9D5pinIEs99cmWPBsbYGCNeKiLWpcerV7GI7_mg3HshjS4FeG5_H39PI6aw0uUmYf8cPO2gtwVaD4FhXWuzBRYmeMCnaDNb1sWdPGVubJEc9wYncU3_n1-mN6DRr5j8hZUKut8cF1ODX0xdvm4TIl19UiExWSDFiNSES1N5ENr3rfTzgjSxytoP-devlysspgmpH_3lt-_FgiWFGGNCFZSXQzCG6gv98JIHb4-KRpDNuP2092KIAu8MvdrsUBdeSPRrX4fC5M8NNO9FzfDOCky2GLd7BB4YOjaCmgpKs-ALDMIXl4O7I5jtp9ymtaFq1Ky4_d6rQ5J39OAcuSVbpqaGf2Ip91B9OY0cI56GifCR1sjHtDmIYPX2JJLM0MS9R7hC859dDZc4ioQAHT6LZYDkcA5rFT7mZStFcX5FXrltNUQ1u8N8Pw7_tfkzfiEWzdHtNjPzHL-wTjsNsfCCxy7utxVtMYHTmDj5Mq_4VjXc_xx-S-a3HbmkLC54Ufea8woiqsAosZ5OI97Ld4ZUMIsaBhsJX4pMp619WdWped27hC6BZDOFShecDc7A_LP4suE9Wnd8o2m3_33veiLThYI1KUkTwHocML17057qOteO-t-SQYntUwevrhToiUOSgzvl7Ardgu0SyhNm8MkHs5CmWdS5clrvhr3hxC1D-ym9QeIb9bYBG6Vd_zlfjqR_xgiUcha6_MH6Ib5BWSb29pzj2WsMEM_xBi5CkEq6n8nKktbMP2TnsLKo5gx0Hup8YCSCHY9zWOk7rZ5ecTYxj02mE8YbfymjL46Ofp2grE5UlXFthFA2gSJvu07qMgaCnLZr1tQP7ar4DDIcN-0000?></g></svg>