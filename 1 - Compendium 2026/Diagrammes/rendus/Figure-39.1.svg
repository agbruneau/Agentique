="14" textLength="50.6">§ 39.2.1</text></g><!--entity D2--><g class="entity" data-qualified-name="TROIS D.RIVES DU SOCLE ET UNE QUATRI.ME SOURCE RELEV.E .FRONT OUVERT..D2" id="ent0003" data-source-line="26"><rect x="460" y="42" width="336.265" height="125.656" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="470" y="66.533" fill="#9C3D14" font-size="14" font-weight="700">2</text><text x="477.786" y="66.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="489.455" y="66.533" fill="#1F1F1F" font-size="14" textLength="115.938" font-weight="700">Dérive de modèle</text><text x="470" y="84.143" fill="#1F1F1F" font-size="14"> </text><text x="470" y="101.752" fill="#1F1F1F" font-size="14" textLength="316.265">N'est pas au socle — le mot ne doit pas faire croire</text><text x="470" y="119.361" fill="#1F1F1F" font-size="14" textLength="54.804">l'inverse.</text><text x="470" y="136.971" fill="#1F1F1F" font-size="14"> </text><text x="470" y="154.58" fill="#666" font-size="14" textLength="50.6">§ 39.2.2</text></g><!--entity D3--><g class="entity" data-qualified-name="TROIS D.RIVES DU SOCLE ET UNE QUATRI.ME SOURCE RELEV.E .FRONT OUVERT..D3" id="ent0004" data-source-line="28"><rect x="22.5" y="228" width="372.837" height="125.656" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="32.5" y="252.533" fill="#9C3D14" font-size="14" font-weight="700">3</text><text x="40.286" y="252.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="51.955" y="252.533" fill="#1F1F1F" font-size="14" textLength="129.356" font-weight="700">Dérive d'autonomie</text><text x="32.5" y="270.143" fill="#1F1F1F" font-size="14"> </text><text x="32.5" y="287.752" fill="#1F1F1F" font-size="14" textLength="352.837">Nommée par les cadres ; le seul relevé d'instrumentation</text><text x="32.5" y="305.361" fill="#1F1F1F" font-size="14" textLength="128.741">ne l'instrumente pas.</text><text x="32.5" y="322.971" fill="#1F1F1F" font-size="14"> </text><text x="32.5" y="340.58" fill="#666" font-size="14" textLength="50.6">§ 39.2.3</text></g><!--entity D4--><g class="entity" data-qualified-name="TROIS D.RIVES DU SOCLE ET UNE QUATRI.ME SOURCE RELEV.E .FRONT OUVERT..D4" id="ent0005" data-source-line="29"><rect x="431" y="237" width="416.033" height="108.047" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="441" y="261.533" fill="#1F1F1F" font-size="14" textLength="210.813" font-weight="700">Quatrième source (front ouvert)</text><text x="441" y="279.143" fill="#1F1F1F" font-size="14"> </text><text x="441" y="296.752" fill="#1F1F1F" font-size="14" textLength="396.033">Mémoire réécrite par modèles auxiliaires · relève [C] hors socle.</text><text x="441" y="314.361" fill="#1F1F1F" font-size="14"> </text><text x="441" y="331.971" fill="#666" font-size="14" textLength="50.6">§ 39.2.4</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="38"><path d="M222.5,417 L222.5,470.055 A3,3 0 0 0 225.5,473.055 L1052.168,473.055 A3,3 0 0 0 1055.168,470.055 L1055.168,424 L1045.168,414 L643,414 L639,345.06 L635,414 L225.5,414 A3,3 0 0 0 222.5,417" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M1045.168,414 L1045.168,422.5 A1.5,1.5 0 0 0 1046.668,424 L1055.168,424 L1045.168,414" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="228.5" y="432.495" fill="#333" font-size="13" textLength="811.668">LES QUATRE NE SONT PAS DOCUMENTÉES AU MÊME DEGRÉ. Une seule est instruite par un chapitre ; une n'est pas au socle et le mot</text><text x="228.5" y="448.847" fill="#333" font-size="13" textLength="759.034">ne doit pas faire croire l'inverse ; une est nommée par les cadres sans être instrumentée ; la quatrième est portée par une relève [C]</text><text x="228.5" y="465.198" fill="#333" font-size="13" textLength="140.886">hors socle (front ouvert).</text></g><!--link D1 to D2--><!--link D3 to D4--><!--link D1 to D3--><!--