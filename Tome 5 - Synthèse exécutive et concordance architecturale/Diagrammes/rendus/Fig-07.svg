<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:502px;height:650px;background:#FFFFFF;" width="502px" height="650px" viewBox="0 0 502 650" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="11"><text x="34.766" y="24.533" fill="#000" font-size="14" textLength="425.469" font-weight="700">Chaîne multi-sauts, choc PKI / ML-DSA et double couloir d’audit</text><text x="47.156" y="39.028" fill="#475569" font-size="11" textLength="400.689" font-weight="700">RFC 8693 + DPoP/mTLS, parades HTTP 431 (kid, SCITT) et OTel vs audit JCS</text></g><!--cluster T1--><g class="cluster" data-qualified-name="T1" id="ent0001" data-source-line="16"><rect x="28" y="59.445" width="460" height="214" fill="#FFF" style="stroke:#2563EB;stroke-width:1;" rx="5" ry="5"/><text x="35.989" y="75.979" fill="#1D4ED8" font-size="14" textLength="444.021" font-weight="700">1. Délégation atténuée ≤ 2 sauts (EXIG-IAM-08..16, CAEP ≤ 15 min)</text></g><!--entity M1--><g class="entity" data-qualified-name="T1.M1" id="ent0002" data-source-line="17"><rect x="52" y="95.445" width="175.641" height="72.828" fill="#F8FAFC" style="stroke:#0F172A;stroke-width:0.5;" rx="5" ry="5"/><text x="62" y="119.979" fill="#000" font-size="14" textLength="126.786" font-weight="700">1. Mandant humain</text><text x="62" y="137.588" fill="#000" font-size="14" textLength="155.641">Session auth. · sub initial</text><text x="62" y="155.197" fill="#000" font-size="14" textLength="143.958">Anti-détournement PIM</text></g><!--entity M2--><g class="entity" data-qualified-name="T1.M2" id="ent0003" data-source-line="18"><rect x="253.5" y="95.445" width="204.796" height="72.828" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="263.5" y="119.979" fill="#1D4ED8" font-size="14" textLength="124.455" font-weight="700">2. Agent A (Saut 1)</text><text x="263.5" y="137.588" fill="#000" font-size="14" textLength="184.796">SPIFFE SVID + RFC 8693 #1</text><text x="263.5" y="155.197" fill="#000" font-size="14" textLength="142.406">aud=B + DPoP / mTLS</text></g><!--entity M3--><g class="entity" data-qualified-name="T1.M3" id="ent0004" data-source-line="19"><rect x="52" y="184.445" width="176.365" height="72.828" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="62" y="208.979" fill="#1D4ED8" font-size="14" textLength="156.365" font-weight="700">3. Agent B (Saut 2 max)</text><text x="62" y="226.588" fill="#000" font-size="14" textLength="142.03">sub gardé + act empilé</text><text x="62" y="244.197" fill="#000" font-size="14" textLength="127.135">Portées ⊆ #1 + RAR</text></g><!--entity M4--><g class="entity" data-qualified-name="T1.M4" id="ent0005" data-source-line="20"><rect x="271.5" y="184.445" width="169.42" height="72.828" fill="#ECFDF5" style="stroke:#16A34A;stroke-width:0.5;" rx="5" ry="5"/><text x="281.5" y="208.979" fill="#166534" font-size="14" textLength="105.048" font-weight="700">4. Cible via PEP</text><text x="281.5" y="226.588" fill="#000" font-size="14" textLength="149.42">Vérifie aud &amp; preuve cnf</text><text x="281.5" y="244.197" fill="#000" font-size="14" textLength="131.722">Prof. ≤ 2 · zéro relais</text></g><!--entity P2A--><g class="entity" data-qualified-name="P2A" id="ent0010" data-source-line="29"><rect x="23.5" y="297.445" width="205.145" height="125.656" fill="#FEF2F2" style="stroke:#991B1B;stroke-width:0.5;" rx="5" ry="5"/><text x="33.5" y="321.979" fill="#991B1B" font-size="14" textLength="185.145" font-weight="700">2a. Choc PKI 47 j &amp; ML-DSA</text><text x="33.5" y="339.588" fill="#000" font-size="14" textLength="164.069">• TLS : 100 j → 47 j (2029)</text><text x="33.5" y="357.197" fill="#000" font-size="14" textLength="175.704">• ML-DSA : 3,3-4,6 Ko (72×)</text><text x="33.5" y="374.807" fill="#000" font-size="14" textLength="138.394">• 3 sauts = 20 à 35 Ko</text><text x="33.5" y="392.416" fill="#000" font-size="14" textLength="172.197">• Rejet HTTP 431 (8-16 Ko)</text><text x="33.5" y="410.025" fill="#000" font-size="14" textLength="162.107">• PQC G7 : 2030-2035 [A]</text></g><!--entity P2B--><g class="entity" data-qualified-name="P2B" id="ent0011" data-source-line="31"><rect x="253.5" y="297.445" width="220.737" height="125.656" fill="#F5F3FF" style="stroke:#6D28D9;stroke-width:0.5;" rx="5" ry="5"/><text x="263.5" y="321.979" fill="#6D28D9" font-size="14" textLength="192.192" font-weight="700">2b. Parades P1-P2 (CAP-040)</text><text x="263.5" y="339.588" fill="#000" font-size="14" textLength="169.593">(1) Clés par réf. kid / JWKS</text><text x="282.948" y="357.197" fill="#000" font-size="14" textLength="137.977">&amp; passerelles ≥ 32 Ko</text><text x="263.5" y="374.807" fill="#000" font-size="14" textLength="200.737">(2) Transaction Tokens &amp; COSE</text><text x="263.5" y="392.416" fill="#000" font-size="14" textLength="176.237">(3) TLS 1.3 hybride + ACME</text><text x="263.5" y="410.025" fill="#000" font-size="14" textLength="180.462">(4) Merkle SCITT · SLH-DSA</text></g><!--entity C3A--><g class="entity" data-qualified-name="C3A" id="ent0013" data-source-line="36"><rect x="39.5" y="439.445" width="410.646" height="55.219" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="49.5" y="463.979" fill="#1D4ED8" font-size="14" textLength="217.813" font-weight="700">3a. OTel Couloir 1 · Opérationnel</text><text x="49.5" y="481.588" fill="#000" font-size="14" textLength="390.646">v1.41.0 épinglé · zéro contenu brut (OBS-07) · SHA-256 poivré</text></g><!--entity C3B--><g class="entity" data-qualified-name="C3B" id="ent0014" data-source-line="37"><rect x="7" y="510.445" width="475.711" height="55.219" fill="#FFF7ED" style="stroke:#C2410C;stroke-width:0.5;" rx="5" ry="5"/><text x="17" y="534.979" fill="#9A3412" font-size="14" textLength="248.138" font-weight="700">3b. Couloir 2 · Débogage / forensique</text><text x="17" y="552.588" fill="#000" font-size="14" textLength="455.711">« Bris de glace » double accord · purge ≤ 14 j (OBS-08) · art. 12.1 ≥ 1 an</text></g><!--entity C3C--><g class="entity" data-qualified-name="C3C" id="ent0015" data-source-line="38"><rect x="28" y="581.445" width="434.176" height="55.219" fill="#ECFDF5" style="stroke:#16A34A;stroke-width:0.5;" rx="5" ry="5"/><text x="38" y="605.979" fill="#166534" font-size="14" textLength="227.931" font-weight="700">3c. Journal d’audit probatoire JCS</text><text x="38" y="623.588" fill="#000" font-size="14" textLength="414.176">5 champs RFC 8785 avant relais P2/P3 · ancré/h · ≥ 24 m (RPRP)</text></g><!--link M1 to M2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="22" data-link-type="dependency"><path d="M228.34,131.945 C235.72,131.945 239.7,131.945 248.27,131.945" style="stroke:#2563EB;stroke-width:1;" fill="none" id="M1-to-M2"/><polygon points="253.27,131.945,244.27,127.945,248.27,131.945,244.27,135.945,253.27,131.945" fill="#2563EB" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link M3 to M4--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk7" data-source-line="23" data-link-type="dependency"><path d="M228.34,220.945 C241.28,220.945 254.12,220.945 266.08,220.945" style="stroke:#2563EB;stroke-width:1;" fill="none" id="M3-to-M4"/><polygon points="271.08,220.945,262.08,216.945,266.08,220.945,262.08,224.945,271.08,220.945" fill="#2563EB" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link M1 to M3--><!--link M2 to M4--><!--link P2A to P2B--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" id="lnk12" data-source-line="33" data-link-type="dependency"><path d="M228.71,360.445 C236.39,360.445 240.05,360.445 248.23,360.445" style="stroke:#6D28D9;stroke-width:1;" fill="no