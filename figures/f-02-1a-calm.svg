<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 201" width="504" height="201" role="img" aria-label="Arbre de decision fonde sur le theoreme CALM : programme monotone ou non.">
  <!-- § 2.1, chapitre 2 — d'après [6].
       Genere par figures/contenu.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       504 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #1A1A1A; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #8A3324; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #8A3324; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #767676; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4D4D4D; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #1A1A1A; }
  .renvoi { font-size: 6.2px; fill: #767676; }
  .chiffre{ font-size: 8px;   font-weight: 700; fill: #1A1A1A; }
  </style></defs>
  <rect x="0" y="0" width="504" height="201" fill="#FFFFFF"/>
  <text class="l titre" x="0" y="8">CE QUI SE DÉCENTRALISE, ET CE QUI NE SE DÉCENTRALISE PAS</text>
  <text class="l bande" x="0" y="24">Le programme s'exprime-t-il en logique monotone — une conclusion atteinte n'étant jamais rétractée par l'arrivée de</text>
  <text class="l bande" x="0" y="36">faits supplémentaires ?</text>
  <path d="M 128 48 H 376" fill="none" stroke="#C4C4C4" stroke-width=".6"/>
  <path d="M 128 48 V 56" fill="none" stroke="#8A3324" stroke-width=".9"/>
  <path d="M 128 60 l -3 -4 h 6 z" fill="#8A3324"/>
  <text class="l rang" x="12" y="70">OUI</text>
  <rect x="12" y="74" width="233" height="82" fill="#F7F4F1" stroke="#C4C4C4" stroke-width=".6"/>
  <text class="l bande" x="21" y="90">Implantation distribuée cohérente et sans</text>
  <text class="l bande" x="21" y="102">coordination</text>
  <text class="l ann" x="21" y="115">Accumuler, prendre un maximum, détecter un franchissement de</text>
  <text class="l ann" x="21" y="126">seuil, construire une union. Le programme produit la même</text>
  <text class="l ann" x="21" y="137">sortie quels que soient l'ordre et les délais des messages :</text>
  <text class="l ann" x="21" y="148">l'accord est évitable.</text>
  <path d="M 376 48 V 56" fill="none" stroke="#8A3324" stroke-width=".9"/>
  <path d="M 376 60 l -3 -4 h 6 z" fill="#8A3324"/>
  <text class="l rang" x="259" y="70">NON</text>
  <rect x="259" y="74" width="233" height="82" fill="#F7F4F1" stroke="#C4C4C4" stroke-width=".6"/>
  <text class="l bande" x="268" y="90">Coordination inévitable, seulement déplaçable</text>
  <text class="l ann" x="268" y="115">Compter exactement une fois, décrémenter un stock, attribuer</text>
  <text class="l ann" x="268" y="126">un propriétaire unique. L'invariant doit tenir à tout instant,</text>
  <text class="l ann" x="268" y="137">et le substrat événementiel ne suffit pas : le prix est celui</text>
  <text class="l ann" x="268" y="148">du chapitre 4.</text>
  <path d="M 0 162 H 504" fill="none" stroke="#C4C4C4" stroke-width=".6"/>
  <text class="l ann" x="0" y="175">Le résultat est constructif dans les deux sens, ce qui en fait une borne et pas un conseil. Aucun choix de base de données, de courtier ou de</text>
  <text class="l ann" x="0" y="185">bibliothèque ne fait passer un programme non monotone du côté gauche : pour celui-là, la coordination n'est pas évitable, elle est seulement</text>
  <text class="l ann" x="0" y="195">déplaçable.</text>
</svg>
