<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 162" width="468" height="162" role="img" aria-label="Chaine de quatre etapes d'un echange push-pull, avec la perte du message de retour.">
  <!-- § 4.1, chapitre 4 — d'après [83].
       Genere par figures/contenu.py — ne pas retoucher a la main :
       la retouche se perd a la regeneration. Convention : viewBox de
       468 unites = largeur du corps, une unite = un point. -->
  <defs><style>
  .l      { font-family: Corbel, Candara, "Segoe UI", sans-serif; }
  .bande  { font-size: 8.5px; font-weight: 700; fill: #1A1A1A; }
  .rang   { font-size: 7px;   font-weight: 700; fill: #8A3324; }
  .titre  { font-size: 6.5px; font-weight: 700; fill: #8A3324; letter-spacing: .1em; }
  .titreg { font-size: 6.5px; font-weight: 700; fill: #767676; letter-spacing: .1em; }
  .ann    { font-size: 7px;   fill: #4D4D4D; }
  .annf   { font-size: 7px;   font-weight: 700; fill: #1A1A1A; }
  .renvoi { font-size: 6.2px; fill: #767676; }
  .chiffre{ font-size: 8px;   font-weight: 700; fill: #1A1A1A; }
  </style></defs>
  <rect x="0" y="0" width="468" height="162" fill="#FFFFFF"/>
  <text class="l titre" x="0" y="8">UN SEUL MESSAGE PERDU, ET LA SOMME A DIMINUÉ</text>
  <rect x="0" y="14" width="100" height="78" fill="#F7F4F1" stroke="#C4C4C4" stroke-width=".6"/>
  <text class="l bande" x="9" y="31">1. i échantillonne j</text>
  <text class="l ann" x="9" y="44">L'agent i tire un pair</text>
  <text class="l ann" x="9" y="55">et lui envoie ⟨PUSH, e,</text>
  <text class="l ann" x="9" y="66">x⟩.</text>
  <path d="M 103.5 53.0 H 116.5" fill="none" stroke="#8A3324" stroke-width=".9"/>
  <path d="M 120.5 53.0 l -4 -3 v 6 z" fill="#8A3324"/>
  <rect x="122" y="14" width="100" height="78" fill="#F7F4F1" stroke="#C4C4C4" stroke-width=".6"/>
  <text class="l bande" x="131" y="31">2. j fusionne</text>
  <text class="l ann" x="131" y="44">j répond ⟨PULL, e, x⟩,</text>
  <text class="l ann" x="131" y="55">puis pose x ← (x +</text>
  <text class="l ann" x="131" y="66">x′)/2. Sa part est déjà</text>
  <text class="l ann" x="131" y="77">moyennée.</text>
  <path d="M 225.5 53.0 H 238.5" fill="none" stroke="#8A3324" stroke-width=".9"/>
  <path d="M 242.5 53.0 l -4 -3 v 6 z" fill="#8A3324"/>
  <rect x="245" y="14" width="100" height="78" fill="#F7F4F1" stroke="#C4C4C4" stroke-width=".6"/>
  <text class="l bande" x="254" y="31">3. le PULL se perd</text>
  <text class="l ann" x="254" y="44">Rien ne revient à i</text>
  <text class="l ann" x="254" y="55">avant τ. i abandonne le</text>
  <text class="l ann" x="254" y="66">cycle et laisse x</text>
  <text class="l ann" x="254" y="77">inchangé.</text>
  <path d="M 348.5 53.0 H 364.5" fill="none" stroke="#767676" stroke-width=".9" stroke-dasharray="2.5 2"/>
  <text class="l annf" x="356" y="48" text-anchor="middle">✕</text>
  <rect x="368" y="14" width="100" height="78" fill="#F7F4F1" stroke="#C4C4C4" stroke-width=".6"/>
  <text class="l bande" x="377" y="31">4. la somme a baissé</text>
  <text class="l ann" x="377" y="44">j a moyenné, i non. La</text>
  <text class="l ann" x="377" y="55">somme des estimations</text>
  <text class="l ann" x="377" y="66">n'égale plus la somme</text>
  <text class="l ann" x="377" y="77">des mesures initiales.</text>
  <text class="l annf" x="0" y="106">La rupture n'est pas dans l'implantation : elle est dans l'hypothèse. L'invariant tient en synchrone et sans faute, et perte de message</text>
  <text class="l annf" x="0" y="117">comme arrêt d'agent le cassent tous deux [83].</text>
  <path d="M 0 123 H 468" fill="none" stroke="#C4C4C4" stroke-width=".6"/>
  <text class="l ann" x="0" y="136">Le résultat n'est pas en retard, il est faux — et faux silencieusement : tous les agents convergent, ils s'accordent tous sur la même</text>
  <text class="l ann" x="0" y="146">valeur, et cette valeur ne correspond à aucune moyenne réelle. La relance périodique de la ligne 11 plafonne l'erreur accumulée ;</text>
  <text class="l ann" x="0" y="156">elle ne la corrige pas, et aucun agent ne peut distinguer une estimation stabilisée d'une estimation amputée.</text>
</svg>
