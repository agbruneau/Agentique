  <text class="l ann" x="384" y="79">σ = 0,05, κ = 10⁻³ — vue commune</text>
  <text class="l ann" x="384" y="90">entretenue : maximum en u* = √((1</text>
  <text class="l ann" x="384" y="101">− σ)/κ), puis débit rétrograde</text>
  <circle cx="132.6" cy="93.6" r="2.6" fill="#8A3324"/>
  <text class="l annf" x="138.6" y="89.6">u* ≈ 30,8</text>
  <path d="M 0 186 H 504" fill="none" stroke="#C4C4C4" stroke-width=".6"/>
  <text class="l ann" x="0" y="199">Ces deux valeurs de σ et de κ sont une illustration arithmétique de la formule citée [3], et non une mesure : le protocole qui les tirerait d'un</text>
  <text class="l ann" x="0" y="209">journal de messages réel n'est pas écrit, et la conclusion de l'ouvrage en fait son premier reste. Ce qu'elles établissent tient néanmoins — dès</text>
  <text class="l ann" x="0" y="219">que κ &gt; 0, dépasser u* est une régression, pas un plafond.</text>
