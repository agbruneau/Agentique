  <text class="l renvoi" x="275" y="108">partition 1</text>
  <text class="l renvoi" x="374" y="108">partition 2</text>
  <text class="l ann" x="257.0" y="138">n + p·k liens · 1 écriture puis 1 lecture par consommateur</text>
  <text class="l ann" x="257.0" y="149">· 2 tours de journal · diamètre 2, quel que soit n.</text>
  <path d="M 0 180 H 468" fill="none" stroke="#C4C4C4" stroke-width=".6"/>
  <text class="l ann" x="0" y="193">Le degré n'a pas disparu : il s'est déplacé dans le courtier, sous forme de n/p consommateurs par partition, et p plafonne le</text>
  <text class="l ann" x="0" y="203">parallélisme. Ce que le logiciel obtient gratuitement en diamètre, il le repaie sur la durée d'un tour — ℓ₉₉ du chemin de durabilité,</text>
  <text class="l ann" x="0" y="213">non un aller simple — et sur la contention, dont le régime appartient au chapitre 2.</text>
