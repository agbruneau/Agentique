<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 219" width="504" height="219" role="img" aria-label="Comparaison entre une maille complete pair a pair et un graphe biparti agents-partitions.">
  <!-- § 1.3, chapitre 1.
       Genere par figures/contenu.py — ne pas retoucher a la main :
