[package]
name = "banc-parite"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Même dispositif que le banc DT1 : cdylib pour WASM, rlib pour le binaire
# natif, un seul code source traversé par les deux cibles.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "parite-natif"
path = "src/main.rs"

[dependencies]
sim-agents = { path = "../../crates/sim-agents" }

[lints]
workspace = true
