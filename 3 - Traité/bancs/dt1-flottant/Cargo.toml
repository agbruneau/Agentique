[package]
name = "banc-dt1"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Candidat de sortie pour DT1 : implantation des transcendantes en Rust pur,
# sans intrinsèque ni appel à la libm de la plateforme. Le banc mesure si elle
# tient sa promesse de parité ; elle n'est retenue que si la mesure le dit.
libm = "0.2"

# cdylib pour la cible wasm32-unknown-unknown, rlib pour le binaire natif.
# Les deux chemins traversent exactement le même code (src/noyau.rs).
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dt1-natif"
path = "src/main.rs"

[lints]
workspace = true
