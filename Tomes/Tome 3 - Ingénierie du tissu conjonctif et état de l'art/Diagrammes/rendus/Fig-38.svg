<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1135px;height:646px;background:#FFFFFF;" width="1135px" height="646px" viewBox="0 0 1135 646" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="260.043" y="25.107" fill="#000" font-size="14" textLength="607.913" font-weight="700" font-family="'Segoe UI'">Intégration Patrimoniale : Orchestration UiPath Maestro, Encapsulation MCP et CUA Confiné</text></g><!--cluster VoieA--><g class="cluster" data-qualified-name="VoieA" id="ent0002" data-source-line="21"><rect x="7" y="138.621" width="570" height="350" fill="#F0FDF4" style="stroke:#166534;stroke-width:1;" rx="5" ry="5"/><text x="119.762" y="155.729" fill="#000" font-size="14" textLength="344.477" font-weight="700" font-family="'Segoe UI'">Voie A (Prioritaire) — Serveurs MCP d'Encapsulation</text><text x="60.856" y="174.35" fill="#000" font-size="14" textLength="462.287" font-weight="700" font-family="'Segoe UI'">Zéro interface graphique • Latence 40-250 ms • Déterminisme 99,95 %</text></g><!--cluster VoieB--><g class="cluster" data-qualified-name="VoieB" id="ent0008" data-source-line="45"><rect x="601" y="138.621" width="520" height="439" fill="#FFF7ED" style="stroke:#9A3412;stroke-width:1;" rx="5" ry="5"/><text x="699.614" y="155.729" fill="#000" font-size="14" textLength="322.772" font-weight="700" font-family="'Segoe UI'">Voie B (Dernier Recours) — Cellule CUA Confinée</text><text x="630.058" y="174.35" fill="#000" font-size="14" textLength="461.884" font-weight="700" font-family="'Segoe UI'">Terminaux TN5250 / TN3270 &amp; Bureaux Citrix sans API ni code source</text></g><!--entity McpIBMi--><g class="entity" data-qualified-name="VoieA.McpIBMi" id="ent0003" data-source-line="22"><rect x="65.5" y="194.621" width="494.783" height="75.863" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="75.5" y="219.729" fill="#000" font-size="14" textLength="413.075" font-weight="700" font-family="'Segoe UI'">1. Serveur MCP IBM i (AS/400) — Programmes RPGLE / COBOL</text><text x="75.5" y="238.35" fill="#000" font-size="14" textLength="474.783" font-family="'Segoe UI'">Appel natif PCML / XMLSERVICE • Conversion EBCDIC (CP037/1147) ↔ UTF-8</text><text x="75.5" y="256.971" fill="#000" font-size="14" textLength="417.594" font-family="'Segoe UI'">Décimales condensées COMP-3 + Registre d'idempotence DB2 for i</text></g><!--entity McpZOS--><g class="entity" data-qualified-name="VoieA.McpZOS" id="ent0004" data-source-line="28"><rect x="55" y="286.621" width="505.611" height="75.863" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="65" y="311.729" fill="#000" font-size="14" textLength="389.614" font-weight="700" font-family="'Segoe UI'">2. Serveur MCP Mainframe z/OS — Transactions CICS / IMS</text><text x="65" y="330.35" fill="#000" font-size="14" textLength="485.611" font-family="'Segoe UI'">Passerelle z/OS Connect / IBM MQ • Mappage COMMAREA vers JSON Schema</text><text x="65" y="348.971" fill="#000" font-size="14" textLength="374.917" font-family="'Segoe UI'">Propagation d'identité jusqu'au jeton RACF / ACF2 individuel</text></g><!--entity McpEDI--><g class="entity" data-qualified-name="VoieA.McpEDI" id="ent0005" data-source-line="34"><rect x="23.5" y="378.621" width="537.46" height="94.484" fill="#FFF" style="stroke:#166534;stroke-width:0.5;" rx="5" ry="5"/><text x="33.5" y="403.729" fill="#000" font-size="14" textLength="410.587" font-weight="700" font-family="'Segoe UI'">3. Serveur MCP Passerelle B2B — Flux EDI ANSI X12 / EDIFACT</text><text x="33.5" y="422.35" fill="#000" font-size="14" textLength="467.1" font-family="'Segoe UI'">Intention JSON typée soumise par l'agent (zéro trame EDI générée par LLM)</text><text x="33.5" y="440.971" fill="#000" font-size="14" textLength="423.801" font-family="'Segoe UI'">Sérialiseur déterministe X12 / EDIFACT + contrôle ISA / GS / ST / CTT</text><text x="33.5" y="459.592" fill="#000" font-size="14" textLength="517.46" font-family="'Segoe UI'">Transmission signée AS2 et rapprochement automatique des accusés 997 / CONTRL</text></g><!--entity Etape1--><g class="entity" data-qualified-name="VoieB.Etape1" id="ent0009" data-source-line="46"><rect x="617.5" y="194.621" width="467.091" height="75.863" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="5" ry="5"/><text x="627.5" y="219.729" fill="#000" font-size="14" textLength="416.76" font-weight="700" font-family="'Segoe UI'">Étape 1 — Bac à sable VDI éphémère &amp; Masquage géométrique</text><text x="627.5" y="238.35" fill="#000" font-size="14" textLength="427.273" font-family="'Segoe UI'">Caviardage PII en amont du modèle visuel • Verrouillage matériel des</text><text x="627.5" y="256.971" fill="#000" font-size="14" textLength="447.091" font-family="'Segoe UI'">zones interdites (Forbidden Boxes) et touches destructrices (F23 / Suppr)</text></g><!--entity Etape2--><g class="entity" data-qualified-name="VoieB.Etape2" id="ent0010" data-source-line="52"><rect x="617" y="286.621" width="474.022" height="75.863" fill="#FFF" style="stroke:#9A3412;stroke-width:0.5;" rx="5" ry="5"/><text x="627" y="311.729" fill="#000" font-size="14" textLength="381.979" font-weight="700" font-family="'Segoe UI'">Étape 2 — Pré-Assertion d'état &amp; Action atomique bornée</text><text x="627" y="330.35" fill="#000" font-size="14" textLength="418.749" font-family="'Segoe UI'">Assertion du code d'écran 5250/Citrix et absence de fenêtre modale</text><text x="627" y="348.971" fill="#000" font-size="14" textLength="454.022" font-family="'Segoe UI'">Exécution d'un geste atomique unique (saisie bornée, zéro rafale aveugle)</text></g><!--entity Etape3--><g class="entity" data-qualified-name="VoieB.Etape3" id="ent0011" data-source-line="58"><rect x="617.5" y="387.621" width="486.655" height="75.863" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="627.5" y="412.729" fill="#000" font-size="14" textLength="363.426" font-weight="700" font-family="'Segoe UI'">Étape 3 — Double Vérification Post-Action (Read-Back)</text><text x="627.5" y="431.35" fill="#000" font-size="14" textLength="466.655" font-family="'Segoe UI'">Relecture OCR déterministe + Vérificateur indépendant confirmant la valeur</text><text x="627.5" y="449.971" fill="#000" font-size="14" textLength="435.429" font-family="'Segoe UI'">écrite à l'écran avant autorisation de la touche de validation (COMMIT)</text></g><!--entity Etape4--><g class="entity" data-qualified-name="VoieB.Etape4" id="ent0012" data-source-line="64"><rect x="619.5" y="504.621" width="478.548" height="57.242" fill="#FEF2F2" style="stroke:#DC2626;stroke-width:0.5;" rx="5" ry="5"/><text x="629.5" y="529.729" fill="#000" font-size="14" textLength="392.096" font-weight="700" font-family="'Segoe UI'">Étape 4 — Enregistrement WORM &amp; Piste d'Audit BSIF E-23</text><text x="629.5" y="548.35" fill="#000" font-size="14" textLength="458.548" font-family="'Segoe UI'">Captures signées avant/après chaque frappe + lien traceId OpenTelemetry</text></g><!--entity Orchestration--><g class="entity" data-qualified-name="Orchestration" id="ent0001" data-source-line="15"><rect x="138.5" y="46.621" width="887.139" height="75.863" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="5" ry="5"/><text x="148.5" y="71.729" fill="#000" font-size="14" textLength="678.515" font-weight="700" font-family="'Segoe UI'">Plan d'Orchestration Patrimoniale — UiPath Maestro + Passerelle agentgateway (BPMN / État Durable)</text><text x="148.5" y="90.35" fill="#000" font-size="14" textLength="867.139" font-family="'Segoe UI'">Arbitrage déterministe : privilégier l'encapsulation programme/flux via MCP (≥ 92 % du volume) • Confiner le CUA au dernier recours (≤ 8 %)</text><text x="148.5" y="108.971" fill="#000" font-size="14" textLength="753.539" font-family="'Segoe UI'">Contrôle de conformité BSIF E-23 : clés d'idempotence obligatoires, plafonds L2/L3 et escalade HOTL sur anomalie d'écran</text></g><!--entity Gouvernance--><g class="entity" data-qualified-name="Gouvernance" id="ent0016" data-source-line="74"><rect x="203" y="593.621" width="886.031" height="38.621" fill="#F8FAFC" style="stroke:#334155;stroke-width:0.5;" rx="5" ry="5"/><text x="213" y="618.729" fill="#000" font-size="14" textLength="866.031" font-weight="700" font-family="'Segoe UI'">Gouvernance du cycle de vie (ADR-016) : Chaque flux CUA homologué ouvre un chantier financé d'encapsulation MCP sous 12 mois</text></g><!--link McpIBMi to McpZOS--><!--link McpZOS to McpEDI--><!--link Etape1 to Etape2--><!--link Etape2 to Etape3--><!--link Etape3 to Etape4--><!--link Orchestration to McpIBMi--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk17" data-source-line="78" data-link-type="dependency"><path d="M513.77,122.651 C473.3,144.621 426.554,169.985 386.014,191.995" style="stroke:#166534;stroke-width:1;" fill="none" id="Orchestration-to-McpIBMi" codeLine="78"/><polygon points="381.62,194.381,391.438,193.602,386.014,191.995,387.621,186.572,381.62,194.381" fill="#166534" style="stroke:#166534;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Orchestration to Etape1--><g class="link" data-entity-1="ent0001" data-entity-2="ent0009" id="lnk18" data-source-line="79" data-link-type="dependency"><path d="M650.23,122.651 C690.7,144.621 737.446,169.985 777.986,191.995" style="stroke:#9A3412;stroke-width:1;" fill="none" id="Orchestration-to-Etape1" codeLine="79"/><polygon points="782.38,194.381,776.379,186.572,777.986,191.995,772.562,193.602,782.38,194.381" fill="#9A3412" style="stroke:#9A3412;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link McpIBMi to Etape1--><!--link McpZOS to Etape2--><!--link McpEDI to Etape3--><!--link McpEDI to Gouver