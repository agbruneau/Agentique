<!DOCTYPE html>
<html lang="fr-CA" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__PAGE_TITLE__</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-app: light-dark(#f6f8fc, #0b1120);
      --bg-surface: light-dark(#ffffff, #111827);
      --bg-surface-2: light-dark(#eef2f7, #1a2336);
      --bg-surface-3: light-dark(#e2e8f0, #23304a);
      --text-main: light-dark(#0f172a, #f1f5f9);
      --text-muted: light-dark(#475569, #94a3b8);
      --text-subtle: light-dark(#64748b, #64748b);
      --border: light-dark(#cbd5e1, #2a3750);
      --border-strong: light-dark(#94a3b8, #475569);
      --accent: light-dark(#2563eb, #60a5fa);
      --accent-soft: light-dark(#dbeafe, #1e3a8a);
      --accent-text: light-dark(#1d4ed8, #93c5fd);
      --ok: light-dark(#16a34a, #4ade80);
      --ok-soft: light-dark(#dcfce7, #14532d);
      --warn: light-dark(#d97706, #fbbf24);
      --warn-soft: light-dark(#fef3c7, #78350f);
      --danger: light-dark(#dc2626, #f87171);
      --danger-soft: light-dark(#fee2e2, #7f1d1d);
      --mark-bg: light-dark(#fef08a, #854d0e);
      --mark-text: light-dark(#713f12, #fef9c3);
      --shadow-sm: light-dark(0 1px 2px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.45));
      --shadow-md: light-dark(0 8px 24px rgba(15, 23, 42, 0.12), 0 10px 28px rgba(0, 0, 0, 0.55));
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    }

    html[data-theme="light"] {
      color-scheme: light;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: var(--font-sans);
      background: var(--bg-app);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.55;
      overflow: hidden;
    }

    button, input, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: var(--accent-text);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
    }

    mark.hl {
      background: var(--mark-bg);
      color: var(--mark-text);
      padding: 0 2px;
      border-radius: 3px;
      font-weight: 600;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Top Header */
    .topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 320px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #0d9488);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-weight: 750;
      font-size: 14.5px;
      letter-spacing: -0.01em;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .kpi-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .kpi-pill {
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .kpi-pill strong {
      color: var(--text-main);
      font-weight: 700;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      min-width: 240px;
      flex: 1 1 260px;
      max-width: 390px;
    }

    .search-input {
      width: 100%;
      padding: 6px 56px 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface-2);
      color: var(--text-main);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
      background: var(--bg-surface);
    }

    .search-kbd {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      pointer-events: none;
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 420px;
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      z-index: 60;
      display: none;
    }
    .search-dropdown.open {
      display: block;
    }

    .search-item {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
      width: 100%;
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
    }
    .search-item:last-child {
      border-bottom: none;
    }
    .search-item:hover, .search-item.active {
      background: var(--bg-surface-2);
    }
    .search-item-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 650;
      font-size: 12.5px;
    }
    .search-item-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      font-weight: 550;
      font-size: 12px;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s;
      text-decoration: none;
    }
    .btn:hover {
      background: var(--bg-surface-2);
      border-color: var(--border-strong);
      text-decoration: none;
    }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn.primary:hover {
      filter: brightness(1.06);
    }
    .btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 650;
    }
    .btn-sm {
      padding: 3px 8px;
      font-size: 11.5px;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .filter-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }
    .filter-group label {
      color: var(--text-muted);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .filter-select {
      padding: 3px 7px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface-2);
      color: var(--text-main);
      font-size: 12px;
      max-width: 240px;
    }
    .filter-status {
      margin-left: auto;
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Main Split Workspace */
    .workspace {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }

    /* TOC Sidebar */
    .toc-sidebar {
      width: 340px;
      min-width: 280px;
      max-width: 38vw;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex-shrink: 0;
      transition: margin-left 0.18s ease, width 0.18s ease;
    }
    .toc-sidebar.collapsed {
      display: none;
    }

    .toc-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface-2);
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }
    .toc-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .toc-title-row strong {
      font-size: 12.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    .toc-filter-input {
      width: 100%;
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      font-size: 12px;
      outline: none;
    }
    .toc-filter-input:focus {
      border-color: var(--accent);
    }

    .toc-tree {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 8px 8px 24px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .toc-group {
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
    }
    .toc-row {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      padding: 5px 7px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .toc-row:hover {
      background: var(--bg-surface-2);
    }
    .toc-row.active {
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 650;
    }
    .toc-row.dimmed {
      opacity: 0.52;
    }

    .toc-expander {
      width: 18px;
      height: 18px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-surface-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
      padding: 0;
    }
    .toc-expander:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .toc-label {
      flex: 1 1 auto;
      min-width: 0;
      line-height: 1.35;
      word-break: break-word;
    }
    .toc-children {
      margin-left: 14px;
      padding-left: 8px;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
    }
    .toc-sub-link {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      text-align: left;
      width: 100%;
    }
    .toc-sub-link:hover {
      background: var(--bg-surface-2);
      color: var(--text-main);
    }
    .toc-sub-link.active {
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
    }

    /* Reading Pane */
    .reading-pane {
      flex: 1 1 auto;
      min-width: 0;
      overflow-y: auto;
      padding: 20px 28px 56px 28px;
      scroll-behavior: smooth;
    }

    .reading-container {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .reading-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .doc-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .doc-card.focused-target {
      outline: 2px solid var(--accent);
      box-shadow: var(--shadow-md);
    }

    .doc-hero {
      border-left: 5px solid var(--accent);
    }

    .doc-h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -0.015em;
    }
    .doc-subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 13.5px;
    }

    .doc-h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .doc-h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .doc-h4 {
      margin: 8px 0 4px 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-text);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .section-card {
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .section-card.highlighted {
      border-color: var(--accent);
      background: light-dark(#eff6ff, #172554);
    }
    .section-card h3 {
      margin: 0;
      font-size: 15px;
    }
    .section-card p {
      margin: 0;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
      border: 1px solid var(--border);
      background: var(--bg-surface-2);
      color: var(--text-main);
    }
    .badge.mono {
      font-family: var(--font-mono);
    }
    .badge.dom {
      color: #fff;
      border-color: transparent;
    }
    .badge.ok {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: transparent;
    }
    .badge.warn {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: transparent;
    }
    .badge.danger {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: transparent;
    }

    .callout {
      border-left: 3px solid var(--accent);
      background: var(--bg-surface-2);
      padding: 10px 14px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 13px;
    }

    .req-list, .deliv-list {
      margin: 4px 0 0 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .req-list li, .deliv-list li {
      line-height: 1.5;
    }

    /* Family & Theme Cards */
    .family-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      background: var(--bg-surface-2);
      display: flex;
      flex-direction: column;
      gap: 10px;
      break-inside: avoid;
    }
    .family-box.focused-target {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .family-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .family-head h5 {
      margin: 0;
      font-size: 14.5px;
    }

    .themes-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .theme-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      break-inside: avoid;
    }
    .theme-card.focused-target {
      border-color: var(--accent);
      background: light-dark(#f0f7ff, #15223b);
      box-shadow: var(--shadow-md);
    }
    .theme-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .theme-title {
      font-weight: 700;
      font-size: 13.8px;
    }
    .theme-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .theme-spec {
      margin: 0;
      font-size: 13.2px;
      color: var(--text-main);
    }
    .theme-anchors {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }
    .anchor-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 5px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .anchor-pill:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      text-decoration: none;
    }

    /* Cross-chapter interrelations */
    .rel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 8px;
    }
    .rel-item {
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 8px 10px;
      background: var(--bg-surface-2);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12.2px;
      break-inside: avoid;
    }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.2px;
    }
    .data-table th, .data-table td {
      border-bottom: 1px solid var(--border);
      padding: 7px 9px;
      text-align: left;
      vertical-align: top;
    }
    .data-table th {
      background: var(--bg-surface-2);
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .data-table tr:last-child td {
      border-bottom: none;
    }
    .data-table tr:hover td {
      background: var(--bg-surface-2);
    }
    .num {
      text-align: right !important;
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    /* Parties & Chapters Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }
    .overview-card {
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      background: var(--bg-surface-2);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .inline-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin: 6px 0;
    }
    .inline-filter-input {
      padding: 4px 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      font-size: 12px;
      min-width: 240px;
    }

    details.ann-details {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      background: var(--bg-surface-2);
    }
    details.ann-details summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
    }

    /* Cartes schémas de vulgarisation */
    .schema-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
    .schema-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      break-inside: avoid;
    }
    .schema-card.focused-target {
      border-color: var(--accent);
      background: light-dark(#f0f7ff, #15223b);
      box-shadow: var(--shadow-md);
    }
    .badge.reuse-direct {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: transparent;
    }
    .badge.reuse-adapt {
      background: var(--accent-soft);
      color: var(--accent-text);
      border-color: transparent;
    }
    .badge.reuse-orig {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: transparent;
    }
    .schema-blueprint {
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12.8px;
    }
    .schema-blueprint ul, .schema-blueprint ol {
      margin: 4px 0 0 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .color-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      flex-shrink: 0;
    }
    .takeaway-box {
      border-left: 4px solid var(--ok);
      background: light-dark(#f0fdf4, #0f291e);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 550;
    }
    .tome-fig-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tome-fig-row {
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12.2px;
    }

    @media (max-width: 960px) {
      .toc-sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 86vw;
        max-width: 340px;
        z-index: 40;
        box-shadow: var(--shadow-md);
      }
      .reading-pane {
        padding: 14px 14px 40px 14px;
      }
      .doc-card {
        padding: 14px 16px;
      }
      .rel-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      html, body {
        height: auto !important;
        overflow: visible !important;
        background: #fff !important;
        color: #000 !important;
        color-scheme: light !important;
      }
      .app-shell, .workspace, .reading-pane {
        display: block !important;
        height: auto !important;
        width: 100% !important;
        overflow: visible !important;
        padding: 0 !important;
      }
      .topbar, .toc-sidebar, .reading-nav, .theme-actions, .inline-filter-row, .search-dropdown {
        display: none !important;
      }
      .doc-card, .family-box, .theme-card, .section-card, .schema-card {
        box-shadow: none !important;
        border-color: #cbd5e1 !important;
        break-inside: avoid;
      }
      .reading-container {
        max-width: 100% !important;
      }
    }
  </style>

  <script id="prd-web-data" type="application/json">__PRD_DATA_JSON__</script>

  <script>
  (function () {
    "use strict";

    var DOMAIN_COLORS = {
      D01: "#2563eb",
      D02: "#0284c7",
      D03: "#0d9488",
      D04: "#059669",
      D05: "#16a34a",
      D06: "#d97706",
      D07: "#dc2626",
      D08: "#ea580c",
      D09: "#7c3aed",
      D10: "#db2777",
      D11: "#4f46e5",
      D12: "#64748b"
    };

    var REL_COLORS = {
      attenuation_risque: "#16a34a",
      dependance_technique: "#2563eb",
      operationnalisation: "#0d9488",
      encadrement_normatif: "#7c3aed",
      concordance_inter_tomes: "#64748b",
      tension_arbitrage: "#dc2626",
      amplification_synergie: "#ea580c",
      projection_temporelle: "#d97706"
    };

    var MINDMAP_HTML = "MindMap%20-%20Cartographie%20th%C3%A9matique%20du%20Corpus.html";

    // =========================================================================
    // 1. Utilitaires purs (autonomes, sans URL externe, sûrs sous Node.js)
    // =========================================================================
    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeText(str) {
      return String(str == null ? "" : str)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function encodeRelPath(pathStr) {
      var clean = String(pathStr || "").replace(/\\/g, "/").replace(/^\/+/, "");
      return clean
        .split("/")
        .filter(function (part) { return part.length > 0; })
        .map(function (part) { return encodeURIComponent(part).replace(/'/g, "%27"); })
        .join("/");
    }

    function corpusHref(filePath, lineStart) {
      var clean = String(filePath || "").replace(/\\/g, "/").replace(/^(?:\.\.\/)+/, "");
      var encoded = encodeRelPath(clean);
      var prefix = encoded.indexOf("Corpus/") === 0 ? "../../" : "../../Corpus/";
      return prefix + encoded + (lineStart ? "#L" + lineStart : "");
    }

    function tomeAssetHref(assetPath) {
      var clean = String(assetPath || "").replace(/\\/g, "/").replace(/^(?:\.\.\/)+/, "").replace(/^\/+/, "");
      if (!clean) return "#";
      return "../../" + encodeRelPath(clean);
    }

    function formatReuseStatus(status) {
      if (status === "reemploi_direct") return { label: "Réemploi direct", cls: "reuse-direct" };
      if (status === "adaptation_vulgarisee") return { label: "Adaptation vulgarisée", cls: "reuse-adapt" };
      if (status === "creation_originale") return { label: "Création originale", cls: "reuse-orig" };
      return { label: String(status || "—"), cls: "" };
    }

    function formatDecimalFr(val) {
      if (val == null) return "0";
      return String(val).replace(/\./g, ",");
    }

    function mindmapHref(view, nodeId) {
      var v = view === "synaptic" ? "synaptic" : "mindmap";
      var hash = "#view=" + v;
      if (nodeId) hash += "&node=" + encodeURIComponent(String(nodeId));
      return MINDMAP_HTML + hash;
    }

    function highlightPlain(escapedHtmlText, query) {
      var q = String(query || "").trim();
      if (!q || q.length < 2) return escapedHtmlText;
      var escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      try {
        var re = new RegExp("(" + escapedQ + ")", "gi");
        return escapedHtmlText.replace(re, '<mark class="hl">$1</mark>');
      } catch (err) {
        return escapedHtmlText;
      }
    }

    function renderInlineMd(rawText, query) {
      var raw = String(rawText == null ? "" : rawText).replace(/\\\$/g, "$");
      var tokens = [];
      function pushTok(htmlVal) {
        var idx = tokens.length;
        tokens.push(htmlVal);
        return "\u0000T" + idx + "\u0000";
      }

      // 1. Protège les liens Markdown [label](href)
      var withPlaceholders = raw.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_m, label, href) {
        var cleanHref = String(href || "").trim();
        var safeUrl = "#";
        if (!/^(https?|javascript|data):/i.test(cleanHref) && cleanHref.indexOf("//") !== 0) {
          if (cleanHref.indexOf("Corpus/") === 0 || cleanHref.indexOf("Tomes/") === 0) {
            var fragSplit = cleanHref.split("#");
            safeUrl = "../../" + encodeRelPath(fragSplit[0]) + (fragSplit[1] ? "#" + fragSplit[1] : "");
          } else {
            safeUrl = cleanHref.replace(/'/g, "%27");
          }
        }
        return pushTok('<a href="' + escapeHtml(safeUrl) + '">' + highlightPlain(escapeHtml(label), query) + "</a>");
      });

      // 2. Protège le code inline `code` AVANT **gras** et *italique*
      withPlaceholders = withPlaceholders.replace(/`([^`]+)`/g, function (_m, code) {
        return pushTok("<code>" + highlightPlain(escapeHtml(code), query) + "</code>");
      });

      var safe = escapeHtml(withPlaceholders);
      // 3. Gras **...** restreint aux frontières sûres (exclut globs type specs/** et tests/**)
      safe = safe.replace(/(^|[\s(\[«"'—–:;,\-]|>)\*\*([^\s*](?:[^*\n]*?[^\s*])?)\*\*(?=$|[\s.,;:!?)\]»"'—–<\-])/g, function (_m, p1, b) {
        return p1 + "<strong>" + b + "</strong>";
      });
      // 4. Italique *...* restreint aux frontières sûres (exclut jokers type gen_ai.*)
      safe = safe.replace(/(^|[\s(\[«"'—–:;,\-]|>)\*([^\s*](?:[^*]*[^\s*])?)\*(?=$|[\s.,;:!?)\]»"'—–<\-])/g, function (_m, p1, it) {
        return p1 + "<em>" + it + "</em>";
      });

      // 5. Applique le surlignage hors balises HTML et jetons protégés
      if (query && String(query).trim().length >= 2) {
        safe = safe.split(/(<[^>]+>|\u0000T\d+\u0000)/g).map(function (seg) {
          if (!seg || seg.charAt(0) === "<" || seg.charAt(0) === "\u0000") return seg;
          return highlightPlain(seg, query);
        }).join("");
      }

      // 6. Restaure les liens et blocs <code> protégés
      return safe.replace(/\u0000T(\d+)\u0000/g, function (_m, idStr) {
        return tokens[Number(idStr)] || "";
      });
    }

    function domainColor(domainId) {
      return DOMAIN_COLORS[domainId] || "#2563eb";
    }

    function relColor(relType) {
      return REL_COLORS[relType] || "#2563eb";
    }

    function pad2(n) {
      var num = Number(n) || 0;
      return num < 10 ? "0" + num : String(num);
    }

    // =========================================================================
    // 2. Indexation, filtrage & recherche (purs)
    // =========================================================================
    function buildIndexes(rawData) {
      var data = rawData || {};
      var meta = data.meta || {};
      var execSummary = data.executive_summary || { title: "Sommaire exécutif global", lead: "", sections: [] };
      var parties = Array.isArray(data.parties) ? data.parties : [];
      var chapters = Array.isArray(data.chapters) ? data.chapters : [];
      var annexes = Array.isArray(data.annexes) ? data.annexes : [];
      var lookup = data.lookup || {};

      var partyByDomain = Object.create(null);
      var partyByNumber = Object.create(null);
      parties.forEach(function (p) {
        partyByDomain[p.domain_id] = p;
        partyByNumber[Number(p.part_number)] = p;
      });

      var chapterByNum = Object.create(null);
      var familyById = Object.create(null);
      var themeById = Object.create(null);
      var themeBySlug = Object.create(null);
      var themeChapterById = Object.create(null);
      var familyChapterById = Object.create(null);
      var schemaById = Object.create(null);

      var autonomySet = new Set();
      var roleSet = new Set();
      var totalFamilies = 0;
      var totalThemes = 0;
      var totalInterrelations = 0;
      var totalSchemas = 0;

      var searchDocs = [];

      function indexSchemaDoc(sch, cnum) {
        if (!sch || !sch.schema_id) return;
        schemaById[sch.schema_id] = sch;
        totalSchemas += 1;
        var vb = sch.visual_blueprint || {};
        var reuseMeta = formatReuseStatus(sch.reuse_status);
        var scopeLbl = cnum === 0 ? "Sommaire exécutif · Panorama" : ("Ch. " + pad2(cnum) + " · " + sch.domain_id);
        var targetObj = cnum === 0
          ? { kind: "exec", sectionId: "panorama", focusKind: "sch", focusId: sch.schema_id }
          : { kind: "chapter", chapterNumber: cnum, focusKind: "sch", focusId: sch.schema_id };
        searchDocs.push({
          kind: "schema",
          id: sch.schema_id,
          chapterNumber: cnum,
          domain_id: sch.domain_id,
          title: sch.schema_id + " — " + sch.title,
          subtitle: scopeLbl + " · " + sch.visual_archetype + " · " + reuseMeta.label,
          target: targetObj,
          norm: normalizeText([
            sch.schema_id,
            sch.title,
            sch.domain_id,
            sch.visual_archetype,
            sch.recommended_notation,
            sch.reuse_status,
            reuseMeta.label,
            sch.insertion_point,
            sch.pedagogical_objective,
            sch.vulgarization_angle,
            vb.key_takeaway_box,
            (sch.target_audiences || []).join(" "),
            (sch.families_covered || []).join(" "),
            (sch.themes_vulgarized || []).join(" "),
            (sch.linked_tome_figures || []).map(function (f) { return f.tome_id + " " + f.fig_id + " " + f.title; }).join(" ")
          ].join(" "))
        });
      }

      // Indexation Sommaire exécutif + Panorama schémas SCH-00-*
      (execSummary.sections || []).forEach(function (sec, i) {
        var secId = sec.id || ("sec-" + (i + 1));
        var kpiTxt = "";
        if (sec.kpi_table && Array.isArray(sec.kpi_table.rows)) {
          kpiTxt = sec.kpi_table.rows.map(function (r) { return r.join(" "); }).join(" ");
        }
        searchDocs.push({
          kind: "section",
          id: secId,
          title: sec.heading || ("Section " + (i + 1)),
          subtitle: "Sommaire exécutif global · Section " + (i + 1),
          target: { kind: "exec", sectionId: secId },
          norm: normalizeText([sec.heading, sec.body_md, kpiTxt].join(" "))
        });
      });
      (execSummary.vulgarization_schemas || []).forEach(function (sch) {
        indexSchemaDoc(sch, 0);
      });

      // Indexation Parties
      parties.forEach(function (p) {
        searchDocs.push({
          kind: "part",
          id: p.domain_id,
          title: "Partie " + p.part_roman + " — " + p.domain_id + " : " + p.representative_part_title,
          subtitle: p.domain_title || "Domaine " + p.domain_id,
          domain_id: p.domain_id,
          target: { kind: "part", domainId: p.domain_id },
          norm: normalizeText([
            "Partie " + p.part_roman,
            p.domain_id,
            p.domain_title,
            p.representative_part_title,
            p.part_summary,
            (p.key_identifiers || []).join(" ")
          ].join(" "))
        });
      });

      // Indexation Chapitres, Familles et Thèmes
      chapters.forEach(function (ch) {
        var cnum = Number(ch.chapter_number);
        chapterByNum[cnum] = ch;
        (ch.autonomy_levels || []).forEach(function (a) { autonomySet.add(a); });
        (ch.roles || []).forEach(function (r) { roleSet.add(r); });

        var tc = ch.targeted_content || {};
        var fams = Array.isArray(tc.families_and_themes) ? tc.families_and_themes : [];
        var rels = Array.isArray(tc.cross_chapter_interrelations) ? tc.cross_chapter_interrelations : [];
        totalFamilies += fams.length;
        totalInterrelations += rels.length;

        searchDocs.push({
          kind: "chapter",
          id: ch.chapter_code || ("CH-" + pad2(cnum)),
          chapterNumber: cnum,
          domain_id: ch.domain_id,
          title: "Chapitre " + pad2(cnum) + " — " + ch.representative_title,
          subtitle: ch.domain_id + " · " + ch.subdomain_node_id + " · " + fams.length + " familles",
          target: { kind: "chapter", chapterNumber: cnum },
          norm: normalizeText([
            ch.chapter_code,
            "Chapitre " + pad2(cnum),
            ch.domain_id,
            ch.subdomain_node_id,
            ch.subdomain_title,
            ch.representative_title,
            ch.executive_summary,
            tc.scope_and_objectives,
            (tc.key_requirements_and_objectives || []).join(" "),
            (tc.deliverables_and_verification || []).join(" ")
          ].join(" "))
        });

        fams.forEach(function (fam, famIdx) {
          familyById[fam.family_node_id] = fam;
          familyChapterById[fam.family_node_id] = cnum;
          var thms = Array.isArray(fam.themes_targeted) ? fam.themes_targeted : [];
          totalThemes += thms.length;

          searchDocs.push({
            kind: "family",
            id: fam.family_node_id,
            chapterNumber: cnum,
            domain_id: ch.domain_id,
            title: (fam.family_code || (pad2(cnum) + ".2." + (famIdx + 1))) + " " + fam.family_title,
            subtitle: "Chapitre " + pad2(cnum) + " (" + ch.domain_id + ") · " + fam.family_node_id + " · " + thms.length + " thèmes",
            target: { kind: "chapter", chapterNumber: cnum, focusKind: "fam", focusId: fam.family_node_id },
            norm: normalizeText([
              fam.family_node_id,
              fam.family_code,
              fam.family_title,
              fam.family_overview,
              ch.domain_id
            ].join(" "))
          });

          thms.forEach(function (th) {
            themeById[th.theme_node_id] = th;
            if (th.canonical_slug) themeBySlug[th.canonical_slug] = th;
            themeChapterById[th.theme_node_id] = cnum;
            (th.autonomy_levels || []).forEach(function (a) { autonomySet.add(a); });
            (th.roles || []).forEach(function (r) { roleSet.add(r); });

            searchDocs.push({
              kind: "theme",
              id: th.theme_node_id,
              canonical_slug: th.canonical_slug,
              chapterNumber: cnum,
              domain_id: ch.domain_id,
              title: th.theme_title,
              subtitle: "Ch. " + pad2(cnum) + " · " + ch.domain_id + " · " + th.canonical_slug,
              target: { kind: "chapter", chapterNumber: cnum, focusKind: "thm", focusId: th.theme_node_id },
              norm: normalizeText([
                th.theme_node_id,
                th.canonical_slug,
                th.theme_title,
                th.content_specification,
                (th.identifiers_and_norms || []).join(" "),
                (th.autonomy_levels || []).join(" "),
                (th.roles || []).join(" "),
                th.horizon,
                ch.domain_id
              ].join(" "))
            });
          });
        });

        (ch.vulgarization_schemas || []).forEach(function (sch) {
          indexSchemaDoc(sch, cnum);
        });
      });

      var annexeByCode = Object.create(null);
      annexes.forEach(function (ann) {
        annexeByCode[ann.annexe_code] = ann;
        searchDocs.push({
          kind: "annexe",
          id: "ANNEXE_" + ann.annexe_code,
          title: ann.representative_title || ("Annexe " + ann.annexe_code),
          subtitle: "Annexe " + ann.annexe_code,
          target: { kind: "annexe", annexeCode: ann.annexe_code },
          norm: normalizeText([
            "Annexe " + ann.annexe_code,
            ann.representative_title,
            ann.executive_summary,
            ann.targeted_content_description
          ].join(" "))
        });
      });

      var orderedAutonomy = ["L0", "L1", "L2", "L3", "L4"].filter(function (x) {
        return autonomySet.has(x);
      });
      Array.from(autonomySet).forEach(function (x) {
        if (orderedAutonomy.indexOf(x) === -1) orderedAutonomy.push(x);
      });
      var orderedRoles = Array.from(roleSet).sort();

      return {
        raw: data,
        meta: meta,
        execSummary: execSummary,
        parties: parties,
        chapters: chapters,

    function filterPrd(idx, rawFilters) {
      var f = rawFilters || {};
      var dom = String(f.domain || "").trim();
      var aut = String(f.autonomy || "").trim();
      var role = String(f.role || "").trim();
      var active = Boolean(dom || aut || role);

      var matchingThemeIds = new Set();
      var matchingFamilyIds = new Set();
      var matchingChapterNums = new Set();
      var matchingPartDomains = new Set();

      idx.chapters.forEach(function (ch) {
        var domOk = !dom || ch.domain_id === dom;
        var fams = (ch.targeted_content && ch.targeted_content.families_and_themes) || [];
        var chHasTheme = false;

        fams.forEach(function (fam) {
          var famHasTheme = false;
          (fam.themes_targeted || []).forEach(function (th) {
            var autOk = !aut || (Array.isArray(th.autonomy_levels) && th.autonomy_levels.indexOf(aut) !== -1);
            var roleOk = !role || (Array.isArray(th.roles) && th.roles.indexOf(role) !== -1);
            if (domOk && autOk && roleOk) {
              matchingThemeIds.add(th.theme_node_id);
              famHasTheme = true;
              chHasTheme = true;
            }
          });
          if (famHasTheme) {
            matchingFamilyIds.add(fam.family_node_id);
          }
        });

        if (chHasTheme) {
          matchingChapterNums.add(Number(ch.chapter_number));
          matchingPartDomains.add(ch.domain_id);
        }
      });

      return {
        domain: dom,
        autonomy: aut,
        role: role,
        active: active,
        matchingThemeIds: matchingThemeIds,
        matchingFamilyIds: matchingFamilyIds,
        matchingChapterNums: matchingChapterNums,
        matchingPartDomains: matchingPartDomains,
        counts: {

          chapters: matchingChapterNums.size,
          families: matchingFamilyIds.size,
          themes: matchingThemeIds.size
        }
      };

    function searchPrd(idx, rawQuery, limit) {
      var q = normalizeText(String(rawQuery || "").trim());
      if (!q) return [];
      var terms = q.split(/\s+/).filter(Boolean);
      var maxRes = limit || 24;
      var hits = [];

      idx.searchDocs.forEach(function (doc) {
        for (var i = 0; i < terms.length; i++) {
          if (doc.norm.indexOf(terms[i]) === -1) return;
        }
        var normTitle = normalizeText(doc.title);
        var score = 10;
        if (normTitle === q) score += 100;
        else if (normTitle.indexOf(q) !== -1) score += 50;
        if (doc.id && normalizeText(doc.id).indexOf(q) !== -1) score += 40;
        if (doc.canonical_slug && normalizeText(doc.canonical_slug).indexOf(q) !== -1) score += 35;
        if (doc.kind === "chapter") score += 12;
        else if (doc.kind === "theme") score += 10;
        else if (doc.kind === "section" || doc.kind === "annexe") score += 8;
        hits.push({ score: score, doc: doc });
      });

      hits.sort(function (a, b) {
        if (b.score !== a.score) return b.score - a.score;
        return a.doc.title.localeCompare(b.doc.title);
      });
      return hits.slice(0, maxRes).map(function (x) { return x.doc; });
    }

    function parseHash(hashStr, idx) {
      var raw = String(hashStr || "").replace(/^#/, "").trim();
      if (!raw) return null;
      var params = Object.create(null);
      raw.split("&").forEach(function (part) {
        if (!part) return;
        var eq = part.indexOf("=");
        if (eq === -1) {
          params[decodeURIComponent(part)] = "";
        } else {
          params[decodeURIComponent(part.slice(0, eq))] = decodeURIComponent(part.slice(eq + 1));
        }
      });

      if (params.sch && idx && idx.schemaById) {
        var sKey = String(params.sch).trim().toUpperCase();
        var schObj = idx.schemaById[sKey];
        if (schObj) {
          var schCh = Number(schObj.chapter_number) || 0;
          return schCh === 0
            ? { kind: "exec", sectionId: "panorama", focusKind: "sch", focusId: schObj.schema_id }
            : { kind: "chapter", chapterNumber: schCh, focusKind: "sch", focusId: schObj.schema_id };
        }
      }
      if (params.ch) {
        var chDigits = parseInt(String(params.ch).replace(/^CH-/i, ""), 10);
        if (idx && idx.chapterByNum && idx.chapterByNum[chDigits]) {
          return {
            kind: "chapter",
            chapterNumber: chDigits,
            focusKind: params.fam ? "fam" : (params.thm ? "thm" : (params.schemas ? "schemas" : null)),
            focusId: params.fam || params.thm || null
          };
        }
      }
      if (params.thm && idx) {
        var keyThm = params.thm;
        var th = idx.themeById[keyThm] || idx.themeBySlug[keyThm];
        if (th) {
          var cnumTh = idx.themeChapterById[th.theme_node_id];
          if (cnumTh) {
            return { kind: "chapter", chapterNumber: cnumTh, focusKind: "thm", focusId: th.theme_node_id };
          }
        }
      }
      if (params.fam && idx) {
        var cnumFam = idx.familyChapterById[params.fam];
        if (cnumFam) {
          return { kind: "chapter", chapterNumber: cnumFam, focusKind: "fam", focusId: params.fam };
        }
      }
      if (params.part && idx) {
        var pRaw = String(params.part).trim();
        var pVal = pRaw.toUpperCase();
        if (idx.partyByDomain[pVal]) return { kind: "part", domainId: pVal };
        var pMatch = pRaw.match(/^(?:PART[-_]?)?0?(\d+)$/i);
        if (pMatch) {
          var pNum = parseInt(pMatch[1], 10);
          if (idx.partyByNumber[pNum]) return { kind: "part", domainId: idx.partyByNumber[pNum].domain_id };
        }
        var pByRoman = idx.parties.find(function (p) { return String(p.part_roman || "").toUpperCase() === pVal; });
        if (pByRoman) return { kind: "part", domainId: pByRoman.domain_id };
      }
      if (params.annexe && idx) {
        var aCode = String(params.annexe).toUpperCase();
        if (idx.annexeByCode[aCode]) return { kind: "annexe", annexeCode: aCode };
      }
      if (params.sec !== undefined && idx) {
        var sVal = String(params.sec).trim();
        var sLow = sVal.toLowerCase();
        if (sLow === "panorama" || sLow === "exec-panorama") {
          return { kind: "exec", sectionId: "panorama" };
        }
        var secs = (idx.execSummary && idx.execSummary.sections) || [];
        var found = secs.find(function (s, i) {
          return s.id === sVal || String(i) === sVal || String(i + 1) === sVal || s.slug === sVal;
        });
        if (!found) {
          var sMatch = sVal.match(/^(?:exec|sec)[-_]?0?(\d+)$/i) || sVal.match(/^0?(\d+)$/);
          if (sMatch) {
            var sIdx = parseInt(sMatch[1], 10) - 1;
            if (sIdx >= 0 && sIdx < secs.length) found = secs[sIdx];
          }
        }
        return { kind: "exec", sectionId: found ? (found.id || sVal) : null };
      }
      return null;
    }

    function targetToHash(target) {
      if (!target) return "#sec=1";
      if (target.kind === "exec") {
        if (target.focusKind === "sch" && target.focusId) return "#sch=" + encodeURIComponent(target.focusId);
        return target.sectionId ? "#sec=" + encodeURIComponent(target.sectionId) : "#sec=1";
      }
      if (target.kind === "part") {
        return "#part=" + encodeURIComponent(target.domainId);
      }
      if (target.kind === "annexe") {
        return "#annexe=" + encodeURIComponent(target.annexeCode);
      }
      if (target.kind === "chapter") {
        var h = "#ch=" + pad2(target.chapterNumber);
        if (target.focusKind === "fam" && target.focusId) h += "&fam=" + encodeURIComponent(target.focusId);
        if (target.focusKind === "thm" && target.focusId) h += "&thm=" + encodeURIComponent(target.focusId);
        if (target.focusKind === "sch" && target.focusId) h += "&sch=" + encodeURIComponent(target.focusId);
        if (target.focusKind === "schemas") h += "&schemas=1";
        return h;
      }
      return "#sec=1";
    }

      html.push("</div>");

    function renderExecSummaryCard(idx, state) {

        html.push('<p class="doc-subtitle">' + renderInlineMd(meta.prd_subtitle, q) + "</p>");

      html.push('<div class="badge-row">');
      html.push('<span class="badge mono">Version ' + escapeHtml(meta.version || "1.0.0") + "</span>");
      html.push('<span class="badge mono">Date ' + escapeHtml(meta.date || "2026-11-24") + "</span>");

      html.push('<article class="doc-card" id="sec-exec-root">');

        html.push('<div class="section-card' + hlCls + '" id="prd-' + escapeHtml(sid) + '">');

        paras.forEach(function (para) {
          var trimmed = String(para || "").trim();
          if (!trimmed || trimmed.charAt(0) === "|") return;
          html.push("<p>" + renderInlineMd(trimmed, q) + "</p>");
        });
        if (sec.kpi_table && Array.isArray(sec.kpi_table.headers) && Array.isArray(sec.kpi_table.rows)) {
          html.push('<div class="table-wrap"><table class="data-table"><thead><tr>');
          sec.kpi_table.headers.forEach(function (h) {
            html.push("<th>" + renderInlineMd(h, q) + "</th>");
          });
          html.push("</tr></thead><tbody>");
          sec.kpi_table.rows.forEach(function (row) {
            html.push("<tr>");
            row.forEach(function (cell) {
              html.push("<td>" + renderInlineMd(cell, q) + "</td>");
            });
            html.push("</tr>");
          });
          html.push("</tbody></table></div>");
        }
        html.push("</div>");
      });

      // Panorama visuel directeur (SCH-00-01..04)
      var execSchemas = Array.isArray(es.vulgarization_schemas) ? es.vulgarization_schemas : [];
      if (execSchemas.length) {
        var panHlCls = activeSec === "panorama" ? " highlighted" : "";
        html.push('<div class="section-card' + panHlCls + '" id="prd-exec-panorama">');
        html.push("<h3>Panorama visuel directeur — Schémas de vulgarisation transversaux</h3>");
        html.push("<p>Les quatre schémas directeurs transversaux ci-dessous vulgarisent l'ensemble de la doctrine (architecture 80/20, chaîne de confiance protocolaire et juridique, trajectoire 2026–2035 et équation économique FinOps / homologation G0–G5) avant d'entrer dans le détail des 12 Parties.</p>");
        html.push('<div class="schema-grid">');
        execSchemas.forEach(function (sch) {
          html.push(renderVulgarizationSchemaCard(sch, idx, state));
        });
        html.push("</div></div>");
      }

      // Aperçu rapide des 12 Parties et 5 Annexes lorsque ciblé sur le sommaire
      if (state.mode === "targeted") {
        html.push('<div class="doc-h4">Vue d\'ensemble des 12 Parties (D01–D12) et des ' + idx.annexes.length + " Annexes (A–E)</div>");
        html.push('<div class="cards-grid">');
        idx.parties.forEach(function (p) {
          html.push(
            '<div class="overview-card" style="border-top-color:' + domainColor(p.domain_id) + ';">' +

                '<span class="badge dom" style="background:' + domainColor(p.domain_id) + ';">' + escapeHtml(p.domain_id) + "</span>" +
                '<span class="badge mono">Partie ' + escapeHtml(p.part_roman) + "</span>" +
                '<span class="badge mono">Ch. ' + (p.chapter_numbers || []).map(pad2).join(", ") + "</span>" +
              "</div>" +
              "<strong>" + escapeHtml(p.representative_part_title) + "</strong>" +
              '<div style="font-size:12px;color:var(--text-muted);">' + renderInlineMd(p.part_summary, q) + "</div>" +
              '<div class="theme-actions">' +
                '<button type="button" class="btn btn-sm" data-nav-kind="part" data-nav-domain="' + escapeHtml(p.domain_id) + '">Ouvrir Partie ' + escapeHtml(p.part_roman) + "</button>" +
                '<a class="btn btn-sm" href="' + escapeHtml(mindmapHref("mindmap", p.domain_node_id)) + '">MindMap ↗</a>' +
              "</div>" +
            "</div>"
          );
        });
        html.push("</div>");
      }

      html.push("</article>");
      return html.join("");
    }

    function renderThemeCard(th, ch, state) {
      var q = state.highlightQuery || "";
      var focusId = state.target && state.target.focusId;
      var focused = focusId && (focusId === th.theme_node_id || focusId === th.canonical_slug) ? " focused-target" : "";
      var domColor = domainColor(ch.domain_id);

      var ids = Array.isArray(th.identifiers_and_norms) ? th.identifiers_and_norms : [];
      var auts = Array.isArray(th.autonomy_levels) ? th.autonomy_levels : [];
      var roles = Array.isArray(th.roles) ? th.roles : [];
      var tomes = Array.isArray(th.tomes_present) ? th.tomes_present : [];
      var anchors = Array.isArray(th.direct_anchors) ? th.direct_anchors : [];

      var html = [];
      html.push('<div class="theme-card' + focused + '" id="thm-' + escapeHtml(th.theme_node_id) + '" style="border-left-color:' + domColor + ';">');
      html.push('<div class="theme-head">');
      html.push('<div><div class="theme-title">' + renderInlineMd(th.theme_title, q) + '</div><div class="badge-row" style="margin-top:4px;"><span class="badge mono">' + escapeHtml(th.theme_node_id) + '</span><span class="badge mono">' + escapeHtml(th.canonical_slug) + "</span></div></div>");
      html.push(
        '<div class="theme-actions">' +
          '<a class="btn btn-sm" href="' + escapeHtml(mindmapHref("mindmap", th.theme_node_id)) + '">Voir dans la MindMap ↗</a>' +
          '<a class="btn btn-sm" href="' + escapeHtml(mindmapHref("synaptic", th.theme_node_id)) + '">Voir dans le Graphe ↗</a>' +
        "</div>"
      );
      html.push("</div>");
      html.push('<p class="theme-spec">' + renderInlineMd(th.content_specification, q) + "</p>");

      html.push('<div class="badge-row">');
      if (auts.length) html.push('<span class="badge">Autonomie : ' + escapeHtml(auts.join(", ")) + "</span>");
      if (roles.length) html.push('<span class="badge">Rôles : ' + escapeHtml(roles.join(", ")) + "</span>");
      if (th.horizon) html.push('<span class="badge mono">Horizon : ' + escapeHtml(th.horizon) + "</span>");
      if (tomes.length) html.push('<span class="badge mono">Tomes : ' + escapeHtml(tomes.join(", ")) + "</span>");
      if (th.relation_degree != null) html.push('<span class="badge mono">Degré : ' + escapeHtml(th.relation_degree) + "</span>");
      ids.forEach(function (ident) {
        html.push('<span class="badge mono">' + highlightPlain(escapeHtml(String(ident).replace(/\\\$/g, "$")), q) + "</span>");
      });
      html.push("</div>");

      if (anchors.length) {
        html.push('<div class="theme-anchors"><strong style="font-size:11.5px;color:var(--text-muted);">Ancrages directs :</strong>');
        anchors.forEach(function (anc) {
          var href = corpusHref(anc.file, anc.line_start);
          var lbl = anc.label || ((anc.tome_id || "") + " L" + (anc.line_start || "") + (anc.line_end ? "–L" + anc.line_end : ""));
          html.push('<a class="anchor-pill" href="' + escapeHtml(href) + '">' + escapeHtml(lbl) + " ↗</a>");
        });
        html.push("</div>");
      }

      html.push("</div>");
      return html.join("");
    }

    function renderChapterCard(ch, idx, state, filterState) {
      var cnum = Number(ch.chapter_number);
      var tc = ch.targeted_content || {};
      var fams = Array.isArray(tc.families_and_themes) ? tc.families_and_themes : [];
      var q = state.highlightQuery || "";
      var domColor = domainColor(ch.domain_id);
      var focusKind = state.target && state.target.kind === "chapter" && Number(state.target.chapterNumber) === cnum ? state.target.focusKind : null;
      var focusId = state.target && state.target.kind === "chapter" && Number(state.target.chapterNumber) === cnum ? state.target.focusId : null;

      var visibleFams = fams.map(function (fam, k) {
        var visibleThemes = (fam.themes_targeted || []).filter(function (th) {
          return !filterState.active || filterState.matchingThemeIds.has(th.theme_node_id);
        });
        return { fam: fam, index: k + 1, themes: visibleThemes };
      }).filter(function (item) {
        return !filterState.active || item.themes.length > 0;
      });

      if (filterState.active && visibleFams.length === 0) return "";

      var thmCountTotal = fams.reduce(function (acc, f) { return acc + (f.themes_targeted || []).length; }, 0);
      var html = [];
      html.push('<article class="doc-card" id="ch-' + pad2(cnum) + '" style="border-top:4px solid ' + domColor + ';">');

      html.push('<div class="theme-head">');
      html.push(
        '<div>' +
          '<h3 class="doc-h3">' +
            '<span class="badge dom" style="background:' + domColor + ';">' + escapeHtml(ch.domain_id) + "</span>" +
            '<span class="badge mono">' + escapeHtml(ch.chapter_code || ("CH-" + pad2(cnum))) + "</span>" +
            "<span>Chapitre " + pad2(cnum) + " — " + renderInlineMd(ch.representative_title, q) + "</span>" +
          "</h3>" +
        "</div>"
      );
      html.push(
        '<div class="theme-actions">' +
          '<a class="btn btn-sm" href="' + escapeHtml(mindmapHref("mindmap", ch.subdomain_node_id)) + '">MindMap ↗</a>' +
          '<a class="btn btn-sm" href="' + escapeHtml(mindmapHref("synaptic", ch.subdomain_node_id)) + '">Graphe ↗</a>' +
        "</div>"
      );
      html.push("</div>");

      html.push('<div class="badge-row">');
      html.push('<span class="badge mono">Sous-domaine : ' + escapeHtml(ch.subdomain_node_id) + (ch.subdomain_title ? " (" + escapeHtml(ch.subdomain_title) + ")" : "") + "</span>");
      html.push('<span class="badge mono">' + fams.length + " familles · " + thmCountTotal + " thèmes</span>");
      if (Array.isArray(ch.tomes_present) && ch.tomes_present.length) {
        html.push('<span class="badge mono">Tomes : ' + escapeHtml(ch.tomes_present.join(", ")) + "</span>");
      }
      if (Array.isArray(ch.autonomy_levels) && ch.autonomy_levels.length) {
        html.push('<span class="badge">Autonomie : ' + escapeHtml(ch.autonomy_levels.join(", ")) + "</span>");
      }
      if (Array.isArray(ch.roles) && ch.roles.length) {
        html.push('<span class="badge">Rôles : ' + escapeHtml(ch.roles.join(", ")) + "</span>");
      }
      html.push("</div>");

      // Résumé
      var resCls = focusKind === "resume" ? "section-card highlighted" : "section-card";
      html.push('<div class="' + resCls + '" id="ch-' + pad2(cnum) + '-resume">');
      html.push('<div class="doc-h4" style="margin-top:0;">' + pad2(cnum) + ".1 Résumé</div>");
      html.push("<p>" + renderInlineMd(ch.executive_summary, q) + "</p>");
      html.push("</div>");

      // Descriptif du contenu ciblé
      var descCls = focusKind === "desc" ? "section-card highlighted" : "section-card";
      html.push('<div class="' + descCls + '" id="ch-' + pad2(cnum) + '-desc">');
      html.push('<div class="doc-h4" style="margin-top:0;">' + pad2(cnum) + ".2 Descriptif du contenu ciblé</div>");
      if (tc.scope_and_objectives) {
        html.push("<p><strong>Périmètre et objectifs vérifiables :</strong> " + renderInlineMd(tc.scope_and_objectives, q) + "</p>");
      }
      if (Array.isArray(tc.key_requirements_and_objectives) && tc.key_requirements_and_objectives.length) {
        html.push('<ul class="req-list">');
        tc.key_requirements_and_objectives.forEach(function (req) {
          html.push("<li>" + renderInlineMd(req, q) + "</li>");
        });
        html.push("</ul>");
      }
      html.push("</div>");

      // Familles et Thèmes
      visibleFams.forEach(function (wrap) {
        var fam = wrap.fam;
        var fCode = fam.family_code || (pad2(cnum) + ".2." + wrap.index);
        var famFocus = focusId === fam.family_node_id ? " focused-target" : "";
        html.push('<div class="family-box' + famFocus + '" id="fam-' + escapeHtml(fam.family_node_id) + '">');
        html.push('<div class="family-head">');
        html.push('<div><h5>' + renderInlineMd(fCode + " " + fam.family_title, q) + ' <span class="badge mono">' + escapeHtml(fam.family_node_id) + "</span></h5></div>");
        html.push(
          '<div class="theme-actions">' +
            '<a class="btn btn-sm" href="' + escapeHtml(mindmapHref("mindmap", fam.family_node_id)) + '">MindMap ↗</a>' +
            '<a class="btn btn-sm" href="' + escapeHtml(mindmapHref("synaptic", fam.family_node_id)) + '">Graphe ↗</a>' +
          "</div>"
        );
        html.push("</div>");
        if (fam.family_overview) {
          html.push('<p style="margin:0;font-size:13px;color:var(--text-muted);">' + renderInlineMd(fam.family_overview, q) + "</p>");
        }
        html.push('<div class="themes-stack">');
        wrap.themes.forEach(function (th) {
          html.push(renderThemeCard(th, ch, state));
        });
        html.push("</div>");
        html.push("</div>");
      });

      // Livrables
      if (Array.isArray(tc.deliverables_and_verification) && tc.deliverables_and_verification.length) {
        html.push('<div class="section-card">');
        html.push('<div class="doc-h4" style="margin-top:0;">Livrables et critères d\'acceptation</div>');
        html.push('<ul class="deliv-list">');
        tc.deliverables_and_verification.forEach(function (deliv) {
          html.push("<li>" + renderInlineMd(deliv, q) + "</li>");
        });
        html.push("</ul></div>");
      }

      // Interrelations systémiques
      var interrels = Array.isArray(tc.cross_chapter_interrelations) ? tc.cross_chapter_interrelations : [];
      if (interrels.length) {
        html.push('<div class="section-card">');
        html.push('<div class="doc-h4" style="margin-top:0;">Interrelations systémiques (' + interrels.length + ")</div>");
        html.push('<div class="rel-grid">');
        interrels.forEach(function (rel) {
          var dir = rel.direction === "entrante" ? "entrante" : "sortante";
          var arrow = dir === "sortante" ? "→" : "←";
          var prep = dir === "sortante" ? "vers" : "depuis";
          var rcol = relColor(rel.relation_type);
          var tnum = Number(rel.target_chapter_number);
          var targetCh = idx.chapterByNum[tnum];
          var targetTitle = rel.target_chapter_title || (targetCh ? targetCh.representative_title : ("Chapitre " + pad2(tnum)));
          var localSlugDisp = Array.isArray(rel.local_slugs) ? rel.local_slugs.join(", ") : (rel.local_slug || "");
          var targetSlugDisp = Array.isArray(rel.target_slugs) ? rel.target_slugs.join(", ") : (rel.target_slug || "");

            '<div class="rel-item" style="border-left-color:' + rcol + ';">' +
              '<div class="badge-row">' +
                '<span class="badge mono" style="border-color:' + rcol + ';color:' + rcol + ';">' + arrow + " " + escapeHtml(rel.relation_type) + "</span>" +
                '<span style="color:var(--text-muted);">' + prep + "</span>" +
                '<button type="button" class="btn btn-sm" data-nav-kind="chapter" data-nav-ch="' + tnum + '"' + (rel.target_node_id ? ' data-nav-focus-kind="thm" data-nav-focus-id="' + escapeHtml(rel.target_node_id) + '"' : "") + ">Ch. " + pad2(tnum) + " — " + renderInlineMd(targetTitle, "") + "</button>" +

              (targetSlugDisp ? '<div class="badge-row"><span class="badge mono">' + escapeHtml(localSlugDisp) + " ↔ " + escapeHtml(targetSlugDisp) + "</span></div>" : "") +
              "<div>" + renderInlineMd(rel.synthesis || rel.label || "", q) + "</div>" +
            "</div>"
          );
        });
        html.push("</div></div>");
      }

      // Ancrages Corpus
      var corpusAnchors = Array.isArray(tc.corpus_anchors) ? tc.corpus_anchors : [];
      if (corpusAnchors.length) {
        html.push('<div class="section-card">');
        html.push('<div class="doc-h4" style="margin-top:0;">Ancrages dans le Corpus (' + corpusAnchors.length + ")</div>");
        html.push('<div class="table-wrap"><table class="data-table"><thead><tr><th>Tome</th><th>Fichier source (<code>Corpus/</code>)</th><th>Référence</th></tr></thead><tbody>');
        corpusAnchors.forEach(function (anc) {
          var ls = anc.line_start;
          if (!ls && anc.reference) {
            var m = String(anc.reference).match(/\bL([1-9]\d*)\b/);
            if (m) ls = Number(m[1]);
          }
          var href = corpusHref(anc.file, ls);
          var fname = String(anc.file || "").split("/").pop();
          html.push(
            "<tr>" +
              '<td><span class="badge mono">' + escapeHtml(anc.tome_id) + "</span></td>" +
              '<td><a href="' + escapeHtml(href) + '">' + escapeHtml(fname) + (ls ? " #L" + ls : "") + " ↗</a></td>" +
              "<td>" + renderInlineMd(anc.reference, q) + "</td>" +
            "</tr>"
          );
        });
        html.push("</tbody></table></div></div>");
      }

      // Schémas de vulgarisation à intégrer (XX.3)
      var chSchemas = Array.isArray(ch.vulgarization_schemas) ? ch.vulgarization_schemas : [];
      if (chSchemas.length) {
        var schCls = focusKind === "schemas" ? "section-card highlighted" : "section-card";
        var famsCoveredSet = new Set();
        var reuseCounts = { reemploi_direct: 0, adaptation_vulgarisee: 0, creation_originale: 0 };
        chSchemas.forEach(function (sch) {
          (sch.families_covered || []).forEach(function (fid) { famsCoveredSet.add(fid); });
          if (reuseCounts[sch.reuse_status] != null) reuseCounts[sch.reuse_status] += 1;
