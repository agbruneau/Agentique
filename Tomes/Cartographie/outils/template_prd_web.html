        prevBtn = cnum > 1
          ? '<button type="button" class="btn btn-sm" data-nav-kind="chapter" data-nav-ch="' + (cnum - 1) + '">← Chapitre ' + pad2(cnum - 1) + "</button>"
          : '<button type="button" class="btn btn-sm" data-nav-kind="part" data-nav-domain="D01">← Partie I</button>';
        nextBtn = cnum < idx.chapters.length
          ? '<button type="button" class="btn btn-sm primary" data-nav-kind="chapter" data-nav-ch="' + (cnum + 1) + '">Chapitre ' + pad2(cnum + 1) + " →</button>"
          : '<button type="button" class="btn btn-sm primary" data-nav-kind="annexe" data-nav-annexe="A">Annexe A →</button>';
      } else if (t.kind === "annexe") {
        var order = ["A", "B", "C", "D", "E"];
        var pos = order.indexOf(t.annexeCode);
        label = "Annexe " + t.annexeCode;
        prevBtn = pos > 0
          ? '<button type="button" class="btn btn-sm" data-nav-kind="annexe" data-nav-annexe="' + order[pos - 1] + '">← Annexe ' + order[pos - 1] + "</button>"
          : '<button type="button" class="btn btn-sm" data-nav-kind="chapter" data-nav-ch="36">← Chapitre 36</button>';
        nextBtn = pos >= 0 && pos < order.length - 1
          ? '<button type="button" class="btn btn-sm primary" data-nav-kind="annexe" data-nav-annexe="' + order[pos + 1] + '">Annexe ' + order[pos + 1] + " →</button>"
          : "";
      }

      return (
        '<div class="reading-nav">' +
          "<div>" + prevBtn + "</div>" +
          '<div class="badge-row"><span class="badge mono">' + escapeHtml(label) + '</span><button type="button" class="btn btn-sm" id="prd-inline-fullmode-btn">Afficher le document intégral</button></div>' +
          "<div>" + nextBtn + "</div>" +
        "</div>"
      );
    }

    function renderContentHtml(idx, state, filterState) {
      var parts = [];
      var fState = filterState || filterPrd(idx, state.filters);

      if (fState.active) {
        parts.push(
          '<div class="callout" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">' +
            "<span>Filtre actif : <strong>" + fState.counts.themes + "</strong> thème(s) dans <strong>" + fState.counts.chapters + "</strong> chapitre(s) et <strong>" + fState.counts.parties + "</strong> partie(s).</span>" +
            '<button type="button" class="btn btn-sm" id="prd-banner-reset-btn">Afficher tout (' + idx.counts.themes + " thèmes)</button>" +
          "</div>"
        );
      }

      if (state.mode === "full") {
        parts.push(renderExecSummaryCard(idx, state));
        var anyCh = false;
        idx.parties.forEach(function (p) {
          var rendered = renderPartyHeaderCard(p, idx, state, true, fState);
          if (rendered) {
            anyCh = true;
            parts.push(rendered);
          }
        });
        if (!anyCh) {
          parts.push('<div class="empty-state">Aucun chapitre ni thème ne correspond aux filtres sélectionnés.</div>');
        }
        idx.annexes.forEach(function (ann) {
          parts.push(renderAnnexeCard(ann, idx, state));
        });
        return parts.join("");
      }

      // Mode Chapitre ciblé
      parts.push(renderReadingNavBar(idx, state));
      var t = state.target || { kind: "exec" };
      if (t.kind === "exec") {
        parts.push(renderExecSummaryCard(idx, state));
      } else if (t.kind === "part") {
        var party = idx.partyByDomain[t.domainId] || idx.parties[0];
        if (party) {
          var pHtml = renderPartyHeaderCard(party, idx, state, false, fState);
          parts.push(pHtml || '<div class="empty-state">Aucun chapitre de cette partie ne correspond aux filtres actifs.</div>');
        }
      } else if (t.kind === "chapter") {
        var ch = idx.chapterByNum[Number(t.chapterNumber)] || idx.chapters[0];
        if (ch) {
          var cHtml = renderChapterCard(ch, idx, state, fState);
          parts.push(cHtml || '<div class="empty-state">Aucun thème de ce chapitre ne correspond aux filtres actifs.</div>');
        }
      } else if (t.kind === "annexe") {
        var ann = idx.annexeByCode[t.annexeCode] || idx.annexes[0];
        if (ann) parts.push(renderAnnexeCard(ann, idx, state));
      }

      return parts.join("");
    }

    // =========================================================================
    // 4. Contrôleur DOM navigateur & smoke Node.js
    // =========================================================================
    function mountApp(docArg, winArg) {
      var doc = docArg || (typeof document !== "undefined" ? document : null);
      var win = winArg || (typeof window !== "undefined" ? window : globalThis);
      if (!doc) return null;

      var dataEl = doc.getElementById("prd-web-data");
      if (!dataEl) return null;
      var rawData = JSON.parse(dataEl.textContent || "{}");
      var idx = buildIndexes(rawData);

      var state = {
        mode: "targeted",
        theme: "auto",
        target: { kind: "exec", sectionId: null },
        filters: { domain: "", autonomy: "", role: "" },
        highlightQuery: "",
        tocFilter: "",
        tocExpanded: new Set(["TOC_EXEC"]),
        searchResults: []
      };

      var initialTarget = (win && win.location && win.location.hash) ? parseHash(win.location.hash, idx) : null;
      if (initialTarget) {
        state.target = initialTarget;
        if (initialTarget.kind === "chapter") {
          var initCh = idx.chapterByNum[initialTarget.chapterNumber];
          if (initCh) {
            state.tocExpanded.add("TOC_PART_" + initCh.domain_id);
            state.tocExpanded.add("TOC_CH_" + initCh.chapter_number);
          }
        } else if (initialTarget.kind === "part") {
          state.tocExpanded.add("TOC_PART_" + initialTarget.domainId);
        } else if (initialTarget.kind === "annexe") {
          state.tocExpanded.add("TOC_ANN_" + initialTarget.annexeCode);
        }
      }

      var elTitle = doc.getElementById("prd-global-title");
      var elMeta = doc.getElementById("prd-global-meta");
      var elKpis = doc.getElementById("prd-kpi-strip");
      var elSearch = doc.getElementById("prd-search");
      var elSearchDrop = doc.getElementById("prd-search-dropdown");
      var elDomain = doc.getElementById("prd-filter-domain");
      var elAutonomy = doc.getElementById("prd-filter-autonomy");
      var elRole = doc.getElementById("prd-filter-role");
      var elReset = doc.getElementById("prd-reset-filters-btn");
      var elFilterSummary = doc.getElementById("prd-filter-summary");
      var elTocToggle = doc.getElementById("prd-toc-toggle-btn");
      var elTocSidebar = doc.getElementById("prd-toc");
      var elTocExpand = doc.getElementById("prd-toc-expand-btn");
      var elTocFilter = doc.getElementById("prd-toc-filter");
      var elTocCount = doc.getElementById("prd-toc-count");
      var elTocTree = doc.getElementById("prd-toc-tree");
      var elModeBtn = doc.getElementById("prd-mode-btn");
      var elThemeBtn = doc.getElementById("prd-theme-btn");
      var elPrintBtn = doc.getElementById("prd-print-btn");
      var elMain = doc.getElementById("prd-main");
      var elContent = doc.getElementById("prd-content");
      var elOpenMindmapLink = doc.getElementById("prd-open-mindmap-link");
      var elSourceLink = doc.getElementById("prd-source-md-link");

      function populateStaticChrome() {
        var meta = idx.meta || {};
        if (elTitle) elTitle.textContent = meta.prd_title || "Référentiel directeur de l'entreprise agentique";
        if (elMeta) {
          elMeta.textContent = "v" + (meta.version || "1.0.0") + " · " + (meta.date || "2026-11-24") + " · " + (meta.status || "non-avis");
        }
        if (elSourceLink && meta.source_md) {
          elSourceLink.setAttribute("href", meta.source_md);
        }

        if (elDomain) {
          var domOpts = ['<option value="">Tous (' + idx.facets.domains.length + ")</option>"];
          idx.facets.domains.forEach(function (d) {
            domOpts.push('<option value="' + escapeHtml(d.id) + '">' + escapeHtml(d.label) + "</option>");
          });
          elDomain.innerHTML = domOpts.join("");
        }
        if (elAutonomy) {
          var autOpts = ['<option value="">Tous (L0–L4)</option>'];
          idx.facets.autonomy.forEach(function (a) {
            autOpts.push('<option value="' + escapeHtml(a) + '">' + escapeHtml(a) + "</option>");
          });
          elAutonomy.innerHTML = autOpts.join("");
        }
        if (elRole) {
          var roleOpts = ['<option value="">Tous</option>'];
          idx.facets.roles.forEach(function (r) {
            roleOpts.push('<option value="' + escapeHtml(r) + '">' + escapeHtml(r) + "</option>");
          });
          elRole.innerHTML = roleOpts.join("");
        }
      }

      function renderAll(scrollFocus) {
        var fState = filterPrd(idx, state.filters);
        if (elKpis) {
          elKpis.innerHTML =
            '<span class="kpi-pill"><strong>' + idx.counts.parties + "</strong> domaines</span>" +
            '<span class="kpi-pill"><strong>' + idx.counts.chapters + "</strong> chapitres</span>" +
            '<span class="kpi-pill"><strong>' + idx.counts.families + "</strong> familles</span>" +
            '<span class="kpi-pill"><strong>' + idx.counts.themes + "</strong> thèmes</span>" +
            '<span class="kpi-pill"><strong>' + idx.counts.relations + "</strong> interrelations</span>" +
            '<span class="kpi-pill"><strong>' + idx.counts.annexes + "</strong> annexes</span>" +
            '<span class="kpi-pill"><strong>' + idx.counts.schemas + "</strong> schémas</span>";
        }
        if (elFilterSummary) {
          elFilterSummary.textContent = fState.counts.themes + " / " + idx.counts.themes + " thèmes · " + fState.counts.chapters + " / " + idx.counts.chapters + " chapitres";
        }
        if (elModeBtn) {
          elModeBtn.textContent = state.mode === "full" ? "Mode : Document intégral" : "Mode : Chapitre ciblé";
          elModeBtn.classList.toggle("active", state.mode === "full");
          if (typeof elModeBtn.setAttribute === "function") {
            elModeBtn.setAttribute("aria-pressed", String(state.mode === "full"));
          }
        }
        if (elOpenMindmapLink && typeof elOpenMindmapLink.setAttribute === "function") {
          var mmHref = "";
          var curT = state.target || {};
          if (curT.kind === "annexe" && curT.annexeCode) {
            mmHref = MINDMAP_HTML + "#view=prd&annexe=" + encodeURIComponent(String(curT.annexeCode));
          } else if (curT.kind === "exec" && curT.sectionId === "panorama") {
            mmHref = MINDMAP_HTML + "#view=prd&sec=panorama";
          } else {
            var mmTargetNode = null;
            if (curT.kind === "part") {
              var curP = idx.partyByDomain[curT.domainId];
              mmTargetNode = curP && curP.domain_node_id ? curP.domain_node_id : null;
            } else if (curT.kind === "chapter") {
              if ((curT.focusKind === "thm" || curT.focusKind === "fam") && curT.focusId) {
                mmTargetNode = curT.focusId;
              } else {
                var curCh = idx.chapterByNum[Number(curT.chapterNumber)];
                mmTargetNode = curCh && curCh.subdomain_node_id ? curCh.subdomain_node_id : null;
              }
            }
            mmHref = mindmapHref("mindmap", mmTargetNode);
          }
          elOpenMindmapLink.setAttribute("href", mmHref);
        }

        var tocOut = renderTocHtml(idx, state.tocFilter, state, fState);
        if (elTocTree) elTocTree.innerHTML = tocOut.html;
        if (elTocCount) elTocCount.textContent = String(tocOut.count);

        if (elContent) elContent.innerHTML = renderContentHtml(idx, state, fState);

        if (scrollFocus && doc) {
          var focusEl = null;
          var t = state.target || {};
          if (t.focusKind === "thm" && t.focusId) {
            focusEl = doc.getElementById("thm-" + t.focusId);
          } else if (t.focusKind === "fam" && t.focusId) {
            focusEl = doc.getElementById("fam-" + t.focusId);
          } else if (t.focusKind === "sch" && t.focusId) {
            focusEl = doc.getElementById("sch-" + t.focusId);
          } else if (t.focusKind === "schemas" && t.chapterNumber) {
            focusEl = doc.getElementById("ch-" + pad2(t.chapterNumber) + "-schemas");
          } else if (t.kind === "exec" && t.sectionId === "panorama") {
            focusEl = doc.getElementById("prd-exec-panorama");
          } else if (t.kind === "exec" && t.sectionId) {
            focusEl = doc.getElementById("prd-" + t.sectionId);
          } else if (t.kind === "chapter") {
            focusEl = doc.getElementById("ch-" + pad2(t.chapterNumber));
          } else if (t.kind === "part") {
            focusEl = doc.getElementById("part-" + t.domainId);
          } else if (t.kind === "annexe") {
            focusEl = doc.getElementById("annexe-" + t.annexeCode);
          }
          if (focusEl && typeof focusEl.scrollIntoView === "function") {
            focusEl.scrollIntoView({ behavior: "smooth", block: "start" });
          } else if (elMain && typeof elMain.scrollTo === "function") {
            elMain.scrollTo(0, 0);
          }
        }
      }

      function syncUrlHash(target) {
        if (!win || !win.history || typeof win.history.replaceState !== "function") return;
        try {
          win.history.replaceState(null, "", targetToHash(target));
        } catch (_err) {
          // Ignore dans les contextes sandbox restreints
        }
      }

      function navigateToTarget(target, opts) {
        if (!target) return;
        var options = opts || {};
        // Assure que les filtres actifs ne masquent pas une cible directe
        if (options.ensureVisible && target.kind === "chapter") {
          var fState = filterPrd(idx, state.filters);
          if (fState.active && !fState.matchingChapterNums.has(Number(target.chapterNumber))) {
            state.filters = { domain: "", autonomy: "", role: "" };
            if (elDomain) elDomain.value = "";
            if (elAutonomy) elAutonomy.value = "";
            if (elRole) elRole.value = "";
          }
        }
        state.target = target;
        if (target.kind === "chapter") {
          var ch = idx.chapterByNum[Number(target.chapterNumber)];
          if (ch) {
            state.tocExpanded.add("TOC_PART_" + ch.domain_id);
            state.tocExpanded.add("TOC_CH_" + ch.chapter_number);
          }
        } else if (target.kind === "part") {
          state.tocExpanded.add("TOC_PART_" + target.domainId);
        } else if (target.kind === "annexe") {
          state.tocExpanded.add("TOC_ANN_" + target.annexeCode);
        } else if (target.kind === "exec") {
          state.tocExpanded.add("TOC_EXEC");
        }
        syncUrlHash(target);
        renderAll(true);
      }

      function handleNavElement(el) {
        if (!el || typeof el.getAttribute !== "function") return false;
        var kind = el.getAttribute("data-nav-kind");
        if (!kind) return false;
        if (kind === "exec") {
          navigateToTarget({ kind: "exec", sectionId: el.getAttribute("data-nav-sec") || null }, { ensureVisible: true });
          return true;
        }
        if (kind === "part") {
          navigateToTarget({ kind: "part", domainId: el.getAttribute("data-nav-domain") || "D01" }, { ensureVisible: true });
          return true;
        }
        if (kind === "chapter") {
          navigateToTarget({
            kind: "chapter",
            chapterNumber: Number(el.getAttribute("data-nav-ch") || 1),
            focusKind: el.getAttribute("data-nav-focus-kind") || null,
            focusId: el.getAttribute("data-nav-focus-id") || null
          }, { ensureVisible: true });
          return true;
        }
        if (kind === "annexe") {
          navigateToTarget({
            kind: "annexe",
            annexeCode: el.getAttribute("data-nav-annexe") || "A",
            focusKind: el.getAttribute("data-nav-focus-kind") || null
          }, { ensureVisible: true });
          return true;
        }
        return false;
      }

      function toggleTocNode(key) {
        if (state.tocExpanded.has(key)) state.tocExpanded.delete(key);
        else state.tocExpanded.add(key);
        renderAll(false);
      }

      function expandAllToc() {
        var allOpen = state.tocExpanded.size >= (idx.parties.length + idx.chapters.length + 5);
        if (allOpen) {
          state.tocExpanded = new Set(["TOC_EXEC"]);
          if (elTocExpand) {
            elTocExpand.textContent = "Tout déplier";
            if (typeof elTocExpand.setAttribute === "function") elTocExpand.setAttribute("aria-expanded", "false");
          }
        } else {
          state.tocExpanded.add("TOC_EXEC");
          idx.parties.forEach(function (p) { state.tocExpanded.add("TOC_PART_" + p.domain_id); });
          idx.chapters.forEach(function (c) { state.tocExpanded.add("TOC_CH_" + c.chapter_number); });
          idx.annexes.forEach(function (a) { state.tocExpanded.add("TOC_ANN_" + a.annexe_code); });
          if (elTocExpand) {
            elTocExpand.textContent = "Tout replier";
            if (typeof elTocExpand.setAttribute === "function") elTocExpand.setAttribute("aria-expanded", "true");
          }
        }
        renderAll(false);
      }

      function cycleTheme() {
        var order = ["auto", "light", "dark"];
        var labels = { auto: "Thème : Auto", light: "Thème : Clair", dark: "Thème : Sombre" };
        var pos = (order.indexOf(state.theme) + 1) % order.length;
        state.theme = order[pos];
        if (doc.documentElement && typeof doc.documentElement.setAttribute === "function") {
          doc.documentElement.setAttribute("data-theme", state.theme);
        }
        if (elThemeBtn) elThemeBtn.textContent = labels[state.theme];
      }

      function toggleMode() {
        state.mode = state.mode === "targeted" ? "full" : "targeted";
        renderAll(false);
      }

      function resetFilters() {
        state.filters = { domain: "", autonomy: "", role: "" };
        state.highlightQuery = "";
        if (elDomain) elDomain.value = "";
        if (elAutonomy) elAutonomy.value = "";
        if (elRole) elRole.value = "";
        if (elSearch) elSearch.value = "";
        if (elSearchDrop) elSearchDrop.classList.remove("open");
        renderAll(false);
      }

      function renderSearchDropdown(query) {
        if (!elSearchDrop) return;
        var q = String(query || "").trim();
        state.highlightQuery = q.length >= 2 ? q : "";
        if (!q) {
          state.searchResults = [];
          elSearchDrop.classList.remove("open");
          elSearchDrop.innerHTML = "";
          renderAll(false);
          return;
        }
        var results = searchPrd(idx, q, 24);
        state.searchResults = results;
        if (!results.length) {
          elSearchDrop.innerHTML = '<div class="search-empty" role="status" style="padding:8px 10px;"><span class="search-item-meta">Aucun résultat pour « ' + escapeHtml(q) + " »</span></div>";
          elSearchDrop.classList.add("open");
          renderAll(false);
          return;
        }
        elSearchDrop.innerHTML = results.map(function (r, idxItem) {
          return (
            '<button type="button" class="search-item" role="option" data-search-idx="' + idxItem + '">' +
              '<span class="search-item-head"><span class="badge mono">' + escapeHtml(r.kind) + "</span> " + highlightPlain(escapeHtml(r.title), q) + "</span>" +
              '<span class="search-item-meta">' + escapeHtml(r.subtitle) + "</span>" +
            "</button>"
          );
        }).join("");
        elSearchDrop.classList.add("open");
        renderAll(false);
      }

      // Événements DOM (protégés null-safe)
      if (elDomain) {
        elDomain.addEventListener("change", function (e) {
          state.filters.domain = e.target.value;
          if (state.filters.domain && state.mode === "targeted") {
            navigateToTarget({ kind: "part", domainId: state.filters.domain });
          } else {
            renderAll(false);
          }
        });
      }
      if (elAutonomy) {
        elAutonomy.addEventListener("change", function (e) {
          state.filters.autonomy = e.target.value;
          renderAll(false);
        });
      }
      if (elRole) {
        elRole.addEventListener("change", function (e) {
          state.filters.role = e.target.value;
          renderAll(false);
        });
      }
      if (elReset) elReset.addEventListener("click", resetFilters);
      if (elModeBtn) elModeBtn.addEventListener("click", toggleMode);
      if (elThemeBtn) elThemeBtn.addEventListener("click", cycleTheme);
      if (elTocExpand) elTocExpand.addEventListener("click", expandAllToc);
      if (elTocToggle && elTocSidebar) {
        elTocToggle.addEventListener("click", function () {
          var collapsed = !elTocSidebar.classList.contains("collapsed");
          elTocSidebar.classList.toggle("collapsed", collapsed);
          elTocToggle.classList.toggle("active", !collapsed);
          if (typeof elTocToggle.setAttribute === "function") {
            elTocToggle.setAttribute("aria-expanded", String(!collapsed));
          }
        });
      }
      if (elPrintBtn) {
        elPrintBtn.addEventListener("click", function () {
          if (win && typeof win.print === "function") win.print();
        });
      }
      if (elTocFilter) {
        elTocFilter.addEventListener("input", function (e) {
          state.tocFilter = e.target.value || "";
          renderAll(false);
        });
      }
      if (elSearch) {
        elSearch.addEventListener("input", function (e) {
          renderSearchDropdown(e.target.value || "");
        });
        elSearch.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && state.searchResults.length > 0) {
            e.preventDefault();
            navigateToTarget(state.searchResults[0].target, { ensureVisible: true });
            if (elSearchDrop) elSearchDrop.classList.remove("open");
          } else if (e.key === "Escape") {
            if (elSearchDrop) elSearchDrop.classList.remove("open");
          }
        });
      }
      if (elSearchDrop) {
        elSearchDrop.addEventListener("click", function (e) {
          var item = e.target && typeof e.target.closest === "function" ? e.target.closest("[data-search-idx]") : null;
          if (!item) return;
          var res = state.searchResults[Number(item.getAttribute("data-search-idx"))];
          if (res) {
            navigateToTarget(res.target, { ensureVisible: true });
            elSearchDrop.classList.remove("open");
          }
        });
      }

      if (elTocTree) {
        elTocTree.addEventListener("click", function (e) {
          var exp = e.target && typeof e.target.closest === "function" ? e.target.closest("[data-toc-toggle]") : null;
          if (exp) {
            e.stopPropagation();
            toggleTocNode(exp.getAttribute("data-toc-toggle"));
            return;
          }
          var navEl = e.target && typeof e.target.closest === "function" ? e.target.closest("[data-nav-kind]") : null;
          if (navEl) handleNavElement(navEl);
        });
        elTocTree.addEventListener("keydown", function (e) {
          if (e.key !== "Enter" && e.key !== " ") return;
          var exp = e.target && typeof e.target.closest === "function" ? e.target.closest("[data-toc-toggle]") : null;
          if (exp) return;
          var navEl = e.target && typeof e.target.closest === "function" ? e.target.closest("[data-nav-kind]") : null;
          if (navEl) {
            e.preventDefault();
            handleNavElement(navEl);
          }
        });
      }

      function applyAnnexeTableFilter(tableId) {
        if (!tableId || !elContent || !doc) return;
        var table = doc.getElementById(tableId);
        if (!table) return;
        var textInput = elContent.querySelector ? elContent.querySelector('[data-table-filter="' + tableId + '"]') : null;
        var statusSelect = elContent.querySelector ? elContent.querySelector('[data-table-select="status"][data-table-target="' + tableId + '"]') : null;
        var audSelect = elContent.querySelector ? elContent.querySelector('[data-table-select="audiences"][data-table-target="' + tableId + '"]') : null;
        var q = normalizeText(textInput ? textInput.value : "");
        var statusVal = statusSelect ? String(statusSelect.value || "") : "";
        var audVal = audSelect ? String(audSelect.value || "") : "";

        var rows = table.querySelectorAll ? table.querySelectorAll("tbody tr") : [];
        var shown = 0;
        var total = 0;
        Array.prototype.forEach.call(rows, function (tr) {
          total += 1;
          var txt = normalizeText(tr.textContent || "");
          var rowStatus = tr.getAttribute ? (tr.getAttribute("data-status") || "") : "";
          var rowAud = tr.getAttribute ? (tr.getAttribute("data-audiences") || "") : "";
          var okText = !q || txt.indexOf(q) !== -1;
          var okStatus = !statusVal || rowStatus === statusVal;
          var okAud = !audVal || rowAud.split("|").indexOf(audVal) !== -1;
          var vis = okText && okStatus && okAud;
          tr.style.display = vis ? "" : "none";
          if (vis) shown += 1;
        });
        var counterEl = elContent.querySelector ? elContent.querySelector('[data-table-count="' + tableId + '"]') : null;
        if (counterEl) {
          counterEl.innerHTML = "<strong>" + shown + "</strong> / " + total;
        }
      }

      if (elContent) {
        elContent.addEventListener("click", function (e) {
          var t = e.target;
          if (t && t.id === "prd-inline-fullmode-btn") {
            toggleMode();
            return;
          }
          if (t && t.id === "prd-banner-reset-btn") {
            resetFilters();
            return;
          }
          var navEl = t && typeof t.closest === "function" ? t.closest("[data-nav-kind]") : null;
          if (navEl) handleNavElement(navEl);
        });
        elContent.addEventListener("input", function (e) {
          var inp = e.target;
          if (!inp || typeof inp.getAttribute !== "function") return;
          var tableId = inp.getAttribute("data-table-filter");
          if (tableId) applyAnnexeTableFilter(tableId);
        });
        elContent.addEventListener("change", function (e) {
          var sel = e.target;
          if (!sel || typeof sel.getAttribute !== "function") return;
          var tableId = sel.getAttribute("data-table-target");
          if (tableId) applyAnnexeTableFilter(tableId);
        });
      }

      if (doc && typeof doc.addEventListener === "function") {
        doc.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && String(e.key || "").toLowerCase() === "k") {
            e.preventDefault();
            if (elSearch && typeof elSearch.focus === "function") {
              elSearch.focus();
              if (typeof elSearch.select === "function") elSearch.select();
            }
          }
        });
        doc.addEventListener("click", function (e) {
          if (elSearchDrop && e.target && typeof e.target.closest === "function" && !e.target.closest(".search-wrap")) {
            elSearchDrop.classList.remove("open");
          }
        });
      }

      if (win && typeof win.addEventListener === "function") {
        win.addEventListener("hashchange", function () {
          var parsed = win.location && win.location.hash ? parseHash(win.location.hash, idx) : null;
          if (parsed) navigateToTarget(parsed, { ensureVisible: true });
        });
      }

      populateStaticChrome();
      renderAll(Boolean(initialTarget));

      return {
        idx: idx,
        getState: function () { return state; },
        navigateToTarget: navigateToTarget,
        resetFilters: resetFilters,
        toggleMode: toggleMode,
        cycleTheme: cycleTheme,
        renderAll: renderAll
      };
    }

    var api = {
      escapeHtml: escapeHtml,
      normalizeText: normalizeText,
      renderInlineMd: renderInlineMd,
      corpusHref: corpusHref,
      tomeAssetHref: tomeAssetHref,
      formatReuseStatus: formatReuseStatus,
      mindmapHref: mindmapHref,
      parseHash: parseHash,
      targetToHash: targetToHash,
      buildIndexes: buildIndexes,
      filterPrd: filterPrd,
      searchPrd: searchPrd,
      renderTocHtml: renderTocHtml,
      renderContentHtml: renderContentHtml,
      mountApp: mountApp
    };

    if (typeof window !== "undefined") window.PrdWebEngine = api;
    if (typeof globalThis !== "undefined") globalThis.PrdWebEngine = api;

    if (typeof document !== "undefined") {
      if (document.readyState === "loading" && typeof document.addEventListener === "function") {
        document.addEventListener("DOMContentLoaded", function () { mountApp(document, typeof window !== "undefined" ? window : globalThis); });
      } else {
        mountApp(document, typeof window !== "undefined" ? window : globalThis);
      }
    }
  })();
  </script>
</body>
</html>
