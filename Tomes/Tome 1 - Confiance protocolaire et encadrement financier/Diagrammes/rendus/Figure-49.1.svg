<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:775px;height:290px;background:#FAF8F5;" width="775px" height="290px" viewBox="0 0 775 290" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="775" height="290" fill="#FAF8F5" style="stroke:none;"/><g class="title" data-source-line="11"><text x="204.357" y="24.533" fill="#8B2E0B" font-size="14" textLength="359.563" font-weight="700" font-family="'DejaVu Sans'">TROIS STATUTS, ET AUCUN N'EST UNE PRÉDICTION</text></g><!--entity C1--><g class="entity" data-qualified-name="C1" id="ent0001" data-source-line="13"><rect x="7" y="45.609" width="236.385" height="143.266" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="70.143" fill="#000" font-size="14" textLength="109.676" font-weight="700" font-family="'DejaVu Sans'">1  PROGRAMMÉ</text><text x="17" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="17" y="105.361" fill="#000" font-size="14" textLength="216.385" font-family="'DejaVu Sans'">Une date opposable, portée par un</text><text x="17" y="122.971" fill="#000" font-size="14" textLength="181.337" font-family="'DejaVu Sans'">instrument en vigueur ou une</text><text x="17" y="140.58" fill="#000" font-size="14" textLength="89.489" font-family="'DejaVu Sans'">décision prise.</text><text x="17" y="158.189" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="17" y="175.799" fill="#000" font-size="14" textLength="102.724" font-style="italic" font-family="'DejaVu Sans'">le cône est étroit</text></g><!--entity C2--><g class="entity" data-qualified-name="C2" id="ent0002" data-source-line="14"><rect x="278.5" y="45.609" width="226.999" height="143.266" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="288.5" y="70.143" fill="#000" font-size="14" textLength="80.917" font-weight="700" font-family="'DejaVu Sans'">2  PROJETÉ</text><text x="288.5" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="288.5" y="105.361" fill="#000" font-size="14" textLength="206.999" font-family="'DejaVu Sans'">Une cible communiquée par celui</text><text x="288.5" y="122.971" fill="#000" font-size="14" textLength="141.634" font-family="'DejaVu Sans'">qui la porte, sans force</text><text x="288.5" y="140.58" fill="#000" font-size="14" textLength="68.503" font-family="'DejaVu Sans'">opposable.</text><text x="288.5" y="158.189" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="288.5" y="175.799" fill="#000" font-size="14" textLength="96.838" font-style="italic" font-family="'DejaVu Sans'">le cône s'élargit</text></g><!--entity C3--><g class="entity" data-qualified-name="C3" id="ent0003" data-source-line="15"><rect x="540.5" y="45.609" width="220.778" height="143.266" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="550.5" y="70.143" fill="#000" font-size="14" textLength="103.455" font-weight="700" font-family="'DejaVu Sans'">3  SPÉCULATIF</text><text x="550.5" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="550.5" y="105.361" fill="#000" font-size="14" textLength="187.578" font-family="'DejaVu Sans'">Aucun jalon daté au socle ; un</text><text x="550.5" y="122.971" fill="#000" font-size="14" textLength="200.778" font-family="'DejaVu Sans'">raisonnement, et ses conditions.</text><text x="550.5" y="140.58" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="550.5" y="158.189" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="550.5" y="175.799" fill="#000" font-size="14" textLength="110.51" font-style="italic" font-family="'DejaVu Sans'">le cône est ouvert</text></g><!--link C1 to C2--><!--link C2 to C3--><g class="legend" data-source-line="20"><rect x="47.887" y="208.875" width="672.505" height="62.828" fill="#FBF9F5" style="stroke:#BBB;stroke-width:1;" rx="7.5" ry="7.5"/><text x="52.887" y="228.408" fill="#000" font-size="14" textLength="662.505" font-family="'DejaVu Sans'">LE CÔNE S'ÉLARGIT AVEC LE TEMPS (2027-2032), et la discipline qui en découle est la REDATATION :</text><text x="52.887" y="246.018" fill="#000" font-size="14" textLength="417.122" font-family="'DejaVu Sans'">un énoncé prospectif se relit à sa date, jamais à celle de sa lecture.</text><text x="52.887" y="263.627" fill="#000" font-size="14" textLength="347.067" font-family="'DejaVu Sans'">Le chapitre ne prédit pas — il classe, et il dit à quel titre.</text></g><?plantuml-src RPFFJjj04CRlVefHUg2D0YL6gBH5I8vnK2e8A7QuD3rix8cpiDur-uTUUysT1-ZLzxw1twHFqh53aL7mpJlVplpccrbppsN9D2jWoTBxN2idir09fU7TE1YVZ8yzyw8mQvQfdrpci6B2O2UIuOevOSTAsYah47hdUCTk7SHCcbv7PxaLsAYUIvoC_EXmr15eJ2sJkS2HqXdgPzce_TwKxK0VZuTHLoemHvdjwaRZpw-QUzQzKTPhgI6PNKzYY9CWcIVn0A84Wdaudy9qBueJc4yZk9dLc_D9c4okfvxtWWYzVdy85Bo-c0LNL_Mctr_8XPnBX8nP15MMoh2bm06KIjkwGY0YSAJXqbZj2fGMKC8Zpnqw3SfH41SogwkK6wuab9eRF6Yodl8pgfZMVoWx6WjrPRNYzlGZF-i1Cn0ENuFvBTYtAEbYfNpP9555uIH_SF-9KXIEB-I3uo1Ooqh8XYOCAwLJ0dhfP0V5xDMLO3hlalYlIOu0ufjw4yulWsGoti84BdKIxfYW7ichkWBcmAYKRdnj3TAC6oKbDXOD02qOD0GkCsx95zDox9gYt2Fg3icHvuL3sF--vbc6yeVc-ThkDu2XltjAuksgm59PgmeFu3A2i7wY1OZtwirbCBkOq6xSHc4JIAAhcnZU-uV-ftt_yCZ_q6AIVnatAIy59wR6KPflCq_bn9QH5BFeFA1jess2BrI5dAWhgMHADfHQcPBSuolgc5w3u3JgtpICTgK6P5b1pZH7D3JAc64J4tJ3QJneaCcFDIkvrGX4KEgw8izep0R-_de2BY0Lp1XiQUalsnPuS2YQHzma8GksHlm3?></g></svg>