" font-size="14" textLength="240.454" font-family="'DejaVu Sans'">Application Service, Interface, Serving.</text><text x="432" y="122.971" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="432" y="140.58" fill="#000" font-size="14" textLength="50.6" font-style="italic" font-family="'DejaVu Sans'">§ 44.1.3</text></g><!--entity P3--><g class="entity" data-qualified-name="P3" id="ent0003" data-source-line="25"><rect x="7" y="213.609" width="380" height="108.047" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="238.143" fill="#000" font-size="14" textLength="170.358" font-weight="700" font-family="'DejaVu Sans'">3  Interaction agent-agent</text><text x="17" y="255.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="17" y="273.361" fill="#000" font-size="14" textLength="194.53" font-family="'DejaVu Sans'">Collaboration, Flow, Triggering.</text><text x="17" y="290.971" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="17" y="308.58" fill="#000" font-size="14" textLength="50.6" font-style="italic" font-family="'DejaVu Sans'">§ 44.1.4</text></g><!--entity P4--><g class="entity" data-qualified-name="P4" id="ent0004" data-source-line="26"><rect x="422" y="213.609" width="380" height="108.047" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="432" y="238.143" fill="#000" font-size="14" textLength="156.345" font-weight="700" font-family="'DejaVu Sans'">4  Identité non humaine</text><text x="432" y="255.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="432" y="273.361" fill="#000" font-size="14" textLength="260.668" font-family="'DejaVu Sans'">Role, structure active, overlay de sécurité.</text><text x="432" y="290.971" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="432" y="308.58" fill="#000" font-size="14" textLength="50.6" font-style="italic" font-family="'DejaVu Sans'">§ 44.1.5</text></g>