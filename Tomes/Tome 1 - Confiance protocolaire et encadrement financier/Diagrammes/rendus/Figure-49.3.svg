DejaVu Sans'">2  Intensité réglementaire</text><text x="281" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="281" y="105.361" fill="#000" font-size="14" textLength="205.488" font-family="'DejaVu Sans'">Grappe de 2027, gouvernance et</text><text x="281" y="122.971" fill="#000" font-size="14" textLength="219.481" font-family="'DejaVu Sans'">responsabilité · § 49.1, 49.3, 49.10.</text><text x="281" y="140.58" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="281" y="158.189" fill="#000" font-size="14" textLength="227.24" font-style="italic" font-family="'DejaVu Sans'">fermeté des échéances et du régime</text></g><!--entity A3--><g class="entity" data-qualified-name="A3" id="ent0003" data-source-line="15"><rect x="553" y="45.609" width="270.585" height="125.656" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="563" y="70.143" fill="#000" font-size="14" textLength="179.73" font-weight="700" font-family="'DejaVu Sans'">3  Souveraineté / ouverture</text><text x="563" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="563" y="105.361" fill="#000" font-size="14" textLength="206.247" font-family="'DejaVu Sans'">Souveraineté, menace et horloge</text><text x="563" y="122.971" fill="#000" font-size="14" textLength="217.937" font-family="'DejaVu Sans'">post-quantique · § 49.4, 49.5, 49.7.</text><text x="563" y="140.58" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="563" y="158.189" fill="#000" font-size="14" textLength="250.585" font-style="italic" font-family="'DejaVu Sans'">localisation et migration cryptographique</text></g><!--link A1 to A2--><!--link A2 to A3--><g class="legend" data-source-line="20"><rect x="48.241" y="191.266" width="734.104" height="45.219" fill="#FBF9F5" style="stroke:#BBB;stroke-width:1;" rx="7.5" ry="7.5"/><text x="53.241" y="210.799" fill="#000" font-size="14" textLength="603.333" font-family="'DejaVu Sans'"