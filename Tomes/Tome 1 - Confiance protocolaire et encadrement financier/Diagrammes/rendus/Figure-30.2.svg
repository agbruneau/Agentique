<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1136px;height:302px;background:#FFFFFF;" width="1136px" height="302px" viewBox="0 0 1136 302" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster TROIS ÉTATS, ET UNE ERREUR DE DATE INVERSE LE SENS--><g class="cluster" data-qualified-name="TROIS .TATS. ET UNE ERREUR DE DATE INVERSE LE SENS" id="ent0001" data-source-line="24"><path d="M9,6 L418.165,6 A4.5,4.5 0 0 1 421.165,9 L428.165,29.609 L865,29.609 A3,3 0 0 1 868,32.609 L868,198 A3,3 0 0 1 865,201 L9,201 A3,3 0 0 1 6,198 L6,9 A3,3 0 0 1 9,6" style="stroke:#D4CFC7;stroke-width:1.5;" fill="#FDFBF7"/><line x1="6" y1="29.609" x2="428.165" y2="29.609" style="stroke:#D4CFC7;stroke-width:1.5;"/><text x="10" y="22.533" fill="#9C3D14" font-size="14" textLength="409.165" font-weight="700">TROIS ÉTATS, ET UNE ERREUR DE DATE INVERSE LE SENS</text></g><!--entity S1--><g class="entity" data-qualified-name="TROIS .TATS. ET UNE ERREUR DE DATE INVERSE LE SENS.S1" id="ent0002" data-source-line="25"><rect x="22" y="50.5" width="237.923" height="125.656" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="32" y="75.033" fill="#9C3D14" font-size="14" font-weight="700">1</text><text x="39.786" y="75.033" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="51.455" y="75.033" fill="#1F1F1F" font-size="14" textLength="72.345" font-weight="700">En vigueur</text><text x="32" y="92.643" fill="#1F1F1F" font-size="14"> </text><text x="32" y="110.252" fill="#1F1F1F" font-size="14" textLength="161.465">L'obligation est opposable</text><text x="32" y="127.861" fill="#1F1F1F" font-size="14" textLength="71.948">aujourd'hui.</text><text x="32" y="145.471" fill="#1F1F1F" font-size="14"> </text><text x="32" y="163.08" fill="#666" font-size="14" textLength="217.923">art. 12.1 — depuis le 22 sept. 2023</text></g><!--entity S2--><g class="entity" data-qualified-name="TROIS .TATS. ET UNE ERREUR DE DATE INVERSE LE SENS.S2" id="ent0003" data-source-line="26"><rect x="295" y="42" width="297.813" height="143.266" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="305" y="66.533" fill="#9C3D14" font-size="14" font-weight="700">2</text><text x="312.786" y="66.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="324.455" y="66.533" fill="#1F1F1F" font-size="14" textLength="177.604" font-weight="700">Publié, prise d'effet à venir</text><text x="305" y="84.143" fill="#1F1F1F" font-size="14"> </text><text x="305" y="101.752" fill="#1F1F1F" font-size="14" textLength="166.544">Le texte est arrêté ; la date</text><text x="305" y="119.361" fill="#1F1F1F" font-size="14" textLength="151.669">d'application ne l'est pas</text><text x="305" y="136.971" fill="#1F1F1F" font-size="14" textLength="49.813">atteinte.</text><text x="305" y="154.58" fill="#1F1F1F" font-size="14"> </text><text x="305" y="172.189" fill="#666" font-size="14" textLength="277.813">E-23 et AMF · prennent effet le 1er mai 2027</text></g><!--entity S3--><g class="entity" data-qualified-name="TROIS .TATS. ET UNE ERREUR DE DATE INVERSE LE SENS.S3" id="ent0004" data-source-line="27"><rect x="628" y="42" width="223.875" height="143.266" fill="#F7F4EE" style="stroke:#B8B4AC;stroke-width:0.5;" rx="3" ry="3"/><text x="638" y="66.533" fill="#9C3D14" font-size="14" font-weight="700">3</text><text x="645.786" y="66.533" fill="#1F1F1F" font-size="14" textLength="11.669">   </text><text x="657.455" y="66.533" fill="#1F1F1F" font-size="14" textLength="159.694" font-weight="700">Sans date d'effet propre</text><text x="638" y="84.143" fill="#1F1F1F" font-size="14"> </text><text x="638" y="101.752" fill="#1F1F1F" font-size="14" textLength="183.668">Le texte ne crée ni ne modifie</text><text x="638" y="119.361" fill="#1F1F1F" font-size="14" textLength="109.751">aucune exigence.</text><text x="638" y="136.971" fill="#1F1F1F" font-size="14"> </text><text x="638" y="154.58" fill="#666" font-size="14" textLength="203.875">avis 11-348 — les lois existantes</text><text x="638" y="172.189" fill="#666" font-size="14" textLength="74.286">s'appliquent</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="34"><path d="M358.5,248 L358.5,284.703 A3,3 0 0 0 361.5,287.703 L1118.046,287.703 A3,3 0 0 0 1121.046,284.703 L1121.046,255 L1111.046,245 L744,245 L740,185.14 L736,245 L361.5,245 A3,3 0 0 0 358.5,248" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><path d="M1111.046,245 L1111.046,253.5 A1.5,1.5 0 0 0 1112.546,255 L1121.046,255 L1111.046,245" style="stroke:#B8B4AC;stroke-width:0.5;" fill="#FAF8F4"/><text x="364.5" y="263.495" fill="#333" font-size="13" textLength="732.615">CETTE SOUS-SECTION EST REÇUE DU VOL. I, EN [C], et elle recoupe la matière que les ch. 25 à 28 portent à leurs propres</text><text x="364.5" y="279.847" fill="#333" font-size="13" textLength="741.546">régimes. EN CAS D'ÉCART, CE SONT EUX QUI FONT FOI : ils résolvent contre le Vol. II et le Vol. III, à des niveaux supérieurs.</text></g><!--link S1 to S2--><!--link S2 to S3--><?plantuml-src ZLJDRjD04BxdAKRba4kJOYVGKgf88TrAaKe2iLCXjJsixR6puEoQtNMeX92u8Uuy04VA2t37RyAJCEia_I6jolgoExCxt_VDZyqx8Gkk-HmY7h_Bj2fbCb2vql0ehLV3NDqmCvwe3q9caFBSu0rFWYalStkaf1tnEKB0fGbGYvklwz2nqX8rFBrXBmYNPmWV6q3hnGQB98tItQLFwGJrofvqupHUsXtioleixYHUj_7f9Yx6biiilnzXD-qYRY94Ur6Nn_yYUAdxRY58PUyFpjEzjFk_mJlrek2DTLQsmibu643rDUo7mJQm4AOZ1cmoOTC9738ux8SCXgCJDWaO73C8s2ZOMf6vLhvr43k0_LL-UWTHpplOYNe7ExMzHvV9n2GiH5PYgPtlJ9x9uwQASf5nAvG4D1PKKIZ3enpF92_Vgb8dpLafskxk6k9flNfSspPuVjk3Fv-_KOCKfJ10L7mV31Rayn_xdJN-5d03WVSmQt-JzQkIA5QNsr1eOH2I9gOfMgY-mmAbk9Q2OF622kLaSAshdxQwXEUGSqYu9Jr9anT5BkAbM8cGDztLWXlIQYqAQV4keQpbTu00-o-FuFSlOe5IehImf44oF6huEHTEyEvjmVx3WZkRWjrmrPolj1PQ4Uo6Kj8Gw-gIDiBjvoeHgQWh5vTqnWkHeOpl5CKNL2tFQtMwUtNzSgJYARBH8qDiBPergOstPfd8zoLb