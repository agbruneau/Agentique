<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:807px;height:255px;background:#FAF8F5;" width="807px" height="255px" viewBox="0 0 807 255" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="807" height="255" fill="#FAF8F5" style="stroke:none;"/><g class="title" data-source-line="11"><text x="252.276" y="24.533" fill="#8B2E0B" font-size="14" textLength="295.579" font-weight="700" font-family="'DejaVu Sans'">TROIS RÉGIMES, ET UN SEUL JALON DATÉ</text></g><!--entity S1--><g class="entity" data-qualified-name="S1" id="ent0001" data-source-line="13"><rect x="31.994" y="45.609" width="236.385" height="125.656" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="41.994" y="70.143" fill="#000" font-size="14" textLength="93.372" font-weight="700" font-family="'DejaVu Sans'">1  Programmé</text><text x="41.994" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="41.994" y="105.361" fill="#000" font-size="14" textLength="216.385" font-family="'DejaVu Sans'">Une date opposable, portée par un</text><text x="41.994" y="122.971" fill="#000" font-size="14" textLength="138.517" font-family="'DejaVu Sans'">instrument en vigueur.</text><text x="41.994" y="140.58" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="41.994" y="158.189" fill="#000" font-size="14" textLength="112.075" font-style="italic" font-family="'DejaVu Sans'">un seul des jalons</text></g><!--entity S2--><g class="entity" data-qualified-name="S2" id="ent0002" data-source-line="14"><rect x="303.494" y="45.609" width="226.999" height="125.656" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="313.494" y="70.143" fill="#000" font-size="14" textLength="63.027" font-weight="700" font-family="'DejaVu Sans'">2  Projeté</text><text x="313.494" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="313.494" y="105.361" fill="#000" font-size="14" textLength="206.999" font-family="'DejaVu Sans'">Une cible communiquée par celui</text><text x="313.494" y="122.971" fill="#000" font-size="14" textLength="73.158" font-family="'DejaVu Sans'">qui la porte.</text><text x="313.494" y="140.58" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="313.494" y="158.189" fill="#000" font-size="14" textLength="148.668" font-style="italic" font-family="'DejaVu Sans'">ni opposable ni garantie</text></g><!--entity S3--><g class="entity" data-qualified-name="S3" id="ent0003" data-source-line="15"><rect x="565.994" y="45.609" width="202.144" height="125.656" fill="#F5F1EB" style="stroke:#BBB;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="575.994" y="70.143" fill="#000" font-size="14" textLength="82.469" font-weight="700" font-family="'DejaVu Sans'">3  Spéculatif</text><text x="575.994" y="87.752" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="575.994" y="105.361" fill="#000" font-size="14" textLength="164.227" font-family="'DejaVu Sans'">Aucun jalon daté au socle.</text><text x="575.994" y="122.971" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="575.994" y="140.58" fill="#000" font-size="14" font-family="'DejaVu Sans'"> </text><text x="575.994" y="158.189" fill="#000" font-size="14" textLength="182.144" font-style="italic" font-family="'DejaVu Sans'">ne fonde aucune planification</text></g><!--link S1 to S2--><!--link S2 to S3--><g class="legend" data-source-line="20"><rect x="12" y="191.266" width="776.131" height="45.219" fill="#FBF9F5" style="stroke:#BBB;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="210.799" fill="#000" font-size="14" textLength="695.68" font-family="'DejaVu Sans'">UN SEUL EST PROGRAMMÉ. Les autres sont attendus, annoncés ou spéculatifs — et bâtir une feuille d